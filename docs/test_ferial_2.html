"Etc": "Etc"}, "la": {"Africa": "Africa", "America": "America", "Antarctica": "Antarctica", "Arctic": "Arcticus", "Asia": "Asia", "Atlantic": "Atlanticus", "Australia": "Australia", "Europe": "Europa", "Indian": "Indicus", "Pacific": "Pacificus", "Etc": "Etc"}}, "hymn_pools": {"vespers": [{"id": "ave_maris_stella", "title": "Ave Maris Stella", "original_language": "la", "lines": {"la": ["Ave, maris stella,", "Dei Mater alma,", "atque semper Virgo,", "felix caeli porta.", "", "Sumens illud Ave", "Gabrielis ore,", "funda nos in pace,", "mutans Evae nomen.", "", "Solve vincla reis,", "profer lumen caecis,", "mala nostra pelle,", "bona cuncta posce.", "", "Monstra te esse matrem,", "sumat per te preces", "qui pro nobis natus", "tulit esse tuus.", "", "Virgo singularis,", "inter omnes mitis,", "nos culpis solutos", "mites fac et castos.", "", "Vitam praesta puram,", "iter para tutum,", "ut videntes Iesum", "semper collaetemur.", "", "Sit laus Deo Patri,", "summo Christo decus,", "Spiritui Sancto,", "tribus honor unus. Amen."], "es": ["Salve, estrella del mar,", "Madre nutricia de Dios,", "y siempre Virgen,", "dichosa puerta del cielo.", "", "Tomando aquel Ave", "de labios de Gabriel,", "afiánzanos en paz,", "cambiando el nombre de Eva.", "", "Suelta las cadenas de los culpables,", "trae la luz a los ciegos,", "aleja nuestros males,", "pide para nosotros todos los bienes.", "", "Muéstrate ser madre,", "reciba por ti nuestras súplicas", "quien, nacido por nosotros,", "quiso ser hijo tuyo.", "", "Virgen sin igual,", "mansa entre todas,", "líbranos de nuestras culpas", "y haznos mansos y castos.", "", "Danos una vida pura,", "prepáranos un camino seguro,", "para que, viendo a Jesús,", "nos gocemos siempre juntos.", "", "Sea la alabanza a Dios Padre,", "la gloria al altísimo Cristo,", "al Espíritu Santo,", "un mismo honor a los tres. Amén."]}}, {"id": "vexilla_regis_prodeunt", "title": "Vexilla Regis Prodeunt", "original_language": "la", "lines": {"la": ["Vexilla Regis prodeunt:", "fulget Crucis mysterium,", "qua vita mortem pertulit,", "et morte vitam protulit.", "", "Quae vulnerata lanceae", "mucrone diro, criminum", "ut nos lavaret sordibus,", "manavit unda et sanguine.", "", "Impleta sunt quae concinit", "David fideli carmine,", "dicendo nationibus:", "regnavit a ligno Deus.", "", "O Crux ave, spes unica,", "hoc Passionis tempore", "piis adauge gratiam,", "reisque dele crimina.", "", "Te, fons salutis Trinitas,", "collaudet omnis spiritus:", "quibus Crucis victoriam", "largiris, adde praemium. Amen."], "es": ["Los estandartes del Rey avanzan:", "resplandece el misterio de la Cruz,", "por la cual la Vida sufrió la muerte,", "y con la muerte produjo la vida.", "", "La cual, herida por la punta", "cruel de la lanza, para lavarnos", "de la mancha de nuestros pecados,", "manó agua y sangre.", "", "Se cumplió lo que cantó", "David en su fiel poema,", "diciendo a las naciones:", "Dios reinó desde el madero.", "", "Salve, oh Cruz, única esperanza,", "en este tiempo de la Pasión", "aumenta la gracia a los piadosos,", "y borra los pecados de los culpables.", "", "A ti, Trinidad, fuente de salvación,", "te alabe todo espíritu:", "a quienes la victoria de la Cruz", "concedes, añade la recompensa. Amén."]}}, {"id": "conditor_alme_siderum", "title": "Conditor Alme Siderum", "original_language": "la", "lines": {"la": ["Conditor alme siderum,", "aeterna lux credentium,", "Christe, redemptor omnium,", "exaudi preces supplicum.", "", "Qui condolens interitu", "mortis perire saeculum,", "salvasti mundum languidum,", "donans reis remedium.", "", "Vergente mundi vespere,", "uti sponsus de thalamo,", "egressus honestissima", "Virginis matris clausula.", "", "Cuius forti potentiae", "genu curvantur omnia;", "caelestia, terrestria", "nutu fatentur subdita.", "", "Te, Sancte, fide quaesumus,", "venture iudex saeculi,", "conserva nos in tempore", "hostis a telo perfidi.", "", "Sit, Christe, rex piissime,", "tibi Patrique gloria", "cum Spiritu Paraclito,", "in sempiterna saecula. Amen."], "es": ["Creador bondadoso de los astros,", "luz eterna de los creyentes,", "Cristo, redentor de todos,", "escucha las súplicas de los que te imploran.", "", "Tú que, apiadado de que el mundo", "pereciera en la ruina de la muerte,", "salvaste al mundo enfermo,", "dando remedio a los culpables.", "", "Cuando declinaba la tarde del mundo,", "como esposo que sale del tálamo,", "saliste del honestísimo", "seno de tu Madre Virgen.", "", "Ante cuyo fuerte poder", "se doblan todas las rodillas;", "los seres celestes y terrestres", "confiesan someterse a tu mandato.", "", "A ti, Santo, con fe te suplicamos,", "que has de venir como juez del mundo,", "consérvanos a tiempo", "libres del dardo del enemigo pérfido.", "", "Sea, oh Cristo, rey piadosísimo,", "gloria a ti y al Padre", "con el Espíritu Paráclito,", "por los siglos sempiternos. Amén."]}}, {"id": "pange_lingua_gloriosi", "title": "Pange Lingua Gloriosi Corporis Mysterium", "original_language": "la", "lines": {"la": ["Pange, lingua, gloriosi", "Corporis mysterium,", "Sanguinisque pretiosi,", "quem in mundi pretium", "fructus ventris generosi", "Rex effudit gentium.", "", "Nobis datus, nobis natus", "ex intacta Virgine,", "et in mundo conversatus,", "sparso verbi semine,", "sui moras incolatus", "miro clausit ordine.", "", "In supremae nocte cenae", "recumbens cum fratribus,", "observata lege plene", "cibis in legalibus,", "cibum turbae duodenae", "se dat suis manibus.", "", "Verbum caro, panem verum", "verbo carnem efficit:", "fitque sanguis Christi merum,", "et si sensus deficit,", "ad firmandum cor sincerum", "sola fides sufficit.", "", "Tantum ergo Sacramentum", "veneremur cernui:", "et antiquum documentum", "novo cedat ritui:", "praestet fides supplementum", "sensuum defectui.", "", "Genitori, Genitoque", "laus et iubilatio,", "salus, honor, virtus quoque", "sit et benedictio:", "procedenti ab utroque", "compar sit laudatio. Amen."], "es": ["Canta, lengua, el misterio", "del glorioso Cuerpo,", "y de la preciosa Sangre,", "que como precio del mundo,", "fruto de un vientre generoso,", "derramó el Rey de las naciones.", "", "Dado a nosotros, nacido para nosotros", "de una Virgen intacta,", "y habiendo vivido en el mundo", "sembrando la semilla de la Palabra,", "concluyó el tiempo de su estancia", "con un orden admirable.", "", "En la noche de la última cena,", "reclinado con sus hermanos,", "habiendo cumplido plenamente la ley", "en cuanto a los alimentos rituales,", "se da como alimento a los doce", "con sus propias manos.", "", "El Verbo hecho carne, con su palabra", "convierte en carne el pan verdadero:", "y el vino se hace sangre de Cristo,", "y si los sentidos no alcanzan,", "para afirmar el corazón sincero", "basta sólo la fe.", "", "Un Sacramento tan grande", "veneremos, pues, inclinados:", "y ceda el antiguo precepto", "al nuevo rito:", "que la fe supla", "lo que falta a los sentidos.", "", "Al Engendrador y al Engendrado", "sea la alabanza y el júbilo,", "la salud, el honor y también el poder", "y la bendición:", "y al que procede de ambos", "sea dada igual alabanza. Amén."]}}, {"id": "deus_tuorum_militum", "title": "Deus Tuorum Militum", "original_language": "la", "lines": {"la": ["Deus tuorum militum", "sors, et corona, praemium,", "laudes canentes Martyris", "absolve nexu criminis.", "", "Hic nempe mundi gaudia", "et blandimenta noxia", "caduca rite deputans,", "pervenit ad caelestia.", "", "Poenas cucurrit fortiter", "et sustulit viriliter,", "fundensque pro te sanguinem,", "aeterna dona possidet.", "", "Ob hoc precatu supplici", "te poscimus, piissime;", "in hoc triumpho Martyris", "dimitte noxam servulis.", "", "Laus et perennis gloria", "Deo Patri et Filio,", "Sancto simul Paraclito,", "in sempiterna saecula. Amen."], "es": ["Dios, suerte, corona y premio", "de tus soldados,", "a nosotros, que cantamos las alabanzas del Mártir,", "líbranos del lazo del pecado.", "", "Éste, en verdad, teniendo por caducos", "los gozos del mundo", "y sus dañinas seducciones,", "llegó a los bienes celestiales.", "", "Corrió fuertemente hacia las penas", "y las soportó con valentía,", "y derramando su sangre por ti,", "posee ahora los dones eternos.", "", "Por esto, con súplica humilde", "te lo pedimos, piadosísimo;", "en este triunfo del Mártir,", "perdona la culpa a tus siervos.", "", "Alabanza y gloria perpetua", "a Dios Padre y al Hijo,", "juntamente al Espíritu Santo Paráclito,", "por los siglos sempiternos. Amén."]}}, {"id": "o_lux_beata_trinitas", "title": "O Lux Beata Trinitas", "original_language": "la", "lines": {"la": ["O lux beata Trinitas,", "et principalis Unitas,", "iam sol recedit igneus:", "infunde lumen cordibus.", "", "Te mane laudum carmine,", "te deprecemur vespere:", "te nostra supplex gloria", "per cuncta laudet saecula.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Oh luz bienaventurada, Trinidad,", "y Unidad primera,", "ya el sol ígneo se retira:", "infunde tu luz en los corazones.", "", "A ti te alabemos por la mañana con cánticos,", "a ti te supliquemos al atardecer:", "que nuestra súplica te glorifique", "por todos los siglos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y para siempre. Amén."]}}, {"id": "exsultet_caelum_laudibus", "title": "Exsultet Caelum Laudibus", "original_language": "la", "lines": {"la": ["Exsultet caelum laudibus,", "resultet terra gaudiis,", "Apostolorum gloriam", "sacra canunt sollemnia.", "", "Vos, saecli iusti iudices", "et vera mundi lumina,", "votis precamur cordium:", "audite preces supplicum.", "", "Qui caelum verbo clauditis", "serasque eius solvitis,", "nos a peccatis omnibus", "solvite iussu, quaesumus.", "", "Quorum praecepto subditur", "salus et languor omnium,", "sanate mentes languidas,", "augete nos virtutibus.", "", "Ut, cum iudex advenerit", "Christus in fine saeculi,", "nos sempiterni gaudii", "faciat esse compotes.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "nunc et per omne saeculum. Amen."], "es": ["Exulte el cielo con alabanzas,", "resuene la tierra con gozos,", "la sagrada solemnidad canta", "la gloria de los Apóstoles.", "", "A vosotros, justos jueces del mundo", "y verdaderas luces del orbe,", "os rogamos con los votos de nuestros corazones:", "escuchad las preces de los suplicantes.", "", "Vosotros que con la palabra cerráis el cielo", "y desatáis sus cerrojos,", "libradnos de todos los pecados,", "os lo rogamos, por vuestro mandato.", "", "A cuyo mandato está sometida", "la salud y la enfermedad de todos,", "sanad nuestras mentes enfermas,", "aumentadnos en virtudes.", "", "Para que, cuando venga como juez", "Cristo al final de los siglos,", "nos haga partícipes", "del gozo sempiterno.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por todos los siglos. Amén."]}}, {"id": "iste_confessor", "title": "Iste Confessor", "original_language": "la", "lines": {"la": ["Iste confessor Domini, colentes", "quem pie laudant populi per orbem,", "hac die laetus meruit supremos", "laudis honores.", "", "Qui pius, prudens, humilis, pudicus,", "sobriam duxit sine labe vitam,", "donec humanos animavit aurae", "spiritus artus.", "", "Cuius ob praestans meritum, frequenter,", "aegra quae passim iacuere membra,", "viribus morbi domitis, saluti", "restituuntur.", "", "Noster hinc illi chorus obsequentem", "concinit laudem celebresque palmas,", "ut piis eius meritis iuvemur", "omne per aevum.", "", "Sit salus illi, decus atque virtus,", "qui, supra caeli residens cacumen,", "totius mundi seriem gubernat,", "trinus et unus. Amen."], "es": ["Este confesor del Señor, a quien", "los pueblos veneran piadosamente por todo el orbe,", "mereció alegre en este día los sumos", "honores de alabanza.", "", "El cual, piadoso, prudente, humilde y casto,", "llevó una vida sobria sin mancha,", "mientras el aliento de vida animó", "sus miembros humanos.", "", "Por cuyo excelente mérito, con frecuencia,", "los miembros enfermos que yacían por doquier,", "vencidas las fuerzas de la enfermedad, a la salud", "son restituidos.", "", "Por esto, nuestro coro le canta", "una alabanza obsequiosa y célebres palmas,", "para que por sus piadosos méritos seamos ayudados", "por toda la eternidad.", "", "Sea para él la salud, el honor y el poder,", "que, sentado sobre la cumbre del cielo,", "gobierna el curso de todo el mundo,", "trino y uno. Amén."]}}, {"id": "lucis_creator_optime", "title": "Lucis Creator Optime", "original_language": "la", "lines": {"la": ["Lucis Creator optime,", "lucem dierum proferens,", "primordiis lucis novae", "mundi parans originem;", "", "Qui mane iunctum vesperi", "diem vocari praecipis:", "taetrum chaos illabitur,", "audi preces cum fletibus.", "", "Ne mens gravata crimine", "vitae sit exsul munere,", "dum nil perenne cogitat", "seseque culpis illigat.", "", "Caeleste pulset ostium,", "vitale tollat praemium;", "vitemus omne noxium,", "purgemus omne pessimum.", "", "Praesta, Pater piissime,", "Patrique compar Unice,", "cum Spiritu Paraclito", "regnans per omne saeculum. Amen."], "es": ["Óptimo Creador de la luz,", "que produces la luz de los días,", "y en los primeros albores de la nueva luz", "preparaste el origen del mundo;", "", "Tú que mandas que se llame día", "a la mañana unida con la tarde:", "el horrible caos se desliza sobre nosotros,", "escucha nuestras preces con llanto.", "", "Que nuestra mente, cargada de pecado,", "no quede excluida del don de la vida,", "mientras no piensa en nada eterno", "y se enreda a sí misma en culpas.", "", "Que llame a la puerta celestial,", "que alcance el premio de la vida;", "evitemos todo lo dañino,", "purguemos todo lo pésimo.", "", "Concédelo, Padre piadosísimo,", "y también tú, Unigénito igual al Padre,", "que reinas con el Espíritu Paráclito", "por todos los siglos. Amén."]}}], "lauds": [{"id": "iste_confessor", "title": "Iste Confessor", "original_language": "la", "lines": {"la": ["Iste confessor Domini, colentes", "quem pie laudant populi per orbem,", "hac die laetus meruit supremos", "laudis honores.", "", "Qui pius, prudens, humilis, pudicus,", "sobriam duxit sine labe vitam,", "donec humanos animavit aurae", "spiritus artus.", "", "Cuius ob praestans meritum, frequenter,", "aegra quae passim iacuere membra,", "viribus morbi domitis, saluti", "restituuntur.", "", "Noster hinc illi chorus obsequentem", "concinit laudem celebresque palmas,", "ut piis eius meritis iuvemur", "omne per aevum.", "", "Sit salus illi, decus atque virtus,", "qui, supra caeli residens cacumen,", "totius mundi seriem gubernat,", "trinus et unus. Amen."], "es": ["Este confesor del Señor, a quien", "los pueblos veneran piadosamente por todo el orbe,", "mereció alegre en este día los sumos", "honores de alabanza.", "", "El cual, piadoso, prudente, humilde y casto,", "llevó una vida sobria sin mancha,", "mientras el aliento de vida animó", "sus miembros humanos.", "", "Por cuyo excelente mérito, con frecuencia,", "los miembros enfermos que yacían por doquier,", "vencidas las fuerzas de la enfermedad, a la salud", "son restituidos.", "", "Por esto, nuestro coro le canta", "una alabanza obsequiosa y célebres palmas,", "para que por sus piadosos méritos seamos ayudados", "por toda la eternidad.", "", "Sea para él la salud, el honor y el poder,", "que, sentado sobre la cumbre del cielo,", "gobierna el curso de todo el mundo,", "trino y uno. Amén."]}}, {"id": "ut_queant_laxis", "title": "Ut Queant Laxis", "original_language": "la", "lines": {"la": ["Ut queant laxis", "resonare fibris", "mira gestorum", "famuli tuorum,", "solve polluti", "labii reatum,", "Sancte Ioannes.", "", "Nuntius celso veniens Olympo,", "te patri magnum fore nasciturum,", "nomen, et vitae seriem gerendae", "ordine promit.", "", "Ille promissi dubius superni,", "perdidit promptae modulos loquelae:", "sed reformasti genitus peremptae", "organa vocis.", "", "Ventris obstruso positus cubili", "senseras Regem thalamo manentem:", "hinc parens nati meritis uterque", "abdita pandit.", "", "Sit decus Patri, genitaeque Proli,", "et tibi compar utriusque semper", "Spiritus alme, Deus unus, omni", "tempore saecli. Amen."], "es": ["Para que puedan", "resonar con voces desatadas", "las maravillas de las hazañas", "de tus siervos,", "libra de culpa", "nuestros labios manchados,", "san Juan.", "", "Un mensajero, viniendo del alto cielo,", "anuncia a tu padre que ibas a nacer grande,", "y revela en orden tu nombre", "y el curso de la vida que llevarías.", "", "Él, dudando de la promesa celestial,", "perdió el uso pronto de la palabra:", "pero tú, ya nacido, restauraste", "los órganos de su voz perdida.", "", "Colocado en el cerrado lecho del vientre,", "sentiste al Rey que permanecía en su tálamo:", "de ahí que ambos padres, por los méritos del hijo,", "revelan lo oculto.", "", "Sea la gloria al Padre, y al Hijo engendrado,", "y a ti, igual a ambos siempre,", "Espíritu bondadoso, Dios uno, por todo", "el tiempo del siglo. Amén."]}}, {"id": "veni_creator_spiritus", "title": "Veni Creator Spiritus", "original_language": "la", "lines": {"la": ["Veni, Creator Spiritus,", "mentes tuorum visita,", "imple superna gratia", "quae tu creasti pectora.", "", "Qui diceris Paraclitus,", "altissimi donum Dei,", "fons vivus, ignis, caritas,", "et spiritalis unctio.", "", "Tu septiformis munere,", "digitus paternae dexterae,", "tu rite promissum Patris,", "sermone ditans guttura.", "", "Accende lumen sensibus,", "infunde amorem cordibus,", "infirma nostri corporis", "virtute firmans perpeti.", "", "Hostem repellas longius,", "pacemque dones protinus;", "ductore sic te praevio", "vitemus omne noxium.", "", "Per te sciamus da Patrem,", "noscamus atque Filium;", "teque utriusque Spiritum", "credamus omni tempore.", "", "Deo Patri sit gloria,", "et Filio, qui a mortuis", "surrexit, ac Paraclito,", "in saeculorum saecula. Amen."], "es": ["Ven, Espíritu Creador,", "visita las mentes de los tuyos,", "llena de gracia celestial", "los pechos que Tú creaste.", "", "Tú, que eres llamado Paráclito,", "don del Dios altísimo,", "fuente viva, fuego, caridad,", "y unción espiritual.", "", "Tú, séptuple en tus dones,", "dedo de la diestra del Padre,", "tú, la promesa fielmente hecha por el Padre,", "que enriqueces las gargantas con la palabra.", "", "Enciende la luz en nuestros sentidos,", "infunde el amor en nuestros corazones,", "y las debilidades de nuestro cuerpo", "fortalécelas con virtud perpetua.", "", "Rechaza lejos al enemigo,", "y danos pronto la paz;", "así, contigo como guía,", "evitemos todo mal.", "", "Concédenos conocer por ti al Padre,", "y también conocer al Hijo;", "y a ti, Espíritu de ambos,", "creamos en todo tiempo.", "", "Gloria sea a Dios Padre,", "y al Hijo, que de entre los muertos", "resucitó, y al Paráclito,", "por los siglos de los siglos. Amén."]}}, {"id": "aeterne_rerum_conditor", "title": "Aeterne Rerum Conditor", "original_language": "la", "lines": {"la": ["Aeterne rerum Conditor,", "noctem diemque qui regis,", "et temporum das tempora,", "ut alleves fastidium;", "", "Praeco diei iam sonat,", "noctis profundae excubitor,", "nocturna lux viantibus", "a nocte noctem segregans.", "", "Hoc excitatus Lucifer", "solvit polum caligine;", "hoc omnis erronum cohors", "vias nocendi deserit.", "", "Iesu, labentes respice,", "et nos videndo corrige;", "si respicis, lapsus cadunt,", "fletuque culpa solvitur.", "", "Tu, lux, refulge sensibus,", "somnumque mentis discute;", "te nostra vox primum sonet,", "et vota solvamus tibi.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "nunc et per omne saeculum. Amen."], "es": ["Eterno Creador de todas las cosas,", "que riges la noche y el día,", "y das los tiempos a los tiempos,", "para aliviar nuestro hastío;", "", "Ya suena el heraldo del día,", "centinela de la profunda noche,", "luz nocturna para los caminantes,", "que separa la noche de la noche.", "", "Al oírlo, el Lucero", "libra al cielo de su oscuridad;", "al oírlo, toda hueste de malhechores", "abandona sus caminos de hacer daño.", "", "Jesús, mira a los que caen,", "y corrígenos mirándonos;", "si tú miras, las caídas cesan,", "y la culpa se disuelve con el llanto.", "", "Tú, luz, resplandece en nuestros sentidos,", "y disipa el sueño de la mente;", "que nuestra voz te cante primero a ti,", "y cumplamos para ti nuestros votos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por todos los siglos. Amén."]}}, {"id": "ecce_iam_noctis", "title": "Ecce Jam Noctis", "original_language": "la", "lines": {"la": ["Ecce iam noctis tenuatur umbra,", "lucis aurora rutilans coruscat;", "nisibus totis rogitemus omnes", "Cunctipotentem,", "", "Ut Deus, nostri miseratus, omnem", "pellat languorem, tribuat salutem,", "donet et nobis pietate patris", "regna polorum.", "", "Praestet hoc nobis Deitas beata", "Patris ac Nati, pariterque Sancti", "Spiritus, cuius resonat per omnem", "gloria mundum. Amen."], "es": ["He aquí que ya se adelgaza la sombra de la noche,", "y brilla resplandeciente la aurora de la luz;", "roguemos todos con todo empeño", "al Todopoderoso,", "", "Para que Dios, apiadado de nosotros,", "aleje toda enfermedad y conceda la salud,", "y nos dé, con piedad de padre,", "los reinos celestiales.", "", "Concédanos esto la bienaventurada Deidad", "del Padre y del Hijo, y también del Santo", "Espíritu, cuya gloria resuena", "por todo el mundo. Amén."]}}], "compline": [{"id": "te_lucis_ante_terminum", "title": "Te Lucis Ante Terminum", "original_language": "la", "lines": {"la": ["Te lucis ante terminum,", "rerum creator, poscimus,", "ut pro tua clementia", "sis praesul et custodia.", "", "Procul recedant somnia", "et noctium phantasmata;", "hostemque nostrum comprime,", "ne polluantur corpora.", "", "Praesta, Pater omnipotens,", "per Iesum Christum Dominum,", "qui tecum in perpetuum", "regnat cum Sancto Spiritu. Amen."], "es": ["Antes de que acabe la luz,", "te pedimos, Creador de todas las cosas,", "que por tu clemencia", "seas nuestro guardián y custodia.", "", "Aléjense lejos los sueños", "y los fantasmas de la noche;", "reprime a nuestro enemigo,", "para que nuestros cuerpos no se manchen.", "", "Concédenos esto, Padre omnipotente,", "por Jesucristo el Señor,", "que contigo por siempre", "reina con el Espíritu Santo. Amén."]}}, {"id": "christe_qui_lux_es_et_dies", "title": "Christe, Qui Lux Es Et Dies", "original_language": "la", "lines": {"la": ["Christe, qui lux es et dies,", "noctis tenebras detegis,", "lucisque lumen crederis,", "lumen beatum praedicans.", "", "Precamur, sancte Domine,", "defende nos in hac nocte,", "sit nobis in te requies,", "quietam noctem tribue.", "", "Ne gravis somnus irruat,", "nec hostis nos surripiat,", "nec caro illi consentiens,", "nos tibi reos statuat.", "", "Oculi somnum capiant,", "cor semper ad te vigilet,", "dextera tua protegat", "famulos qui te diligunt.", "", "Defensor noster, aspice,", "insidiantes reprime,", "guberna tuos famulos,", "quos sanguine mercatus es.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Cristo, que eres luz y día,", "que descubres las tinieblas de la noche,", "y eres proclamado la luz de la luz,", "anunciando la luz bienaventurada.", "", "Te suplicamos, santo Señor,", "defiéndenos en esta noche,", "sea en ti nuestro descanso,", "concédenos una noche tranquila.", "", "Que no nos asalte un sueño pesado,", "ni el enemigo nos sorprenda,", "ni la carne, consintiendo con él,", "nos declare culpables ante ti.", "", "Que los ojos tomen el sueño,", "pero el corazón vele siempre hacia ti,", "que tu diestra proteja", "a los siervos que te aman.", "", "Defensor nuestro, mira,", "reprime a los que nos acechan,", "gobierna a tus siervos,", "a quienes compraste con tu sangre.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por siempre. Amén."]}}, {"id": "o_lux_beata_trinitas", "title": "O Lux Beata Trinitas", "original_language": "la", "lines": {"la": ["O lux beata Trinitas,", "et principalis Unitas,", "iam sol recedit igneus:", "infunde lumen cordibus.", "", "Te mane laudum carmine,", "te deprecemur vespere:", "te nostra supplex gloria", "per cuncta laudet saecula.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Oh luz bienaventurada, Trinidad,", "y Unidad primera,", "ya el sol ígneo se retira:", "infunde tu luz en los corazones.", "", "A ti te alabemos por la mañana con cánticos,", "a ti te supliquemos al atardecer:", "que nuestra súplica te glorifique", "por todos los siglos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y para siempre. Amén."]}}]}, "dates": {"2026-08-18": {"date_human": {"en": "Tuesday, August 18, 2026", "es": "Martes, 18 de agosto de 2026", "la": "Feria III, die 18 Augusti, anno 2026"}, "day_description": {"en": "Tuesday in the 20<sup>th</sup> Week in Ordinary Time (Psalter week 4)", "es": "Martes de la 20.<sup>a</sup> semana del Tiempo Ordinario (semana 4 del salterio)", "la": "Feria III infra hebdomadam XX per annum (hebdomada psalterii IV)"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "V. Deus, in adiutorium meum intende.\nR. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in saecula saeculorum. Amen. Alleluia.", "es": "V. Dios mío, ven en mi auxilio.\nR. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": null}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 100", "content": {"la": [["1", "Psalmus ipsi David. Misericordiam et judicium cantabo tibi, Domine; psallam,"], ["2", "et intelligam in via immaculata : quando venies ad me? Perambulabam in innocentia cordis mei, in medio domus meae."], ["3", "Non proponebam ante oculos meos rem injustam; facientes praevaricationes odivi, non adhaesit mihi"], ["4", "cor pravum; declinantem a me malignum non cognoscebam."], ["5", "Detrahentem secreto proximo suo, hunc persequebar, superbo oculo, et insatiabili corde, cum hoc non edebam."], ["6", "Oculi mei ad fideles terrae, ut sedeant mecum; ambulans in via immaculata, hic mihi ministrabat."], ["7", "Non habitabit in medio domus meae qui facit superbiam; qui loquitur iniqua non direxit in conspectu oculorum meorum."], ["8", "In matutino interficiebam omnes peccatores terrae, ut disperderem de civitate Domini omnes operantes iniquitatem."]], "es": [["1", "Cantaré, Señor, las alabanzas de tu misericordia y de tu justicia."], ["2", "Las cantaré al son de instrumentos músicos y estudiaré el camino de la perfección. ¿Y cuándo vendrás a mí para fortalecerme? He vivido con inocencia de corazón en medio de mi familia."], ["3", "Jamás he puesto la mira en cosa injusta; he aborrecido a los transgresores de la ley."], ["4", "Conmigo no han tenido cabida hombres de corazón depravado; ni he querido conocer al que con su proceder maligno se desviaba de mí."], ["5", "Al que calumniaba secretamente a su prójimo, a éste lo he perseguido. No admitía en mi mesa a hombres de ojos altaneros y de corazón insaciable."], ["6", "Dirigí mi vista en busca de los hombres fieles del país, para que habiten conmigo; los que procedían irreprensiblemente, ésos eran mis ministros."], ["7", "No morará en mi casa el que obra con soberbia o dolo; ni hallará gracia en mis ojos aquel que habla iniquidades."], ["8", "Al levantarme por la mañana mi primer cuidado era exterminar a todos los pecadores del país, para extirpar de la ciudad del Señor a todos los facinerosos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": null, "es": null}}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": null}}, {"kind": "psalm", "label": "canticle", "ref": "Dan 3:26,27,29,34-41", "content": {"la": [["26", "Benedictus es, Domine Deus patrum nostrorum, et laudabile, et gloriosum nomen tuum in saecula :"], ["27", "quia justus es in omnibus, quae fecisti nobis, et universa opera tua vera, et viae tuae rectae, et omnia judicia tua vera."], ["29", "Peccavimus enim, et inique egimus recedentes a te, et deliquimus in omnibus :"], ["34", "Ne, quaesumus, tradas nos in perpetuum propter nomen tuum, et ne dissipes testamentum tuum :"], ["35", "neque auferas misericordiam tuam a nobis, propter Abraham, dilectum tuum, et Isaac, servum tuum, et Israel, sanctum tuum,"], ["36", "quibus locutus es pollicens quod multiplicares semen eorum sicut stellas caeli, et sicut arenam quae est in littore maris;"], ["37", "quia, Domine, imminuti sumus plus quam omnes gentes, sumusque humiles in universa terra hodie propter peccata nostra."], ["38", "Et non est in tempore hoc princeps, et dux, et propheta, neque holocaustum, neque sacrificium, neque oblatio, neque incensum, neque locus primitiarum coram te,"], ["39", "ut possimus invenire misericordiam tuam, sed in animo contrito, et spiritu humilitatis suscipiamur."], ["40", "Sicut in holocausto arietum, et taurorum, et sicut in millibus agnorum pinguium, sic fiat sacrificium nostrum in conspectu tuo hodie, ut placeat tibi, quoniam non est confusio confidentibus in te."], ["41", "Et nunc sequimur te in toto corde; et timemus te, et quaerimus faciem tuam."]], "es": [["26", "Bendito eres , oh Señor Dios de nuestros pa- dres , y digno es de alabanza tu nombre, y glorioso por todos los siglos."], ["29", "Puesto que nosotros hemos pecado y obrado ini- cuamente, apostatando de tí , y en todo hemos faltado;"], ["34", "Rogámoste, Señor, que por amor de tu nom- bre, no nos abandones para siempre, ni destruyas tu alianza con Israel :"], ["35", "ni apartes de nosotros tu misericordia , por amor de Abraham tu amado, y de Isaac siervo tuyo, y de Israel tu santo :"], ["36", "á los cuales hablaste, prometiéndoles que niul- ToM. Xí. 21 â¢238 LA profecía de DANIEL. tiplicarias su linage como las estrellas del cielo, y co- mo la arena que está en la playa del mar."], ["37", "Porque nosotros, oh Señor, hemos venido á ser la mas pequeña de todas las naciones, y estamos hoy dia abatidos en todo el mundo por causa de nuestros pecados."], ["38", "Y no tenemos en este tiempo ni príncipe, ni caudillo, ni profeta , ni holocausto, ni sacrificio, ni ofrenda, ni incienso, ni lugar donde presentártelas primicias,"], ["39", "á fin de poder alcanzar tu misericordia. Pero recíbenos tú, oh Señor, contritos de corazón, y con espíritu humillado."], ["40", "Como recibías el holocausto de los carneros y toros , y los sacrificios de millares de gordos corderos : así sea hoy agradable nuestro sacrificio en presencia tuya ; puesto que jamás quedan confundidos aquelloíí que en tí confian."], ["41", "y ahora te seguimos con todo el corazón, y fe tememos ó respetamos , y buscamos tu rostro."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": null, "es": null}}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": null}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 143:1-10", "content": {"la": [["1", "Psalmus David. Adversus Goliath. Benedictus Dominus Deus meus, qui docet manus meas ad praelium, et digitos meos ad bellum."], ["2", "Misericordia mea et refugium meum, susceptor meus et liberator meus; protector meus, et in ipso speravi; qui subdit populum meum sub me."], ["3", "Domine, quid est homo, quia innotuisti ei? aut filius hominis, quia reputas eum?"], ["4", "Homo vanitati similis factus est; dies ejus sicut umbra praetereunt."], ["5", "Domine, inclina caelos tuos, et descende; tange montes, et fumigabunt."], ["6", "Fulgura coruscationem, et dissipabis eos; emitte sagittas tuas, et conturbabis eos."], ["7", "Emitte manum tuam de alto : eripe me, et libera me de aquis multis, de manu filiorum alienorum :"], ["8", "quorum os locutum est vanitatem, et dextera eorum dextera iniquitatis."], ["9", "Deus, canticum novum cantabo tibi; in psalterio decachordo psallam tibi."], ["10", "Qui das salutem regibus, qui redemisti David servum tuum de gladio maligno,"]], "es": [["1", "Bendito sea el Señor Dios mío, que adiestra mis manos para la pelea y mis dedos para manejar las armas."], ["2", "El es para conmigo la misma misericordia y el asilo mío, mi amparo y mi libertador; el protector mío, en quien tengo mi esperanza; el que somete mi pueblo a la autoridad mía."], ["3", "¡Oh Señor! ¿Qué es el hombre para que te des a conocer a él?; ¿o el hijo del hombre, que así lo aprecias?"], ["4", "El hombre por el pecado ha venido a ser nada; sus días pasan como la sombra."], ["5", "Señor, inclina esos tus cielos, y desciende a socorrernos; toca los montes, y se desharán en humo."], ["6", "Vibra rayos, y disiparás mis enemigos; arroja tus saetas, y los llenarás de turbación."], ["7", "Alarga desde lo alto tu mano, y arrebátame del abismo de las aguas de la tribulación; líbrame de caer en poder de los extranjeros,"], ["8", "cuya boca no habla sino vanidad o mentira, y cuyas manos están llenas de iniquidad."], ["9", "¡Oh Dios mío!, yo te cantaré un cántico nuevo con un salterio; te cantaré himnos de alabanza."], ["10", "Señor, tú que das la salud o felicidad a los reyes, que libraste a David, siervo tuyo, de la espada sangrienta,"]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": null, "es": null}}, {"kind": "psalm", "label": "reading", "ref": "isa 55:1", "content": {"la": [["1", "Omnes sitientes, venite ad aquas; et qui non habetis argentum, properate, emite, et comedite : venite, emite absque argento et absque ulla commutatione vinum et lac."]], "es": [["1", "Sedientos , venid todos á las aguas ^: y vosotros"]]}}, {"kind": "lines", "label": "responsory", "content": {"la": null, "es": ["$℣. $Señor, escucha mi voz, he esperado en tus palabras.", "$℟. $Señor, escucha mi voz, he esperado en tus palabras.", "$℣. $Me adelanto a la aurora pidiendo auxilio.", "$℟. $He esperado en tus palabras.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Señor, escucha mi voz, he esperado en tus palabras."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": null}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel , porque ha \\isitado, y redimid® á su pueblo ; ^"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo :"], ["70", "según lo tenia anunciado por boca de sus santos Profetas , que han florecido en todos los siglos pa- sados ;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen :"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ' ,"], ["74", "de que, libertados de las manos de nuestros ene- migos , le sirvamos sin temor ,"], ["75", "con verdadera santidad y justicia , ante su aca- tamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño ! tú serás llamado el Profeta del Altísimo ; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados ,"], ["78", "por las entrañas misericordiosas de nuestro Dios , que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ' ,"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte ; para enderezar nuestros pasos por el camino de la paz ^."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": null, "es": null}}, {"kind": "lines", "label": "intercessions", "content": {"la": null, "es": ["Dios nos otorga el gozo de poder alabarlo en este comienzo del día, reavivando con ello nuestra esperanza. Invoquémosle, pues, diciendo:", "- Dios y Padre de nuestro Salvador Jesucristo, te damos gracias porque, por mediación de tu Hijo, _nos has dado la sabiduría y la inmortalidad._ _Escúchanos, Señor, por la gloria de tu nombre._", "- Concédenos un corazón humilde, _para que seamos sumisos unos a otros con respeto cristiano._ _Escúchanos, Señor, por la gloria de tu nombre._", "- Derrama tu Espíritu en nosotros, tus siervos, _para que nuestra caridad fraterna no sea una farsa._ _Escúchanos, Señor, por la gloria de tu nombre._", "- Tú que has dispuesto que el hombre dominara el mundo con su esfuerzo, _haz que nuestro trabajo te glorifique y santifique a nuestros hermanos._ _Escúchanos, Señor, por la gloria de tu nombre._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in caelis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in caelo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Deus, qui diligentibus te bona invisibilia praeparasti, infunde cordibus nostris tui amoris affectum, ut, te in omnibus et super omnia diligentes, promissiones tuas, quae omne desiderium superant, consequamur.", "es": "Aumenta, Señor, nuestra fe, para que la alabanza que sale de nuestros labios vaya siempre acompañada de frutos de vida eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "V. Benedicamus Domino.\nR. Deo gratias.", "es": "V. Bendigamos al Señor.\nR. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "V. Deus, in adiutorium meum intende.\nR. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in saecula saeculorum. Amen. Alleluia.", "es": "V. Dios mío, ven en mi auxilio.\nR. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": null}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 136:1-6", "content": {"la": [["1", "Psalmus David, Jeremiae. Super flumina Babylonis illic sedimus et flevimus, cum recordaremur Sion."], ["2", "In salicibus in medio ejus suspendimus organa nostra;"], ["3", "quia illic interrogaverunt nos, qui captivos duxerunt nos, verba cantionum; et qui abduxerunt nos : Hymnum cantate nobis de canticis Sion."], ["4", "Quomodo cantabimus canticum Domini in terra aliena?"], ["5", "Si oblitus fuero tui, Jerusalem, oblivioni detur dextera mea."], ["6", "Adhaereat lingua mea faucibus meis, si non meminero tui; si non proposuero Jerusalem in principio laetitiae meae."]], "es": [["1", "En las márgenes de los ríos del país de Babilonia, allí nos sentábamos, y nos poníamos a llorar, acordándonos de ti, ¡oh Sión!"], ["2", "Allí colgamos de los sauces nuestros músicos instrumentos."], ["3", "Los mismos que nos habían llevado esclavos, nos pedían que les cantásemos nuestros cánticos; los que nos habían arrebatado de nuestra patria, decían: Cantadnos algún himno de los que cantabais en Sión."], ["4", "¿Cómo hemos de cantar los cánticos del Señor, les respondíamos, en tierra extraña?"], ["5", "¡Ah! Si me olvidare yo de ti, oh Jerusalén , entregada sea al olvido, seca quede mi mano diestra."], ["6", "Pegada quede al paladar la lengua mía, si no me acordare de ti, oh Sión santa; si no me propusiere a Jerusalén por el primer objeto de mi alegría."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": null, "es": null}}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": null}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 137", "content": {"la": [["1", "Ipsi David. Confitebor tibi, Domine, in toto corde meo, quoniam audisti verba oris mei. In conspectu angelorum psallam tibi,"], ["2", "adorabo ad templum sanctum tuum, et confitebor nomini tuo super misericordia tua et veritate tua, quoniam magnificasti super omne nomen sanctum tuum."], ["3", "In quacumque die invocavero te, exaudi me; multiplicabis in anima mea virtutem."], ["4", "Confiteantur tibi, Domine, omnes reges terrae, quia audierunt omnia verba oris tui;"], ["5", "et cantent in viis Domini, quoniam magna est gloria Domini;"], ["6", "quoniam excelsus Dominus, et humilia respicit, et alta a longe cognoscit."], ["7", "Si ambulavero in medio tribulationis, vivificabis me; et super iram inimicorum meorum extendisti manum tuam, et salvum me fecit dextera tua."], ["8", "Dominus retribuet pro me. Domine, misericordia tua in saeculum; opera manuum tuarum ne despicias."]], "es": [["1", "Te alabaré, Señor, con todo mi corazón; porque oíste las peticiones de mi boca. En presencia de los ángeles te cantaré himnos."], ["2", "Te adoraré en tu santo templo, y tributaré alabanzas a tu Nombre, por la misericordia y verdad de sus promesas, con que has engrandecido sobre todas las cosas tu Nombre santo."], ["3", "En cualquier día que te invocare, óyeme benigno; tú aumentarás la fortaleza de mi al-ma."], ["4", "Alábente, ¡oh Señor!, todos los reyes de la tierra, ya que han oído todas las palabras de tu boca."], ["5", "Y celebren las disposiciones del Señor, visto que la gloria del Señor es tan grande."], ["6", "Porque siendo el Señor, como es altísimo, pone los ojos en las criaturas humildes y mira como lejos de sí a las altivas."], ["7", "Si me hallare, oh Señor, en medio de la tribulación, tú me animarás, porque extendiste tu mano contra el furor de mis enemigos, y me salvó tu poderosa diestra."], ["8", "El Señor tomará mi defensa. Eterna es, ¡oh Señor!, tu misericordia, no deseches las obras de tus manos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": null, "es": null}}, {"kind": "psalm", "label": "canticle", "ref": "Rev 4:11;5:9,10,12", "content": {"la": [["4:11", "Dignus es Domine Deus noster accipere gloriam, et honorem, et virtutem : quia tu creasti omnia, et propter voluntatem tuam erant, et creata sunt."], ["5:9", "et cantabant canticum novum, dicentes : Dignus es, Domine, accipere librum, et aperire signacula ejus : quoniam occisus es, et redemisti nos Deo in sanguine tuo ex omni tribu, et lingua, et populo, et natione :"], ["5:10", "et fecisti nos Deo nostro regnum, et sacerdotes : et regnabimus super terram."], ["5:12", "dicentium voce magna : Dignus est Agnus, qui occisus est, accipere virtutem, et divinitatem, et sapientiam, et fortitudinem, et honorem, et gloriam, et benedictionem."]], "es": [["5:9", "y cantaban un cántico nuevo ^ , diciendo : Digno eres, Señor, de recibir el libro, y de abrir sus sellos, porque tú has sido entregado á la muerte , y con tu sangre nos has rescatado para Dios, de todas las tri- bus, y lenguas, y pueblos, y naciones :"], ["5:10", "con que nos hiciste para nuestro Dios reyes y sacerdotes*; y reinaremos sobre la (ierra hasta que después reinemos contigo en el cielo."], ["5:12", "los cuales decian en alta voz : Digno es el Cor- dero que ha sido sacrificado, de recibir el poder, y la divinidad, y la sabiduría, y la fortaleza, y el honor, y la gloria , y la bendición '."]]}}, {"kind": "psalm", "label": "reading", "ref": "col 3:16", "content": {"la": [["16", "Verbum Christi habitet in vobis abundanter, in omni sapientia, docentes, et commonentes vosmetipsos, psalmis, hymnis, et canticis spiritualibus, in gratia cantantes in cordibus vestris Deo."]], "es": [["16", "La palabra de Christo ó su doctrina en abun- dancia tenga su morada entre vosotros, con toda sa- biduría , enseñándoos y animándoos unos á otros , con salmos , con himnos y cánticos espirituales , cantando de corazón con gracia ó edificación las alabanzas á Dios."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": null, "es": ["$℣. $Me saciarás de gozo  en tu presencia, Señor.", "$℟. $Me saciarás de gozo  en tu presencia, Señor.", "$℣. $De alegría perpetua a tu derecha.", "$℟. $En tu presencia, Señor.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Me saciarás de gozo  en tu presencia, Señor."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": null}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo : Mi alma glorifica al Se- ñor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su es- clava ^ : por tanto ya desde ahora me llamarán bien- aventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso , cuyo nombre es santo ;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos , y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos , y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo ;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": null, "es": null}}, {"kind": "lines", "label": "intercessions", "content": {"la": null, "es": ["  "Auditam fac mihi mane misericordiam tuam, quia in te speravi. Notam fac mihi viam in qua ambulem, quia ad te levavi animam meam."], ["9", "Eripe me de inimicis meis, Domine; ad te confugi."], ["10", "Doce me facere voluntatem tuam, quia Deus meus es tu. Spiritus tuus bonus deducet me in terram rectam."], ["11", "Propter nomen tuum, Domine, vivificabis me; in aequitate tua, educes de tribulatione animam meam;"]], "es": [["1", "¡Oh Señor!, escucha benigno mi oración; presta oídos a mi súplica, según la verdad de tus promesas; óyeme por tu misericordia."], ["2", "Mas no quieres entrar en juicio con tu siervo; porque ningún viviente puede aparecer justo en tu presencia."], ["3", "Ya ves cómo el enemigo ha perseguido mi alma; abatida tiene hasta el suelo la vida mía. Me ha confinado en lugares tenebrosos, como a los que murieron hace ya un siglo."], ["4", "Mi espíritu padece terribles angustias; está mi corazón en continua zozobra."], ["5", "Mas me acordé luego de los días antiguos; me puse a meditar todas tus obras; ponderaba los efectos maravillosos de tu poder."], ["6", "Levanté mis manos hacia ti como tierra falta de agua, así está por ti suspirando el alma mía."], ["7", "Oyeme luego, ¡oh Señor!, mi espíritu ha desfallecido. No retires de mí tu rostro; haz que no haya de contarme ya entre los muertos."], ["8", "Hazme sentir cuanto antes tu misericordia, pues en ti he puesto mi esperanza. Muéstrame el camino que debo seguir, ya que hacia ti he levantado mi corazón."], ["9", "Líbrame, ¡oh Señor!, de mis enemigos; a ti me acojo."], ["10", "Enséñame a cumplir tu voluntad, pues tú eres mi Dios. Entonces tu espíritu es infinitamente bueno, me conducirá a la tierra de la rectitud y santidad."], ["11", "Por amor de tu Nombre, ¡oh Señor!, me darás la vida, según la justicia de tus promesas. A mi alma la sacarás de la tribulación,"]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Ne intres in iudicium cum servo tuo, Domine.", "es": "No entres en <script>
const DATA = JSON.parse(document.getElementById('dayData').textContent);
const LANG_NAMES = { la: "Latin / Latina", es: "Español" };
const leftSel = document.getElementById('leftLang');
const rightSel = document.getElementById('rightLang');
const hourSel = document.getElementById('hourSelect');
const tzSel = document.getElementById('tzSelect');
const dateSel = document.getElementById('dateSelect');
const tzNote = document.getElementById('tzNote');

// Which hymn id is currently picked per Hour context. Its language is always
// that hymn's own original_language (see renderHymnChoiceRows) - the dropdown
// only ever chooses WHICH hymn, never a language for it to be sung in.
let hymnChoiceByHour = {};

// DATA.hymn_pools starts as whatever was baked in when this page was
// generated (so double-clicking the file still works with no server). If
// this page is being served over HTTP (see .claude/launch.json's
// "docs-server" config), it re-fetches content/proper_texts/hymns.json live
// on every load - so editing that file and refreshing the browser picks up
// the change with no need to re-run render_day.py. Under file:// this fetch
// is normally blocked by the browser and silently falls back to the baked-in
// copy, which is fine.
function poolsFromRawHymns(raw) {
  const pools = {};
  for (const ctx of ['vespers', 'lauds', 'compline']) {
    pools[ctx] = [];
    for (const [hid, h] of Object.entries(raw)) {
      if (hid === '_note') continue;
      if ((h.applicability || []).includes(ctx)) {
        const lines = {};
        for (const lang of DATA.languages) lines[lang] = (h.lines && h.lines[lang]) || [];
        pools[ctx].push({ id: hid, title: h.title, original_language: h.original_language, lines });
      }
    }
  }
  return pools;
}
fetch('../content/proper_texts/hymns.json')
  .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(raw => { DATA.hymn_pools = poolsFromRawHymns(raw); render(); })
  .catch(() => { /* no server, or fetch blocked under file:// - keep the baked-in pool */ });

// Same idea, but for a whole day's Hours: if dev_server.py is running (see
// .claude/launch.json), /api/day?date=... reruns the actual Python
// construction logic fresh from disk - covering edits to the psalter tables,
// calendar cache, proper_texts, and content/sanctorale/, not just hymns.json.
// Plain `python -m http.server` (or file://) doesn't have that route, so this
// 404s harmlessly and the baked-in snapshot for that date stays in use.
for (const iso of DATA.date_order) {
  fetch('/api/day?date=' + encodeURIComponent(iso))
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(fresh => { DATA.dates[iso] = fresh; render(); })
    .catch(() => { /* dev_server.py not running - keep the baked-in day */ });
}

// This page is a static snapshot: DATA.dates holds a pre-built window of days
// (generated around DATA.generated_date) rather than just one. There's still
// no live backend to build a day outside that window, but picking a timezone
// now actually jumps to the right day within it instead of just warning.
function populateDateOptions() {
  const left = leftSel.value;
  const prev = dateSel.value;
  dateSel.innerHTML = '';
  for (const iso of DATA.date_order) {
    const o = document.createElement('option');
    o.value = iso;
    const dh = DATA.dates[iso].date_human;
    o.textContent = (dh && (dh[left] || dh.en)) || iso;
    dateSel.appendChild(o);
  }
  if (prev && DATA.dates[prev]) dateSel.value = prev;
}

const COMMON_TIMEZONES = [
  'UTC', 'Europe/Rome', 'Europe/Madrid', 'Europe/London', 'Europe/Paris',
  'America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles',
  'America/Mexico_City', 'America/Bogota', 'America/Sao_Paulo', 'America/Argentina/Buenos_Aires',
  'Asia/Manila', 'Asia/Tokyo', 'Asia/Kolkata', 'Australia/Sydney', 'Pacific/Auckland',
];
let tzList = COMMON_TIMEZONES;
try {
  if (typeof Intl.supportedValuesOf === 'function') {
    tzList = Intl.supportedValuesOf('timeZone');
  }
} catch (e) { /* fall back to the curated list above */ }

const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
if (!tzList.includes(browserTz)) tzList = [browserTz, ...tzList];

// Only the region prefix (e.g. "America", "Europe") has an established Latin/
// Spanish name across the whole IANA list - the city/location part after the
// slash is left as-is (see TZ_REGION_NAMES in i18n.py for why).
function populateTimezoneOptions() {
  const left = leftSel.value;
  const regionNames = (DATA.tz_region_names && DATA.tz_region_names[left]) || {};
  const prev = tzSel.value;
  tzSel.innerHTML = '';
  for (const tz of tzList) {
    const o = document.createElement('option');
    o.value = tz;
    const slash = tz.indexOf('/');
    if (slash === -1) {
      o.textContent = tz.replace(/_/g, ' ');
    } else {
      const region = tz.slice(0, slash);
      const rest = tz.slice(slash + 1).replace(/_/g, ' ');
      o.textContent = (regionNames[region] || region) + ' / ' + rest;
    }
    tzSel.appendChild(o);
  }
  tzSel.value = prev && tzList.includes(prev) ? prev : browserTz;
}

function isoDateInTimeZone(tz) {
  // en-CA locale formats as YYYY-MM-DD, convenient for direct comparison with DATA.dates keys
  return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' })
    .format(new Date());
}

// Picks "today" in the given timezone if that date was actually pre-built;
// otherwise falls back to whichever generated date is closest to it, since
// this is still a static page with a fixed, finite window of days baked in.
function closestAvailableDate(isoTarget) {
  if (DATA.dates[isoTarget]) return isoTarget;
  const targetMs = new Date(isoTarget).getTime();
  let best = DATA.date_order[0];
  let bestDiff = Infinity;
  for (const iso of DATA.date_order) {
    const diff = Math.abs(new Date(iso).getTime() - targetMs);
    if (diff < bestDiff) { bestDiff = diff; best = iso; }
  }
  return best;
}

const TZNOTE_TEXT = {
  en: (today, tz, first, last) => `&#9888; Today is <strong>${today}</strong> in ${tz}, which is outside the ` +
    `range of dates generated for this demo (<strong>${first}</strong> to <strong>${last}</strong>). ` +
    `Showing the closest available date instead.`,
  es: (today, tz, first, last) => `&#9888; Hoy es <strong>${today}</strong> en ${tz}, fecha fuera del ` +
    `intervalo generado para esta demo (<strong>${first}</strong> a <strong>${last}</strong>). ` +
    `Se muestra la fecha disponible más cercana.`,
  la: (today, tz, first, last) => `&#9888; Hodie est <strong>${today}</strong> in ${tz}, dies extra ` +
    `intervallum ad hanc demonstrationem generatum (<strong>${first}</strong> usque ad <strong>${last}</strong>). ` +
    `Dies proxima disponibilis ostenditur.`,
};

function updateTzNote() {
  const left = leftSel.value;
  const tz = tzSel.value;
  const todayInTz = isoDateInTimeZone(tz);
  if (DATA.dates[todayInTz]) {
    tzNote.style.display = 'none';
  } else {
    tzNote.style.display = '';
    const first = DATA.date_order[0], last = DATA.date_order[DATA.date_order.length - 1];
    const build = TZNOTE_TEXT[left] || TZNOTE_TEXT.en;
    tzNote.innerHTML = build(todayInTz, tz.replace(/_/g, ' '), first, last);
  }
}

function onTzChange() {
  updateTzNote();
  dateSel.value = closestAvailableDate(isoDateInTimeZone(tzSel.value));
  render();
}
tzSel.addEventListener('change', onTzChange);

for (const code of DATA.languages) {
  for (const sel of [leftSel, rightSel]) {
    const o = document.createElement('option');
    o.value = code; o.textContent = LANG_NAMES[code] || code;
    sel.appendChild(o);
  }
}
leftSel.value = DATA.languages[0];
rightSel.value = DATA.languages[1] || DATA.languages[0];

function populateHourOptions() {
  const left = leftSel.value;
  const prev = hourSel.value;
  const labels = (DATA.hour_labels && DATA.hour_labels[left]) || {};
  const comingSoon = (DATA.chrome_labels[left] || DATA.chrome_labels.en).coming_soon;
  hourSel.innerHTML = '';
  for (const h of DATA.hour_order) {
    const o = document.createElement('option');
    o.value = h;
    o.textContent = labels[h] || h;
    if (!DATA.implemented_hours.includes(h)) {
      o.disabled = true;
      o.textContent += ' ' + comingSoon;
    }
    hourSel.appendChild(o);
  }
  hourSel.value = DATA.hour_order.includes(prev) ? prev : DATA.default_hour;
}

// Everything on the page - not just liturgical content - follows whichever
// language is on the left ("main"): control labels, the Hour names, the Date
// picker, the date heading. The right side is either "the vernacular" (when
// the main language is Latin) or just "a translation" (when it's already a
// vernacular language) - never a second thing to pick a hymn to sing in.
function updateChromeLabels() {
  const left = leftSel.value;
  const cl = DATA.chrome_labels[left] || DATA.chrome_labels.en;
  document.getElementById('tzLabel').textContent = cl.timezone;
  document.getElementById('dateLabel').textContent = cl.date;
  document.getElementById('hourLabel').textContent = cl.hour;
  document.getElementById('leftLabel').textContent = cl.main;
  document.getElementById('rightLabel').textContent = (left === 'la') ? cl.vernacular : cl.translation;
}

function applyChrome() {
  updateChromeLabels();
  populateHourOptions();
  populateDateOptions();
  populateTimezoneOptions();
  updateTzNote();
  render();
}
leftSel.addEventListener('change', applyChrome);

// First run: builds every dropdown (so dateSel actually has options), then
// picks "today" in the browser's own timezone now that there's something to
// select - applyChrome() alone would leave dateSel on its first option.
applyChrome();
dateSel.value = closestAvailableDate(isoDateInTimeZone(browserTz));
render();

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderUnitContent(unit, lang) {
  const val = unit.content ? unit.content[lang] : null;
  if (val === null || val === undefined) return '<em>[not yet sourced]</em>';
  return esc(val).replace(/\n/g, '<br>');
}

// Psalms and canticles are stored as [verseNumber, text] pairs; hymns and the
// Our Father are stored as plain ordered line arrays. Both get aligned row by
// row (verse-by-verse / line-by-line) rather than as two whole stacked blocks,
// since the source data already keys them that way - a block-level pairing
// was only ever an approximation of that finer alignment.
function renderAlignedRows(unit, left, right, single) {
  const isPsalm = (unit.kind === 'psalm');
  const missingLabel = isPsalm ? '[missing]' : '[not yet sourced]';
  const leftRaw = unit.content ? unit.content[left] : null;
  const rightRaw = single ? leftRaw : (unit.content ? unit.content[right] : null);
  const leftEmpty = !leftRaw || leftRaw.length === 0;
  const rightEmpty = !rightRaw || rightRaw.length === 0;

  if (leftEmpty && rightEmpty) {
    return single
      ? `<tr><td class="single"><em>${missingLabel}</em></td></tr>`
      : `<tr><td class="col-left"><em>${missingLabel}</em></td><td class="col-right"><em>${missingLabel}</em></td></tr>`;
  }

  if (!single) {
    var rows = `<tr><td class="col-left"><div class="unit-label">${left.toUpperCase()}</div></td>` +
                `<td class="col-right"><div class="unit-label">${right.toUpperCase()}</div></td></tr>`;
  } else {
    var rows = '';
  }

  if (isPsalm) {
    const leftMap = new Map((leftRaw || []).map(([n, t]) => [String(n), t]));
    const rightMap = new Map((rightRaw || []).map(([n, t]) => [String(n), t]));
    const nums = Array.from(new Set([...leftMap.keys(), ...rightMap.keys()]))
      .sort((a, b) => parseInt(a, 10) - parseInt(b, 10));
    for (const n of nums) {
      const lt = leftMap.has(n) ? `<span class="vn">${esc(n)}</span> ${esc(leftMap.get(n))}` : '<em>&mdash;</em>';
      if (single) {
        rows += `<tr><td class="single">${lt}</td></tr>`;
      } else {
        const rt = rightMap.has(n) ? `<span class="vn">${esc(n)}</span> ${esc(rightMap.get(n))}` : '<em>&mdash;</em>';
        rows += `<tr><td class="col-left">${lt}</td><td class="col-right">${rt}</td></tr>`;
      }
    }
    return rows;
  }

  // 'lines' kind: aligned by position, not by any shared numbering.
  const maxLen = Math.max(leftRaw ? leftRaw.length : 0, rightRaw ? rightRaw.length : 0);
  for (let i = 0; i < maxLen; i++) {
    const lt = (leftRaw && leftRaw[i] !== undefined) ? esc(leftRaw[i]) : '<em>&mdash;</em>';
    if (single) {
      rows += `<tr><td class="single hymn-line">${lt}</td></tr>`;
    } else {
      const rt = (rightRaw && rightRaw[i] !== undefined) ? esc(rightRaw[i]) : '<em>&mdash;</em>';
      rows += `<tr><td class="col-left hymn-line">${lt}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    }
  }
  return rows;
}

// The hymn block picks WHICH HYMN to sing from that Hour's pool via its own
// dropdown, independent of leftLang/rightLang - these are Latin compositions,
// so the dropdown only ever offers a hymn's own original_language (there's no
// such thing as "this Latin hymn, but sung in Spanish"; a translation is for
// following along, not a second thing to pick). Its DEFAULT ordering favors
// hymns whose original language matches leftLang. rightLang always drives a
// translation of that same hymn, same as everywhere else on the page.
function renderHymnChoiceRows(unit, left, right) {
  const ctx = unit.hour;
  const pool = (DATA.hymn_pools && DATA.hymn_pools[ctx]) || [];
  const opts = pool
    .filter(h => h.lines[h.original_language] && h.lines[h.original_language].length)
    .map(h => ({ id: h.id, lang: h.original_language, title: h.title }));
  if (opts.length === 0) {
    return `<tr><td colspan="2"><em>[not yet sourced]</em></td></tr>`;
  }
  opts.sort((a, b) => (a.lang === left ? 0 : 1) - (b.lang === left ? 0 : 1));

  let choiceId = hymnChoiceByHour[ctx];
  if (!choiceId || !opts.some(o => o.id === choiceId)) {
    choiceId = opts[0].id;
    hymnChoiceByHour[ctx] = choiceId;
  }

  let selectHtml = `<select class="hymn-select" data-hour="${esc(ctx)}">`;
  for (const o of opts) {
    const picked = (o.id === choiceId) ? ' selected' : '';
    selectHtml += `<option value="${esc(o.id)}"${picked}>` +
      `${esc(o.title)} (${esc(LANG_NAMES[o.lang] || o.lang)})</option>`;
  }
  selectHtml += `</select>`;
  let rows = `<tr><td colspan="2" class="hymn-picker">${selectHtml}</td></tr>`;

  const hymn = pool.find(h => h.id === choiceId);
  const sungLines = hymn.lines[hymn.original_language] || [];
  const translatedLines = hymn.lines[right] || [];
  const single = (hymn.original_language === right);

  if (single) {
    for (const line of sungLines) {
      rows += `<tr><td class="single hymn-line">${esc(line)}</td></tr>`;
    }
  } else if (translatedLines.length === 0) {
    sungLines.forEach((line, i) => {
      const rt = (i === 0) ? '<em>[not yet sourced]</em>' : '';
      rows += `<tr><td class="col-left hymn-line">${esc(line)}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    });
  } else {
    const maxLen = Math.max(sungLines.length, translatedLines.length);
    for (let i = 0; i < maxLen; i++) {
      const lt = sungLines[i] !== undefined ? esc(sungLines[i]) : '';
      const rt = translatedLines[i] !== undefined ? esc(translatedLines[i]) : '';
      rows += `<tr><td class="col-left hymn-line">${lt}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    }
  }
  return rows;
}

function onHymnSelectChange(e) {
  const sel = e.target;
  hymnChoiceByHour[sel.dataset.hour] = sel.value;
  render();
}

function render() {
  const dayData = DATA.dates[dateSel.value];
  const left = leftSel.value, right = rightSel.value;
  const hour = hourSel.value;
  const single = (left === right);

  // The heading leads with what's actually being celebrated (a feast/solemnity
  // name, or the full ferial description) - never the bare weekday label alone,
  // since "Feria V" on a major feast day would misleadingly read as "just an
  // ordinary Thursday." The raw calendar date is secondary, shown underneath.
  document.getElementById('dateHeading').innerHTML = dayData.day_description[left] || dayData.day_description.en;
  document.getElementById('metaLine').textContent = (dayData.date_human[left] || dayData.date_human.en);

  const units = dayData.hours[hour] || [];
  const labels = DATA.unit_labels[left] || DATA.unit_labels.en;
  const table = document.getElementById('mainTable');
  let html = '';
  for (const unit of units) {
    let labelText = labels[unit.label] || unit.label;
    if (unit.repeated) labelText += ' ' + (labels.repeated || '');
    if (unit.ref) labelText += ` (${esc(unit.ref)})`;
    html += `<tr><th colspan="2">${esc(labelText)}</th></tr>`;
    if (unit.label === 'psalmody_gap') {
      html += `<tr><td colspan="2"><em>${esc(labels.psalmody_gap_note || labels.missing)}</em></td></tr>`;
    } else if (unit.kind === 'psalm' || unit.kind === 'lines') {
      html += renderAlignedRows(unit, left, right, single);
    } else if (unit.kind === 'hymn_choice') {
      html += renderHymnChoiceRows(unit, left, right);
    } else if (single) {
      html += `<tr><td class="single">${renderUnitContent(unit, left)}</td></tr>`;
    } else {
      html += `<tr><td class="col-left"><div class="unit-label">${left.toUpperCase()}</div>${renderUnitContent(unit, left)}</td>` +
              `<td class="col-right"><div class="unit-label">${right.toUpperCase()}</div>${renderUnitContent(unit, right)}</td></tr>`;
    }
  }
  table.innerHTML = html;
  table.querySelectorAll('.hymn-select').forEach(sel => sel.addEventListener('change', onHymnSelectChange));
}

leftSel.addEventListener('change', render);
rightSel.addEventListener('change', render);
hourSel.addEventListener('change', render);
dateSel.addEventListener('change', render);
render();
</script>
</body></html>
