s grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_Oh Llave de David y Cetro de la casa de Israel, que abres y nadie puede cerrar, cierras y nadie puede abrir, ven y libra a los cautivos que viven en tinieblas y en sombra de muerte._", "la": "O Clavis David, et sceptrum domus Israel; qui áperis, et nemo claudit; claudis, et nemo áperit: veni, et educ vinctum de domo cárceris, sedéntem in ténebris, et umbra mortis."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christum redemptórem, fratres caríssimi, exorémus, qui venit ad salvándos hómines, eíque fidénter dicámus:", "– Veni, Dómine Iesu.", "Christe Dómine, qui per suscéptæ mystérium carnis notam fecísti mundo glóriam tuæ divinitátis,", "vivífica nos advéntu tuo.", "– Veni, Dómine Iesu.", "Tu, qui suscepísti infirmitátem nostram,", "concéde nobis misericórdiam tuam.", "– Veni, Dómine Iesu.", "Qui, primo véniens húmilis, redemísti mundum a crímine,", "secúndo advéniens, iustífica nos ab omni reátu.", "– Veni, Dómine Iesu.", "Tu, qui vivis et ómnia regis,", "in bonitáte tua fac nos accédere ad ætérnam hereditátem.", "– Veni, Dómine Iesu.", "Qui sedes ad déxteram Patris,", "lúmine vultus tui ánimas defunctórum lætífica.", "– Veni, Dómine Iesu."], "es": ["Oremos, hermanos, a Cristo, el Señor, que viene a salvar a todos los hombres y digámosle confiadamente:", "- Señor Jesucristo, que por el misterio de la encarnación manifestaste al mundo la gloria de tu divinidad, _vivifica al mundo con tu venida._ _Ven, Señor, Jesús._", "- Tú que participaste de nuestra debilidad, _concédenos tu misericordia._ _Ven, Señor, Jesús._", "- Tú que viniste humildemente para salvar al mundo de sus pecados, _cuando vuelvas de nuevo con gloria y majestad, absuélvenos de todas las culpas._ _Ven, Señor, Jesús._", "- Tú que lo gobiernas todo con tu poder, _ayúdanos, por tu bondad, a alcanzar la herencia eterna._ _Ven, Señor, Jesús._", "- Tú que estás sentado a la derecha del Padre, _alegra con la visión de tu rostro a nuestros hermanos difuntos._ _Ven, Señor, Jesús._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Grátiam tuam, quǽsumus, Dómine, méntibus nostris infúnde, ut, qui, Angelo nuntiánte, Christi Fílii tui incarnatiónem cognóvimus, per passiónem eius et crucem ad resurrectiónis glóriam perducámur. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Derrama, Señor, tu gracia sobre nosotros, que, por el anuncio del ángel, hemos conocido la encarnación de tu Hijo, para que lleguemos, por su pasión y su cruz, a la gloria de la resurrección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Alis suis obumbrabit tibi; non timebis a timore nocturno.", "es": "Con sus alas te cubrirá; no temerás el terror de la noche."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 90", "content": {"la": [["1", "Laus cantici David. Qui habitat in adjutorio Altissimi, in protectione Dei caeli commorabitur."], ["2", "Dicet Domino : Susceptor meus es tu et refugium meum; Deus meus, sperabo in eum."], ["3", "Quoniam ipse liberavit me de laqueo venantium, et a verbo aspero."], ["4", "Scapulis suis obumbrabit tibi, et sub pennis ejus sperabis."], ["5", "Scuto circumdabit te veritas ejus : non timebis a timore nocturno;"], ["6", "a sagitta volante in die, a negotio perambulante in tenebris, ab incursu, et daemonio meridiano."], ["7", "Cadent a latere tuo mille, et decem millia a dextris tuis; ad te autem non appropinquabit."], ["8", "Verumtamen oculis tuis considerabis et retributionem peccatorum videbis."], ["9", "Quoniam tu es, Domine, spes mea; Altissimum posuisti refugium tuum."], ["10", "Non accedet ad te malum, et flagellum non appropinquabit tabernaculo tuo."], ["11", "Quoniam angelis suis mandavit de te, ut custodiant te in omnibus viis tuis."], ["12", "In manibus portabunt te, ne forte offendas ad lapidem pedem tuum."], ["13", "Super aspidem et basiliscum ambulabis, et conculcabis leonem et draconem."], ["14", "Quoniam in me speravit, liberabo eum; protegam eum, quoniam cognovit nomen meum."], ["15", "Clamabit ad me, et ego exaudiam eum; cum ipso sum in tribulatione; eripiam eum, et glorificabo eum."], ["16", "Longitudine dierum replebo eum, et ostendam illi salutare meum."]], "es": [["1", "El que se acoge al asilo del Altísimo, descansará siempre bajo la protección del Dios del cielo."], ["2", "El dirá al Señor: Tú eres mi amparo y refugio; el Dios mío en quien esperaré."], ["3", "Porque él me ha librado del lazo de los cazadores y de terribles adversidades."], ["4", "Con sus alas te hará sombra, y debajo de sus plumas estarás confiado."], ["5", "Su verdad te cercará como escudo; no temerás terrores nocturnos,"], ["6", "ni la saeta disparada de día, ni al enemigo que anda en tinieblas, ni los asaltos del demonio en medio del día."], ["7", "Caerán muertos a tu siniestra mil y diez mil a tu diestra; mas nada te pasará a ti."], ["8", "Tú lo estarás contemplando con tus propios ojos, y verás el pago que se da a los pecadores, y exclamarás:"], ["9", "¡Oh! y cómo eres tú, ¡oh Señor, mi esperanza! Tú ¡oh justo! has escogido al Altísimo para asilo tuyo."], ["10", "No llegará a ti el mal, ni el azote se acercará a tu morada."], ["11", "Porque él mandó a sus ángeles que cuidasen de ti; los cuales te guardarán en cuantos pasos dieres."], ["12", "Te llevarán en las palmas de sus manos; no sea que tropiece tu pie en alguna piedra."], ["13", "Andarás sobre áspides y víboras, y hollarás los leones y dragones."], ["14", "Ya que ha esperado en mí, yo le libraré; yo lo protegeré, pues ha conocido o adorado mi Nombre."], ["15", "Clamará a mí, y lo oiré benigno. Con él estoy en la tribulación; lo pondré a salvo, y lo llenaré de gloria."], ["16", "Lo sacaré con una vida muy larga, y le haré ver el salvador que enviaré."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Alis suis obumbrabit tibi; non timebis a timore nocturno.", "es": "Con sus alas te cubrirá; no temerás el terror de la noche."}}, {"kind": "psalm", "label": "reading", "ref": "Rev 22:4-5", "content": {"la": [["4", "Et videbunt faciem ejus : et nomen ejus in frontibus eorum."], ["5", "Et nox ultra non erit : et non egebunt lumine lucernae, neque lumine solis, quoniam Dominus Deus illuminabit illos, et regnabunt in saecula saeculorum."]], "es": [["4", "Y verán su cara, y tendrán el nombre de él sobre sus frentes."], ["5", "Y allí no habrá jamás noche; ni necesitarán luz"]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Vox nostra te, Domine, humiliter deprecetur, ut, dominicæ resurrectionis hac die mysterio celebrato, in pace tua securi a malis omnibus quiescamus, et in tua resurgamus laude gaudentes. Per Christum Dominum nostrum.", "es": "Humildemente te pedimos, Señor, que después de haber celebrado en este día los misterios de la resurrección de tu Hijo, sin temor alguno, descansemos en tu paz y mañana nos levantemos alegres para cantar nuevamente tus alabanzas. Por Jesucristo nuestro Señor."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-12-21": {"date_human": {"en": "Monday, December 21, 2026", "es": "Lunes, 21 de diciembre de 2026", "la": "Feria II, die 21 Decembris, anno 2026"}, "day_description": {"en": "December 21, Advent &mdash; Sancti Petri Canisii, presbyteri et Ecclesiæ doctoris", "es": "21 de diciembre, Adviento &mdash; Sancti Petri Canisii, presbyteri et Ecclesiæ doctoris", "la": "Feria propria diei 21 Decembris, Adventus &mdash; Sancti Petri Canisii, presbyteri et Ecclesiæ doctoris"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El Señor viene del Líbano, su brillo es como el día._", "la": "Deus a Líbano véniet, et splendor eius sicut lumen erit."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 118:145-152", "content": {"la": [["145", "Clamavi in toto corde meo : exaudi me, Domine; justificationes tuas requiram."], ["146", "Clamavi ad te; salvum me fac, ut custodiam mandata tua."], ["147", "Praeveni in maturitate, et clamavi : quia in verba tua supersperavi."], ["148", "Praevenerunt oculi mei ad te diluculo, ut meditarer eloquia tua."], ["149", "Vocem meam audi secundum misericordiam tuam, Domine, et secundum judicium tuum vivifica me."], ["150", "Appropinquaverunt persequentes me iniquitati, a lege autem tua longe facti sunt."], ["151", "Prope es tu, Domine, et omnes viae tuae veritas."], ["152", "Initio cognovi de testimoniis tuis, quia in aeternum fundasti ea. RES"]], "es": [["145", "Clamé de todo mi corazón: Escúchame, ¡oh Señor!, y haz que yo vaya en pos de tus justísimos preceptos."], ["146", "A ti clamé diciendo: Sálvame de la tentación, para que yo observe tus mandamientos."], ["147", "Me anticipé y clamé muy de mañana, porque esperé firmemente tus palabras."], ["148", "Antes de amanecer se dirigieron hacia ti mis ojos para meditar tu ley."], ["149", "Escucha, Señor mi voz según tu misericordia, y vivifícame conforme lo has prometido."], ["150", "Se arrimaron a la iniquidad mis perseguidores, y se alejaron de tu ley."], ["151", "Cerca estás de mí, ¡oh Señor!, y todos tus caminos son la verdad misma."], ["152", "Desde el principio conocí que has establecido tus preceptos para que subsistan eternamente."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El Señor viene del Líbano, su brillo es como el día._", "la": "Deus a Líbano véniet, et splendor eius sicut lumen erit."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Cielos, dejad caer el rocío; que las nubes lluevan al Justo, y la tierra germine al Salvador._", "la": "Roráte, cæli, désuper, et nubes plúant Iustum; aperiátur terra et gérminet Salvatórem."}}, {"kind": "psalm", "label": "canticle", "ref": "wis 9:1-6,9-11", "content": {"la": [["1", "Deus patrum meorum, et Domine misericordiae, qui fecisti omnia verbo tuo,"], ["2", "et sapientia tua constituisti hominem, ut dominaretur creaturae quae a te facta est,"], ["3", "ut disponat orbem terrarum in aequitate et justitia, et in directione cordis judicium judicet :"], ["4", "da mihi sedium tuarum assistricem sapientiam, et noli me reprobare a pueris tuis,"], ["5", "quoniam servus tuus sum ego, et filius ancillae tuae; homo infirmus, et exigui temporis, et minor ad intellectum judicii et legum."], ["6", "Nam et si quis erit consummatus inter filios hominum, si ab illo abfuerit sapientia tua, in nihilum computabitur."], ["9", "et tecum sapientia tua, quae novit opera tua, quae et affuit tunc cum orbem terrarum faceres, et sciebat quid esset placitum oculis tuis, et quid directum in praeceptis tuis."], ["10", "Mitte illam de caelis sanctis tuis, et a sede magnitudinis tuae, ut mecum sit et mecum laboret, ut sciam quid acceptum sit apud te :"], ["11", "scit enim illa omnia, et intelligit, et deducet me in operibus meis sobrie, et custodiet me in sua potentia."]], "es": [["1", "Oh Dios de mis padres '. \\ Señor de misericordia, que hieiste todas las cosas por medio de tu palabra,"], ["2", "y con tu sabiduría formaste al hombre, para que fuese señor de las criaturas que tú hiciste;"], ["3", "á fin de que gobernase la redondez de la tierra con equidad y justicia, y ejerciese el juicio con rectitud de corazón;"], ["4", "dame aquella sabiduría que asiste á tu trono, y no quieras excluirme del número de tus hijos;"], ["5", "ya que yo soy siervo tuyo é hijo de tu esclava, hombre flaco, y de corta edad, y poco idóneo aun para entender el derecho y las leyes. G Porque aun cuando alguno de entre los hijos de una particular gracia de Dios. S. Aug. Conf. lil>. X. c. 29. De grat. et lib. arb. c. IV. I Esta expresión Oh Dios de mis padres, que se halla varias veces en la Escritura, enseña que cuando nuestros pecados nos hacen indignos de que Dios nos oiga, espera mos ser ayudados por los méritos de aquellos;í quienes Dios ama S. Aitgust. Quast, XVI, in lixad. Tom. VIII. lü"], ["9", "estando contigo tu sabiduría, que conoce tus obras; la cual se hallaba también contigo entonces cuando criabas al mundo, y sabia lo que era acepto á tus ojos, y qué cosa era conforme á tus decretos."], ["10", "Envíala de tus santos cielos y del solio de tu grandeza, para que esté conmigo, y conmigo trabaje2, á fin de que sepa yo lo que te place;"], ["11", "puesto que sabe ella todas las cosas, y todo lo entiende, y me guiará con acierto en mis empresas, y me protegerá con su poder:"]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Cielos, dejad caer el rocío; que las nubes lluevan al Justo, y la tierra germine al Salvador._", "la": "Roráte, cæli, désuper, et nubes plúant Iustum; aperiátur terra et gérminet Salvatórem."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Prepárate, Israel, y sal al encuentro de tu Salvador que se acerca._", "la": null}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 116", "content": {"la": [["1", "Alleluja. Laudate Dominum, omnes gentes, laudate eum, omnes populi."], ["2", "Quoniam confirmata est super nos misericordia ejus, et veritas Domini manet in aeternum."]], "es": [["1", "Alabad al Señor, naciones todas de la tierra, pueblos todos cantad sus alabanzas."], ["2", "Porque su misericordia se ha confirmado sobre nosotros; y la verdad del Señor permanece eternamente."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Prepárate, Israel, y sal al encuentro de tu Salvador que se acerca._", "la": null}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "isa 7:14-15", "content": {"la": [["14", "Propter hoc dabit Dominus ipse vobis signum : ecce virgo concipiet, et pariet filium, et vocabitur nomen ejus Emmanuel."], ["15", "Butyrum et mel comedet, ut sciat reprobare malum, et eligere bonum."]], "es": [["14", "Por tanto el mismo Señor os dará la señal: sabed que una virgen * concebirá y parirá un hijo, y su nombre será Emmanuel, ó Dios con nosotros."], ["15", "Manteca y miel comerá, hasta que sepa desechar lo malo y escoger lo bueno."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Super te, Ierúsalem, * Oriétur Dóminus. Super te.", "℟. Et glória eius in te vidébitur.* Oriétur Dóminus. Glória Patri. Super te."], "es": ["$℣. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℣. $Su gloria aparecerá sobre ti.", "$℟. $Amanecerá el Señor.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Euge serve bone et fidelis, quia in pauca fuisti fidelis, supra multa te constituam, dicit Dominus.", "es": "Bien, siervo bueno y fiel; ya que has sido fiel en lo poco, te pondré al frente de lo mucho, dice el Señor."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Euge serve bone et fidelis, quia in pauca fuisti fidelis, supra multa te constituam, dicit Dominus.", "es": "Bien, siervo bueno y fiel; ya que has sido fiel en lo poco, te pondré al frente de lo mucho, dice el Señor."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Dóminum nostrum Iesum Christum, fratres caríssimi, exorémus, qui in sua misericórdia nos vísitat, lætámque vocem iterémus:", "– Veni, Dómine Iesu.", "Qui de sinu Patris egréssus, venísti ut carnis nostræ vestiméntum indúeres,", "líbera quod períerat natúræ vitiátæ contágio.", "– Veni, Dómine Iesu.", "Qui ventúrus, in eléctis agnoscéris gloriósus,", "nunc véniens, in peccatóribus clemens semper et pius inveniáris.", "– Veni, Dómine Iesu.", "Gloriántes in laude tua, Christe Dómine,", "vísita nos in salutári tuo.", "– Veni, Dómine Iesu.", "Qui nos iam eduxísti in lucem per fidem,", "fac nos iustítia tua pro dignis opéribus tibi plácitos.", "– Veni, Dómine Iesu."], "es": ["Oremos, hermanos, a nuestro Señor Jesucristo, que en su misericordia nos visita, y digámosle con insistencia:", "- Tú que viniste del seno del Padre para revestirte de nuestra carne mortal, _libra de toda corrupción a nuestra naturaleza caída._ _Ven, Señor Jesús._", "- Tú que cuando vengas al final de los tiempos aparecerás glorioso ante tus elegidos, _al venir ahora muéstrate clemente y compasivo con los pecadores._ _Ven, Señor Jesús._", "- Nuestra gloria, oh Cristo, es alabarte; _visítanos, pues, con tu salvación._ _Ven, Señor Jesús._", "- Tú que por la fe nos has llevado a la luz, _haz que te agrademos también con nuestras obras._ _Ven, Señor Jesús._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Da nobis, quǽsumus, Dómine, beáti Apóstoli tui Thomæ sollemnitátibus gloriári: ut ejus semper et patrocíniis sublevémur; et fidem cóngrua devotióne sectémur.", "es": "Escucha, Señor, la oración de tu pueblo, alegre por la venida de tu Hijo en carne mortal, y haz que cuando vuelva en su gloria, al final de los tiempos, podamos alegrarnos de escuchar de sus labios la invitación a poseer el reino eterno. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}, "ref": "Sancti Petri Canisii, presbyteri et Ecclesiæ doctoris"}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Mirad: vendrá el deseado de todos los pueblos, y se llenará de gloria la casa del Señor. Aleluya._", "la": null}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 121", "content": {"la": [["1", "Canticum graduum. Laetatus sum in his quae dicta sunt mihi : In domum Domini ibimus."], ["2", "Stantes erant pedes nostri in atriis tuis, Jerusalem."], ["3", "Jerusalem, quae aedificatur ut civitas, cujus participatio ejus in idipsum."], ["4", "Illuc enim ascenderunt tribus, tribus Domini, testimonium Israel, ad confitendum nomini Domini."], ["5", "Quia illic sederunt sedes in judicio, sedes super domum David."], ["6", "Rogate quae ad pacem sunt Jerusalem, et abundantia diligentibus te."], ["7", "Fiat pax in virtute tua, et abundantia in turribus tuis."], ["8", "Propter fratres meos et proximos meos, loquebar pacem de te."], ["9", "Propter domum Domini Dei nostri, quaesivi bona tibi."]], "es": [["1", "Gran contento tuve cuando se me dijo: Iremos a la casa del Señor."], ["2", "En tus atrios descansarán nuestros pies, ¡oh Jerusalén!"], ["3", "Jerusalén, la cual se va edificando como una ciudad, cuyas partes o habitantes están en perfecta y mutua unión."], ["4", "Allá subirán las tribus, todas las tribus del Señor, según la ordenanza dada a Israel, para tributar alabanzas al Nombre del Señor."], ["5", "Allí se establecerán los tribunales para ejercer la justicia, el trono para la casa de David."], ["6", "Pedid a Dios los bienes de la paz para Jerusalén, y decid: Vivan en la abundancia los que te aman, ¡oh ciudad santa!"], ["7", "Reine la paz dentro de tus muros, y la abundancia en tus torres o palacios."], ["8", "Por amor de mis hermanos y de mis prójimos, he pedido yo la paz y prosperidad para ti."], ["9", "Por respeto a la casa del Señor Dios nuestro te procuraré tantos bienes."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Mirad: vendrá el deseado de todos los pueblos, y se llenará de gloria la casa del Señor. Aleluya._", "la": null}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Ven, Señor, y no tardes: perdona los pecados de tu pueblo, Israel._", "la": null}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 129", "content": {"la": [["1", "Canticum graduum. De profundis clamavi ad te, Domine;"], ["2", "Domine, exaudi vocem meam. Fiant aures tuae intendentes in vocem deprecationis meae."], ["3", "Si iniquitates observaveris, Domine, Domine, quis sustinebit?"], ["4", "Quia apud te propitiatio est; et propter legem tuam sustinui te, Domine. Sustinuit anima mea in verbo ejus;"], ["5", "speravit anima mea in Domino."], ["6", "A custodia matutina usque ad noctem, speret Israel in Domino;"], ["7", "quia apud Dominum misericordia, et copiosa apud eum redemptio."], ["8", "Et ipse redimet Israel ex omnibus iniquitatibus ejus."]], "es": [["1", "Desde lo más profundo clamé a ti, ¡oh Señor!"], ["2", "Oye, Señor, benignamente mi voz. Estén atentos tus oídos a la voz de mis plegarias."], ["3", "Si te pones a examinar, Señor, nuestras maldades, ¿quién podrá subsistir, ¡oh Señor!, en tu presencia?"], ["4", "Mas en ti se halla siempre la clemencia; y en vista de tu ley he confiado en ti, ¡oh Señor! en la promesa del Señor se ha apoyado mi alma."], ["5", "En el Señor ha puesto su esperanza."], ["6", "Desde el amanecer hasta la noche espere Israel en el Señor."], ["7", "Porque en el Señor está la misericordia, y en su mano tiene una redención abundantísima."], ["8", "Y es él el que redimirá a Israel de todas sus iniquidades."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Ven, Señor, y no tardes: perdona los pecados de tu pueblo, Israel._", "la": null}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Mirad: se cumple ya el tiempo en el que Dios envía a su Hijo al mundo._", "la": null}}, {"kind": "psalm", "label": "canticle", "ref": "phil 2:6-11", "content": {"la": [["6", "qui cum in forma Dei esset, non rapinam arbitratus est esse se aequalem Deo :"], ["7", "sed semetipsum exinanivit, formam servi accipiens, in similitudinem hominum factus, et habitu inventus ut homo."], ["8", "Humiliavit semetipsum factus obediens usque ad mortem, mortem autem crucis."], ["9", "Propter quod et Deus exaltavit illum, et donavit illi nomen, quod est super omne nomen :"], ["10", "ut in nomine Jesu omne genu flectatur caelestium, terrestrium et infernorum,"], ["11", "et omnis lingua confiteatur, quia Dominus Jesus Christus in gloria est Dei Patris."]], "es": [["6", "el cual teniendo la naturaleza de Dios, no fue por usurpación sino por esencia el ser igual á Dios;"], ["7", "y no obstante ' se anonadó á sí mismo lomando la forma ó naturaleza de siervo, hecho semejante á los demás hombres, y reducido á la condición de hombre."], ["8", "Se humilló á si mismo haciéndose obediente hasta la muerte, y muerte dâ¬ cruz."], ["9", "Por lo cual también Dios le ensalzó sobre todas las cosas, y le dio nombre superior á todo nombre;"], ["10", "á fin de que al nombre de Jesús se doble toda rodilla en el cielo, en la tierra, y en el infierno;"], ["11", "y toda lengua confiese, que el Señor Jesu- Christo está en la gloria de Dios Padre."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Mirad: se cumple ya el tiempo en el que Dios envía a su Hijo al mundo._", "la": null}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "1thess 5:23-24", "content": {"la": [["23", "Ipse autem Deus pacis sanctificet vos per omnia : ut integer spiritus vester, et anima, et corpus sine querela in adventu Domini nostri Jesu Christi servetur."], ["24", "Fidelis est, qui vocavit vos : qui etiam faciet."]], "es": [["23", "Y el Dios de la paz os haga santos en todo, á fin de que vuestro espíritu entero, con alma y cuerpo se conserven sin culpa para cuando venga nuestro Señor Jesu-Christo."], ["24", "Fiel es el que os llamó;y así lo hará como lo ha ofrecido."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Veni ad liberándum nos,* Dómine Deus virtútum. Veni.", "℟. Osténde fáciem tuam et salvi érimus.* Dómine Deus virtútum. Glória Patri. Veni."], "es": ["$℣. $Muéstranos, Señor,  tu  misericordia.", "$℟. $Muéstranos, Señor,  tu  misericordia.", "$℣. $Danos tu salvación.", "$℟. $Tu  misericordia.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Muéstranos, Señor,  tu  misericordia."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Sacerdos et Pontifex, et virtutum opifex, pastor bone in populo, ora pro nobis Dominum.", "es": "Sacerdote y Pontífice, y artífice de virtudes, buen pastor en medio del pueblo, ruega por nosotros al Señor."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Sacerdos et Pontifex, et virtutum opifex, pastor bone in populo, ora pro nobis Dominum.", "es": "Sacerdote y Pontífice, y artífice de virtudes, buen pastor en medio del pueblo, ruega por nosotros al Señor."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Iesum Christum, fratres caríssimi, rogémus humíliter, qui nos a ténebris peccatórum redémit, et fidénter invocémus:", "– Veni, Dómine Iesu.", "Cóngrega, Dómine, pópulos de univérsis terris", "et cum eis pactum sempitérnum confírma.", "– Veni, Dómine Iesu.", "Agnus Dei, qui olim venísti peccáta tóllere mundi,", "aufer a nobis omnem colluviónem delícti.", "– Veni, Dómine Iesu.", "Qui venísti redímere quod períerat,", "íterum sic vénias, ne redémpta púnias.", "– Veni, Dómine Iesu.", "Tecum, quem fides nostra inténdit,", "gáudium perpétuum, cum véneris, habeámus.", "– Veni, Dómine Iesu.", "Qui iudicatúrus es vivos et mórtuos,", "fratres defúnctos inter ágmina beatórum admítte propítius.", "– Veni, Dómine Iesu."], "es": ["Oremos, hermanos, a Cristo, el Señor, que nació de la Virgen María, y digámosle:", "- Hijo unigénito de Dios, que has de venir al mundo como mensajero de la alianza, _haz que el mundo te reciba y te reconozca._ _Ven, Señor Jesús._", "- Tú que, engendrado en el seno del Padre, quisiste hacerte hombre en el seno de María, _líbranos de la corrupción de la carne._ _Ven, Señor Jesús._", "- Tú que, siendo la vida, quisiste experimentar la muerte, _no permitas que la muerte pueda dañar a tu pueblo._ _Ven, Señor Jesús._", "- Tú que, en el día del juicio, traerás contigo la recompensa, _haz que tu amor sea entonces nuestro premio._ _Ven, Señor Jesús._", "- Señor Jesucristo, que por tu muerte socorriste a los muertos, _escucha las súplicas que te dirigimos por nuestros difuntos._ _Ven, Señor Jesús._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Da nobis, quǽsumus, Dómine, beáti Apóstoli tui Thomæ sollemnitátibus gloriári: ut ejus semper et patrocíniis sublevémur; et fidem cóngrua devotióne sectémur.", "es": "Escucha, Señor, la oración de tu pueblo, alegre por la venida de tu Hijo en carne mortal, y haz que cuando vuelva en su gloria, al final de los tiempos, podamos alegrarnos de escuchar de sus labios la invitación a poseer el reino eterno. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}, "ref": "Sancti Petri Canisii, presbyteri et Ecclesiæ doctoris"}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Intende voci orationis meae.", "es": "Atiende a la voz de mi oración."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 85", "content": {"la": [["1", "Oratio ipsi David. Inclina, Domine, aurem tuam et exaudi me, quoniam inops et pauper sum ego."], ["2", "Custodi animam meam, quoniam sanctus sum; salvum fac servum tuum, Deus meus, sperantem in te."], ["3", "Miserere mei, Domine, quoniam ad te clamavi tota die;"], ["4", "laetifica animam servi tui, quoniam ad te, Domine, animam meam levavi."], ["5", "Quoniam tu, Domine, suavis et mitis, et multae misericordiae omnibus invocantibus te."], ["6", "Auribus percipe, Domine, orationem meam, et intende voci deprecationis meae."], ["7", "In die tribulationis meae clamavi ad te, quia exaudisti me."], ["8", "Non est similis tui in diis, Domine, et non est secundum opera tua."], ["9", "Omnes gentes quascumque fecisti venient, et adorabunt coram te, Domine, et glorificabunt nomen tuum."], ["10", "Quoniam magnus es tu, et faciens mirabilia; tu es Deus solus."], ["11", "Deduc me, Domine, in via tua, et ingrediar in veritate tua; laetetur cor meum, ut timeat nomen tuum."], ["12", "Confitebor tibi, Domine Deus meus, in toto corde meo, et glorificabo nomen tuum in aeternum;"], ["13", "quia misericordia tua magna est super me, et eruisti animam meam ex inferno inferiori."], ["14", "Deus, iniqui insurrexerunt super me, et synagoga potentium quaesierunt animam meam, et non proposuerunt te in conspectu suo."], ["15", "Et tu, Domine Deus, miserator et misericors; patiens, et multae misericordiae, et verax."], ["16", "Respice in me, et miserere mei; da imperium tuum puero tuo, et salvum fac filium ancillae tuae."], ["17", "Fac mecum signum in bonum, ut videant qui oderunt me, et confundantur, quoniam tu, Domine, adjuvisti me, et consolatus es me."]], "es": [["1", "Inclina, Señor, tu oído a mis ruegos, y escúchame, porque me hallo afligido y necesitado."], ["2", "Guarda mi vida, puesto que soy santo. Salva, ¡oh Dios mío!, a este siervo tuyo que tiene puesta en ti su esperanza."], ["3", "Señor, ten misericordia de mí, porque no ceso de clamar a ti todo el día."], ["4", "Consuela el alma de tu siervo, pues a ti, ¡oh Señor!, tengo de continuo elevado mi espíritu."], ["5", "Siendo tú, Señor, como eres, suave, y benigno, y de gran clemencia para con todos los que te invocan,"], ["6", "oye propicio, ¡oh Señor!, mi oración, y atiende a la voz de mis ruegos."], ["7", "A ti clamaré el día de mi tribulación, pues tú siempre me has oído benignamente."], ["8", "Ninguno hay entre los dioses que pueda, ¡oh Señor!, parangonarse contigo; ninguno que pueda imitar tus obras."], ["9", "Las naciones todas, cuantas creaste, vendrán, Señor; y postradas ante ti te adorarán, y tributarán gloria a tu Nombre."], ["10", "Porque tú eres el grande; tú el hacedor de maravillas; tú solo eres Dios."], ["11", "Guíame Señor, por tus sendas, y yo caminaré según tu verdad; alégrese mi corazón de modo que respete tu Nombre."], ["12", "Te alabaré, ¡oh Señor Dios mío!, con todo mi corazón y glorificaré eternamente tu Nombre."], ["13", "Porque es grande tu misericordia para conmigo, y has sacado mi alma del infierno profundo."], ["14", "¡Oh Dios!, han conspirado contra mí los impíos, y una reunión de poderosos ha atentado contra mi vida, sin atender a que tú te hallas presente."], ["15", "Pero tú, Señor Dios, compasivo y benéfico, paciente y misericordiosísimo y veraz,"], ["16", "vuelve hacia mí tu rostro, y tenme lástima; da tu imperio a tu siervo, y pon a salvo al hijo de tu esclava."], ["17", "Obra algún prodigio a favor mío, para que los que me aborrecen, vean con confusión suya, cómo tú, ¡oh Señor!, me has socorrido y consolado."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Intende voci orationis meae.", "es": "Atiende a la voz de mi oración."}}, {"kind": "psalm", "label": "reading", "ref": "1Thess 5:9-10", "content": {"la": [["9", "quoniam non posuit nos Deus in iram, sed in acquisitionem salutis per Dominum nostrum Jesum Christum,"], ["10", "qui mortuus est pro nobis : ut sive vigilemus, sive dormiamus, simul cum illo vivamus."]], "es": [["9", "porque no nos ha puesto Dios para blanco de venganza, sino para hacernos adquirir la salud por nuestro Señor Jesu-Christo,"], ["10", "el cual murió por nosotros, á fin de que, ora velando, ora durmiendo, vivamos juntamente con él."]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Quietem, Domine, corporibus nostris tribue salutarem, et quæ fudimus hodie semina per laborem, fac ut messem germinent sempiternam. Per Christum Dominum nostrum.", "es": "Concede, Señor, a nuestros cuerpos fatigados el descanso necesario, y haz que la simiente del reino, que con nuestro trabajo hemos sembrado hoy, crezca y germine para la cosecha de la vida eterna. Por Jesucristo nuestro Señor."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-12-22": {"date_human": {"en": "Tuesday, December 22, 2026", "es": "Martes, 22 de diciembre de 2026", "la": "Feria III, die 22 Decembris, anno 2026"}, "day_description": {"en": "December 22, Advent", "es": "22 de diciembre, Adviento", "la": "Feria propria diei 22 Decembris, Adventus"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_De Sion vendrá el Señor que ha de reinar: su nombre será Emmanuel._", "la": "De Sion véniet qui regnatúrus est: Dóminus, Emmánuel magnum nomen eius."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 50", "content": {"la": [["1", "In finem. Psalmus David,"], ["2", "cum venit ad eum Nathan propheta, quando intravit ad Bethsabee."], ["3", "Miserere mei, Deus, secundum magnam misericordiam tuam; et secundum multitudinem miserationum tuarum, dele iniquitatem meam."], ["4", "Amplius lava me ab iniquitate mea, et a peccato meo munda me."], ["5", "Quoniam iniquitatem meam ego cognosco, et peccatum meum contra me est semper."], ["6", "Tibi soli peccavi, et malum coram te feci; ut justificeris in sermonibus tuis, et vincas cum judicaris."], ["7", "Ecce enim in iniquitatibus conceptus sum, et in peccatis concepit me mater mea."], ["8", "Ecce enim veritatem dilexisti; incerta et occulta sapientiae tuae manifestasti mihi."], ["9", "Asperges me hyssopo, et mundabor; lavabis me, et super nivem dealbabor."], ["10", "Auditui meo dabis gaudium et laetitiam, et exsultabunt ossa humiliata."], ["11", "Averte faciem tuam a peccatis meis, et omnes iniquitates meas dele."], ["12", "Cor mundum crea in me, Deus, et spiritum rectum innova in visceribus meis."], ["13", "Ne projicias me a facie tua, et spiritum sanctum tuum ne auferas a me."], ["14", "Redde mihi laetitiam salutaris tui, et spiritu principali confirma me."], ["15", "Docebo iniquos vias tuas, et impii ad te convertentur."], ["16", "Libera me de sanguinibus, Deus, Deus salutis meae, et exsultabit lingua mea justitiam tuam."], ["17", "Domine, labia mea aperies, et os meum annuntiabit laudem tuam."], ["18", "Quoniam si voluisses sacrificium, dedissem utique; holocaustis non delectaberis."], ["19", "Sacrificium Deo spiritus contribulatus; cor contritum et humiliatum, Deus, non despicies."], ["20", "Benigne fac, Domine, in bona voluntate tua Sion, ut aedificentur muri Jerusalem."], ["21", "Tunc acceptabis sacrificium justitiae, oblationes et holocausta; tunc imponent super altare tuum vitulos."]], "es": [["2", "Cuando, después que pecó con Betsabé, vino a él el profeta Natán."], ["3", "Ten piedad de mí, oh Dios, según la grandeza de tu misericordia; y según la muchedumbre de tus piedades, borra mi iniquidad."], ["4", "Lávame aun más de mi iniquidad, y límpiame de mi pecado,"], ["5", "(porque yo reconozco mi maldad, y delante de mí tengo siempre mi pecado;"], ["6", "contra ti solo he pecado; y he cometido la maldad delante de tus ojos) a fin de que perdonándome, aparezca justo cuando hables, y quedes victorioso en los juicios que de ti se formen."], ["7", "Mira, pues, que fui concebido en iniquidad y que mi madre me concibió en pecado."], ["8", "Y mira que tú amas la verdad; tú me revelaste los secretos y recónditos misterios de tu sabiduría."], ["9", "Me rociarás, Señor, con el hisopo, y seré purificado; me lavarás, y quedaré más blanco que la nieve."], ["10", "Infundirás en mi oído palabras de gozo y de alegría, con lo que se recrearán mis huesos quebrantados."], ["11", "Aparta tu rostro de mis pecados, y borra todas mis iniquidades."], ["12", "Crea en mí, ¡oh Dios!, un corazón puro, y renueva en mis entrañas el espíritu de rectitud."], ["13", "No me arrojes de tu presencia y no retires de mí tu santo espíritu."], ["14", "Restitúyeme la alegría de tu salvador; y fortaléceme con un espíritu de príncipe."], ["15", "Yo enseñaré tus caminos a los malos, y se convertirán a ti los impíos."], ["16", "Líbrame de la sangre, ¡oh Dios, Dios salvador mío!, y ensalzará mi lengua tu justicia."], ["17", "¡Oh Señor!, tú abrirás mis labios; y publicará mi boca tus alabanzas."], ["18", "Que si tú quisieras sacrificios, ciertamente te los ofreciera; mas tú no te complaces con solos holocaustos."], ["19", "El espíritu compungido es el sacrificio más grato para Dios; no despreciarás, ¡oh Dios mío!, el corazón contrito y humillado."], ["20", "Señor, por tu buena voluntad sé benigno para con Sión, a fin de que estén firmes los muros de Jerusalén."], ["21", "Entonces aceptarás el sacrificio de justicia, las ofrendas y los holocaustos; entonces serán colocados sobre tu altar becerros para el sacrificio."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_De Sion vendrá el Señor que ha de reinar: su nombre será Emmanuel._", "la": "De Sion véniet qui regnatúrus est: Dóminus, Emmánuel magnum nomen eius."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Perseverad constantes, a vosotros vendrá el auxilio del Señor._", "la": "Constántes estóte, vidébitis auxílium Dómini super vos."}}, {"kind": "psalm", "label": "canticle", "ref": "jer 14:17-21", "content": {"la": [["17", "Et dices ad eos verbum istud : Deducant oculi mei lacrimam per noctem et diem, et non taceant, quoniam contritione magna contrita est virgo filia populi mei, plaga pessima vehementer."], ["18", "Si egressus fuero ad agros, ecce occisi gladio : et si introiero in civitatem, ecce attenuati fame. Propheta quoque et sacerdos abierunt in terram quam ignorabant."], ["19", "Numquid projiciens abjecisti Judam? aut Sion abominata est anima tua? Quare ergo percussisti nos ita ut nulla sit sanitas? Exspectavimus pacem, et non est bonum : et tempus curationis, et ecce turbatio."], ["20", "Cognovimus, Domine, impietates nostras, iniquitates patrum nostrorum, quia peccavimus tibi."], ["21", "Ne des nos in opprobrium, propter nomen tuum, neque facias nobis contumeliam solii gloriae tuae : recordare, ne irritum facias foedus tuum nobiscum."]], "es": [["17", "Y tules dirás entretanto estas palabras: Derramen mis ojos sin cesar lágrimas noche y dia ': porque Jerusalem, la virgen hija del pueblo mió, se halla quebrantada de una extrema aflicción, con una llaga sumamente maligna."], ["18", "Si salgo al campo, yo no veo sino cadáveres de gente pasada á cuchillo: sí entro en la ciudad, hé aquí la población transida de hambre. Hasta los profetas y los sacerdotes son conducidos cautivos á un pais desconocido. '"], ["19", "¿Por ventura, Se/ior, has desechado del todo áJudá? ¿O es Sion abominada de tu alma? ¿Por qué pues nos has azotado con tanto rigor, que no nos queda parte sana? Esperamos la paz ó felicidad, y no tenemos ningún bien; y el tiempo de restablecernos, y hé aquí que estamos todos llenos de confusión."], ["20", "Oh Señor, reconocemos nuestras impiedades, y las maldades de nuestros padres: pecado hemos contra tí."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Perseverad constantes, a vosotros vendrá el auxilio del Señor._", "la": "Constántes estóte, vidébitis auxílium Dómini super vos."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Yo miro atento al Señor; espero en Dios, mi salvador._", "la": "Ego autem ad Dóminum aspíciam et exspectábo Deum, salvatórem meum."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 99", "content": {"la": [["1", "Psalmus in confessione."], ["2", "Jubilate Deo, omnis terra; servite Domino in laetitia. Introite in conspectu ejus in exsultatione."], ["3", "Scitote quoniam Dominus ipse est Deus; ipse fecit nos, et non ipsi nos; populus ejus, et oves pascuae ejus."], ["4", "Introite portas ejus in confessione, atria ejus in hymnis; confitemini illi. Laudate nomen ejus,"], ["5", "quoniam suavis est Dominus; in aeternum misericordia ejus, et usque in generationem et generationem veritas ejus."]], "es": [["1", "Moradores todos de la tierra, cantad con júbilo las alabanzas de Dios;"], ["2", "servid al Señor con alegría. Venid llenos de alborozo a presentaros ante su acatamiento."], ["3", "Tened entendido que el Señor es el único Dios. El es el que nos hizo, y no nosotros a nosotros mismos. ¡Oh tú, pueblo suyo!, vosotros ovejas a quien él apacienta,"], ["4", "entrad por sus puertas cantando alabanzas, venid a sus atrios entonando himnos, y tributadle acciones de gracias. Bendecid su Nombre,"], ["5", "porque es un Señor lleno de bondad, es eterna su misericordia, y su verdad resplandecerá de generación en generación."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Yo miro atento al Señor; espero en Dios, mi salvador._", "la": "Ego autem ad Dóminum aspíciam et exspectábo Deum, salvatórem meum."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "isa 45:8", "content": {"la": [["8", "Rorate, caeli, desuper, et nubes pluant justum; aperiatur terra, et germinet Salvatorem, et justitia oriatur simul : ego Dominus creavi eum."]], "es": [["8", "i Oh cielos! derramad desde arriba vuestro rocío; y lluevan las nubes al Justo: ábrase la tierra, y brote al Salvador, y nazca con él la justicia. Yo el Señor le crié '."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Super te, Ierúsalem, * Oriétur Dóminus. Super te.", "℟. Et glória eius in te vidébitur.* Oriétur Dóminus. Glória Patri. Super te."], "es": ["$℣. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℣. $Su gloria aparecerá sobre ti.", "$℟. $Amanecerá el Señor.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_En cuanto tu saludo llegó a mis oídos, la criatura saltó de alegría en mi vientre. Aleluya._", "la": "Ex quo facta est vox salutatiónis tuæ in áuribus meis, exsultávit in gáudio infans in útero meo, allelúia."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_En cuanto tu saludo llegó a mis oídos, la criatura saltó de alegría en mi vientre. Aleluya._", "la": "Ex quo facta est vox salutatiónis tuæ in áuribus meis, exsultávit in gáudio infans in útero meo, allelúia."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christum redemptórem exorémus, fratres dilectíssimi, qui venit ut nos grátia advéntus sui iustificáret, vocémque cum iúbilo innovémus:", "– Veni, Dómine Iesu.", "Qui olim prophetárum vaticínio in carne prædíctus es nascitúrus,", "nascéntia virtútum in nos corróbora.", "– Veni, Dómine Iesu.", "Præsta nobis ut, qui tuam prædicámus salútem,", "in te salvatiónem habeámus.", "– Veni, Dómine Iesu.", "Qui venísti contrítis corde medéri,", "pópuli tui sana languóres.", "– Veni, Dómine Iesu.", "Qui cum venísti reconciliáre dignátus es mundum,", "ad iudícium véniens ab omni nos pœnárum líbera cruciátu.", "– Veni, Dómine Iesu."], "es": ["Imploremos, hermanos, a Dios Padre, que ha enviado a su Hijo para salvar el mundo, y digámosle suplicantes:", "- Padre lleno de amor, no permitas que nuestra vida y nuestras obras rechacen a Cristo, tu enviado, _pues nuestra lengua lo proclama con fe plena._ _Muéstranos, Señor, tu misericordia._", "- Tú que enviaste a tu Hijo para salvación de los hombres, _aleja de nuestra nación y del mundo entero toda desgracia y todo dolor._ _Muéstranos, Señor, tu misericordia._", "- Que la tierra entera, que se alegra por la venida de tu Hijo, _experimente más aún el júbilo de poseerte plenamente._ _Muéstranos, Señor, tu misericordia._", "- Concédenos, por tu misericordia, llevar ya desde ahora una vida sobria, honrada y religiosa, _mientras aguardamos la dichosa esperanza, la aparición gloriosa de Jesucristo._ _Muéstranos, Señor, tu misericordia._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Deus, qui hóminem delápsum in mortem conspíciens, Unigéniti tui advéntu redímere voluísti, præsta, quǽsumus, ut qui húmili eius incarnatiónem devotióne faténtur, ipsíus étiam Redemptóris consórtia mereántur. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Señor Dios, que con la venida de tu Hijo has querido redimir al hombre sentenciado a muerte, concede a los que van a adorarlo, hecho niño en Belén, participar de los bienes de su redención. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_De Sion vendrá el Señor que ha de reinar: su nombre será Emmanuel._", "la": "De Sion véniet qui regnatúrus est: Dóminus, Emmánuel magnum nomen eius."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 134:1-12", "content": {"la": [["1", "Alleluja. Laudate nomen Dominum; laudate, servi, Dominum :"], ["2", "qui statis in domo Domini, in atriis domus Dei nostri."], ["3", "Laudate Dominum, quia bonus Dominus; psallite nomini ejus, quoniam suave."], ["4", "Quoniam Jacob elegit sibi Dominus, Israel in possessionem sibi."], ["5", "Quia ego cognovi quod magnus est Dominus, et Deus noster prae omnibus diis."], ["6", "Omnia quaecumque voluit Dominus fecit, in caelo, in terra, in mari et in omnibus abyssis."], ["7", "Educens nubes ab extremo terrae, fulgura in pluviam fecit; qui producit ventos de thesauris suis."], ["8", "Qui percussit primogenita Aegypti, ab homine usque ad pecus."], ["9", "Et misit signa et prodigia in medio tui, Aegypte, in Pharaonem, et in omnes servos ejus."], ["10", "Qui percussit gentes multas, et occidit reges fortes :"], ["11", "Sehon, regem Amorrhaeorum, et Og, regem Basan, et omnia regna Chanaan;"], ["12", "et dedit terram eorum haereditatem, haereditatem Israel populo suo."]], "es": [["1", "Alabad el nombre del Señor; tributadle alabanzas vosotros, siervos suyos"], ["2", "que asistís en la casa del Señor, en los atrios del templo de nuestro Dios."], ["3", "Alabad al Señor, porque el Señor es infinitamente bueno; canta himnos a su excelso Nombre, que es amable."], ["4", "Por cuanto el Señor ha escogido para sí a Jacob; a Israel, para propiedad suya."], ["5", "Porque tengo bien conocido que el Señor es grande, y que nuestro Dios es sobre todos los dioses."], ["6", "Todas cuantas cosas quiso, ha hecho el Señor; así en el cielo como en la tierra, en el mar y en todos los abismos."], ["7", "El hace venir las nubes de la extremidad de la tierra, y se convierte en lluvias los relámpagos. El es el que hace salir los vientos de sus depósitos;"], ["8", "el que hirió de muerte a los primogénitos de Egipto, sin perdonar a hombre ni bestia,"], ["9", "e hizo señales y prodigios en medio de ti, oh Egipto, contra el faraón y todos sus vasallos."], ["10", "El que destrozó a muchas naciones, y quitó la vida a reyes poderosos,"], ["11", "a Sehón, rey de los amorreos, y a Og, rey de Basán; y destruyó a todos los reinos de los cananeos."], ["12", "Y dio la tierra de éstos en herencia, en herencia a Israel pueblo suyo."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_De Sion vendrá el Señor que ha de reinar: su nombre será Emmanuel._", "la": "De Sion véniet qui regnatúrus est: Dóminus, Emmánuel magnum nomen eius."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Perseverad constantes, a vosotros vendrá el auxilio del Señor._", "la": "Constántes estóte, vidébitis auxílium Dómini super vos."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 134:13-21", "content": {"la": [["13", "Domine, nomen tuum in aeternum; Domine, memoriale tuum in generationem et generationem."], ["14", "Quia judicabit Dominus populum suum, et in servis suis deprecabitur."], ["15", "Simulacra gentium argentum et aurum, opera manuum hominum."], ["16", "Os habent, et non loquentur; oculos habent, et non videbunt."], ["17", "Aures habent, et non audient; neque enim est spiritus in ore ipsorum."], ["18", "Similes illis fiant qui faciunt ea, et omnes qui confidunt in eis."], ["19", "Domus Israel, benedicite Domino; domus Aaron, benedicite Domino."], ["20", "Domus Levi, benedicite Domino; qui timetis Dominum, benedicite Domino."], ["21", "Benedictus Dominus ex Sion, qui habitat in Jerusalem."]], "es": [["13", "¡Oh Señor!, tu nombre subsistirá eternamente, tu memoria, Señor, pasará de generación en generación."], ["14", "Porque el Señor hará justicia a su pueblo, y será propicio con sus siervos."], ["15", "Los ídolos de las naciones no son más que oro y plata, hechura de manos de hombre."], ["16", "Tienen boca, pero no hablarán; ojos, mas no verán;"], ["17", "orejas tienen y no oirán, pues no hay aliento o espíritu de vida en su boca."], ["18", "Semejantes sean a ellos los que los fabrican, y cuantos en ellos ponen su confianza."], ["19", "¡Oh tú, casa de Israel!, bendice al Señor, casa de Aarón."], ["20", "Casa de Leví, bendice al Señor. Vosotros todos los que teméis al Señor, bendecid al Señor eternamente."], ["21", "Bendígase al Señor desde Sión, al Señor que habita en Jerusalén."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Perseverad constantes, a vosotros vendrá el auxilio del Señor._", "la": "Constántes estóte, vidébitis auxílium Dómini super vos."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Yo miro atento al Señor; espero en Dios, mi salvador._", "la": "Ego autem ad Dóminum aspíciam et exspectábo Deum, salvatórem meum."}}, {"kind": "psalm", "label": "canticle", "ref": "rev 15:3-4", "content": {"la": [["3", "et cantantes canticum Moysi servi Dei, et canticum Agni, dicentes : Magna et mirabilia sunt opera tua, Domine Deus omnipotens : justae et verae sunt viae tuae, Rex saeculorum."], ["4", "Quis non timebit te, Domine, et magnificabit nomen tuum? quia solus pius es : quoniam omnes gentes venient, et adorabunt in conspectu tuo, quoniam judicia tua manifesta sunt."]], "es": [["3", "O unas cincuenta leguas. Expresión hiperbólica que xlenota que toda la Judea había de quedar inundada de sangre. Víase Jino, Vendimiar. ÍAPITULO x>. 223"], ["4", "¿Quién no te temerá; oh Señor! y no engran-. decerá tu santo nombre? puesto que tú solo eres el piadoso ': de aquí es que todas las naciones vendrán, y se postrarán en tu acatamiento, visto que tus juicios están manifiestos '."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Yo miro atento al Señor; espero en Dios, mi salvador._", "la": "Ego autem ad Dóminum aspíciam et exspectábo Deum, salvatórem meum."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "jas 5:7-8,9", "content": {"la": [["7", "Patientes igitur estote, fratres, usque ad adventum Domini. Ecce agricola exspectat pretiosum fructum terrae, patienter ferens donec accipiat temporaneum et serotinum."], ["8", "Patientes igitur estote et vos, et confirmate corda vestra : quoniam adventus Domini appropinquavit."], ["9", "Nolite ingemiscere, fratres, in alterutrum, ut non judicemini. Ecce judex ante januam assistit."]], "es": [["7", "Pero vosotros ¡oh hermanos mios! tened paciencia, hasta la venida del Señor '. Mirad cómo el labrador, con la esperanza de recoger el precioso fruto de la tierra, aguarda con paciencia que Dios envíe las lluvias, temprana y tardía."], ["8", "Esperad pues también vosotros con paciencia, y esforzad vuestros corazones, porque la venida del Señor está cerca."], ["9", "No queráis, hermanos, querellaros unos contra otros, á fin de que no seáis condenados en este terrible dia. Mirad que el juez está á la puerta."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Veni ad liberándum nos,* Dómine Deus virtútum. Veni.", "℟. Osténde fáciem tuam et salvi érimus.* Dómine Deus virtútum. Glória Patri. Veni."], "es": ["$℣. $Despierta tu poder y ven a salvarnos, Señor Dios de los ejércitos.", "$℟. $Despierta tu poder y ven a salvarnos, Señor Dios de los ejércitos.", "$℣. $Que brille tu rostro y nos salve.", "$℟. $Señor Dios de los ejércitos.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Despierta tu poder y ven a salvarnos, Señor Dios de los ejércitos."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Oh Rey de las naciones y Deseado de los pueblos, Piedra angular de la Iglesia, que haces de dos pueblos uno solo, ven y salva al hombre que formaste del barro de la tierra._", "la": "O Rex Géntium, et desiderátus eárum, lapísque anguláris, qui facis útraque unum: veni, et salva hóminem, quem de limo formásti."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_Oh Rey de las naciones y Deseado de los pueblos, Piedra angular de la Iglesia, que haces de dos pueblos uno solo, ven y salva al hombre que formaste del barro de la tierra._", "la": "O Rex Géntium, et desiderátus eárum, lapísque anguláris, qui facis útraque unum: veni, et salva hóminem, quem de limo formásti."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christum Dóminum, fratres caríssimi, qui propter nos humiliávit semetípsum, invocémus, cum exsultatióne dicéntes:", "– Veni, Dómine Iesu.", "Dómine Iesu, qui advéntu tuo subveníre dignátus es mundo,", "ánimas nostras et córpora a delícto purífica.", "– Veni, Dómine Iesu.", "Quosque mystério incarnatiónis tuæ non confúnderis fratres vocáre,", "aliénos a te éffici ne síveris.", "– Veni, Dómine Iesu.", "Tales nos rediméndos státuas,", "quáles iudicándos non púnias.", "– Veni, Dómine Iesu.", "Christe, a cuius divítiis bonitátis et pietátis nihil témporis vacat,", "fac nos percípere immarcescíbilem glóriæ corónam.", "– Veni, Dómine Iesu.", "Commendámus tibi, Dómine, ánimas eórum qui córporis néxibus absolúti sunt:", "defúncti sǽculo, tibi vivant in ætérnum.", "– Veni, Dómine Iesu."], "es": ["Oremos, hermanos, a Cristo, el Señor, que por nosotros se despojó de su rango, y digámosle confiados:", "- Señor Jesús que con tu encarnación has salvado al mundo, _purifica nuestras almas y nuestros cuerpos de todo pecado._ _Ven, Señor Jesús._", "- No permitas que aquéllos a quienes llamas hermanos por tu encarnación _se alejen de ti por el pecado._ _Ven, Señor Jesús._", "- No permitas que aquellos a quienes has salvado con tu venida _merezcan ser castigados en el día de tu juicio._ _Ven, Señor Jesús._", "- Cristo Jesús, que nunca alejas de nosotros tu bondad y tu amor, _haz que alcancemos la corona inmarcesible de gloria._ _Ven, Señor Jesús._", "- Te encomendamos, Señor, a nuestros hermanos que han sido separados temporalmente de su cuerpo; _haz que, muertos para el mundo, vivan eternamente para ti._ _Ven, Señor Jesús._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Deus, qui hóminem delápsum in mortem conspíciens, Unigéniti tui advéntu redímere voluísti, præsta, quǽsumus, ut qui húmili eius incarnatiónem devotióne faténtur, ipsíus étiam Redemptóris consórtia mereántur. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Señor Dios, que con la venida de tu Hijo has querido redimir al hombre sentenciado a muerte, concede a los que van a adorarlo, hecho niño en Belén, participar de los bienes de su redención. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Ne intres in iudicium cum servo tuo, Domine.", "es": "No entres en juicio con tu siervo, Señor."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 142:1-11", "content": {"la": [["1", "Psalmus David, quando persequebatur eum Absalom, filius ejus. Domine, exaudi orationem meam; auribus percipe obsecrationem meam in veritate tua; exaudi me in tua justitia."], ["2", "Et non intres in judicium cum servo tuo, quia non justificabitur in conspectu tuo omnis vivens."], ["3", "Quia persecutus est inimicus animam meam, humiliavit in terra vitam meam; collocavit me in obscuris, sicut mortuos saeculi."], ["4", "Et anxiatus est super me spiritus meus; in me turbatum est cor meum."], ["5", "Memor fui dierum antiquorum : meditatus sum in omnibus operibus tuis, in factis manuum tuarum meditabar."], ["6", "Expandi manus meas ad te; anima mea sicut terra sine aqua tibi."], ["7", "Velociter exaudi me, Domine; defecit spiritus meus. Non avertas faciem tuam a me, et similis ero descendentibus in lacum."], ["8", "Auditam fac mihi mane misericordiam tuam, quia in te speravi. Notam fac mihi viam in qua ambulem, quia ad te levavi animam meam."], ["9", "Eripe me de inimicis meis, Domine; ad te confugi."], ["10", "Doce me facere voluntatem tuam, quia Deus meus es tu. Spiritus tuus bonus deducet me in terram rectam."], ["11", "Propter nomen tuum, Domine, vivificabis me; in aequitate tua, educes de tribulatione animam meam;"]], "es": [["1", "¡Oh Señor!, escucha benigno mi oración; presta oídos a mi súplica, según la verdad de tus promesas; óyeme por tu misericordia."], ["2", "Mas no quieres entrar en juicio con tu siervo; porque ningún viviente puede aparecer justo en tu presencia."], ["3", "Ya ves cómo el enemigo ha perseguido mi alma; abatida tiene hasta el suelo la vida mía. Me ha confinado en lugares tenebrosos, como a los que murieron hace ya un siglo."], ["4", "Mi espíritu padece terribles angustias; está mi corazón en continua zozobra."], ["5", "Mas me acordé luego de los días antiguos; me puse a meditar todas tus obras; ponderaba los efectos maravillosos de tu poder."], ["6", "Levanté mis manos hacia ti como tierra falta de agua, así está por ti suspirando el alma mía."], ["7", "Oyeme luego, ¡oh Señor!, mi espíritu ha desfallecido. No retires de mí tu rostro; haz que no haya de contarme ya entre los muertos."], ["8", "Hazme sentir cuanto antes tu misericordia, pues en ti he puesto mi esperanza. Muéstrame el camino que debo seguir, ya que hacia ti he levantado mi corazón."], ["9", "Líbrame, ¡oh Señor!, de mis enemigos; a ti me acojo."], ["10", "Enséñame a cumplir tu voluntad, pues tú eres mi Dios. Entonces tu espíritu es infinitamente bueno, me conducirá a la tierra de la rectitud y santidad."], ["11", "Por amor de tu Nombre, ¡oh Señor!, me darás la vida, según la justicia de tus promesas. A mi alma la sacarás de la tribulación,"]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Ne intres in iudicium cum servo tuo, Domine.", "es": "No entres en juicio con tu siervo, Señor."}}, {"kind": "psalm", "label": "reading", "ref": "1Pet 5:8-9a", "content": {"la": [["8", "Sobrii estote, et vigilate : quia adversarius vester diabolus tamquam leo rugiens circuit, quaerens quem devoret :"], ["9", "cui resistite fortes in fide : scientes eamdem passionem ei quae in mundo est vestrae fraternitati fieri."]], "es": [["8", "Sed sobrios, y 'estad en continua vela, porque vuestro enemigo el diablo anda girando como león rugiente al rededor de vosotros, en busca de presa que devorar: ü resistidle firmes en la fé, sabiendo que la misma tribulación padecen vuestros hermanos, cuantos hay e
