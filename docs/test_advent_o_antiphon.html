n el mundo."], ["9", "Resistidle firmes en la fe: sabiendo que la misma tribulacion padecen vuestros hermanos, cuantos hay en el mundo."]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Noctem istam, quæsumus, Domine, benignus illumina, et ita fac in pace nos tuos famulos obdormire, ut læti ad novi diei claritatem in tuo nomine suscitemur. Per Christum Dominum nostrum.", "es": "Ilumina, Señor, nuestra noche y concédenos un descanso tranquilo; que mañana nos levantemos en tu nombre y podamos contemplar, con salud y gozo, el clarear del nuevo día. Por Jesucristo nuestro Señor."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-12-23": {"date_human": {"en": "Wednesday, December 23, 2026", "es": "Miércoles, 23 de diciembre de 2026", "la": "Feria IV, die 23 Decembris, anno 2026"}, "day_description": {"en": "December 23, Advent &mdash; Sancti Ioannis de Kęty, presbyteri", "es": "23 de diciembre, Adviento &mdash; Sancti Ioannis de Kęty, presbyteri", "la": "Feria propria diei 23 Decembris, Adventus &mdash; Sancti Ioannis de Kęty, presbyteri"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Mirad, vendrá el Señor, príncipe de los reyes de la tierra; ¡dichosos los que están preparados para salir a su encuentro!_", "la": "Ecce véniet Dóminus, princeps regum terræ; beáti qui paráti sunt occúrrere illi."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 89", "content": {"la": [["1", "Oratio Moysi, hominis Dei. Domine, refugium factus es nobis a generatione in generationem."], ["2", "Priusquam montes fierent, aut formaretur terra et orbis, a saeculo et usque in saeculum tu es Deus."], ["3", "Ne avertas hominem in humilitatem; et dixisti : Convertimini, filii hominum."], ["4", "Quoniam mille anni ante oculos tuos tamquam dies hesterna quae praeteriit, et custodia in nocte;"], ["5", "quae pro nihilo habentur eorum anni erunt."], ["6", "Mane sicut herba transeat; mane floreat, et transeat; vespere decidat, induret, et arescat."], ["7", "Quia defecimus in ira tua, et in furore tuo turbati sumus."], ["8", "Posuisti iniquitates nostras in conspectu tuo, saeculum nostrum in illuminatione vultus tui."], ["9", "Quoniam omnes dies nostri defecerunt; et in ira tua defecimus. Anni nostri sicut aranea meditabuntur;"], ["10", "dies annorum nostrorum in ipsis septuaginta anni. Si autem in potentatibus octoginta anni, et amplius eorum labor et dolor; quoniam supervenit mansuetudo, et corripiemur."], ["11", "Quis novit potestatem irae tuae,"], ["12", "et prae timore tuo iram tuam dinumerare? Dexteram tuam sic notam fac, et eruditos corde in sapientia."], ["13", "Convertere, Domine; usquequo? et deprecabilis esto super servos tuos."], ["14", "Repleti sumus mane misericordia tua; et exsultavimus, et delectati sumus omnibus diebus nostris."], ["15", "Laetati sumus pro diebus quibus nos humiliasti, annis quibus vidimus mala."], ["16", "Respice in servos tuos et in opera tua, et dirige filios eorum."], ["17", "Et sit splendor Domini Dei nostri super nos; et opera manuum nostrarum dirige super nos, et opus manuum nostrarum dirige."]], "es": [["1", "Señor, en todas épocas has sido tú nuestro amparo."], ["2", "Tú, ¡oh Dios!, eres antes que fuesen hechos los montes, o se formara la tierra y el mundo universo; eres desde siempre y por toda la eternidad."], ["3", "No reduzcas el hombre al abatimiento, pues dijiste: Convertíos, ¡oh hijos de los hombres!"], ["4", "Porque mil años son ante tus ojos como el día de ayer que ya pasó, y como una de las vigilias de la noche."], ["5", "Una nada son todos los años que vive."], ["6", "Dura un día como el heno; florece por la mañana, y se pasa; por la tarde inclina la cabeza, se deshoja, y se seca."], ["7", "Al ardor de tu ira hemos desfallecido, y a la fuerza de tu furor quedamos consumidos."], ["8", "Has colocado nuestras maldades delante de tus ojos, y nuestra conducta al resplandor de tu semblante."], ["9", "Por eso todos nuestros días se han desvanecido, y nosotros venimos a fallecer por tu enojo. Como una tela de araña serán considerados nuestros años."], ["10", "Setenta años son los días de nuestra vida; cuando más, ochenta años en los muy robustos; lo que pasa de aquí, achaques y dolencias. Según esto, presto seremos arrebatados, pues va llegando ya la debilidad de la vejez."], ["11", "Mas ¿quién podrá conocer la grandeza de tu ira, y comprender cuán terrible es tu indignación?"], ["12", "Danos, pues, a conocer el poder de tu diestra, y concédenos un corazón instruido en la sabiduría."], ["13", "Vuélvete hacia nosotros, Señor. ¿Hasta cuándo te mostrarás airado? Sé tú compasivo para con tus siervos."], ["14", "Bien presto seremos colmados de tu misericordia; y nos regocijaremos y recrearemos todos los días de nuestra vida."], ["15", "Nos alegraremos por los días que tú nos humillaste, por los años que sufrimos miserias."], ["16", "Vuelve los ojos hacia tus siervos, a estas obras tuyas, y dirige tú a sus hijos."], ["17", "Y resplandezca sobre nosotros la luz del Señor Dios nuestro, y endereza en nosotros las obras de nuestras manos, y da éxito a nuestras empresas."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Mirad, vendrá el Señor, príncipe de los reyes de la tierra; ¡dichosos los que están preparados para salir a su encuentro!_", "la": "Ecce véniet Dóminus, princeps regum terræ; beáti qui paráti sunt occúrrere illi."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Cantad al Señor un cántico nuevo, llegue su alabanza hasta el confín de la tierra._", "la": "Cantáte Dómino cánticum novum; laus eius ab extrémis terræ."}}, {"kind": "psalm", "label": "canticle", "ref": "isa 42:10-16", "content": {"la": [["10", "Cantate Domino canticum novum, laus ejus ab extremis terrae, qui descenditis in mare, et plenitudo ejus; insulae, et habitatores earum."], ["11", "Sublevetur desertum et civitates ejus. In domibus habitabit Cedar : laudate, habitatores petrae, de vertice montium clamabunt."], ["12", "Ponent Domino gloriam, et laudem ejus in insulis nuntiabunt."], ["13", "Dominus sicut fortis egredietur, sicut vir praeliator suscitabit zelum; vociferabitur, et clamabit : super inimicos suos confortabitur."], ["14", "Tacui semper, silui, patiens fui; sicut parturiens loquar; dissipabo, et absorbebo simul."], ["15", "Desertos faciam montes et colles, et omne gramen eorum exsiccabo; et ponam flumina in insulas, et stagna arefaciam."], ["16", "Et ducam caecos in viam quam nesciunt, et in semitis quas ignoraverunt ambulare eos faciam; ponam tenebras coram eis in lucem, et prava in recta; haec verba feci eis, et non dereliqui eos."]], "es": [["10", "Cantad al Señor un nuevo cántico, publicad"], ["12", "Ellos darán gloria al Señor; y publicarán en las islas, ó naciones remotas, sus alabanzas."], ["13", "Porque el Señor saldrá fuera como un invencible campeón; como un fuerte guerrero excitará su zelo: dará voces y clamará: prevalecerá contra sus enemigos."], ["14", "Hasta ahora, dirá él, estuve siempre callado, guardé silencio, fui sufrido: mas ya como voces de muger que está de parto, así serán las mías: desolaré y devoraré de un golpe á todos mis enemigos."], ["15", "Yo arrasaré los montes y collados frondosos, y agostaré todas sus yerbas, y convertiré en islas los rios, y secaré los estanques."], ["16", "Y guiaré á los ciegos por un camino que no saben, y los haré andar por sendas que no conocen:"]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Cantad al Señor un cántico nuevo, llegue su alabanza hasta el confín de la tierra._", "la": "Cantáte Dómino cánticum novum; laus eius ab extrémis terræ."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Cuando venga el Hijo del hombre, ¿encontrará fe en la tierra?_", "la": "Cum vénerit Fílius hóminis, putas, invéniet fidem super terram?"}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 134:1-12", "content": {"la": [["1", "Alleluja. Laudate nomen Dominum; laudate, servi, Dominum :"], ["2", "qui statis in domo Domini, in atriis domus Dei nostri."], ["3", "Laudate Dominum, quia bonus Dominus; psallite nomini ejus, quoniam suave."], ["4", "Quoniam Jacob elegit sibi Dominus, Israel in possessionem sibi."], ["5", "Quia ego cognovi quod magnus est Dominus, et Deus noster prae omnibus diis."], ["6", "Omnia quaecumque voluit Dominus fecit, in caelo, in terra, in mari et in omnibus abyssis."], ["7", "Educens nubes ab extremo terrae, fulgura in pluviam fecit; qui producit ventos de thesauris suis."], ["8", "Qui percussit primogenita Aegypti, ab homine usque ad pecus."], ["9", "Et misit signa et prodigia in medio tui, Aegypte, in Pharaonem, et in omnes servos ejus."], ["10", "Qui percussit gentes multas, et occidit reges fortes :"], ["11", "Sehon, regem Amorrhaeorum, et Og, regem Basan, et omnia regna Chanaan;"], ["12", "et dedit terram eorum haereditatem, haereditatem Israel populo suo."]], "es": [["1", "Alabad el nombre del Señor; tributadle alabanzas vosotros, siervos suyos"], ["2", "que asistís en la casa del Señor, en los atrios del templo de nuestro Dios."], ["3", "Alabad al Señor, porque el Señor es infinitamente bueno; canta himnos a su excelso Nombre, que es amable."], ["4", "Por cuanto el Señor ha escogido para sí a Jacob; a Israel, para propiedad suya."], ["5", "Porque tengo bien conocido que el Señor es grande, y que nuestro Dios es sobre todos los dioses."], ["6", "Todas cuantas cosas quiso, ha hecho el Señor; así en el cielo como en la tierra, en el mar y en todos los abismos."], ["7", "El hace venir las nubes de la extremidad de la tierra, y se convierte en lluvias los relámpagos. El es el que hace salir los vientos de sus depósitos;"], ["8", "el que hirió de muerte a los primogénitos de Egipto, sin perdonar a hombre ni bestia,"], ["9", "e hizo señales y prodigios en medio de ti, oh Egipto, contra el faraón y todos sus vasallos."], ["10", "El que destrozó a muchas naciones, y quitó la vida a reyes poderosos,"], ["11", "a Sehón, rey de los amorreos, y a Og, rey de Basán; y destruyó a todos los reinos de los cananeos."], ["12", "Y dio la tierra de éstos en herencia, en herencia a Israel pueblo suyo."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Cuando venga el Hijo del hombre, ¿encontrará fe en la tierra?_", "la": "Cum vénerit Fílius hóminis, putas, invéniet fidem super terram?"}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "jer 30:21-22", "content": {"la": [["21", "Et erit dux ejus ex eo, et princeps de medio ejus producetur : et applicabo eum, et accedet ad me. Quis enim iste est qui applicet cor suum ut appropinquet mihi? ait Dominus :"], ["22", "et eritis mihi in populum, et ego ero vobis in Deum."]], "es": [["21", "Y de él, esto es, de Jacob, nacerá su caudillo ó Mesías, y de en medio de él saldrá á luz el príncipe: al cual me le allegaré á mí, y él se estrechará conmigo '. Porque ¿ quién es aquel que de tal modo se acerque á mí con su corazón, dice el Señor?"], ["22", "Vosotros seréis entonces mi pueh\\o fiel, y yo seré vuestro Dios siempre benigno."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Super te, Ierúsalem, * Oriétur Dóminus. Super te.", "℟. Et glória eius in te vidébitur.* Oriétur Dóminus. Glória Patri. Super te."], "es": ["$℣. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℣. $Su gloria aparecerá sobre ti.", "$℟. $Amanecerá el Señor.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Euge serve bone et fidelis, quia in pauca fuisti fidelis, supra multa te constituam, intra in gaudium Domini tui.", "es": "Bien hecho, siervo bueno y fiel: ya que has sido fiel en lo poco, te pondré al frente de mucho; entra en el gozo de tu Señor."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Euge serve bone et fidelis, quia in pauca fuisti fidelis, supra multa te constituam, intra in gaudium Domini tui.", "es": "Bien hecho, siervo bueno y fiel: ya que has sido fiel en lo poco, te pondré al frente de mucho; entra en el gozo de tu Señor."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Deum Patrem, fratres caríssimi, implorántes, qui misit Fílium suum ad salvándos hómines, súpplices acclamémus:", "– Osténde nobis, Dómine, misericórdiam tuam.", "Christum tuum, Pater clementíssime, quem plena fide os nostrum annúntiat,", "conversátio nostra ópere ne despíciat.", "– Osténde nobis, Dómine, misericórdiam tuam.", "Qui Fílium tuum misísti ad salútem,", "univérsum aufer a fácie terræ et a civitáte ista dolórem.", "– Osténde nobis, Dómine, misericórdiam tuam.", "Terra nostra advéntu Fílii tui iucunditáte perfúsa,", "tuæ plenitúdinis gáudium ubérius experiátur.", "– Osténde nobis, Dómine, misericórdiam tuam.", "Per misericórdiam tuam, fac ut nos pie et sóbrie in hoc sǽculo vivámus,", "exspectántes beátam spem et advéntum glóriæ Christi.", "– Osténde nobis, Dómine, misericórdiam tuam."], "es": ["Oremos, hermanos, a Cristo, nuestro Redentor, que ha venido para darnos la justificación, y digámosle con júbilo:", "- Señor, cuya venida en la carne anunciaron los profetas, _haz germinar en nosotros la semilla de las virtudes._ _Ven, Señor Jesús._", "- Concede a los que anunciamos al mundo tu salvación, _que la encontremos también en ti._ _Ven, Señor Jesús._", "- Tú que viniste a librar a los oprimidos, _cura las dolencias de los que sufren._ _Ven, Señor Jesús._", "- Tú que reconciliaste al mundo con Dios en tu primera venida, _absuélvenos de toda condenación cuando vengas como juez._ _Ven, Señor Jesús._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Da, quæsumus, omnipotens Deus, ut, exemplo beati Ioannis presbyteri, in sanctorum scientia procedamus, atque, misericordiam omnibus exhibentes, apud te indulgentiam consequamur. Per Dominum.", "es": "Dios todopoderoso y eterno, al acercarnos a las fiestas de Navidad, te pedimos que tu Hijo, que se encarnó en las entrañas de la Virgen María y quiso vivir entre nosotros, nos haga partícipes de la abundancia de su misericordia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}, "ref": "Sancti Ioannis de Kęty, presbyteri"}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Mirad, vendrá el Señor, príncipe de los reyes de la tierra; ¡dichosos los que están preparados para salir a su encuentro!_", "la": "Ecce véniet Dóminus, princeps regum terræ; beáti qui paráti sunt occúrrere illi."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 135:1-9", "content": {"la": [["1", "Alleluja. Confitemini Domino, quoniam bonus, quoniam in aeternum misericordia ejus."], ["2", "Confitemini Deo deorum, quoniam in aeternum misericordia ejus."], ["3", "Confitemini Domino dominorum, quoniam in aeternum misericordia ejus."], ["4", "Qui facit mirabilia magna solus, quoniam in aeternum misericordia ejus."], ["5", "Qui fecit caelos in intellectu, quoniam in aeternum misericordia ejus."], ["6", "Qui firmavit terram super aquas, quoniam in aeternum misericordia ejus."], ["7", "Qui fecit luminaria magna, quoniam in aeternum misericordia ejus :"], ["8", "solem in potestatem diei, quoniam in aeternum misericordia ejus;"], ["9", "lunam et stellas in potestatem noctis, quoniam in aeternum misericordia ejus."]], "es": [["2", "Alabad al Señor, porque es infinitamente bueno, porque es eterna su misericordia."], ["3", "Alabad al Dios de los dioses, porque es eterna su misericordia."], ["4", "Alabad al Señor de los señores, porque es eterna su misericordia."], ["5", "Al único que obra grandes maravillas, porque es eterna su misericordia."], ["6", "Al que con su sabiduría creó los cielos, porque es eterna su misericordia."], ["7", "Al que afianzó la tierra sobre las aguas, porque es eterna su misericordia."], ["8", "Al que hizo los grandes luminares, porque es eterna su misericordia."], ["9", "El sol para presidir el día, porque es eterna su misericordia."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Mirad, vendrá el Señor, príncipe de los reyes de la tierra; ¡dichosos los que están preparados para salir a su encuentro!_", "la": "Ecce véniet Dóminus, princeps regum terræ; beáti qui paráti sunt occúrrere illi."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Cantad al Señor un cántico nuevo, llegue su alabanza hasta el confín de la tierra._", "la": "Cantáte Dómino cánticum novum; laus eius ab extrémis terræ."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 135:10-26", "content": {"la": [["10", "Qui percussit Aegyptum cum primogenitis eorum, quoniam in aeternum misericordia ejus."], ["11", "Qui eduxit Israel de medio eorum, quoniam in aeternum misericordia ejus,"], ["12", "in manu potenti et brachio excelso, quoniam in aeternum misericordia ejus."], ["13", "Qui divisit mare Rubrum in divisiones, quoniam in aeternum misericordia ejus;"], ["14", "et eduxit Israel per medium ejus, quoniam in aeternum misericordia ejus;"], ["15", "et excussit Pharaonem et virtutem ejus in mari Rubro, quoniam in aeternum misericordia ejus."], ["16", "Qui traduxit populum suum per desertum, quoniam in aeternum misericordia ejus."], ["17", "Qui percussit reges magnos, quoniam in aeternum misericordia ejus;"], ["18", "et occidit reges fortes, quoniam in aeternum misericordia ejus :"], ["19", "Sehon, regem Amorrhaeorum, quoniam in aeternum misericordia ejus;"], ["20", "et Og, regem Basan, quoniam in aeternum misericordia ejus;"], ["21", "et dedit terram eorum haereditatem, quoniam in aeternum misericordia ejus;"], ["22", "haereditatem Israel, servo suo, quoniam in aeternum misericordia ejus."], ["23", "Quia in humilitate nostra memor fuit nostri, quoniam in aeternum misericordia ejus;"], ["24", "et redimit nos ab inimicis nostris, quoniam in aeternum misericordia ejus."], ["25", "Qui dat escam omni carni, quoniam in aeternum misericordia ejus."], ["26", "Confitemini Deo caeli, quoniam in aeternum misericordia ejus."]], "es": [["10", "La luna y las estrellas para presidir la noche, porque es eterna su misericordia."], ["11", "Al que hirió de muerte a Egipto en sus primogénitos, porque es eterna su misericordia."], ["12", "Al que sacó a Israel de Egipto, porque es eterna su misericordia."], ["13", "Ejecutándolo con mano poderosa y brazo levantado, porque es eterna su misericordia."], ["14", "Al que dividió en dos partes el mar Rojo, porque es eterna su misericordia."], ["15", "y condujo a Israel por en medio de sus aguas, porque es eterna su misericordia,"], ["16", "y sumergió al faraón y su ejército en el mar Rojo, porque es eterna su misericordia."], ["17", "Al que guió a su pueblo por el desierto, porque es eterna su misericordia."], ["18", "Al que hirió o derribó a los grandes reyes valerosos, porque es eterna su misericordia."], ["19", "Al que mató a reyes valerosos, porque es eterna su misericordia;"], ["20", "a Sehón, rey de los amorreos, porque es eterna su misericordia;"], ["21", "y a Og, rey de Basán, porque es eterna su misericordia."], ["22", "Y dio la tierra de ellos en herencia, porque es eterna su misericordia;"], ["23", "en herencia a Israel siervo suyo, porque es eterna su misericordia."], ["24", "Al que se acordó de nosotros en nuestro abatimiento, porque es eterna su misericordia;"], ["25", "y no // 404s harmlessly and the baked-in snapshot for that date stays in use.
for (const iso of DATA.date_order) {
  fetch('/api/day?date=' + encodeURIComponent(iso))
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(fresh => { DATA.dates[iso] = fresh; render(); })
    .catch(() => { /* dev_server.py not running - keep the baked-in day */ });
}

// This page is a static snapshot: DATA.dates holds a pre-built window of days
// (generated around DATA.generated_date) rather than just one. There's still
// no live backend to build a day outside that window, but picking a timezone
// now actually jumps to the right day within it instead of just warning.
function populateDateOptions() {
  const left = leftSel.value;
  const prev = dateSel.value;
  dateSel.innerHTML = '';
  for (const iso of DATA.date_order) {
    const o = document.createElement('option');
    o.value = iso;
    const dh = DATA.dates[iso].date_human;
    o.textContent = (dh && (dh[left] || dh.en)) || iso;
    dateSel.appendChild(o);
  }
  if (prev && DATA.dates[prev]) dateSel.value = prev;
}

const COMMON_TIMEZONES = [
  'UTC', 'Europe/Rome', 'Europe/Madrid', 'Europe/London', 'Europe/Paris',
  'America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles',
  'America/Mexico_City', 'America/Bogota', 'America/Sao_Paulo', 'America/Argentina/Buenos_Aires',
  'Asia/Manila', 'Asia/Tokyo', 'Asia/Kolkata', 'Australia/Sydney', 'Pacific/Auckland',
];
let tzList = COMMON_TIMEZONES;
try {
  if (typeof Intl.supportedValuesOf === 'function') {
    tzList = Intl.supportedValuesOf('timeZone');
  }
} catch (e) { /* fall back to the curated list above */ }

const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
if (!tzList.includes(browserTz)) tzList = [browserTz, ...tzList];

// Only the region prefix (e.g. "America", "Europe") has an established Latin/
// Spanish name across the whole IANA list - the city/location part after the
// slash is left as-is (see TZ_REGION_NAMES in i18n.py for why).
function populateTimezoneOptions() {
  const left = leftSel.value;
  const regionNames = (DATA.tz_region_names && DATA.tz_region_names[left]) || {};
  const prev = tzSel.value;
  tzSel.innerHTML = '';
  for (const tz of tzList) {
    const o = document.createElement('option');
    o.value = tz;
    const slash = tz.indexOf('/');
    if (slash === -1) {
      o.textContent = tz.replace(/_/g, ' ');
    } else {
      const region = tz.slice(0, slash);
      const rest = tz.slice(slash + 1).replace(/_/g, ' ');
      o.textContent = (regionNames[region] || region) + ' / ' + rest;
    }
    tzSel.appendChild(o);
  }
  tzSel.value = prev && tzList.includes(prev) ? prev : browserTz;
}

function isoDateInTimeZone(tz) {
  // en-CA locale formats as YYYY-MM-DD, convenient for direct comparison with DATA.dates keys
  return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' })
    .format(new Date());
}

// Picks "today" in the given timezone if that date was actually pre-built;
// otherwise falls back to whichever generated date is closest to it, since
// this is still a static page with a fixed, finite window of days baked in.
function closestAvailableDate(isoTarget) {
  if (DATA.dates[isoTarget]) return isoTarget;
  const targetMs = new Date(isoTarget).getTime();
  let best = DATA.date_order[0];
  let bestDiff = Infinity;
  for (const iso of DATA.date_order) {
    const diff = Math.abs(new Date(iso).getTime() - targetMs);
    if (diff < bestDiff) { bestDiff = diff; best = iso; }
  }
  return best;
}

const TZNOTE_TEXT = {
  en: (today, tz, first, last) => `&#9888; Today is <strong>${today}</strong> in ${tz}, which is outside the ` +
    `range of dates generated for this demo (<strong>${first}</strong> to <strong>${last}</strong>). ` +
    `Showing the closest available date instead.`,
  es: (today, tz, first, last) => `&#9888; Hoy es <strong>${today}</strong> en ${tz}, fecha fuera del ` +
    `intervalo generado para esta demo (<strong>${first}</strong> a <strong>${last}</strong>). ` +
    `Se muestra la fecha disponible más cercana.`,
  la: (today, tz, first, last) => `&#9888; Hodie est <strong>${today}</strong> in ${tz}, dies extra ` +
    `intervallum ad hanc demonstrationem generatum (<strong>${first}</strong> usque ad <strong>${last}</strong>). ` +
    `Dies proxima disponibilis ostenditur.`,
};

function updateTzNote() {
  const left = leftSel.value;
  const tz = tzSel.value;
  const todayInTz = isoDateInTimeZone(tz);
  if (DATA.dates[todayInTz]) {
    tzNote.style.display = 'none';
  } else {
    tzNote.style.display = '';
    const first = DATA.date_order[0], last = DATA.date_order[DATA.date_order.length - 1];
    const build = TZNOTE_TEXT[left] || TZNOTE_TEXT.en;
    tzNote.innerHTML = build(todayInTz, tz.replace(/_/g, ' '), first, last);
  }
}

function onTzChange() {
  updateTzNote();
  dateSel.value = closestAvailableDate(isoDateInTimeZone(tzSel.value));
  render();
}
tzSel.addEventListener('change', onTzChange);

for (const code of DATA.languages) {
  for (const sel of [leftSel, rightSel]) {
    const o = document.createElement('option');
    o.value = code; o.textContent = LANG_NAMES[code] || code;
    sel.appendChild(o);
  }
}
leftSel.value = DATA.languages[0];
rightSel.value = DATA.languages[1] || DATA.languages[0];

function populateHourOptions() {
  const left = leftSel.value;
  const prev = hourSel.value;
  const labels = (DATA.hour_labels && DATA.hour_labels[left]) || {};
  const comingSoon = (DATA.chrome_labels[left] || DATA.chrome_labels.en).coming_soon;
  hourSel.innerHTML = '';
  for (const h of DATA.hour_order) {
    const o = document.createElement('option');
    o.value = h;
    o.textContent = labels[h] || h;
    if (!DATA.implemented_hours.includes(h)) {
      o.disabled = true;
      o.textContent += ' ' + comingSoon;
    }
    hourSel.appendChild(o);
  }
  hourSel.value = DATA.hour_order.includes(prev) ? prev : DATA.default_hour;
}

// Everything on the page - not just liturgical content - follows whichever
// language is on the left ("main"): control labels, the Hour names, the Date
// picker, the date heading. The right side is either "the vernacular" (when
// the main language is Latin) or just "a translation" (when it's already a
// vernacular language) - never a second thing to pick a hymn to sing in.
function updateChromeLabels() {
  const left = leftSel.value;
  const cl = DATA.chrome_labels[left] || DATA.chrome_labels.en;
  document.getElementById('tzLabel').textContent = cl.timezone;
  document.getElementById('dateLabel').textContent = cl.date;
  document.getElementById('hourLabel').textContent = cl.hour;
  document.getElementById('leftLabel').textContent = cl.main;
  document.getElementById('rightLabel').textContent = (left === 'la') ? cl.vernacular : cl.translation;
}

function applyChrome() {
  updateChromeLabels();
  populateHourOptions();
  populateDateOptions();
  populateTimezoneOptions();
  updateTzNote();
  render();
}
leftSel.addEventListener('change', applyChrome);

// First run: builds every dropdown (so dateSel actually has options), then
// picks "today" in the browser's own timezone now that there's something to
// select - applyChrome() alone would leave dateSel on its first option.
applyChrome();
dateSel.value = closestAvailableDate(isoDateInTimeZone(browserTz));
render();

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// breviarium-core's own text fields (responsorios, preces) carry a light
// markup convention meant for ITS renderer: '$X$' wraps a versicle/response
// marker (e.g. '$V. $') that should stand out, '_X_' wraps a fixed refrain
// that should be italic. Left alone, those literal $ and _ characters were
// leaking straight into the page. Applied AFTER esc() so the <strong>/<em>
// tags it introduces don't get escaped themselves.
function mdLite(escaped) {
  return escaped
    .replace(/\$([^$]*)\$/g, '<strong>$1</strong>')
    .replace(/_([^_]*)_/g, '<em>$1</em>');
}

function renderUnitContent(unit, lang) {
  const val = unit.content ? unit.content[lang] : null;
  if (val === null || val === undefined) return '<em>[not yet sourced]</em>';
  return mdLite(esc(val)).replace(/\n/g, '<br>');
}

// Psalms and canticles are stored as [verseNumber, text] pairs; hymns and the
// Our Father are stored as plain ordered line arrays. Both get aligned row by
// row (verse-by-verse / line-by-line) rather than as two whole stacked blocks,
// since the source data already keys them that way - a block-level pairing
// was only ever an approximation of that finer alignment.
function renderAlignedRows(unit, left, right, single) {
  const isPsalm = (unit.kind === 'psalm');
  const missingLabel = isPsalm ? '[missing]' : '[not yet sourced]';
  const leftRaw = unit.content ? unit.content[left] : null;
  const rightRaw = single ? leftRaw : (unit.content ? unit.content[right] : null);
  const leftEmpty = !leftRaw || leftRaw.length === 0;
  const rightEmpty = !rightRaw || rightRaw.length === 0;

  if (leftEmpty && rightEmpty) {
    return single
      ? `<tr><td class="single"><em>${missingLabel}</em></td></tr>`
      : `<tr><td class="col-left"><em>${missingLabel}</em></td><td class="col-right"><em>${missingLabel}</em></td></tr>`;
  }

  if (!single) {
    var rows = `<tr><td class="col-left"><div class="unit-label">${left.toUpperCase()}</div></td>` +
                `<td class="col-right"><div class="unit-label">${right.toUpperCase()}</div></td></tr>`;
  } else {
    var rows = '';
  }

  if (isPsalm) {
    const leftMap = new Map((leftRaw || []).map(([n, t]) => [String(n), t]));
    const rightMap = new Map((rightRaw || []).map(([n, t]) => [String(n), t]));
    const nums = Array.from(new Set([...leftMap.keys(), ...rightMap.keys()]))
      .sort((a, b) => parseInt(a, 10) - parseInt(b, 10));
    for (const n of nums) {
      const lt = leftMap.has(n) ? `<span class="vn">${esc(n)}</span> ${esc(leftMap.get(n))}` : '<em>&mdash;</em>';
      if (single) {
        rows += `<tr><td class="single">${lt}</td></tr>`;
      } else {
        const rt = rightMap.has(n) ? `<span class="vn">${esc(n)}</span> ${esc(rightMap.get(n))}` : '<em>&mdash;</em>';
        rows += `<tr><td class="col-left">${lt}</td><td class="col-right">${rt}</td></tr>`;
      }
    }
    return rows;
  }

  // 'lines' kind: aligned by position, not by any shared numbering.
  const maxLen = Math.max(leftRaw ? leftRaw.length : 0, rightRaw ? rightRaw.length : 0);
  for (let i = 0; i < maxLen; i++) {
    const lt = (leftRaw && leftRaw[i] !== undefined) ? mdLite(esc(leftRaw[i])) : '<em>&mdash;</em>';
    if (single) {
      rows += `<tr><td class="single hymn-line">${lt}</td></tr>`;
    } else {
      const rt = (rightRaw && rightRaw[i] !== undefined) ? mdLite(esc(rightRaw[i])) : '<em>&mdash;</em>';
      rows += `<tr><td class="col-left hymn-line">${lt}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    }
  }
  return rows;
}

// The hymn block picks WHICH HYMN to sing from that Hour's pool via its own
// dropdown, independent of leftLang/rightLang - these are Latin compositions,
// so the dropdown only ever offers a hymn's own original_language (there's no
// such thing as "this Latin hymn, but sung in Spanish"; a translation is for
// following along, not a second thing to pick). Its DEFAULT ordering favors
// hymns whose original language matches leftLang. rightLang always drives a
// translation of that same hymn, same as everywhere else on the page.
function renderHymnChoiceRows(unit, left, right) {
  const ctx = unit.hour;
  const pool = (DATA.hymn_pools && DATA.hymn_pools[ctx]) || [];
  const opts = pool
    .filter(h => h.lines[h.original_language] && h.lines[h.original_language].length)
    .map(h => ({ id: h.id, lang: h.original_language, title: h.title }));
  if (opts.length === 0) {
    return `<tr><td colspan="2"><em>[not yet sourced]</em></td></tr>`;
  }
  opts.sort((a, b) => (a.lang === left ? 0 : 1) - (b.lang === left ? 0 : 1));

  let choiceId = hymnChoiceByHour[ctx];
  if (!choiceId || !opts.some(o => o.id === choiceId)) {
    choiceId = opts[0].id;
    hymnChoiceByHour[ctx] = choiceId;
  }

  let selectHtml = `<select class="hymn-select" data-hour="${esc(ctx)}">`;
  for (const o of opts) {
    const picked = (o.id === choiceId) ? ' selected' : '';
    selectHtml += `<option value="${esc(o.id)}"${picked}>` +
      `${esc(o.title)} (${esc(LANG_NAMES[o.lang] || o.lang)})</option>`;
  }
  selectHtml += `</select>`;
  let rows = `<tr><td colspan="2" class="hymn-picker">${selectHtml}</td></tr>`;

  const hymn = pool.find(h => h.id === choiceId);
  const sungLines = hymn.lines[hymn.original_language] || [];
  const translatedLines = hymn.lines[right] || [];
  const single = (hymn.original_language === right);

  if (single) {
    for (const line of sungLines) {
      rows += `<tr><td class="single hymn-line">${esc(line)}</td></tr>`;
    }
  } else if (translatedLines.length === 0) {
    sungLines.forEach((line, i) => {
      const rt = (i === 0) ? '<em>[not yet sourced]</em>' : '';
      rows += `<tr><td class="col-left hymn-line">${esc(line)}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    });
  } else {
    const maxLen = Math.max(sungLines.length, translatedLines.length);
    for (let i = 0; i < maxLen; i++) {
      const lt = sungLines[i] !== undefined ? esc(sungLines[i]) : '';
      const rt = translatedLines[i] !== undefined ? esc(translatedLines[i]) : '';
      rows += `<tr><td class="col-left hymn-line">${lt}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    }
  }
  return rows;
}

function onHymnSelectChange(e) {
  const sel = e.target;
  hymnChoiceByHour[sel.dataset.hour] = sel.value;
  render();
}

function render() {
  const dayData = DATA.dates[dateSel.value];
  const left = leftSel.value, right = rightSel.value;
  const hour = hourSel.value;
  const single = (left === right);

  // The heading leads with what's actually being celebrated (a feast/solemnity
  // name, or the full ferial description) - never the bare weekday label alone,
  // since "Feria V" on a major feast day would misleadingly read as "just an
  // ordinary Thursday." The raw calendar date is secondary, shown underneath.
  document.getElementById('dateHeading').innerHTML = dayData.day_description[left] || dayData.day_description.en;
  document.getElementById('metaLine').textContent = (dayData.date_human[left] || dayData.date_human.en);

  const units = dayData.hours[hour] || [];
  const labels = DATA.unit_labels[left] || DATA.unit_labels.en;
  const table = document.getElementById('mainTable');
  let html = '';
  for (const unit of units) {
    let labelText = labels[unit.label] || unit.label;
    if (unit.repeated) labelText += ' ' + (labels.repeated || '');
    if (unit.ref) labelText += ` (${esc(unit.ref)})`;
    html += `<tr><th colspan="2">${esc(labelText)}</th></tr>`;
    if (unit.label === 'psalmody_gap') {
      html += `<tr><td colspan="2"><em>${esc(labels.psalmody_gap_note || labels.missing)}</em></td></tr>`;
    } else if (unit.label === 'vespers_omitted_holy_saturday') {
      html += `<tr><td colspan="2"><em>${esc(labels.vespers_omitted_holy_saturday_note || labels.missing)}</em></td></tr>`;
    } else if (unit.kind === 'psalm' || unit.kind === 'lines') {
      html += renderAlignedRows(unit, left, right, single);
    } else if (unit.kind === 'hymn_choice') {
      html += renderHymnChoiceRows(unit, left, right);
    } else if (single) {
      html += `<tr><td class="single">${renderUnitContent(unit, left)}</td></tr>`;
    } else {
      html += `<tr><td class="col-left"><div class="unit-label">${left.toUpperCase()}</div>${renderUnitContent(unit, left)}</td>` +
              `<td class="col-right"><div class="unit-label">${right.toUpperCase()}</div>${renderUnitContent(unit, right)}</td></tr>`;
    }
  }
  table.innerHTML = html;
  table.querySelectorAll('.hymn-select').forEach(sel => sel.addEventListener('change', onHymnSelectChange));
}

leftSel.addEventListener('change', render);
rightSel.addEventListener('change', render);
hourSel.addEventListener('change', render);
dateSel.addEventListener('change', render);
render();
</script>
</body></html>
