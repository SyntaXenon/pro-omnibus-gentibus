imogenitus ex mortuis : ut sit in omnibus ipse primatum tenens :"], ["19", "quia in ipso complacuit, omnem plenitudinem inhabitare :"], ["20", "et per eum reconciliare omnia in ipsum, pacificans per sanguinem crucis ejus, sive quae in terris, sive quae in caelis sunt."]], "es": [["12", "dando gracias á Dios Padre, que nos ha hecho dignos de participar de la suerte y herencia úc los santos, iluminándonos con la luz del Evanyelio;"], ["13", "que nos ha arrebatado del poder de las tinieblas, y trasladado al reino de su Hijo muy amado;"], ["14", "por cuya sangre hemos sido nosotros rescatados, y recibido la remisión de los pecados;"], ["15", "y el cual es imágen perfecta del Dios invisible, engendrado ab eterno ante toda criatura;"], ["16", "pues por él fueron criadas todas las cosas en los cielos y en la tierra, las visibles y las invisibles, ora sean tronos, ora dominaciones, ora principados, ora potestades; todas las cosas fueron criadas por él mismo, y en atención á él mismo:"], ["17", "y así él tiene ser ante todas las cosas, y todas subsisten por él, y por él son conservadas."], ["18", "Y él es la cabeza del cuerpo de la Iglesia, y el principio de la resurrección, el primero á renacer de entre los muertos, para que en todo tenga él la primacía;"], ["19", "pues plugo al Padre poner en él la plenitud de todo ser,"], ["20", "y reconciliar por él todas las cosas consigo, restableciendo la paz entre cielo y tierra, por medio de la sangre que derramó en la cruz."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El Espíritu del Señor está sobre mí; me ha enviado para dar la Buena Noticia a los pobres._", "la": "Spíritus Dómini super me, evangelizáre paupéribus misit me."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "phil 4:4-5", "content": {"la": [["4", "Gaudete in Domino semper : iterum dico gaudete."], ["5", "Modestia vestra nota sit omnibus hominibus : Dominus prope est."]], "es": [["4", "Vivid siempre alegres en el Señor: vivid alegres repito '."], ["5", "Sea vuestra modestia * patente á lodos los hombres: el Señor está cerca."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Osténde nobis, Dómine,* Misericórdiam tuam. Osténde.", "℟. Et salutáre tuum da nobis.* Misericórdiam tuam. Glória Patri. Osténde."], "es": ["$℣. $Muéstranos, Señor,  tu  misericordia.", "$℟. $Muéstranos, Señor,  tu  misericordia.", "$℣. $Danos tu salvación.", "$℟. $Tu  misericordia.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Muéstranos, Señor,  tu  misericordia."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Oh Adonai, Pastor de la casa de Israel, que te apareciste a Moisés en la zarza ardiente y en el Sinaí le diste tu ley, ven a librarnos con el poder de tu brazo._", "la": "O Adonái, et Dux domus Israel, qui Móysi in igne flammæ rubi apparuísti, et ei in Sina legem dedísti: veni ad rediméndum nos in brácchio exténto."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_Oh Adonai, Pastor de la casa de Israel, que te apareciste a Moisés en la zarza ardiente y en el Sinaí le diste tu ley, ven a librarnos con el poder de tu brazo._", "la": "O Adonái, et Dux domus Israel, qui Móysi in igne flammæ rubi apparuísti, et ei in Sina legem dedísti: veni ad rediméndum nos in brácchio exténto."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christum redemptórem, fratres caríssimi, exorémus, qui venit ad salvándos hómines, eíque fidénter dicámus:", "– Veni, Dómine Iesu.", "Christe Dómine, qui per suscéptæ mystérium carnis notam fecísti mundo glóriam tuæ divinitátis,", "vivífica nos advéntu tuo.", "– Veni, Dómine Iesu.", "Tu, qui suscepísti infirmitátem nostram,", "concéde nobis misericórdiam tuam.", "– Veni, Dómine Iesu.", "Qui, primo véniens húmilis, redemísti mundum a crímine,", "secúndo advéniens, iustífica nos ab omni reátu.", "– Veni, Dómine Iesu.", "Tu, qui es benedíctus et vivis et ómnia regis,", "per misericórdiam tuam fac nos accédere ad ætérnam hereditátem.", "– Veni, Dómine Iesu.", "Qui sedes ad déxteram Patris,", "lúmine vultus tui ánimas defunctórum lætífica.", "– Veni, Dómine Iesu."], "es": ["Oremos, hermanos, a Cristo, el Señor, que viene a salvar a todos los hombres y digámosle confiadamente:", "- Señor Jesucristo, que por el misterio de la encarnación manifestaste al mundo la gloria de tu divinidad, _vivifica al mundo con tu venida._ _Ven, Señor, Jesús._", "- Tú que participaste de nuestra debilidad, _concédenos tu misericordia._ _Ven, Señor, Jesús._", "- Tú que viniste humildemente para salvar al mundo de sus pecados, _cuando vuelvas de nuevo con gloria y majestad, absuélvenos de todas las culpas._ _Ven, Señor, Jesús._", "- Tú que lo gobiernas todo con tu poder, _ayúdanos, por tu bondad, a alcanzar la herencia eterna._ _Ven, Señor, Jesús._", "- Tú que estás sentado a la derecha del Padre, _alegra con la visión de tu rostro a nuestros hermanos difuntos._ _Ven, Señor, Jesús._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Concéde, quǽsumus, omnípotens Deus, ut, qui sub peccáti iugo ex vetústa servitúte deprímimur, exspectáta Unigéniti tui nova nativitáte liberémur. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Concédenos, Señor, a los que vivimos oprimidos por la antigua esclavitud del pecado ser liberados por el nuevo y esperado nacimiento de tu Hijo. Que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Domine, Deus salutis meae, in die clamavi et nocte coram te.", "es": "Señor, Dios de mi salvación, de día y de noche clamo ante ti."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 87", "content": {"la": [["1", "Canticum Psalmi, filiis Core, in finem, pro Maheleth ad respondendum. Intellectus Eman Ezrahitae."], ["2", "Domine, Deus salutis meae, in die clamavi et nocte coram te."], ["3", "Intret in conspectu tuo oratio mea, inclina aurem tuam ad precem meam."], ["4", "Quia repleta est malis anima mea, et vita mea inferno appropinquavit."], ["5", "Aestimatus sum cum descendentibus in lacum, factus sum sicut homo sine adjutorio,"], ["6", "inter mortuos liber; sicut vulnerati dormientes in sepulchris, quorum non es memor amplius, et ipsi de manu tua repulsi sunt."], ["7", "Posuerunt me in lacu inferiori, in tenebrosis, et in umbra mortis."], ["8", "Super me confirmatus est furor tuus, et omnes fluctus tuos induxisti super me."], ["9", "Longe fecisti notos meos a me, posuerunt me abominationem sibi. Traditus sum, et non egrediebar;"], ["10", "oculi mei languerunt prae inopia. Clamavi ad te, Domine, tota die; expandi ad te manus meas."], ["11", "Numquid mortuis facies mirabilia? aut medici suscitabunt, et confitebuntur tibi?"], ["12", "Numquid narrabit aliquis in sepulchro misericordiam tuam, et veritatem tuam in perditione?"], ["13", "Numquid cognoscentur in tenebris mirabilia tua? et justitia tua in terra oblivionis?"], ["14", "Et ego ad te, Domine, clamavi, et mane oratio mea praeveniet te."], ["15", "Ut quid, Domine, repellis orationem meam, avertis faciem tuam a me?"], ["16", "Pauper sum ego, et in laboribus a juventute mea; exaltatus autem, humiliatus sum et conturbatus."], ["17", "In me transierunt irae tuae, et terrores tui conturbaverunt me :"], ["18", "circumdederunt me sicut aqua tota die; circumdederunt me simul."], ["19", "Elongasti a me amicum et proximum, et notos meos a miseria."]], "es": [["2", "Para los hijos de Coré, hasta el fin, sobre Mahelet; para cantarse alternativamente. Instrucción de Emán ezraíta. Señor Dios de mi salud, día y noche estoy clamando tu presencia."], ["3", "Sea recibida mi oración en tu presencia; da oídos a mi súplica;"], ["4", "porque mi alma está harta de males, y tengo ya un pie en el sepulcro."], ["5", "Ya me cuentan entre los muertos; he venido a ser como un hombre desamparado de todos,"], ["6", "relegado entre los muertos, como los acuchillados que yacen en los sepulcros y de quienes no te acuerdas ya, como desechados de tu mano."], ["7", "Me pusieron en un profundo calabozo, en lugares tenebrosos, entre las sombras de la muerte."], ["8", "Tu furor carga de firme sobre mí, y has hecho que se estrellaran en mí todas las olas."], ["9", "Alejaste de mí mis conocidos, me miraron como objeto de su abominación. Cogido estoy, y no hallo salida."], ["10", "Me flaquearon de miseria los ojos. A ti clamé, ¡oh Señor!, todo el día; hacia ti tuve extendidas mis manos."], ["11", "¿Harás tú por ventura milagros en favor de los muertos? Acaso los médicos los resucitarán, para que canten tus alabanzas?"], ["12", "¿Habrá tal vez alguno que en el sepulcro publique tu misericordia, o desde la tumba tu verdad?"], ["13", "¿Cómo han de ser conocidas en las tinieblas tus maravillas, y tu justicia en la región del olvido?"], ["14", "Por eso yo clamo a ti, ¡oh Señor!, y me adelanto a la aurora para presentarte mi oración."], ["15", "¿Por qué, oh Señor, desechas mis ruegos y me escondes tu rostro?"], ["16", "Yo viví pobre, y me crié en trabajos desde mi tierna edad; no bien fui ensalzado, cuando me vi humillado y abatido."], ["17", "Sobre mí ha recaído tu ira; y tus terrores me conturbaron."], ["18", "Me inundan éstos cada día como avenidas de agua; me cercan todos a una."], ["19", "Has alejado de mí a mis amigos, parientes y conocidos, por causa de mis desastres."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Domine, Deus salutis meae, in die clamavi et nocte coram te.", "es": "Señor, Dios de mi salvación, de día y de noche clamo ante ti."}}, {"kind": "psalm", "label": "reading", "ref": "Jer 14:9a", "content": {"la": [["9", "Quare futurus es velut vir vagus, ut fortis qui non potest salvare? Tu autem in nobis es, Domine, et nomen tuum invocatum est super nos : ne derelinquas nos."]], "es": [["9", "¿ Por qué has de ser para tu pueblo como un hombre que va divagando, ó como un campeón sin fuerzas para salvar? Ello es, oh Señor, que tú habitas entre nosotros â¢, y nosotros llevamos el nombr* de pueblo tuyo: no nos abandones pues."]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Concede nos, omnipotens Deus, ita sepulto Unigenito tuo fideliter inhærere, ut cum ipso in novitate vitæ resurgere mereamur. Qui vivit et regnat in sæcula sæculorum.", "es": "Señor, Dios todopoderoso: ya que con nuestro descanso vamos a imitar a tu Hijo que reposó en el sepulcro, te pedimos que, al levantarnos mañana, le imitemos también resucitando a una vida nueva. Por Jesucristo nuestro Señor."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-12-19": {"date_human": {"en": "Saturday, December 19, 2026", "es": "Sábado, 19 de diciembre de 2026", "la": "Sabbato, die 19 Decembris, anno 2026"}, "day_description": {"en": "December 19, Advent", "es": "19 de diciembre, Adviento", "la": "Feria propria diei 19 Decembris, Adventus"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_A ti, Señor, levanto mi alma; ven y líbrame, Señor, que en ti confío._", "la": "Ad te Dómine levávi ánimam meam. Veni et éripe me; Dómine ad te confúgi."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 86", "content": {"la": [["1", "Filiis Core. Psalmus cantici. Fundamenta ejus in montibus sanctis;"], ["2", "diligit Dominus portas Sion super omnia tabernacula Jacob."], ["3", "Gloriosa dicta sunt de te, civitas Dei!"], ["4", "Memor ero Rahab et Babylonis, scientium me; ecce alienigenae, et Tyrus, et populus Aethiopum, hi fuerunt illic."], ["5", "Numquid Sion dicet : Homo et homo natus est in ea, et ipse fundavit eam Altissimus?"], ["6", "Dominus narrabit in scripturis populorum et principum, horum qui fuerunt in ea."], ["7", "Sicut laetantium omnium habitatio est in te."]], "es": [["1", "Sobre los montes santos está Jerusalén fundada."], ["2", "Ama el Señor las puertas de Sión más que todos los tabernáculos de Jacob."], ["3", "Gloriosas cosas se han dicho de ti, ¡oh ciudad de Dios!"], ["4", "Yo haré memoria de Rahab y de Babilonia, gentes que tienen noticia de mí. He aquí que los filisteos, los de Tiro y el pueblo de los etíopes, todos ésos allí estarán."], ["5", "¿No se dirá entonces de Sión: Hombres y más hombres han nacido en ella, y el mismo Altísimo es quien la ha fundado?"], ["6", "Sólo el Señor podrá contar en sus listas de los pueblos y de los príncipes, el número de los que han morado en ella."], ["7", "Llenos de gozo están, ¡oh Sión!, todos cuanto en ti habitan."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_A ti, Señor, levanto mi alma; ven y líbrame, Señor, que en ti confío._", "la": "Ad te Dómine levávi ánimam meam. Veni et éripe me; Dómine ad te confúgi."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Da su paga, Señor, a los que esperan en ti, para que tus profetas sean hallados veraces._", "la": "Da mercédem, Dómine, sustinéntibus te, ut prophétæ tui fidéles inveniántur."}}, {"kind": "psalm", "label": "canticle", "ref": "isa 40:10-17", "content": {"la": [["10", "ecce Dominus Deus in fortitudine veniet, et brachium ejus dominabitur, ecce merces ejus cum eo, et opus illius coram illo."], ["11", "Sicut pastor gregem suum pascet, in brachio suo congregabit agnos, et in sinu suo levabit; foetas ipse portabit."], ["12", "Quis mensus est pugillo aquas, et caelos palmo ponderavit? Quis appendit tribus digitis molem terrae, et liberavit in pondere montes, et colles in statera?"], ["13", "Quis adjuvit spiritum Domini? aut quis consiliarius ejus fuit, et ostendit illi?"], ["14", "Cum quo iniit consilium, et instruxit eum, et docuit eum semitam justitiae, et erudivit eum scientiam, et viam prudentiae ostendit illi?"], ["15", "Ecce gentes quasi stilla situlae, et quasi momentum staterae reputatae sunt; ecce insulae quasi pulvis exiguus."], ["16", "Et Libanus non sufficiet ad succendendum; et animalia ejus non sufficient ad holocaustum."], ["17", "Omnes gentes quasi non sint, sic sunt coram eo, et quasi nihilum et inane reputatae sunt ei."]], "es": [["10", "hé aquí que viene el Señor vuestro Dios con infinito poder, y dominará con la fuerza de su brazo: mirad, él lleva consigo su recompensa para los que le sigan, y tiene á la vista suobra de la redención del mundo."], ["12", "¿ Quién es aquel que ha medido las aguas del Océa?io en el hueco de la palma de su mano, y extendiendo esta, ha pesado los cielos? ¿quién es el que con solos tres dedos sostiene la gran mole de la tierra, y pesa los montes y los collados como en una romana?"], ["13", "¿ Quién ayudó al espíritu del Señor? ¿ó quién fue su consejero \", ó le comunicó alguna idea?"], ["14", "¿ A quién llamó él á consulta, ó quién hay que le haya instruido á él, ó mostrádole la senda de la justicia, ó comunicádole la ciencia, ó le haya hecho conocer el camino de la prudencia?"], ["16", "Cuantos árboles hay en el Líbano, no bastarían para encender el fuego de su altar; ni todos sus animales para ser un holocausto digno de él."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Da su paga, Señor, a los que esperan en ti, para que tus profetas sean hallados veraces._", "la": "Da mercédem, Dómine, sustinéntibus te, ut prophétæ tui fidéles inveniántur."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Vuélvete, Señor, a nosotros y no tardes más en venir._", "la": "Convértere, Dómine, aliquántulum, et ne tardes veníre ad servos tuos."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 98", "content": {"la": [["1", "Psalmus ipsi David. Dominus regnavit : irascantur populi; qui sedet super cherubim : moveatur terra."], ["2", "Dominus in Sion magnus, et excelsus super omnes populos."], ["3", "Confiteantur nomini tuo magno, quoniam terribile et sanctum est,"], ["4", "et honor regis judicium diligit. Tu parasti directiones; judicium et justitiam in Jacob tu fecisti."], ["5", "Exaltate Dominum Deum nostrum et adorate scabellum pedum ejus, quoniam sanctum est."], ["6", "Moyses et Aaron in sacerdotibus ejus, et Samuel inter eos qui invocant nomen ejus; invocabant Dominum, et ipse exaudiebat eos;"], ["7", "in columna nubis loquebatur ad eos. Custodiebant testimonia ejus, et praeceptum quod dedit illis."], ["8", "Domine Deus noster, tu exaudiebas eos; Deus, tu propitius fuisti eis, et ulciscens in omnes adinventiones eorum."], ["9", "Exaltate Dominum Deum nostrum, et adorate in monte sancto ejus, quoniam sanctus Dominus Deus noster."]], "es": [["1", "Reina ya el Señor, que se estremezcan los pueblos; reina ya aquel que está sentado sobre los querubines, agítese la tierra."], ["2", "El Señor en Sión es grande, elevado está sobre todos los pueblos."], ["3", "Tributen gloria a tu gran Nombre, por cuanto él es terrible y santo;"], ["4", "y la gloria del rey está en amar la justicia. Tú estableciste leyes rectísimas; tú ejerciste el juicio y la justicia en el pueblo de Jacob."], ["5", "Ensalzad al Señor Dios nuestro, y adorad el arca, estrado de sus pies: porque él es el Santo."], ["6", "Moisés y Aarón entre sus sacerdotes, y Samuel el más distinguido entre los que invocaban su Nombre. Ellos clamaban al Señor, y el Señor les oía benigno."], ["7", "Les hablaba desde una columna de nube. Observaban sus mandamientos y el fuero que les había dado."], ["8", "¡Oh Señor Dios nuestro!, tú atendías a sus ruegos, les fuiste propicio, ¡oh Dios!, aun vengando todas las injurias que te hacían."], ["9", "Ensalzad al Señor nuestro Dios, y adoradle en su santo monte; porque el Señor Dios nuestro es el santo por excelencia."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Vuélvete, Señor, a nosotros y no tardes más en venir._", "la": "Convértere, Dómine, aliquántulum, et ne tardes veníre ad servos tuos."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "isa 2:3", "content": {"la": [["3", "et ibunt populi multi, et dicent : Venite, et ascendamus ad montem Domini, et ad domum Dei Jacob; et docebit nos vias suas, et ambulabimus in semitis ejus, quia de Sion exibit lex, et verbum Domini de Jerusalem."]], "es": [["3", "Y vendrán muchos pueblos y dirán: Ea, subamos al monte del Señor, y á la Casa del Dios de Jacob, y él mismo nos mostrará sus caminos, y por sus sendas andaremos: porque de Sion saldrá la Ley, y de Jerusalem la palabra del Señor."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Super te, Ierúsalem, * Oriétur Dóminus. Super te.", "℟. Et glória eius in te vidébitur.* Oriétur Dóminus. Glória Patri. Super te."], "es": ["$℣. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℣. $Su gloria aparecerá sobre ti.", "$℟. $Amanecerá el Señor.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El Salvador del mundo aparecerá como el sol naciente, y como la lluvia que empapa la tierra descenderá al seno de la Virgen. Aleluya._", "la": "Oriétur sicut sol Salvátor mundi, et descéndet in úterum Vírginis sicut imber super gramen, allelúia."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_El Salvador del mundo aparecerá como el sol naciente, y como la lluvia que empapa la tierra descenderá al seno de la Virgen. Aleluya._", "la": "Oriétur sicut sol Salvátor mundi, et descéndet in úterum Vírginis sicut imber super gramen, allelúia."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christum redemptórem, fratres caríssimi, deprecémur, qui véniet, ut redeúntes ad se a mortis potestáte líberet, et súpplices implorémus:", "– Veni, Dómine Iesu.", "Tuum, Dómine, dum annuntiámus advéntum,", "munda cor nostrum ab omni spíritu vanitátis.", "– Veni, Dómine Iesu.", "Ecclésia tua, Dómine, quam fundásti,", "te per omnes gentes magníficet.", "– Veni, Dómine Iesu.", "Lex tua, Dómine, illúminans óculos,", "prótegat pópulos tíbimet confiténtes.", "– Veni, Dómine Iesu.", "Qui gáudia advéntus tui nobis ab Ecclésia prænuntiári concédis,", "fac ut promptíssima devotióne te excipiámus.", "– Veni, Dómine Iesu."], "es": ["Oremos, hermanos, a Cristo, el redentor, que viene a librar del poder de la muerte a los que se convierten a él, y digámosle:", "- Que al anunciar tu venida, Señor, _nuestro corazón se sienta libre de toda vanidad._ _Ven, Señor Jesús._", "- Que la Iglesia, que tú fundaste, _glorifique, Señor, tu nombre por todo el mundo._ _Ven, Señor Jesús._", "- Que tu ley, Señor, sea luz para nuestros ojos, _y sirva de protección a los pueblos que confiesan tu nombre._ _Ven, Señor Jesús._", "- Tú, que por la Iglesia nos anuncias el gozo de tu venida, _concédenos también el deseo de recibirte._ _Ven, Señor Jesús._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Deus, qui splendórem glóriæ tuæ per sacræ Vírginis partum mundo dignátus es reveláre, tríbue, quǽsumus, ut tantæ incarnatiónis mystérium et fídei integritáte colámus et devóto semper obséquio frequentémus. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Dios y Señor nuestro, que en el parto de la Virgen María has querido revelar al mundo entero el esplendor de tu gloria, asístenos con tu gracia, para que proclamemos con fe íntegra y celebremos con piedad sincera el misterio admirable de la encarnación de tu Hijo. Que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_A ti, Señor, levanto mi alma; ven y líbrame, Señor, que en ti confío._", "la": "Ad te Dómine levávi ánimam meam. Veni et éripe me; Dómine ad te confúgi."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 131:1-10", "content": {"la": [["1", "Canticum graduum. Memento, Domine, David, et omnis mansuetudinis ejus;"], ["2", "sicut juravit Domino, votum vovit Deo Jacob :"], ["3", "Si introiero in tabernaculum domus meae; si ascendero in lectum strati mei;"], ["4", "si dedero somnum oculis meis, et palpebris meis dormitationem,"], ["5", "et requiem temporibus meis, donec inveniam locum Domino, tabernaculum Deo Jacob."], ["6", "Ecce audivimus eam in Ephrata; invenimus eam in campis silvae."], ["7", "Introibimus in tabernaculum ejus; adorabimus in loco ubi steterunt pedes ejus."], ["8", "Surge, Domine, in requiem tuam, tu et arca sanctificationis tuae."], ["9", "Sacerdotes tui induantur justitiam, et sancti tui exsultent."], ["10", "Propter David, servum tuum, non avertas faciem christi tui."]], "es": [["1", "Acuérdate de David, ¡oh Señor!, y de toda su gran mansedumbre;"], ["2", "de cómo juró al Señor, e hizo voto al Dios de Jacob, diciendo:"], ["3", "No me meteré yo al abrigo de mi casa; no subiré a reposar en mi lecho;"], ["4", "no pegaré mis ojos, ni cerraré mis párpados."], ["5", "ni reclinaré mis sienes hasta que tenga una habitación para el Señor, un Tabernáculo para el Dios de Jacob."], ["6", "Nosotros hemos oído que su morada estaba antes en Silo, tierra de Efrata: la hallamos después en Cariatiarim o Campos de la Selva."], ["7", "Entraremos, pues, en su pabellón, adoraremos la peana de sus pies, y le diremos:"], ["8", "¡Oh Señor!, levántate, y ven al lugar de tu morada, tú y el arca en que brilla tu santidad."], ["9", "Que se revistan de justicia o santidad tus sacerdotes, y se regocijen tus santos."], ["10", "Por amor de David, siervo tuyo, no apartes tu rostro de tu ungido."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_A ti, Señor, levanto mi alma; ven y líbrame, Señor, que en ti confío._", "la": "Ad te Dómine levávi ánimam meam. Veni et éripe me; Dómine ad te confúgi."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Da su paga, Señor, a los que esperan en ti, para que tus profetas sean hallados veraces._", "la": "Da mercédem, Dómine, sustinéntibus te, ut prophétæ tui fidéles inveniántur."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 131:11-18", "content": {"la": [["11", "Juravit Dominus David veritatem, et non frustrabitur eam : De fructu ventris tui ponam super sedem tuam."], ["12", "Si custodierint filii tui testamentum meum, et testimonia mea haec quae docebo eos, et filii eorum usque in saeculum sedebunt super sedem tuam."], ["13", "Quoniam elegit Dominus Sion, elegit eam in habitationem sibi."], ["14", "Haec requies mea in saeculum saeculi; hic habitabo, quoniam elegi eam."], ["15", "Viduam ejus benedicens benedicam; pauperes ejus saturabo panibus."], ["16", "Sacerdotes ejus induam salutari, et sancti ejus exsultatione exsultabunt."], ["17", "Illuc producam cornu David; paravi lucernam christo meo."], ["18", "Inimicos ejus induam confusione; super ipsum autem efflorebit sanctificatio mea."]], "es": [["11", "Juró el Señor a David esta promesa, que no se retractará: Colocaré sobre tu trono a tu descendencia."], ["12", "Con tal que tus hijos sean fieles a mi alianza y a los preceptos que yo les enseñaré, aun los hijos de éstos ocuparán tu trono a tu descendencia."], ["13", "Porque el Señor ha escogido para sí a Sión, la ha elegido para habitación suya, diciendo:"], ["14", "Este es para siempre el lugar de mi reposo; aquí habitaré porque éste es el sitio que me he escogido."], ["15", "Colmaré de bendiciones a sus viudas; hartaré de pan a sus pobres."], ["16", "Revestiré a sus sacerdotes de santidad; y sus santos o fieles siervos saltarán de júbilo."], ["17", "Aquí haré florecer el cetro de David; preparada tengo una antorcha a mi ungido."], ["18", "A sus enemigos los cubriré de oprobio; mas en él brillará la gloria de mi propia santidad."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Da su paga, Señor, a los que esperan en ti, para que tus profetas sean hallados veraces._", "la": "Da mercédem, Dómine, sustinéntibus te, ut prophétæ tui fidéles inveniántur."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Vuélvete, Señor, a nosotros y no tardes más en venir._", "la": "Convértere, Dómine, aliquántulum, et ne tardes veníre ad servos tuos."}}, {"kind": "psalm", "label": "canticle", "ref": "rev 11:17-18;12:10-12", "content": {"la": [["11:17", "Gratias agimus tibi, Domine Deus omnipotens, qui es, et qui eras, et qui venturus es : quia accepisti virtutem tuam magnam, et regnasti."], ["11:18", "Et iratae sunt gentes, et advenit ira tua et tempus mortuorum judicari, et reddere mercedem servis tuis prophetis, et sanctis, et timentibus nomen tuum pusillis et magnis, et exterminandi eos qui corruperunt terram."], ["12:10", "Et audivi vocem magnam in caelo dicentem : Nunc facta est salus, et virtus, et regnum Dei nostri, et potestas Christi ejus : quia projectus est accusator fratrum nostrorum, qui accusabat illos ante conspectum Dei nostri die ac nocte."], ["12:11", "Et ipsi vicerunt eum propter sanguinem Agni, et propter verbum testimonii sui, et non dilexerunt animas suas usque ad mortem."], ["12:12", "Propterea laetamini caeli, et qui habitatis in eis. Vae terrae, et mari, quia descendit diabolus ad vos habens iram magnam, sciens quod modicum tempus habet."]], "es": [["11:17", "Gracias te tributamos ¡ oh Señor Dios todopoderoso! á ti que eres, que eras ya antes, y que has de venir; porque hiciste alarde de tu gran poderío, y has entrado en posesión de tu reino 'â¢"], ["11:18", "Las naciones montaron en cólera '; mas sobrevino tu ira, y el tiempo de ser juzgados los muertos, y de dar el galardón á tus siervos los Profetas, y á los santos, y á los que temen tu nombre, chicos y grandes, y de acabar con los que han corrompido la tierra."], ["12:10", "Entonces oí una voz sonora en el cielo que decía: Hé aquí el tiempo de salvación, de la potencia, y del reino de nuestro Dios, y del poder de su Christo: porque ha sido ya precipitado del cielo el acusador de nuestros hermanos, que los acusaba dia y noche ante la presencia de nuestro Dios."], ["12:11", "Y ellos le vencieron por los méritos de la sangre del Cordero, y en virtud de la palabra de la fe que han confesado, y por la cual desamaron sus vidas, hasta perderlas por obedecer á Dios."], ["12:12", "Por tanto regocijaos ¡ oh cielos, y los que en ellos moráis! ¡ Ay de la tierra, y del mar! porque el diablo bajó á vosotros arrojado del cielo, y está lleno de furor, sabiendo que le queda poco tiempo."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Vuélvete, Señor, a nosotros y no tardes más en venir._", "la": "Convértere, Dómine, aliquántulum, et ne tardes veníre ad servos tuos."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "phil 3:20-21", "content": {"la": [["20", "Nostra autem conversatio in caelis est : unde etiam Salvatorem exspectamus Dominum nostrum Jesum Christum,"], ["21", "qui reformabit corpus humilitatis nostrae, configuratum corpori claritatis suae, secundum operationem, qua etiam possit subjicere sibi omnia."]], "es": [["20", "Pero nosotros vivimos ya como ciudadanos del cielo; de donde asimismo estamos aguardando al Salvador Jesu-Christo Señor nuestro,"], ["21", "el cual trasformará nuestro vil cuerpo, y le hará conforme al suyo glorioso, con la misma virtud eficaz, con que puede también sujetar á su imperio todas las cosas y hacer cuanto quiera de ellas."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Veni ad liberándum nos,* Dómine Deus virtútum. Veni.", "℟. Osténde fáciem tuam et salvi érimus.* Dómine Deus virtútum. Glória Patri. Veni."], "es": ["$℣. $Despierta tu poder y ven a salvarnos, Señor Dios de los ejércitos.", "$℟. $Despierta tu poder y ven a salvarnos, Señor Dios de los ejércitos.", "$℣. $Que brille tu rostro y nos salve.", "$℟. $Señor Dios de los ejércitos.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Despierta tu poder y ven a salvarnos, Señor Dios de los ejércitos."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Oh Renuevo del tronco de Jesé, que te alzas como un signo para los pueblos, ante quien los reyes enmudecen y cuyo auxilio imploran las naciones, ven a librarnos, no tardes más._", "la": "O Radix Iesse, qui stas in signum populórum, super quem continébunt reges os suum, quem Gentes deprecabúntur: veni ad liberándum nos, iam noli tardáre."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_Oh Renuevo del tronco de Jesé, que te alzas como un signo para los pueblos, ante quien los reyes enmudecen y cuyo auxilio imploran las naciones, ven a librarnos, no tardes más._", "la": "O Radix Iesse, qui stas in signum populórum, super quem continébunt reges os suum, quem Gentes deprecabúntur: veni ad liberándum nos, iam noli tardáre."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christo Dómino, fratres caríssimi, supplicémus, qui est iudex vivórum et mortuórum dicamúsque fidénter:", "– Veni, Dómine Iesu.", "Fac, Dómine, ut iustítiam tuam, quam cæli annúntiant, mundus agnóscat", "et glória tua hábitet in terra nostra.", "– Veni, Dómine Iesu.", "Qui infirmári pro nobis dignáris ut homo,", "divinitátis tuæ hómines præmuníre dignéris præsídio.", "– Veni, Dómine Iesu.", "Veni et sciéntiæ tuæ irrádia splendóre,", "quos in ténebris ignorántiæ tui cónspicis detinéri.", "– Veni, Dómine Iesu.", "Qui, humiliátus, iniquitátem nostram abstulísti,", "gloriósus, beatitúdinis prǽmia nobis largíre.", "– Veni, Dómine Iesu.", "Qui ventúrus es ad iudícium maniféste,", "defúnctos fratres ad cælórum regnum perdúcas.", "– Veni, Dómine Iesu."], "es": ["Supliquemos, hermanos, a Cristo, juez de vivos y muertos, y digámosle confiados:", "- Haz, Señor, que tu justicia, que pregonan los cielos, también la reconozca el mundo, _para que tu gloria habite en nuestra tierra._ _Ven, Señor Jesús._", "- Tú que por nosotros quisiste ser débil en tu humanidad, _fortalece a los hombres con la fuerza de tu divinidad._ _Ven, Señor Jesús._", "- Ven, Señor, y con la luz de tu palabra _ilumina a los que viven sumergidos en las tinieblas de la ignorancia._ _Ven, Señor Jesús._", "- Tú que con tu humillación borraste nuestros pecados, _por tu glorificación llévanos a la felicidad eterna._ _Ven, Señor Jesús._", "- Tú que vendrás a juzgar al mundo con gloria y majestad, _lleva a nuestros hermanos difuntos al reino de los cielos._ _Ven, Señor Jesús._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Deus, qui splendórem glóriæ tuæ per sacræ Vírginis partum mundo dignátus es reveláre, tríbue, quǽsumus, ut tantæ incarnatiónis mystérium et fídei integritáte colámus et devóto semper obséquio frequentémus. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Dios y Señor nuestro, que en el parto de la Virgen María has querido revelar al mundo entero el esplendor de tu gloria, asístenos con tu gracia, para que proclamemos con fe íntegra y celebremos con piedad sincera el misterio admirable de la encarnación de tu Hijo. Que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Miserere mei, Domine, et exaudi orationem meam.", "es": "Ten piedad de mí, Señor, y escucha mi oración."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 4", "content": {"la": [["1", "In finem, in carminibus. Psalmus David."], ["2", "Cum invocarem exaudivit me Deus justitiae meae, in tribulatione dilatasti mihi. Miserere mei, et exaudi orationem meam."], ["3", "Filii hominum, usquequo gravi corde? Ut quid diligitis vanitatem, et quaeritis mendacium?"], ["4", "Et scitote quoniam mirificavit Dominus sanctum suum; Dominus exaudiet me cum clamavero ad eum."], ["5", "Irascimini, et nolite peccare; quae dicitis in cordibus vestris, in cubilibus vestris compungimini."], ["6", "Sacrificate sacrificium justitiae, et sperate in Domino. Multi dicunt : Quis ostendit nobis bona?"], ["7", "Signatum est super nos lumen vultus tui, Domine : dedisti laetitiam in corde meo."], ["8", "A fructu frumenti, vini, et olei sui, multiplicati sunt."], ["9", "In pace in idipsum dormiam, et requiescam;"], ["10", "quoniam tu, Domine, singulariter in spe constituisti me."]], "es": [["2", "Así que lo invoqué, me oyó Dios, que es mi justicia; tú, ¡oh Dios mío!, en mi angustia me ensanchaste el corazón. Apiádate aún de mí, y presta oídos a mi oración."], ["3", "¡Oh, hijos de los hombres!, ¿hasta cuándo seréis de estúpido corazón?; ¿por qué amáis la vanidad y vais en pos de la mentira?"], ["4", "Sabed, pues, que es el Señor quien ha hecho admirable su Santo: el Señor me oirá siempre que clamare a él."], ["5", "Enojaos, y no queráis pecar más; compungíos en el retiro de vuestros lechos de las cosas que andáis meditando en vuestros corazones."], ["6", "Ofreced sacrificios de justicia, y confiad en el Señor. Dicen muchos: ¿Quién nos hará ver los bienes que se nos prometen?"], ["7", "Impresa está, Señor, sobre nosotros la luz de tu rostro: tú has infundido la alegría en mi corazón."], ["8", "Ellos están bien abastecidos y alegres con la abundancia de su trigo, vino y aceite."], ["9", "Mas yo, Dios mío, dormiré en paz, y descansaré en tus promesas:"], ["10", "Porque tú, ¡Oh Señor!, sólo tú has asegurado mi esperanza."]]}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 133", "content": {"la": [["1", "Canticum graduum. Ecce nunc benedicite Dominum, omnes servi Domini : qui statis in domo Domini, in atriis domus Dei nostri."], ["2", "In noctibus extollite manus vestras in sancta, et benedicite Dominum."], ["3", "Benedicat te Dominus ex Sion, qui fecit caelum et terram."]], "es": [["1", "Ea, pues, bendecid al Señor ahora mismo, vosotros todos, ¡oh siervos del Señor! Vosotros los que asistís en la casa del Señor, en los atrios del templo de nuestro Dios,"], ["2", "levantad por las noches vuestras manos hacia el santuario, y alabad al Señor."], ["3", "Te bendiga desde Sión el Señor que creó el cielo y la tierra."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Miserere mei, Domine, et exaudi orationem meam.", "es": "Ten piedad de mí, Señor, y escucha mi oración."}}, {"kind": "psalm", "label": "reading", "ref": "Deut 6:4-7", "content": {"la": [["4", "Audi, Israel : Dominus Deus noster, Dominus unus est."], ["5", "Diliges Dominum Deum tuum ex toto corde tuo, et ex tota anima tua, et ex tota fortitudine tua."], ["6", "Eruntque verba haec, quae ego praecipio tibi hodie, in corde tuo :"], ["7", "et narrabis ea filiis tuis, et meditaberis in eis sedens in domo tua, et ambulans in itinere, dormiens atque consurgens."]], "es": [["4", "Escucha, oh Israel: El Señor Dios nuestro es el solo ' y único Dios y Señor."], ["5", "Amarás pues al Señor Dios tuvo con todo tu corazón, y con toda tu alma, y con todas tus fuerzas '."], ["6", "Y estos mandamientos, que yo te doy en este dia, estarán estampados en tu corazón,"], ["7", "y los enseñarás á tus hijos, y en ellos meditarás sentado en tu casa, y andando de viage, y al acostarte, y al levantarte;"]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Visita nos, quæsumus, Domine, hac nocte præsenti, ut, diluculo tua virtute surgentes, de resurrectione Christi tui gaudere valeamus. Qui vivit et regnat in sæcula sæculorum.", "es": "Guárdanos, Señor, durante esta noche y haz que mañana, ya al clarear el nuevo día, la celebración del domingo nos llene con la alegría de la resurrección de tu Hijo. Que vive y reina por los siglos de los siglos. Amén."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-12-20": {"date_human": {"en": "Sunday, December 20, 2026", "es": "Domingo, 20 de diciembre de 2026", "la": "Dominica, die 20 Decembris, anno 2026"}, "day_description": {"en": "4<sup>th</sup> Sunday of Advent", "es": "Domingo 4.<sup>a</sup> de Adviento", "la": "Dominica IV Adventus"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Tocad la trompeta en Sion, porque está cerca el día del Señor. Mirad: viene a salvarnos. Aleluya._", "la": "Cánite tuba in Sion, quia prope est dies Dómini: ecce véniet ad salvándum nos, allelúia."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 117", "content": {"la": [["1", "Alleluja. Confitemini Domino, quoniam bonus, quoniam in saeculum misericordia ejus."], ["2", "Dicat nunc Israel : Quoniam bonus, quoniam in saeculum misericordia ejus."], ["3", "Dicat nunc domus Aaron : Quoniam in saeculum misericordia ejus."], ["4", "Dicant nunc qui timent Dominum : Quoniam in saeculum misericordia ejus."], ["5", "De tribulatione invocavi Dominum; et exaudivit me in latitudine Dominus."], ["6", "Dominus mihi adjutor; non timebo quid faciat mihi homo."], ["7", "Dominus mihi adjutor; et ego despiciam inimicos meos."], ["8", "Bonum est confidere in Domino, quam confidere in homine."], ["9", "Bonum est sperare in Domino, quam sperare in principibus."], ["10", "Omnes gentes circuierunt me; et in nomine Domini quia ultus sum in eos."], ["11", "Circumdantes circumdederunt me, et in nomine Domini quia ultus sum in eos."], ["12", "Circumdederunt me sicut apes, et exarserunt sicut ignis in spinis; et in nomine Domini, quia ultus sum in eos."], ["13", "Impulsus eversus sum, ut caderem; et Dominus suscepit me."], ["14", "Fortitudo mea et laus mea Dominus; et factus est mihi in salutem."], ["15", "Vox exsultationis et salutis in tabernaculis justorum."], ["16", "Dextera Domini fecit virtutem, dextera Domini exaltavit me; dextera Domini fecit virtutem."], ["17", "Non moriar, sed vivam; et narrabo opera Domini."], ["18", "Castigans castigavit me Dominus, et morti non tradidit me."], ["19", "Aperite mihi portas justitiae : ingressus in eas confitebor Domino."], ["20", "Haec porta Domini, justi intrabunt in eam."], ["21", "Confitebor tibi quoniam exaudisti me, et factus es mihi in salutem."], ["22", "Lapidem quem reprobaverunt aedificantes, hic factus est in caput anguli."], ["23", "A Domino factum est istud, et est mirabile in oculis nostris."], ["24", "Haec est dies quam fecit Dominus; exsultemus, et laetemur in ea."], ["25", "O Domine, salvum me fac; o Domine, bene prosperare."], ["26", "Benedictus qui venit in nomine Domini : benediximus vobis de domo Domini."], ["27", "Deus Dominus, et illuxit nobis. Constituite diem solemnem in condensis, usque ad cornu altaris."], ["28", "Deus meus es tu, et confitebor tibi; Deus meus es tu, et exaltabo te. Confitebor tibi quoniam exaudisti me, et factus es mihi in salutem."], ["29", "Confitemini Domino, quoniam bonus, quoniam in saeculum misericordia ejus."]], "es": [["1", "Alabad al Señor, porque es tan bueno; porque hace brillar eternamente su misericordia."], ["2", "Diga ahora Israel que el Señor es bueno, y que es eterna su misericordia."], ["3", "Diga ahora la casa de Aarón, que es eterna la misericordia del Señor."], ["4", "Digan ahora también los que temen al Señor, que su misericordia es eterna."], ["5", "En medio de la tribulación invoqué al Señor, y me otorgó el Señor libertad."], ["6", "El Señor es mi sostén, no temo nada de cuanto pueda hacerme el hombre."], ["7", "El Señor está de mi parte; yo despreciaré a mis enemigos."], ["8", "Mejor es confiar en el Señor, que confiar en el hombre."], ["9", "Mejor es poner la esperanza en el Señor, que ponerla en los príncipes."], ["10", "Me cercaron todas las naciones; mas yo en el Nombre del Señor tomé venganza de ellas."], ["11", "Me cercaron estrechamente; pero me vengué de ellas en el Nombre del Señor."], ["12", "Me rodearon a la manera de un enjambre de irritadas abejas, y ardieron en ira como fuego que prende en secos espinos; pero en el Nombre del Señor tomé de ellas su venganza."], ["13", "A empellones procuraban derribarme, y estuve a punto de caer; mas el Señor me sostu-vo."], ["14", "El Señor es mi fortaleza y mi gloria; el Señor se ha constituido salvación mía."], ["15", "Voces de júbilo y de salvación son las que se oyen en las moradas de los justos."], ["16", "La diestra del Señor hizo proezas; la diestra del Señor me ha exaltado, triunfó la diestra del Señor."], ["17", "No me moriré, sino que viviré aún, y publicaré las obras del Señor."], ["18", "Me ha castigado el Señor severamente; mas no me ha entregado a la muerte."], ["19", "Abridme, ¡oh sacerdotes!, las puertas del Tabernáculo de la justicia y santidad; y entrado en ellas tributaré gracias al Señor."], ["20", "Esta es la puerta del Señor, por ella entrarán los justos."], ["21", "Aquí cantaré himnos de gratitud, por haberme oído y sido mi salvador."], ["22", "La piedra que desecharon los arquitectos, esa misma ha sido puesta por piedra angular del edificio."], ["23", "El Señor es quien lo ha hecho, y es una cosa sumamente admirable a nuestros ojos."], ["24", "Este es el día que ha hecho el Señor. Alegrémonos y recocijémonos en él."], ["25", "¡Oh Señor!, sálvame; concede, Señor, un próspero suceso."], ["26", "Bendito sea el que viene en el Nombre del Señor. Os hemos echado mil bendiciones desde la casa del Señor."], ["27", "El Señor es Dios, y él nos ha alumbrado. Celebrad el día solemne de los Tabernáculos; celebradle con enramadas de árboles frondosos que lleguen hasta los lados del altar."], ["28", "¡Oh Señor!, tú eres mi Dios, y a ti tributaré acciones de gracias; tú eres mi Dios, y tu gloria ensalzaré. Tus alabanzas cantaré, porque me has oído, y te hiciste mi salvador."], ["29", "Alabad al Señor por ser infinitamente bueno, por ser eterna su misericordia."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Tocad la trompeta en Sion, porque está cerca el día del Señor. Mirad: viene a salvarnos. Aleluya._", "la": "Cánite tuba in Sion, quia prope est dies Dómini: ecce véniet ad salvándum nos, allelúia."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Vendrá el Señor, salid a su encuentro, diciendo: «Grande es tu origen, y tu reino no tendrá fin: Dios fuerte, dominador, príncipe de la paz.» Aleluya._", "la": "Dóminus véniet, occúrrite illi, dicéntes: Magnum princípium, et regni eius non erit finis: Deus fortis, Dominátor, Princeps pacis, allelúia."}}, {"kind": "psalm", "label": "canticle", "ref": "dan 3:52-57", "content": {"la": [["52", "Benedictus es, Domine Deus patrum nostrorum : et laudabilis, et gloriosus, et superexaltatus in saecula. Et benedictum nomen gloriae tuae sanctum : et laudabile, et superexaltatum in omnibus saeculis."], ["53", "Benedictus es in templo sancto gloriae tuae : et superlaudabilis, et supergloriosus in saecula."], ["54", "Benedictus es in throno regni tui : et superlaudabilis, et superexaltatus in saecula."], ["55", "Benedictus es, qui intueris abyssos, et sedes super cherubim : et laudabilis, et superexaltatus in saecula."], ["56", "Benedictus es in firmamento caeli : et laudabilis et gloriosus in saecula."], ["57", "Benedicite, omnia opera Domini, Domino : laudate et superexaltate eum in saecula."]], "es": [["52", "Bendito seas tú, oh Señor Dios de nuestros padres; y digno eres de loor, y de gloria, y de ser en - salzado para siempre: bendito sea tu santo y glorioso nombre, y digno es de ser alabado, y sobremanera ensalzado en todos los siglos."], ["53", "Bendito eres tú en el Templo santo de tu gloria, y sobre todo loor y sobre toda gloria por todos los siglos de siglos."], ["54", "Bendito eres tú en el trono de tu reino, y sobre todo loor y sobre toda gloria por todos los siglos."], ["55", "Bendito eres tú que con tu vista penetras los"], ["56", "Bendito eres tú en el firmamento del cielo, y digno de loor, y de gloria por todos los siglos."], ["57", "Obras todas del Señor, bendecid al Señor, y loadle y ensalzadle sobre todas las cosas por todos los siglos."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Vendrá el Señor, salid a su encuentro, diciendo: «Grande es tu origen, y tu reino no tendrá fin: Dios fuerte, dominador, príncipe de la paz.» Aleluya._", "la": "Dóminus véniet, occúrrite illi, dicéntes: Magnum princípium, et regni eius non erit finis: Deus fortis, Dominátor, Princeps pacis, allelúia."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Tu Palabra omnipotente, Señor, vendrá desde su trono real. Aleluya._", "la": "Omnípotens Sermo tuus, Dómine, a regálibus sédibus véniet, allelúia."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 150", "content": {"la": [["1", "Alleluja. Laudate Dominum in sanctis ejus; laudate eum in firmamento virtutis ejus."], ["2", "Laudate eum in virtutibus ejus; laudate eum secundum multitudinem magnitudinis ejus."], ["3", "Laudate eum in sono tubae; laudate eum in psalterio et cithara."], ["4", "Laudate eum in tympano et choro; laudate eum in chordis et organo."], ["5", "Laudate eum in cymbalis benesonantibus; laudate eum in cymbalis jubilationis. Omnis spiritus laudet Dominum! Alleluja."]], "es": [["1", "Alabad al Señor que reside en su celestial santuario; alabadle sentado en el firmamento o trono de su poder."], ["2", "Alabadle por sus prodigios a favor vuestro; alabadle por su inmensa grandeza."], ["3", "Alabadle al son de clarines; alabadle con el salterio y la cítara."], ["4", "Alabadle con panderos y armoniosos conciertos; alabadle con instrumentos músicos de cuerdas y de viento."], ["5", "Alabadle con sonoros címbalos; alabadle con címbalos de júbilo. Empléese todo espíritu en alabar a Dios. ¡Aleluya!"]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Tu Palabra omnipotente, Señor, vendrá desde su trono real. Aleluya._", "la": "Omnípotens Sermo tuus, Dómine, a regálibus sédibus véniet, allelúia."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "rom 13:11-12", "content": {"la": [["11", "Et hoc scientes tempus : quia hora est jam nos de somno surgere. Nunc enim propior est nostra salus, quam cum credidimus."], ["12", "Nox praecessit, dies autem appropinquavit. Abjiciamus ergo opera tenebrarum, et induamur arma lucis."]], "es": [["11", "Cumplamos pues con él, y tanto más que sabemos que el tiempo insta, y que ya es hora de dispertarnos de nuestro letargo: pues estamos más cerca de nuestra salud, que cuando recibimos la fé."], ["12", "La noche está ya muy avanzada, y va á llegar el día de la eternidad. Dejemos pues las obras de las tinieblas, y revistámonos de las armas de la luz."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Christe, Fili Dei vivi,* Miserére nobis. Christe.", "℟. Qui ventúrus es in mundum.* Miserére nobis. Glória Patri. Christe."], "es": ["$℣. $Cristo, Hijo de Dios vivo, ten piedad de nosotros.", "$℟. $Cristo, Hijo de Dios vivo, ten piedad de nosotros.", "$℣. $Tú que has de venir al mundo", "$℟. $Ten piedad de nosotros.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Cristo, Hijo de Dios vivo, ten piedad de nosotros."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_En cuanto tu saludo llegó a mis oídos, la criatura saltó de alegría en mi vientre. Aleluya._", "la": "Ex quo facta est vox salutatiónis tuæ in áuribus meis, exsultávit in gáudio infans in útero meo, allelúia."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_En cuanto tu saludo llegó a mis oídos, la criatura saltó de alegría en mi vientre. Aleluya._", "la": "Ex quo facta est vox salutatiónis tuæ in áuribus meis, exsultávit in gáudio infans in útero meo, allelúia."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Dóminum Iesum Christum, fratres caríssimi, deprecémur, qui est iudex vivórum et mortuórum, ipsi dicéntes:", "– Veni, Dómine Iesu.", "Christe Dómine, qui peccatóres salváre venísti,", "nos ab omni tentatiónum adversitáte defénde.", "– Veni, Dómine Iesu.", "Qui ad iudícium maniféste ventúrus esse créderis,", "poténtiam tuæ salvatiónis in nobis osténde.", "– Veni, Dómine Iesu.", "Da nobis legis tuæ præcépta virtúte spíritus custodíre,", "ut advéntum tuum in caritáte præstolári possímus.", "– Veni, Dómine Iesu.", "Tu, qui es benedíctus in sǽcula, fac ut per misericórdiam tuam pie et sóbrie in hoc sǽculo vivámus,", "exspectántes beátam spem et advéntum magnificéntiæ tuæ.", "– Veni, Dómine Iesu."], "es": ["Roguemos, hermanos, al Señor Jesús, juez de vivos y muertos, y digámosle:", "- Señor Jesucristo, que viniste a salvar a los pecadores, _líbranos de caer en la tentación._ _Ven, Señor Jesús._", "- Tú que vendrás con gloria para juzgar a tu pueblo, _muestra en nosotros tu poder salvador._ _Ven, Señor Jesús._", "- Ayúdanos a cumplir con fortaleza de espíritu los preceptos de tu ley, _para que podamos esperar tu venida sin temor._ _Ven, Señor Jesús._", "- Tú que eres bendito por los siglos, _concédenos por tu misericordia, que, llevando ya desde ahora una vida sobria y religiosa, esperemos con gozo tu gloriosa aparición._ _Ven, Señor Jesús._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Grátiam tuam, quǽsumus, Dómine, méntibus nostris infúnde, ut, qui, Angelo nuntiánte, Christi Fílii tui incarnatiónem cognóvimus, per passiónem eius et crucem ad resurrectiónis glóriam perducámur. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Derrama, Señor, tu gracia sobre nosotros, que, por el anuncio del ángel, hemos conocido la encarnación de tu Hijo, para que lleguemos, por su pasión y su cruz, a la gloria de la resurrección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Contemplad cuán glorioso es el que viene a salvar a todos los pueblos._", "la": "Intuémini quam gloriósus sit iste, qui ingréditur ad salvándos pópulos."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 109:1-5,7", "content": {"la": [["1", "Psalmus David. Dixit Dominus Domino meo : Sede a dextris meis, donec ponam inimicos tuos scabellum pedum tuorum."], ["2", "Virgam virtutis tuae emittet Dominus ex Sion : dominare in medio inimicorum tuorum."], ["3", "Tecum principium in die virtutis tuae in splendoribus sanctorum; ex utero, ante luciferum, genui te."], ["4", "Juravit Dominus, et non poenitebit eum : Tu es sacerdos in aeternum secundum ordinem Melchisedech."], ["5", "Dominus a dextris tuis; confregit in die irae suae reges."], ["7", "de torrente in via bibet; propterea exaltabit caput."]], "es": [["1", "El Señor dijo a mi Señor: Siéntate a mi diestra, mientras que yo pongo a tus enemigos por tarima de tus pies."], ["2", "De Sión hará salir el Señor el cetro de tu poder; domina tú en medio de tus enemigos."], ["3", "Contigo está el principado el día de tu poderío, en medio de los resplandores de la santidad; de mis entrañas te engendré, antes de existir el lucero de la mañana."], ["4", "Juró el Señor, y no se arrepentirá, y dijo: Tú eres sacerdote sempiterno, según el orden de Melquisedec."], ["5", "El Señor está a tu diestra; en el día de su ira destrozó a los reyes."], ["7", "Beberá del torrente durante el camino, por eso levantará su cabeza."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Contemplad cuán glorioso es el que viene a salvar a todos los pueblos._", "la": "Intuémini quam gloriósus sit iste, qui ingréditur ad salvándos pópulos."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Lo torcido se endereza, lo escabroso se iguala: ven, Señor, y no tardes más. Aleluya._", "la": "Erunt prava in dirécta et áspera in vias planas. Veni, Dómine, et noli tardáre, allelúia."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 111", "content": {"la": [["1", "Alleluja, reversionis Aggaei et Zachariae. Beatus vir qui timet Dominum, in mandatis ejus volet nimis."], ["2", "Potens in terra erit semen ejus; generatio rectorum benedicetur."], ["3", "Gloria et divitiae in domo ejus, et justitia ejus manet in saeculum saeculi."], ["4", "Exortum est in tenebris lumen rectis, misericors, et miserator, et justus."], ["5", "Jucundus homo qui miseretur et commodat, disponet sermones suos in judicio;"], ["6", "quia in aeternum non commovebitur."], ["7", "In memoria aeterna erit justus; ab auditione mala non timebit. Paratum cor ejus sperare in Domino,"], ["8", "confirmatum est cor ejus; non commovebitur donec despiciat inimicos suos."], ["9", "Dispersit, dedit pauperibus; justitia ejus manet in saeculum saeculi; cornu ejus exaltabitur in gloria."], ["10", "Peccator videbit, et irascetur, dentibus suis fremet et tabescet; desiderium peccatorum peribit."]], "es": [["1", "Bienaventurado el hombre que teme al Señor, y que toda su afición la pone en cumplir sus mandamientos."], ["2", "Poderosa será sobre la tierra la descendencia suya; bendita será la generación de los justos."], ["3", "Gloria y riquezas habrá en su casa, y su justicia durará eternamente."], ["4", "Ha nacido entre las tinieblas la luz para los de corazón recto; el misericordioso, el benigno, el justo."], ["5", "Dichoso el hombre que se compadece, y da prestado al pobre; y que dispensa sus palabras con discreción,"], ["6", "porque jamás resbalará."], ["7", "El justo vivirá eternamente en la memoria de Dios y de los hombres; no temerá al oír malas nuevas. Su corazón está siempre dispuesto a esperar en el Señor."], ["8", "Fortalecido está su corazón; no vacilará el justo; y mirará con desprecio a sus enemigos."], ["9", "Derramó a manos llenas sus bienes entre los pobres; su justicia permanece eternamente; su fortaleza será exaltada con gloria."], ["10", "Lo verá el pecador, y se irritará; rechinará los dientes, y se consumirá; pero los deseos y esfuerzos de los pecadores se desvanecerán como el humo."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Lo torcido se endereza, lo escabroso se iguala: ven, Señor, y no tardes más. Aleluya._", "la": "Erunt prava in dirécta et áspera in vias planas. Veni, Dómine, et noli tardáre, allelúia."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Se dilatará su principado con una paz sin límites. Aleluya._", "la": "Multiplicábitur eius impérium, et pacis non erit finis."}}, {"kind": "psalm", "label": "canticle", "ref": "rev 19:1-2,5-7", "content": {"la": [["1", "Post haec audivi quasi vocem turbarum multarum in caelo dicentium : Alleluja : salus, et gloria, et virtus Deo nostro est :"], ["2", "quia vera et justa judicia sunt ejus, qui judicavit de meretrice magna, quae corrupit terram in prostitutione sua, et vindicavit sanguinem servorum suorum de manibus ejus."], ["5", "Ex vox de throno exivit, dicens : Laudem dicite Deo nostro omnes servi ejus : et qui timetis eum pusilli et magni."], ["6", "Et audivi quasi vocem turbae magnae, et sicut vocem aquarum multarum, et sicut vocem tonitruorum magnorum, dicentium : Alleluja : quoniam regnavit Dominus Deus noster omnipotens."], ["7", "Gaudeamus, et exsultemus : et demus gloriam ei : quia venerunt nuptiae Agni, et uxor ejus praeparavit se."]], "es": [["1", "Después de estas cosas oi en ci cielo como una voz de muchas gentes, que decían: AUeluya: La salvación, y la gloria, y el poder son debidos á nuestro Dios;"], ["2", "porque verdaderos son y justos sus juicios, pues ha condenado á la gran ramera, la cual estragó la tierra con su prostitución, y ha vengado la sangre de sus siervos derramada por las manos de ella."], ["5", "Y del solio salió una voz que decía: Alabad á nuestro Dios todos sus siervos, y los que le teméis, pequeños y grandes."], ["6", "Oí también una voz como de gran gentío, y como el ruido de muchas aguas, y como el estampido de grandes truenos, que decia: Alleluya; porque tomó ya posesión del reino el Señor Dios nuestro todopoderoso."], ["7", "Gozémonos, y saltemos de júbilo, y démosle la gloria, pues son llegadas las bodas del Cordero ', y la Iglesia su esposa se ha puesto de gala ó ataviada."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Se dilatará su principado con una paz sin límites. Aleluya._", "la": "Multiplicábitur eius impérium, et pacis non erit finis."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "phil 4:4-5", "content": {"la": [["4", "Gaudete in Domino semper : iterum dico gaudete."], ["5", "Modestia vestra nota sit omnibus hominibus : Dominus prope est."]], "es": [["4", "Vivid siempre alegres en el Señor: vivid alegres repito '."], ["5", "Sea vuestra modestia * patente á lodos los hombres: el Señor está cerca."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Osténde nobis, Dómine,* Misericórdiam tuam. Osténde.", "℟. Et salutáre tuum da nobis.* Misericórdiam tuam. Glória Patri. Osténde."], "es": ["$℣. $Muéstranos, Señor,  tu  misericordia.", "$℟. $Muéstranos, Señor,  tu  misericordia.", "$℣. $Danos tu salvación.", "$℟. $Tu  misericordia.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Muéstranos, Señor,  tu  misericordia."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Oh Llave de David y Cetro de la casa de Israel, que abres y nadie puede cerrar, cierras y nadie puede abrir, ven y libra a los cautivos que viven en tinieblas y en sombra de muerte._", "la": "O Clavis David, et sceptrum domus Israel; qui áperis, et nemo claudit; claudis, et nemo áperit: veni, et educ vinctum de domo cárceris, sedéntem in ténebris, et umbra mortis."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosa
