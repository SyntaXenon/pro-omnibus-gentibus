 "dichosa puerta del cielo.", "", "Tomando aquel Ave", "de labios de Gabriel,", "afiánzanos en paz,", "cambiando el nombre de Eva.", "", "Suelta las cadenas de los culpables,", "trae la luz a los ciegos,", "aleja nuestros males,", "pide para nosotros todos los bienes.", "", "Muéstrate ser madre,", "reciba por ti nuestras súplicas", "quien, nacido por nosotros,", "quiso ser hijo tuyo.", "", "Virgen sin igual,", "mansa entre todas,", "líbranos de nuestras culpas", "y haznos mansos y castos.", "", "Danos una vida pura,", "prepáranos un camino seguro,", "para que, viendo a Jesús,", "nos gocemos siempre juntos.", "", "Sea la alabanza a Dios Padre,", "la gloria al altísimo Cristo,", "al Espíritu Santo,", "un mismo honor a los tres. Amén."]}}, {"id": "vexilla_regis_prodeunt", "title": "Vexilla Regis Prodeunt", "original_language": "la", "lines": {"la": ["Vexilla Regis prodeunt:", "fulget Crucis mysterium,", "qua vita mortem pertulit,", "et morte vitam protulit.", "", "Quae vulnerata lanceae", "mucrone diro, criminum", "ut nos lavaret sordibus,", "manavit unda et sanguine.", "", "Impleta sunt quae concinit", "David fideli carmine,", "dicendo nationibus:", "regnavit a ligno Deus.", "", "O Crux ave, spes unica,", "hoc Passionis tempore", "piis adauge gratiam,", "reisque dele crimina.", "", "Te, fons salutis Trinitas,", "collaudet omnis spiritus:", "quibus Crucis victoriam", "largiris, adde praemium. Amen."], "es": ["Los estandartes del Rey avanzan:", "resplandece el misterio de la Cruz,", "por la cual la Vida sufrió la muerte,", "y con la muerte produjo la vida.", "", "La cual, herida por la punta", "cruel de la lanza, para lavarnos", "de la mancha de nuestros pecados,", "manó agua y sangre.", "", "Se cumplió lo que cantó", "David en su fiel poema,", "diciendo a las naciones:", "Dios reinó desde el madero.", "", "Salve, oh Cruz, única esperanza,", "en este tiempo de la Pasión", "aumenta la gracia a los piadosos,", "y borra los pecados de los culpables.", "", "A ti, Trinidad, fuente de salvación,", "te alabe todo espíritu:", "a quienes la victoria de la Cruz", "concedes, añade la recompensa. Amén."]}}, {"id": "conditor_alme_siderum", "title": "Conditor Alme Siderum", "original_language": "la", "lines": {"la": ["Conditor alme siderum,", "aeterna lux credentium,", "Christe, redemptor omnium,", "exaudi preces supplicum.", "", "Qui condolens interitu", "mortis perire saeculum,", "salvasti mundum languidum,", "donans reis remedium.", "", "Vergente mundi vespere,", "uti sponsus de thalamo,", "egressus honestissima", "Virginis matris clausula.", "", "Cuius forti potentiae", "genu curvantur omnia;", "caelestia, terrestria", "nutu fatentur subdita.", "", "Te, Sancte, fide quaesumus,", "venture iudex saeculi,", "conserva nos in tempore", "hostis a telo perfidi.", "", "Sit, Christe, rex piissime,", "tibi Patrique gloria", "cum Spiritu Paraclito,", "in sempiterna saecula. Amen."], "es": ["Creador bondadoso de los astros,", "luz eterna de los creyentes,", "Cristo, redentor de todos,", "escucha las súplicas de los que te imploran.", "", "Tú que, apiadado de que el mundo", "pereciera en la ruina de la muerte,", "salvaste al mundo enfermo,", "dando remedio a los culpables.", "", "Cuando declinaba la tarde del mundo,", "como esposo que sale del tálamo,", "saliste del honestísimo", "seno de tu Madre Virgen.", "", "Ante cuyo fuerte poder", "se doblan todas las rodillas;", "los seres celestes y terrestres", "confiesan someterse a tu mandato.", "", "A ti, Santo, con fe te suplicamos,", "que has de venir como juez del mundo,", "consérvanos a tiempo", "libres del dardo del enemigo pérfido.", "", "Sea, oh Cristo, rey piadosísimo,", "gloria a ti y al Padre", "con el Espíritu Paráclito,", "por los siglos sempiternos. Amén."]}}, {"id": "pange_lingua_gloriosi", "title": "Pange Lingua Gloriosi Corporis Mysterium", "original_language": "la", "lines": {"la": ["Pange, lingua, gloriosi", "Corporis mysterium,", "Sanguinisque pretiosi,", "quem in mundi pretium", "fructus ventris generosi", "Rex effudit gentium.", "", "Nobis datus, nobis natus", "ex intacta Virgine,", "et in mundo conversatus,", "sparso verbi semine,", "sui moras incolatus", "miro clausit ordine.", "", "In supremae nocte cenae", "recumbens cum fratribus,", "observata lege plene", "cibis in legalibus,", "cibum turbae duodenae", "se dat suis manibus.", "", "Verbum caro, panem verum", "verbo carnem efficit:", "fitque sanguis Christi merum,", "et si sensus deficit,", "ad firmandum cor sincerum", "sola fides sufficit.", "", "Tantum ergo Sacramentum", "veneremur cernui:", "et antiquum documentum", "novo cedat ritui:", "praestet fides supplementum", "sensuum defectui.", "", "Genitori, Genitoque", "laus et iubilatio,", "salus, honor, virtus quoque", "sit et benedictio:", "procedenti ab utroque", "compar sit laudatio. Amen."], "es": ["Canta, lengua, el misterio", "del glorioso Cuerpo,", "y de la preciosa Sangre,", "que como precio del mundo,", "fruto de un vientre generoso,", "derramó el Rey de las naciones.", "", "Dado a nosotros, nacido para nosotros", "de una Virgen intacta,", "y habiendo vivido en el mundo", "sembrando la semilla de la Palabra,", "concluyó el tiempo de su estancia", "con un orden admirable.", "", "En la noche de la última cena,", "reclinado con sus hermanos,", "habiendo cumplido plenamente la ley", "en cuanto a los alimentos rituales,", "se da como alimento a los doce", "con sus propias manos.", "", "El Verbo hecho carne, con su palabra", "convierte en carne el pan verdadero:", "y el vino se hace sangre de Cristo,", "y si los sentidos no alcanzan,", "para afirmar el corazón sincero", "basta sólo la fe.", "", "Un Sacramento tan grande", "veneremos, pues, inclinados:", "y ceda el antiguo precepto", "al nuevo rito:", "que la fe supla", "lo que falta a los sentidos.", "", "Al Engendrador y al Engendrado", "sea la alabanza y el júbilo,", "la salud, el honor y también el poder", "y la bendición:", "y al que procede de ambos", "sea dada igual alabanza. Amén."]}}, {"id": "deus_tuorum_militum", "title": "Deus Tuorum Militum", "original_language": "la", "lines": {"la": ["Deus tuorum militum", "sors, et corona, praemium,", "laudes canentes Martyris", "absolve nexu criminis.", "", "Hic nempe mundi gaudia", "et blandimenta noxia", "caduca rite deputans,", "pervenit ad caelestia.", "", "Poenas cucurrit fortiter", "et sustulit viriliter,", "fundensque pro te sanguinem,", "aeterna dona possidet.", "", "Ob hoc precatu supplici", "te poscimus, piissime;", "in hoc triumpho Martyris", "dimitte noxam servulis.", "", "Laus et perennis gloria", "Deo Patri et Filio,", "Sancto simul Paraclito,", "in sempiterna saecula. Amen."], "es": ["Dios, suerte, corona y premio", "de tus soldados,", "a nosotros, que cantamos las alabanzas del Mártir,", "líbranos del lazo del pecado.", "", "Éste, en verdad, teniendo por caducos", "los gozos del mundo", "y sus dañinas seducciones,", "llegó a los bienes celestiales.", "", "Corrió fuertemente hacia las penas", "y las soportó con valentía,", "y derramando su sangre por ti,", "posee ahora los dones eternos.", "", "Por esto, con súplica humilde", "te lo pedimos, piadosísimo;", "en este triunfo del Mártir,", "perdona la culpa a tus siervos.", "", "Alabanza y gloria perpetua", "a Dios Padre y al Hijo,", "juntamente al Espíritu Santo Paráclito,", "por los siglos sempiternos. Amén."]}}, {"id": "o_lux_beata_trinitas", "title": "O Lux Beata Trinitas", "original_language": "la", "lines": {"la": ["O lux beata Trinitas,", "et principalis Unitas,", "iam sol recedit igneus:", "infunde lumen cordibus.", "", "Te mane laudum carmine,", "te deprecemur vespere:", "te nostra supplex gloria", "per cuncta laudet saecula.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Oh luz bienaventurada, Trinidad,", "y Unidad primera,", "ya el sol ígneo se retira:", "infunde tu luz en los corazones.", "", "A ti te alabemos por la mañana con cánticos,", "a ti te supliquemos al atardecer:", "que nuestra súplica te glorifique", "por todos los siglos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y para siempre. Amén."]}}, {"id": "exsultet_caelum_laudibus", "title": "Exsultet Caelum Laudibus", "original_language": "la", "lines": {"la": ["Exsultet caelum laudibus,", "resultet terra gaudiis,", "Apostolorum gloriam", "sacra canunt sollemnia.", "", "Vos, saecli iusti iudices", "et vera mundi lumina,", "votis precamur cordium:", "audite preces supplicum.", "", "Qui caelum verbo clauditis", "serasque eius solvitis,", "nos a peccatis omnibus", "solvite iussu, quaesumus.", "", "Quorum praecepto subditur", "salus et languor omnium,", "sanate mentes languidas,", "augete nos virtutibus.", "", "Ut, cum iudex advenerit", "Christus in fine saeculi,", "nos sempiterni gaudii", "faciat esse compotes.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "nunc et per omne saeculum. Amen."], "es": ["Exulte el cielo con alabanzas,", "resuene la tierra con gozos,", "la sagrada solemnidad canta", "la gloria de los Apóstoles.", "", "A vosotros, justos jueces del mundo", "y verdaderas luces del orbe,", "os rogamos con los votos de nuestros corazones:", "escuchad las preces de los suplicantes.", "", "Vosotros que con la palabra cerráis el cielo", "y desatáis sus cerrojos,", "libradnos de todos los pecados,", "os lo rogamos, por vuestro mandato.", "", "A cuyo mandato está sometida", "la salud y la enfermedad de todos,", "sanad nuestras mentes enfermas,", "aumentadnos en virtudes.", "", "Para que, cuando venga como juez", "Cristo al final de los siglos,", "nos haga partícipes", "del gozo sempiterno.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por todos los siglos. Amén."]}}, {"id": "iste_confessor", "title": "Iste Confessor", "original_language": "la", "lines": {"la": ["Iste confessor Domini, colentes", "quem pie laudant populi per orbem,", "hac die laetus meruit supremos", "laudis honores.", "", "Qui pius, prudens, humilis, pudicus,", "sobriam duxit sine labe vitam,", "donec humanos animavit aurae", "spiritus artus.", "", "Cuius ob praestans meritum, frequenter,", "aegra quae passim iacuere membra,", "viribus morbi domitis, saluti", "restituuntur.", "", "Noster hinc illi chorus obsequentem", "concinit laudem celebresque palmas,", "ut piis eius meritis iuvemur", "omne per aevum.", "", "Sit salus illi, decus atque virtus,", "qui, supra caeli residens cacumen,", "totius mundi seriem gubernat,", "trinus et unus. Amen."], "es": ["Este confesor del Señor, a quien", "los pueblos veneran piadosamente por todo el orbe,", "mereció alegre en este día los sumos", "honores de alabanza.", "", "El cual, piadoso, prudente, humilde y casto,", "llevó una vida sobria sin mancha,", "mientras el aliento de vida animó", "sus miembros humanos.", "", "Por cuyo excelente mérito, con frecuencia,", "los miembros enfermos que yacían por doquier,", "vencidas las fuerzas de la enfermedad, a la salud", "son restituidos.", "", "Por esto, nuestro coro le canta", "una alabanza obsequiosa y célebres palmas,", "para que por sus piadosos méritos seamos ayudados", "por toda la eternidad.", "", "Sea para él la salud, el honor y el poder,", "que, sentado sobre la cumbre del cielo,", "gobierna el curso de todo el mundo,", "trino y uno. Amén."]}}, {"id": "lucis_creator_optime", "title": "Lucis Creator Optime", "original_language": "la", "lines": {"la": ["Lucis Creator optime,", "lucem dierum proferens,", "primordiis lucis novae", "mundi parans originem;", "", "Qui mane iunctum vesperi", "diem vocari praecipis:", "taetrum chaos illabitur,", "audi preces cum fletibus.", "", "Ne mens gravata crimine", "vitae sit exsul munere,", "dum nil perenne cogitat", "seseque culpis illigat.", "", "Caeleste pulset ostium,", "vitale tollat praemium;", "vitemus omne noxium,", "purgemus omne pessimum.", "", "Praesta, Pater piissime,", "Patrique compar Unice,", "cum Spiritu Paraclito", "regnans per omne saeculum. Amen."], "es": ["Óptimo Creador de la luz,", "que produces la luz de los días,", "y en los primeros albores de la nueva luz", "preparaste el origen del mundo;", "", "Tú que mandas que se llame día", "a la mañana unida con la tarde:", "el horrible caos se desliza sobre nosotros,", "escucha nuestras preces con llanto.", "", "Que nuestra mente, cargada de pecado,", "no quede excluida del don de la vida,", "mientras no piensa en nada eterno", "y se enreda a sí misma en culpas.", "", "Que llame a la puerta celestial,", "que alcance el premio de la vida;", "evitemos todo lo dañino,", "purguemos todo lo pésimo.", "", "Concédelo, Padre piadosísimo,", "y también tú, Unigénito igual al Padre,", "que reinas con el Espíritu Paráclito", "por todos los siglos. Amén."]}}], "lauds": [{"id": "iste_confessor", "title": "Iste Confessor", "original_language": "la", "lines": {"la": ["Iste confessor Domini, colentes", "quem pie laudant populi per orbem,", "hac die laetus meruit supremos", "laudis honores.", "", "Qui pius, prudens, humilis, pudicus,", "sobriam duxit sine labe vitam,", "donec humanos animavit aurae", "spiritus artus.", "", "Cuius ob praestans meritum, frequenter,", "aegra quae passim iacuere membra,", "viribus morbi domitis, saluti", "restituuntur.", "", "Noster hinc illi chorus obsequentem", "concinit laudem celebresque palmas,", "ut piis eius meritis iuvemur", "omne per aevum.", "", "Sit salus illi, decus atque virtus,", "qui, supra caeli residens cacumen,", "totius mundi seriem gubernat,", "trinus et unus. Amen."], "es": ["Este confesor del Señor, a quien", "los pueblos veneran piadosamente por todo el orbe,", "mereció alegre en este día los sumos", "honores de alabanza.", "", "El cual, piadoso, prudente, humilde y casto,", "llevó una vida sobria sin mancha,", "mientras el aliento de vida animó", "sus miembros humanos.", "", "Por cuyo excelente mérito, con frecuencia,", "los miembros enfermos que yacían por doquier,", "vencidas las fuerzas de la enfermedad, a la salud", "son restituidos.", "", "Por esto, nuestro coro le canta", "una alabanza obsequiosa y célebres palmas,", "para que por sus piadosos méritos seamos ayudados", "por toda la eternidad.", "", "Sea para él la salud, el honor y el poder,", "que, sentado sobre la cumbre del cielo,", "gobierna el curso de todo el mundo,", "trino y uno. Amén."]}}, {"id": "ut_queant_laxis", "title": "Ut Queant Laxis", "original_language": "la", "lines": {"la": ["Ut queant laxis", "resonare fibris", "mira gestorum", "famuli tuorum,", "solve polluti", "labii reatum,", "Sancte Ioannes.", "", "Nuntius celso veniens Olympo,", "te patri magnum fore nasciturum,", "nomen, et vitae seriem gerendae", "ordine promit.", "", "Ille promissi dubius superni,", "perdidit promptae modulos loquelae:", "sed reformasti genitus peremptae", "organa vocis.", "", "Ventris obstruso positus cubili", "senseras Regem thalamo manentem:", "hinc parens nati meritis uterque", "abdita pandit.", "", "Sit decus Patri, genitaeque Proli,", "et tibi compar utriusque semper", "Spiritus alme, Deus unus, omni", "tempore saecli. Amen."], "es": ["Para que puedan", "resonar con voces desatadas", "las maravillas de las hazañas", "de tus siervos,", "libra de culpa", "nuestros labios manchados,", "san Juan.", "", "Un mensajero, viniendo del alto cielo,", "anuncia a tu padre que ibas a nacer grande,", "y revela en orden tu nombre", "y el curso de la vida que llevarías.", "", "Él, dudando de la promesa celestial,", "perdió el uso pronto de la palabra:", "pero tú, ya nacido, restauraste", "los órganos de su voz perdida.", "", "Colocado en el cerrado lecho del vientre,", "sentiste al Rey que permanecía en su tálamo:", "de ahí que ambos padres, por los méritos del hijo,", "revelan lo oculto.", "", "Sea la gloria al Padre, y al Hijo engendrado,", "y a ti, igual a ambos siempre,", "Espíritu bondadoso, Dios uno, por todo", "el tiempo del siglo. Amén."]}}, {"id": "veni_creator_spiritus", "title": "Veni Creator Spiritus", "original_language": "la", "lines": {"la": ["Veni, Creator Spiritus,", "mentes tuorum visita,", "imple superna gratia", "quae tu creasti pectora.", "", "Qui diceris Paraclitus,", "altissimi donum Dei,", "fons vivus, ignis, caritas,", "et spiritalis unctio.", "", "Tu septiformis munere,", "digitus paternae dexterae,", "tu rite promissum Patris,", "sermone ditans guttura.", "", "Accende lumen sensibus,", "infunde amorem cordibus,", "infirma nostri corporis", "virtute firmans perpeti.", "", "Hostem repellas longius,", "pacemque dones protinus;", "ductore sic te praevio", "vitemus omne noxium.", "", "Per te sciamus da Patrem,", "noscamus atque Filium;", "teque utriusque Spiritum", "credamus omni tempore.", "", "Deo Patri sit gloria,", "et Filio, qui a mortuis", "surrexit, ac Paraclito,", "in saeculorum saecula. Amen."], "es": ["Ven, Espíritu Creador,", "visita las mentes de los tuyos,", "llena de gracia celestial", "los pechos que Tú creaste.", "", "Tú, que eres llamado Paráclito,", "don del Dios altísimo,", "fuente viva, fuego, caridad,", "y unción espiritual.", "", "Tú, séptuple en tus dones,", "dedo de la diestra del Padre,", "tú, la promesa fielmente hecha por el Padre,", "que enriqueces las gargantas con la palabra.", "", "Enciende la luz en nuestros sentidos,", "infunde el amor en nuestros corazones,", "y las debilidades de nuestro cuerpo", "fortalécelas con virtud perpetua.", "", "Rechaza lejos al enemigo,", "y danos pronto la paz;", "así, contigo como guía,", "evitemos todo mal.", "", "Concédenos conocer por ti al Padre,", "y también conocer al Hijo;", "y a ti, Espíritu de ambos,", "creamos en todo tiempo.", "", "Gloria sea a Dios Padre,", "y al Hijo, que de entre los muertos", "resucitó, y al Paráclito,", "por los siglos de los siglos. Amén."]}}, {"id": "aeterne_rerum_conditor", "title": "Aeterne Rerum Conditor", "original_language": "la", "lines": {"la": ["Aeterne rerum Conditor,", "noctem diemque qui regis,", "et temporum das tempora,", "ut alleves fastidium;", "", "Praeco diei iam sonat,", "noctis profundae excubitor,", "nocturna lux viantibus", "a nocte noctem segregans.", "", "Hoc excitatus Lucifer", "solvit polum caligine;", "hoc omnis erronum cohors", "vias nocendi deserit.", "", "Iesu, labentes respice,", "et nos videndo corrige;", "si respicis, lapsus cadunt,", "fletuque culpa solvitur.", "", "Tu, lux, refulge sensibus,", "somnumque mentis discute;", "te nostra vox primum sonet,", "et vota solvamus tibi.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "nunc et per omne saeculum. Amen."], "es": ["Eterno Creador de todas las cosas,", "que riges la noche y el día,", "y das los tiempos a los tiempos,", "para aliviar nuestro hastío;", "", "Ya suena el heraldo del día,", "centinela de la profunda noche,", "luz nocturna para los caminantes,", "que separa la noche de la noche.", "", "Al oírlo, el Lucero", "libra al cielo de su oscuridad;", "al oírlo, toda hueste de malhechores", "abandona sus caminos de hacer daño.", "", "Jesús, mira a los que caen,", "y corrígenos mirándonos;", "si tú miras, las caídas cesan,", "y la culpa se disuelve con el llanto.", "", "Tú, luz, resplandece en nuestros sentidos,", "y disipa el sueño de la mente;", "que nuestra voz te cante primero a ti,", "y cumplamos para ti nuestros votos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por todos los siglos. Amén."]}}, {"id": "ecce_iam_noctis", "title": "Ecce Jam Noctis", "original_language": "la", "lines": {"la": ["Ecce iam noctis tenuatur umbra,", "lucis aurora rutilans coruscat;", "nisibus totis rogitemus omnes", "Cunctipotentem,", "", "Ut Deus, nostri miseratus, omnem", "pellat languorem, tribuat salutem,", "donet et nobis pietate patris", "regna polorum.", "", "Praestet hoc nobis Deitas beata", "Patris ac Nati, pariterque Sancti", "Spiritus, cuius resonat per omnem", "gloria mundum. Amen."], "es": ["He aquí que ya se adelgaza la sombra de la noche,", "y brilla resplandeciente la aurora de la luz;", "roguemos todos con todo empeño", "al Todopoderoso,", "", "Para que Dios, apiadado de nosotros,", "aleje toda enfermedad y conceda la salud,", "y nos dé, con piedad de padre,", "los reinos celestiales.", "", "Concédanos esto la bienaventurada Deidad", "del Padre y del Hijo, y también del Santo", "Espíritu, cuya gloria resuena", "por todo el mundo. Amén."]}}], "compline": [{"id": "te_lucis_ante_terminum", "title": "Te Lucis Ante Terminum", "original_language": "la", "lines": {"la": ["Te lucis ante terminum,", "rerum creator, poscimus,", "ut pro tua clementia", "sis praesul et custodia.", "", "Procul recedant somnia", "et noctium phantasmata;", "hostemque nostrum comprime,", "ne polluantur corpora.", "", "Praesta, Pater omnipotens,", "per Iesum Christum Dominum,", "qui tecum in perpetuum", "regnat cum Sancto Spiritu. Amen."], "es": ["Antes de que acabe la luz,", "te pedimos, Creador de todas las cosas,", "que por tu clemencia", "seas nuestro guardián y custodia.", "", "Aléjense lejos los sueños", "y los fantasmas de la noche;", "reprime a nuestro enemigo,", "para que nuestros cuerpos no se manchen.", "", "Concédenos esto, Padre omnipotente,", "por Jesucristo el Señor,", "que contigo por siempre", "reina con el Espíritu Santo. Amén."]}}, {"id": "christe_qui_lux_es_et_dies", "title": "Christe, Qui Lux Es Et Dies", "original_language": "la", "lines": {"la": ["Christe, qui lux es et dies,", "noctis tenebras detegis,", "lucisque lumen crederis,", "lumen beatum praedicans.", "", "Precamur, sancte Domine,", "defende nos in hac nocte,", "sit nobis in te requies,", "quietam noctem tribue.", "", "Ne gravis somnus irruat,", "nec hostis nos surripiat,", "nec caro illi consentiens,", "nos tibi reos statuat.", "", "Oculi somnum capiant,", "cor semper ad te vigilet,", "dextera tua protegat", "famulos qui te diligunt.", "", "Defensor noster, aspice,", "insidiantes reprime,", "guberna tuos famulos,", "quos sanguine mercatus es.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Cristo, que eres luz y día,", "que descubres las tinieblas de la noche,", "y eres proclamado la luz de la luz,", "anunciando la luz bienaventurada.", "", "Te suplicamos, santo Señor,", "defiéndenos en esta noche,", "sea en ti nuestro descanso,", "concédenos una noche tranquila.", "", "Que no nos asalte un sueño pesado,", "ni el enemigo nos sorprenda,", "ni la carne, consintiendo con él,", "nos declare culpables ante ti.", "", "Que los ojos tomen el sueño,", "pero el corazón vele siempre hacia ti,", "que tu diestra proteja", "a los siervos que te aman.", "", "Defensor nuestro, mira,", "reprime a los que nos acechan,", "gobierna a tus siervos,", "a quienes compraste con tu sangre.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por siempre. Amén."]}}, {"id": "o_lux_beata_trinitas", "title": "O Lux Beata Trinitas", "original_language": "la", "lines": {"la": ["O lux beata Trinitas,", "et principalis Unitas,", "iam sol recedit igneus:", "infunde lumen cordibus.", "", "Te mane laudum carmine,", "te deprecemur vespere:", "te nostra supplex gloria", "per cuncta laudet saecula.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Oh luz bienaventurada, Trinidad,", "y Unidad primera,", "ya el sol ígneo se retira:", "infunde tu luz en los corazones.", "", "A ti te alabemos por la mañana con cánticos,", "a ti te supliquemos al atardecer:", "que nuestra súplica te glorifique", "por todos los siglos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y para siempre. Amén."]}}]}, "dates": {"2026-12-17": {"date_human": {"en": "Thursday, December 17, 2026", "es": "Jueves, 17 de diciembre de 2026", "la": "Feria V, die 17 Decembris, anno 2026"}, "day_description": {"en": "December 17, Advent", "es": "17 de diciembre, Adviento", "la": "Feria propria diei 17 Decembris, Adventus"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Saldrá el Señor de su santuario, y vendrá a salvar a su pueblo._", "la": "Egrediétur Dóminus de loco sancto suo, véniet ut salvet pópulum suum."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 84", "content": {"la": [["1", "In finem, filiis Core. Psalmus."], ["2", "Benedixisti, Domine, terram tuam; avertisti captivitatem Jacob."], ["3", "Remisisti iniquitatem plebis tuae, operuisti omnia peccata eorum."], ["4", "Mitigasti omnem iram tuam, avertisti ab ira indignationis tuae."], ["5", "Converte nos, Deus salutaris noster, et averte iram tuam a nobis."], ["6", "Numquid in aeternum irasceris nobis? aut extendes iram tuam a generatione in generationem?"], ["7", "Deus, tu conversus vivificabis nos, et plebs tua laetabitur in te."], ["8", "Ostende nobis, Domine, misericordiam tuam, et salutare tuum da nobis."], ["9", "Audiam quid loquatur in me Dominus Deus, quoniam loquetur pacem in plebem suam, et super sanctos suos, et in eos qui convertuntur ad cor."], ["10", "Verumtamen prope timentes eum salutare ipsius, ut inhabitet gloria in terra nostra."], ["11", "Misericordia et veritas obviaverunt sibi; justitia et pax osculatae sunt."], ["12", "Veritas de terra orta est, et justitia de caelo prospexit."], ["13", "Etenim Dominus dabit benignitatem, et terra nostra dabit fructum suum."], ["14", "Justitia ante eum ambulabit, et ponet in via gressus suos."]], "es": [["2", "¡Oh Señor! tú has derramado la bendición sobre tu tierra; tú has libertado del cautiverio a Jacob."], ["3", "Has perdonado las maldades de tu pueblo; has sepultado todos sus pecados."], ["4", "Has aplacado ya toda tu ira; has calmado el furor de tu indignación."], ["5", "Conviértenos, ¡oh Dios, salvador nuestro!, y aparta tu ira de nosotros."], ["6", "¿Estarás por ventura siempre enojado con nosotros? ¿Se prolongará tu ira de generación en generación?"], ["7", "Oh Dios, volviendo tú el rostro hacia nosotros, nos darás vida; y tu pueblo se regocijará en ti."], ["8", "Muéstranos, Señor, tu misericordia, y danos tu salud."], ["9", "Haz que escuche yo aquello que me hablará el Señor Dios; pues él anunciará la paz a su pueblo, y a sus santos, y a los que se convierten de corazón."], ["10", "Así es que su salud estará cerca de los que le temen y adoran; y habitará la gloria en nuestra tierra."], ["11", "Se encontraron juntas la misericordia y la verdad; se dieron un ósculo la justicia y la paz."], ["12", "La verdad brotó en la tierra, y la justicia nos ha mirado desde lo alto del cielo."], ["13", "Por lo que derramará el Señor su benignidad y nuestra tierra producirá su fruto."], ["14", "La justicia marchará delante de él, y dirigirá sus pasos."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Saldrá el Señor de su santuario, y vendrá a salvar a su pueblo._", "la": "Egrediétur Dóminus de loco sancto suo, véniet ut salvet pópulum suum."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Tenemos en  Sion una ciudad fuerte: el Salvador ha puesto en ella murallas y baluartes; abrid las puertas, que con nosotros está Dios. Aleluya._", "la": "Urbs fortitúdinis nostræ Sion, Salvátor ponétur in ea murus et antemurále; aperíte portas, quia nobíscum Deus, allelúia."}}, {"kind": "psalm", "label": "canticle", "ref": "isa 26:1-4,7-9,12", "content": {"la": [["1", "In die illa cantabitur canticum istud in terra Juda : Urbs fortitudinis nostrae Sion; salvator ponetur in ea murus et antemurale."], ["2", "Aperite portas, et ingrediatur gens justa, custodiens veritatem."], ["3", "Vetus error abiit : servabis pacem; pacem, quia in te speravimus."], ["4", "Sperastis in Domino in saeculis aeternis; in Domino Deo forti in perpetuum."], ["7", "Semita justi recta est, rectus callis justi ad ambulandum."], ["8", "Et in semita judiciorum tuorum, Domine, sustinuimus te : nomen tuum et memoriale tuum in desiderio animae."], ["9", "Anima mea desideravit te in nocte, sed et spiritu meo in praecordiis meis de mane vigilabo ad te. Cum feceris judicia tua in terra, justitiam discent habitatores orbis."], ["12", "Domine, dabis pacem nobis : omnia enim opera nostra operatus es nobis."]], "es": [["1", "En aquel día será cantado este cántico en tierra de Judá: Sion es nuestra ciudad fuerte, el Salvador será para ella muro y antemural."], ["2", "Abrid las puertas, y entre la gente justa, que observa la verdad ó justicia de mis preceptos."], ["3", "Ya se ha disipado el antiguo error: tú, oh"], ["4", "Dirá el Seiior á sus ángeles."], ["7", "La senda del justo es recta: derecha es la vereda por donde el justo camina á la felicidad."], ["8", "Y andando por la senda de tus juicios ó leyes, hemos puesto en tí, oh Señor, nuestra confianza: todo el deseo de nuestra alma se cifra en traer á la memoria tu nombre,"], ["9", "Mi alma te deseó en medio de la noche; y mientras haya aliento en mis entrañas, me dirigiré á tí desde que amanezca. â Cuando habrás ejecutado tus"], ["12", "A nosotros, Señor, nos darás la paz: porque todas nuestras obras tú nos las hiciste * (ó por medio de nosotros)."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Tenemos en  Sion una ciudad fuerte: el Salvador ha puesto en ella murallas y baluartes; abrid las puertas, que con nosotros está Dios. Aleluya._", "la": "Urbs fortitúdinis nostræ Sion, Salvátor ponétur in ea murus et antemurále; aperíte portas, quia nobíscum Deus, allelúia."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Conozca la tierra, Señor, tus caminos, todos los pueblos tu salvación._", "la": "Ut cognoscámus, Dómine, in terra viam tuam, in ómnibus géntibus salutáre tuum."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 66", "content": {"la": [["1", "In finem, in hymnis. Psalmus cantici David."], ["2", "Deus misereatur nostri, et benedicat nobis; illuminet vultum suum super nos, et misereatur nostri;"], ["3", "ut cognascamus in terra viam tuam, in omnibus gentibus salutare tuum."], ["4", "Confiteantur tibi populi, Deus, confiteantur tibi populi omnes."], ["5", "Laetentur et exsultent gentes, quoniam judicas populos in aequitate, et gentes in terra dirigis."], ["6", "Confiteantur tibi populi, Deus, confiteantur tibi populi omnes."], ["7", "Terra dedit fructum suum : benedicat nos Deus, Deus noster!"], ["8", "Benedicat nos Deus, et metuant eum omnes fines terrae."]], "es": [["2", "Dios tenga misericordia de nosotros y nos bendiga; haga resplandecer sobre nosotros la luz de su rostro, y nos mire compasivo;"], ["3", "para que conozcamos, oh Señor, en la tierra tu camino, y en todas las naciones tu salvación."], ["4", "Que te alaben, Dios mío, los pueblos; y publiquen todos los pueblos tus alabanzas."], ["5", "Que se regocijen, salten de gozo las naciones, porque tú juzgas a los pueblos con justicia, y diriges las naciones sobre la tierra."], ["6", "Que te alaben, oh Dios mío, los pueblos; y publiquen todos los pueblos tus alabanzas."], ["7", "Ha dado la tierra su fruto. Bendíganos Dios, el Dios nuestro."], ["8", "Bendíganos Dios, y sea temido en todos los confines de la tierra."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Conozca la tierra, Señor, tus caminos, todos los pueblos tu salvación._", "la": "Ut cognoscámus, Dómine, in terra viam tuam, in ómnibus géntibus salutáre tuum."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "isa 11:1-3", "content": {"la": [["1", "Et egredietur virga de radice Jesse, et flos de radice ejus ascendet."], ["2", "Et requiescet super eum spiritus Domini : spiritus sapientiae et intellectus, spiritus consilii et fortitudinis, spiritus scientiae et pietatis;"], ["3", "et replebit eum spiritus timoris Domini. Non secundum visionem oculorum judicabit, neque secundum auditum aurium arguet;"]], "es": [["1", "y saldrá un renuevo del tronco de Jessé ', y de su raíz se elevará una flor."], ["2", "Y reposará sobre él el Espíritu del Señor, espíritu de sabiduría, y de entendimiento, espíritu de consejo y de fortaleza, espíritu de ciencia y de piedad;"], ["3", "y estará lleno del espíritu del temor del Señor. El no juzgará por lo que aparece exteriormente á la vista, ni condenará solo por lo que se oye decir;"]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Super te, Ierúsalem, * Oriétur Dóminus. Super te.", "℟. Et glória eius in te vidébitur.* Oriétur Dóminus. Glória Patri. Super te."], "es": ["$℣. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℣. $Su gloria aparecerá sobre ti.", "$℟. $Amanecerá el Señor.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Sabed que está cerca el Reino de Dios, os aseguro que no tardará._", "la": "Scitóte quia prope est regnum Dei; amen dico vobis, quia non tardábit."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_Sabed que está cerca el Reino de Dios, os aseguro que no tardará._", "la": "Scitóte quia prope est regnum Dei; amen dico vobis, quia non tardábit."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Deum Patrem, qui antíqua dispositióne pópulum suum salváre státuit, orémus dicéntes:", "– Custódi plebem tuam, Dómine.", "Deus, qui pópulo tuo germen iustítiæ promisísti,", "custódi sanctitátem Ecclésiæ tuæ.", "– Custódi plebem tuam, Dómine.", "Inclína cor hóminum, Deus, in verbum tuum", "et confírma fidéles tuos sine queréla in sanctitáte.", "– Custódi plebem tuam, Dómine.", "Consérva nos in dilectióne Spíritus tui,", "ut Fílii tui, qui ventúrus est, misericórdiam suscipiámus.", "– Custódi plebem tuam, Dómine.", "Confírma nos, Deus clementíssime, usque in finem,", "in diem advéntus Dómini nostri Iesu Christi.", "– Custódi plebem tuam, Dómine."], "es": ["Oremos a Dios Padre, que trazó desde antiguo un plan de salvación para su pueblo, y digámosle:", "- Oh Dios, que prometiste a tu pueblo un vástago que haría justicia, _vela por la santidad de tu Iglesia._ _Guarda a tu pueblo, Señor._", "- Inclina, oh Dios, el corazón de los hombres a tu palabra _y afianza la santidad de tus fieles._ _Guarda a tu pueblo, Señor._", "- Por tu Espíritu consérvanos en el amor, _para que podamos recibir la misericordia de tu Hijo que se acerca._ _Guarda a tu pueblo, Señor._", "- Haz que nos mantengamos firmes, Dios de clemencia, _hasta el día de la manifestación de nuestro Señor Jesucristo._ _Guarda a tu pueblo, Señor._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Deus, humánæ cónditor et redémptor natúræ, qui Verbum tuum in útero perpétuæ virginitátis carnem assúmere voluísti, réspice propítius ad preces nostras, ut Unigénitus tuus, nostra humanitáte suscépta, nos divíno suo consórtio sociáre dignétur. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Dios, creador y restaurador del hombre, que has querido que tu Hijo, Palabra eterna, se encarnase en el seno de María, siempre Virgen, escucha nuestras súplicas, y que Cristo, tu Unigénito, hecho hombre por nosotros, se digne hacernos partícipes de su condición divina. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Saldrá el Señor de su santuario, y vendrá a salvar a su pueblo._", "la": "Egrediétur Dóminus de loco sancto suo, véniet ut salvet pópulum suum."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 124", "content": {"la": [["1", "Canticum graduum. Qui confidunt in Domino, sicut mons Sion : non commovebitur in aeternum, qui habitat"], ["2", "in Jerusalem. Montes in circuitu ejus; et Dominus in circuitu populi sui, ex hoc nunc et usque in saeculum."], ["3", "Quia non relinquet Dominus virgam peccatorum super sortem justorum; ut non extendant justi ad iniquitatem manus suas,"], ["4", "benefac, Domine, bonis, et rectis corde."], ["5", "Declinantes autem in obligationes, adducet Dominus cum operantibus iniquitatem. Pax super Israel!"]], "es": [["1", "Los que ponen en el Señor su confianza estarán firmes como el monte de Sión; nunca jamás será derrotado el morador"], ["2", "de Jerusalén. Rodeada está Jerusalén de montes, y el Señor es el antemural de su pueblo, desde ahora y para siempre."], ["3", "Porque no dejará el Señor sujeto por largo tiempo al dominio de los pecadores el linaje de los justos; para que agobiados no se echen al partido de la iniquidad."], ["4", "Bendice, oh Señor, a los buenos y a los rectos de corazón."], ["5", "Pero a los que se desvían por caminos torcidos, los envolverá el Señor con los malhechores. La paz de Dios estará sobre Israel."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Saldrá el Señor de su santuario, y vendrá a salvar a su pueblo._", "la": "Egrediétur Dóminus de loco sancto suo, véniet ut salvet pópulum suum."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Tenemos en  Sion una ciudad fuerte: el Salvador ha puesto en ella murallas y baluartes; abrid las puertas, que con nosotros está Dios. Aleluya._", "la": "Urbs fortitúdinis nostræ Sion, Salvátor ponétur in ea murus et antemurále; aperíte portas, quia nobíscum Deus, allelúia."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 130", "content": {"la": [["1", "Canticum graduum David. Domine, non est exaltatum cor meum, neque elati sunt oculi mei, neque ambulavi in magnis, neque in mirabilibus super me."], ["2", "Si non humiliter sentiebam, sed exaltavi animam meam; sicut ablactatus est super matre sua, ita retributio in anima mea."], ["3", "Speret Israel in Domino, ex hoc nunc et usque in saeculum."]], "es": [["1", "¡Oh Señor!, no se ha enorgullecido mi corazón, ni mis ojos se han mostrado altivos. No he aspirado a cosas grandes, ni a cosas elevadas sobre mi capacidad."], ["2", "Si yo no he sentido bajamente de mí, sino que al contrario se ha llenado de soberbia mi ánimo, como el niño recién destetado está penando en los brazos de su madre, que así sea la pena dentro de mi corazón."], ["3", "Espere Israel en el Señor, desde ahora y por siempre jamás."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Tenemos en  Sion una ciudad fuerte: el Salvador ha puesto en ella murallas y baluartes; abrid las puertas, que con nosotros está Dios. Aleluya._", "la": "Urbs fortitúdinis nostræ Sion, Salvátor ponétur in ea murus et antemurále; aperíte portas, quia nobíscum Deus, allelúia."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Conozca la tierra, Señor, tus caminos, todos los pueblos tu salvación._", "la": "Ut cognoscámus, Dómine, in terra viam tuam, in ómnibus géntibus salutáre tuum."}}, {"kind": "psalm", "label": "canticle", "ref": "rev 4:11;5:9,10,12", "content": {"la": [["4:11", "Dignus es Domine Deus noster accipere gloriam, et honorem, et virtutem : quia tu creasti omnia, et propter voluntatem tuam erant, et creata sunt."], ["5:9", "et cantabant canticum novum, dicentes : Dignus es, Domine, accipere librum, et aperire signacula ejus : quoniam occisus es, et redemisti nos Deo in sanguine tuo ex omni tribu, et lingua, et populo, et natione :"], ["5:10", "et fecisti nos Deo nostro regnum, et sacerdotes : et regnabimus super terram."], ["5:12", "dicentium voce magna : Dignus est Agnus, qui occisus est, accipere virtutem, et divinitatem, et sapientiam, et fortitudinem, et honorem, et gloriam, et benedictionem."]], "es": [["4:11", "Digno eres, ó Señor, Dios nuestro, de recibir la gloria y el honor y el poderío; porque tú criaste todas las cosas; y por tu querer subsisten y fueron criadas."], ["5:9", "y cantaban un cántico nuevo, diciendo: Digno eres, Señor, de recibir el libro, y de abrir sus sellos, porque tú has sido entregado á la muerte, y con tu sangre nos has rescatado para Dios, de todas las tribus, y lenguas, y pueblos, y naciones:"], ["5:10", "con que nos hiciste para nuestro Dios reyes y sacerdotes*; y reinaremos sobre la (ierra hasta que después reinemos contigo en el cielo."], ["5:12", "los cuales decian en alta voz: Digno es el Cordero que ha sido sacrificado, de recibir el poder, y la divinidad, y la sabiduría, y la fortaleza, y el honor, y la gloria, y la bendición '."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Conozca la tierra, Señor, tus caminos, todos los pueblos tu salvación._", "la": "Ut cognoscámus, Dómine, in terra viam tuam, in ómnibus géntibus salutáre tuum."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "1thess 5:23-24", "content": {"la": [["23", "Ipse autem Deus pacis sanctificet vos per omnia : ut integer spiritus vester, et anima, et corpus sine querela in adventu Domini nostri Jesu Christi servetur."], ["24", "Fidelis est, qui vocavit vos : qui etiam faciet."]], "es": [["23", "Y el Dios de la paz os haga santos en todo, á fin de que vuestro espíritu entero, con alma y cuerpo se conserven sin culpa para cuando venga nuestro Señor Jesu-Christo."], ["24", "Fiel es el que os llamó;y así lo hará como lo ha ofrecido."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Osténde nobis, Dómine,* Misericórdiam tuam. Osténde.", "℟. Et salutáre tuum da nobis.* Misericórdiam tuam. Glória Patri. Osténde."], "es": ["$℣. $Muéstranos, Señor,  tu  misericordia.", "$℟. $Muéstranos, Señor,  tu  misericordia.", "$℣. $Danos tu salvación.", "$℟. $Tu  misericordia.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Muéstranos, Señor,  tu  misericordia."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Oh Sabiduría, que brotaste de los labios del Altísimo, abarcando del uno al otro confín y ordenándolo todo con firmeza y suavidad, ven y muéstranos el camino de la salvación._", "la": "O Sapiéntia, quæ ex ore Altíssimi prodísti, attíngens a fine usque ad finem, fórtiter suavitérque dispónens ómnia: veni ad docéndum nos viam prudéntiæ."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_Oh Sabiduría, que brotaste de los labios del Altísimo, abarcando del uno al otro confín y ordenándolo todo con firmeza y suavidad, ven y muéstranos el camino de la salvación._", "la": "O Sapiéntia, quæ ex ore Altíssimi prodísti, attíngens a fine usque ad finem, fórtiter suavitérque dispónens ómnia: veni ad docéndum nos viam prudéntiæ."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christum, gáudium et exsultatiónem ómnium eum exspectántium, lætántes invocémus:", "– Veni, Dómine, et noli tardáre.", "Læti exspectámus advéntum tuum,", "veni, Dómine Iesu.", "– Veni, Dómine, et noli tardáre.", "Tu, qui es ante sǽcula,", "veni ad salvándum nos in hoc sǽculo.", "– Veni, Dómine, et noli tardáre.", "Tu, qui creásti mundum et omnes qui hábitant in eo,", "veni ad rediméndum opus mánuum tuárum.", "– Veni, Dómine, et noli tardáre.", "Qui nostram non horruísti mortálem natúram,", "veni ad eripiéndum nos a mortis império.", "– Veni, Dómine, et noli tardáre.", "Qui venísti, ut vitam haberémus superabundántem,", "veni nobísque dona tuam vitam ætérnam.", "– Veni, Dómine, et noli tardáre.", "Qui omnes hómines in regnum tuum adunáre voluísti,", "veni ad congregándum eos, qui visiónem vultus tui exspéctant.", "– Veni, Dómine, et noli tardáre."], "es": ["Invoquemos a Cristo, alegría y júbilo de cuantos esperan su llegada, y digámosle:", "- Esperamos, alegres, tu venida:_ ven, Señor Jesús._ _¡Ven, Señor, y no tardes más!_", "- Tú que existes antes de los tiempos,_ ven y salva a los que viven en el tiempo._ _¡Ven, Señor, y no tardes más!_", "- Tú que creaste el mundo y a todos los que en él habitan,_ ven a restaurar la obra de tus manos._ _¡Ven, Señor, y no tardes más!_", "- Tú que no despreciaste nuestra naturaleza mortal,_ ven y arráncanos del dominio de la muerte._ _¡Ven, Señor, y no tardes más!_", "- Tú que viniste para que tuviéramos vida abundante,_ ven y danos tu vida eterna._ _¡Ven, Señor, y no tardes más!_", "- Tú que quieres congregar a todos los hombres en tu reino,_ ven y reúne a cuantos desean contemplar tu rostro._ _¡Ven, Señor, y no tardes más!_"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Deus, humánæ cónditor et redémptor natúræ, qui Verbum tuum in útero perpétuæ virginitátis carnem assúmere voluísti, réspice propítius ad preces nostras, ut Unigénitus tuus, nostra humanitáte suscépta, nos divíno suo consórtio sociáre dignétur. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Dios, creador y restaurador del hombre, que has querido que tu Hijo, Palabra eterna, se encarnase en el seno de María, siempre Virgen, escucha nuestras súplicas, y que Cristo, tu Unigénito, hecho hombre por nosotros, se digne hacernos partícipes de su condición divina. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Caro mea requiescet in spe.", "es": "Mi carne descansará en la esperanza."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 15", "content": {"la": [["1", "Tituli inscriptio, ipsi David. Conserva me, Domine, quoniam speravi in te."], ["2", "Dixi Domino : Deus meus es tu, quoniam bonorum meorum non eges."], ["3", "Sanctis, qui sunt in terra ejus, mirificavit omnes voluntates meas in eis."], ["4", "Multiplicatae sunt infirmitates eorum, postea acceleraverunt. Non congregabo conventicula eorum de sanguinibus; nec memor ero nominum eorum per labia mea."], ["5", "Dominus pars haereditatis meae, et calicis mei : tu es qui restitues haereditatem meam mihi."], ["6", "Funes ceciderunt mihi in praeclaris; etenim haereditas mea praeclara est mihi."], ["7", "Benedicam Dominum qui tribuit mihi intellectum; insuper et usque ad noctem increpuerunt me renes mei."], ["8", "Providebam Dominum in conspectu meo semper, quoniam a dextris est mihi, ne commovear."], ["9", "Propter hoc laetatum est cor meum, et exsultavit lingua mea; insuper et caro mea requiescet in spe."], ["10", "Quoniam non derelinques animam meam in inferno, nec dabis sanctum tuum videre corruptionem."], ["11", "Notas mihi fecisti vias vitae; adimplebis me laetitia cum vultu tuo : delectationes in dextera tua usque in finem."]], "es": [["1", "Sálvame, oh Señor, pues tengo puesta en ti toda mi esperanza."], ["2", "Yo dije al Señor: Tú eres mi Dios, que no tienes necesidad de mis bienes."], ["3", "Cumplido ha maravillosamente todos mis deseos, en los santos que moran en su tierra."], ["4", "Multiplicaron los impíos sus miserias, o sus miserables deidades; en pos de las cuales corrían aceleradamente. No seré yo el que convoque sus sanguinarios sacrificios, ni siquiera tomaré en boca sus nombres."], ["5", "El Señor es la parte que me ha tocado en herencia, y la porción destinada para mí. Tú eres, oh Señor, el que me restituirá y conservará mi heredad."], ["6", "En delicioso sitio me cupo la suerte; hermosa es, a la verdad, la herencia que me ha tocado."], ["7", "Alabaré, pues, al Señor, que me ha dado este entendimiento; a lo cual, aun durante la noche, mi corazón me excitaba."], ["8", "Yo contemplaba siempre al Señor delante de mí, como quien está a mi diestra para sostenerme."], ["9", "Por eso se regocijó mi corazón, y prorrumpió en cánticos alegres mi lengua; y además también mi carne descansará con la esperanza."], ["10", "Porque yo sé que no has de abandonar tú, oh Señor, mi alma en el sepulcro; ni permitirás que tu Santo experimente la corrupción."], ["11", "Me hiciste conocer las sendas de la vida; me colmarás de gozo con la vista de tu divino rostro; en tu diestra se hallan delicias eternas."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Caro mea requiescet in spe.", "es": "Mi carne descansará en la esperanza."}}, {"kind": "psalm", "label": "reading", "ref": "1Thess 5:23", "content": {"la": [["23", "Ipse autem Deus pacis sanctificet vos per omnia : ut integer spiritus vester, et anima, et corpus sine querela in adventu Domini nostri Jesu Christi servetur."]], "es": [["23", "Y el Dios de la paz os haga santos en todo, á fin de que vuestro espíritu entero, con alma y cuerpo se conserven sin culpa para cuando venga nuestro Señor Jesu-Christo."]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Domine Deus noster, diurno labore fatigatos, quieto sopore nos refove, ut, tuo semper auxilio recreati, tibi corpore simus et mente devoti. Per Christum Dominum nostrum.", "es": "Señor, Dios nuestro, concédenos un descanso tranquilo que restaure nuestras fuerzas, desgastadas ahora por el trabajo del día; así, fortalecidos con tu ayuda, te serviremos siempre con todo nuestro cuerpo y nuestro espíritu. Por Jesucristo nuestro Señor."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-12-18": {"date_human": {"en": "Friday, December 18, 2026", "es": "Viernes, 18 de diciembre de 2026", "la": "Feria VI, die 18 Decembris, anno 2026"}, "day_description": {"en": "December 18, Advent", "es": "18 de diciembre, Adviento", "la": "Feria propria diei 18 Decembris, Adventus"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Desde Sion vendrá el Señor todopoderoso a salvar a su pueblo._", "la": null}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 85", "content": {"la": [["1", "Oratio ipsi David. Inclina, Domine, aurem tuam et exaudi me, quoniam inops et pauper sum ego."], ["2", "Custodi animam meam, quoniam sanctus sum; salvum fac servum tuum, Deus meus, sperantem in te."], ["3", "Miserere mei, Domine, quoniam ad te clamavi tota die;"], ["4", "laetifica animam servi tui, quoniam ad te, Domine, animam meam levavi."], ["5", "Quoniam tu, Domine, suavis et mitis, et multae misericordiae omnibus invocantibus te."], ["6", "Auribus percipe, Domine, orationem meam, et intende voci deprecationis meae."], ["7", "In die tribulationis meae clamavi ad te, quia exaudisti me."], ["8", "Non est similis tui in diis, Domine, et non est secundum opera tua."], ["9", "Omnes gentes quascumque fecisti venient, et adorabunt coram te, Domine, et glorificabunt nomen tuum."], ["10", "Quoniam magnus es tu, et faciens mirabilia; tu es Deus solus."], ["11", "Deduc me, Domine, in via tua, et ingrediar in veritate tua; laetetur cor meum, ut timeat nomen tuum."], ["12", "Confitebor tibi, Domine Deus meus, in toto corde meo, et glorificabo nomen tuum in aeternum;"], ["13", "quia misericordia tua magna est super me, et eruisti animam meam ex inferno inferiori."], ["14", "Deus, iniqui insurrexerunt super me, et synagoga potentium quaesierunt animam meam, et non proposuerunt te in conspectu suo."], ["15", "Et tu, Domine Deus, miserator et misericors; patiens, et multae misericordiae, et verax."], ["16", "Respice in me, et miserere mei; da imperium tuum puero tuo, et salvum fac filium ancillae tuae."], ["17", "Fac mecum signum in bonum, ut videant qui oderunt me, et confundantur, quoniam tu, Domine, adjuvisti me, et consolatus es me."]], "es": [["1", "Inclina, Señor, tu oído a mis ruegos, y escúchame, porque me hallo afligido y necesitado."], ["2", "Guarda mi vida, puesto que soy santo. Salva, ¡oh Dios mío!, a este siervo tuyo que tiene puesta en ti su esperanza."], ["3", "Señor, ten misericordia de mí, porque no ceso de clamar a ti todo el día."], ["4", "Consuela el alma de tu siervo, pues a ti, ¡oh Señor!, tengo de continuo elevado mi espíritu."], ["5", "Siendo tú, Señor, como eres, suave, y benigno, y de gran clemencia para con todos los que te invocan,"], ["6", "oye propicio, ¡oh Señor!, mi oración, y atiende a la voz de mis ruegos."], ["7", "A ti clamaré el día de mi tribulación, pues tú siempre me has oído benignamente."], ["8", "Ninguno hay entre los dioses que pueda, ¡oh Señor!, parangonarse contigo; ninguno que pueda imitar tus obras."], ["9", "Las naciones todas, cuantas creaste, vendrán, Señor; y postradas ante ti te adorarán, y tributarán gloria a tu Nombre."], ["10", "Porque tú eres el grande; tú el hacedor de maravillas; tú solo eres Dios."], ["11", "Guíame Señor, por tus sendas, y yo caminaré según tu verdad; alégrese mi corazón de modo que respete tu Nombre."], ["12", "Te alabaré, ¡oh Señor Dios mío!, con todo mi corazón y glorificaré eternamente tu Nombre."], ["13", "Porque es grande tu misericordia para conmigo, y has sacado mi alma del infierno profundo."], ["14", "¡Oh Dios!, han conspirado contra mí los impíos, y una reunión de poderosos ha atentado contra mi vida, sin atender a que tú te hallas presente."], ["15", "Pero tú, Señor Dios, compasivo y benéfico, paciente y misericordiosísimo y veraz,"], ["16", "vuelve hacia mí tu rostro, y tenme lástima; da tu imperio a tu siervo, y pon a salvo al hijo de tu esclava."], ["17", "Obra algún prodigio a favor mío, para que los que me aborrecen, vean con confusión suya, cómo tú, ¡oh Señor!, me has socorrido y consolado."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Desde Sion vendrá el Señor todopoderoso a salvar a su pueblo._", "la": null}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Por amor de Sion no callaré, hasta que amanezca como una aurora su Justo._", "la": "Propter Sion non tacébo, donec egrediátur ut splendor Iustus eius."}}, {"kind": "psalm", "label": "canticle", "ref": "isa 33:13-16", "content": {"la": [["13", "Audite, qui longe estis, quae fecerim; et cognoscite, vicini, fortitudinem meam."], ["14", "Conterriti sunt in Sion peccatores; possedit tremor hypocritas. Quis poterit habitare de vobis cum igne devorante? quis habitabit ex vobis cum ardoribus sempiternis?"], ["15", "Qui ambulat in justitiis et loquitur veritatem, qui projicit avaritiam ex calumnia, et excutit manus suas ab omni munere, qui obturat aures suas ne audiat sanguinem, et claudit oculos suos ne videat malum."], ["16", "Iste in excelsis habitabit; munimenta saxorum sublimitas ejus : panis ei datus est, aquae ejus fideles sunt."]], "es": [["13", "Vosotros los que estáis lejos, escuchad las cosas que he hecho yo; y aprended á conocer mi poder los que estáis cerca."], ["14", "Aterrados han sido en Sion los pecadores: el temblor se ha apoderado de los hipócritas. ¿Quién de vosotros podrá habitar en un fuego devorador? ¿Quién de vosotros podrá morar entre los ardores sempiternos?"], ["15", "Aquel que anda por las sendas de la justicia, y habla verdad, que aborrece las riquezas adquiridas con la calumnia ó estorsion, y tiene limpias sus manos de todo cohecho; que tapa sus orejas para no prestar oido á los sanguinarios, y cierra sus ojos por no ver lo malo."], ["16", "Este es el que tendrá su morada en las alturas: vivirá seguro, como en una alta roca: tendrá pan en abundancia y nunca le faltará el agua."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Por amor de Sion no callaré, hasta que amanezca como una aurora su Justo._", "la": "Propter Sion non tacébo, donec egrediátur ut splendor Iustus eius."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El Espíritu del Señor está sobre mí; me ha enviado para dar la Buena Noticia a los pobres._", "la": "Spíritus Dómini super me, evangelizáre paupéribus misit me."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 97", "content": {"la": [["1", "Psalmus ipsi David. Cantate Domino canticum novum, quia mirabilia fecit. Salvavit sibi dextera ejus, et brachium sanctum ejus."], ["2", "Notum fecit Dominus salutare suum; in conspectu gentium revelavit justitiam suam."], ["3", "Recordatus est misericordiae suae, et veritatis suae domui Israel. Viderunt omnes termini terrae salutare Dei nostri."], ["4", "Jubilate Deo, omnis terra; cantate et exsultate, et psallite."], ["5", "Psallite Domino in cithara; in cithara et voce psalmi;"], ["6", "in tubis ductilibus, et voce tubae corneae. Jubilate in conspectu regis Domini;"], ["7", "moveatur mare, et plenitudo ejus; orbis terrarum, et qui habitant in eo."], ["8", "Flumina plaudent manu, simul montes exsultabunt"], ["9", "a conspectu Domini, quoniam venit judicare terram. Judicabit orbem terrarum in justitia, et populos in aequitate."]], "es": [["1", "Cantad al Señor un cántico nuevo; porque ha hecho maravillas. Su diestra y su santo brazo han obrado su salvación."], ["2", "El Señor ha hecho conocer su salvador, ha mostrado su justicia a los ojos de las naciones."], ["3", "Ha tenido presente su misericordia y la verdad de sus promesas a favor de la casa de Israel. Todos los confines de la tierra han visto la salvación que nuestro Dios nos ha enviado."], ["4", "Cantad, pues, festivos himnos a Dios todas las regiones de la tierra; cantad y saltad de alegría, y salmead."], ["5", "Salmead a gloria del Señor con la cítara y con voces armoniosas,"], ["6", "al eco de las trompetas de metal y al sonido de bocinas. Mostrad vuestro alborozo en la presencia de este rey que es el Señor."], ["7", "Conmuévase de gozo el mar y cuanto en él se encierra; la tierra toda, con sus habitantes."], ["8", "Los ríos aplaudirán con palmadas; los montes a una saltarán de contento"], ["9", "a la vista del Señor, porque viene a gobernar la tierra. El juzgará la tierra con justicia y a los pueblos con rectitud."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El Espíritu del Señor está sobre mí; me ha enviado para dar la Buena Noticia a los pobres._", "la": "Spíritus Dómini super me, evangelizáre paupéribus misit me."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "rom 13:11-12", "content": {"la": [["11", "Et hoc scientes tempus : quia hora est jam nos de somno surgere. Nunc enim propior est nostra salus, quam cum credidimus."], ["12", "Nox praecessit, dies autem appropinquavit. Abjiciamus ergo opera tenebrarum, et induamur arma lucis."]], "es": [["11", "Cumplamos pues con él, y tanto más que sabemos que el tiempo insta, y que ya es hora de dispertarnos de nuestro letargo: pues estamos más cerca de nuestra salud, que cuando recibimos la fé."], ["12", "La noche está ya muy avanzada, y va á llegar el día de la eternidad. Dejemos pues las obras de las tinieblas, y revistámonos de las armas de la luz."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Super te, Ierúsalem, * Oriétur Dóminus. Super te.", "℟. Et glória eius in te vidébitur.* Oriétur Dóminus. Glória Patri. Super te."], "es": ["$℣. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℣. $Su gloria aparecerá sobre ti.", "$℟. $Amanecerá el Señor.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_No dejéis de velar: pronto llegará el Señor, nuestro Dios._", "la": "Vigiláte ánimo, in próximo est Dóminus Deus noster."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_No dejéis de velar: pronto llegará el Señor, nuestro Dios._", "la": "Vigiláte ánimo, in próximo est Dóminus Deus noster."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Dóminum Iesum Christum, fratres caríssimi, deprecémur, qui est iudex vivórum et mortuórum, eíque fidénter dicámus:", "– Veni, Dómine Iesu.", "Christe Dómine, qui peccatóres salváre venísti,", "nos ab omni tentatiónum adversitáte defénde.", "– Veni, Dómine Iesu.", "Qui ad iudícium maniféste ventúrus esse créderis,", "poténtiam tuæ salvatiónis in nobis osténde.", "– Veni, Dómine Iesu.", "Da nobis legis tuæ præcépta virtúte Spíritus custodíre,", "ut advéntum tuum in caritáte præstolári possímus.", "– Veni, Dómine Iesu.", "Tu, qui es benedíctus et vivis et ómnia regis, fac ut nos per misericórdiam tuam pie et sóbrie in hoc sǽculo vivámus,", "exspectántes beátam spem et advéntum magnificéntiæ tuæ.", "– Veni, Dómine Iesu."], "es": ["Roguemos, hermanos, al Señor Jesús, juez de vivos y muertos, y digámosle:", "- Señor Jesucristo, que viniste a salvar a los pecadores, _líbranos de caer en la tentación._ _Ven, Señor Jesús._", "- Tú que vendrás con gloria para juzgar a tu pueblo, _muestra en nosotros tu poder salvador._ _Ven, Señor Jesús._", "- Ayúdanos a cumplir con fortaleza de espíritu los preceptos de tu ley, _para que podamos esperar tu venida sin temor._ _Ven, Señor Jesús._", "- Tú que eres bendito por los siglos, _concédenos por tu misericordia, que, llevando ya desde ahora una vida sobria y religiosa, esperemos con gozo tu gloriosa aparición._ _Ven, Señor Jesús._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Concéde, quǽsumus, omnípotens Deus, ut, qui sub peccáti iugo ex vetústa servitúte deprímimur, exspectáta Unigéniti tui nova nativitáte liberémur. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Concédenos, Señor, a los que vivimos oprimidos por la antigua esclavitud del pecado ser liberados por el nuevo y esperado nacimiento de tu Hijo. Que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Desde Sion vendrá el Señor todopoderoso a salvar a su pueblo._", "la": null}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 125", "content": {"la": [["1", "Canticum graduum. In convertendo Dominus captivitatem Sion, facti sumus sicut consolati."], ["2", "Tunc repletum est gaudio os nostrum, et lingua nostra exsultatione. Tunc dicent inter gentes : Magnificavit Dominus facere cum eis."], ["3", "Magnificavit Dominus facere nobiscum; facti sumus laetantes."], ["4", "Converte, Domine, captivitatem nostram, sicut torrens in austro."], ["5", "Qui seminant in lacrimis, in exsultatione metent."], ["6", "Euntes ibant et flebant, mittentes semina sua."], ["7", "Venientes autem venient cum exsultatione, portantes manipulos suos."]], "es": [["2", "Cuando el Señor haga volver a Sión los cautivos, será indecible nuestro consuelo."], ["3", "Entonces rebosará de gozo nuestra boca, y de júbilo nuestra lengua. Se dirá entonces entre las naciones: Grandiosas cosas ha hecho por ellos el Señor."], ["4", "Sí, cosas grandes ha obrado el Señor a favor nuestro, inundados estamos de gozo."], ["5", "Pero, Señor, libra de la esclavitud a los demás de nuestros hermanos cautivos; vuelvan como torrentes al soplo del mediodía."], ["6", "Aquellos que sembraban con lágrimas segarán llenos de júbilo."], ["7", "Cuando iban, esparcían llorando sus semillas; mas cuando vuelvan, vendrán con gran regocijo, trayendo las gavillas de sus mieses."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Desde Sion vendrá el Señor todopoderoso a salvar a su pueblo._", "la": null}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Por amor de Sion no callaré, hasta que amanezca como una aurora su Justo._", "la": "Propter Sion non tacébo, donec egrediátur ut splendor Iustus eius."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 126", "content": {"la": [["1", "Canticum graduum Salomonis. Nisi Dominus aedificaverit domum, in vanum laboraverunt qui aedificant eam. Nisi Dominus custodierit civitatem, frustra vigilat qui custodit eam."], ["2", "Vanum est vobis ante lucem surgere : surgite postquam sederitis, qui manducatis panem doloris. Cum dederit dilectis suis somnum,"], ["3", "ecce haereditas Domini, filii; merces, fructus ventris."], ["4", "Sicut sagittae in manu potentis, ita filii excussorum."], ["5", "Beatus vir qui implevit desiderium suum ex ipsis : non confundetur cum loquetur inimicis suis in porta."]], "es": [["1", "Si el Señor no es el que edifica la casa, en vano se fatigan los que la fabrican. Si el Señor no guarda la ciudad, inútilmente se desvela el que la guarda."], ["2", "En vano será levantaros antes de amanecer; levantaos después de haber descansado, y acudid al Señor los que coméis pan de lágrimas. Mientras concede Dios el sueño y el reposo a sus amados,"], ["3", "he aquí que les viene del Señor la herencia, los hijos, las ganancias y las crías de los ganados."], ["4", "Como las flechas en mano de un hombre robusto, así los hijos de los justos atribulados."], ["5", "Dichoso aquel varón que ve cumplidos sus deseos con respecto a sus hijos; no quedará confundido cuando hubiera de tratar con sus enemigos en las puertas o tribunales."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Por amor de Sion no callaré, hasta que amanezca como una aurora su Justo._", "la": "Propter Sion non tacébo, donec egrediátur ut splendor Iustus eius."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El Espíritu del Señor está sobre mí; me ha enviado para dar la Buena Noticia a los pobres._", "la": "Spíritus Dómini super me, evangelizáre paupéribus misit me."}}, {"kind": "psalm", "label": "canticle", "ref": "col 1:12-20", "content": {"la": [["12", "gratias agentes Deo Patri, qui dignos nos fecit in partem sortis sanctorum in lumine :"], ["13", "qui eripuit nos de potestate tenebrarum, et transtulit in regnum filii dilectionis suae,"], ["14", "in quo habemus redemptionem per sanguinem ejus, remissionem peccatorum :"], ["15", "qui est imago Dei invisibilis, primogenitus omnis creaturae :"], ["16", "quoniam in ipso condita sunt universa in caelis, et in terra, visibilia, et invisibilia, sive throni, sive dominationes, sive principatus, sive potestates : omnia per ipsum et in ipso creata sunt :"], ["17", "et ipse est ante omnes, et omnia in ipso constant."], ["18", "Et ipse est caput corporis Ecclesiae, qui est principium, pr
