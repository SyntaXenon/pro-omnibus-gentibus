label": "psalm", "ref": "Ps 109:1-5,7", "content": {"la": [["1", "Psalmus David. Dixit Dominus Domino meo : Sede a dextris meis, donec ponam inimicos tuos scabellum pedum tuorum."], ["2", "Virgam virtutis tuae emittet Dominus ex Sion : dominare in medio inimicorum tuorum."], ["3", "Tecum principium in die virtutis tuae in splendoribus sanctorum; ex utero, ante luciferum, genui te."], ["4", "Juravit Dominus, et non poenitebit eum : Tu es sacerdos in aeternum secundum ordinem Melchisedech."], ["5", "Dominus a dextris tuis; confregit in die irae suae reges."], ["7", "de torrente in via bibet; propterea exaltabit caput."]], "es": [["1", "El Señor dijo a mi Señor: Siéntate a mi diestra, mientras que yo pongo a tus enemigos por tarima de tus pies."], ["2", "De Sión hará salir el Señor el cetro de tu poder; domina tú en medio de tus enemigos."], ["3", "Contigo está el principado el día de tu poderío, en medio de los resplandores de la santidad; de mis entrañas te engendré, antes de existir el lucero de la mañana."], ["4", "Juró el Señor, y no se arrepentirá, y dijo: Tú eres sacerdote sempiterno, según el orden de Melquisedec."], ["5", "El Señor está a tu diestra; en el día de su ira destrozó a los reyes."], ["7", "Beberá del torrente durante el camino, por eso levantará su cabeza."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Hija de Sion, alégrate; salta de gozo, hija de Jerusalén. Aleluya._", "la": "Iucundáre, fília Sion, et exsúlta satis fília Ierúsalem, allelúia."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Vendrá nuestro Rey, Cristo, el Señor: el Cordero de quien Juan anunció la venida._", "la": "Rex noster advéniet Christus, quem Ioánnes prædicávit Agnum esse ventúrum."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 113:1-8", "content": {"la": [["1", "Alleluja. In exitu Israel de Aegypto, domus Jacob de populo barbaro,"], ["2", "facta est Judaea sanctificatio ejus, Israel potestas ejus."], ["3", "Mare vidit, et fugit; Jordanis conversus est retrorsum."], ["4", "Montes exsultaverunt ut arietes, et colles sicut agni ovium."], ["5", "Quid est tibi, mare, quod fugisti? et tu, Jordanis, quia conversus es retrorsum?"], ["6", "montes, exsultastis sicut arietes? et colles sicut agni ovium?"], ["7", "A facie Domini mota est terra, a facie Dei Jacob;"], ["8", "qui convertit petram in stagna aquarum, et rupem in fontes aquarum."]], "es": [["1", "Cuando Israel salió de Egipto, al partir la casa de Jacob de en medio de aquel pueblo extranjero."], ["2", "Consagró Dios a su servicio al pueblo de Judá, y estableció su imperio en Israel."], ["3", "El mar lo vio, y echó a huir; el Jordán volvió hacia atrás."], ["4", "Los montes brincaron de gozo como carneros, y los collados como corderitos."], ["5", "¿Qué tienes tú, ¡oh mar!, que así has huido?; y tú, ¡oh Jordán!, ¿por qué has vuelto atrás?"], ["6", "Vosotros, ¡oh montes!, ¿por qué brincasteis de gozo como carneros?; y ¿vosotros, ¡oh collados!, como corderitos?"], ["7", "Por la presencia del Señor se estremeció la tierra, por la presencia del Dios de Jacob,"], ["8", "que convirtió la peña en estanque de aguas, y en fuentes de aguas la árida roca."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Vendrá nuestro Rey, Cristo, el Señor: el Cordero de quien Juan anunció la venida._", "la": "Rex noster advéniet Christus, quem Ioánnes prædicávit Agnum esse ventúrum."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Llego en seguida y traigo conmigo mi salario, para pagar a cada uno según sus propias obras._", "la": "Ecce vénio cito, et merces mea mecum est, dicit Dóminus: dare unicuíque secúndum ópera sua."}}, {"kind": "psalm", "label": "canticle", "ref": "rev 19:1-2,5-7", "content": {"la": [["1", "Post haec audivi quasi vocem turbarum multarum in caelo dicentium : Alleluja : salus, et gloria, et virtus Deo nostro est :"], ["2", "quia vera et justa judicia sunt ejus, qui judicavit de meretrice magna, quae corrupit terram in prostitutione sua, et vindicavit sanguinem servorum suorum de manibus ejus."], ["5", "Ex vox de throno exivit, dicens : Laudem dicite Deo nostro omnes servi ejus : et qui timetis eum pusilli et magni."], ["6", "Et audivi quasi vocem turbae magnae, et sicut vocem aquarum multarum, et sicut vocem tonitruorum magnorum, dicentium : Alleluja : quoniam regnavit Dominus Deus noster omnipotens."], ["7", "Gaudeamus, et exsultemus : et demus gloriam ei : quia venerunt nuptiae Agni, et uxor ejus praeparavit se."]], "es": [["1", "Después de estas cosas oi en ci cielo como una voz de muchas gentes, que decían: AUeluya: La salvación, y la gloria, y el poder son debidos á nuestro Dios;"], ["2", "porque verdaderos son y justos sus juicios, pues ha condenado á la gran ramera, la cual estragó la tierra con su prostitución, y ha vengado la sangre de sus siervos derramada por las manos de ella."], ["5", "Y del solio salió una voz que decía: Alabad á nuestro Dios todos sus siervos, y los que le teméis, pequeños y grandes."], ["6", "Oí también una voz como de gran gentío, y como el ruido de muchas aguas, y como el estampido de grandes truenos, que decia: Alleluya; porque tomó ya posesión del reino el Señor Dios nuestro todopoderoso."], ["7", "Gozémonos, y saltemos de júbilo, y démosle la gloria, pues son llegadas las bodas del Cordero ', y la Iglesia su esposa se ha puesto de gala ó ataviada."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Llego en seguida y traigo conmigo mi salario, para pagar a cada uno según sus propias obras._", "la": "Ecce vénio cito, et merces mea mecum est, dicit Dóminus: dare unicuíque secúndum ópera sua."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "phil 4:4-5", "content": {"la": [["4", "Gaudete in Domino semper : iterum dico gaudete."], ["5", "Modestia vestra nota sit omnibus hominibus : Dominus prope est."]], "es": [["4", "Vivid siempre alegres en el Señor: vivid alegres repito '."], ["5", "Sea vuestra modestia * patente á lodos los hombres: el Señor está cerca."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Osténde nobis, Dómine,* Misericórdiam tuam. Osténde.", "℟. Et salutáre tuum da nobis.* Misericórdiam tuam. Glória Patri. Osténde."], "es": ["$℣. $Muéstranos, Señor,  tu  misericordia.", "$℟. $Muéstranos, Señor,  tu  misericordia.", "$℣. $Danos tu salvación.", "$℟. $Tu  misericordia.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Muéstranos, Señor,  tu  misericordia."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_No temas, María, porque has encontrado gracia ante Dios. Concebirás en tu vientre y darás a luz a un hijo. Aleluya._", "la": "Ne tímeas, María: invenísti enim grátiam apud Dóminum: ecce concípies et páries Fílium."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_No temas, María, porque has encontrado gracia ante Dios. Concebirás en tu vientre y darás a luz a un hijo. Aleluya._", "la": "Ne tímeas, María: invenísti enim grátiam apud Dóminum: ecce concípies et páries Fílium."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Redemptórem nostrum Iesum Christum, qui est via, véritas et vita, supplíciter rogémus, dicéntes:", "– Veni et mane nobíscum, Dómine.", "Iesu, Fili Altíssimi, qui Vírgini Maríæ per Gabriélem annuntiátus es,", "veni ad regnándum super plebem tuam in ætérnum.", "– Veni et mane nobíscum, Dómine.", "Tu, Sancte Dei, cui Præcúrsor in sinu Elísabeth exsultávit,", "veni ad dandum univérso mundo gáudium salútis.", "– Veni et mane nobíscum, Dómine.", "Iesu Salvátor, cuius nomen Ioseph viro iusto ab Angelo revelátum est,", "veni ad pópulum tuum salvum faciéndum a peccátis eórum.", "– Veni et mane nobíscum, Dómine.", "Lumen mundi, quod Símeon et omnes iusti exspectábant,", "veni ad consolándum nos.", "– Veni et mane nobíscum, Dómine.", "Oriens indefíciens, quem nos ex alto visitatúrum prædíxit Zacharías,", "veni ad illuminándum illos, qui in umbra mortis sedent.", "– Veni et mane nobíscum, Dómine."], "es": ["Oremos a Jesucristo, nuestro redentor, que es camino, verdad y vida de los hombres, y digámosle:", "- Jesús, Hijo del Altísimo, anunciado por el ángel Gabriel a María Virgen, _ven a reinar para siempre sobre tu pueblo._ _Ven, Señor, y quédate con nosotros._", "- Santo de Dios, ante cuya venida el Precursor saltó de gozo en el seno de Isabel,_ven y alegra al mundo con la gracia de la salvación._ _Ven, Señor, y quédate con nosotros._", "- Jesús, Salvador,  cuyo nombre el ángel reveló a José,_ven a salvar al pueblo de sus pecados._ _Ven, Señor, y quédate con nosotros._", "- Luz del mundo, a quien esperaban Simeón y todos los justos,_ven a consolar a tu pueblo._ _Ven, Señor, y quédate con nosotros._", "- Sol naciente que nos visitará de lo alto, como profetizó Zacarías,_ven a iluminar a los que viven en tinieblas y en sombra de muerte._ _Ven, Señor, y quédate con nosotros._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Da, quǽsumus, omnípotens Deus, hanc tuis fidélibus voluntátem, ut, Christo tuo veniénti iustis opéribus occurréntes, eius déxteræ sociáti, regnum mereántur possidére cæléste. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Dios todopoderoso, aviva en tus fieles, al comenzar el Adviento, el deseo de salir al encuentro de Cristo, que viene, acompañados por las buenas obras, para que, colocados un día a su derecha, merezcan poseer el reino eterno. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Alis suis obumbrabit tibi; non timebis a timore nocturno.", "es": "Con sus alas te cubrirá; no temerás el terror de la noche."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 90", "content": {"la": [["1", "Laus cantici David. Qui habitat in adjutorio Altissimi, in protectione Dei caeli commorabitur."], ["2", "Dicet Domino : Susceptor meus es tu et refugium meum; Deus meus, sperabo in eum."], ["3", "Quoniam ipse liberavit me de laqueo venantium, et a verbo aspero."], ["4", "Scapulis suis obumbrabit tibi, et sub pennis ejus sperabis."], ["5", "Scuto circumdabit te veritas ejus : non timebis a timore nocturno;"], ["6", "a sagitta volante in die, a negotio perambulante in tenebris, ab incursu, et daemonio meridiano."], ["7", "Cadent a latere tuo mille, et decem millia a dextris tuis; ad te autem non appropinquabit."], ["8", "Verumtamen oculis tuis considerabis et retributionem peccatorum videbis."], ["9", "Quoniam tu es, Domine, spes mea; Altissimum posuisti refugium tuum."], ["10", "Non accedet ad te malum, et flagellum non appropinquabit tabernaculo tuo."], ["11", "Quoniam angelis suis mandavit de te, ut custodiant te in omnibus viis tuis."], ["12", "In manibus portabunt te, ne forte offendas ad lapidem pedem tuum."], ["13", "Super aspidem et basiliscum ambulabis, et conculcabis leonem et draconem."], ["14", "Quoniam in me speravit, liberabo eum; protegam eum, quoniam cognovit nomen meum."], ["15", "Clamabit ad me, et ego exaudiam eum; cum ipso sum in tribulatione; eripiam eum, et glorificabo eum."], ["16", "Longitudine dierum replebo eum, et ostendam illi salutare meum."]], "es": [["1", "El que se acoge al asilo del Altísimo, descansará siempre bajo la protección del Dios del cielo."], ["2", "El dirá al Señor: Tú eres mi amparo y refugio; el Dios mío en quien esperaré."], ["3", "Porque él me ha librado del lazo de los cazadores y de terribles adversidades."], ["4", "Con sus alas te hará sombra, y debajo de sus plumas estarás confiado."], ["5", "Su verdad te cercará como escudo; no temerás terrores nocturnos,"], ["6", "ni la saeta disparada de día, ni al enemigo que anda en tinieblas, ni los asaltos del demonio en medio del día."], ["7", "Caerán muertos a tu siniestra mil y diez mil a tu diestra; mas nada te pasará a ti."], ["8", "Tú lo estarás contemplando con tus propios ojos, y verás el pago que se da a los pecadores, y exclamarás:"], ["9", "¡Oh! y cómo eres tú, ¡oh Señor, mi esperanza! Tú ¡oh justo! has escogido al Altísimo para asilo tuyo."], ["10", "No llegará a ti el mal, ni el azote se acercará a tu morada."], ["11", "Porque él mandó a sus ángeles que cuidasen de ti; los cuales te guardarán en cuantos pasos dieres."], ["12", "Te llevarán en las palmas de sus manos; no sea que tropiece tu pie en alguna piedra."], ["13", "Andarás sobre áspides y víboras, y hollarás los leones y dragones."], ["14", "Ya que ha esperado en mí, yo le libraré; yo lo protegeré, pues ha conocido o adorado mi Nombre."], ["15", "Clamará a mí, y lo oiré benigno. Con él estoy en la tribulación; lo pondré a salvo, y lo llenaré de gloria."], ["16", "Lo sacaré con una vida muy larga, y le haré ver el salvador que enviaré."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Alis suis obumbrabit tibi; non timebis a timore nocturno.", "es": "Con sus alas te cubrirá; no temerás el terror de la noche."}}, {"kind": "psalm", "label": "reading", "ref": "Rev 22:4-5", "content": {"la": [["4", "Et videbunt faciem ejus : et nomen ejus in frontibus eorum."], ["5", "Et nox ultra non erit : et non egebunt lumine lucernae, neque lumine solis, quoniam Dominus Deus illuminabit illos, et regnabunt in saecula saeculorum."]], "es": [["4", "Y verán su cara, y tendrán el nombre de él sobre sus frentes."], ["5", "Y allí no habrá jamás noche; ni necesitarán luz"]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et t semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Diléxit Andréam Dóminus in odórem suavitátis.", "es": "El Señor amó a Andrés como olor de suavidad."}}, {"kind": "psalm", "label": "canticle", "ref": "Dan 3:57-88,56", "content": {"la": [["57", "Benedicite, omnia opera Domini, Domino : laudate et superexaltate eum in saecula."], ["58", "Benedicite, angeli Domini, Domino : laudate et superexaltate eum in saecula."], ["59", "Benedicite, caeli, Domino : laudate et superexaltate eum in saecula."], ["60", "Benedicite, aquae omnes, quae super caelos sunt, Domino : laudate et superexaltate eum in saecula."], ["61", "Benedicite, omnes virtutes Domini, Domino : laudate et superexaltate eum in saecula."], ["62", "Benedicite, sol et luna, Domino : laudate et superexaltate eum in saecula."], ["63", "Benedicite, stellae caeli, Domino : laudate et superexaltate eum in saecula."], ["64", "Benedicite, omnis imber et ros, Domino : laudate et superexaltate eum in saecula."], ["65", "Benedicite, omnes spiritus Dei, Domino : laudate et superexaltate eum in saecula."], ["66", "Benedicite, ignis et aestus, Domino : laudate et superexaltate eum in saecula."], ["67", "Benedicite, frigus et aestus, Domino : laudate et superexaltate eum in saecula."], ["68", "Benedicite, rores et pruina, Domino : laudate et superexaltate eum in saecula."], ["69", "Benedicite, gelu et frigus, Domino : laudate et superexaltate eum in saecula."], ["70", "Benedicite, glacies et nives, Domino : laudate et superexaltate eum in saecula."], ["71", "Benedicite, noctes et dies, Domino laudate et superexaltate eum in saecula."], ["72", "Benedicite, lux et tenebrae, Domino : laudate et superexaltate eum in saecula."], ["73", "Benedicite, fulgura et nubes, Domino : laudate et superexaltate eum in saecula."], ["74", "Benedicat terra Dominum : laudet et superexaltet eum in saecula."], ["75", "Benedicite, montes et colles, Domino : laudate et superexaltate eum in saecula."], ["76", "Benedicite, universa germinantia in terra, Domino : laudate et superexaltate eum in saecula."], ["77", "Benedicite, fontes, Domino : laudate et superexaltate eum in saecula."], ["78", "Benedicite, maria et flumina, Domino : laudate et superexaltate eum in saecula."], ["79", "Benedicite, cete, et omnia quae moventur in aquis, Domino : laudate et superexaltate eum in saecula."], ["80", "Benedicite, omnes volucres caeli, Domino : laudate et superexaltate eum in saecula."], ["81", "Benedicite, omnes bestiae et pecora, Domino : laudate et superexaltate eum in saecula."], ["82", "Benedicite, filii hominum, Domino : laudate et superexaltate eum in saecula."], ["83", "Benedicat Israel Dominum : laudet et superexaltet eum in saecula."], ["84", "Benedicite, sacerdotes Domini, Domino : laudate et superexaltate eum in saecula."], ["85", "Benedicite, servi Domini, Domino : laudate et superexaltate eum in saecula."], ["86", "Benedicite, spiritus et animae justorum, Domino : laudate et superexaltate eum in saecula."], ["87", "Benedicite, sancti et humiles corde, Domino : laudate et superexaltate eum in saecula."], ["88", "Benedicite, Anania, Azaria, Misael, Domino : laudate et superexaltate eum in saecula : quia eruit nos de inferno, et salvos fecit de manu mortis : et liberavit nos de medio ardentis flammae, et de medio ignis eruit nos."], ["56", "Benedictus es in firmamento caeli : et laudabilis et gloriosus in saecula."]], "es": [["57", "Obras todas del Señor, bendecid al Señor, y loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["58", "Angeles del Señor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["59", "Cielos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["60", "Aguas todas que estáis sobre los cielos *, bendecid al Señor: alabadle, y ensalzadle sobre todas las cosas por todos los siglos."], ["61", "Virtudes todas ó milicias celestiales ', bendecid vosotras al Señor: loadle y ensalzadle sobre todas"], ["62", "Sol y luna, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["63", "Estrellas del cielo, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["64", "Lluvias todas y rocíos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["65", "Espíritus ó vientos de Dios, bendecid todos vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["66", "Fuego y calor, bendecid vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["67", "Frió y calor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["68", "Rocíos y escarchas, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["69", "Hielos y frios, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["70", "Heladas y nieves, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["71", "Noches y dias, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["72", "Luz y tinieblas, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["73", "Relámpagos y nubes, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["74", "Bendiga al Señor la tierra, alábele y ensálzele sobre todas las cosas por todos los siglos."], ["75", "Montes y collados, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["76", "Plantas todas que nacéis en la tierra, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["77", "Fuentes, bendecid al Señor: loadle y ensalzíidle sobre todas las cosas por todos los siglos."], ["78", "Mares y rios, bendecid al Señor: loadle y"], ["79", "Ballenas y peces todos, que giráis por las aguas, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["80", "Aves todas del cielo, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["81", "Bestias todas y ganados, bendecid al Señor: loadle y ensab:adle por todos los siglos sobre todas las cosas."], ["82", "Oh hijos de los hombres, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["83", "Bendiga Israel al Señor: alábele y ensálzele por todos los siglos sobre todas las cosas."], ["84", "Vosotros sacerdotes del Señor, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["85", "Siervos del Señor, bendecid vosotros al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["86", "Espíritus y almas de los justos, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["87", "Vosotros santos, y humildes de corazón, bendecid al Señor: alabadle y ensalzadle por todos los siglos sobre todas las cosas."], ["88", "Vosotros, Ananías, Azarías y Misael, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas. Porque él nos ha salvado del inlierno ó del sepulcro, y librado de las manos de la ( APÍfüLO III. '¿i'o muelle: y nos ha sacado de en medio de las ardientes llamas, y libertado del fuego del homo."], ["56", "Bendito eres tú en el firmamento del cielo, y digno de loor, y de gloria por todos los siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Diléxit Andréam Dóminus in odórem suavitátis.", "es": "El Señor amó a Andrés como olor de suavidad."}}, {"kind": "psalm", "label": "reading", "ref": "eph 2:19-22", "content": {"la": [["19", "Ergo jam non estis hospites, et advenae : sed estis cives sanctorum, et domestici Dei,"], ["20", "superaedificati super fundamentum apostolorum, et prophetarum, ipso summo angulari lapide Christo Jesu :"], ["21", "in quo omnis aedificatio constructa crescit in templum sanctum in Domino,"], ["22", "in quo et vos coaedificamini in habitaculum Dei in Spiritu."]], "es": [["19", "Así que, ya no sois extraños, ni advenedizos; sino conciudadanos de los santos, y domésticos ó familiares de la casa de Dios:"], ["20", "Pues estáis edificados sobre el fundamento de los Apóstoles y Profetas, y unidos en Jesu-Cristo, el cual es la principal piedra angular de la nueva Jerusalén;"], ["21", "Sobre quien, trabado todo el espiritual edificio, se alza para ser un templo santo del Señor:"], ["22", "Por él entráis también vosotros gentiles á ser parte de la estructura de este edificio, para llegar á ser morada de Dios por medio del Espíritu Santo."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Christe, Fili Dei vivi,* Miserére nobis. Christe.", "℟. Qui ventúrus es in mundum.* Miserére nobis. Glória Patri. Christe."], "es": ["$℣. $Los nombrarás príncipes sobre toda la tierra.", "$℟. $Los nombrarás príncipes sobre toda la tierra.", "$℣. $Harán memorable tu nombre, Señor.", "$℟. $Sobre toda la tierra.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Los nombrarás príncipes sobre toda la tierra."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Vos qui reliquistis omnia, et secuti estis me, centuplum accipietis, et vitam æternam possidebitis.", "es": "Vosotros que lo dejasteis todo y me seguisteis, recibiréis el céntuplo y poseeréis la vida eterna."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Vos qui reliquistis omnia, et secuti estis me, centuplum accipietis, et vitam æternam possidebitis.", "es": "Vosotros que lo dejasteis todo y me seguisteis, recibiréis el céntuplo y poseeréis la vida eterna."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Deum Patrem, qui nobis grátiam exspectándi revelatiónem Dómini nostri Iesu Christi benígne largítur, orémus dicéntes:", "– Osténde nobis, Dómine, misericórdiam tuam.", "Spíritum nostrum, Dómine, et ánimam et corpus sanctífica", "et irreprehensíbiles nos serva in Fílii tui advéntum.", "– Osténde nobis, Dómine, misericórdiam tuam.", "Fac nos hac die sancte ambuláre", "atque iuste ac pie in hoc sǽculo vívere.", "– Osténde nobis, Dómine, misericórdiam tuam.", "Da nobis Dóminum nostrum Iesum Christum indúere", "et Spíritu Sancto impléri.", "– Osténde nobis, Dómine, misericórdiam tuam.", "Concéde ut vígiles maneámus, Dómine,", "usque ad Fílii tui manifestatiónem gloriósam.", "– Osténde nobis, Dómine, misericórdiam tuam."], "es": ["Queridos hermanos, habiendo recibido de los apóstoles la herencia de los elegidos, demos gracias a nuestro Padre por todos sus dones, diciendo:", "- Por la mesa de tu cuerpo y de tu sangre, que nos transmitieron los apóstoles, _con la cual nos alimentamos y vivimos:  El coro de los apóstoles te ensalza, Señor._ _El coro de los apóstoles te ensalza, Señor._", "- Por la mesa de tu Palabra, que nos transmitieron los apóstoles, _con la cual se  nos comunica la luz y el gozo:  El coro de los apóstoles te ensalza, Señor._ _El coro de los apóstoles te ensalza, Señor._", "- Por tu Iglesia santa, edificada sobre el fundamento de los apóstoles, _por la cual nos integramos en la unidad:  El coro de los apóstoles te ensalza, Señor._ _El coro de los apóstoles te ensalza, Señor._", "- Por la purificación del bautismo y de la penitencia, confiada a los apóstoles, _con la cual quedamos limpios de todos los pecados:  El coro de los apóstoles te ensalza, Señor._ _El coro de los apóstoles te ensalza, Señor._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "ref": "Sancti Andreæ, apostoli", "content": {"la": "Majestátem tuam, Dómine, supplíciter exorámus: ut, sicut Ecclésiæ tuæ beátus Andréas Apóstolus éxstitit prædicátor et rector; ita apud te sit pro nobis perpétuus intercéssor.", "es": "Protégenos, Señor, con la constante intercesión del apóstol san Andrés, a quien escogiste para ser predicador y pastor de tu Iglesia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Vidit Dóminus Petrum et Andréam, et vocávit eos.", "es": "Vio el Señor a Pedro y a Andrés, y los llamó."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 115", "content": {"la": [["10", "Alleluja. Credidi, propter quod locutus sum; ego autem humiliatus sum nimis."], ["11", "Ego dixi in excessu meo : Omnis homo mendax."], ["12", "Quid retribuam Domino pro omnibus quae retribuit mihi?"], ["13", "Calicem salutaris accipiam, et nomen Domini invocabo."], ["14", "Vota mea Domino reddam coram omni populo ejus."], ["15", "Pretiosa in conspectu Domini mors sanctorum ejus."], ["16", "O Domine, quia ego servus tuus; ego servus tuus, et filius ancillae tuae. Dirupisti vincula mea :"], ["17", "tibi sacrificabo hostiam laudis, et nomen Domini invocabo."], ["18", "Vota mea Domino reddam in conspectu omnis populi ejus;"], ["19", "in atriis domus Domini, in medio tui, Jerusalem."]], "es": [["10", "Creí a Dios; por eso hablé confiado; aunque me vi reducido al mayor abatimien-to."], ["11", "Yo dije en mi transporte de ánimo, o perturbacion: Todos los hombres son falaces."], ["12", "Mas ¿cómo podré corresponder al Señor por todas las mercedes que me ha hecho?"], ["13", "Tomaré el cáliz de la salud, e invocaré el nombre del Señor."], ["14", "Cumpliré al Señor mis votos en presencia de todo su pueblo."], ["15", "De gran precio es a los ojos del Señor la muerte de sus santos."], ["16", "Oh Señor, siervo tuyo soy, siervo tuyo e hijo de esclava tuya. Tú rompiste mis cadenas;"], ["17", "a ti ofreceré yo un sacrificio de alabanza, e invocaré el Nombre del Señor."], ["18", "Cumpliré mis votos al Señor a la vista de todo su pueblo,"], ["19", "en los atrios de la casa del Señor, en medio de ti, ¡oh Jerusalén!"]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Vidit Dóminus Petrum et Andréam, et vocávit eos.", "es": "Vio el Señor a Pedro y a Andrés, y los llamó."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Veníte post me, dicit Dóminus, fáciam vos piscatóres hóminum.", "es": "Venid en pos de mí, dice el Señor, y os haré pescadores de hombres."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 125", "content": {"la": [["1", "Canticum graduum. In convertendo Dominus captivitatem Sion, facti sumus sicut consolati."], ["2", "Tunc repletum est gaudio os nostrum, et lingua nostra exsultatione. Tunc dicent inter gentes : Magnificavit Dominus facere cum eis."], ["3", "Magnificavit Dominus facere nobiscum; facti sumus laetantes."], ["4", "Converte, Domine, captivitatem nostram, sicut torrens in austro."], ["5", "Qui seminant in lacrimis, in exsultatione metent."], ["6", "Euntes ibant et flebant, mittentes semina sua."], ["7", "Venientes autem venient cum exsultatione, portantes manipulos suos."]], "es": [["2", "Cuando el Señor haga volver a Sión los cautivos, será indecible nuestro consuelo."], ["3", "Entonces rebosará de gozo nuestra boca, y de júbilo nuestra lengua. Se dirá entonces entre las naciones: Grandiosas cosas ha hecho por ellos el Señor."], ["4", "Sí, cosas grandes ha obrado el Señor a favor nuestro, inundados estamos de gozo."], ["5", "Pero, Señor, libra de la esclavitud a los demás de nuestros hermanos cautivos; vuelvan como torrentes al soplo del mediodía."], ["6", "Aquellos que sembraban con lágrimas segarán llenos de júbilo."], ["7", "Cuando iban, esparcían llorando sus semillas; mas cuando vuelvan, vendrán con gran regocijo, trayendo las gavillas de sus mieses."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Veníte post me, dicit Dóminus, fáciam vos piscatóres hóminum.", "es": "Venid en pos de mí, dice el Señor, y os haré pescadores de hombres."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Relíctis rétibus suis, secúti sunt Dóminum et Redemptórem, alleluia.", "es": "Dejando sus redes, siguieron al Señor y Redentor, aleluya."}}, {"kind": "psalm", "label": "canticle", "ref": "eph 1:3-10", "content": {"la": [["3", "Benedictus Deus et Pater Domini nostri Jesu Christi, qui benedixit nos in omni benedictione spirituali in caelestibus in Christo,"], ["4", "sicut elegit nos in ipso ante mundi constitutionem, ut essemus sancti et immaculati in conspectu ejus in caritate."], ["5", "Qui praedestinavit nos in adoptionem filiorum per Jesum Christum in ipsum : secundum propositum voluntatis suae,"], ["6", "in laudem gloriae gratiae suae, in qua gratificavit nos in dilecto Filio suo."], ["7", "In quo habemus redemptionem per sanguinem ejus, remissionem peccatorum secundum divitias gratiae ejus,"], ["8", "quae superabundavit in nobis in omni sapientia et prudentia :"], ["9", "ut notum faceret nobis sacramentum voluntatis suae, secundum beneplacitum ejus, quod proposuit in eo,"], ["10", "in dispensatione plenitudinis temporum, instaurare omnia in Christo, quae in caelis et quae in terra sunt, in ipso;"]], "es": [["3", "Bendito el Dios y Padre de nuestro Señor Jesu- Christo, que nos ha colmado en Christo de toda suerte de bendiciones espirituales del cielo,"], ["4", "así como por él mismo nos escogió antes de la creación del mundo, para ser sanios y sin mácula en su presencia, por la caridad;"], ["5", "habiéndonos predestinado ' al ser de hijos suyos adoptivos por Jesii-Christo á gloria suya, por un puro efecto de su buena voluntad,"], ["6", "á fin de que se celebre la gloria de su gracia, mediante la cual nos hizo gratos á sus ojos en su querido Hijo."], ["7", "En quien por su sangre logramos la' redención, y el perdón de los pecados, por las riquezas de su gracia,"], ["8", "que con abundancia ha derramado sobre nosotros, colmándonos de toda sabiduría y prudencia:"], ["9", "para hacernos conocer el misterio ó arcano de su voluntad, fundada en su mero beneplácito, por el cual se propuso"], ["10", "el restaurar en Christo, cumplidos los tiempos prescritos, todas las cosas de los cielos, y las de la tierra, reimiéndolas todas por él mismo en un cuer' po ó Iglesia."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Relíctis rétibus suis, secúti sunt Dóminum et Redemptórem, alleluia.", "es": "Dejando sus redes, siguieron al Señor y Redentor, aleluya."}}, {"kind": "psalm", "label": "reading", "ref": "1thess 5:23-24", "content": {"la": [["23", "Ipse autem Deus pacis sanctificet vos per omnia : ut integer spiritus vester, et anima, et corpus sine querela in adventu Domini nostri Jesu Christi servetur."], ["24", "Fidelis est, qui vocavit vos : qui etiam faciet."]], "es": [["23", "Y el Dios de la paz os haga santos en todo, á fin de que vuestro espíritu entero, con alma y cuerpo se conserven sin culpa para cuando venga nuestro Señor Jesu-Christo."], ["24", "Fiel es el que os llamó;y así lo hará como lo ha ofrecido."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Osténde nobis, Dómine,* Misericórdiam tuam. Osténde.", "℟. Et salutáre tuum da nobis.* Misericórdiam tuam. Glória Patri. Osténde."], "es": ["$℣. $Muéstranos, Señor,  tu  misericordia.", "$℟. $Muéstranos, Señor,  tu  misericordia.", "$℣. $Danos tu salvación.", "$℟. $Tu  misericordia.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Muéstranos, Señor,  tu  misericordia."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Hoc est præceptum meum, ut diligatis invicem, sicut dilexi vos.", "es": "Este es mi mandamiento: que os améis unos a otros como yo os he amado."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Hoc est præceptum meum, ut diligatis invicem, sicut dilexi vos.", "es": "Este es mi mandamiento: que os améis unos a otros como yo os he amado."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Redemptórem nostrum Iesum Christum, qui est via, véritas et vita, supplíciter rogémus, dicéntes:", "– Veni et mane nobíscum, Dómine.", "Iesu, Fili Altíssimi, qui Vírgini Maríæ per Gabriélem annuntiátus es,", "veni ad regnándum super plebem tuam in ætérnum.", "– Veni et mane nobíscum, Dómine.", "Tu, Sancte Dei, cui Præcúrsor in sinu Elísabeth exsultávit,", "veni ad dandum univérso mundo gáudium salútis.", "– Veni et mane nobíscum, Dómine.", "Iesu Salvátor, cuius nomen Ioseph viro iusto ab Angelo revelátum est,", "veni ad pópulum tuum salvum faciéndum a peccátis eórum.", "– Veni et mane nobíscum, Dómine.", "Lumen mundi, quod Símeon et omnes iusti exspectábant,", "veni ad consolándum nos.", "– Veni et mane nobíscum, Dómine.", "Oriens indefíciens, quem nos ex alto visitatúrum prædíxit Zacharías,", "veni ad illuminándum illos, qui in umbra mortis sedent.", "– Veni et mane nobíscum, Dómine."], "es": ["Invoquemos a Cristo, alegría y júbilo de cuantos esperan su llegada, y digámosle:", "- Esperamos, alegres, tu venida:_ ven, Señor Jesús._ _¡Ven, Señor, y no tardes más!_", "- Tú que existes antes de los tiempos,_ ven y salva a los que viven en el tiempo._ _¡Ven, Señor, y no tardes más!_", "- Tú que creaste el mundo y a todos los que en él habitan,_ ven a restaurar la obra de tus manos._ _¡Ven, Señor, y no tardes más!_", "- Tú que no despreciaste nuestra naturaleza mortal,_ ven y arráncanos del dominio de la muerte._ _¡Ven, Señor, y no tardes más!_", "- Tú que viniste para que tuviéramos vida abundante,_ ven y danos tu vida eterna._ _¡Ven, Señor, y no tardes más!_", "- Tú que quieres congregar a todos los hombres en tu reino,_ ven y reúne a cuantos desean contemplar tu rostro._ _¡Ven, Señor, y no tardes más!_"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "ref": "Sancti Andreæ, apostoli", "content": {"la": "Majestátem tuam, Dómine, supplíciter exorámus: ut, sicut Ecclésiæ tuæ beátus Andréas Apóstolus éxstitit prædicátor et rector; ita apud te sit pro nobis perpétuus intercéssor.", "es": "Protégenos, Señor, con la constante intercesión del apóstol san Andrés, a quien escogiste para ser predicador y pastor de tu Iglesia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Alis suis obumbrabit tibi; non timebis a timore nocturno.", "es": "Con sus alas te cubrirá; no temerás el terror de la noche."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 90", "content": {"la": [["1", "Laus cantici David. Qui habitat in adjutorio Altissimi, in protectione Dei caeli commorabitur."], ["2", "Dicet Domino : Susceptor meus es tu et refugium meum; Deus meus, sperabo in eum."], ["3", "Quoniam ipse liberavit me de laqueo venantium, et a verbo aspero."], ["4", "Scapulis suis obumbrabit tibi, et sub pennis ejus sperabis."], ["5", "Scuto circumdabit te veritas ejus : non timebis a timore nocturno;"], ["6", "a sagitta volante in die, a negotio perambulante in tenebris, ab incursu, et daemonio meridiano."], ["7", "Cadent a latere tuo mille, et decem millia a dextris tuis; ad te autem non appropinquabit."], ["8", "Verumtamen oculis tuis considerabis et retributionem peccatorum videbis."], ["9", "Quoniam tu es, Domine, spes mea; Altissimum posuisti refugium tuum."], ["10", "Non accedet ad te malum, et flagellum non appropinquabit tabernaculo tuo."], ["11", "Quoniam angelis suis mandavit de te, ut custodiant te in omnibus viis tuis."], ["12", "In manibus portabunt te, ne forte offendas ad lapidem pedem tuum."], ["13", "Super aspidem et basiliscum ambulabis, et conculcabis leonem et draconem."], ["14", "Quoniam in me speravit, liberabo eum; protegam eum, quoniam cognovit nomen meum."], ["15", "Clamabit ad me, et ego exaudiam eum; cum ipso sum in tribulatione; eripiam eum, et glorificabo eum."], ["16", "Longitudine dierum replebo eum, et ostendam illi salutare meum."]], "es": [["1", "El que se acoge al asilo del Altísimo, descansará siempre bajo la protección del Dios del cielo."], ["2", "El dirá al Señor: Tú eres mi amparo y refugio; el Dios mío en quien esperaré."], ["3", "Porque él me ha librado del lazo de los cazadores y de terribles adversidades."], ["4", "Con sus alas te hará sombra, y debajo de sus plumas estarás confiado."], ["5", "Su verdad te cercará como escudo; no temerás terrores nocturnos,"], ["6", "ni la saeta disparada de día, ni al enemigo que anda en tinieblas, ni los asaltos del demonio en medio del día."], ["7", "Caerán muertos a tu siniestra mil y diez mil a tu diestra; mas nada te pasará a ti."], ["8", "Tú lo estarás contemplando con tus propios ojos, y verás el pago que se da a los pecadores, y exclamarás:"], ["9", "¡Oh! y cómo eres tú, ¡oh Señor, mi esperanza! Tú ¡oh justo! has escogido al Altísimo para asilo tuyo."], ["10", "No llegará a ti el mal, ni el azote se acercará a tu morada."], ["11", "Porque él mandó a sus ángeles que cuidasen de ti; los cuales te guardarán en cuantos pasos dieres."], ["12", "Te llevarán en las palmas de sus manos; no sea que tropiece tu pie en alguna piedra."], ["13", "Andarás sobre áspides y víboras, y hollarás los leones y dragones."], ["14", "Ya que ha esperado en mí, yo le libraré; yo lo protegeré, pues ha conocido o adorado mi Nombre."], ["15", "Clamará a mí, y lo oiré benigno. Con él estoy en la tribulación; lo pondré a salvo, y lo llenaré de gloria."], ["16", "Lo sacaré con una vida muy larga, y le haré ver el salvador que enviaré."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Alis suis obumbrabit tibi; non timebis a timore nocturno.", "es": "Con sus alas te cubrirá; no temerás el terror de la noche."}}, {"kind": "psalm", "label": "reading", "ref": "Rev 22:4-5", "content": {"la": [["4", "Et videbunt faciem ejus : et nomen ejus in frontibus eorum."], ["5", "Et nox ultra non erit : et non egebunt lumine lucernae, neque lumine solis, quoniam Dominus Deus illuminabit illos, et regnabunt in saecula saeculorum."]], "es": [["4", "Y verán su cara, y tendrán el nombre de él sobre sus frentes."], ["5", "Y allí no habrá jamás noche; ni necesitarán luz"]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Vox nostra te, Domine, humiliter deprecetur, ut, dominicæ resurrectionis hac die mysterio celebrato, in pace tua securi a malis omnibus quiescamus, et in tua resurgamus laude gaudentes. Per Christum Dominum nostrum.", "es": "Humildemente te pedimos, Señor, que después de haber celebrado en este día los misterios de la resurrección de tu Hijo, sin temor alguno, descansemos en tu paz y mañana nos levantemos alegres para cantar nuevamente tus alabanzas. Por Jesucristo nuestro Señor."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-12-01": {"date_human": {"en": "Tuesday, December 1, 2026", "es": "Martes, 1 de diciembre de 2026", "la": "Feria III, die 1 Decembris, anno 2026"}, "day_description": {"en": "Tuesday of the 1<sup>st</sup> Week of Advent", "es": "Martes de la 1.<sup>a</sup> semana de Adviento", "la": "Feria III hebdomadae I Adventus"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El hombre de manos inocentes y puro corazón subirá al monte del Señor._", "la": "Innocens mánibus et mundo corde ascéndet in montem Dómini."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 23", "content": {"la": [["1", "Prima sabbati. Psalmus David. Domini est terra, et plenitudo ejus; orbis terrarum, et universi qui habitant in eo."], ["2", "Quia ipse super maria fundavit eum, et super flumina praeparavit eum."], ["3", "Quis ascendet in montem Domini? aut quis stabit in loco sancto ejus?"], ["4", "Innocens manibus et mundo corde, qui non accepit in vano animam suam, nec juravit in dolo proximo suo."], ["5", "Hic accipiet benedictionem a Domino, et misericordiam a Deo salutari suo."], ["6", "Haec est generatio quaerentium eum, quaerentium faciem Dei Jacob."], ["7", "Attollite portas, principes, vestras, et elevamini, portae aeternales, et introibit rex gloriae."], ["8", "Quis est iste rex gloriae? Dominus fortis et potens, Dominus potens in praelio."], ["9", "Attollite portas, principes, vestras, et elevamini, portae aeternales, et introibit rex gloriae."], ["10", "Quis est iste rex gloriae? Dominus virtutum ipse est rex gloriae."]], "es": [["1", "Del Señor es la tierra y cuanto ella contiene; el mundo y todos sus habitantes."], ["2", "Porque él la estableció superior a los mares, y la colocó más alta que los ríos."], ["3", "¿Quién subirá al monte del Señor? ¿O quién podrá estar en su santuario?"], ["4", "El que tiene puras las manos y limpio el corazón; el que no ha recibido en vano su alma, ni hecho juramentos engañosos a su prójimo."], ["5", "Este es el que obtendrá la bendición del Señor y la misericordia de Dios, su salvador."], ["6", "Este es el linaje de los que la buscan, de los que anhelan por ver el rostro del Dios de Jacob."], ["7", "Levantad, ¡oh, príncipes!, vuestras puertas, y elevaos vosotras, ¡oh puertas de la eternidad!, y entrará el rey de la gloria."], ["8", "¿Quién es ese rey de la gloria? Es el Señor fuerte y poderoso; el Señor poderoso en las batallas."], ["9", "Levantad, ¡oh príncipes!, vuestras puertas, y elevaos vosotras, ¡oh puertas de la eternidad! y entrará el rey de la gloria."], ["10", "¿Quién es ese rey de la gloria? El Señor de los ejércitos, ése es el rey de la gloria."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El hombre de manos inocentes y puro corazón subirá al monte del Señor._", "la": "Innocens mánibus et mundo corde ascéndet in montem Dómini."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Ensalzad con vuestras obras al Rey de los siglos._", "la": "Exaltáte Regem sæculórum in opéribus vestris."}}, {"kind": "psalm", "label": "canticle", "ref": "tob 13:1-10", "content": {"la": [["1", "Aperiens autem Tobias senior os suum, benedixit Dominum, et dixit : Magnus es, Domine, in aeternum, et in omnia saecula regnum tuum :"], ["2", "quoniam tu flagellas, et salvas : deducis ad inferos, et reducis : et non est qui effugiat manum tuam."], ["3", "Confitemini Domino, filii Israel, et in conspectu gentium laudate eum :"], ["4", "quoniam ideo dispersit vos inter gentes, quae ignorant eum, ut vos enarretis mirabilia ejus, et faciatis scire eos quia non est alius deus omnipotens praeter eum."], ["5", "Ipse castigavit nos propter iniquitates nostras, et ipse salvabit nos propter misericordiam suam."], ["6", "Aspicite ergo quae fecit nobiscum, et cum timore et tremore confitemini illi : regemque saeculorum exaltate in operibus vestris."], ["7", "Ego autem in terra captivitatis meae confitebor illi : quoniam ostendit majestatem suam in gentem peccatricem."], ["8", "Convertimini itaque peccatores, et facite justitiam coram Deo, credentes quod faciat vobiscum misericordiam suam."], ["9", "Ego autem, et anima mea in eo laetabimur."], ["10", "Benedicite Dominum omnes electi ejus : agite dies laetitiae, et confitemini illi."]], "es": [["1", "Y abriendo su boca el viejo Tobías, bendijo"], ["2", "Para dispensaros sus beneficios."], ["3", "Bendecid al Señor, oh hijos de Israel, y alabadle en presencia de las naciones:"], ["4", "pues por eso os ha esparcido entre las gentes que no le conocen, para que vosotros publiquéis sus maravillas, y les hagáis conocer que no hay otro Dios Todo-poderoso fuera de él.."], ["5", "El nos ha castigado á causa de nuestras iniquidades: y él mismo nos salvará por su misericordia."], ["6", "Considerad pues lo que ha hecho con nosotros; yglorificadle con temor y temblor, y ensalzad con vuestras obras al Rey de los siglos,"], ["7", "Yo asimismo le glorificaré en la tierra de mi cautiverio; porque ha hecho ostensión de su poder y magestad sobre una nación pecadora '."], ["8", "Convertios pues, oh pecadores, y sed justos delante de Dios, y creed que usará con vosotros de su misericordia."], ["9", "Entretanto yo me regocijaré en él, y él será la alegría de mi alma."], ["10", "Bendecid al Señor todos vosotros sus escoffidos, tened días alegres, y tributadle alabanzas."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Ensalzad con vuestras obras al Rey de los siglos._", "la": "Exaltáte Regem sæculórum in opéribus vestris."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El Señor merece la alabanza de los buenos._", "la": "Rectos decet collaudátio."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 32", "content": {"la": [["1", "Psalmus David. Exsultate, justi, in Domino; rectos decet collaudatio."], ["2", "Confitemini Domino in cithara; in psalterio decem chordarum psallite illi."], ["3", "Cantate ei canticum novum; bene psallite ei in vociferatione."], ["4", "Quia rectum est verbum Domini, et omnia opera ejus in fide."], ["5", "Diligit misericordiam et judicium; misericordia Domini plena est terra."], ["6", "Verbo Domini caeli firmati sunt; et spiritu oris ejus omnis virtus eorum."], ["7", "Congregans sicut in utre aquas maris; ponens in thesauris abyssos."], ["8", "Timeat Dominum omnis terra; ab eo autem commoveantur omnes inhabitantes orbem."], ["9", "Quoniam ipse dixit, et facta sunt; ipse mandavit et creata sunt."], ["10", "Dominus dissipat consilia gentium; reprobat autem cogitationes populorum, et reprobat consilia principum."], ["11", "Consilium autem Domini in aeternum manet; cogitationes cordis ejus in generatione et generationem."], ["12", "Beata gens cujus est Dominus Deus ejus; populus quem elegit in haereditatem sibi."], ["13", "De caelo respexit Dominus; vidit omnes filios hominum."], ["14", "De praeparato habitaculo suo respexit super omnes qui habitant terram :"], ["15", "qui finxit sigillatim corda eorum; qui intelligit omnia opera eorum."], ["16", "Non salvatur rex per multam virtutem, et gigas non salvabitur in multitudine virtutis suae."], ["17", "Fallax equus ad salutem; in abundantia autem virtutis suae non salvabitur."], ["18", "Ecce oculi Domini super metuentes eum : et in eis qui sperant super misericordia ejus."], ["19", "Ut eruat a morte animas eorum : et alat eos in fame."], ["20", "Anima nostra sustinet Dominum, quoniam adjutor et protector noster est."], ["21", "Quia in eo laetabitur cor nostrum, et in nomine sancto ejus speravimus."], ["22", "Fiat misericordia tua, Domine, super nos, quemadmodum speravimus in te."]], "es": [["1", "Regocijaos, ¡oh justos!, en el Señor; a los rectos de corazón es a quienes les está bien alabarle."], ["2", "Alabad al Señor con la cítara, cantadle himnos tañendo el salterio."], ["3", "Entonad un cántico nuevo, cantadle a coro suaves himnos."], ["4", "Porque la palabra del Señor es recta, y su fidelidad brilla en todas sus obras."], ["5", "Ama la misericordia y la justicia; toda la tierra está llena de la misericordia del Señor."], ["6", "Por la palabra del Señor se fundaron los cielos, y por el espíritu de su boca se formó todo su concierto y belleza."], ["7", "El tiene recogidas las aguas del mar, como en un odre, y puestos en depósito los abismos."], ["8", "Tema al Señor la tierra toda; tiemblen en su presencia cuantos la tierra habitan."], ["9", "Porque él habló, y todo quedó hecho; lo mandó y todo fue creado."], ["10", "El Señor desbarata los proyectos de las naciones; deshace los designios de los pueblos, e inutiliza los planes de los príncipes."], ["11", "Mas los designios del Señor permanecen eternamente; las disposiciones de su voluntad subsisten por todas las generaciones."], ["12", "Feliz la nación cuyo Dios es el Señor, el pueblo a quien escogió por herencia propia suya."], ["13", "Observó desde el cielo el Señor; vio a todos los hijos de los hombres."], ["14", "Desde su firmísimo trono echó una mirada sobre todos los habitantes de la tierra."], ["15", "El es el que formó el corazón de cada uno; el que conoce todo lo que hacen."], ["16", "No por su gran poderío se salva el rey; ni se salvará el gigante por su valentía."], ["17", "El caballo no es seguro para salvarse en él; no por su mucho brío pondrá a salvo al jinete."], ["18", "He aquí los ojos del Señor puestos en los que le temen, y en los que confían en su misericordia;"], ["19", "para librar sus almas de la muerte, y sustentarlos en tiempo de hambre."], ["20", "Así nuestra alma espera con paciencia al Señor; porque él es nuestro amparo y protector."], ["21", "En él hallará nuestro corazón su alegría, y en su santo Nombre tenemos puesta la esperanza."], ["22", "Venga, ¡oh Señor!, tu misericordia sobre nosotros, conforme esperamos en ti."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El Señor merece la alabanza de los buenos._", "la": "Rectos decet collaudátio."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "gen 49:10", "content": {"la": [["10", "Non auferetur sceptrum de Juda, et dux de femore ejus, donec veniat qui mittendus est, et ipse erit expectatio gentium."]], "es": [["10", "EL CETRO NO SERA QUITADO DE JUDA, ni de su posteridad el caudillo, hasta que venga el que ha de ser enviado, y éste será la esperanza de las naciones."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Super te, Ierúsalem, * Oriétur Dóminus. Super te.", "℟. Et glória eius in te vidébitur.* Oriétur Dóminus. Glória Patri. Super te."], "es": ["$℣. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℣. $Su gloria aparecerá sobre ti.", "$℟. $Amanecerá el Señor.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Brotará un renuevo del tronco de Jesé y la gloria del Señor llenará toda la tierra; y todos verán la salvación de Dios._", "la": "Egrediétur virga de radíce Iesse, et replébitur omnis terra glória Dómini: et vidébit omnis caro salutáre Dei."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_Brotará un renuevo del tronco de Jesé y la gloria del Señor llenará toda la tierra; y todos verán la salvación de Dios._", "la": "Egrediétur virga de radíce Iesse, et replébitur omnis terra glória Dómini: et vidébit omnis caro salutáre Dei."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Deus Pater omnípotens íterum manum suam exténdet ad possidéndum resíduum pópuli sui. Proínde eum rogémus:", "– Advéniat regnum tuum, Dómine.", "Concéde, Dómine, ut faciámus fructus dignos pæniténtiæ,", "ad accipiéndum regnum tuum, quod prope est.", "– Advéniat regnum tuum, Dómine.", "Para, Dómine, viam in córdibus nostris Verbo tuo ventúro,", "ut eius glória in nobis revelétur.", "– Advéniat regnum tuum, Dómine.", "Humília montes supérbiæ nostræ,", "exálta valles infirmitátis nostræ.", "– Advéniat regnum tuum, Dómine.", "Murum ódii evérte, natiónes dividéntem,", "et vias concórdiæ fac homínibus planas.", "– Advéniat regnum tuum, Dómine."], "es": ["El Señor, Padre todopoderoso, tenderá otra vez su mano, para rescatar al resto de su pueblo; supliquémosle, pues, confiados:", "- Concédenos, Señor, dar aquel fruto que pide la conversión, _para que podamos recibir tu reino que se acerca._ _Venga a nosotros tu Reino, Señor._", "- Prepara, Señor en nuestros corazones, un camino para tu Palabra que ha de venir: _así tu gloria se manifestará al mundo por medio de nosotros._ _Venga a nosotros tu Reino, Señor._", "- Abaja los montes y las colinas de nuestro orgullo _y levanta los valles de nuestros desánimos y de nuestras cobardías._ _Venga a nosotros tu Reino, Señor._", "- Destruye los muros del odio que divide a las naciones _y allana los caminos de la concordia entre los hombres._ _Venga a nosotros tu Reino, Señor._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Propitiáre, Dómine Deus, supplicatiónibus nostris et tribulántibus, quǽsumus, tuæ concéde pietátis auxílium, ut, de Fílii tui veniéntis præséntia consoláti, nullis iam polluámur contágiis vetustátis. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Señor y Dios nuestro, acoge favorablemente nuestras súplicas y ayúdanos con tu amor en nuestro desvalimiento; que la presencia de tu Hijo, ya cercano, nos renueve y nos libre de volver a caer en la antigua servidumbre del pecado. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El Señor da la victoria a su Ungido._", "la": "Tríbuit Dóminus victóriam Christo suo."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 19", "content": {"la": [["1", "In finem. Psalmus David."], ["2", "Exaudiat te Dominus in die tribulationis; protegat te nomen Dei Jacob."], ["3", "Mittat tibi auxilium de sancto, et de Sion tueatur te."], ["4", "Memor sit omnis sacrificii tui, et holocaustum tuum pingue fiat."], ["5", "Tribuat tibi secundum cor tuum, et omne consilium tuum confirmet."], ["6", "Laetabimur in salutari tuo; et in nomine Dei nostri magnificabimur."], ["7", "Impleat Dominus omnes petitiones tuas; nunc cognovi quoniam salvum fecit Dominus christum suum. Exaudiet illum de caelo sancto suo, in potentatibus salus dexterae ejus."], ["8", "Hi in curribus, et hi in equis; nos autem in nomine Domini Dei nostri invocabimus."], ["9", "Ipsi obligati sunt, et ceciderunt, nos autem surreximus, et erecti sumus. Domine, salvum fac regem, et exaudi nos in die qua invocaverimus te."]], "es": [["1", "Que te oiga, ¡oh rey!, el Señor el día de la tribulación; que te defienda el Nombre del Dios de Jacob."], ["2", "Que te envíe socorro desde el santuario, y sea tu firme apoyo desde Sión."], ["3", "Tenga presente todos tus sacrificios, y le sea gratísimo tu holocausto."], ["4", "Que te conceda lo que desea tu corazón, y cumpla todos sus designios."], ["5", "Nosotros nos alegraremos por tu salud y nos gloriaremos en el Nombre de nuestro Dios."], ["6", "Otorgue el Señor todas tus peticiones. Ahora veo que el Señor ha puesto a salvo a su ungido. El le oirá desde el cielo, que es su santuario, en su poderosa diestra está la salvación."], ["7", "Unos confían en sus carros armados, otros en sus caballos; mas nosotros invocaremos el Nombre del Señor nuestro Dios."], ["8", "Ellos se hallaron envueltos en los lazos y cayeron; pero nosotros realzamos, y estamos llenos de vigor."], ["9", "¡Oh Señor!, salva al rey, y óyenos el día en que te invocaremos."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El Señor da la victoria a su Ungido._", "la": "Tríbuit Dóminus victóriam Christo suo."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Al son de instrumentos cantaremos tu poder._", "la": "Cantábimus et psallémus virtútes tuas."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 20:2-8,14", "content": {"la": [["2", "Domine, in virtute tua laetabitur rex, et super salutare tuum exsultabit vehementer."], ["3", "Desiderium cordis ejus tribuisti ei, et voluntate labiorum ejus non fraudasti eum."], ["4", "Quoniam praevenisti eum in benedictionibus dulcedinis; posuisti in capite ejus coronam de lapide pretioso."], ["5", "Vitam petiit a te, et tribuisti ei longitudinem dierum in saeculum, et in saeculum saeculi."], ["6", "Magna est gloria ejus in salutari tuo; gloriam et magnum decorem impones super eum."], ["7", "Quoniam dabis eum in benedictionem in saeculum saeculi; laetificabis eum in gaudio cum vultu tuo."], ["8", "Quoniam rex sperat in Domino; et in misericordia Altissimi non commovebitur."], ["14", "Exaltare, Domine, in virtute tua; cantabimus et psallemus virtutes tuas."]], "es": [["2", "Oh, Señor, en tu gran poder hallará el rey su alegría, y saltará de extremado gozo por la salvación que le has enviado."], ["3", "Tú le has cumplido el deseo de su corazón, y no has frustrado los ruegos que formaron sus labios."], ["4", "Antes te has anticipado a él con bendiciones amorosas; le pusiste sobre la cabeza una corona de piedras preciosas."], ["5", "Te pidió vida, y tú le has concedido alargar sus días por los siglos de los siglos."], ["6", "Grande es su gloria por la salvación que le has dado. Aún le revistarás de una gloria y esplendor mucho más grande."], ["7", "Porque tú harás que él sea bendición eterna; lo colmarás de gozo con sólo mostrarle tu rostro."], ["8", "Por cuanto el rey tiene puesta su confianza en el Señor; por lo mismo descansará inmóvil en la misericordia del Altísimo."], ["14", "Ensálzate, Señor, con tu poder infinito; que nosotros celebraremos con cánticos e himnos tus maravillas."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Al son de instrumentos cantaremos tu poder._", "la": "Cantábimus et psallémus virtútes tuas."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Has hecho de nosotros, Señor, un reino de sacerdotes para nuestro Dios._", "la": "Fecísti nos, Dómine, regnum et sacerdótes Deo nostro."}}, {"kind": "psalm", "label": "canticle", "ref": "rev 4:11;5:9,10,12", "content": {"la": [["4:11", "Dignus es Domine Deus noster accipere gloriam, et honorem, et virtutem : quia tu creasti omnia, et propter voluntatem tuam erant, et creata sunt."], ["5:9", "et cantabant canticum novum, dicentes : Dignus es, Domine, accipere librum, et aperire signacula ejus : quoniam occisus es, et redemisti nos Deo in sanguine tuo ex omni tribu, et lingua, et populo, et natione :"], ["5:10", "et fecisti nos Deo nostro regnum, et sacerdotes : et regnabimus super terram."], ["5:12", "dicentium voce magna : Dignus est Agnus, qui occisus est, accipere virtutem, et divinitatem, et sapientiam, et fortitudinem, et honorem, et gloriam, et benedictionem."]], "es": [["4:11", "Digno eres, ó Señor, Dios nuestro, de recibir la gloria y el honor y el poderío; porque tú criaste todas las cosas; y por tu querer subsisten y fueron criadas."], ["5:9", "y cantaban un cántico nuevo, diciendo: Digno eres, Señor, de recibir el libro, y de abrir sus sellos, porque tú has sido entregado á la muerte, y con tu sangre nos has rescatado para Dios, de todas las tribus, y lenguas, y pueblos, y naciones:"], ["5:10", "con que nos hiciste para nuestro Dios reyes y sacerdotes*; y reinaremos sobre la (ierra hasta que después reinemos contigo en el cielo."], ["5:12", "los cuales decian en alta voz: Digno es el Cordero que ha sido sacrificado, de recibir el poder, y la divinidad, y la sabiduría, y la fortaleza, y el honor, y la gloria, y la bendición '."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Has hecho de nosotros, Señor, un reino de sacerdotes para nuestro Dios._", "la": "Fecísti nos, Dómine, regnum et sacerdótes Deo nostro."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "1cor 1:7-9", "content": {"la": [["7", "ita ut nihil vobis desit in ulla gratia, exspectantibus revelationem Domini nostri Jesu Christi,"], ["8", "qui et confirmabit vos usque in finem sine crimine, in die adventus Domini nostri Jesu Christi."], ["9", "Fidelis Deus : per quem vocati estis in societatem filii ejus Jesu Christi Domini nostri."]], "es": [["7", "de manera que nada os falte de gracia ninguna, á vosotros que estáis esperando la manifestación de Jesu-Christo nuestro Señor:"], ["8", "El cual os confortará todavía hasta el fin, para que seais hallados irreprensibles en el dia del advenimiento de Jesu-Christo Señor nuestro."], ["9", "Porque Dios, por el cual habéis sido llamados á la compañía de su Hijo Jesu-Christo nuestro Señor, es fiel en sus promesas.."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Veni ad liberándum nos,* Dómine Deus virtútum. Veni.", "℟. Osténde fáciem tuam et salvi érimus.* Dómine Deus virtútum. Glória Patri. Veni."], "es": ["$℣. $Despierta tu poder y ven a salvarnos, Señor Dios de los ejércitos.", "$℟. $Despierta tu poder y ven a salvarnos, Señor Dios de los ejércitos.", "$℣. $Que brille tu rostro y nos salve.", "$℟. $Señor Dios de los ejércitos.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Despierta tu poder y ven a salvarnos, Señor Dios de los ejércitos."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Buscad al Señor mientr
