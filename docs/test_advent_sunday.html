, del mismo modo que hemos cantado tus alabanzas en esta celebración matutina, así las podamos cantar también plenamente, en la asamblea de tus santos, por toda la eternidad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Domine, libera animam meam de morte, pedes meos a lapsu.", "es": "Señor, libra mi alma de la muerte, y mis pies de la caída."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 114:1-9", "content": {"la": [["1", "Alleluja. Dilexi, quoniam exaudiet Dominus vocem orationis meae."], ["2", "Quia inclinavit aurem suam mihi, et in diebus meis invocabo."], ["3", "Circumdederunt me dolores mortis; et pericula inferni invenerunt me. Tribulationem et dolorem inveni,"], ["4", "et nomen Domini invocavi : o Domine, libera animam meam."], ["5", "Misericors Dominus et justus, et Deus noster miseretur."], ["6", "Custodiens parvulos Dominus; humiliatus sum, et liberavit me."], ["7", "Convertere, anima mea, in requiem tuam, quia Dominus benefecit tibi;"], ["8", "quia eripuit animam meam de morte, oculos meos a lacrimis, pedes meos a lapsu."], ["9", "Placebo Domino in regione vivorum."]], "es": [["1", "Amé al Señor, seguro de que oirá la voz de mi oración."], ["2", "Porque se dignó inclinar hacia mí sus oídos, y así lo invocaré en todos los días de mi vida."], ["3", "Me cercaron mortales angustias, me embistieron los horrores del infierno, o sepulcro. Me hallé en medio de la tribulación y el dolor;"], ["4", "e invoqué el Nombre del Señor. Libra, ¡oh Señor!, el alma mía."], ["5", "Misericordioso es el Señor y justo; compasivo es nuestro Señor."], ["6", "El Señor guarda a los pequeñuelos; yo me humillé, y él me sacó a paz y salvo."], ["7", "Vuelve, ¡oh alma mía!, a tu sosiego; ya que el Señor te ha favorecido tanto."], ["8", "Pues él ha librado de la muerte a mi alma, ha enjugado mis lágrimas, y apartado mis pies del precipicio."], ["9", "Grato seré yo al Señor en la región de los vivos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Domine, libera animam meam de morte, pedes meos a lapsu.", "es": "Señor, libra mi alma de la muerte, y mis pies de la caída."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Auxilium meum a Domino, qui fecit caelum et terram.", "es": "Mi auxilio viene del Señor, que hizo el cielo y la tierra."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 120", "content": {"la": [["1", "Canticum graduum. Levavi oculos meos in montes, unde veniet auxilium mihi."], ["2", "Auxilium meum a Domino, qui fecit caelum et terram."], ["3", "Non det in commotionem pedem tuum, neque dormitet qui custodit te."], ["4", "Ecce non dormitabit neque dormiet qui custodit Israel."], ["5", "Dominus custodit te, Dominus protectio tua super manum dexteram tuam."], ["6", "Per diem sol non uret te, neque luna per noctem."], ["7", "Dominus custodit te ab omni malo; custodiat animam tuam Dominus."], ["8", "Dominus custodiat introitum tuum et exitum tuum, ex hoc nunc et usque in saeculum."]], "es": [["1", "Alcé mis ojos hacia los montes de Jerusalén, de donde me vendrá el socorro."], ["2", "Mi socorro viene del Señor que creó el cielo y la tierra."], ["3", "No permitirá que resbalen tus pies, oh alma mía, ni se adormecerá aquel que te está guardando."], ["4", "No por cierto, no se adormecerá, ni dormirá el que guarda a Israel."], ["5", "El Señor es el que te custodia; el Señor está a tu lado para defenderte."], ["6", "Ni de día el sol te quemará, ni de noche te dañará la luna."], ["7", "El Señor te preservará de todo mal. Guardará el Señor tu alma."], ["8", "El Señor te guardará en todos los pasos de tu vida, desde ahora y para siempre."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Auxilium meum a Domino, qui fecit caelum et terram.", "es": "Mi auxilio viene del Señor, que hizo el cielo y la tierra."}}, {"kind": "psalm", "label": "canticle", "ref": "Rev 15:3-4", "content": {"la": [["3", "et cantantes canticum Moysi servi Dei, et canticum Agni, dicentes : Magna et mirabilia sunt opera tua, Domine Deus omnipotens : justae et verae sunt viae tuae, Rex saeculorum."], ["4", "Quis non timebit te, Domine, et magnificabit nomen tuum? quia solus pius es : quoniam omnes gentes venient, et adorabunt in conspectu tuo, quoniam judicia tua manifesta sunt."]], "es": [["3", "O unas cincuenta leguas. Expresión hiperbólica que xlenota que toda la Judea había de quedar inundada de sangre. Víase Jino, Vendimiar. ÍAPITULO x>. 223"], ["4", "¿Quién no te temerá; oh Señor! y no engran-. decerá tu santo nombre? puesto que tú solo eres el piadoso ': de aquí es que todas las naciones vendrán, y se postrarán en tu acatamiento, visto que tus juicios están manifiestos '."]]}}, {"kind": "psalm", "label": "reading", "ref": "1cor 2:7-10", "content": {"la": [["7", "sed loquimur Dei sapientiam in mysterio, quae abscondita est, quam praedestinavit Deus ante saecula in gloriam nostram,"], ["8", "quam nemo principum hujus saeculi cognovit : si enim cognovissent, numquam Dominum gloriae crucifixissent."], ["9", "Sed sicut scriptum est : Quod oculus non vidit, nec auris audivit, nec in cor hominis ascendit, quae praeparavit Deus iis qui diligunt illum :"], ["10", "nobis autem revelavit Deus per Spiritum suum : Spiritus enim omnia scrutatur, etiam profunda Dei."]], "es": [["7", "sino que predicamos la sabiduría de Dios en el misterio de la encamación, sabiduría recóndita, la cual predestinó y preparó Dios antes de los siglos para gloria nuestra;"], ["8", "Sabiduría que ninguno de los príncipes de este siglo ha entendido; (que si la hubiesen entendido, nunca hubieran crucificado al Señor de la gloria)"], ["9", "y de la cual está escrito ': Ni ojo alguno vio, ni oreja oyó, ni pasó á hombre por pensamiento cuáles i Estofes, de predicar. Véase Conocer"], ["10", "á nosotros empero nos lo ha revelado Dios por medio de su Espíritu; pues el Espirita de Dios todas las cosas penetra, aun las mas íntimas de Dios."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Christus mórtuus est pro peccátis nostris,* Ut nos offérret Deo. Christus.", "℟. Mortificátus quidem carne, vivificátus autem Spíritu. * Ut nos offérret Deo. Glória Patri. Christus."], "es": ["$℣. $Cristo murió por nuestros pecados,   para conducirnos a Dios.", "$℟. $Cristo murió por nuestros pecados,   para conducirnos a Dios.", "$℣. $Como era hombre, lo mataron; pero, como poseía el Espíritu, fue devuelto a la vida.", "$℟. $Para conducirnos a Dios.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Cristo murió por nuestros pecados,   para conducirnos a Dios."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Recordare, Domine, misericordiae tuae, sicut locutus es ad patres nostros.", "es": "Acuérdate, Señor, de tu misericordia, como lo prometiste a nuestros padres."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Recordare, Domine, misericordiae tuae, sicut locutus es ad patres nostros.", "es": "Acuérdate, Señor, de tu misericordia, como lo prometiste a nuestros padres."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christum Dóminum benedicámus, qui lácrimas fléntium pius et miséricors abstérsit, eúmque amánter ac supplíciter invocémus:", "– Miserére pópuli tui, Dómine.", "Christe Dómine, qui húmiles consoláris,", "pone lácrimas páuperum in conspéctu tuo.", "– Miserére pópuli tui, Dómine.", "Audi, miséricors Deus, gémitus moriéntium,", "vísitet eos ángelus tuus atque confórtet.", "– Miserére pópuli tui, Dómine.", "Cognóscant éxsules cuncti providéntiam tuam,", "terréstri reddántur pátriæ et in cæléstem tandem intróeant.", "– Miserére pópuli tui, Dómine.", "Qui mísere in peccáto versántur, tuo cedant amóri,", "et tibi ac tuæ reconciliéntur Ecclésiæ.", "– Miserére pópuli tui, Dómine.", "Defúnctos fratres salva propítius,", "ut plenam sortiántur redemptiónem tuam.", "– Miserére pópuli tui, Dómine."], "es": ["Bendigamos ahora al Señor Jesús, que en su vida mortal escuchó siempre con bondad las súplicas de los que acudían a él y con amor secaba las lágrimas de los que lloraban, y digámosle también nosotros:", "- Señor Jesucristo, tú que consolaste a los tristes y deprimidos, _pon ahora tus ojos en las lágrimas de los pobres._ _Señor, ten piedad de tu pueblo._", "- Escucha los gemidos de los agonizantes _y envíales tus ángeles para que los alivien y conforten._ _Señor, ten piedad de tu pueblo._", "- Que los emigrantes sientan tu providencia en su destierro, _que puedan regresar a su patria y que un día alcancen también la eterna._ _Señor, ten piedad de tu pueblo._", "- Que los pecadores se ablanden a tu amor, _y se reconcilien contigo y con tu Iglesia._ _Señor, ten piedad de tu pueblo._", "- Perdona las faltas de los que han muerto _y dales la plenitud de tu salvación._ _Señor, ten piedad de tu pueblo._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Omnipotens sempiterne Deus, qui in dilecto Filio tuo, universorum Rege, omnia instaurare voluisti, concede propitius, ut tota creatura, a servitute liberata, tu« maiestati deserviat ac te sine fine collaudet.", "es": "Dios nuestro que, de una manera admirable, has manifestado tu sabiduría escondida, con el escándalo de la cruz, concédenos contemplar con tal plenitud de fe la gloria de la pasión de tu Hijo que siempre nos gloriemos confiadamente en la cruz de Jesucristo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Domine, Deus salutis meae, in die clamavi et nocte coram te.", "es": "Señor, Dios de mi salvación, de día y de noche clamo ante ti."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 87", "content": {"la": [["1", "Canticum Psalmi, filiis Core, in finem, pro Maheleth ad respondendum. Intellectus Eman Ezrahitae."], ["2", "Domine, Deus salutis meae, in die clamavi et nocte coram te."], ["3", "Intret in conspectu tuo oratio mea, inclina aurem tuam ad precem meam."], ["4", "Quia repleta est malis anima mea, et vita mea inferno appropinquavit."], ["5", "Aestimatus sum cum descendentibus in lacum, factus sum sicut homo sine adjutorio,"], ["6", "inter mortuos liber; sicut vulnerati dormientes in sepulchris, quorum non es memor amplius, et ipsi de manu tua repulsi sunt."], ["7", "Posuerunt me in lacu inferiori, in tenebrosis, et in umbra mortis."], ["8", "Super me confirmatus est furor tuus, et omnes fluctus tuos induxisti super me."], ["9", "Longe fecisti notos meos a me, posuerunt me abominationem sibi. Traditus sum, et non egrediebar;"], ["10", "oculi mei languerunt prae inopia. Clamavi ad te, Domine, tota die; expandi ad te manus meas."], ["11", "Numquid mortuis facies mirabilia? aut medici suscitabunt, et confitebuntur tibi?"], ["12", "Numquid narrabit aliquis in sepulchro misericordiam tuam, et veritatem tuam in perditione?"], ["13", "Numquid cognoscentur in tenebris mirabilia tua? et justitia tua in terra oblivionis?"], ["14", "Et ego ad te, Domine, clamavi, et mane oratio mea praeveniet te."], ["15", "Ut quid, Domine, repellis orationem meam, avertis faciem tuam a me?"], ["16", "Pauper sum ego, et in laboribus a juventute mea; exaltatus autem, humiliatus sum et conturbatus."], ["17", "In me transierunt irae tuae, et terrores tui conturbaverunt me :"], ["18", "circumdederunt me sicut aqua tota die; circumdederunt me simul."], ["19", "Elongasti a me amicum et proximum, et notos meos a miseria."]], "es": [["2", "Para los hijos de Coré, hasta el fin, sobre Mahelet; para cantarse alternativamente. Instrucción de Emán ezraíta. Señor Dios de mi salud, día y noche estoy clamando tu presencia."], ["3", "Sea recibida mi oración en tu presencia; da oídos a mi súplica;"], ["4", "porque mi alma está harta de males, y tengo ya un pie en el sepulcro."], ["5", "Ya me cuentan entre los muertos; he venido a ser como un hombre desamparado de todos,"], ["6", "relegado entre los muertos, como los acuchillados que yacen en los sepulcros y de quienes no te acuerdas ya, como desechados de tu mano."], ["7", "Me pusieron en un profundo calabozo, en lugares tenebrosos, entre las sombras de la muerte."], ["8", "Tu furor carga de firme sobre mí, y has hecho que se estrellaran en mí todas las olas."], ["9", "Alejaste de mí mis conocidos, me miraron como objeto de su abominación. Cogido estoy, y no hallo salida."], ["10", "Me flaquearon de miseria los ojos. A ti clamé, ¡oh Señor!, todo el día; hacia ti tuve extendidas mis manos."], ["11", "¿Harás tú por ventura milagros en favor de los muertos? Acaso los médicos los resucitarán, para que canten tus alabanzas?"], ["12", "¿Habrá tal vez alguno que en el sepulcro publique tu misericordia, o desde la tumba tu verdad?"], ["13", "¿Cómo han de ser conocidas en las tinieblas tus maravillas, y tu justicia en la región del olvido?"], ["14", "Por eso yo clamo a ti, ¡oh Señor!, y me adelanto a la aurora para presentarte mi oración."], ["15", "¿Por qué, oh Señor, desechas mis ruegos y me escondes tu rostro?"], ["16", "Yo viví pobre, y me crié en trabajos desde mi tierna edad; no bien fui ensalzado, cuando me vi humillado y abatido."], ["17", "Sobre mí ha recaído tu ira; y tus terrores me conturbaron."], ["18", "Me inundan éstos cada día como avenidas de agua; me cercan todos a una."], ["19", "Has alejado de mí a mis amigos, parientes y conocidos, por causa de mis desastres."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Domine, Deus salutis meae, in die clamavi et nocte coram te.", "es": "Señor, Dios de mi salvación, de día y de noche clamo ante ti."}}, {"kind": "psalm", "label": "reading", "ref": "Jer 14:9a", "content": {"la": [["9", "Quare futurus es velut vir vagus, ut fortis qui non potest salvare? Tu autem in nobis es, Domine, et nomen tuum invocatum est super nos : ne derelinquas nos."]], "es": [["9", "¿ Por qué has de ser para tu pueblo como un hombre que va divagando, ó como un campeón sin fuerzas para salvar? Ello es, oh Señor, que tú habitas entre nosotros â¢, y nosotros llevamos el nombr* de pueblo tuyo: no nos abandones pues."]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Concede nos, omnipotens Deus, ita sepulto Unigenito tuo fideliter inhærere, ut cum ipso in novitate vitæ resurgere mereamur. Qui vivit et regnat in sæcula sæculorum.", "es": "Señor, Dios todopoderoso: ya que con nuestro descanso vamos a imitar a tu Hijo que reposó en el sepulcro, te pedimos que, al levantarnos mañana, le imitemos también resucitando a una vida nueva. Por Jesucristo nuestro Señor."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-11-28": {"date_human": {"en": "Saturday, November 28, 2026", "es": "Sábado, 28 de noviembre de 2026", "la": "Sabbato, die 28 Novembris, anno 2026"}, "day_description": {"en": "Saturday in the 34<sup>th</sup> Week in Ordinary Time (Psalter week 2) &mdash; Memoria Sanctæ Mariæ in Sabbato", "es": "Sábado de la 34.<sup>a</sup> semana del Tiempo Ordinario (semana 2 del salterio) &mdash; Memoria Sanctæ Mariæ in Sabbato", "la": "Sabbato infra hebdomadam XXXIV per annum (hebdomada psalterii II) &mdash; Memoria Sanctæ Mariæ in Sabbato"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Quam magnificata sunt opera tua, Domine.", "es": "Cuán grandes son tus obras, Señor."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 91", "content": {"la": [["1", "Psalmus cantici, in die sabbati."], ["2", "Bonum est confiteri Domino, et psallere nomini tuo, Altissime."], ["3", "Ad annuntiandum mane misericordiam tuam, et veritatem tuam per noctem;"], ["4", "in decachordo, psalterio, cum cantico, in cithara."], ["5", "Quia delectasti me, Domine, in factura tua; et in operibus manuum tuarum exsultabo."], ["6", "Quam magnificata sunt opera tua, Domine! nimis profundae factae sunt cogitationes tuae."], ["7", "Vir insipiens non cognoscet, et stultus non intelliget haec."], ["8", "Cum exorti fuerint peccatores sicut foenum, et apparuerint omnes qui operantur iniquitatem, ut intereant in saeculum saeculi;"], ["9", "tu autem Altissimus in aeternum, Domine."], ["10", "Quoniam ecce inimici tui, Domine, quoniam ecce inimici tui peribunt; et dispergentur omnes qui operantur iniquitatem."], ["11", "Et exaltabitur sicut unicornis cornu meum, et senectus mea in misericordia uberi."], ["12", "Et despexit oculus meus inimicos meos, et in insurgentibus in me malignantibus audiet auris mea."], ["13", "Justus ut palma florebit; sicut cedrus Libani multiplicabitur."], ["14", "Plantati in domo Domini, in atriis domus Dei nostri florebunt."], ["15", "Adhuc multiplicabuntur in senecta uberi, et bene patientes erunt :"], ["16", "ut annuntient quoniam rectus Dominus Deus noster, et non est iniquitas in eo."]], "es": [["2", "Bueno es tributar alabanzas al Señor; y salmear a tu Nombre, ¡oh Altísimo!,"], ["3", "celebrando por la mañana tu misericordia, y por la noche tu verdad;"], ["4", "acompañando el canto con el salterio, y con el sonido de la cítara."], ["5", "Porque me has recreado, oh Señor, con tus obras, y al contemplar las obras de tus manos salto de placer."], ["6", "¡Cuán grandes son, Señor tus obras! ¡Cuán insondable la profundidad de tus designios!"], ["7", "El hombre insensato no conoce estas cosas, ni entiende de ellas el necio."], ["8", "Apenas los pecadores brotarán como el heno, y brillarán todos los malvados, cuando perecerán para siempre."], ["9", "Pero tú, ¡oh Señor!, serás eternamente el Altísimo."], ["10", "Así es, Señor, que tus enemigos, sí, tus enemigos perecerán, y quedarán disipados cuantos cometen la maldad."], ["11", "Y mi fortaleza se levantará como la del unicornio, y mi vejez será vigorizada por tu misericordia."], ["12", "Y miraré con desprecio a mis enemigos, y oiré hablar sin susto de los revoltosos que maquinan contra mí."], ["13", "Florecerá como la palma el varón justo, y descollará cual cedro del Líbano."], ["14", "Plantados los justos en la casa del Señor, en los atrios de la casa de nuestro Dios florecerán."], ["15", "Y aun en su lozana vejez se multiplicarán; y se hallarán con vigor y robustez,"], ["16", "para predicar que el Señor Dios nuestro es justo, y que no hay en él ni sombra de iniquidad."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Quam magnificata sunt opera tua, Domine.", "es": "Cuán grandes son tus obras, Señor."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Date magnificentiam Deo nostro.", "es": "Dad grandeza a nuestro Dios."}}, {"kind": "psalm", "label": "canticle", "ref": "Deut 32:1-12", "content": {"la": [["1", "Audite, caeli, quae loquor : audiat terra verba oris mei."], ["2", "Concrescat ut pluvia doctrina mea, fluat ut ros eloquium meum, quasi imber super herbam, et quasi stillae super gramina."], ["3", "Quia nomen Domini invocabo : date magnificentiam Deo nostro."], ["4", "Dei perfecta sunt opera, et omnes viae ejus judicia : Deus fidelis, et absque ulla iniquitate, justus et rectus."], ["5", "Peccaverunt ei, et non filii ejus in sordibus : generatio prava atque perversa."], ["6", "Haeccine reddis Domino, popule stulte et insipiens? numquid non ipse est pater tuus, qui possedit te, et fecit, et creavit te?"], ["7", "Memento dierum antiquorum, cogita generationes singulas : interroga patrem tuum, et annuntiabit tibi : majores tuos, et dicent tibi."], ["8", "Quando dividebat Altissimus gentes, quando separabat filios Adam, constituit terminos populorum juxta numerum filiorum Israel."], ["9", "Pars autem Domini, populus ejus : Jacob funiculus haereditatis ejus."], ["10", "Invenit eum in terra deserta, in loco horroris, et vastae solitudinis : circumduxit eum, et docuit : et custodivit quasi pupillam oculi sui."], ["11", "Sicut aquila provocans ad volandum pullos suos, et super eos volitans, expandit alas suas, et assumpsit eum, atque portavit in humeris suis."], ["12", "Dominus solus dux ejus fuit, et non erat cum eo deus alienus :"]], "es": [["1", "Oid cielos, loque voy á proferir: escuche la tierra las palabras de mi boca '."], ["2", "Destilen y empápense como lluvia los documentos mios: desciendan como el rocío mis palabraSj como sobre la yerba \\:i 7ne7m(Ia' lluvia, como llovizna sobre las dehesas."], ["3", "Porque yo invocaré el nombre del Señor: ensalzad vosotros la grandeza de nuestro Dios."], ["4", "Perfectas son todas las obras de Dios y rectos todos sus caminos. Dios es fiel y sin sombra de iniquidad, íntegro y justo."], ["5", "Sus hijos, indignos ya de este nombre, pecaron contra él con sus inmundos ¿dolos: generación depravada y perversa."], ["6", "¿Asi correspondes al Señor, pueblo necio é insensato? ¿Por ventura no es él tu padre, que te rescató, que te hizo, y te crió?"], ["7", "Acuérdate de los tiempos antiguos, recorre de una en una las generaciones: pregúntalo á tu padre, y él te informará; á tus antepasados, y te lo dirán."], ["8", "Cuando el Altísimo dividia las naciones; cuando separaba los hijos de Adara, fijó i/a enlos siglos venideros, y tiene su cumplimiento en todos los tiempos; y es una sentencia ó testimonio decisivo contra ios judíos."], ["9", "Porque el Señor escogió á estos como porción suya: tomó á Jacob por herencia propia."], ["10", "Hallóle después en una tierra desierta, en un lugar de horror, en una vasta soledad; condújole por diferentes rodeos durante cuarenta años y le adoctrinó, y guardóle como la niña de sus ojos."], ["11", "Como el águila incita á volar á sus poUuelos extendiendo las alas y revoloteando sobre ellos: asi el Señor extendió sus alas sobre su pueblo y le tomó y trasportó sobre sus hombros."], ["12", "El Señor fue su único caudillo; y no había con él Dios ageno."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Date magnificentiam Deo nostro.", "es": "Dad grandeza a nuestro Dios."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Quam admirabile est nomen tuum, Domine, in universa terra.", "es": "Cuán admirable es tu nombre, Señor, en toda la tierra."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 8", "content": {"la": [["1", "In finem, pro torcularibus. Psalmus David."], ["2", "Domine, Dominus noster, quam admirabile est nomen tuum in universa terra! quoniam elevata est magnificentia tua super caelos."], ["3", "Ex ore infantium et lactentium perfecisti laudem propter inimicos tuos, ut destruas inimicum et ultorem."], ["4", "Quoniam videbo caelos tuos, opera digitorum tuorum, lunam et stellas quae tu fundasti."], ["5", "Quid est homo, quod memor es ejus? aut filius hominis, quoniam visitas eum?"], ["6", "Minuisti eum paulo minus ab angelis; gloria et honore coronasti eum;"], ["7", "et constituisti eum super opera manuum tuarum."], ["8", "Omnia subjecisti sub pedibus ejus, oves et boves universas, insuper et pecora campi,"], ["9", "volucres caeli, et pisces maris qui perambulant semitas maris."], ["10", "Domine, Dominus noster, quam admirabile est nomen tuum in universa terra!"]], "es": [["2", "Oh Señor, soberano dueño nuestro, ¡cuán admirable es tu santo Nombre en toda la tierra! Porque tu majestad se ve ensalzada sobre los cielos."], ["3", "De la boca de los niños y de los que están aún pendientes del pecho de sus madres, hiciste tú salir perfecta alabanza, por razón de tus enemigos, para destruir al enemigo y al vengativo."], ["4", "Yo contemplo tus cielos, obra de tus dedos, la luna y las estrellas que tú creaste, y exclamo:"], ["5", "¿Qué es el hombre, para que tú te acuerdes de él? ¿O que es el hijo del hombre, para que vengas a visitarlo?"], ["6", "Lo hiciste un poco inferior a los ángeles, lo coronaste de gloria y de honor,"], ["7", "y le has dado el mando sobre las obras de tus manos."], ["8", "Todas ellas las pusiste a sus pies; todas las ovejas y bueyes, y aun las bestias del campo;"], ["9", "las aves del cielo, y los peces del mar que hienden sus ondas."], ["10", "¡Oh Señor, soberano dueño nuestro, ¡y cuán admirable es tu Nombre en toda la redondez de la tierra!"]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Quam admirabile est nomen tuum, Domine, in universa terra.", "es": "Cuán admirable es tu nombre, Señor, en toda la tierra."}}, {"kind": "psalm", "label": "reading", "ref": "rom 12:14-16", "content": {"la": [["14", "Benedicite persequentibus vos : benedicite, et nolite maledicere."], ["15", "Gaudere cum gaudentibus, flere cum flentibus :"], ["16", "idipsum invicem sentientes : non alta sapientes, sed humilibus consentientes. Nolite esse prudentes apud vosmetipsos :"]], "es": [["14", "Bendecid á los que os persiguen; bendecidlos, y no los maldigáis."], ["15", "Alegraos con los que se alegran, y llorad con los que lloran ':"], ["16", "estad siempre unidos en unos mismos sentimientos y deseos: no blasonando de cosas altas, sino acomodándoos á lo que sea mas humilde. No queráis teneros dentro de vosotros mismos por sabios ó prudentes:"]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Exsultábunt lábia mea,* Cum cantávero tibi. Exsultábunt.", "℟. Lingua mea meditábitur iustítiam tuam.* Cum cantávero tibi. Glória Patri. Exsultábunt."], "es": ["$℣. $Te aclamarán mis labios, Señor.", "$℟. $Te aclamarán mis labios, Señor.", "$℣. $Mi lengua recitará tu auxilio.", "$℟. $Mis labios, Señor.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Te aclamarán mis labios, Señor."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Beata es, Maria, quae credidisti: perficientur in te, quae dicta sunt tibi a Domino, alleluia.", "es": "Bienaventurada tú, María, que has creído: se cumplirá en ti lo que te fue dicho de parte del Señor, aleluya."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Beata es, Maria, quae credidisti: perficientur in te, quae dicta sunt tibi a Domino, alleluia.", "es": "Bienaventurada tú, María, que has creído: se cumplirá en ti lo que te fue dicho de parte del Señor, aleluya."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christi benignitátem et sapiéntiam celebrémus, qui in ómnibus frátribus nostris, præsértim mala patiéntibus, conspiciéndum et diligéndum se trádidit. Eum instánter orémus:", "– Pérfice nos in caritáte, Dómine.", "Resurrectiónem tuam iam mane recólimus,", "et benefícia redemptiónis tuæ cunctis optámus.", "– Pérfice nos in caritáte, Dómine.", "Præsta, Dómine, ut hódie testimónium de te perhibeámus,", "et hóstiam sanctam offerámus per te Patri placéntem.", "– Pérfice nos in caritáte, Dómine.", "Fac ut in ómnibus tuam agnoscámus imáginem,", "et tibi in eis ministrémus.", "– Pérfice nos in caritáte, Dómine.", "Christe, vitis vera, cuius nos pálmites sumus,", "da nos in te manére, ut fructum multum afferámus et Deum Patrem glorificémus.", "– Pérfice nos in caritáte, Dómine."], "es": ["Celebremos la sabiduría y la bondad de Cristo, que ha querido ser amado y servido en los hermanos, especialmente en los que sufren, y supliquémosle insistentemente, diciendo:", "- Al recordar esta mañana tu santa resurrección, _te pedimos, Señor, que extiendas los beneficios de tu redención a todos los hombres._ _Haznos perfectos en la caridad, Señor._", "- Que todo el día de hoy sepamos dar buen testimonio del nombre cristiano _y ofrezcamos nuestra jornada como un culto espiritual agradable al Padre._ _Haznos perfectos en la caridad, Señor._", "- Enséñanos, Señor, a descubrir tu imagen en todos los hombres _y a servirte a ti en cada uno de ellos._ _Haznos perfectos en la caridad, Señor._", "- Oh Cristo, vid verdadera de la que nosotros somos sarmientos, _haz que permanezcamos en ti y demos fruto abundante, para que con ello reciba gloria Dios Padre._ _Haznos perfectos en la caridad, Señor._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Concede nos famulos tuos, quaesumus, Domine Deus, perpetua mentis et corporis sanitate gaudere: et, gloriosa beatae Mariae semper Virginis intercessione, a praesenti liberari tristitia, et aeterna perfrui laetitia.", "es": "Que nuestra voz, Señor, nuestro espíritu y toda nuestra vida sean una continua alabanza en tu honor; y, pues toda nuestra existencia es puro don de tu liberalidad, que también cada una de nuestras acciones te esté plenamente dedicada. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}, "ref": "Memoria Sanctæ Mariæ in Sabbato"}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Hija de Sion, alégrate; salta de gozo, hija de Jerusalén. Aleluya._", "la": "Iucundáre, fília Sion, et exsúlta satis fília Ierúsalem, allelúia."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 109:1-5,7", "content": {"la": [["1", "Psalmus David. Dixit Dominus Domino meo : Sede a dextris meis, donec ponam inimicos tuos scabellum pedum tuorum."], ["2", "Virgam virtutis tuae emittet Dominus ex Sion : dominare in medio inimicorum tuorum."], ["3", "Tecum principium in die virtutis tuae in splendoribus sanctorum; ex utero, ante luciferum, genui te."], ["4", "Juravit Dominus, et non poenitebit eum : Tu es sacerdos in aeternum secundum ordinem Melchisedech."], ["5", "Dominus a dextris tuis; confregit in die irae suae reges."], ["7", "de torrente in via bibet; propterea exaltabit caput."]], "es": [["1", "El Señor dijo a mi Señor: Siéntate a mi diestra, mientras que yo pongo a tus enemigos por tarima de tus pies."], ["2", "De Sión hará salir el Señor el cetro de tu poder; domina tú en medio de tus enemigos."], ["3", "Contigo está el principado el día de tu poderío, en medio de los resplandores de la santidad; de mis entrañas te engendré, antes de existir el lucero de la mañana."], ["4", "Juró el Señor, y no se arrepentirá, y dijo: Tú eres sacerdote sempiterno, según el orden de Melquisedec."], ["5", "El Señor está a tu diestra; en el día de su ira destrozó a los reyes."], ["7", "Beberá del torrente durante el camino, por eso levantará su cabeza."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Hija de Sion, alégrate; salta de gozo, hija de Jerusalén. Aleluya._", "la": "Iucundáre, fília Sion, et exsúlta satis fília Ierúsalem, allelúia."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Vendrá nuestro Rey, Cristo, el Señor: el Cordero de quien Juan anunció la venida._", "la": "Rex noster advéniet Christus, quem Ioánnes prædicávit Agnum esse ventúrum."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 113:1-8", "content": {"la": [["1", "Alleluja. In exitu Israel de Aegypto, domus Jacob de populo barbaro,"], ["2", "facta est Judaea sanctificatio ejus, Israel potestas ejus."], ["3", "Mare vidit, et fugit; Jordanis conversus est retrorsum."], ["4", "Montes exsultaverunt ut arietes, et colles sicut agni ovium."], ["5", "Quid est tibi, mare, quod fugisti? et tu, Jordanis, quia conversus es retrorsum?"], ["6", "montes, exsultastis sicut arietes? et colles sicut agni ovium?"], ["7", "A facie Domini mota est terra, a facie Dei Jacob;"], ["8", "qui convertit petram in stagna aquarum, et rupem in fontes aquarum."]], "es": [["1", "Cuando Israel salió de Egipto, al partir la casa de Jacob de en medio de aquel pueblo extranjero."], ["2", "Consagró Dios a su servicio al pueblo de Judá, y estableció su imperio en Israel."], ["3", "El mar lo vio, y echó a huir; el Jordán volvió hacia atrás."], ["4", "Los montes brincaron de gozo como carneros, y los collados como corderitos."], ["5", "¿Qué tienes tú, ¡oh mar!, que así has huido?; y tú, ¡oh Jordán!, ¿por qué has vuelto atrás?"], ["6", "Vosotros, ¡oh montes!, ¿por qué brincasteis de gozo como carneros?; y ¿vosotros, ¡oh collados!, como corderitos?"], ["7", "Por la presencia del Señor se estremeció la tierra, por la presencia del Dios de Jacob,"], ["8", "que convirtió la peña en estanque de aguas, y en fuentes de aguas la árida roca."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Vendrá nuestro Rey, Cristo, el Señor: el Cordero de quien Juan anunció la venida._", "la": "Rex noster advéniet Christus, quem Ioánnes prædicávit Agnum esse ventúrum."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Llego en seguida y traigo conmigo mi salario, para pagar a cada uno según sus propias obras._", "la": "Ecce vénio cito, et merces mea mecum est, dicit Dóminus: dare unicuíque secúndum ópera sua."}}, {"kind": "psalm", "label": "canticle", "ref": "rev 19:1-2,5-7", "content": {"la": [["1", "Post haec audivi quasi vocem turbarum multarum in caelo dicentium : Alleluja : salus, et gloria, et virtus Deo nostro est :"], ["2", "quia vera et justa judicia sunt ejus, qui judicavit de meretrice magna, quae corrupit terram in prostitutione sua, et vindicavit sanguinem servorum suorum de manibus ejus."], ["5", "Ex vox de throno exivit, dicens : Laudem dicite Deo nostro omnes servi ejus : et qui timetis eum pusilli et magni."], ["6", "Et audivi quasi vocem turbae magnae, et sicut vocem aquarum multarum, et sicut vocem tonitruorum magnorum, dicentium : Alleluja : quoniam regnavit Dominus Deus noster omnipotens."], ["7", "Gaudeamus, et exsultemus : et demus gloriam ei : quia venerunt nuptiae Agni, et uxor ejus praeparavit se."]], "es": [["1", "Después de estas cosas oi en ci cielo como una voz de muchas gentes, que decían: AUeluya: La salvación, y la gloria, y el poder son debidos á nuestro Dios;"], ["2", "porque verdaderos son y justos sus juicios, pues ha condenado á la gran ramera, la cual estragó la tierra con su prostitución, y ha vengado la sangre de sus siervos derramada por las manos de ella."], ["5", "Y del solio salió una voz que decía: Alabad á nuestro Dios todos sus siervos, y los que le teméis, pequeños y grandes."], ["6", "Oí también una voz como de gran gentío, y como el ruido de muchas aguas, y como el estampido de grandes truenos, que decia: Alleluya; porque tomó ya posesión del reino el Señor Dios nuestro todopoderoso."], ["7", "Gozémonos, y saltemos de júbilo, y démosle la gloria, pues son llegadas las bodas del Cordero ', y la Iglesia su esposa se ha puesto de gala ó ataviada."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Llego en seguida y traigo conmigo mi salario, para pagar a cada uno según sus propias obras._", "la": "Ecce vénio cito, et merces mea mecum est, dicit Dóminus: dare unicuíque secúndum ópera sua."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "phil 4:4-5", "content": {"la": [["4", "Gaudete in Domino semper : iterum dico gaudete."], ["5", "Modestia vestra nota sit omnibus hominibus : Dominus prope est."]], "es": [["4", "Vivid siempre alegres en el Señor: vivid alegres repito '."], ["5", "Sea vuestra modestia * patente á lodos los hombres: el Señor está cerca."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Osténde nobis, Dómine,* Misericórdiam tuam. Osténde.", "℟. Et salutáre tuum da nobis.* Misericórdiam tuam. Glória Patri. Osténde."], "es": ["$℣. $Muéstranos, Señor,  tu  misericordia.", "$℟. $Muéstranos, Señor,  tu  misericordia.", "$℣. $Danos tu salvación.", "$℟. $Tu  misericordia.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Muéstranos, Señor,  tu  misericordia."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_No temas, María, porque has encontrado gracia ante Dios. Concebirás en tu vientre y darás a luz a un hijo. Aleluya._", "la": "Ne tímeas, María: invenísti enim grátiam apud Dóminum: ecce concípies et páries Fílium."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_No temas, María, porque has encontrado gracia ante Dios. Concebirás en tu vientre y darás a luz a un hijo. Aleluya._", "la": "Ne tímeas, María: invenísti enim grátiam apud Dóminum: ecce concípies et páries Fílium."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Redemptórem nostrum Iesum Christum, qui est via, véritas et vita, supplíciter rogémus, dicéntes:", "– Veni et mane nobíscum, Dómine.", "Iesu, Fili Altíssimi, qui Vírgini Maríæ per Gabriélem annuntiátus es,", "veni ad regnándum super plebem tuam in ætérnum.", "– Veni et mane nobíscum, Dómine.", "Tu, Sancte Dei, cui Præcúrsor in sinu Elísabeth exsultávit,", "veni ad dandum univérso mundo gáudium salútis.", "– Veni et mane nobíscum, Dómine.", "Iesu Salvátor, cuius nomen Ioseph viro iusto ab Angelo revelátum est,", "veni ad pópulum tuum salvum faciéndum a peccátis eórum.", "– Veni et mane nobíscum, Dómine.", "Lumen mundi, quod Símeon et omnes iusti exspectábant,", "veni ad consolándum nos.", "– Veni et mane nobíscum, Dómine.", "Oriens indefíciens, quem nos ex alto visitatúrum prædíxit Zacharías,", "veni ad illuminándum illos, qui in umbra mortis sedent.", "– Veni et mane nobíscum, Dómine."], "es": ["Oremos a Jesucristo, nuestro redentor, que es camino, verdad y vida de los hombres, y digámosle:", "- Jesús, Hijo del Altísimo, anunciado por el ángel Gabriel a María Virgen, _ven a reinar para siempre sobre tu pueblo._ _Ven, Señor, y quédate con nosotros._", "- Santo de Dios, ante cuya venida el Precursor saltó de gozo en el seno de Isabel,_ven y alegra al mundo con la gracia de la salvación._ _Ven, Señor, y quédate con nosotros._", "- Jesús, Salvador,  cuyo nombre el ángel reveló a José,_ven a salvar al pueblo de sus pecados._ _Ven, Señor, y quédate con nosotros._", "- Luz del mundo, a quien esperaban Simeón y todos los justos,_ven a consolar a tu pueblo._ _Ven, Señor, y quédate con nosotros._", "- Sol naciente que nos visitará de lo alto, como profetizó Zacarías,_ven a iluminar a los que viven en tinieblas y en sombra de muerte._ _Ven, Señor, y quédate con nosotros._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Da, quǽsumus, omnípotens Deus, hanc tuis fidélibus voluntátem, ut, Christo tuo veniénti iustis opéribus occurréntes, eius déxteræ sociáti, regnum mereántur possidére cæléste. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Dios todopoderoso, aviva en tus fieles, al comenzar el Adviento, el deseo de salir al encuentro de Cristo, que viene, acompañados por las buenas obras, para que, colocados un día a su derecha, merezcan poseer el reino eterno. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Miserere mei, Domine, et exaudi orationem meam.", "es": "Ten piedad de mí, Señor, y escucha mi oración."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 4", "content": {"la": [["1", "In finem, in carminibus. Psalmus David."], ["2", "Cum invocarem exaudivit me Deus justitiae meae, in tribulatione dilatasti mihi. Miserere mei, et exaudi orationem meam."], ["3", "Filii hominum, usquequo gravi corde? Ut quid diligitis vanitatem, et quaeritis mendacium?"], ["4", "Et scitote quoniam mirificavit Dominus sanctum suum; Dominus exaudiet me cum clamavero ad eum."], ["5", "Irascimini, et nolite peccare; quae dicitis in cordibus vestris, in cubilibus vestris compungimini."], ["6", "Sacrificate sacrificium justitiae, et sperate in Domino. Multi dicunt : Quis ostendit nobis bona?"], ["7", "Signatum est super nos lumen vultus tui, Domine : dedisti laetitiam in corde meo."], ["8", "A fructu frumenti, vini, et olei sui, multiplicati sunt."], ["9", "In pace in idipsum dormiam, et requiescam;"], ["10", "quoniam tu, Domine, singulariter in spe constituisti me."]], "es": [["2", "Así que lo invoqué, me oyó Dios, que es mi justicia; tú, ¡oh Dios mío!, en mi angustia me ensanchaste el corazón. Apiádate aún de mí, y presta oídos a mi oración."], ["3", "¡Oh, hijos de los hombres!, ¿hasta cuándo seréis de estúpido corazón?; ¿por qué amáis la vanidad y vais en pos de la mentira?"], ["4", "Sabed, pues, que es el Señor quien ha hecho admirable su Santo: el Señor me oirá siempre que clamare a él."], ["5", "Enojaos, y no queráis pecar más; compungíos en el retiro de vuestros lechos de las cosas que andáis meditando en vuestros corazones."], ["6", "Ofreced sacrificios de justicia, y confiad en el Señor. Dicen muchos: ¿Quién nos hará ver los bienes que se nos prometen?"], ["7", "Impresa está, Señor, sobre nosotros la luz de tu rostro: tú has infundido la alegría en mi corazón."], ["8", "Ellos están bien abastecidos y alegres con la abundancia de su trigo, vino y aceite."], ["9", "Mas yo, Dios mío, dormiré en paz, y descansaré en tus promesas:"], ["10", "Porque tú, ¡Oh Señor!, sólo tú has asegurado mi esperanza."]]}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 133", "content": {"la": [["1", "Canticum graduum. Ecce nunc benedicite Dominum, omnes servi Domini : qui statis in domo Domini, in atriis domus Dei nostri."], ["2", "In noctibus extollite manus vestras in sancta, et benedicite Dominum."], ["3", "Benedicat te Dominus ex Sion, qui fecit caelum et terram."]], "es": [["1", "Ea, pues, bendecid al Señor ahora mismo, vosotros todos, ¡oh siervos del Señor! Vosotros los que asistís en la casa del Señor, en los atrios del templo de nuestro Dios,"], ["2", "levantad por las noches vuestras manos hacia el santuario, y alabad al Señor."], ["3", "Te bendiga desde Sión el Señor que creó el cielo y la tierra."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Miserere mei, Domine, et exaudi orationem meam.", "es": "Ten piedad de mí, Señor, y escucha mi oración."}}, {"kind": "psalm", "label": "reading", "ref": "Deut 6:4-7", "content": {"la": [["4", "Audi, Israel : Dominus Deus noster, Dominus unus est."], ["5", "Diliges Dominum Deum tuum ex toto corde tuo, et ex tota anima tua, et ex tota fortitudine tua."], ["6", "Eruntque verba haec, quae ego praecipio tibi hodie, in corde tuo :"], ["7", "et narrabis ea filiis tuis, et meditaberis in eis sedens in domo tua, et ambulans in itinere, dormiens atque consurgens."]], "es": [["4", "Escucha, oh Israel: El Señor Dios nuestro es el solo ' y único Dios y Señor."], ["5", "Amarás pues al Señor Dios tuvo con todo tu corazón, y con toda tu alma, y con todas tus fuerzas '."], ["6", "Y estos mandamientos, que yo te doy en este dia, estarán estampados en tu corazón,"], ["7", "y los enseñarás á tus hijos, y en ellos meditarás sentado en tu casa, y andando de viage, y al acostarte, y al levantarte;"]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Visita nos, quæsumus, Domine, hac nocte præsenti, ut, diluculo tua virtute surgentes, de resurrectione Christi tui gaudere valeamus. Qui vivit et regnat in sæcula sæculorum.", "es": "Guárdanos, Señor, durante esta noche y haz que mañana, ya al clarear el nuevo día, la celebración del domingo nos llene con la alegría de la resurrección de tu Hijo. Que vive y reina por los siglos de los siglos. Amén."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-11-29": {"date_human": {"en": "Sunday, November 29, 2026", "es": "Domingo, 29 de noviembre de 2026", "la": "Dominica, die 29 Novembris, anno 2026"}, "day_description": {"en": "1<sup>st</sup> Sunday of Advent", "es": "Domingo 1.<sup>a</sup> de Adviento", "la": "Dominica I Adventus"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Aquel día, los montes destilarán dulzura y las colinas manarán leche y miel. Aleluya._", "la": "In illa die stillábunt montes dulcédinem, et colles fluent lac et mel, allelúia."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 62:2-9", "content": {"la": [["2", "Deus, Deus meus, ad te de luce vigilo. Sitivit in te anima mea; quam multipliciter tibi caro mea!"], ["3", "In terra deserta, et invia, et inaquosa, sic in sancto apparui tibi, ut viderem virtutem tuam et gloriam tuam."], ["4", "Quoniam melior est misericordia tua super vitas, labia mea laudabunt te."], ["5", "Sic benedicam te in vita mea; et in nomine tuo levabo manus meas."], ["6", "Sicut adipe et pinguedine repleatur anima mea, et labiis exsultationis laudabit os meum."], ["7", "Si memor fui tui super stratum meum, in matutinis meditabor in te."], ["8", "Quia fuisti adjutor meus, et in velamento alarum tuarum exsultabo."], ["9", "Adhaesit anima mea post te; me suscepit dextera tua."]], "es": [["2", "¡Dios mío, oh mi Dios!, a ti aspiro, y me dirijo desde que apunta la aurora. De ti está sedienta el alma mía. ¡Y de cuántas maneras lo está también este mi cuerpo!"], ["3", "En esta tierra desierta, intransitable y sin agua, me pongo en tu presencia, como si me hallara en el santuario, para contemplar tu poder y la gloria tuya."], ["4", "Más apreciable es que mil vidas tu misericordia; por tanto se ocuparán mis labios en tu alabanza."], ["5", "Por esto te bendeciré toda mi vida, y alzaré mis manos invocando tu Nombre."], ["6", "Quede mi alma bien llena de ti, como de un manjar jugoso; y entonces con labios que rebosen de júbilo, te cantará mi boca himnos de alabanza."], ["7", "Me acordaba de ti en mi lecho; en ti meditaba luego que amanecía;"], ["8", "pues tú eres mi amparo, y a la sombra de tus alas me regocijaré."], ["9", "En pos de ti va anhelando el alma mía; me ha protegido tu diestra."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Aquel día, los montes destilarán dulzura y las colinas manarán leche y miel. Aleluya._", "la": "In illa die stillábunt montes dulcédinem, et colles fluent lac et mel, allelúia."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Los montes y las colinas aclamarán en presencia del Señor, y los árboles del bosque aplaudirán, porque viene el Señor y reinará eternamente. Aleluya._", "la": "Montes et colles cantábunt coram Deo laudem, et ómnia ligna silvárum plaudent mánibus: quóniam véniet Dóminus dominátor in regnum ætérnum, allelúia."}}, {"kind": "psalm", "label": "canticle", "ref": "dan 3:57-88,56", "content": {"la": [["57", "Benedicite, omnia opera Domini, Domino : laudate et superexaltate eum in saecula."], ["58", "Benedicite, angeli Domini, Domino : laudate et superexaltate eum in saecula."], ["59", "Benedicite, caeli, Domino : laudate et superexaltate eum in saecula."], ["60", "Benedicite, aquae omnes, quae super caelos sunt, Domino : laudate et superexaltate eum in saecula."], ["61", "Benedicite, omnes virtutes Domini, Domino : laudate et superexaltate eum in saecula."], ["62", "Benedicite, sol et luna, Domino : laudate et superexaltate eum in saecula."], ["63", "Benedicite, stellae caeli, Domino : laudate et superexaltate eum in saecula."], ["64", "Benedicite, omnis imber et ros, Domino : laudate et superexaltate eum in saecula."], ["65", "Benedicite, omnes spiritus Dei, Domino : laudate et superexaltate eum in saecula."], ["66", "Benedicite, ignis et aestus, Domino : laudate et superexaltate eum in saecula."], ["67", "Benedicite, frigus et aestus, Domino : laudate et superexaltate eum in saecula."], ["68", "Benedicite, rores et pruina, Domino : laudate et superexaltate eum in saecula."], ["69", "Benedicite, gelu et frigus, Domino : laudate et superexaltate eum in saecula."], ["70", "Benedicite, glacies et nives, Domino : laudate et superexaltate eum in saecula."], ["71", "Benedicite, noctes et dies, Domino laudate et superexaltate eum in saecula."], ["72", "Benedicite, lux et tenebrae, Domino : laudate et superexaltate eum in saecula."], ["73", "Benedicite, fulgura et nubes, Domino : laudate et superexaltate eum in saecula."], ["74", "Benedicat terra Dominum : laudet et superexaltet eum in saecula."], ["75", "Benedicite, montes et colles, Domino : laudate et superexaltate eum in saecula."], ["76", "Benedicite, universa germinantia in terra, Domino : laudate et superexaltate eum in saecula."], ["77", "Benedicite, fontes, Domino : laudate et superexaltate eum in saecula."], ["78", "Benedicite, maria et flumina, Domino : laudate et superexaltate eum in saecula."], ["79", "Benedicite, cete, et omnia quae moventur in aquis, Domino : laudate et superexaltate eum in saecula."], ["80", "Benedicite, omnes volucres caeli, Domino : laudate et superexaltate eum in saecula."], ["81", "Benedicite, omnes bestiae et pecora, Domino : laudate et superexaltate eum in saecula."], ["82", "Benedicite, filii hominum, Domino : laudate et superexaltate eum in saecula."], ["83", "Benedicat Israel Dominum : laudet et superexaltet eum in saecula."], ["84", "Benedicite, sacerdotes Domini, Domino : laudate et superexaltate eum in saecula."], ["85", "Benedicite, servi Domini, Domino : laudate et superexaltate eum in saecula."], ["86", "Benedicite, spiritus et animae justorum, Domino : laudate et superexaltate eum in saecula."], ["87", "Benedicite, sancti et humiles corde, Domino : laudate et superexaltate eum in saecula."], ["88", "Benedicite, Anania, Azaria, Misael, Domino : laudate et superexaltate eum in saecula : quia eruit nos de inferno, et salvos fecit de manu mortis : et liberavit nos de medio ardentis flammae, et de medio ignis eruit nos."], ["56", "Benedictus es in firmamento caeli : et laudabilis et gloriosus in saecula."]], "es": [["57", "Obras todas del Señor, bendecid al Señor, y loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["58", "Angeles del Señor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["59", "Cielos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["60", "Aguas todas que estáis sobre los cielos *, bendecid al Señor: alabadle, y ensalzadle sobre todas las cosas por todos los siglos."], ["61", "Virtudes todas ó milicias celestiales ', bendecid vosotras al Señor: loadle y ensalzadle sobre todas"], ["62", "Sol y luna, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["63", "Estrellas del cielo, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["64", "Lluvias todas y rocíos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["65", "Espíritus ó vientos de Dios, bendecid todos vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["66", "Fuego y calor, bendecid vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["67", "Frió y calor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["68", "Rocíos y escarchas, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["69", "Hielos y frios, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["70", "Heladas y nieves, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["71", "Noches y dias, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["72", "Luz y tinieblas, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["73", "Relámpagos y nubes, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["74", "Bendiga al Señor la tierra, alábele y ensálzele sobre todas las cosas por todos los siglos."], ["75", "Montes y collados, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["76", "Plantas todas que nacéis en la tierra, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["77", "Fuentes, bendecid al Señor: loadle y ensalzíidle sobre todas las cosas por todos los siglos."], ["78", "Mares y rios, bendecid al Señor: loadle y"], ["79", "Ballenas y peces todos, que giráis por las aguas, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["80", "Aves todas del cielo, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["81", "Bestias todas y ganados, bendecid al Señor: loadle y ensab:adle por todos los siglos sobre todas las cosas."], ["82", "Oh hijos de los hombres, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["83", "Bendiga Israel al Señor: alábele y ensálzele por todos los siglos sobre todas las cosas."], ["84", "Vosotros sacerdotes del Señor, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["85", "Siervos del Señor, bendecid vosotros al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["86", "Espíritus y almas de los justos, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["87", "Vosotros santos, y humildes de corazón, bendecid al Señor: alabadle y ensalzadle por todos los siglos sobre todas las cosas."], ["88", "Vosotros, Ananías, Azarías y Misael, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas. Porque él nos ha salvado del inlierno ó del sepulcro, y librado de las manos de la ( APÍfüLO III. '¿i'o muelle: y nos ha sacado de en medio de las ardientes llamas, y libertado del fuego del homo."], ["56", "Bendito eres tú en el firmamento del cielo, y digno de loor, y de gloria por todos los siglos."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Los montes y las colinas aclamarán en presencia del Señor, y los árboles del bosque aplaudirán, porque viene el Señor y reinará eternamente. Aleluya._", "la": "Montes et colles cantábunt coram Deo laudem, et ómnia ligna silvárum plaudent mánibus: quóniam véniet Dóminus dominátor in regnum ætérnum, allelúia."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Vendrá el gran profeta y renovará a Jerusalén. Aleluya._", "la": "Ecce véniet Prophéta magnus, et ipse renovábit Ierúsalem, allelúia."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 149", "content": {"la": [["1", "Alleluja. Cantate Domino canticum novum; laus ejus in ecclesia sanctorum."], ["2", "Laetetur Israel in eo qui fecit eum, et filii Sion exsultent in rege suo."], ["3", "Laudent nomen ejus in choro, in tympano et psalterio psallant ei."], ["4", "Quia beneplacitum est Domino in populo suo, et exaltabit mansuetos in salutem."], ["5", "Exsultabunt sancti in gloria, laetabuntur in cubilibus suis."], ["6", "Exaltationes Dei in gutture eorum : et gladii ancipites in manibus eorum :"], ["7", "ad faciendam vindictam in nationibus, increpationes in populis;"], ["8", "ad alligandos reges eorum in compedibus, et nobiles eorum in manicis ferreis;"], ["9", "ut faciant in eis judicium conscriptum : gloria haec est omnibus sanctis ejus. Alleluja."]], "es": [["1", "Cantad al Señor un cántico nuevo, resuenen sus loores en la reunión de los santos."], ["2", "Que se alegre Israel en el Señor que le creó, y se regocijen en su rey los hijos de Sión."], ["3", "Celebren su excelso Nombre con armoniosos conciertos, y publiquen sus alabanzas al son del pandero y salterio."], ["4", "Porque el Señor ha mirado benignamente a su pueblo; y exaltará a los humildes y los salvará."], ["5", "Se gozarán los santos en la gloria, y se regocijarán en sus moradas."], ["6", "Resonarán en sus bocas los elogios sublimes de Dios; y vibrarán en sus manos espadas de dos filos,"], ["7", "para ejecutar la divina venganza en las naciones, y castigar a los pueblos impíos;"], ["8", "para aprisionar con grillos a sus reyes, y con esposas de hierro a sus magnates;"], ["9", "para ejecutar en ellos el juicio decretado: Gloria es ésta que está reservada para todos sus santos. ¡Aleluya!"]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Vendrá el gran profeta y renovará a Jerusalén. Aleluya._", "la": "Ecce véniet Prophéta magnus, et ipse renovábit Ierúsalem, allelúia."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "rom 13:11-12", "content": {"la": [["11", "Et hoc scientes tempus : quia hora est jam nos de somno surgere. Nunc enim propior est nostra salus, quam cum credidimus."], ["12", "Nox praecessit, dies autem appropinquavit. Abjiciamus ergo opera tenebrarum, et induamur arma lucis."]], "es": [["11", "Cumplamos pues con él, y tanto más que sabemos que el tiempo insta, y que ya es hora de dispertarnos de nuestro letargo: pues estamos más cerca de nuestra salud, que cuando recibimos la fé."], ["12", "La noche está ya muy avanzada, y va á llegar el día de la eternidad. Dejemos pues las obras de las tinieblas, y revistámonos de las armas de la luz."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Christe, Fili Dei vivi,* Miserére nobis. Christe.", "℟. Qui ventúrus es in mundum.* Miserére nobis. Glória Patri. Christe."], "es": ["$℣. $Cristo, Hijo de Dios vivo, ten piedad de nosotros.", "$℟. $Cristo, Hijo de Dios vivo, ten piedad de nosotros.", "$℣. $Tú que has de venir al mundo", "$℟. $Ten piedad de nosotros.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Cristo, Hijo de Dios vivo, ten piedad de nosotros."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Velad, pues, porque no sabéis cuándo vendrá el dueño de la casa: al atardecer, a medianoche, al canto del gallo o al amanecer._", "la": null}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_Velad, pues, porque no sabéis cuándo vendrá el dueño de la casa: al atardecer, a medianoche, al canto del gallo o al amanecer._", "la": null}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Deum Patrem, qui nobis grátiam exspectándi revelatiónem Dómini nostri Iesu Christi benígne largítur, orémus dicéntes:", "– Osténde nobis, Dómine, misericórdiam tuam.", "Spíritum nostrum, Dómine, et ánimam et corpus sanctífica", "et irreprehensíbiles nos serva in Fílii tui advéntum.", "– Osténde nobis, Dómine, misericórdiam tuam.", "Fac nos hac die sancte ambuláre", "atque iuste ac pie in hoc sǽculo vívere.", "– Osténde nobis, Dómine, misericórdiam tuam.", "Da nobis Dóminum nostrum Iesum Christum indúere", "et Spíritu Sancto impléri.", "– Osténde nobis, Dómine, misericórdiam tuam.", "Concéde ut vígiles maneámus, Dómine,", "usque ad Fílii tui manifestatiónem gloriósam.", "– Osténde nobis, Dómine, misericórdiam tuam."], "es": ["Oremos a Dios Padre, que nos concede la gracia de esperar la revelación de nuestro Señor Jesucristo, y digámosle confiados:", "- Santifica, Señor, todo nuestro espíritu, alma y cuerpo, _y guárdanos sin reproche hasta el día de la venida de tu Hijo._ _Muéstranos, Señor, tu misericordia._", "- Haz que durante este día caminemos en santidad, _y llevemos una vida sobria, honrada y religiosa._ _Muéstranos, Señor, tu misericordia._", "- Ayúdanos a vestirnos del Señor Jesucristo, _y a llenarnos del Espíritu Santo._ _Muéstranos, Señor, tu misericordia._", "- Haz, Señor, que estemos preparados _el día de la manifestación gloriosa de tu Hijo._ _Muéstranos, Señor, tu misericordia._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Da, quǽsumus, omnípotens Deus, hanc tuis fidélibus voluntátem, ut, Christo tuo veniénti iustis opéribus occurréntes, eius déxteræ sociáti, regnum mereántur possidére cæléste. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Dios todopoderoso, aviva en tus fieles, al comenzar el Adviento, el deseo de salir al encuentro de Cristo, que viene, acompañados por las buenas obras, para que, colocados un día a su derecha, merezcan poseer el reino eterno. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Hija de Sion, alégrate; salta de gozo, hija de Jerusalén. Aleluya._", "la": "Iucundáre, fília Sion, et exsúlta satis fília Ierúsalem, allelúia."}}, {"kind": "psalm", "
