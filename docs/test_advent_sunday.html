 "dichosa puerta del cielo.", "", "Tomando aquel Ave", "de labios de Gabriel,", "afiánzanos en paz,", "cambiando el nombre de Eva.", "", "Suelta las cadenas de los culpables,", "trae la luz a los ciegos,", "aleja nuestros males,", "pide para nosotros todos los bienes.", "", "Muéstrate ser madre,", "reciba por ti nuestras súplicas", "quien, nacido por nosotros,", "quiso ser hijo tuyo.", "", "Virgen sin igual,", "mansa entre todas,", "líbranos de nuestras culpas", "y haznos mansos y castos.", "", "Danos una vida pura,", "prepáranos un camino seguro,", "para que, viendo a Jesús,", "nos gocemos siempre juntos.", "", "Sea la alabanza a Dios Padre,", "la gloria al altísimo Cristo,", "al Espíritu Santo,", "un mismo honor a los tres. Amén."]}}, {"id": "vexilla_regis_prodeunt", "title": "Vexilla Regis Prodeunt", "original_language": "la", "lines": {"la": ["Vexilla Regis prodeunt:", "fulget Crucis mysterium,", "qua vita mortem pertulit,", "et morte vitam protulit.", "", "Quae vulnerata lanceae", "mucrone diro, criminum", "ut nos lavaret sordibus,", "manavit unda et sanguine.", "", "Impleta sunt quae concinit", "David fideli carmine,", "dicendo nationibus:", "regnavit a ligno Deus.", "", "O Crux ave, spes unica,", "hoc Passionis tempore", "piis adauge gratiam,", "reisque dele crimina.", "", "Te, fons salutis Trinitas,", "collaudet omnis spiritus:", "quibus Crucis victoriam", "largiris, adde praemium. Amen."], "es": ["Los estandartes del Rey avanzan:", "resplandece el misterio de la Cruz,", "por la cual la Vida sufrió la muerte,", "y con la muerte produjo la vida.", "", "La cual, herida por la punta", "cruel de la lanza, para lavarnos", "de la mancha de nuestros pecados,", "manó agua y sangre.", "", "Se cumplió lo que cantó", "David en su fiel poema,", "diciendo a las naciones:", "Dios reinó desde el madero.", "", "Salve, oh Cruz, única esperanza,", "en este tiempo de la Pasión", "aumenta la gracia a los piadosos,", "y borra los pecados de los culpables.", "", "A ti, Trinidad, fuente de salvación,", "te alabe todo espíritu:", "a quienes la victoria de la Cruz", "concedes, añade la recompensa. Amén."]}}, {"id": "conditor_alme_siderum", "title": "Conditor Alme Siderum", "original_language": "la", "lines": {"la": ["Conditor alme siderum,", "aeterna lux credentium,", "Christe, redemptor omnium,", "exaudi preces supplicum.", "", "Qui condolens interitu", "mortis perire saeculum,", "salvasti mundum languidum,", "donans reis remedium.", "", "Vergente mundi vespere,", "uti sponsus de thalamo,", "egressus honestissima", "Virginis matris clausula.", "", "Cuius forti potentiae", "genu curvantur omnia;", "caelestia, terrestria", "nutu fatentur subdita.", "", "Te, Sancte, fide quaesumus,", "venture iudex saeculi,", "conserva nos in tempore", "hostis a telo perfidi.", "", "Sit, Christe, rex piissime,", "tibi Patrique gloria", "cum Spiritu Paraclito,", "in sempiterna saecula. Amen."], "es": ["Creador bondadoso de los astros,", "luz eterna de los creyentes,", "Cristo, redentor de todos,", "escucha las súplicas de los que te imploran.", "", "Tú que, apiadado de que el mundo", "pereciera en la ruina de la muerte,", "salvaste al mundo enfermo,", "dando remedio a los culpables.", "", "Cuando declinaba la tarde del mundo,", "como esposo que sale del tálamo,", "saliste del honestísimo", "seno de tu Madre Virgen.", "", "Ante cuyo fuerte poder", "se doblan todas las rodillas;", "los seres celestes y terrestres", "confiesan someterse a tu mandato.", "", "A ti, Santo, con fe te suplicamos,", "que has de venir como juez del mundo,", "consérvanos a tiempo", "libres del dardo del enemigo pérfido.", "", "Sea, oh Cristo, rey piadosísimo,", "gloria a ti y al Padre", "con el Espíritu Paráclito,", "por los siglos sempiternos. Amén."]}}, {"id": "pange_lingua_gloriosi", "title": "Pange Lingua Gloriosi Corporis Mysterium", "original_language": "la", "lines": {"la": ["Pange, lingua, gloriosi", "Corporis mysterium,", "Sanguinisque pretiosi,", "quem in mundi pretium", "fructus ventris generosi", "Rex effudit gentium.", "", "Nobis datus, nobis natus", "ex intacta Virgine,", "et in mundo conversatus,", "sparso verbi semine,", "sui moras incolatus", "miro clausit ordine.", "", "In supremae nocte cenae", "recumbens cum fratribus,", "observata lege plene", "cibis in legalibus,", "cibum turbae duodenae", "se dat suis manibus.", "", "Verbum caro, panem verum", "verbo carnem efficit:", "fitque sanguis Christi merum,", "et si sensus deficit,", "ad firmandum cor sincerum", "sola fides sufficit.", "", "Tantum ergo Sacramentum", "veneremur cernui:", "et antiquum documentum", "novo cedat ritui:", "praestet fides supplementum", "sensuum defectui.", "", "Genitori, Genitoque", "laus et iubilatio,", "salus, honor, virtus quoque", "sit et benedictio:", "procedenti ab utroque", "compar sit laudatio. Amen."], "es": ["Canta, lengua, el misterio", "del glorioso Cuerpo,", "y de la preciosa Sangre,", "que como precio del mundo,", "fruto de un vientre generoso,", "derramó el Rey de las naciones.", "", "Dado a nosotros, nacido para nosotros", "de una Virgen intacta,", "y habiendo vivido en el mundo", "sembrando la semilla de la Palabra,", "concluyó el tiempo de su estancia", "con un orden admirable.", "", "En la noche de la última cena,", "reclinado con sus hermanos,", "habiendo cumplido plenamente la ley", "en cuanto a los alimentos rituales,", "se da como alimento a los doce", "con sus propias manos.", "", "El Verbo hecho carne, con su palabra", "convierte en carne el pan verdadero:", "y el vino se hace sangre de Cristo,", "y si los sentidos no alcanzan,", "para afirmar el corazón sincero", "basta sólo la fe.", "", "Un Sacramento tan grande", "veneremos, pues, inclinados:", "y ceda el antiguo precepto", "al nuevo rito:", "que la fe supla", "lo que falta a los sentidos.", "", "Al Engendrador y al Engendrado", "sea la alabanza y el júbilo,", "la salud, el honor y también el poder", "y la bendición:", "y al que procede de ambos", "sea dada igual alabanza. Amén."]}}, {"id": "deus_tuorum_militum", "title": "Deus Tuorum Militum", "original_language": "la", "lines": {"la": ["Deus tuorum militum", "sors, et corona, praemium,", "laudes canentes Martyris", "absolve nexu criminis.", "", "Hic nempe mundi gaudia", "et blandimenta noxia", "caduca rite deputans,", "pervenit ad caelestia.", "", "Poenas cucurrit fortiter", "et sustulit viriliter,", "fundensque pro te sanguinem,", "aeterna dona possidet.", "", "Ob hoc precatu supplici", "te poscimus, piissime;", "in hoc triumpho Martyris", "dimitte noxam servulis.", "", "Laus et perennis gloria", "Deo Patri et Filio,", "Sancto simul Paraclito,", "in sempiterna saecula. Amen."], "es": ["Dios, suerte, corona y premio", "de tus soldados,", "a nosotros, que cantamos las alabanzas del Mártir,", "líbranos del lazo del pecado.", "", "Éste, en verdad, teniendo por caducos", "los gozos del mundo", "y sus dañinas seducciones,", "llegó a los bienes celestiales.", "", "Corrió fuertemente hacia las penas", "y las soportó con valentía,", "y derramando su sangre por ti,", "posee ahora los dones eternos.", "", "Por esto, con súplica humilde", "te lo pedimos, piadosísimo;", "en este triunfo del Mártir,", "perdona la culpa a tus siervos.", "", "Alabanza y gloria perpetua", "a Dios Padre y al Hijo,", "juntamente al Espíritu Santo Paráclito,", "por los siglos sempiternos. Amén."]}}, {"id": "o_lux_beata_trinitas", "title": "O Lux Beata Trinitas", "original_language": "la", "lines": {"la": ["O lux beata Trinitas,", "et principalis Unitas,", "iam sol recedit igneus:", "infunde lumen cordibus.", "", "Te mane laudum carmine,", "te deprecemur vespere:", "te nostra supplex gloria", "per cuncta laudet saecula.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Oh luz bienaventurada, Trinidad,", "y Unidad primera,", "ya el sol ígneo se retira:", "infunde tu luz en los corazones.", "", "A ti te alabemos por la mañana con cánticos,", "a ti te supliquemos al atardecer:", "que nuestra súplica te glorifique", "por todos los siglos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y para siempre. Amén."]}}, {"id": "exsultet_caelum_laudibus", "title": "Exsultet Caelum Laudibus", "original_language": "la", "lines": {"la": ["Exsultet caelum laudibus,", "resultet terra gaudiis,", "Apostolorum gloriam", "sacra canunt sollemnia.", "", "Vos, saecli iusti iudices", "et vera mundi lumina,", "votis precamur cordium:", "audite preces supplicum.", "", "Qui caelum verbo clauditis", "serasque eius solvitis,", "nos a peccatis omnibus", "solvite iussu, quaesumus.", "", "Quorum praecepto subditur", "salus et languor omnium,", "sanate mentes languidas,", "augete nos virtutibus.", "", "Ut, cum iudex advenerit", "Christus in fine saeculi,", "nos sempiterni gaudii", "faciat esse compotes.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "nunc et per omne saeculum. Amen."], "es": ["Exulte el cielo con alabanzas,", "resuene la tierra con gozos,", "la sagrada solemnidad canta", "la gloria de los Apóstoles.", "", "A vosotros, justos jueces del mundo", "y verdaderas luces del orbe,", "os rogamos con los votos de nuestros corazones:", "escuchad las preces de los suplicantes.", "", "Vosotros que con la palabra cerráis el cielo", "y desatáis sus cerrojos,", "libradnos de todos los pecados,", "os lo rogamos, por vuestro mandato.", "", "A cuyo mandato está sometida", "la salud y la enfermedad de todos,", "sanad nuestras mentes enfermas,", "aumentadnos en virtudes.", "", "Para que, cuando venga como juez", "Cristo al final de los siglos,", "nos haga partícipes", "del gozo sempiterno.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por todos los siglos. Amén."]}}, {"id": "iste_confessor", "title": "Iste Confessor", "original_language": "la", "lines": {"la": ["Iste confessor Domini, colentes", "quem pie laudant populi per orbem,", "hac die laetus meruit supremos", "laudis honores.", "", "Qui pius, prudens, humilis, pudicus,", "sobriam duxit sine labe vitam,", "donec humanos animavit aurae", "spiritus artus.", "", "Cuius ob praestans meritum, frequenter,", "aegra quae passim iacuere membra,", "viribus morbi domitis, saluti", "restituuntur.", "", "Noster hinc illi chorus obsequentem", "concinit laudem celebresque palmas,", "ut piis eius meritis iuvemur", "omne per aevum.", "", "Sit salus illi, decus atque virtus,", "qui, supra caeli residens cacumen,", "totius mundi seriem gubernat,", "trinus et unus. Amen."], "es": ["Este confesor del Señor, a quien", "los pueblos veneran piadosamente por todo el orbe,", "mereció alegre en este día los sumos", "honores de alabanza.", "", "El cual, piadoso, prudente, humilde y casto,", "llevó una vida sobria sin mancha,", "mientras el aliento de vida animó", "sus miembros humanos.", "", "Por cuyo excelente mérito, con frecuencia,", "los miembros enfermos que yacían por doquier,", "vencidas las fuerzas de la enfermedad, a la salud", "son restituidos.", "", "Por esto, nuestro coro le canta", "una alabanza obsequiosa y célebres palmas,", "para que por sus piadosos méritos seamos ayudados", "por toda la eternidad.", "", "Sea para él la salud, el honor y el poder,", "que, sentado sobre la cumbre del cielo,", "gobierna el curso de todo el mundo,", "trino y uno. Amén."]}}, {"id": "lucis_creator_optime", "title": "Lucis Creator Optime", "original_language": "la", "lines": {"la": ["Lucis Creator optime,", "lucem dierum proferens,", "primordiis lucis novae", "mundi parans originem;", "", "Qui mane iunctum vesperi", "diem vocari praecipis:", "taetrum chaos illabitur,", "audi preces cum fletibus.", "", "Ne mens gravata crimine", "vitae sit exsul munere,", "dum nil perenne cogitat", "seseque culpis illigat.", "", "Caeleste pulset ostium,", "vitale tollat praemium;", "vitemus omne noxium,", "purgemus omne pessimum.", "", "Praesta, Pater piissime,", "Patrique compar Unice,", "cum Spiritu Paraclito", "regnans per omne saeculum. Amen."], "es": ["Óptimo Creador de la luz,", "que produces la luz de los días,", "y en los primeros albores de la nueva luz", "preparaste el origen del mundo;", "", "Tú que mandas que se llame día", "a la mañana unida con la tarde:", "el horrible caos se desliza sobre nosotros,", "escucha nuestras preces con llanto.", "", "Que nuestra mente, cargada de pecado,", "no quede excluida del don de la vida,", "mientras no piensa en nada eterno", "y se enreda a sí misma en culpas.", "", "Que llame a la puerta celestial,", "que alcance el premio de la vida;", "evitemos todo lo dañino,", "purguemos todo lo pésimo.", "", "Concédelo, Padre piadosísimo,", "y también tú, Unigénito igual al Padre,", "que reinas con el Espíritu Paráclito", "por todos los siglos. Amén."]}}], "lauds": [{"id": "iste_confessor", "title": "Iste Confessor", "original_language": "la", "lines": {"la": ["Iste confessor Domini, colentes", "quem pie laudant populi per orbem,", "hac die laetus meruit supremos", "laudis honores.", "", "Qui pius, prudens, humilis, pudicus,", "sobriam duxit sine labe vitam,", "donec humanos animavit aurae", "spiritus artus.", "", "Cuius ob praestans meritum, frequenter,", "aegra quae passim iacuere membra,", "viribus morbi domitis, saluti", "restituuntur.", "", "Noster hinc illi chorus obsequentem", "concinit laudem celebresque palmas,", "ut piis eius meritis iuvemur", "omne per aevum.", "", "Sit salus illi, decus atque virtus,", "qui, supra caeli residens cacumen,", "totius mundi seriem gubernat,", "trinus et unus. Amen."], "es": ["Este confesor del Señor, a quien", "los pueblos veneran piadosamente por todo el orbe,", "mereció alegre en este día los sumos", "honores de alabanza.", "", "El cual, piadoso, prudente, humilde y casto,", "llevó una vida sobria sin mancha,", "mientras el aliento de vida animó", "sus miembros humanos.", "", "Por cuyo excelente mérito, con frecuencia,", "los miembros enfermos que yacían por doquier,", "vencidas las fuerzas de la enfermedad, a la salud", "son restituidos.", "", "Por esto, nuestro coro le canta", "una alabanza obsequiosa y célebres palmas,", "para que por sus piadosos méritos seamos ayudados", "por toda la eternidad.", "", "Sea para él la salud, el honor y el poder,", "que, sentado sobre la cumbre del cielo,", "gobierna el curso de todo el mundo,", "trino y uno. Amén."]}}, {"id": "ut_queant_laxis", "title": "Ut Queant Laxis", "original_language": "la", "lines": {"la": ["Ut queant laxis", "resonare fibris", "mira gestorum", "famuli tuorum,", "solve polluti", "labii reatum,", "Sancte Ioannes.", "", "Nuntius celso veniens Olympo,", "te patri magnum fore nasciturum,", "nomen, et vitae seriem gerendae", "ordine promit.", "", "Ille promissi dubius superni,", "perdidit promptae modulos loquelae:", "sed reformasti genitus peremptae", "organa vocis.", "", "Ventris obstruso positus cubili", "senseras Regem thalamo manentem:", "hinc parens nati meritis uterque", "abdita pandit.", "", "Sit decus Patri, genitaeque Proli,", "et tibi compar utriusque semper", "Spiritus alme, Deus unus, omni", "tempore saecli. Amen."], "es": ["Para que puedan", "resonar con voces desatadas", "las maravillas de las hazañas", "de tus siervos,", "libra de culpa", "nuestros labios manchados,", "san Juan.", "", "Un mensajero, viniendo del alto cielo,", "anuncia a tu padre que ibas a nacer grande,", "y revela en orden tu nombre", "y el curso de la vida que llevarías.", "", "Él, dudando de la promesa celestial,", "perdió el uso pronto de la palabra:", "pero tú, ya nacido, restauraste", "los órganos de su voz perdida.", "", "Colocado en el cerrado lecho del vientre,", "sentiste al Rey que permanecía en su tálamo:", "de ahí que ambos padres, por los méritos del hijo,", "revelan lo oculto.", "", "Sea la gloria al Padre, y al Hijo engendrado,", "y a ti, igual a ambos siempre,", "Espíritu bondadoso, Dios uno, por todo", "el tiempo del siglo. Amén."]}}, {"id": "veni_creator_spiritus", "title": "Veni Creator Spiritus", "original_language": "la", "lines": {"la": ["Veni, Creator Spiritus,", "mentes tuorum visita,", "imple superna gratia", "quae tu creasti pectora.", "", "Qui diceris Paraclitus,", "altissimi donum Dei,", "fons vivus, ignis, caritas,", "et spiritalis unctio.", "", "Tu septiformis munere,", "digitus paternae dexterae,", "tu rite promissum Patris,", "sermone ditans guttura.", "", "Accende lumen sensibus,", "infunde amorem cordibus,", "infirma nostri corporis", "virtute firmans perpeti.", "", "Hostem repellas longius,", "pacemque dones protinus;", "ductore sic te praevio", "vitemus omne noxium.", "", "Per te sciamus da Patrem,", "noscamus atque Filium;", "teque utriusque Spiritum", "credamus omni tempore.", "", "Deo Patri sit gloria,", "et Filio, qui a mortuis", "surrexit, ac Paraclito,", "in saeculorum saecula. Amen."], "es": ["Ven, Espíritu Creador,", "visita las mentes de los tuyos,", "llena de gracia celestial", "los pechos que Tú creaste.", "", "Tú, que eres llamado Paráclito,", "don del Dios altísimo,", "fuente viva, fuego, caridad,", "y unción espiritual.", "", "Tú, séptuple en tus dones,", "dedo de la diestra del Padre,", "tú, la promesa fielmente hecha por el Padre,", "que enriqueces las gargantas con la palabra.", "", "Enciende la luz en nuestros sentidos,", "infunde el amor en nuestros corazones,", "y las debilidades de nuestro cuerpo", "fortalécelas con virtud perpetua.", "", "Rechaza lejos al enemigo,", "y danos pronto la paz;", "así, contigo como guía,", "evitemos todo mal.", "", "Concédenos conocer por ti al Padre,", "y también conocer al Hijo;", "y a ti, Espíritu de ambos,", "creamos en todo tiempo.", "", "Gloria sea a Dios Padre,", "y al Hijo, que de entre los muertos", "resucitó, y al Paráclito,", "por los siglos de los siglos. Amén."]}}, {"id": "aeterne_rerum_conditor", "title": "Aeterne Rerum Conditor", "original_language": "la", "lines": {"la": ["Aeterne rerum Conditor,", "noctem diemque qui regis,", "et temporum das tempora,", "ut alleves fastidium;", "", "Praeco diei iam sonat,", "noctis profundae excubitor,", "nocturna lux viantibus", "a nocte noctem segregans.", "", "Hoc excitatus Lucifer", "solvit polum caligine;", "hoc omnis erronum cohors", "vias nocendi deserit.", "", "Iesu, labentes respice,", "et nos videndo corrige;", "si respicis, lapsus cadunt,", "fletuque culpa solvitur.", "", "Tu, lux, refulge sensibus,", "somnumque mentis discute;", "te nostra vox primum sonet,", "et vota solvamus tibi.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "nunc et per omne saeculum. Amen."], "es": ["Eterno Creador de todas las cosas,", "que riges la noche y el día,", "y das los tiempos a los tiempos,", "para aliviar nuestro hastío;", "", "Ya suena el heraldo del día,", "centinela de la profunda noche,", "luz nocturna para los caminantes,", "que separa la noche de la noche.", "", "Al oírlo, el Lucero", "libra al cielo de su oscuridad;", "al oírlo, toda hueste de malhechores", "abandona sus caminos de hacer daño.", "", "Jesús, mira a los que caen,", "y corrígenos mirándonos;", "si tú miras, las caídas cesan,", "y la culpa se disuelve con el llanto.", "", "Tú, luz, resplandece en nuestros sentidos,", "y disipa el sueño de la mente;", "que nuestra voz te cante primero a ti,", "y cumplamos para ti nuestros votos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por todos los siglos. Amén."]}}, {"id": "ecce_iam_noctis", "title": "Ecce Jam Noctis", "original_language": "la", "lines": {"la": ["Ecce iam noctis tenuatur umbra,", "lucis aurora rutilans coruscat;", "nisibus totis rogitemus omnes", "Cunctipotentem,", "", "Ut Deus, nostri miseratus, omnem", "pellat languorem, tribuat salutem,", "donet et nobis pietate patris", "regna polorum.", "", "Praestet hoc nobis Deitas beata", "Patris ac Nati, pariterque Sancti", "Spiritus, cuius resonat per omnem", "gloria mundum. Amen."], "es": ["He aquí que ya se adelgaza la sombra de la noche,", "y brilla resplandeciente la aurora de la luz;", "roguemos todos con todo empeño", "al Todopoderoso,", "", "Para que Dios, apiadado de nosotros,", "aleje toda enfermedad y conceda la salud,", "y nos dé, con piedad de padre,", "los reinos celestiales.", "", "Concédanos esto la bienaventurada Deidad", "del Padre y del Hijo, y también del Santo", "Espíritu, cuya gloria resuena", "por todo el mundo. Amén."]}}], "compline": [{"id": "te_lucis_ante_terminum", "title": "Te Lucis Ante Terminum", "original_language": "la", "lines": {"la": ["Te lucis ante terminum,", "rerum creator, poscimus,", "ut pro tua clementia", "sis praesul et custodia.", "", "Procul recedant somnia", "et noctium phantasmata;", "hostemque nostrum comprime,", "ne polluantur corpora.", "", "Praesta, Pater omnipotens,", "per Iesum Christum Dominum,", "qui tecum in perpetuum", "regnat cum Sancto Spiritu. Amen."], "es": ["Antes de que acabe la luz,", "te pedimos, Creador de todas las cosas,", "que por tu clemencia", "seas nuestro guardián y custodia.", "", "Aléjense lejos los sueños", "y los fantasmas de la noche;", "reprime a nuestro enemigo,", "para que nuestros cuerpos no se manchen.", "", "Concédenos esto, Padre omnipotente,", "por Jesucristo el Señor,", "que contigo por siempre", "reina con el Espíritu Santo. Amén."]}}, {"id": "christe_qui_lux_es_et_dies", "title": "Christe, Qui Lux Es Et Dies", "original_language": "la", "lines": {"la": ["Christe, qui lux es et dies,", "noctis tenebras detegis,", "lucisque lumen crederis,", "lumen beatum praedicans.", "", "Precamur, sancte Domine,", "defende nos in hac nocte,", "sit nobis in te requies,", "quietam noctem tribue.", "", "Ne gravis somnus irruat,", "nec hostis nos surripiat,", "nec caro illi consentiens,", "nos tibi reos statuat.", "", "Oculi somnum capiant,", "cor semper ad te vigilet,", "dextera tua protegat", "famulos qui te diligunt.", "", "Defensor noster, aspice,", "insidiantes reprime,", "guberna tuos famulos,", "quos sanguine mercatus es.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Cristo, que eres luz y día,", "que descubres las tinieblas de la noche,", "y eres proclamado la luz de la luz,", "anunciando la luz bienaventurada.", "", "Te suplicamos, santo Señor,", "defiéndenos en esta noche,", "sea en ti nuestro descanso,", "concédenos una noche tranquila.", "", "Que no nos asalte un sueño pesado,", "ni el enemigo nos sorprenda,", "ni la carne, consintiendo con él,", "nos declare culpables ante ti.", "", "Que los ojos tomen el sueño,", "pero el corazón vele siempre hacia ti,", "que tu diestra proteja", "a los siervos que te aman.", "", "Defensor nuestro, mira,", "reprime a los que nos acechan,", "gobierna a tus siervos,", "a quienes compraste con tu sangre.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por siempre. Amén."]}}, {"id": "o_lux_beata_trinitas", "title": "O Lux Beata Trinitas", "original_language": "la", "lines": {"la": ["O lux beata Trinitas,", "et principalis Unitas,", "iam sol recedit igneus:", "infunde lumen cordibus.", "", "Te mane laudum carmine,", "te deprecemur vespere:", "te nostra supplex gloria", "per cuncta laudet saecula.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Oh luz bienaventurada, Trinidad,", "y Unidad primera,", "ya el sol ígneo se retira:", "infunde tu luz en los corazones.", "", "A ti te alabemos por la mañana con cánticos,", "a ti te supliquemos al atardecer:", "que nuestra súplica te glorifique", "por todos los siglos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y para siempre. Amén."]}}]}, "dates": {"2026-11-26": {"date_human": {"en": "Thursday, November 26, 2026", "es": "Jueves, 26 de noviembre de 2026", "la": "Feria V, die 26 Novembris, anno 2026"}, "day_description": {"en": "Thursday in the 34<sup>th</sup> Week in Ordinary Time (Psalter week 2)", "es": "Jueves de la 34.<sup>a</sup> semana del Tiempo Ordinario (semana 2 del salterio)", "la": "Feria V infra hebdomadam XXXIV per annum (hebdomada psalterii II)"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Excita, Domine, potentiam tuam, ut salvos facias nos.", "es": "Despierta, Señor, tu poder, y ven a salvarnos."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 79", "content": {"la": [["1", "In finem, pro iis qui commutabuntur. Testimonium Asaph, psalmus."], ["2", "Qui regis Israel, intende; qui deducis velut ovem Joseph. Qui sedes super cherubim, manifestare"], ["3", "coram Ephraim, Benjamin, et Manasse. Excita potentiam tuam, et veni, ut salvos facias nos."], ["4", "Deus converte nos, et ostende faciem tuam, et salvi erimus."], ["5", "Domine Deus virtutum, quousque irasceris super orationem servi tui?"], ["6", "Cibabis nos pane lacrimarum, et potum dabis nobis in lacrimis in mensura?"], ["7", "Posuisti nos in contradictionem vicinis nostris, et inimici nostri subsannaverunt nos."], ["8", "Deus virtutum, converte nos, et ostende faciem tuam, et salvi erimus."], ["9", "Vineam de Aegypto transtulisti, et ejecisti gentes, et plantasti eam."], ["10", "Dux itineris fuisti in conspectu ejus; plantasti radices ejus, et implevit terram."], ["11", "Operuit montes umbra ejus, et arbusta ejus cedros Dei."], ["12", "Extendit palmites suos usque ad mare, et usque ad flumen propagines ejus."], ["13", "Ut quid destruxisti maceriam ejus, et vindemiant eam omnes qui praetergrediuntur viam?"], ["14", "Exterminavit eam aper de silva, et singularis ferus depastus est eam."], ["15", "Deus virtutum, convertere, respice de caelo, et vide, et visita vineam istam;"], ["16", "et perfice eam quam plantavit dextera tua, et super filium hominis quem confirmasti tibi."], ["17", "Incensa igni et suffossa, ab increpatione vultus tui peribunt."], ["18", "Fiat manus tua super virum dexterae tuae, et super filium hominis quem confirmasti tibi."], ["19", "Et non discedimus a te; vivificabis nos, et nomen tuum invocabimus."], ["20", "Domine Deus virtutum, converte nos, et ostende faciem tuam, et salvi erimus."]], "es": [["2", "Escucha, ¡oh tú, pastor de Israel!, tú que apacientas el pueblo de José, como a ovejas. Tú que estás sentado sobre los querubines, manifiéstate,"], ["3", "delante de Efraín, de Benjamín y de Manasés. Ostenta tu poder, y ven a salvarnos."], ["4", "¡Oh Dios!, conviértenos a ti, y muéstranos favorable tu semblante; y seremos salvos."], ["5", "¡Oh Señor Dios de los ejércitos!, ¿hasta cuándo estarás enojado sin escuchar la oración de tu siervo?"], ["6", "¿Hasta cuándo nos has de alimentar con pan de lágrimas, y hasta cuándo nos darás a beber lágrimas con abundancia?"], ["7", "Nos haces el blanco de la contradicción de nuestros vecinos; y nuestros enemigos hacen mofa de nosotros."], ["8", "¡Oh Dios de los ejércitos!, conviértenos a ti, y muéstranos tu rostro, y seremos salvos."], ["9", "De Egipto trasladaste acá tu viña; arrojaste las naciones, y la plantaste."], ["10", "Fuiste delante de ella en el viaje, para irla guiando; la hiciste arraigar, y llenó la tierra."], ["11", "Cubrió con su sombra los montes, y los altísimos cedros con sus sarmientos."], ["12", "Hasta el mar extendió sus pámpanos, y hasta el río sus vástagos."], ["13", "¿Por qué has derribado su cerca, y dejas que la vendimien todos los caminantes?"], ["14", "El jabalí del bosque la ha destruido, y se apacienta en ella esa fiera solitaria."], ["15", "¡Oh Dios de los ejércitos! vuélvete hacia nosotros, mira desde el cielo, y atiende y visita esa viña."], ["16", "Renuévala, pues la plantó tu diestra; y en atención al hijo del hombre, a quien tú te escogiste."], ["17", "Ella ha sido entregada a las llamas y desarraigada; mas con un ceño de tu semblante perecerán todos tus enemigos."], ["18", "Tiende tu mano protectora sobre el varón de tu diestra, sobre el hijo del hombre a quien tú escogiste."], ["19", "Entonces no nos apartaremos de ti; nos darás nueva vida, e invocaremos tu Nombre."], ["20", "¡Oh Señor Dios de los ejércitos!, conviértenos a ti, y muéstranos tu rostro, y seremos salvos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Excita, Domine, potentiam tuam, ut salvos facias nos.", "es": "Despierta, Señor, tu poder, y ven a salvarnos."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Magnifice fecit Dominus, annuntiate hoc in universa terra.", "es": "Grandes cosas ha hecho el Señor, anunciadlo por toda la tierra."}}, {"kind": "psalm", "label": "canticle", "ref": "Isa 12:1-6", "content": {"la": [["1", "Et dices in die illa : Confitebor tibi, Domine, quoniam iratus es mihi; conversus est furor tuus, et consolatus es me."], ["2", "Ecce Deus salvator meus; fiducialiter agam, et non timebo : quia fortitudo mea et laus mea Dominus, et factus est mihi in salutem."], ["3", "Haurietis aquas in gaudio de fontibus salvatoris."], ["4", "Et dicetis in die illa : Confitemini Domino et invocate nomen ejus; notas facite in populis adinventiones ejus; mementote quoniam excelsum est nomen ejus."], ["5", "Cantate Domino, quoniam magnifice fecit; annuntiate hoc in universa terra."], ["6", "Exsulta et lauda, habitatio Sion, quia magnus in medio tui Sanctus Israel."]], "es": [["1", "Y dirás en aquel dia: Te daré alabanza, oh Señor, porque estabas enojado conmigo, y se alejó tu furor, y me has consolado."], ["2", "Hé aquí que Dios es el salvador mió: viviré lleno de confianza, y no ' temeré: porque mi fortaleza y mi gloria es el Señor, y él ha tomado por su cuenta mi salvación."], ["3", "Sacaréis agua con gozo de las fuentes del Salvador ';"], ["4", "y diréis en aquel dia: Dad gracias al Señor, é invocad su nombre: anunciad á las gentes sus de - signios: acordaos que es excelso su nombre."], ["5", "Tributad alabanzas al Señor, porque ha hecho cosas grandes y magvijicas: divulgad estopor toda la tierra."], ["6", "Salta de gozo y entona himnos de alabanza, casa de Sion ': pues que se muestra grande en medio de tí el Santo de Israel. Babylonia será arrumada por los medos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Magnifice fecit Dominus, annuntiate hoc in universa terra.", "es": "Grandes cosas ha hecho el Señor, anunciadlo por toda la tierra."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Lauda, Ierusalem, Dominum.", "es": "Alaba, Jerusalén, al Señor."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 80", "content": {"la": [["1", "In finem. Pro torcularibus. Psalmus ipsi Asaph."], ["2", "Exsultate Deo adjutori nostro, jubilate Deo Jacob."], ["3", "Sumite psalmum, et date tympanum; psalterium jucundum, cum cithara."], ["4", "Buccinate in neomenia tuba, in insigni die solemnitatis vestrae;"], ["5", "quia praeceptum in Israel est, et judicium Deo Jacob."], ["6", "Testimonium in Joseph posuit illud, cum exiret de terra Aegypti; linguam quam non noverat audivit."], ["7", "Divertit ab oneribus dorsum ejus; manus ejus in cophino servierunt."], ["8", "In tribulatione invocasti me, et liberavi te. Exaudivi te in abscondito tempestatis; probavi te apud aquam contradictionis."], ["9", "Audi, populus meus, et contestabor te. Israel, si audieris me,"], ["10", "non erit in te deus recens, neque adorabis deum alienum."], ["11", "Ego enim sum Dominus Deus tuus, qui eduxi te de terra Aegypti. Dilata os tuum, et implebo illud."], ["12", "Et non audivit populus meus vocem meam, et Israel non intendit mihi."], ["13", "Et dimisi eos secundum desideria cordis eorum; ibunt in adinventionibus suis."], ["14", "Si populus meus audisset me, Israel si in viis meis ambulasset,"], ["15", "pro nihilo forsitan inimicos eorum humiliassem, et super tribulantes eos misissem manum meam."], ["16", "Inimici Domini mentiti sunt ei, et erit tempus eorum in saecula."], ["17", "Et cibavit eos ex adipe frumenti, et de petra melle saturavit eos."]], "es": [["2", "Regocijaos, alabando a Dios nuestro protector; celebrad con júbilo al Dios de Jacob."], ["3", "Entonad salmos, tocad el pandero; el armonioso salterio junto con la cítara."], ["4", "Tocad las trompetas el Novilunio, el gran día de vuestra solemnidad."], ["5", "Pues es un precepto dado a Israel, y un rito instituido por el Dios de Jacob."], ["6", "Le impuso para que sirviese de memoria a los descendientes de José, al salir de la tierra de Egipto, cuando oyeron una lengua que no entendían."], ["7", "Libertó sus hombros de las cargas, y sus manos de las espuertas con que servían en las obras."], ["8", "En la turbación, dice el Señor, me invocaste, y yo te libré; te oí benigno en la oscuridad de la tormenta; hice prueba de ti junto a las aguas de la contradicción."], ["9", "Escucha, pueblo mío, y yo te instruiré. ¡Oh Israel!, si quieres obedecerme,"], ["10", "no habrá en tu distrito dios nuevo; no adoraréis a dioses ajenos."], ["11", "Porque yo soy el Señor Dios tuyo, que te saqué de la tierra de Egipto; abre bien tu boca, que yo te saciaré plenamente."], ["12", "Pero mi pueblo no quiso escuchar la voz mía; los hijos de Israel no quisieron obedecerme."], ["13", "Y así los abandoné, dejándolos ir en pos de los deseos de su corazón, y seguir sus devaneos."], ["14", "¡Ah si mi pueblo me hubiese oído a mí, si hubiesen seguido los hijos de Israel por mis caminos!"], ["15", "Como quien no hace nada, hubiera yo seguramente humillado a sus enemigos, y descargado mi mano sobre sus perseguidores."], ["16", "Pero, hechos enemigos del Señor, le faltaron a la promesa; y el tiempo de ellos, o su suplicio, será eterno."], ["17", "Sin embargo, los sustentó con riquísimo trigo, y los sació con la miel que destilaban las peñas."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Lauda, Ierusalem, Dominum.", "es": "Alaba, Jerusalén, al Señor."}}, {"kind": "psalm", "label": "reading", "ref": "rom 14:17-19", "content": {"la": [["17", "Non est enim regnum Dei esca et potus : sed justitia, et pax, et gaudium in Spiritu Sancto :"], ["18", "qui enim in hoc servit Christo, placet Deo, et probatus est hominibus."], ["19", "Itaque quae pacis sunt, sectemur : et quae aedificationis sunt, in invicem custodiamus."]], "es": [["17", "Que no consiste el reino de Dios en el comer, 1 £s. XLV. V."], ["18", "pues el que asi sirve á Christo, agrada á Dios, y tiene la aprobación de los hombres."], ["19", "En suma, procuremos las cosas que contribuyen á la paz; y observemos las que pueden servir á nuestra mutua edificación."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. In matutínis, Dómine,* Meditábor de te. In matutínis.", "℟. Quia factus es adiútor meus.* Meditábor de te. Glória Patri. In matutínis."], "es": ["$℣. $Velando medito en ti, Señor.", "$℟. $Velando medito en ti, Señor.", "$℣. $Porque fuiste mi auxilio.", "$℟. $Medito en ti, Señor.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Velando medito en ti, Señor."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Per viscera misericordiae Dei nostri, visitavit nos oriens ex alto.", "es": "Por la entrañable misericordia de nuestro Dios, nos visitó el sol naciente de lo alto."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Per viscera misericordiae Dei nostri, visitavit nos oriens ex alto.", "es": "Por la entrañable misericordia de nuestro Dios, nos visitó el sol naciente de lo alto."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Benedíctus Deus, Pater noster, qui fílios suos prótegit neque preces spernit eórum. Omnes humíliter eum implorémus orántes:", "– Illúmina óculos nostros, Dómine.", "Grátias tibi, Dómine, quia per Fílium tuum nos illuminásti,", "eius luce per longitúdinem diéi nos satiári concéde.", "– Illúmina óculos nostros, Dómine.", "Sapiéntia tua, Dómine, dedúcat nos hódie,", "ut in novitáte vitæ ambulémus.", "– Illúmina óculos nostros, Dómine.", "Præsta nobis advérsa pro te fórtiter sustinére,", "ut corde magno tibi iúgiter serviámus.", "– Illúmina óculos nostros, Dómine.", "Dírige in nobis hódie cogitatiónes, sensus et ópera,", "ut tibi providénti dóciles obsequámur.", "– Illúmina óculos nostros, Dómine."], "es": ["Bendito sea Dios, nuestro Padre, que mira siempre con amor a sus hijos y nunca desatiende sus súplicas;  digámosle con humildad:", "- Te damos gracias, Señor, porque nos has alumbrado con la luz de Jesucristo; _que esta claridad ilumine hoy todos nuestros actos._ _Ilumina nuestros ojos, Señor._", "- Que tu sabiduría nos guíe en nuestra jornada; _así andaremos en una vida nueva._ _Ilumina nuestros ojos, Señor._", "- Que tu amor nos haga superar con fortaleza las adversidades, _para que te sirvamos con generosidad de espíritu._ _Ilumina nuestros ojos, Señor._", "- Dirige y santifica nuestros pensamientos, palabras y obras en este día, _y danos un espíritu dócil a tus inspiraciones._ _Ilumina nuestros ojos, Señor._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Omnipotens sempiterne Deus, qui in dilecto Filio tuo, universorum Rege, omnia instaurare voluisti, concede propitius, ut tota creatura, a servitute liberata, tu« maiestati deserviat ac te sine fine collaudet.", "es": "Humildemente te pedimos a ti, Señor, que eres la luz verdadera y la fuente misma de toda luz, que, meditando fielmente tu ley, vivamos siempre en tu claridad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Inclinavit Dominus aurem suam mihi.", "es": "El Señor inclinó su oído hacia mí."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 71:2-11", "content": {"la": [["2", "Deus, judicium tuum regi da, et justitiam tuam filio regis; judicare populum tuum in justitia, et pauperes tuos in judicio."], ["3", "Suscipiant montes pacem populo, et colles justitiam."], ["4", "Judicabit pauperes populi, et salvos faciet filios pauperum, et humiliabit calumniatorem."], ["5", "Et permanebit cum sole, et ante lunam, in generatione et generationem."], ["6", "Descendet sicut pluvia in vellus, et sicut stillicidia stillantia super terram."], ["7", "Orietur in diebus ejus justitia, et abundantia pacis, donec auferatur luna."], ["8", "Et dominabitur a mari usque ad mare, et a flumine usque ad terminos orbis terrarum."], ["9", "Coram illo procident Aethiopes, et inimici ejus terram lingent."], ["10", "Reges Tharsis et insulae munera offerent; reges Arabum et Saba dona adducent;"], ["11", "et adorabunt eum omnes reges terrae, omnes gentes servient ei."]], "es": [["2", "a fin de que él juzgue con rectitud a tu pueblo y a tus pobres según la equidad."], ["3", "Reciban del cielo los montes la paz para el pueblo, y reciban los collados la justicia."], ["4", "El hará justicia a los pobres o afligidos del pueblo, y pondrá a salvo los hijos de los pobres, y humillará al calumniador."], ["5", "Y permanecerá como el sol y la luna, de generación en generación."], ["6", "Descenderá como la lluvia sobre el vellocino de lana, y como rocío copioso sobre la tierra."], ["7", "Florecerá en sus días la justicia y la abundancia de paz, hasta que deje de existir la luna."], ["8", "Y dominará de un mar a otro, y desde el río hasta el extremo de la tierra."], ["9", "Se postrarán a sus pies los etíopes, y lamerán el suelo ante él sus enemigos."], ["10", "Los reyes de Tarsis y los de las islas le ofrecerán regalos; le traerán presentes los reyes de Arabia y de Saba."], ["11", "Lo adorarán todos los reyes de la tierra, todas las naciones le rendirán homenaje."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Inclinavit Dominus aurem suam mihi.", "es": "El Señor inclinó su oído hacia mí."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Auxilium meum a Domino, qui fecit caelum et terram.", "es": "Mi auxilio viene del Señor, que hizo el cielo y la tierra."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 71:12-19", "content": {"la": [["12", "Quia liberabit pauperem a potente, et pauperem cui non erat adjutor."], ["13", "Parcet pauperi et inopi, et animas pauperum salvas faciet."], ["14", "Ex usuris et iniquitate redimet animas eorum, et honorabile nomen eorum coram illo."], ["15", "Et vivet, et dabitur ei de auro Arabiae; et adorabunt de ipso semper, tota die benedicent ei."], ["16", "Et erit firmamentum in terra in summis montium; superextolletur super Libanum fructus ejus, et florebunt de civitate sicut foenum terrae."], ["17", "Sit nomen ejus benedictum in saecula; ante solem permanet nomen ejus. Et benedicentur in ipso omnes tribus terrae; omnes gentes magnificabunt eum."], ["18", "Benedictus Dominus, Deus Israel, qui facit mirabilia solus."], ["19", "Et benedictum nomen majestatis ejus in aeternum, et replebitur majestate ejus omnis terra. Fiat, fiat."]], "es": [["12", "Porque librará del poderoso al pobre, y al desvalido que no tiene quien le valga."], ["13", "Se apiadará del pobre y del desvalido; y pondrá a salvo las almas de los pobres."], ["14", "Las libertará de la usura y de la iniquidad de los ricos; y será apreciable a sus ojos el nombre de los pobres."], ["15", "Y vivirá y le presentarán el oro de la Arabia; y le adorarán siempre; todo el día le llenarán de bendiciones."], ["16", "Y en su tierra aun en la cima de los montes habrá sustento; se verán sus frutos en la cumbre del Líbano, y se multiplicarán en la ciudad como la hierba en los prados."], ["17", "Bendito sea su Nombre por los siglos de los siglos: Nombre que existe antes que el sol. Y serán benditos en él todos los pueblos de la tierra; todas las naciones le glorificarán."], ["18", "Bendito sea el Señor Dios de Israel, sólo él hace maravillas."], ["19", "Y bendito sea el nombre de su majestad eternamente. De su majestad y gloria quedará llena toda la tierra. ¡Amén! ¡Amén!"]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Auxilium meum a Domino, qui fecit caelum et terram.", "es": "Mi auxilio viene del Señor, que hizo el cielo y la tierra."}}, {"kind": "psalm", "label": "canticle", "ref": "Rev 11:17-18;12:10b-12a", "content": {"la": [["11:17", "Gratias agimus tibi, Domine Deus omnipotens, qui es, et qui eras, et qui venturus es : quia accepisti virtutem tuam magnam, et regnasti."], ["11:18", "Et iratae sunt gentes, et advenit ira tua et tempus mortuorum judicari, et reddere mercedem servis tuis prophetis, et sanctis, et timentibus nomen tuum pusillis et magnis, et exterminandi eos qui corruperunt terram."], ["12:10", "Et audivi vocem magnam in caelo dicentem : Nunc facta est salus, et virtus, et regnum Dei nostri, et potestas Christi ejus : quia projectus est accusator fratrum nostrorum, qui accusabat illos ante conspectum Dei nostri die ac nocte."], ["12:11", "Et ipsi vicerunt eum propter sanguinem Agni, et propter verbum testimonii sui, et non dilexerunt animas suas usque ad mortem."], ["12:12", "Propterea laetamini caeli, et qui habitatis in eis. Vae terrae, et mari, quia descendit diabolus ad vos habens iram magnam, sciens quod modicum tempus habet."]], "es": [["11:17", "Gracias te tributamos ¡ oh Señor Dios todopoderoso! á ti que eres, que eras ya antes, y que has de venir; porque hiciste alarde de tu gran poderío, y has entrado en posesión de tu reino 'â¢"], ["11:18", "Las naciones montaron en cólera '; mas sobrevino tu ira, y el tiempo de ser juzgados los muertos, y de dar el galardón á tus siervos los Profetas, y á los santos, y á los que temen tu nombre, chicos y grandes, y de acabar con los que han corrompido la tierra."], ["12:10", "Entonces oí una voz sonora en el cielo que decía: Hé aquí el tiempo de salvación, de la potencia, y del reino de nuestro Dios, y del poder de su Christo: porque ha sido ya precipitado del cielo el acusador de nuestros hermanos, que los acusaba dia y noche ante la presencia de nuestro Dios."], ["12:11", "Y ellos le vencieron por los méritos de la sangre del Cordero, y en virtud de la palabra de la fe que han confesado, y por la cual desamaron sus vidas, hasta perderlas por obedecer á Dios."], ["12:12", "Por tanto regocijaos ¡ oh cielos, y los que en ellos moráis! ¡ Ay de la tierra, y del mar! porque el diablo bajó á vosotros arrojado del cielo, y está lleno de furor, sabiendo que le queda poco tiempo."]]}}, {"kind": "psalm", "label": "reading", "ref": "1pet 1:22-23", "content": {"la": [["22", "animas vestras castificantes in obedientia caritatis, in fraternitatis amore, simplici ex corde invicem diligite attentius :"], ["23", "renati non ex semine corruptibili, sed incorruptibili per verbum Dei vivi, et permanentis in aeternum :"]], "es": [["22", "Purificando pues vuestras almas con la obediencia del amor ', con amor fraternal, amaos unos á otros entrañablemente con un corazón puro y sencillo;"], ["23", "puesto que habéis renacido, no de semilla corruptible, sino incorruptible por la palabra de Dios vivo, la cual permanece por toda la eternidad \"*;"]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Dóminus pascit me* Et nihil mihi déerit. Dóminus.", "℟. In páscuis viréntibus me collocávit.* Et nihil mihi déerit. Glória Patri. Dóminus."], "es": ["$℣. $El Señor es mi pastor, nada me falta.", "$℟. $El Señor es mi pastor, nada me falta.", "$℣. $En verdes praderas me hace recostar.", "$℟. $Nada me falta.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $El Señor es mi pastor, nada me falta."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Sicut locutus es ad patres nostros, Domine, recordare misericordiae tuae.", "es": "Como lo prometiste a nuestros padres, Señor, acuérdate de tu misericordia."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Sicut locutus es ad patres nostros, Domine, recordare misericordiae tuae.", "es": "Como lo prometiste a nuestros padres, Señor, acuérdate de tu misericordia."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Animas nostras ad Dóminum et Salvatórem nostrum pergráti levémus, qui benedícit pópulum suum in omni benedictióne spiritáli, et cum devotióne rogémus:", "– Bénedic pópulum tuum, Dómine.", "Miséricors Deus, consérva Papam nostrum N. et Epíscopum nostrum N.,", "incólumes custódi eos Ecclésiæ tuæ.", "– Bénedic pópulum tuum, Dómine.", "Regiónem nostram, Dómine, tuére benígnus,", "a malis nos líbera univérsis.", "– Bénedic pópulum tuum, Dómine.", "Voca fílios in circúitum mensæ tuæ,", "qui préssius te vírginem, páuperem et obœdiéntem sequántur.", "– Bénedic pópulum tuum, Dómine.", "Ancíllas tuas custódi, propósitum virginitátis proféssas,", "ut te, Agnum divínum, quocúmque íeris, sequántur.", "– Bénedic pópulum tuum, Dómine.", "Defúncti in tua pace requiéscant ætérna,", "et eórum nobíscum coniúnctio, spiritálium bonórum communicatióne, roborétur.", "– Bénedic pópulum tuum, Dómine."], "es": ["Elevemos nuestros corazones agradecidos a nuestro Dios y Salvador, que ha bendecido a su pueblo con toda clase de bienes espirituales, y digámosle con fe:", "- Dios todopoderoso y lleno de misericordia, protege al papa N. y a nuestro obispo N., _a los que tú mismo has elegido para guiar a la Iglesia._ _Bendice a tu pueblo, Señor._", "- Protege, Señor, nuestros pueblos y ciudades _y aleja de ellos todo mal._ _Bendice a tu pueblo, Señor._", "- Multiplica, como renuevos de olivo alrededor de tu mesa, hijos que se consagren a tu reino, _siguiendo a Jesucristo en pobreza, castidad y obediencia._ _Bendice a tu pueblo, Señor._", "- Conserva el propósito de las que han consagrado a ti su virginidad, _para que sigan al Cordero divino adondequiera que vaya._ _Bendice a tu pueblo, Señor._", "- Haz que los difuntos descansen en tu paz eterna _y que se afiance nuestra unión con ellos por la comunión de los santos._ _Bendice a tu pueblo, Señor._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Omnipotens sempiterne Deus, qui in dilecto Filio tuo, universorum Rege, omnia instaurare voluisti, concede propitius, ut tota creatura, a servitute liberata, tu« maiestati deserviat ac te sine fine collaudet.", "es": "Al ofrecerte, Señor, nuestra alabanza vespertina, te pedimos humildemente que, meditando tu ley día y noche, consigamos un día la luz y el premio de la vida eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Caro mea requiescet in spe.", "es": "Mi carne descansará en la esperanza."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 15", "content": {"la": [["1", "Tituli inscriptio, ipsi David. Conserva me, Domine, quoniam speravi in te."], ["2", "Dixi Domino : Deus meus es tu, quoniam bonorum meorum non eges."], ["3", "Sanctis, qui sunt in terra ejus, mirificavit omnes voluntates meas in eis."], ["4", "Multiplicatae sunt infirmitates eorum, postea acceleraverunt. Non congregabo conventicula eorum de sanguinibus; nec memor ero nominum eorum per labia mea."], ["5", "Dominus pars haereditatis meae, et calicis mei : tu es qui restitues haereditatem meam mihi."], ["6", "Funes ceciderunt mihi in praeclaris; etenim haereditas mea praeclara est mihi."], ["7", "Benedicam Dominum qui tribuit mihi intellectum; insuper et usque ad noctem increpuerunt me renes mei."], ["8", "Providebam Dominum in conspectu meo semper, quoniam a dextris est mihi, ne commovear."], ["9", "Propter hoc laetatum est cor meum, et exsultavit lingua mea; insuper et caro mea requiescet in spe."], ["10", "Quoniam non derelinques animam meam in inferno, nec dabis sanctum tuum videre corruptionem."], ["11", "Notas mihi fecisti vias vitae; adimplebis me laetitia cum vultu tuo : delectationes in dextera tua usque in finem."]], "es": [["1", "Sálvame, oh Señor, pues tengo puesta en ti toda mi esperanza."], ["2", "Yo dije al Señor: Tú eres mi Dios, que no tienes necesidad de mis bienes."], ["3", "Cumplido ha maravillosamente todos mis deseos, en los santos que moran en su tierra."], ["4", "Multiplicaron los impíos sus miserias, o sus miserables deidades; en pos de las cuales corrían aceleradamente. No seré yo el que convoque sus sanguinarios sacrificios, ni siquiera tomaré en boca sus nombres."], ["5", "El Señor es la parte que me ha tocado en herencia, y la porción destinada para mí. Tú eres, oh Señor, el que me restituirá y conservará mi heredad."], ["6", "En delicioso sitio me cupo la suerte; hermosa es, a la verdad, la herencia que me ha tocado."], ["7", "Alabaré, pues, al Señor, que me ha dado este entendimiento; a lo cual, aun durante la noche, mi corazón me excitaba."], ["8", "Yo contemplaba siempre al Señor delante de mí, como quien está a mi diestra para sostenerme."], ["9", "Por eso se regocijó mi corazón, y prorrumpió en cánticos alegres mi lengua; y además también mi carne descansará con la esperanza."], ["10", "Porque yo sé que no has de abandonar tú, oh Señor, mi alma en el sepulcro; ni permitirás que tu Santo experimente la corrupción."], ["11", "Me hiciste conocer las sendas de la vida; me colmarás de gozo con la vista de tu divino rostro; en tu diestra se hallan delicias eternas."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Caro mea requiescet in spe.", "es": "Mi carne descansará en la esperanza."}}, {"kind": "psalm", "label": "reading", "ref": "1Thess 5:23", "content": {"la": [["23", "Ipse autem Deus pacis sanctificet vos per omnia : ut integer spiritus vester, et anima, et corpus sine querela in adventu Domini nostri Jesu Christi servetur."]], "es": [["23", "Y el Dios de la paz os haga santos en todo, á fin de que vuestro espíritu entero, con alma y cuerpo se conserven sin culpa para cuando venga nuestro Señor Jesu-Christo."]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Domine Deus noster, diurno labore fatigatos, quieto sopore nos refove, ut, tuo semper auxilio recreati, tibi corpore simus et mente devoti. Per Christum Dominum nostrum.", "es": "Señor, Dios nuestro, concédenos un descanso tranquilo que restaure nuestras fuerzas, desgastadas ahora por el trabajo del día; así, fortalecidos con tu ayuda, te serviremos siempre con todo nuestro cuerpo y nuestro espíritu. Por Jesucristo nuestro Señor."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-11-27": {"date_human": {"en": "Friday, November 27, 2026", "es": "Viernes, 27 de noviembre de 2026", "la": "Feria VI, die 27 Novembris, anno 2026"}, "day_description": {"en": "Friday in the 34<sup>th</sup> Week in Ordinary Time (Psalter week 2)", "es": "Viernes de la 34.<sup>a</sup> semana del Tiempo Ordinario (semana 2 del salterio)", "la": "Feria VI infra hebdomadam XXXIV per annum (hebdomada psalterii II)"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Cor contritum et humiliatum, Deus, non despicies.", "es": "Un corazón contrito y humillado, oh Dios, no lo despreciarás."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 50", "content": {"la": [["1", "In finem. Psalmus David,"], ["2", "cum venit ad eum Nathan propheta, quando intravit ad Bethsabee."], ["3", "Miserere mei, Deus, secundum magnam misericordiam tuam; et secundum multitudinem miserationum tuarum, dele iniquitatem meam."], ["4", "Amplius lava me ab iniquitate mea, et a peccato meo munda me."], ["5", "Quoniam iniquitatem meam ego cognosco, et peccatum meum contra me est semper."], ["6", "Tibi soli peccavi, et malum coram te feci; ut justificeris in sermonibus tuis, et vincas cum judicaris."], ["7", "Ecce enim in iniquitatibus conceptus sum, et in peccatis concepit me mater mea."], ["8", "Ecce enim veritatem dilexisti; incerta et occulta sapientiae tuae manifestasti mihi."], ["9", "Asperges me hyssopo, et mundabor; lavabis me, et super nivem dealbabor."], ["10", "Auditui meo dabis gaudium et laetitiam, et exsultabunt ossa humiliata."], ["11", "Averte faciem tuam a peccatis meis, et omnes iniquitates meas dele."], ["12", "Cor mundum crea in me, Deus, et spiritum rectum innova in visceribus meis."], ["13", "Ne projicias me a facie tua, et spiritum sanctum tuum ne auferas a me."], ["14", "Redde mihi laetitiam salutaris tui, et spiritu principali confirma me."], ["15", "Docebo iniquos vias tuas, et impii ad te convertentur."], ["16", "Libera me de sanguinibus, Deus, Deus salutis meae, et exsultabit lingua mea justitiam tuam."], ["17", "Domine, labia mea aperies, et os meum annuntiabit laudem tuam."], ["18", "Quoniam si voluisses sacrificium, dedissem utique; holocaustis non delectaberis."], ["19", "Sacrificium Deo spiritus contribulatus; cor contritum et humiliatum, Deus, non despicies."], ["20", "Benigne fac, Domine, in bona voluntate tua Sion, ut aedificentur muri Jerusalem."], ["21", "Tunc acceptabis sacrificium justitiae, oblationes et holocausta; tunc imponent super altare tuum vitulos."]], "es": [["2", "Cuando, después que pecó con Betsabé, vino a él el profeta Natán."], ["3", "Ten piedad de mí, oh Dios, según la grandeza de tu misericordia; y según la muchedumbre de tus piedades, borra mi iniquidad."], ["4", "Lávame aun más de mi iniquidad, y límpiame de mi pecado,"], ["5", "(porque yo reconozco mi maldad, y delante de mí tengo siempre mi pecado;"], ["6", "contra ti solo he pecado; y he cometido la maldad delante de tus ojos) a fin de que perdonándome, aparezca justo cuando hables, y quedes victorioso en los juicios que de ti se formen."], ["7", "Mira, pues, que fui concebido en iniquidad y que mi madre me concibió en pecado."], ["8", "Y mira que tú amas la verdad; tú me revelaste los secretos y recónditos misterios de tu sabiduría."], ["9", "Me rociarás, Señor, con el hisopo, y seré purificado; me lavarás, y quedaré más blanco que la nieve."], ["10", "Infundirás en mi oído palabras de gozo y de alegría, con lo que se recrearán mis huesos quebrantados."], ["11", "Aparta tu rostro de mis pecados, y borra todas mis iniquidades."], ["12", "Crea en mí, ¡oh Dios!, un corazón puro, y renueva en mis entrañas el espíritu de rectitud."], ["13", "No me arrojes de tu presencia y no retires de mí tu santo espíritu."], ["14", "Restitúyeme la alegría de tu salvador; y fortaléceme con un espíritu de príncipe."], ["15", "Yo enseñaré tus caminos a los malos, y se convertirán a ti los impíos."], ["16", "Líbrame de la sangre, ¡oh Dios, Dios salvador mío!, y ensalzará mi lengua tu justicia."], ["17", "¡Oh Señor!, tú abrirás mis labios; y publicará mi boca tus alabanzas."], ["18", "Que si tú quisieras sacrificios, ciertamente te los ofreciera; mas tú no te complaces con solos holocaustos."], ["19", "El espíritu compungido es el sacrificio más grato para Dios; no despreciarás, ¡oh Dios mío!, el corazón contrito y humillado."], ["20", "Señor, por tu buena voluntad sé benigno para con Sión, a fin de que estén firmes los muros de Jerusalén."], ["21", "Entonces aceptarás el sacrificio de justicia, las ofrendas y los holocaustos; entonces serán colocados sobre tu altar becerros para el sacrificio."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Cor contritum et humiliatum, Deus, non despicies.", "es": "Un corazón contrito y humillado, oh Dios, no lo despreciarás."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Cum iratus fueris, Domine, misericordiae recordaberis.", "es": "Cuando te encolerices, Señor, te acordarás de tu misericordia."}}, {"kind": "psalm", "label": "canticle", "ref": "Hab 3:2-4,13a,15-19", "content": {"la": [["2", "Domine, audivi auditionem tuam, et timui. Domine, opus tuum, in medio annorum vivifica illud; in medio annorum notum facies : cum iratus fueris, misericordiae recordaberis."], ["3", "Deus ab austro veniet, et Sanctus de monte Pharan : operuit caelos gloria ejus, et laudis ejus plena est terra."], ["4", "Splendor ejus ut lux erit, cornua in manibus ejus : ibi abscondita est fortitudo ejus."], ["13", "Egressus es in salutem populi tui, in salutem cum christo tuo : percussisti caput de domo impii, denudasti fundamentum ejus usque ad collum."], ["15", "Viam fecisti in mari equis tuis, in luto aquarum multarum."], ["16", "Audivi, et conturbatus est venter meus; a voce contremuerunt labia mea. Ingrediatur putredo in ossibus meis, et subter me scateat : ut requiescam in die tribulationis, ut ascendam ad populum accinctum nostrum."], ["17", "Ficus enim non florebit, et non erit germen in vineis; mentietur opus olivae, et arva non afferent cibum : abscindetur de ovili pecus, et non erit armentum in praesepibus."], ["18", "Ego autem in Domino gaudebo; et exsultabo in Deo Jesu meo."], ["19", "Deus Dominus fortitudo mea, et ponet pedes meos quasi cervorum : et super excelsa mea deducet me victor in psalmis canentem."]], "es": [["2", "Los Setenta tradujeron: Consideré tus obras, rj salí fuera de mi. Y por estas obras entienden la renovación del mundo, y las inefables misericordias de Dios. En el verso"], ["4", "Esto es. al tiempo señalado. â2 Sí, en medio de los años la harás patente: te acordarás de la misericordia tuya, cuando le habrás irritado\"."], ["13", "Saliste para salvar á tu pueblo, para salvarle por medio de tu Christo. â Heriste la cabeza de la casa del impío: descubriste sus cimientos de arriba abajo."], ["15", "Abriste camino en el mar á tu caballería por eu medio del cieno de profundas aguas '."], ["16", "Oí tu VOZ y se conmovieron mis entrañas: á tal voz tuya temblaron mis labios. â Penetre mis huesos la podredumbre, y brote dentro de mi gusanos; â á fin de que yo consiga reposo en el dia de la tribulación, y vaya á reunirme con el pueblo nuestro que está apercibido *."], ["17", "Porque la higuera no florecerá, ni las viñas brotarán: â faltará el fruto de la oliva: los campos no darán alimento. â â Arrebatadas serán del aprisco las ovejas, y quedarán sin ganados los pesebres. 18|Yo empero me regocijaré en el Señor, y saltaré de gozo en Dios Jesús mió."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Cum iratus fueris, Domine, misericordiae recordaberis.", "es": "Cuando te encolerices, Señor, te acordarás de tu misericordia."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Lauda, Ierusalem, Dominum.", "es": "Alaba, Jerusalén, al Señor."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 147:1-9", "content": {"la": [["1", "Alleluja. Lauda, Jerusalem, Dominum; lauda Deum tuum, Sion."], ["2", "Quoniam confortavit seras portarum tuarum, benedixit filiis tuis in te."], ["3", "Qui posuit fines tuos pacem, et adipe frumenti satiat te."], ["4", "Qui emittit eloquium suum terrae, velociter currit sermo ejus."], ["5", "Qui dat nivem sicut lanam, nebulam sicut cinerem spargit."], ["6", "Mittit crystallum suum sicut buccellas : ante faciem frigoris ejus quis sustinebit?"], ["7", "Emittet verbum suum, et liquefaciet ea; flabit spiritus ejus, et fluent aquae."], ["8", "Qui annuntiat verbum suum Jacob, justitias et judicia sua Israel."], ["9", "Non fecit taliter omni nationi, et judicia sua non manifestavit eis. Alleluja."]], "es": [["1", "Alaba al Señor, ¡oh Jerusalén!; alaba, ¡oh Sión!, a tu Dios."], ["2", "Porque él ha asegurado con fuertes barras o cerrojos tus puertas; ha llenado de bendición a tus hijos, que moran dentro de ti."], ["3", "Ha establecido la paz en tu territorio, y te alimenta de la flor de harina."], ["4", "El despacha sus órdenes a la tierra; órdenes que se comunican velozmente."], ["5", "El nos da la nieve como copos de lana; esparce la escarcha como ceniza."], ["6", "El despide el granizo en menudos pedazos; al rigor de su frío, ¿quién resistirá?"], ["7", "Pero luego despacha sus órdenes, derrite estas cosas; hace soplar su viento, y fluyen las aguas."], ["8", "El anuncia su palabra a Jacob, sus preceptos y ocultos juicios a Israel."], ["9", "No ha hecho otro tanto con las demás naciones, ni les ha manifestado a todas ellas sus juicios o preceptos. ¡Aleluya!"]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Lauda, Ierusalem, Dominum.", "es": "Alaba, Jerusalén, al Señor."}}, {"kind": "psalm", "label": "reading", "ref": "eph 2:13-16", "content": {"la": [["13", "Nunc autem in Christo Jesu, vos, qui aliquando eratis longe, facti estis prope in sanguine Christi."], ["14", "Ipse enim est pax nostra, qui fecit utraque unum, et medium parietem maceriae solvens, inimicitias in carne sua,"], ["15", "legem mandatorum decretis evacuans, ut duos condat in semetipso in unum novum hominem, faciens pacem :"], ["16", "et reconciliet ambos in uno corpore, Deo per crucem, interficiens inimicitias in semetipso."]], "es": [["13", "Mas ahora que creéis en Cristo Jesús, vosotros que en otro tiempo estabais alejados de Dios y de sus promesas, os habéis puesto cerca, merced á la sangre de Jesu-Cristo."], ["14", "Pues él es la paz nuestra, el que de los dos pueblos, judío y gentil, ha hecho uno, rompiendo, por medio del sacrificio de su carne, el muro de separación, esa enemistad que los dividía:"], ["15", "Aboliendo con sus preceptos evangélicos la Ley de los ritos, ó las ceremonias legales, para formar en sí mismo de dos un solo hombre nuevo, haciendo la paz,"], ["16", "Y reconciliando á ambos pueblos ya reunidos en un solo cuerpo con Dios, por medio de la cruz, destruyendo en sí mismo la enemistad de ellos."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Clamábo ad Dóminum altíssimum,* Qui benefécit mihi. Clamábo.", "℟. Mittet de cælo et liberábit me.* Qui benefécit mihi. Glória Patri. Clamábo."], "es": ["$℣. $Invoco al Dios altísimo, al Dios que hace tanto por mí.", "$℟. $Invoco al Dios altísimo, al Dios que hace tanto por mí.", "$℣. $Desde el cielo me enviará la salvación.", "$℟. $Al Dios que hace tanto por mí.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Invoco al Dios altísimo, al Dios que hace tanto por mí."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Per viscera misericordiae Dei nostri, visitavit nos Oriens ex alto.", "es": "Por las entrañas de misericordia de nuestro Dios, nos visitó el sol que nace de lo alto."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Per viscera misericordiae Dei nostri, visitavit nos Oriens ex alto.", "es": "Por las entrañas de misericordia de nuestro Dios, nos visitó el sol que nace de lo alto."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christum, qui sánguine suo per Spíritum Sanctum semetípsum óbtulit Patri ad emundándam consciéntiam nostram ab opéribus mórtuis, adorémus et sincéro corde profiteámur:", "– In tua voluntáte pax nostra, Dómine.", "Diéi exórdium a tua benignitáte suscépimus,", "nobis páriter vitæ novæ concéde inítium.", "– In tua voluntáte pax nostra, Dómine.", "Qui ómnia creásti providúsque consérvas,", "fac ut inspiciámus perénne tui vestígium in creátis.", "– In tua voluntáte pax nostra, Dómine.", "Qui sánguine tuo novum et ætérnum testaméntum sanxísti,", "da ut, quæ prǽcipis faciéntes, tuo fidéles fœ́deri maneámus.", "– In tua voluntáte pax nostra, Dómine.", "Qui, in cruce pendens, una cum sánguine aquam de látere effudísti,", "hoc salutári flúmine áblue peccáta nostra et civitátem Dei lætífica.", "– In tua voluntáte pax nostra, Dómine."], "es": ["Adoremos a Cristo que, en virtud del Espíritu eterno, se ofreció a Dios como sacrificio sin mancha, para purificar nuestras conciencias de las obras muertas, y digámosle con fe:", "- Tú que nos has dado la luz del nuevo día, _concédenos también caminar por sendas de vida nueva._ _Nuestra paz, Señor, es cumplir tu voluntad._", "- Tú que todo lo has creado con tu poder, y con tu providencia lo conservas todo, _ayúdanos a descubrirte presente en todas tus criaturas._ _Nuestra paz, Señor, es cumplir tu voluntad._", "- Tú que has sellado en tu sangre un pacto nuevo y eterno, _haz que, obedeciendo siempre tus mandatos, permanezcamos fieles a esa alianza._ _Nuestra paz, Señor, es cumplir tu voluntad._", "- Tú que, colgado en la cruz, quisiste que de tu costado manara agua con la sangre, _purifica con esta agua nuestros pecados y alegra con este manantial a la ciudad de Dios._ _Nuestra paz, Señor, es cumplir tu voluntad._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Omnipotens sempiterne Deus, qui in dilecto Filio tuo, universorum Rege, omnia instaurare voluisti, concede propitius, ut tota creatura, a servitute liberata, tu« maiestati deserviat ac te sine fine collaudet.", "es": "Señor, Dios todopoderoso, te pedimos nos concedas que
