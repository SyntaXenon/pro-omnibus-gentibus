as se le encuentra, invocadlo mientras está cerca. Aleluya._", "la": "Quǽrite Dóminum, dum inveníri potest: invocáte eum, dum prope est, allelúia."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_Buscad al Señor mientras se le encuentra, invocadlo mientras está cerca. Aleluya._", "la": "Quǽrite Dóminum, dum inveníri potest: invocáte eum, dum prope est, allelúia."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Verbum ætérnum per velámen carnis suæ osténdit viam novam et vivéntem ad cæléste sanctuárium. Humíliter ab eo petámus:", "– Veni et salva nos, Dómine", "Deus, in quo vívimus, movémur et sumus,", "veni et revéla nobis quod sumus genus tuum.", "– Veni et salva nos, Dómine", "Tu, qui non longe es ab unoquóque nostrum,", "teípsum cítius osténde ómnibus quæréntibus te.", "– Veni et salva nos, Dómine", "Pater páuperum et consolátor afflictórum,", "da libertátem captívis et mæstis lætítiam.", "– Veni et salva nos, Dómine", "Tu, qui mortem odísti, sed vitam díligis,", "nos et omnes defúnctos ab ætérna morte líbera.", "– Veni et salva nos, Dómine"], "es": ["Cristo, Palabra eterna, ha inaugurado un camino nuevo y vivo, a través del velo de su propia carne, para entrar en el Santuario. Pidámosle, pues, con humildad:", "- Oh Dios, en quien vivimos, nos movemos y existimos, _ven a revelarnos que somos estirpe tuya._ _Ven, Señor, y sálvanos._", "- Tú que no estás lejos de ninguno de nosotros, _muéstrate en seguida a todos los que te buscan._ _Ven, Señor, y sálvanos._", "- Padre de los pobres y consuelo de los afligidos, _da la libertad a los cautivos y la alegría a los tristes._ _Ven, Señor, y sálvanos._", "- Tú que destruyes la muerte y haces brillar la vida, _líbranos a nosotros y a todos los difuntos de la muerte eterna._ _Ven, Señor, y sálvanos._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Propitiáre, Dómine Deus, supplicatiónibus nostris et tribulántibus, quǽsumus, tuæ concéde pietátis auxílium, ut, de Fílii tui veniéntis præséntia consoláti, nullis iam polluámur contágiis vetustátis. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Señor y Dios nuestro, acoge favorablemente nuestras súplicas y ayúdanos con tu amor en nuestro desvalimiento; que la presencia de tu Hijo, ya cercano, nos renueve y nos libre de volver a caer en la antigua servidumbre del pecado. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Ne intres in iudicium cum servo tuo, Domine.", "es": "No entres en juicio con tu siervo, Señor."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 142:1-11", "content": {"la": [["1", "Psalmus David, quando persequebatur eum Absalom, filius ejus. Domine, exaudi orationem meam; auribus percipe obsecrationem meam in veritate tua; exaudi me in tua justitia."], ["2", "Et non intres in judicium cum servo tuo, quia non justificabitur in conspectu tuo omnis vivens."], ["3", "Quia persecutus est inimicus animam meam, humiliavit in terra vitam meam; collocavit me in obscuris, sicut mortuos saeculi."], ["4", "Et anxiatus est super me spiritus meus; in me turbatum est cor meum."], ["5", "Memor fui dierum antiquorum : meditatus sum in omnibus operibus tuis, in factis manuum tuarum meditabar."], ["6", "Expandi manus meas ad te; anima mea sicut terra sine aqua tibi."], ["7", "Velociter exaudi me, Domine; defecit spiritus meus. Non avertas faciem tuam a me, et similis ero descendentibus in lacum."], ["8", "Auditam fac mihi mane misericordiam tuam, quia in te speravi. Notam fac mihi viam in qua ambulem, quia ad te levavi animam meam."], ["9", "Eripe me de inimicis meis, Domine; ad te confugi."], ["10", "Doce me facere voluntatem tuam, quia Deus meus es tu. Spiritus tuus bonus deducet me in terram rectam."], ["11", "Propter nomen tuum, Domine, vivificabis me; in aequitate tua, educes de tribulatione animam meam;"]], "es": [["1", "¡Oh Señor!, escucha benigno mi oración; presta oídos a mi súplica, según la verdad de tus promesas; óyeme por tu misericordia."], ["2", "Mas no quieres entrar en juicio con tu siervo; porque ningún viviente puede aparecer justo en tu presencia."], ["3", "Ya ves cómo el enemigo ha perseguido mi alma; abatida tiene hasta el suelo la vida mía. Me ha confinado en lugares tenebrosos, como a los que murieron hace ya un siglo."], ["4", "Mi espíritu padece terribles angustias; está mi corazón en continua zozobra."], ["5", "Mas me acordé luego de los días antiguos; me puse a meditar todas tus obras; ponderaba los efectos maravillosos de tu poder."], ["6", "Levanté mis manos hacia ti como tierra falta de agua, así está por ti suspirando el alma mía."], ["7", "Oyeme luego, ¡oh Señor!, mi espíritu ha desfallecido. No retires de mí tu rostro; haz que no haya de contarme ya entre los muertos."], ["8", "Hazme sentir cuanto antes tu misericordia, pues en ti he puesto mi esperanza. Muéstrame el camino que debo seguir, ya que hacia ti he levantado mi corazón."], ["9", "Líbrame, ¡oh Señor!, de mis enemigos; a ti me acojo."], ["10", "Enséñame a cumplir tu voluntad, pues tú eres mi Dios. Entonces tu espíritu es infinitamente bueno, me conducirá a la tierra de la rectitud y santidad."], ["11", "Por amor de tu Nombre, ¡oh Señor!, me darás la vida, según la justicia de tus promesas. A mi alma la sacarás de la tribulación,"]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Ne intres in iudicium cum servo tuo, Domine.", "es": "No entres en juicio con tu siervo, Señor."}}, {"kind": "psalm", "label": "reading", "ref": "1Pet 5:8-9a", "content": {"la": [["8", "Sobrii estote, et vigilate : quia adversarius vester diabolus tamquam leo rugiens circuit, quaerens quem devoret :"], ["9", "cui resistite fortes in fide : scientes eamdem passionem ei quae in mundo est vestrae fraternitati fieri."]], "es": [["8", "Sed sobrios, y 'estad en continua vela, porque vuestro enemigo el diablo anda girando como león rugiente al rededor de vosotros, en busca de presa que devorar: ü resistidle firmes en la fé, sabiendo que la misma tribulación padecen vuestros hermanos, cuantos hay en el mundo."], ["9", "Resistidle firmes en la fe: sabiendo que la misma tribulacion padecen vuestros hermanos, cuantos hay en el mundo."]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Noctem istam, quæsumus, Domine, benignus illumina, et ita fac in pace nos tuos famulos obdormire, ut læti ad novi diei claritatem in tuo nomine suscitemur. Per Christum Dominum nostrum.", "es": "Ilumina, Señor, nuestra noche y concédenos un descanso tranquilo; que mañana nos levantemos en tu nombre y podamos contemplar, con salud y gozo, el clarear del nuevo día. Por Jesucristo nuestro Señor."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-12-02": {"date_human": {"en": "Wednesday, December 2, 2026", "es": "Miércoles, 2 de diciembre de 2026", "la": "Feria IV, die 2 Decembris, anno 2026"}, "day_description": {"en": "Wednesday of the 1<sup>st</sup> Week of Advent", "es": "Miércoles de la 1.<sup>a</sup> semana de Adviento", "la": "Feria IV hebdomadae I Adventus"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Tu luz, Señor, nos hace ver la luz._", "la": null}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 35", "content": {"la": [["1", "In finem. Servo Domini ipsi David."], ["2", "Dixit injustus ut delinquat in semetipso : non est timor Dei ante oculos ejus."], ["3", "Quoniam dolose egit in conspectu ejus, ut inveniatur iniquitas ejus ad odium."], ["4", "Verba oris ejus iniquitas, et dolus; noluit intelligere ut bene ageret."], ["5", "Iniquitatem meditatus est in cubili suo; astitit omni viae non bonae, malitiam autem non odivit."], ["6", "Domine, in caelo misericordia tua, et veritas tua usque ad nubes."], ["7", "Justitia tua sicut montes Dei; judicia tua abyssus multa. Homines et jumenta salvabis, Domine,"], ["8", "quemadmodum multiplicasti misericordiam tuam, Deus. Filii autem hominum in tegmine alarum tuarum sperabunt."], ["9", "Inebriabuntur ab ubertate domus tuae, et torrente voluptatis tuae potabis eos;"], ["10", "quoniam apud te est fons vitae, et in lumine tuo videbimus lumen."], ["11", "Praetende misericordiam tuam scientibus te, et justitiam tuam his qui recto sunt corde."], ["12", "Non veniat mihi pes superbiae, et manus peccatoris non moveat me."], ["13", "Ibi ceciderunt qui operantur iniquitatem; expulsi sunt, nec potuerunt stare."]], "es": [["2", "Resolvió el impío en su corazón el hacer el mal; no hay temor de Dios ante sus ojos."], ["3", "Porque ha obrado dolosamente en la divina presencia; por lo cual se ha hecho más odiosa su maldad."], ["4", "Las palabras de su boca son injusticia y embustes; no ha querido instruirse para obrar bien."], ["5", "Estando en su lecho discurre cómo obrar la iniquidad; anda en todo género de malos pasos; no tiene horror a la maldad."], ["6", "¡Oh Señor!, llega hasta el cielo tu misericordia, y hasta las nubes tu verdad."], ["7", "Como altísimos montes es grande tu justicia, abismo profundísimo tus juicios. A hombres y bestias conservas, ¡oh Señor!"], ["8", "¡Oh, cuánto has multiplicado, oh Dios, tu misericordia! Por eso los hijos de los hombres esperarán bajo las sombras de tus alas."], ["9", "Quedarán embriagados con la abundancia de tu casa, y les harás beber en el torrente de tus delicias."], ["10", "Porque en ti está la fuente de la vida; y en tu luz veremos la luz."], ["11", "Despliega tu misericordia sobre los que te conocen, y tu justicia a favor de aquellos que tienen un corazón recto."], ["12", "No dé yo pasos de soberbia; ni me hagan titubear las acciones del pecador."], ["13", "Allí es donde han caído por tierra los que cometen la maldad; han sido arrojados afuera, y no han podido levantarse más."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Tu luz, Señor, nos hace ver la luz._", "la": null}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Señor, tú eres grande, tu fuerza es invencible._", "la": null}}, {"kind": "psalm", "label": "canticle", "ref": "jdt 16:2-3,15-19", "content": {"la": [["2", "Incipite Domino in tympanis; cantate Domino in cymbalis; modulamini illi psalmum novum : exaltate, et invocate nomen ejus."], ["3", "Dominus conterens bella, Dominus nomen est illi."], ["15", "Hymnum cantemus Domino; hymnum novum cantemus Deo nostro."], ["16", "Adonai Domine, magnus es tu, et praeclarus in virtute tua : et quem superare nemo potest."], ["17", "Tibi serviat omnis creatura tua, quia dixisti, et facta sunt; misisti spiritum tuum, et creata sunt : et non est qui resistat voci tuae."], ["18", "Montes a fundamentis movebuntur cum aquis : petrae, sicut cera, liquescent ante faciem tuam."], ["19", "Qui autem timent te, magni erunt apud te per omnia."]], "es": [["2", "Entonad las alabanzas del señor al son de panderos, y címbalos ó salterios: cantad en honor suyo un nuevo i/ armonioso salmo, ensalzad, é invocad su santo Nombre."], ["3", "El Señor es el que derrota los ejércitos: su jiombre es Jehovah, el Señor."], ["15", "Cantemos un himno al Señor: cantémosle á nuestro Dios un himno nuevo."], ["16", "Oh Adonai, Señor mió, tú eres el grande y el muy glorioso por tu poder, y nadie puede sobrepujarte."], ["17", "Obedézcante todas tus criaturas, pues fueron hechas con un solo decir tuyo: enviaste tu espúñtu, y fueron criadas: ninguna puede resistir á, tu voz."], ["18", "Los montes con las aguas que oicienan, serán desquiciados desde los cimientos: derretí-"], ["19", "IMas aquellos que te temen, serán grandes delante de tí en todas las cosas."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Señor, tú eres grande, tu fuerza es invencible._", "la": null}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Aclamad a Dios con gritos de júbilo._", "la": null}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 46", "content": {"la": [["1", "In finem, pro filiis Core. Psalmus."], ["2", "Omnes gentes, plaudite manibus; jubilate Deo in voce exsultationis :"], ["3", "quoniam Dominus excelsus, terribilis, rex magnus super omnem terram."], ["4", "Subjecit populos nobis, et gentes sub pedibus nostris."], ["5", "Elegit nobis haereditatem suam; speciem Jacob quam dilexit."], ["6", "Ascendit Deus in jubilo, et Dominus in voce tubae."], ["7", "Psallite Deo nostro, psallite; psallite regi nostro, psallite;"], ["8", "quoniam rex omnis terrae Deus, psallite sapienter."], ["9", "Regnabit Deus super gentes; Deus sedet super sedem sanctam suam."], ["10", "Principes populorum congregati sunt cum Deo Abraham, quoniam dii fortes terrae vehementer elevati sunt."]], "es": [["2", "Naciones todas, dad palmadas de aplauso; gritad alegres a Dios con voces de júbilo."], ["3", "Porque excelso es el Señor y terrible, rey grande sobre toda la tierra."], ["4", "El nos sometió los pueblos, y puso a nuestros pies las naciones."], ["5", "Nos eligió por herencia suya a nosotros, porción bella de Jacob, que tanto amó."], ["6", "Ascendió Dios entre voces de júbilo; y el Señor al son de clarines."], ["7", "Cantad, cantad salmos a nuestro Dios; cantad, cantad salmos a nuestro rey."], ["8", "Porque Dios es el rey de toda la tierra: cantadle salmos sabiamente."], ["9", "Dios reinará sobre las naciones; está Dios sentado sobre su santo solio."], ["10", "Los príncipes de los pueblos se reunirán con el Dios de Abrahán; porque es el Dios protector de la tierra, y en gran manera ha sido ensalzado."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Aclamad a Dios con gritos de júbilo._", "la": null}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "gen 49:10", "content": {"la": [["10", "Non auferetur sceptrum de Juda, et dux de femore ejus, donec veniat qui mittendus est, et ipse erit expectatio gentium."]], "es": [["10", "EL CETRO NO SERA QUITADO DE JUDA, ni de su posteridad el caudillo, hasta que venga el que ha de ser enviado, y éste será la esperanza de las naciones."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Super te, Ierúsalem,* Constítui custódes. Super te.", "℟. Die ac nocte non tacébunt prædicáre nomen Dómini.* Constítui custódes. Glória Patri. Super te."], "es": ["$℣. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor.", "$℣. $Su gloria aparecerá sobre ti.", "$℟. $Amanecerá el Señor.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Sobre ti, Jerusalén, amanecerá el Señor."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Brotará un renuevo del tronco de Jesé y la gloria del Señor llenará toda la tierra; y todos verán la salvación de Dios._", "la": "Egredietur virga de radice Iesse, et replebitur omnis terra gloria Domini: et videbit omnis caro salutare Dei."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_Brotará un renuevo del tronco de Jesé y la gloria del Señor llenará toda la tierra; y todos verán la salvación de Dios._", "la": "Egredietur virga de radice Iesse, et replebitur omnis terra gloria Domini: et videbit omnis caro salutare Dei."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christo, bono pastóri, qui pro suis óvibus ánimam pósuit, laudes grati exsolvámus et supplicémus, dicéntes:", "– Pasce pópulum tuum, Dómine.", "Christe, qui in sanctis pastóribus misericórdiam et dilectiónem tuam dignátus es osténdere,", "numquam désinas per eos nobíscum misericórditer ágere.", "– Pasce pópulum tuum, Dómine.", "Qui múnere pastóris animárum fungi per tuos vicários pergis,", "ne destíteris nos ipse per rectóres nostros dirígere.", "– Pasce pópulum tuum, Dómine.", "Qui in sanctis tuis, populórum dúcibus, córporum animarúmque médicus exstitísti,", "numquam cesses ministérium in nos vitæ et sanctitátis perágere.", "– Pasce pópulum tuum, Dómine.", "Qui, prudéntia et caritáte sanctórum, tuum gregem erudísti,", "nos in sanctitáte iúgiter per pastóres nostros ædífica.", "– Pasce pópulum tuum, Dómine."], "es": ["El Señor, Padre todopoderoso, tenderá otra vez su mano, para rescatar al resto de su pueblo; supliquémosle, pues, confiados:", "- Concédenos, Señor, dar aquel fruto que pide la conversión, _para que podamos recibir tu reino que se acerca._ _Venga a nosotros tu Reino, Señor._", "- Prepara, Señor en nuestros corazones, un camino para tu Palabra que ha de venir: _así tu gloria se manifestará al mundo por medio de nosotros._ _Venga a nosotros tu Reino, Señor._", "- Abaja los montes y las colinas de nuestro orgullo _y levanta los valles de nuestros desánimos y de nuestras cobardías._ _Venga a nosotros tu Reino, Señor._", "- Destruye los muros del odio que divide a las naciones _y allana los caminos de la concordia entre los hombres._ _Venga a nosotros tu Reino, Señor._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Deus, qui beáti Francísci prædicatióne multos tibi pópulos acquisísti, da ut fidélium ánimi eódem fídei zelo férveant et ubérrima ubíque prole Ecclésia sancta lætétur. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Señor y Dios nuestro, prepara nuestros corazones con la fuerza de tu Espíritu, para que cuando llegue Jesucristo, tu Hijo, nos encuentre dignos de sentarnos a su mesa y él mismo nos sirva en el festín eterno. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El Señor es mi luz y mi salvación, ¿a quién temeré?_", "la": null}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 26:1-6", "content": {"la": [["1", "Psalmus David, priusquam liniretur. Dominus illuminatio mea et salus mea; quem timebo? Dominus protector vitae meae; a quo trepidabo?"], ["2", "Dum appropiant super me nocentes, ut edant carnes meas, qui tribulant me inimici mei, ipsi infirmati sunt et ceciderunt."], ["3", "Si consistant adversum me castra, non timebit cor meum. Si exsurgat adversum me praelium, in hoc ego sperabo."], ["4", "Unam petii a Domino, hanc requiram, ut inhabitem in domo Domini omnibus diebus vitae meae, ut videam voluptatem Domini, et visitem templum ejus."], ["5", "Quoniam abscondit me in tabernaculo suo; in die malorum protexit me in abscondito tabernaculi sui."], ["6", "In petra exaltavit me, et nunc exaltavit caput meum super inimicos meos. Circuivi, et immolavi in tabernaculo ejus hostiam vociferationis; cantabo, et psalmum dicam Domino."]], "es": [["1", "El Señor es mi luz y mi salvación: ¿a quién he de temer yo? El Señor es el defensor de mi vida: ¿quién me hará temblar?"], ["2", "Mientras están para echarse sobre mí los malhechores, a fin de devorar mis carnes, esos enemigos míos que me atribulan, esos mismos han flaqueado, y han caído."], ["3", "Aunque acampen ejércitos contra mí, no temblará mi corazón. Aunque me embistan en batalla, entonces mantendré firme mi esperanza."], ["4", "Una sola cosa he pedido al Señor, ésta solicitaré; y es que yo pueda vivir en la casa del Señor todos los días de mi vida; para contemplar las delicias del Señor, frecuentando su templo."], ["5", "El es quien me tuvo escondido en su Tabernáculo; en los días aciagos me puso a cubierto en lo más recóndito de su pabellón."], ["6", "Me ensalzó sobre una roca; y ahora me ha hecho prevalecer contra mis enemigos. Por tanto estaré alrededor de su Tabernáculo, inmolando sacrificios de júbilo o acción de gracias; cantando y entonando himnos al Señor."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El Señor es mi luz y mi salvación, ¿a quién temeré?_", "la": null}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Tu rostro buscaré, Señor, no me escondas tu rostro._", "la": null}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 26:7-14", "content": {"la": [["7", "Exaudi, Domine, vocem meam, qua clamavi ad te; miserere mei, et exaudi me."], ["8", "Tibi dixit cor meum, exquisivit te facies mea; faciem tuam, Domine, requiram."], ["9", "Ne avertas faciem tuam a me; ne declines in ira a servo tuo. Adjutor meus esto; ne derelinquas me, neque despicias me, Deus salutaris meus."], ["10", "Quoniam pater meus et mater mea dereliquerunt me; Dominus autem assumpsit me."], ["11", "Legem pone mihi, Domine, in via tua, et dirige me in semitam rectam, propter inimicos meos."], ["12", "Ne tradideris me in animas tribulantium me, quoniam insurrexerunt in me testes iniqui, et mentita est iniquitas sibi."], ["13", "Credo videre bona Domini in terra viventium."], ["14", "Expecta Dominum, viriliter age, et confortetur cor tuum, et sustine Dominum."]], "es": [["7", "Escucha, ¡oh Señor!, mis voces, con que te he invocado; ten misericordia de mí y óyeme."], ["8", "Contigo ha hablado mi corazón; en busca de ti han andado mis ojos. ¡Oh, Señor! tu cara es la que yo busco."], ["9", "No apartes de mí tu rostro; no te retires enojado de tu siervo. Sé tú en mi ayuda; no me desampares, ni me desprecies, ¡oh Dios, salvador mío!"], ["10", "Porque mi padre y mi madre me desampararon; pero el Señor me ha tomado por su cuenta."], ["11", "Arregla, Señor, mis pasos en tu camino, y dirígeme por la recta senda, a causa de mis enemigos."], ["12", "No me abandones a los deseos de mis perseguidores; porque han conspirado contra mí testigos inicuos; mas la iniquidad ha mentido o dañado a sí misma."], ["13", "Yo espero que veré algún día los bienes del Señor en la tierra de los vivientes."], ["14", "Aguarda al Señor, y pórtate varonilmente; cobre aliento tu corazón, y espera con paciencia el Señor."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Tu rostro buscaré, Señor, no me escondas tu rostro._", "la": null}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Él es el primogénito de toda criatura, es el primero en todo._", "la": null}}, {"kind": "psalm", "label": "canticle", "ref": "col 1:12-20", "content": {"la": [["12", "gratias agentes Deo Patri, qui dignos nos fecit in partem sortis sanctorum in lumine :"], ["13", "qui eripuit nos de potestate tenebrarum, et transtulit in regnum filii dilectionis suae,"], ["14", "in quo habemus redemptionem per sanguinem ejus, remissionem peccatorum :"], ["15", "qui est imago Dei invisibilis, primogenitus omnis creaturae :"], ["16", "quoniam in ipso condita sunt universa in caelis, et in terra, visibilia, et invisibilia, sive throni, sive dominationes, sive principatus, sive potestates : omnia per ipsum et in ipso creata sunt :"], ["17", "et ipse est ante omnes, et omnia in ipso constant."], ["18", "Et ipse est caput corporis Ecclesiae, qui est principium, primogenitus ex mortuis : ut sit in omnibus ipse primatum tenens :"], ["19", "quia in ipso complacuit, omnem plenitudinem inhabitare :"], ["20", "et per eum reconciliare omnia in ipsum, pacificans per sanguinem crucis ejus, sive quae in terris, sive quae in caelis sunt."]], "es": [["12", "dando gracias á Dios Padre, que nos ha hecho dignos de participar de la suerte y herencia úc los santos, iluminándonos con la luz del Evanyelio;"], ["13", "que nos ha arrebatado del poder de las tinieblas, y trasladado al reino de su Hijo muy amado;"], ["14", "por cuya sangre hemos sido nosotros rescatados, y recibido la remisión de los pecados;"], ["15", "y el cual es imágen perfecta del Dios invisible, engendrado ab eterno ante toda criatura;"], ["16", "pues por él fueron criadas todas las cosas en los cielos y en la tierra, las visibles y las invisibles, ora sean tronos, ora dominaciones, ora principados, ora potestades; todas las cosas fueron criadas por él mismo, y en atención á él mismo:"], ["17", "y así él tiene ser ante todas las cosas, y todas subsisten por él, y por él son conservadas."], ["18", "Y él es la cabeza del cuerpo de la Iglesia, y el principio de la resurrección, el primero á renacer de entre los muertos, para que en todo tenga él la primacía;"], ["19", "pues plugo al Padre poner en él la plenitud de todo ser,"], ["20", "y reconciliar por él todas las cosas consigo, restableciendo la paz entre cielo y tierra, por medio de la sangre que derramó en la cruz."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Él es el primogénito de toda criatura, es el primero en todo._", "la": null}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "1cor 1:7-9", "content": {"la": [["7", "ita ut nihil vobis desit in ulla gratia, exspectantibus revelationem Domini nostri Jesu Christi,"], ["8", "qui et confirmabit vos usque in finem sine crimine, in die adventus Domini nostri Jesu Christi."], ["9", "Fidelis Deus : per quem vocati estis in societatem filii ejus Jesu Christi Domini nostri."]], "es": [["7", "de manera que nada os falte de gracia ninguna, á vosotros que estáis esperando la manifestación de Jesu-Christo nuestro Señor:"], ["8", "El cual os confortará todavía hasta el fin, para que seais hallados irreprensibles en el dia del advenimiento de Jesu-Christo Señor nuestro."], ["9", "Porque Dios, por el cual habéis sido llamados á la compañía de su Hijo Jesu-Christo nuestro Señor, es fiel en sus promesas.."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Hic est fratrum amátor,* Qui multum orat pro pópulo. Hic est.", "℟. Et ánimam suam trádidit pro frátribus suis.* Qui multum orat pro pópulo. Glória Patri. Hic est."], "es": ["$℣. $Despierta tu poder y ven a salvarnos, Señor Dios de los ejércitos.", "$℟. $Despierta tu poder y ven a salvarnos, Señor Dios de los ejércitos.", "$℣. $Que brille tu rostro y nos salve.", "$℟. $Señor Dios de los ejércitos.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Despierta tu poder y ven a salvarnos, Señor Dios de los ejércitos."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Buscad al Señor mientras se le encuentra, invocadlo mientras está cerca. Aleluya._", "la": "Quaerite Dominum, dum inveniri potest: invocate eum, dum prope est, alleluia."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_Buscad al Señor mientras se le encuentra, invocadlo mientras está cerca. Aleluya._", "la": "Quaerite Dominum, dum inveniri potest: invocate eum, dum prope est, alleluia."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christum, pro homínibus pontíficem constitútum in iis quæ sunt ad Deum, dignis láudibus celebrémus, humíliter deprecántes:", "– Salvum fac pópulum tuum, Dómine.", "Qui Ecclésiam tuam per sanctos et exímios rectóres mirabíliter illustrásti,", "fac ut christiáni eódem semper lætificéntur splendóre.", "– Salvum fac pópulum tuum, Dómine.", "Qui, cum sancti te pastóres sicut Móyses orárent, pópuli peccáta dimisísti,", "per intercessiónem eórum Ecclésiam tuam contínua purificatióne sanctífica.", "– Salvum fac pópulum tuum, Dómine.", "Qui sanctos tuos unxísti in médio fratrum et Spíritum tuum in illos direxísti,", "reple Spíritu Sancto omnes pópuli tui rectóres.", "– Salvum fac pópulum tuum, Dómine.", "Qui pastórum sanctórum ipse posséssio exstitísti,", "tríbue nullum ex iis, quos sánguine acquisísti, sine te manére.", "– Salvum fac pópulum tuum, Dómine.", "Qui, per Ecclésiæ pastóres, vitam ætérnam óvibus tuis præstas, ne rápiat eas quisquam de manu tua,", "salva defúnctos, pro quibus ánimam tuam posuísti.", "– Salvum fac pópulum tuum, Dómine."], "es": ["Cristo, Palabra eterna, ha inaugurado un camino nuevo y vivo, a través del velo de su propia carne, para entrar en el Santuario. Pidámosle, pues, con humildad:", "- Oh Dios, en quien vivimos, nos movemos y existimos, _ven a revelarnos que somos estirpe tuya._ _Ven, Señor, y sálvanos._", "- Tú que no estás lejos de ninguno de nosotros, _muéstrate en seguida a todos los que te buscan._ _Ven, Señor, y sálvanos._", "- Padre de los pobres y consuelo de los afligidos, _da la libertad a los cautivos y la alegría a los tristes._ _Ven, Señor, y sálvanos._", "- Tú que destruyes la muerte y haces brillar la vida, _líbranos a nosotros y a todos los difuntos de la muerte eterna._ _Ven, Señor, y sálvanos._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Pan s mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Domine Iesu Christe, qui iugum suave te sequentibus onusque leve perhibes mitis et humilis, dignare huius diei vota et opera nostra suscipere, et quietem tribuere, qua tuo nos facias servitio promptiores. Qui vivis et regnas in sæcula sæculorum.", "es": "Señor Jesucristo, que eres manso y humilde de corazón y ofreces a los que vienen a ti un yugo llevadero y una carga ligera, dígnate, pues, aceptar los deseos y las acciones del día que hemos terminado; que podamos descansar durante la noche para que así, renovado nuestro cuerpo y nuestro espíritu, perseveremos constantes en tu servicio. Tú que vives y reinas por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranqu <script>
const DATA = JSON.parse(document.getElementById('dayData').textContent);
const LANG_NAMES = { la: "Latin / Latina", es: "Español" };
const leftSel = document.getElementById('leftLang');
const rightSel = document.getElementById('rightLang');
const hourSel = document.getElementById('hourSelect');
const tzSel = document.getElementById('tzSelect');
const dateSel = document.getElementById('dateSelect');
const tzNote = document.getElementById('tzNote');

// Which hymn id is currently picked per Hour context. Its language is always
// that hymn's own original_language (see renderHymnChoiceRows) - the dropdown
// only ever chooses WHICH hymn, never a language for it to be sung in.
let hymnChoiceByHour = {};

// DATA.hymn_pools starts as whatever was baked in when this page was
// generated (so double-clicking the file still works with no server). If
// this page is being served over HTTP (see .claude/launch.json's
// "docs-server" config), it re-fetches content/proper_texts/hymns.json live
// on every load - so editing that file and refreshing the browser picks up
// the change with no need to re-run render_day.py. Under file:// this fetch
// is normally blocked by the browser and silently falls back to the baked-in
// copy, which is fine.
function poolsFromRawHymns(raw) {
  const pools = {};
  for (const ctx of ['vespers', 'lauds', 'compline']) {
    pools[ctx] = [];
    for (const [hid, h] of Object.entries(raw)) {
      if (hid === '_note') continue;
      if ((h.applicability || []).includes(ctx)) {
        const lines = {};
        for (const lang of DATA.languages) lines[lang] = (h.lines && h.lines[lang]) || [];
        pools[ctx].push({ id: hid, title: h.title, original_language: h.original_language, lines });
      }
    }
  }
  return pools;
}
fetch('../content/proper_texts/hymns.json')
  .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(raw => { DATA.hymn_pools = poolsFromRawHymns(raw); render(); })
  .catch(() => { /* no server, or fetch blocked under file:// - keep the baked-in pool */ });

// Same idea, but for a whole day's Hours: if dev_server.py is running (see
// .claude/launch.json), /api/day?date=... reruns the actual Python
// construction logic fresh from disk - covering edits to the psalter tables,
// calendar cache, proper_texts, and content/sanctorale/, not just hymns.json.
// Plain `python -m http.server` (or file://) doesn't have that route, so this
// 404s harmlessly and the baked-in snapshot for that date stays in use.
for (const iso of DATA.date_order) {
  fetch('/api/day?date=' + encodeURIComponent(iso))
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(fresh => { DATA.dates[iso] = fresh; render(); })
    .catch(() => { /* dev_server.py not running - keep the baked-in day */ });
}

// This page is a static snapshot: DATA.dates holds a pre-built window of days
// (generated around DATA.generated_date) rather than just one. There's still
// no live backend to build a day outside that window, but picking a timezone
// now actually jumps to the right day within it instead of just warning.
function populateDateOptions() {
  const left = leftSel.value;
  const prev = dateSel.value;
  dateSel.innerHTML = '';
  for (const iso of DATA.date_order) {
    const o = document.createElement('option');
    o.value = iso;
    const dh = DATA.dates[iso].date_human;
    o.textContent = (dh && (dh[left] || dh.en)) || iso;
    dateSel.appendChild(o);
  }
  if (prev && DATA.dates[prev]) dateSel.value = prev;
}

const COMMON_TIMEZONES = [
  'UTC', 'Europe/Rome', 'Europe/Madrid', 'Europe/London', 'Europe/Paris',
  'America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles',
  'America/Mexico_City', 'America/Bogota', 'America/Sao_Paulo', 'America/Argentina/Buenos_Aires',
  'Asia/Manila', 'Asia/Tokyo', 'Asia/Kolkata', 'Australia/Sydney', 'Pacific/Auckland',
];
let tzList = COMMON_TIMEZONES;
try {
  if (typeof Intl.supportedValuesOf === 'function') {
    tzList = Intl.supportedValuesOf('timeZone');
  }
} catch (e) { /* fall back to the curated list above */ }

const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
if (!tzList.includes(browserTz)) tzList = [browserTz, ...tzList];

// Only the region prefix (e.g. "America", "Europe") has an established Latin/
// Spanish name across the whole IANA list - the city/location part after the
// slash is left as-is (see TZ_REGION_NAMES in i18n.py for why).
function populateTimezoneOptions() {
  const left = leftSel.value;
  const regionNames = (DATA.tz_region_names && DATA.tz_region_names[left]) || {};
  const prev = tzSel.value;
  tzSel.innerHTML = '';
  for (const tz of tzList) {
    const o = document.createElement('option');
    o.value = tz;
    const slash = tz.indexOf('/');
    if (slash === -1) {
      o.textContent = tz.replace(/_/g, ' ');
    } else {
      const region = tz.slice(0, slash);
      const rest = tz.slice(slash + 1).replace(/_/g, ' ');
      o.textContent = (regionNames[region] || region) + ' / ' + rest;
    }
    tzSel.appendChild(o);
  }
  tzSel.value = prev && tzList.includes(prev) ? prev : browserTz;
}

function isoDateInTimeZone(tz) {
  // en-CA locale formats as YYYY-MM-DD, convenient for direct comparison with DATA.dates keys
  return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' })
    .format(new Date());
}

// Picks "today" in the given timezone if that date was actually pre-built;
// otherwise falls back to whichever generated date is closest to it, since
// this is still a static page with a fixed, finite window of days baked in.
function closestAvailableDate(isoTarget) {
  if (DATA.dates[isoTarget]) return isoTarget;
  const targetMs = new Date(isoTarget).getTime();
  let best = DATA.date_order[0];
  let bestDiff = Infinity;
  for (const iso of DATA.date_order) {
    const diff = Math.abs(new Date(iso).getTime() - targetMs);
    if (diff < bestDiff) { bestDiff = diff; best = iso; }
  }
  return best;
}

const TZNOTE_TEXT = {
  en: (today, tz, first, last) => `&#9888; Today is <strong>${today}</strong> in ${tz}, which is outside the ` +
    `range of dates generated for this demo (<strong>${first}</strong> to <strong>${last}</strong>). ` +
    `Showing the closest available date instead.`,
  es: (today, tz, first, last) => `&#9888; Hoy es <strong>${today}</strong> en ${tz}, fecha fuera del ` +
    `intervalo generado para esta demo (<strong>${first}</strong> a <strong>${last}</strong>). ` +
    `Se muestra la fecha disponible más cercana.`,
  la: (today, tz, first, last) => `&#9888; Hodie est <strong>${today}</strong> in ${tz}, dies extra ` +
    `intervallum ad hanc demonstrationem generatum (<strong>${first}</strong> usque ad <strong>${last}</strong>). ` +
    `Dies proxima disponibilis ostenditur.`,
};

function updateTzNote() {
  const left = leftSel.value;
  const tz = tzSel.value;
  const todayInTz = isoDateInTimeZone(tz);
  if (DATA.dates[todayInTz]) {
    tzNote.style.display = 'none';
  } else {
    tzNote.style.display = '';
    const first = DATA.date_order[0], last = DATA.date_order[DATA.date_order.length - 1];
    const build = TZNOTE_TEXT[left] || TZNOTE_TEXT.en;
    tzNote.innerHTML = build(todayInTz, tz.replace(/_/g, ' '), first, last);
  }
}

function onTzChange() {
  updateTzNote();
  dateSel.value = closestAvailableDate(isoDateInTimeZone(tzSel.value));
  render();
}
tzSel.addEventListener('change', onTzChange);

for (const code of DATA.languages) {
  for (const sel of [leftSel, rightSel]) {
    const o = document.createElement('option');
    o.value = code; o.textContent = LANG_NAMES[code] || code;
    sel.appendChild(o);
  }
}
leftSel.value = DATA.languages[0];
rightSel.value = DATA.languages[1] || DATA.languages[0];

function populateHourOptions() {
  const left = leftSel.value;
  const prev = hourSel.value;
  const labels = (DATA.hour_labels && DATA.hour_labels[left]) || {};
  const comingSoon = (DATA.chrome_labels[left] || DATA.chrome_labels.en).coming_soon;
  hourSel.innerHTML = '';
  for (const h of DATA.hour_order) {
    const o = document.createElement('option');
    o.value = h;
    o.textContent = labels[h] || h;
    if (!DATA.implemented_hours.includes(h)) {
      o.disabled = true;
      o.textContent += ' ' + comingSoon;
    }
    hourSel.appendChild(o);
  }
  hourSel.value = DATA.hour_order.includes(prev) ? prev : DATA.default_hour;
}

// Everything on the page - not just liturgical content - follows whichever
// language is on the left ("main"): control labels, the Hour names, the Date
// picker, the date heading. The right side is either "the vernacular" (when
// the main language is Latin) or just "a translation" (when it's already a
// vernacular language) - never a second thing to pick a hymn to sing in.
function updateChromeLabels() {
  const left = leftSel.value;
  const cl = DATA.chrome_labels[left] || DATA.chrome_labels.en;
  document.getElementById('tzLabel').textContent = cl.timezone;
  document.getElementById('dateLabel').textContent = cl.date;
  document.getElementById('hourLabel').textContent = cl.hour;
  document.getElementById('leftLabel').textContent = cl.main;
  document.getElementById('rightLabel').textContent = (left === 'la') ? cl.vernacular : cl.translation;
}

function applyChrome() {
  updateChromeLabels();
  populateHourOptions();
  populateDateOptions();
  populateTimezoneOptions();
  updateTzNote();
  render();
}
leftSel.addEventListener('change', applyChrome);

// First run: builds every dropdown (so dateSel actually has options), then
// picks "today" in the browser's own timezone now that there's something to
// select - applyChrome() alone would leave dateSel on its first option.
applyChrome();
dateSel.value = closestAvailableDate(isoDateInTimeZone(browserTz));
render();

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// breviarium-core's own text fields (responsorios, preces) carry a light
// markup convention meant for ITS renderer: '$X$' wraps a versicle/response
// marker (e.g. '$V. $') that should stand out, '_X_' wraps a fixed refrain
// that should be italic. Left alone, those literal $ and _ characters were
// leaking straight into the page. Applied AFTER esc() so the <strong>/<em>
// tags it introduces don't get escaped themselves.
function mdLite(escaped) {
  return escaped
    .replace(/\$([^$]*)\$/g, '<strong>$1</strong>')
    .replace(/_([^_]*)_/g, '<em>$1</em>');
}

function renderUnitContent(unit, lang) {
  const val = unit.content ? unit.content[lang] : null;
  if (val === null || val === undefined) return '<em>[not yet sourced]</em>';
  return mdLite(esc(val)).replace(/\n/g, '<br>');
}

// Psalms and canticles are stored as [verseNumber, text] pairs; hymns and the
// Our Father are stored as plain ordered line arrays. Both get aligned row by
// row (verse-by-verse / line-by-line) rather than as two whole stacked blocks,
// since the source data already keys them that way - a block-level pairing
// was only ever an approximation of that finer alignment.
function renderAlignedRows(unit, left, right, single) {
  const isPsalm = (unit.kind === 'psalm');
  const missingLabel = isPsalm ? '[missing]' : '[not yet sourced]';
  const leftRaw = unit.content ? unit.content[left] : null;
  const rightRaw = single ? leftRaw : (unit.content ? unit.content[right] : null);
  const leftEmpty = !leftRaw || leftRaw.length === 0;
  const rightEmpty = !rightRaw || rightRaw.length === 0;

  if (leftEmpty && rightEmpty) {
    return single
      ? `<tr><td class="single"><em>${missingLabel}</em></td></tr>`
      : `<tr><td class="col-left"><em>${missingLabel}</em></td><td class="col-right"><em>${missingLabel}</em></td></tr>`;
  }

  if (!single) {
    var rows = `<tr><td class="col-left"><div class="unit-label">${left.toUpperCase()}</div></td>` +
                `<td class="col-right"><div class="unit-label">${right.toUpperCase()}</div></td></tr>`;
  } else {
    var rows = '';
  }

  if (isPsalm) {
    const leftMap = new Map((leftRaw || []).map(([n, t]) => [String(n), t]));
    const rightMap = new Map((rightRaw || []).map(([n, t]) => [String(n), t]));
    const nums = Array.from(new Set([...leftMap.keys(), ...rightMap.keys()]))
      .sort((a, b) => parseInt(a, 10) - parseInt(b, 10));
    for (const n of nums) {
      const lt = leftMap.has(n) ? `<span class="vn">${esc(n)}</span> ${esc(leftMap.get(n))}` : '<em>&mdash;</em>';
      if (single) {
        rows += `<tr><td class="single">${lt}</td></tr>`;
      } else {
        const rt = rightMap.has(n) ? `<span class="vn">${esc(n)}</span> ${esc(rightMap.get(n))}` : '<em>&mdash;</em>';
        rows += `<tr><td class="col-left">${lt}</td><td class="col-right">${rt}</td></tr>`;
      }
    }
    return rows;
  }

  // 'lines' kind: aligned by position, not by any shared numbering.
  const maxLen = Math.max(leftRaw ? leftRaw.length : 0, rightRaw ? rightRaw.length : 0);
  for (let i = 0; i < maxLen; i++) {
    const lt = (leftRaw && leftRaw[i] !== undefined) ? mdLite(esc(leftRaw[i])) : '<em>&mdash;</em>';
    if (single) {
      rows += `<tr><td class="single hymn-line">${lt}</td></tr>`;
    } else {
      const rt = (rightRaw && rightRaw[i] !== undefined) ? mdLite(esc(rightRaw[i])) : '<em>&mdash;</em>';
      rows += `<tr><td class="col-left hymn-line">${lt}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    }
  }
  return rows;
}

// The hymn block picks WHICH HYMN to sing from that Hour's pool via its own
// dropdown, independent of leftLang/rightLang - these are Latin compositions,
// so the dropdown only ever offers a hymn's own original_language (there's no
// such thing as "this Latin hymn, but sung in Spanish"; a translation is for
// following along, not a second thing to pick). Its DEFAULT ordering favors
// hymns whose original language matches leftLang. rightLang always drives a
// translation of that same hymn, same as everywhere else on the page.
function renderHymnChoiceRows(unit, left, right) {
  const ctx = unit.hour;
  const pool = (DATA.hymn_pools && DATA.hymn_pools[ctx]) || [];
  const opts = pool
    .filter(h => h.lines[h.original_language] && h.lines[h.original_language].length)
    .map(h => ({ id: h.id, lang: h.original_language, title: h.title }));
  if (opts.length === 0) {
    return `<tr><td colspan="2"><em>[not yet sourced]</em></td></tr>`;
  }
  opts.sort((a, b) => (a.lang === left ? 0 : 1) - (b.lang === left ? 0 : 1));

  let choiceId = hymnChoiceByHour[ctx];
  if (!choiceId || !opts.some(o => o.id === choiceId)) {
    choiceId = opts[0].id;
    hymnChoiceByHour[ctx] = choiceId;
  }

  let selectHtml = `<select class="hymn-select" data-hour="${esc(ctx)}">`;
  for (const o of opts) {
    const picked = (o.id === choiceId) ? ' selected' : '';
    selectHtml += `<option value="${esc(o.id)}"${picked}>` +
      `${esc(o.title)} (${esc(LANG_NAMES[o.lang] || o.lang)})</option>`;
  }
  selectHtml += `</select>`;
  let rows = `<tr><td colspan="2" class="hymn-picker">${selectHtml}</td></tr>`;

  const hymn = pool.find(h => h.id === choiceId);
  const sungLines = hymn.lines[hymn.original_language] || [];
  const translatedLines = hymn.lines[right] || [];
  const single = (hymn.original_language === right);

  if (single) {
    for (const line of sungLines) {
      rows += `<tr><td class="single hymn-line">${esc(line)}</td></tr>`;
    }
  } else if (translatedLines.length === 0) {
    sungLines.forEach((line, i) => {
      const rt = (i === 0) ? '<em>[not yet sourced]</em>' : '';
      rows += `<tr><td class="col-left hymn-line">${esc(line)}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    });
  } else {
    const maxLen = Math.max(sungLines.length, translatedLines.length);
    for (let i = 0; i < maxLen; i++) {
      const lt = sungLines[i] !== undefined ? esc(sungLines[i]) : '';
      const rt = translatedLines[i] !== undefined ? esc(translatedLines[i]) : '';
      rows += `<tr><td class="col-left hymn-line">${lt}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    }
  }
  return rows;
}

function onHymnSelectChange(e) {
  const sel = e.target;
  hymnChoiceByHour[sel.dataset.hour] = sel.value;
  render();
}

function render() {
  const dayData = DATA.dates[dateSel.value];
  const left = leftSel.value, right = rightSel.value;
  const hour = hourSel.value;
  const single = (left === right);

  // The heading leads with what's actually being celebrated (a feast/solemnity
  // name, or the full ferial description) - never the bare weekday label alone,
  // since "Feria V" on a major feast day would misleadingly read as "just an
  // ordinary Thursday." The raw calendar date is secondary, shown underneath.
  document.getElementById('dateHeading').innerHTML = dayData.day_description[left] || dayData.day_description.en;
  document.getElementById('metaLine').textContent = (dayData.date_human[left] || dayData.date_human.en);

  const units = dayData.hours[hour] || [];
  const labels = DATA.unit_labels[left] || DATA.unit_labels.en;
  const table = document.getElementById('mainTable');
  let html = '';
  for (const unit of units) {
    let labelText = labels[unit.label] || unit.label;
    if (unit.repeated) labelText += ' ' + (labels.repeated || '');
    if (unit.ref) labelText += ` (${esc(unit.ref)})`;
    html += `<tr><th colspan="2">${esc(labelText)}</th></tr>`;
    if (unit.label === 'psalmody_gap') {
      html += `<tr><td colspan="2"><em>${esc(labels.psalmody_gap_note || labels.missing)}</em></td></tr>`;
    } else if (unit.label === 'vespers_omitted_holy_saturday') {
      html += `<tr><td colspan="2"><em>${esc(labels.vespers_omitted_holy_saturday_note || labels.missing)}</em></td></tr>`;
    } else if (unit.kind === 'psalm' || unit.kind === 'lines') {
      html += renderAlignedRows(unit, left, right, single);
    } else if (unit.kind === 'hymn_choice') {
      html += renderHymnChoiceRows(unit, left, right);
    } else if (single) {
      html += `<tr><td class="single">${renderUnitContent(unit, left)}</td></tr>`;
    } else {
      html += `<tr><td class="col-left"><div class="unit-label">${left.toUpperCase()}</div>${renderUnitContent(unit, left)}</td>` +
              `<td class="col-right"><div class="unit-label">${right.toUpperCase()}</div>${renderUnitContent(unit, right)}</td></tr>`;
    }
  }
  table.innerHTML = html;
  table.querySelectorAll('.hymn-select').forEach(sel => sel.addEventListener('change', onHymnSelectChange));
}

leftSel.addEventListener('change', render);
rightSel.addEventListener('change', render);
hourSel.addEventListener('change', render);
dateSel.addEventListener('change', render);
render();
</script>
</body></html>
