"Etc": "Etc"}, "la": {"Africa": "Africa", "America": "America", "Antarctica": "Antarctica", "Arctic": "Arcticus", "Asia": "Asia", "Atlantic": "Atlanticus", "Australia": "Australia", "Europe": "Europa", "Indian": "Indicus", "Pacific": "Pacificus", "Etc": "Etc"}}, "hymn_pools": {"vespers": [{"id": "ave_maris_stella", "title": "Ave Maris Stella", "original_language": "la", "lines": {"la": ["Ave, maris stella,", "Dei Mater alma,", "atque semper Virgo,", "felix caeli porta.", "", "Sumens illud Ave", "Gabrielis ore,", "funda nos in pace,", "mutans Evae nomen.", "", "Solve vincla reis,", "profer lumen caecis,", "mala nostra pelle,", "bona cuncta posce.", "", "Monstra te esse matrem,", "sumat per te preces", "qui pro nobis natus", "tulit esse tuus.", "", "Virgo singularis,", "inter omnes mitis,", "nos culpis solutos", "mites fac et castos.", "", "Vitam praesta puram,", "iter para tutum,", "ut videntes Iesum", "semper collaetemur.", "", "Sit laus Deo Patri,", "summo Christo decus,", "Spiritui Sancto,", "tribus honor unus. Amen."], "es": ["Salve, estrella del mar,", "Madre nutricia de Dios,", "y siempre Virgen,", "dichosa puerta del cielo.", "", "Tomando aquel Ave", "de labios de Gabriel,", "afiánzanos en paz,", "cambiando el nombre de Eva.", "", "Suelta las cadenas de los culpables,", "trae la luz a los ciegos,", "aleja nuestros males,", "pide para nosotros todos los bienes.", "", "Muéstrate ser madre,", "reciba por ti nuestras súplicas", "quien, nacido por nosotros,", "quiso ser hijo tuyo.", "", "Virgen sin igual,", "mansa entre todas,", "líbranos de nuestras culpas", "y haznos mansos y castos.", "", "Danos una vida pura,", "prepáranos un camino seguro,", "para que, viendo a Jesús,", "nos gocemos siempre juntos.", "", "Sea la alabanza a Dios Padre,", "la gloria al altísimo Cristo,", "al Espíritu Santo,", "un mismo honor a los tres. Amén."]}}, {"id": "vexilla_regis_prodeunt", "title": "Vexilla Regis Prodeunt", "original_language": "la", "lines": {"la": ["Vexilla Regis prodeunt:", "fulget Crucis mysterium,", "qua vita mortem pertulit,", "et morte vitam protulit.", "", "Quae vulnerata lanceae", "mucrone diro, criminum", "ut nos lavaret sordibus,", "manavit unda et sanguine.", "", "Impleta sunt quae concinit", "David fideli carmine,", "dicendo nationibus:", "regnavit a ligno Deus.", "", "O Crux ave, spes unica,", "hoc Passionis tempore", "piis adauge gratiam,", "reisque dele crimina.", "", "Te, fons salutis Trinitas,", "collaudet omnis spiritus:", "quibus Crucis victoriam", "largiris, adde praemium. Amen."], "es": ["Los estandartes del Rey avanzan:", "resplandece el misterio de la Cruz,", "por la cual la Vida sufrió la muerte,", "y con la muerte produjo la vida.", "", "La cual, herida por la punta", "cruel de la lanza, para lavarnos", "de la mancha de nuestros pecados,", "manó agua y sangre.", "", "Se cumplió lo que cantó", "David en su fiel poema,", "diciendo a las naciones:", "Dios reinó desde el madero.", "", "Salve, oh Cruz, única esperanza,", "en este tiempo de la Pasión", "aumenta la gracia a los piadosos,", "y borra los pecados de los culpables.", "", "A ti, Trinidad, fuente de salvación,", "te alabe todo espíritu:", "a quienes la victoria de la Cruz", "concedes, añade la recompensa. Amén."]}}, {"id": "conditor_alme_siderum", "title": "Conditor Alme Siderum", "original_language": "la", "lines": {"la": ["Conditor alme siderum,", "aeterna lux credentium,", "Christe, redemptor omnium,", "exaudi preces supplicum.", "", "Qui condolens interitu", "mortis perire saeculum,", "salvasti mundum languidum,", "donans reis remedium.", "", "Vergente mundi vespere,", "uti sponsus de thalamo,", "egressus honestissima", "Virginis matris clausula.", "", "Cuius forti potentiae", "genu curvantur omnia;", "caelestia, terrestria", "nutu fatentur subdita.", "", "Te, Sancte, fide quaesumus,", "venture iudex saeculi,", "conserva nos in tempore", "hostis a telo perfidi.", "", "Sit, Christe, rex piissime,", "tibi Patrique gloria", "cum Spiritu Paraclito,", "in sempiterna saecula. Amen."], "es": ["Creador bondadoso de los astros,", "luz eterna de los creyentes,", "Cristo, redentor de todos,", "escucha las súplicas de los que te imploran.", "", "Tú que, apiadado de que el mundo", "pereciera en la ruina de la muerte,", "salvaste al mundo enfermo,", "dando remedio a los culpables.", "", "Cuando declinaba la tarde del mundo,", "como esposo que sale del tálamo,", "saliste del honestísimo", "seno de tu Madre Virgen.", "", "Ante cuyo fuerte poder", "se doblan todas las rodillas;", "los seres celestes y terrestres", "confiesan someterse a tu mandato.", "", "A ti, Santo, con fe te suplicamos,", "que has de venir como juez del mundo,", "consérvanos a tiempo", "libres del dardo del enemigo pérfido.", "", "Sea, oh Cristo, rey piadosísimo,", "gloria a ti y al Padre", "con el Espíritu Paráclito,", "por los siglos sempiternos. Amén."]}}, {"id": "pange_lingua_gloriosi", "title": "Pange Lingua Gloriosi Corporis Mysterium", "original_language": "la", "lines": {"la": ["Pange, lingua, gloriosi", "Corporis mysterium,", "Sanguinisque pretiosi,", "quem in mundi pretium", "fructus ventris generosi", "Rex effudit gentium.", "", "Nobis datus, nobis natus", "ex intacta Virgine,", "et in mundo conversatus,", "sparso verbi semine,", "sui moras incolatus", "miro clausit ordine.", "", "In supremae nocte cenae", "recumbens cum fratribus,", "observata lege plene", "cibis in legalibus,", "cibum turbae duodenae", "se dat suis manibus.", "", "Verbum caro, panem verum", "verbo carnem efficit:", "fitque sanguis Christi merum,", "et si sensus deficit,", "ad firmandum cor sincerum", "sola fides sufficit.", "", "Tantum ergo Sacramentum", "veneremur cernui:", "et antiquum documentum", "novo cedat ritui:", "praestet fides supplementum", "sensuum defectui.", "", "Genitori, Genitoque", "laus et iubilatio,", "salus, honor, virtus quoque", "sit et benedictio:", "procedenti ab utroque", "compar sit laudatio. Amen."], "es": ["Canta, lengua, el misterio", "del glorioso Cuerpo,", "y de la preciosa Sangre,", "que como precio del mundo,", "fruto de un vientre generoso,", "derramó el Rey de las naciones.", "", "Dado a nosotros, nacido para nosotros", "de una Virgen intacta,", "y habiendo vivido en el mundo", "sembrando la semilla de la Palabra,", "concluyó el tiempo de su estancia", "con un orden admirable.", "", "En la noche de la última cena,", "reclinado con sus hermanos,", "habiendo cumplido plenamente la ley", "en cuanto a los alimentos rituales,", "se da como alimento a los doce", "con sus propias manos.", "", "El Verbo hecho carne, con su palabra", "convierte en carne el pan verdadero:", "y el vino se hace sangre de Cristo,", "y si los sentidos no alcanzan,", "para afirmar el corazón sincero", "basta sólo la fe.", "", "Un Sacramento tan grande", "veneremos, pues, inclinados:", "y ceda el antiguo precepto", "al nuevo rito:", "que la fe supla", "lo que falta a los sentidos.", "", "Al Engendrador y al Engendrado", "sea la alabanza y el júbilo,", "la salud, el honor y también el poder", "y la bendición:", "y al que procede de ambos", "sea dada igual alabanza. Amén."]}}, {"id": "deus_tuorum_militum", "title": "Deus Tuorum Militum", "original_language": "la", "lines": {"la": ["Deus tuorum militum", "sors, et corona, praemium,", "laudes canentes Martyris", "absolve nexu criminis.", "", "Hic nempe mundi gaudia", "et blandimenta noxia", "caduca rite deputans,", "pervenit ad caelestia.", "", "Poenas cucurrit fortiter", "et sustulit viriliter,", "fundensque pro te sanguinem,", "aeterna dona possidet.", "", "Ob hoc precatu supplici", "te poscimus, piissime;", "in hoc triumpho Martyris", "dimitte noxam servulis.", "", "Laus et perennis gloria", "Deo Patri et Filio,", "Sancto simul Paraclito,", "in sempiterna saecula. Amen."], "es": ["Dios, suerte, corona y premio", "de tus soldados,", "a nosotros, que cantamos las alabanzas del Mártir,", "líbranos del lazo del pecado.", "", "Éste, en verdad, teniendo por caducos", "los gozos del mundo", "y sus dañinas seducciones,", "llegó a los bienes celestiales.", "", "Corrió fuertemente hacia las penas", "y las soportó con valentía,", "y derramando su sangre por ti,", "posee ahora los dones eternos.", "", "Por esto, con súplica humilde", "te lo pedimos, piadosísimo;", "en este triunfo del Mártir,", "perdona la culpa a tus siervos.", "", "Alabanza y gloria perpetua", "a Dios Padre y al Hijo,", "juntamente al Espíritu Santo Paráclito,", "por los siglos sempiternos. Amén."]}}, {"id": "o_lux_beata_trinitas", "title": "O Lux Beata Trinitas", "original_language": "la", "lines": {"la": ["O lux beata Trinitas,", "et principalis Unitas,", "iam sol recedit igneus:", "infunde lumen cordibus.", "", "Te mane laudum carmine,", "te deprecemur vespere:", "te nostra supplex gloria", "per cuncta laudet saecula.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Oh luz bienaventurada, Trinidad,", "y Unidad primera,", "ya el sol ígneo se retira:", "infunde tu luz en los corazones.", "", "A ti te alabemos por la mañana con cánticos,", "a ti te supliquemos al atardecer:", "que nuestra súplica te glorifique", "por todos los siglos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y para siempre. Amén."]}}, {"id": "exsultet_caelum_laudibus", "title": "Exsultet Caelum Laudibus", "original_language": "la", "lines": {"la": ["Exsultet caelum laudibus,", "resultet terra gaudiis,", "Apostolorum gloriam", "sacra canunt sollemnia.", "", "Vos, saecli iusti iudices", "et vera mundi lumina,", "votis precamur cordium:", "audite preces supplicum.", "", "Qui caelum verbo clauditis", "serasque eius solvitis,", "nos a peccatis omnibus", "solvite iussu, quaesumus.", "", "Quorum praecepto subditur", "salus et languor omnium,", "sanate mentes languidas,", "augete nos virtutibus.", "", "Ut, cum iudex advenerit", "Christus in fine saeculi,", "nos sempiterni gaudii", "faciat esse compotes.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "nunc et per omne saeculum. Amen."], "es": ["Exulte el cielo con alabanzas,", "resuene la tierra con gozos,", "la sagrada solemnidad canta", "la gloria de los Apóstoles.", "", "A vosotros, justos jueces del mundo", "y verdaderas luces del orbe,", "os rogamos con los votos de nuestros corazones:", "escuchad las preces de los suplicantes.", "", "Vosotros que con la palabra cerráis el cielo", "y desatáis sus cerrojos,", "libradnos de todos los pecados,", "os lo rogamos, por vuestro mandato.", "", "A cuyo mandato está sometida", "la salud y la enfermedad de todos,", "sanad nuestras mentes enfermas,", "aumentadnos en virtudes.", "", "Para que, cuando venga como juez", "Cristo al final de los siglos,", "nos haga partícipes", "del gozo sempiterno.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por todos los siglos. Amén."]}}, {"id": "iste_confessor", "title": "Iste Confessor", "original_language": "la", "lines": {"la": ["Iste confessor Domini, colentes", "quem pie laudant populi per orbem,", "hac die laetus meruit supremos", "laudis honores.", "", "Qui pius, prudens, humilis, pudicus,", "sobriam duxit sine labe vitam,", "donec humanos animavit aurae", "spiritus artus.", "", "Cuius ob praestans meritum, frequenter,", "aegra quae passim iacuere membra,", "viribus morbi domitis, saluti", "restituuntur.", "", "Noster hinc illi chorus obsequentem", "concinit laudem celebresque palmas,", "ut piis eius meritis iuvemur", "omne per aevum.", "", "Sit salus illi, decus atque virtus,", "qui, supra caeli residens cacumen,", "totius mundi seriem gubernat,", "trinus et unus. Amen."], "es": ["Este confesor del Señor, a quien", "los pueblos veneran piadosamente por todo el orbe,", "mereció alegre en este día los sumos", "honores de alabanza.", "", "El cual, piadoso, prudente, humilde y casto,", "llevó una vida sobria sin mancha,", "mientras el aliento de vida animó", "sus miembros humanos.", "", "Por cuyo excelente mérito, con frecuencia,", "los miembros enfermos que yacían por doquier,", "vencidas las fuerzas de la enfermedad, a la salud", "son restituidos.", "", "Por esto, nuestro coro le canta", "una alabanza obsequiosa y célebres palmas,", "para que por sus piadosos méritos seamos ayudados", "por toda la eternidad.", "", "Sea para él la salud, el honor y el poder,", "que, sentado sobre la cumbre del cielo,", "gobierna el curso de todo el mundo,", "trino y uno. Amén."]}}, {"id": "lucis_creator_optime", "title": "Lucis Creator Optime", "original_language": "la", "lines": {"la": ["Lucis Creator optime,", "lucem dierum proferens,", "primordiis lucis novae", "mundi parans originem;", "", "Qui mane iunctum vesperi", "diem vocari praecipis:", "taetrum chaos illabitur,", "audi preces cum fletibus.", "", "Ne mens gravata crimine", "vitae sit exsul munere,", "dum nil perenne cogitat", "seseque culpis illigat.", "", "Caeleste pulset ostium,", "vitale tollat praemium;", "vitemus omne noxium,", "purgemus omne pessimum.", "", "Praesta, Pater piissime,", "Patrique compar Unice,", "cum Spiritu Paraclito", "regnans per omne saeculum. Amen."], "es": ["Óptimo Creador de la luz,", "que produces la luz de los días,", "y en los primeros albores de la nueva luz", "preparaste el origen del mundo;", "", "Tú que mandas que se llame día", "a la mañana unida con la tarde:", "el horrible caos se desliza sobre nosotros,", "escucha nuestras preces con llanto.", "", "Que nuestra mente, cargada de pecado,", "no quede excluida del don de la vida,", "mientras no piensa en nada eterno", "y se enreda a sí misma en culpas.", "", "Que llame a la puerta celestial,", "que alcance el premio de la vida;", "evitemos todo lo dañino,", "purguemos todo lo pésimo.", "", "Concédelo, Padre piadosísimo,", "y también tú, Unigénito igual al Padre,", "que reinas con el Espíritu Paráclito", "por todos los siglos. Amén."]}}], "lauds": [{"id": "iste_confessor", "title": "Iste Confessor", "original_language": "la", "lines": {"la": ["Iste confessor Domini, colentes", "quem pie laudant populi per orbem,", "hac die laetus meruit supremos", "laudis honores.", "", "Qui pius, prudens, humilis, pudicus,", "sobriam duxit sine labe vitam,", "donec humanos animavit aurae", "spiritus artus.", "", "Cuius ob praestans meritum, frequenter,", "aegra quae passim iacuere membra,", "viribus morbi domitis, saluti", "restituuntur.", "", "Noster hinc illi chorus obsequentem", "concinit laudem celebresque palmas,", "ut piis eius meritis iuvemur", "omne per aevum.", "", "Sit salus illi, decus atque virtus,", "qui, supra caeli residens cacumen,", "totius mundi seriem gubernat,", "trinus et unus. Amen."], "es": ["Este confesor del Señor, a quien", "los pueblos veneran piadosamente por todo el orbe,", "mereció alegre en este día los sumos", "honores de alabanza.", "", "El cual, piadoso, prudente, humilde y casto,", "llevó una vida sobria sin mancha,", "mientras el aliento de vida animó", "sus miembros humanos.", "", "Por cuyo excelente mérito, con frecuencia,", "los miembros enfermos que yacían por doquier,", "vencidas las fuerzas de la enfermedad, a la salud", "son restituidos.", "", "Por esto, nuestro coro le canta", "una alabanza obsequiosa y célebres palmas,", "para que por sus piadosos méritos seamos ayudados", "por toda la eternidad.", "", "Sea para él la salud, el honor y el poder,", "que, sentado sobre la cumbre del cielo,", "gobierna el curso de todo el mundo,", "trino y uno. Amén."]}}, {"id": "ut_queant_laxis", "title": "Ut Queant Laxis", "original_language": "la", "lines": {"la": ["Ut queant laxis", "resonare fibris", "mira gestorum", "famuli tuorum,", "solve polluti", "labii reatum,", "Sancte Ioannes.", "", "Nuntius celso veniens Olympo,", "te patri magnum fore nasciturum,", "nomen, et vitae seriem gerendae", "ordine promit.", "", "Ille promissi dubius superni,", "perdidit promptae modulos loquelae:", "sed reformasti genitus peremptae", "organa vocis.", "", "Ventris obstruso positus cubili", "senseras Regem thalamo manentem:", "hinc parens nati meritis uterque", "abdita pandit.", "", "Sit decus Patri, genitaeque Proli,", "et tibi compar utriusque semper", "Spiritus alme, Deus unus, omni", "tempore saecli. Amen."], "es": ["Para que puedan", "resonar con voces desatadas", "las maravillas de las hazañas", "de tus siervos,", "libra de culpa", "nuestros labios manchados,", "san Juan.", "", "Un mensajero, viniendo del alto cielo,", "anuncia a tu padre que ibas a nacer grande,", "y revela en orden tu nombre", "y el curso de la vida que llevarías.", "", "Él, dudando de la promesa celestial,", "perdió el uso pronto de la palabra:", "pero tú, ya nacido, restauraste", "los órganos de su voz perdida.", "", "Colocado en el cerrado lecho del vientre,", "sentiste al Rey que permanecía en su tálamo:", "de ahí que ambos padres, por los méritos del hijo,", "revelan lo oculto.", "", "Sea la gloria al Padre, y al Hijo engendrado,", "y a ti, igual a ambos siempre,", "Espíritu bondadoso, Dios uno, por todo", "el tiempo del siglo. Amén."]}}, {"id": "veni_creator_spiritus", "title": "Veni Creator Spiritus", "original_language": "la", "lines": {"la": ["Veni, Creator Spiritus,", "mentes tuorum visita,", "imple superna gratia", "quae tu creasti pectora.", "", "Qui diceris Paraclitus,", "altissimi donum Dei,", "fons vivus, ignis, caritas,", "et spiritalis unctio.", "", "Tu septiformis munere,", "digitus paternae dexterae,", "tu rite promissum Patris,", "sermone ditans guttura.", "", "Accende lumen sensibus,", "infunde amorem cordibus,", "infirma nostri corporis", "virtute firmans perpeti.", "", "Hostem repellas longius,", "pacemque dones protinus;", "ductore sic te praevio", "vitemus omne noxium.", "", "Per te sciamus da Patrem,", "noscamus atque Filium;", "teque utriusque Spiritum", "credamus omni tempore.", "", "Deo Patri sit gloria,", "et Filio, qui a mortuis", "surrexit, ac Paraclito,", "in saeculorum saecula. Amen."], "es": ["Ven, Espíritu Creador,", "visita las mentes de los tuyos,", "llena de gracia celestial", "los pechos que Tú creaste.", "", "Tú, que eres llamado Paráclito,", "don del Dios altísimo,", "fuente viva, fuego, caridad,", "y unción espiritual.", "", "Tú, séptuple en tus dones,", "dedo de la diestra del Padre,", "tú, la promesa fielmente hecha por el Padre,", "que enriqueces las gargantas con la palabra.", "", "Enciende la luz en nuestros sentidos,", "infunde el amor en nuestros corazones,", "y las debilidades de nuestro cuerpo", "fortalécelas con virtud perpetua.", "", "Rechaza lejos al enemigo,", "y danos pronto la paz;", "así, contigo como guía,", "evitemos todo mal.", "", "Concédenos conocer por ti al Padre,", "y también conocer al Hijo;", "y a ti, Espíritu de ambos,", "creamos en todo tiempo.", "", "Gloria sea a Dios Padre,", "y al Hijo, que de entre los muertos", "resucitó, y al Paráclito,", "por los siglos de los siglos. Amén."]}}, {"id": "aeterne_rerum_conditor", "title": "Aeterne Rerum Conditor", "original_language": "la", "lines": {"la": ["Aeterne rerum Conditor,", "noctem diemque qui regis,", "et temporum das tempora,", "ut alleves fastidium;", "", "Praeco diei iam sonat,", "noctis profundae excubitor,", "nocturna lux viantibus", "a nocte noctem segregans.", "", "Hoc excitatus Lucifer", "solvit polum caligine;", "hoc omnis erronum cohors", "vias nocendi deserit.", "", "Iesu, labentes respice,", "et nos videndo corrige;", "si respicis, lapsus cadunt,", "fletuque culpa solvitur.", "", "Tu, lux, refulge sensibus,", "somnumque mentis discute;", "te nostra vox primum sonet,", "et vota solvamus tibi.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "nunc et per omne saeculum. Amen."], "es": ["Eterno Creador de todas las cosas,", "que riges la noche y el día,", "y das los tiempos a los tiempos,", "para aliviar nuestro hastío;", "", "Ya suena el heraldo del día,", "centinela de la profunda noche,", "luz nocturna para los caminantes,", "que separa la noche de la noche.", "", "Al oírlo, el Lucero", "libra al cielo de su oscuridad;", "al oírlo, toda hueste de malhechores", "abandona sus caminos de hacer daño.", "", "Jesús, mira a los que caen,", "y corrígenos mirándonos;", "si tú miras, las caídas cesan,", "y la culpa se disuelve con el llanto.", "", "Tú, luz, resplandece en nuestros sentidos,", "y disipa el sueño de la mente;", "que nuestra voz te cante primero a ti,", "y cumplamos para ti nuestros votos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por todos los siglos. Amén."]}}, {"id": "ecce_iam_noctis", "title": "Ecce Jam Noctis", "original_language": "la", "lines": {"la": ["Ecce iam noctis tenuatur umbra,", "lucis aurora rutilans coruscat;", "nisibus totis rogitemus omnes", "Cunctipotentem,", "", "Ut Deus, nostri miseratus, omnem", "pellat languorem, tribuat salutem,", "donet et nobis pietate patris", "regna polorum.", "", "Praestet hoc nobis Deitas beata", "Patris ac Nati, pariterque Sancti", "Spiritus, cuius resonat per omnem", "gloria mundum. Amen."], "es": ["He aquí que ya se adelgaza la sombra de la noche,", "y brilla resplandeciente la aurora de la luz;", "roguemos todos con todo empeño", "al Todopoderoso,", "", "Para que Dios, apiadado de nosotros,", "aleje toda enfermedad y conceda la salud,", "y nos dé, con piedad de padre,", "los reinos celestiales.", "", "Concédanos esto la bienaventurada Deidad", "del Padre y del Hijo, y también del Santo", "Espíritu, cuya gloria resuena", "por todo el mundo. Amén."]}}], "compline": [{"id": "te_lucis_ante_terminum", "title": "Te Lucis Ante Terminum", "original_language": "la", "lines": {"la": ["Te lucis ante terminum,", "rerum creator, poscimus,", "ut pro tua clementia", "sis praesul et custodia.", "", "Procul recedant somnia", "et noctium phantasmata;", "hostemque nostrum comprime,", "ne polluantur corpora.", "", "Praesta, Pater omnipotens,", "per Iesum Christum Dominum,", "qui tecum in perpetuum", "regnat cum Sancto Spiritu. Amen."], "es": ["Antes de que acabe la luz,", "te pedimos, Creador de todas las cosas,", "que por tu clemencia", "seas nuestro guardián y custodia.", "", "Aléjense lejos los sueños", "y los fantasmas de la noche;", "reprime a nuestro enemigo,", "para que nuestros cuerpos no se manchen.", "", "Concédenos esto, Padre omnipotente,", "por Jesucristo el Señor,", "que contigo por siempre", "reina con el Espíritu Santo. Amén."]}}, {"id": "christe_qui_lux_es_et_dies", "title": "Christe, Qui Lux Es Et Dies", "original_language": "la", "lines": {"la": ["Christe, qui lux es et dies,", "noctis tenebras detegis,", "lucisque lumen crederis,", "lumen beatum praedicans.", "", "Precamur, sancte Domine,", "defende nos in hac nocte,", "sit nobis in te requies,", "quietam noctem tribue.", "", "Ne gravis somnus irruat,", "nec hostis nos surripiat,", "nec caro illi consentiens,", "nos tibi reos statuat.", "", "Oculi somnum capiant,", "cor semper ad te vigilet,", "dextera tua protegat", "famulos qui te diligunt.", "", "Defensor noster, aspice,", "insidiantes reprime,", "guberna tuos famulos,", "quos sanguine mercatus es.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Cristo, que eres luz y día,", "que descubres las tinieblas de la noche,", "y eres proclamado la luz de la luz,", "anunciando la luz bienaventurada.", "", "Te suplicamos, santo Señor,", "defiéndenos en esta noche,", "sea en ti nuestro descanso,", "concédenos una noche tranquila.", "", "Que no nos asalte un sueño pesado,", "ni el enemigo nos sorprenda,", "ni la carne, consintiendo con él,", "nos declare culpables ante ti.", "", "Que los ojos tomen el sueño,", "pero el corazón vele siempre hacia ti,", "que tu diestra proteja", "a los siervos que te aman.", "", "Defensor nuestro, mira,", "reprime a los que nos acechan,", "gobierna a tus siervos,", "a quienes compraste con tu sangre.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por siempre. Amén."]}}, {"id": "o_lux_beata_trinitas", "title": "O Lux Beata Trinitas", "original_language": "la", "lines": {"la": ["O lux beata Trinitas,", "et principalis Unitas,", "iam sol recedit igneus:", "infunde lumen cordibus.", "", "Te mane laudum carmine,", "te deprecemur vespere:", "te nostra supplex gloria", "per cuncta laudet saecula.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Oh luz bienaventurada, Trinidad,", "y Unidad primera,", "ya el sol ígneo se retira:", "infunde tu luz en los corazones.", "", "A ti te alabemos por la mañana con cánticos,", "a ti te supliquemos al atardecer:", "que nuestra súplica te glorifique", "por todos los siglos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y para siempre. Amén."]}}]}, "dates": {"2026-03-29": {"date_human": {"en": "Sunday, March 29, 2026", "es": "Domingo, 29 de marzo de 2026", "la": "Dominica, die 29 Martii, anno 2026"}, "day_description": {"en": "Palm Sunday of the Passion of the Lord", "es": "Domingo de Ramos de la Pasión del Señor", "la": "Dominica in Palmis de Passione Domini"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "V. Deus, in adiutorium meum intende.\nR. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in saecula saeculorum. Amen. Alleluia.", "es": "V. Dios mío, ven en mi auxilio.\nR. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "lines", "label": "hymn", "content": {"la": null, "es": ["El pueblo que fue cautivo", "y que tu mano libera", "no encuentra mayor palmera", "ni abunda en mejor olivo.", "Viene con aire festivo", "para enramar tu victoria,", "y no te ha visto en su historia, ", "Dios de Israel, más cercano:", "Ni tu poder más a mano", "ni más humilde tu gloria.", "", "¡Gloria, alabanza y honor!", "Gritad: \"¡Hosanna!\", y haceos,", "como los niños hebreos", "al paso del Redentor.", "¡Gloria y honor", "al que viene en el nombre del Señor! Amén."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": "_Una gran multitud de gente, que había ido a la fiesta, aclamaba al Señor: «Bendito el que viene en nombre del Señor. Hosanna en el cielo.»_"}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 117", "content": {"la": [["1", "Alleluja. Confitemini Domino, quoniam bonus, quoniam in saeculum misericordia ejus."], ["2", "Dicat nunc Israel : Quoniam bonus, quoniam in saeculum misericordia ejus."], ["3", "Dicat nunc domus Aaron : Quoniam in saeculum misericordia ejus."], ["4", "Dicant nunc qui timent Dominum : Quoniam in saeculum misericordia ejus."], ["5", "De tribulatione invocavi Dominum; et exaudivit me in latitudine Dominus."], ["6", "Dominus mihi adjutor; non timebo quid faciat mihi homo."], ["7", "Dominus mihi adjutor; et ego despiciam inimicos meos."], ["8", "Bonum est confidere in Domino, quam confidere in homine."], ["9", "Bonum est sperare in Domino, quam sperare in principibus."], ["10", "Omnes gentes circuierunt me; et in nomine Domini quia ultus sum in eos."], ["11", "Circumdantes circumdederunt me, et in nomine Domini quia ultus sum in eos."], ["12", "Circumdederunt me sicut apes, et exarserunt sicut ignis in spinis; et in nomine Domini, quia ultus sum in eos."], ["13", "Impulsus eversus sum, ut caderem; et Dominus suscepit me."], ["14", "Fortitudo mea et laus mea Dominus; et factus est mihi in salutem."], ["15", "Vox exsultationis et salutis in tabernaculis justorum."], ["16", "Dextera Domini fecit virtutem, dextera Domini exaltavit me; dextera Domini fecit virtutem."], ["17", "Non moriar, sed vivam; et narrabo opera Domini."], ["18", "Castigans castigavit me Dominus, et morti non tradidit me."], ["19", "Aperite mihi portas justitiae : ingressus in eas confitebor Domino."], ["20", "Haec porta Domini, justi intrabunt in eam."], ["21", "Confitebor tibi quoniam exaudisti me, et factus es mihi in salutem."], ["22", "Lapidem quem reprobaverunt aedificantes, hic factus est in caput anguli."], ["23", "A Domino factum est istud, et est mirabile in oculis nostris."], ["24", "Haec est dies quam fecit Dominus; exsultemus, et laetemur in ea."], ["25", "O Domine, salvum me fac; o Domine, bene prosperare."], ["26", "Benedictus qui venit in nomine Domini : benediximus vobis de domo Domini."], ["27", "Deus Dominus, et illuxit nobis. Constituite diem solemnem in condensis, usque ad cornu altaris."], ["28", "Deus meus es tu, et confitebor tibi; Deus meus es tu, et exaltabo te. Confitebor tibi quoniam exaudisti me, et factus es mihi in salutem."], ["29", "Confitemini Domino, quoniam bonus, quoniam in saeculum misericordia ejus."]], "es": [["1", "Alabad al Señor, porque es tan bueno; porque hace brillar eternamente su misericordia."], ["2", "Diga ahora Israel que el Señor es bueno, y que es eterna su misericordia."], ["3", "Diga ahora la casa de Aarón, que es eterna la misericordia del Señor."], ["4", "Digan ahora también los que temen al Señor, que su misericordia es eterna."], ["5", "En medio de la tribulación invoqué al Señor, y me otorgó el Señor libertad."], ["6", "El Señor es mi sostén, no temo nada de cuanto pueda hacerme el hombre."], ["7", "El Señor está de mi parte; yo despreciaré a mis enemigos."], ["8", "Mejor es confiar en el Señor, que confiar en el hombre."], ["9", "Mejor es poner la esperanza en el Señor, que ponerla en los príncipes."], ["10", "Me cercaron todas las naciones; mas yo en el Nombre del Señor tomé venganza de ellas."], ["11", "Me cercaron estrechamente; pero me vengué de ellas en el Nombre del Señor."], ["12", "Me rodearon a la manera de un enjambre de irritadas abejas, y ardieron en ira como fuego que prende en secos espinos; pero en el Nombre del Señor tomé de ellas su venganza."], ["13", "A empellones procuraban derribarme, y estuve a punto de caer; mas el Señor me sostu-vo."], ["14", "El Señor es mi fortaleza y mi gloria; el Señor se ha constituido salvación mía."], ["15", "Voces de júbilo y de salvación son las que se oyen en las moradas de los justos."], ["16", "La diestra del Señor hizo proezas; la diestra del Señor me ha exaltado, triunfó la diestra del Señor."], ["17", "No me moriré, sino que viviré aún, y publicaré las obras del Señor."], ["18", "Me ha castigado el Señor severamente; mas no me ha entregado a la muerte."], ["19", "Abridme, ¡oh sacerdotes!, las puertas del Tabernáculo de la justicia y santidad; y entrado en ellas tributaré gracias al Señor."], ["20", "Esta es la puerta del Señor, por ella entrarán los justos."], ["21", "Aquí cantaré himnos de gratitud, por haberme oído y sido mi salvador ."], ["22", "La piedra que desecharon los arquitectos, esa misma ha sido puesta por piedra angular del edificio."], ["23", "El Señor es quien lo ha hecho, y es una cosa sumamente admirable a nuestros ojos."], ["24", "Este es el día que ha hecho el Señor. Alegrémonos y recocijémonos en él."], ["25", "¡Oh Señor!, sálvame; concede, Señor, un próspero suceso."], ["26", "Bendito sea el que viene en el Nombre del Señor. Os hemos echado mil bendiciones desde la casa del Señor."], ["27", "El Señor es Dios, y él nos ha alumbrado. Celebrad el día solemne de los Tabernáculos; celebradle con enramadas de árboles frondosos que lleguen hasta los lados del altar."], ["28", "¡Oh Señor!, tú eres mi Dios, y a ti tributaré acciones de gracias; tú eres mi Dios, y tu gloria ensalzaré. Tus alabanzas cantaré, porque me has oído, y te hiciste mi salvador ."], ["29", "Alabad al Señor por ser infinitamente bueno, por ser eterna su misericordia."]]}}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": "_Una gran multitud de gente, que había ido a la fiesta, aclamaba al Señor: «Bendito el que viene en nombre del Señor. Hosanna en el cielo.»_"}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": "_Con los ángeles y los niños cantemos al triunfador de la muerte: «Hosanna en el cielo.»_"}}, {"kind": "psalm", "label": "canticle", "ref": "dan 3:52-57", "content": {"la": [["52", "Benedictus es, Domine Deus patrum nostrorum : et laudabilis, et gloriosus, et superexaltatus in saecula. Et benedictum nomen gloriae tuae sanctum : et laudabile, et superexaltatum in omnibus saeculis."], ["53", "Benedictus es in templo sancto gloriae tuae : et superlaudabilis, et supergloriosus in saecula."], ["54", "Benedictus es in throno regni tui : et superlaudabilis, et superexaltatus in saecula."], ["55", "Benedictus es, qui intueris abyssos, et sedes super cherubim : et laudabilis, et superexaltatus in saecula."], ["56", "Benedictus es in firmamento caeli : et laudabilis et gloriosus in saecula."], ["57", "Benedicite, omnia opera Domini, Domino : laudate et superexaltate eum in saecula."]], "es": [["52", "Bendito seas tú , oh Señor Dios de nuestros pa- dres ; y digno eres de loor , y de gloria , y de ser en - salzado para siempre : bendito sea tu santo y glorioso nombre , y digno es de ser alabado , y sobremanera ensalzado en todos los siglos."], ["53", "Bendito eres tú en el Templo santo de tu gloria , y sobre todo loor y sobre toda gloria por todos los si- glos de siglos."], ["54", "Bendito eres tú en el trono de tu reino , y sobre todo loor y sobre toda gloria por todos los siglos."], ["55", "Bendito eres tú que con tu vista penetras los"], ["56", "Bendito eres tú en el firmamento del cielo , y digno de loor , y de gloria por todos los siglos."], ["57", "Obras todas del Señor, bendecid al Señor, y loadle y ensalzadle sobre todas las cosas por todos los siglos."]]}}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": "_Con los ángeles y los niños cantemos al triunfador de la muerte: «Hosanna en el cielo.»_"}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": "_¡Bendito el que viene en nombre del Señor! Paz en la tierra y gloria en lo alto._"}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 150", "content": {"la": [["1", "Alleluja. Laudate Dominum in sanctis ejus; laudate eum in firmamento virtutis ejus."], ["2", "Laudate eum in virtutibus ejus; laudate eum secundum multitudinem magnitudinis ejus."], ["3", "Laudate eum in sono tubae; laudate eum in psalterio et cithara."], ["4", "Laudate eum in tympano et choro; laudate eum in chordis et organo."], ["5", "Laudate eum in cymbalis benesonantibus; laudate eum in cymbalis jubilationis. Omnis spiritus laudet Dominum! Alleluja."]], "es": [["1", "Alabad al Señor que reside en su celestial santuario; alabadle sentado en el firmamento o trono de su poder."], ["2", "Alabadle por sus prodigios a favor vuestro; alabadle por su inmensa grandeza."], ["3", "Alabadle al son de clarines; alabadle con el salterio y la cítara."], ["4", "Alabadle con panderos y armoniosos conciertos; alabadle con instrumentos músicos de cuerdas y de viento."], ["5", "Alabadle con sonoros címbalos; alabadle con címbalos de júbilo. Empléese todo espíritu en alabar a Dios. ¡Aleluya!"]]}}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": "_¡Bendito el que viene en nombre del Señor! Paz en la tierra y gloria en lo alto._"}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "zech 9:9", "content": {"la": [["9", "Exsulta satis, filia Sion; jubila, filia Jerusalem : ecce rex tuus veniet tibi justus, et salvator : ipse pauper, et ascendens super asinam et super pullum filium asinae."]], "es": [["9", "Oh hija de Sion, regocíjate en gran manera *,"]]}}, {"kind": "lines", "label": "responsory", "content": {"la": null, "es": ["$℣. $Nos has comprado, Señor, con tu sangre.", "$℟. $Nos has comprado, Señor, con tu sangre.", "$℣. $De toda raza, lengua, pueblo y nación.", "$℟. $Con tu sangre.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Nos has comprado, Señor, con tu sangre."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": "_Aclamemos con palmas de victoria al Señor que viene, y salgamos a su encuentro con himnos y cantos, dándole gloria y diciendo: «Bendito eres, Señor.»_"}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel , porque ha \\isitado, y redimid® á su pueblo ; ^"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo :"], ["70", "según lo tenia anunciado por boca de sus santos Profetas , que han florecido en todos los siglos pa- sados ;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen :"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ' ,"], ["74", "de que, libertados de las manos de nuestros ene- migos , le sirvamos sin temor ,"], ["75", "con verdadera santidad y justicia , ante su aca- tamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño ! tú serás llamado el Profeta del Altísimo ; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados ,"], ["78", "por las entrañas misericordiosas de nuestro Dios , que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ' ,"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte ; para enderezar nuestros pasos por el camino de la paz ^."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": null, "es": "_Aclamemos con palmas de victoria al Señor que viene, y salgamos a su encuentro con himnos y cantos, dándole gloria y diciendo: «Bendito eres, Señor.»_"}}, {"kind": "lines", "label": "intercessions", "content": {"la": null, "es": ["Adoremos a Cristo, que, al entrar en Jerusalén, fue aclamado por las multitudes como Rey y Mesías, acojámosle también nosotros con gozo, diciendo:", "- Hosanna a ti, Hijo de David y Rey eterno; _hosanna a ti, vencedor de la muerte y del mal._ _Bendito el que viene en nombre del Señor._", "- Tú que subiste a Jerusalén para sufrir la pasión y entrar así en la gloria, _conduce a tu Iglesia a la Pascua eterna._ _Bendito el que viene en nombre del Señor._", "- Tú que convertiste el madero de la cruz en árbol de vida, _haz que los renacidos en el bautismo gocen de la abundancia de los frutos de este árbol._ _Bendito el que viene en nombre del Señor._", "- Salvador nuestro que viniste a salvar a los pecadores, _conduce a tu reino a los que en ti creen, esperan y te aman._ _Bendito el que viene en nombre del Señor._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in caelis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in caelo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": null, "es": "Dios todopoderoso y eterno, tú quisiste que nuestro Salvador se hiciese hombre y muriese en la cruz, para mostrar al género humano el ejemplo de una vida sumisa a tu voluntad; concédenos que las enseñanzas de su pasión nos sirvan de testimonio, y que un día participemos en su gloriosa resurrección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "V. Benedicamus Domino.\nR. Deo gratias.", "es": "V. Bendigamos al Señor.\nR. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "V. Deus, in adiutorium meum intende.\nR. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in saecula saeculorum. Amen. Alleluia.", "es": "V. Dios mío, ven en mi auxilio.\nR. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "lines", "label": "hymn", "content": {"la": null, "es": ["¿Quién es este que viene,", "recién atardecido,", "cubierto por su sangre", "como varón que pisa los racimos? ", "", "Éste es Cristo, el Señor,", "convocado a la muerte,", "glorificado en la resurrección.", "", "¿Quién es este que vuelve,", "glorioso y malherido,", "y, a precio de su muerte,", "compra la paz y libra a los cautivos? ", "", "Éste es Cristo, el Señor,", "convocado a la muerte,", "glorificado en la resurrección.", "", "Se durmió con los muertos,", "y reina entre los vivos;", "no le venció la fosa,", "porque el Señor sostuvo a su elegido. ", "", "Éste es Cristo, el Señor,", "convocado a la muerte,", "glorificado en la resurrección.", "", "Anunciad a los pueblos", "qué habéis visto y oído;", "aclamad al que viene", "como la paz, bajo un clamor de olivos. Amén."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": "_Herido y humillado, la diestra de Dios lo exaltó._"}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 109:1-5,7", "content": {"la": [["1", "Psalmus David. Dixit Dominus Domino meo : Sede a dextris meis, donec ponam inimicos tuos scabellum pedum tuorum."], ["2", "Virgam virtutis tuae emittet Dominus ex Sion : dominare in medio inimicorum tuorum."], ["3", "Tecum principium in die virtutis tuae in splendoribus sanctorum; ex utero, ante luciferum, genui te."], ["4", "Juravit Dominus, et non poenitebit eum : Tu es sacerdos in aeternum secundum ordinem Melchisedech."], ["5", "Dominus a dextris tuis; confregit in die irae suae reges."], ["7", "de torrente in via bibet; propterea exaltabit caput."]], "es": [["1", "El Señor dijo a mi Señor: Siéntate a mi diestra, mientras que yo pongo a tus enemigos por tarima de tus pies."], ["2", "De Sión hará salir el Señor el cetro de tu poder; domina tú en medio de tus enemigos."], ["3", "Contigo está el principado el día de tu poderío, en medio de los resplandores de la santidad; de mis entrañas te engendré, antes de existir el lucero de la mañana."], ["4", "Juró el Señor, y no se arrepentirá, y dijo: Tú eres sacerdote sempiterno, según el orden de Melquisedec."], ["5", "El Señor está a tu diestra; en el día de su ira destrozó a los reyes."], ["7", "Beberá del torrente durante el camino, por eso levantará su cabeza."]]}}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": "_Herido y humillado, la diestra de Dios lo exaltó._"}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": "_La sangre de Cristo nos ha purificado, llevándonos al culto del Dios vivo._"}}, {"kind": "lines", "label": "canticle", "ref": "Salmo 113 B: Himno al Dios verdadero", "content": {"la": null, "es": ["No a nosotros, Señor, no a nosotros,", "sino a tu nombre da la gloria,", "por tu bondad, por tu lealtad.", "¿Por qué han de decir las naciones:", "\"Dónde está su Dios\"?", "", "Nuestro Dios está en el cielo,", "lo que quiere lo hace.", "Sus ídolos, en cambio, son plata y oro,", "hechura de manos humanas:", "", "tienen boca, y no hablan;", "tienen ojos, y no ven;", "tienen orejas, y no oyen;", "tienen nariz, y no huelen;", "", "tienen manos, y no tocan;", "tienen pies, y no andan;", "no tiene voz su garganta:", "que sean igual los que los hacen,", "cuantos confían en ellos.", "", "Israel confía en el Señor:", "él es su auxilio y su escudo.", "La casa de Aarón confía en el Señor:", "él es su auxilio y su escudo.", "Los fieles del Señor confían en el Señor:", "él es su auxilio y su escudo.", "", "Que el Señor se acuerde de nosotros y nos bendiga,", "bendiga a la casa de Israel,", "bendiga a la casa de Aarón;", "bendiga a los fieles del Señor,", "pequeños y grandes.", "", "Que el Señor os acreciente,", "a vosotros y a vuestros hijos;", "benditos seáis del Señor,", "que hizo el cielo y la tierra.", "El cielo pertenece al Señor,", "la tierra se la ha dado a los hombres.", "", "Los muertos ya no alaban al Señor,", "ni los que bajan al silencio.", "Nosotros, sí, bendeciremos al Señor", "ahora y por siempre.", "", "Gloria al Padre, y al Hijo, y al Espíritu Santo.", "Como era en el principio, ahora y siempre,", "por los siglos de los siglos. Amén."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": "_La sangre de Cristo nos ha purificado, llevándonos al culto del Dios vivo._"}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": "_Cargado con nuestros pecados, subió al leño, para que, muertos al pecado, vivamos para la justicia._"}}, {"kind": "psalm", "label": "canticle", "ref": "1pet 2:21-24", "content": {"la": [["21", "In hoc enim vocati estis : quia et Christus passus est pro nobis, vobis relinquens exemplum ut sequamini vestigia ejus :"], ["22", "qui peccatum non fecit, nec inventus est dolus in ore ejus :"], ["23", "qui cum malediceretur, non maledicebat : cum pateretur, non comminabatur : tradebat autem judicanti se injuste :"], ["24", "qui peccata nostra ipse pertulit in corpore suo super lignum; ut peccatis mortui, justitiae vivamus : cujus livore sanatis estis."]], "es": [["21", "Que para esto fuisteis llamados á la dignidad de hijos de Dios; puesto que también Christo, nuestra ca- beza , padeció por nosotros , dándoos ejemplo , para que sigáis sus pisadas."], ["22", "El cual no cometió pecado alguno , ni se hallo dolo en su boca :"], ["23", "quien, cuando le maldecían, no retornaba mal- diciones ; cuando le atormentaban , no prorumpia en amenazas; antes se ponia en manos de aquel que le sentenciaba injustamente ' :"], ["24", "él es el que llevó la pena de nuestros pecados en su cuerpo sobre el madero de la cruz , á fin de que nosotros muertos á los pecados , vivamos á la Reservando á Dios la justa venganza. á22 EPÍST. PUIMEIU DE SAN PEDRO. justicia , y él es por cuyas Hagas fuisteis vosotros sa- nados '."]]}}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": "_Cargado con nuestros pecados, subió al leño, para que, muertos al pecado, vivamos para la justicia._"}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "acts 13:26-30", "content": {"la": [["26", "Viri fratres, filii generis Abraham, et qui in vobis timent Deum, vobis verbum salutis hujus missum est."], ["27", "Qui enim habitabant Jerusalem, et principes ejus hunc ignorantes, et voces pr <script>
const DATA = JSON.parse(document.getElementById('dayData').textContent);
const LANG_NAMES = { la: "Latin / Latina", es: "Español" };
const leftSel = document.getElementById('leftLang');
const rightSel = document.getElementById('rightLang');
const hourSel = document.getElementById('hourSelect');
const tzSel = document.getElementById('tzSelect');
const dateSel = document.getElementById('dateSelect');
const tzNote = document.getElementById('tzNote');

// Which hymn id is currently picked per Hour context. Its language is always
// that hymn's own original_language (see renderHymnChoiceRows) - the dropdown
// only ever chooses WHICH hymn, never a language for it to be sung in.
let hymnChoiceByHour = {};

// DATA.hymn_pools starts as whatever was baked in when this page was
// generated (so double-clicking the file still works with no server). If
// this page is being served over HTTP (see .claude/launch.json's
// "docs-server" config), it re-fetches content/proper_texts/hymns.json live
// on every load - so editing that file and refreshing the browser picks up
// the change with no need to re-run render_day.py. Under file:// this fetch
// is normally blocked by the browser and silently falls back to the baked-in
// copy, which is fine.
function poolsFromRawHymns(raw) {
  const pools = {};
  for (const ctx of ['vespers', 'lauds', 'compline']) {
    pools[ctx] = [];
    for (const [hid, h] of Object.entries(raw)) {
      if (hid === '_note') continue;
      if ((h.applicability || []).includes(ctx)) {
        const lines = {};
        for (const lang of DATA.languages) lines[lang] = (h.lines && h.lines[lang]) || [];
        pools[ctx].push({ id: hid, title: h.title, original_language: h.original_language, lines });
      }
    }
  }
  return pools;
}
fetch('../content/proper_texts/hymns.json')
  .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(raw => { DATA.hymn_pools = poolsFromRawHymns(raw); render(); })
  .catch(() => { /* no server, or fetch blocked under file:// - keep the baked-in pool */ });

// Same idea, but for a whole day's Hours: if dev_server.py is running (see
// .claude/launch.json), /api/day?date=... reruns the actual Python
// construction logic fresh from disk - covering edits to the psalter tables,
// calendar cache, proper_texts, and content/sanctorale/, not just hymns.json.
// Plain `python -m http.server` (or file://) doesn't have that route, so this
// 404s harmlessly and the baked-in snapshot for that date stays in use.
for (const iso of DATA.date_order) {
  fetch('/api/day?date=' + encodeURIComponent(iso))
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(fresh => { DATA.dates[iso] = fresh; render(); })
    .catch(() => { /* dev_server.py not running - keep the baked-in day */ });
}

// This page is a static snapshot: DATA.dates holds a pre-built window of days
// (generated around DATA.generated_date) rather than just one. There's still
// no live backend to build a day outside that window, but picking a timezone
// now actually jumps to the right day within it instead of just warning.
function populateDateOptions() {
  const left = leftSel.value;
  const prev = dateSel.value;
  dateSel.innerHTML = '';
  for (const iso of DATA.date_order) {
    const o = document.createElement('option');
    o.value = iso;
    const dh = DATA.dates[iso].date_human;
    o.textContent = (dh && (dh[left] || dh.en)) || iso;
    dateSel.appendChild(o);
  }
  if (prev && DATA.dates[prev]) dateSel.value = prev;
}

const COMMON_TIMEZONES = [
  'UTC', 'Europe/Rome', 'Europe/Madrid', 'Europe/London', 'Europe/Paris',
  'America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles',
  'America/Mexico_City', 'America/Bogota', 'America/Sao_Paulo', 'America/Argentina/Buenos_Aires',
  'Asia/Manila', 'Asia/Tokyo', 'Asia/Kolkata', 'Australia/Sydney', 'Pacific/Auckland',
];
let tzList = COMMON_TIMEZONES;
try {
  if (typeof Intl.supportedValuesOf === 'function') {
    tzList = Intl.supportedValuesOf('timeZone');
  }
} catch (e) { /* fall back to the curated list above */ }

const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
if (!tzList.includes(browserTz)) tzList = [browserTz, ...tzList];

// Only the region prefix (e.g. "America", "Europe") has an established Latin/
// Spanish name across the whole IANA list - the city/location part after the
// slash is left as-is (see TZ_REGION_NAMES in i18n.py for why).
function populateTimezoneOptions() {
  const left = leftSel.value;
  const regionNames = (DATA.tz_region_names && DATA.tz_region_names[left]) || {};
  const prev = tzSel.value;
  tzSel.innerHTML = '';
  for (const tz of tzList) {
    const o = document.createElement('option');
    o.value = tz;
    const slash = tz.indexOf('/');
    if (slash === -1) {
      o.textContent = tz.replace(/_/g, ' ');
    } else {
      const region = tz.slice(0, slash);
      const rest = tz.slice(slash + 1).replace(/_/g, ' ');
      o.textContent = (regionNames[region] || region) + ' / ' + rest;
    }
    tzSel.appendChild(o);
  }
  tzSel.value = prev && tzList.includes(prev) ? prev : browserTz;
}

function isoDateInTimeZone(tz) {
  // en-CA locale formats as YYYY-MM-DD, convenient for direct comparison with DATA.dates keys
  return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' })
    .format(new Date());
}

// Picks "today" in the given timezone if that date was actually pre-built;
// otherwise falls back to whichever generated date is closest to it, since
// this is still a static page with a fixed, finite window of days baked in.
function closestAvailableDate(isoTarget) {
  if (DATA.dates[isoTarget]) return isoTarget;
  const targetMs = new Date(isoTarget).getTime();
  let best = DATA.date_order[0];
  let bestDiff = Infinity;
  for (const iso of DATA.date_order) {
    const diff = Math.abs(new Date(iso).getTime() - targetMs);
    if (diff < bestDiff) { bestDiff = diff; best = iso; }
  }
  return best;
}

const TZNOTE_TEXT = {
  en: (today, tz, first, last) => `&#9888; Today is <strong>${today}</strong> in ${tz}, which is outside the ` +
    `range of dates generated for this demo (<strong>${first}</strong> to <strong>${last}</strong>). ` +
    `Showing the closest available date instead.`,
  es: (today, tz, first, last) => `&#9888; Hoy es <strong>${today}</strong> en ${tz}, fecha fuera del ` +
    `intervalo generado para esta demo (<strong>${first}</strong> a <strong>${last}</strong>). ` +
    `Se muestra la fecha disponible más cercana.`,
  la: (today, tz, first, last) => `&#9888; Hodie est <strong>${today}</strong> in ${tz}, dies extra ` +
    `intervallum ad hanc demonstrationem generatum (<strong>${first}</strong> usque ad <strong>${last}</strong>). ` +
    `Dies proxima disponibilis ostenditur.`,
};

function updateTzNote() {
  const left = leftSel.value;
  const tz = tzSel.value;
  const todayInTz = isoDateInTimeZone(tz);
  if (DATA.dates[todayInTz]) {
    tzNote.style.display = 'none';
  } else {
    tzNote.style.display = '';
    const first = DATA.date_order[0], last = DATA.date_order[DATA.date_order.length - 1];
    const build = TZNOTE_TEXT[left] || TZNOTE_TEXT.en;
    tzNote.innerHTML = build(todayInTz, tz.replace(/_/g, ' '), first, last);
  }
}

function onTzChange() {
  updateTzNote();
  dateSel.value = closestAvailableDate(isoDateInTimeZone(tzSel.value));
  render();
}
tzSel.addEventListener('change', onTzChange);

for (const code of DATA.languages) {
  for (const sel of [leftSel, rightSel]) {
    const o = document.createElement('option');
    o.value = code; o.textContent = LANG_NAMES[code] || code;
    sel.appendChild(o);
  }
}
leftSel.value = DATA.languages[0];
rightSel.value = DATA.languages[1] || DATA.languages[0];

function populateHourOptions() {
  const left = leftSel.value;
  const prev = hourSel.value;
  const labels = (DATA.hour_labels && DATA.hour_labels[left]) || {};
  const comingSoon = (DATA.chrome_labels[left] || DATA.chrome_labels.en).coming_soon;
  hourSel.innerHTML = '';
  for (const h of DATA.hour_order) {
    const o = document.createElement('option');
    o.value = h;
    o.textContent = labels[h] || h;
    if (!DATA.implemented_hours.includes(h)) {
      o.disabled = true;
      o.textContent += ' ' + comingSoon;
    }
    hourSel.appendChild(o);
  }
  hourSel.value = DATA.hour_order.includes(prev) ? prev : DATA.default_hour;
}

// Everything on the page - not just liturgical content - follows whichever
// language is on the left ("main"): control labels, the Hour names, the Date
// picker, the date heading. The right side is either "the vernacular" (when
// the main language is Latin) or just "a translation" (when it's already a
// vernacular language) - never a second thing to pick a hymn to sing in.
function updateChromeLabels() {
  const left = leftSel.value;
  const cl = DATA.chrome_labels[left] || DATA.chrome_labels.en;
  document.getElementById('tzLabel').textContent = cl.timezone;
  document.getElementById('dateLabel').textContent = cl.date;
  document.getElementById('hourLabel').textContent = cl.hour;
  document.getElementById('leftLabel').textContent = cl.main;
  document.getElementById('rightLabel').textContent = (left === 'la') ? cl.vernacular : cl.translation;
}

function applyChrome() {
  updateChromeLabels();
  populateHourOptions();
  populateDateOptions();
  populateTimezoneOptions();
  updateTzNote();
  render();
}
leftSel.addEventListener('change', applyChrome);

// First run: builds every dropdown (so dateSel actually has options), then
// picks "today" in the browser's own timezone now that there's something to
// select - applyChrome() alone would leave dateSel on its first option.
applyChrome();
dateSel.value = closestAvailableDate(isoDateInTimeZone(browserTz));
render();

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// breviarium-core's own text fields (responsorios, preces) carry a light
// markup convention meant for ITS renderer: '$X$' wraps a versicle/response
// marker (e.g. '$V. $') that should stand out, '_X_' wraps a fixed refrain
// that should be italic. Left alone, those literal $ and _ characters were
// leaking straight into the page. Applied AFTER esc() so the <strong>/<em>
// tags it introduces don't get escaped themselves.
function mdLite(escaped) {
  return escaped
    .replace(/\$([^$]*)\$/g, '<strong>$1</strong>')
    .replace(/_([^_]*)_/g, '<em>$1</em>');
}

function renderUnitContent(unit, lang) {
  const val = unit.content ? unit.content[lang] : null;
  if (val === null || val === undefined) return '<em>[not yet sourced]</em>';
  return mdLite(esc(val)).replace(/\n/g, '<br>');
}

// Psalms and canticles are stored as [verseNumber, text] pairs; hymns and the
// Our Father are stored as plain ordered line arrays. Both get aligned row by
// row (verse-by-verse / line-by-line) rather than as two whole stacked blocks,
// since the source data already keys them that way - a block-level pairing
// was only ever an approximation of that finer alignment.
function renderAlignedRows(unit, left, right, single) {
  const isPsalm = (unit.kind === 'psalm');
  const missingLabel = isPsalm ? '[missing]' : '[not yet sourced]';
  const leftRaw = unit.content ? unit.content[left] : null;
  const rightRaw = single ? leftRaw : (unit.content ? unit.content[right] : null);
  const leftEmpty = !leftRaw || leftRaw.length === 0;
  const rightEmpty = !rightRaw || rightRaw.length === 0;

  if (leftEmpty && rightEmpty) {
    return single
      ? `<tr><td class="single"><em>${missingLabel}</em></td></tr>`
      : `<tr><td class="col-left"><em>${missingLabel}</em></td><td class="col-right"><em>${missingLabel}</em></td></tr>`;
  }

  if (!single) {
    var rows = `<tr><td class="col-left"><div class="unit-label">${left.toUpperCase()}</div></td>` +
                `<td class="col-right"><div class="unit-label">${right.toUpperCase()}</div></td></tr>`;
  } else {
    var rows = '';
  }

  if (isPsalm) {
    const leftMap = new Map((leftRaw || []).map(([n, t]) => [String(n), t]));
    const rightMap = new Map((rightRaw || []).map(([n, t]) => [String(n), t]));
    const nums = Array.from(new Set([...leftMap.keys(), ...rightMap.keys()]))
      .sort((a, b) => parseInt(a, 10) - parseInt(b, 10));
    for (const n of nums) {
      const lt = leftMap.has(n) ? `<span class="vn">${esc(n)}</span> ${esc(leftMap.get(n))}` : '<em>&mdash;</em>';
      if (single) {
        rows += `<tr><td class="single">${lt}</td></tr>`;
      } else {
        const rt = rightMap.has(n) ? `<span class="vn">${esc(n)}</span> ${esc(rightMap.get(n))}` : '<em>&mdash;</em>';
        rows += `<tr><td class="col-left">${lt}</td><td class="col-right">${rt}</td></tr>`;
      }
    }
    return rows;
  }

  // 'lines' kind: aligned by position, not by any shared numbering.
  const maxLen = Math.max(leftRaw ? leftRaw.length : 0, rightRaw ? rightRaw.length : 0);
  for (let i = 0; i < maxLen; i++) {
    const lt = (leftRaw && leftRaw[i] !== undefined) ? mdLite(esc(leftRaw[i])) : '<em>&mdash;</em>';
    if (single) {
      rows += `<tr><td class="single hymn-line">${lt}</td></tr>`;
    } else {
      const rt = (rightRaw && rightRaw[i] !== undefined) ? mdLite(esc(rightRaw[i])) : '<em>&mdash;</em>';
      rows += `<tr><td class="col-left hymn-line">${lt}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    }
  }
  return rows;
}

// The hymn block picks WHICH HYMN to sing from that Hour's pool via its own
// dropdown, independent of leftLang/rightLang - these are Latin compositions,
// so the dropdown only ever offers a hymn's own original_language (there's no
// such thing as "this Latin hymn, but sung in Spanish"; a translation is for
// following along, not a second thing to pick). Its DEFAULT ordering favors
// hymns whose original language matches leftLang. rightLang always drives a
// translation of that same hymn, same as everywhere else on the page.
function renderHymnChoiceRows(unit, left, right) {
  const ctx = unit.hour;
  const pool = (DATA.hymn_pools && DATA.hymn_pools[ctx]) || [];
  const opts = pool
    .filter(h => h.lines[h.original_language] && h.lines[h.original_language].length)
    .map(h => ({ id: h.id, lang: h.original_language, title: h.title }));
  if (opts.length === 0) {
    return `<tr><td colspan="2"><em>[not yet sourced]</em></td></tr>`;
  }
  opts.sort((a, b) => (a.lang === left ? 0 : 1) - (b.lang === left ? 0 : 1));

  let choiceId = hymnChoiceByHour[ctx];
  if (!choiceId || !opts.some(o => o.id === choiceId)) {
    choiceId = opts[0].id;
    hymnChoiceByHour[ctx] = choiceId;
  }

  let selectHtml = `<select class="hymn-select" data-hour="${esc(ctx)}">`;
  for (const o of opts) {
    const picked = (o.id === choiceId) ? ' selected' : '';
    selectHtml += `<option value="${esc(o.id)}"${picked}>` +
      `${esc(o.title)} (${esc(LANG_NAMES[o.lang] || o.lang)})</option>`;
  }
  selectHtml += `</select>`;
  let rows = `<tr><td colspan="2" class="hymn-picker">${selectHtml}</td></tr>`;

  const hymn = pool.find(h => h.id === choiceId);
  const sungLines = hymn.lines[hymn.original_language] || [];
  const translatedLines = hymn.lines[right] || [];
  const single = (hymn.original_language === right);

  if (single) {
    for (const line of sungLines) {
      rows += `<tr><td class="single hymn-line">${esc(line)}</td></tr>`;
    }
  } else if (translatedLines.length === 0) {
    sungLines.forEach((line, i) => {
      const rt = (i === 0) ? '<em>[not yet sourced]</em>' : '';
      rows += `<tr><td class="col-left hymn-line">${esc(line)}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    });
  } else {
    const maxLen = Math.max(sungLines.length, translatedLines.length);
    for (let i = 0; i < maxLen; i++) {
      const lt = sungLines[i] !== undefined ? esc(sungLines[i]) : '';
      const rt = translatedLines[i] !== undefined ? esc(translatedLines[i]) : '';
      rows += `<tr><td class="col-left hymn-line">${lt}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    }
  }
  return rows;
}

function onHymnSelectChange(e) {
  const sel = e.target;
  hymnChoiceByHour[sel.dataset.hour] = sel.value;
  render();
}

function render() {
  const dayData = DATA.dates[dateSel.value];
  const left = leftSel.value, right = rightSel.value;
  const hour = hourSel.value;
  const single = (left === right);

  // The heading leads with what's actually being celebrated (a feast/solemnity
  // name, or the full ferial description) - never the bare weekday label alone,
  // since "Feria V" on a major feast day would misleadingly read as "just an
  // ordinary Thursday." The raw calendar date is secondary, shown underneath.
  document.getElementById('dateHeading').innerHTML = dayData.day_description[left] || dayData.day_description.en;
  document.getElementById('metaLine').textContent = (dayData.date_human[left] || dayData.date_human.en);

  const units = dayData.hours[hour] || [];
  const labels = DATA.unit_labels[left] || DATA.unit_labels.en;
  const table = document.getElementById('mainTable');
  let html = '';
  for (const unit of units) {
    let labelText = labels[unit.label] || unit.label;
    if (unit.repeated) labelText += ' ' + (labels.repeated || '');
    if (unit.ref) labelText += ` (${esc(unit.ref)})`;
    html += `<tr><th colspan="2">${esc(labelText)}</th></tr>`;
    if (unit.label === 'psalmody_gap') {
      html += `<tr><td colspan="2"><em>${esc(labels.psalmody_gap_note || labels.missing)}</em></td></tr>`;
    } else if (unit.kind === 'psalm' || unit.kind === 'lines') {
      html += renderAlignedRows(unit, left, right, single);
    } else if (unit.kind === 'hymn_choice') {
      html += renderHymnChoiceRows(unit, left, right);
    } else if (single) {
      html += `<tr><td class="single">${renderUnitContent(unit, left)}</td></tr>`;
    } else {
      html += `<tr><td class="col-left"><div class="unit-label">${left.toUpperCase()}</div>${renderUnitContent(unit, left)}</td>` +
              `<td class="col-right"><div class="unit-label">${right.toUpperCase()}</div>${renderUnitContent(unit, right)}</td></tr>`;
    }
  }
  table.innerHTML = html;
  table.querySelectorAll('.hymn-select').forEach(sel => sel.addEventListener('change', onHymnSelectChange));
}

leftSel.addEventListener('change', render);
rightSel.addEventListener('change', render);
hourSel.addEventListener('change', render);
dateSel.addEventListener('change', render);
render();
</script>
</body></html>
