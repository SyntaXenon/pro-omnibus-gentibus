 "dichosa puerta del cielo.", "", "Tomando aquel Ave", "de labios de Gabriel,", "afiánzanos en paz,", "cambiando el nombre de Eva.", "", "Suelta las cadenas de los culpables,", "trae la luz a los ciegos,", "aleja nuestros males,", "pide para nosotros todos los bienes.", "", "Muéstrate ser madre,", "reciba por ti nuestras súplicas", "quien, nacido por nosotros,", "quiso ser hijo tuyo.", "", "Virgen sin igual,", "mansa entre todas,", "líbranos de nuestras culpas", "y haznos mansos y castos.", "", "Danos una vida pura,", "prepáranos un camino seguro,", "para que, viendo a Jesús,", "nos gocemos siempre juntos.", "", "Sea la alabanza a Dios Padre,", "la gloria al altísimo Cristo,", "al Espíritu Santo,", "un mismo honor a los tres. Amén."]}}, {"id": "vexilla_regis_prodeunt", "title": "Vexilla Regis Prodeunt", "original_language": "la", "lines": {"la": ["Vexilla Regis prodeunt:", "fulget Crucis mysterium,", "qua vita mortem pertulit,", "et morte vitam protulit.", "", "Quae vulnerata lanceae", "mucrone diro, criminum", "ut nos lavaret sordibus,", "manavit unda et sanguine.", "", "Impleta sunt quae concinit", "David fideli carmine,", "dicendo nationibus:", "regnavit a ligno Deus.", "", "O Crux ave, spes unica,", "hoc Passionis tempore", "piis adauge gratiam,", "reisque dele crimina.", "", "Te, fons salutis Trinitas,", "collaudet omnis spiritus:", "quibus Crucis victoriam", "largiris, adde praemium. Amen."], "es": ["Los estandartes del Rey avanzan:", "resplandece el misterio de la Cruz,", "por la cual la Vida sufrió la muerte,", "y con la muerte produjo la vida.", "", "La cual, herida por la punta", "cruel de la lanza, para lavarnos", "de la mancha de nuestros pecados,", "manó agua y sangre.", "", "Se cumplió lo que cantó", "David en su fiel poema,", "diciendo a las naciones:", "Dios reinó desde el madero.", "", "Salve, oh Cruz, única esperanza,", "en este tiempo de la Pasión", "aumenta la gracia a los piadosos,", "y borra los pecados de los culpables.", "", "A ti, Trinidad, fuente de salvación,", "te alabe todo espíritu:", "a quienes la victoria de la Cruz", "concedes, añade la recompensa. Amén."]}}, {"id": "conditor_alme_siderum", "title": "Conditor Alme Siderum", "original_language": "la", "lines": {"la": ["Conditor alme siderum,", "aeterna lux credentium,", "Christe, redemptor omnium,", "exaudi preces supplicum.", "", "Qui condolens interitu", "mortis perire saeculum,", "salvasti mundum languidum,", "donans reis remedium.", "", "Vergente mundi vespere,", "uti sponsus de thalamo,", "egressus honestissima", "Virginis matris clausula.", "", "Cuius forti potentiae", "genu curvantur omnia;", "caelestia, terrestria", "nutu fatentur subdita.", "", "Te, Sancte, fide quaesumus,", "venture iudex saeculi,", "conserva nos in tempore", "hostis a telo perfidi.", "", "Sit, Christe, rex piissime,", "tibi Patrique gloria", "cum Spiritu Paraclito,", "in sempiterna saecula. Amen."], "es": ["Creador bondadoso de los astros,", "luz eterna de los creyentes,", "Cristo, redentor de todos,", "escucha las súplicas de los que te imploran.", "", "Tú que, apiadado de que el mundo", "pereciera en la ruina de la muerte,", "salvaste al mundo enfermo,", "dando remedio a los culpables.", "", "Cuando declinaba la tarde del mundo,", "como esposo que sale del tálamo,", "saliste del honestísimo", "seno de tu Madre Virgen.", "", "Ante cuyo fuerte poder", "se doblan todas las rodillas;", "los seres celestes y terrestres", "confiesan someterse a tu mandato.", "", "A ti, Santo, con fe te suplicamos,", "que has de venir como juez del mundo,", "consérvanos a tiempo", "libres del dardo del enemigo pérfido.", "", "Sea, oh Cristo, rey piadosísimo,", "gloria a ti y al Padre", "con el Espíritu Paráclito,", "por los siglos sempiternos. Amén."]}}, {"id": "pange_lingua_gloriosi", "title": "Pange Lingua Gloriosi Corporis Mysterium", "original_language": "la", "lines": {"la": ["Pange, lingua, gloriosi", "Corporis mysterium,", "Sanguinisque pretiosi,", "quem in mundi pretium", "fructus ventris generosi", "Rex effudit gentium.", "", "Nobis datus, nobis natus", "ex intacta Virgine,", "et in mundo conversatus,", "sparso verbi semine,", "sui moras incolatus", "miro clausit ordine.", "", "In supremae nocte cenae", "recumbens cum fratribus,", "observata lege plene", "cibis in legalibus,", "cibum turbae duodenae", "se dat suis manibus.", "", "Verbum caro, panem verum", "verbo carnem efficit:", "fitque sanguis Christi merum,", "et si sensus deficit,", "ad firmandum cor sincerum", "sola fides sufficit.", "", "Tantum ergo Sacramentum", "veneremur cernui:", "et antiquum documentum", "novo cedat ritui:", "praestet fides supplementum", "sensuum defectui.", "", "Genitori, Genitoque", "laus et iubilatio,", "salus, honor, virtus quoque", "sit et benedictio:", "procedenti ab utroque", "compar sit laudatio. Amen."], "es": ["Canta, lengua, el misterio", "del glorioso Cuerpo,", "y de la preciosa Sangre,", "que como precio del mundo,", "fruto de un vientre generoso,", "derramó el Rey de las naciones.", "", "Dado a nosotros, nacido para nosotros", "de una Virgen intacta,", "y habiendo vivido en el mundo", "sembrando la semilla de la Palabra,", "concluyó el tiempo de su estancia", "con un orden admirable.", "", "En la noche de la última cena,", "reclinado con sus hermanos,", "habiendo cumplido plenamente la ley", "en cuanto a los alimentos rituales,", "se da como alimento a los doce", "con sus propias manos.", "", "El Verbo hecho carne, con su palabra", "convierte en carne el pan verdadero:", "y el vino se hace sangre de Cristo,", "y si los sentidos no alcanzan,", "para afirmar el corazón sincero", "basta sólo la fe.", "", "Un Sacramento tan grande", "veneremos, pues, inclinados:", "y ceda el antiguo precepto", "al nuevo rito:", "que la fe supla", "lo que falta a los sentidos.", "", "Al Engendrador y al Engendrado", "sea la alabanza y el júbilo,", "la salud, el honor y también el poder", "y la bendición:", "y al que procede de ambos", "sea dada igual alabanza. Amén."]}}, {"id": "deus_tuorum_militum", "title": "Deus Tuorum Militum", "original_language": "la", "lines": {"la": ["Deus tuorum militum", "sors, et corona, praemium,", "laudes canentes Martyris", "absolve nexu criminis.", "", "Hic nempe mundi gaudia", "et blandimenta noxia", "caduca rite deputans,", "pervenit ad caelestia.", "", "Poenas cucurrit fortiter", "et sustulit viriliter,", "fundensque pro te sanguinem,", "aeterna dona possidet.", "", "Ob hoc precatu supplici", "te poscimus, piissime;", "in hoc triumpho Martyris", "dimitte noxam servulis.", "", "Laus et perennis gloria", "Deo Patri et Filio,", "Sancto simul Paraclito,", "in sempiterna saecula. Amen."], "es": ["Dios, suerte, corona y premio", "de tus soldados,", "a nosotros, que cantamos las alabanzas del Mártir,", "líbranos del lazo del pecado.", "", "Éste, en verdad, teniendo por caducos", "los gozos del mundo", "y sus dañinas seducciones,", "llegó a los bienes celestiales.", "", "Corrió fuertemente hacia las penas", "y las soportó con valentía,", "y derramando su sangre por ti,", "posee ahora los dones eternos.", "", "Por esto, con súplica humilde", "te lo pedimos, piadosísimo;", "en este triunfo del Mártir,", "perdona la culpa a tus siervos.", "", "Alabanza y gloria perpetua", "a Dios Padre y al Hijo,", "juntamente al Espíritu Santo Paráclito,", "por los siglos sempiternos. Amén."]}}, {"id": "o_lux_beata_trinitas", "title": "O Lux Beata Trinitas", "original_language": "la", "lines": {"la": ["O lux beata Trinitas,", "et principalis Unitas,", "iam sol recedit igneus:", "infunde lumen cordibus.", "", "Te mane laudum carmine,", "te deprecemur vespere:", "te nostra supplex gloria", "per cuncta laudet saecula.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Oh luz bienaventurada, Trinidad,", "y Unidad primera,", "ya el sol ígneo se retira:", "infunde tu luz en los corazones.", "", "A ti te alabemos por la mañana con cánticos,", "a ti te supliquemos al atardecer:", "que nuestra súplica te glorifique", "por todos los siglos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y para siempre. Amén."]}}, {"id": "exsultet_caelum_laudibus", "title": "Exsultet Caelum Laudibus", "original_language": "la", "lines": {"la": ["Exsultet caelum laudibus,", "resultet terra gaudiis,", "Apostolorum gloriam", "sacra canunt sollemnia.", "", "Vos, saecli iusti iudices", "et vera mundi lumina,", "votis precamur cordium:", "audite preces supplicum.", "", "Qui caelum verbo clauditis", "serasque eius solvitis,", "nos a peccatis omnibus", "solvite iussu, quaesumus.", "", "Quorum praecepto subditur", "salus et languor omnium,", "sanate mentes languidas,", "augete nos virtutibus.", "", "Ut, cum iudex advenerit", "Christus in fine saeculi,", "nos sempiterni gaudii", "faciat esse compotes.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "nunc et per omne saeculum. Amen."], "es": ["Exulte el cielo con alabanzas,", "resuene la tierra con gozos,", "la sagrada solemnidad canta", "la gloria de los Apóstoles.", "", "A vosotros, justos jueces del mundo", "y verdaderas luces del orbe,", "os rogamos con los votos de nuestros corazones:", "escuchad las preces de los suplicantes.", "", "Vosotros que con la palabra cerráis el cielo", "y desatáis sus cerrojos,", "libradnos de todos los pecados,", "os lo rogamos, por vuestro mandato.", "", "A cuyo mandato está sometida", "la salud y la enfermedad de todos,", "sanad nuestras mentes enfermas,", "aumentadnos en virtudes.", "", "Para que, cuando venga como juez", "Cristo al final de los siglos,", "nos haga partícipes", "del gozo sempiterno.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por todos los siglos. Amén."]}}, {"id": "iste_confessor", "title": "Iste Confessor", "original_language": "la", "lines": {"la": ["Iste confessor Domini, colentes", "quem pie laudant populi per orbem,", "hac die laetus meruit supremos", "laudis honores.", "", "Qui pius, prudens, humilis, pudicus,", "sobriam duxit sine labe vitam,", "donec humanos animavit aurae", "spiritus artus.", "", "Cuius ob praestans meritum, frequenter,", "aegra quae passim iacuere membra,", "viribus morbi domitis, saluti", "restituuntur.", "", "Noster hinc illi chorus obsequentem", "concinit laudem celebresque palmas,", "ut piis eius meritis iuvemur", "omne per aevum.", "", "Sit salus illi, decus atque virtus,", "qui, supra caeli residens cacumen,", "totius mundi seriem gubernat,", "trinus et unus. Amen."], "es": ["Este confesor del Señor, a quien", "los pueblos veneran piadosamente por todo el orbe,", "mereció alegre en este día los sumos", "honores de alabanza.", "", "El cual, piadoso, prudente, humilde y casto,", "llevó una vida sobria sin mancha,", "mientras el aliento de vida animó", "sus miembros humanos.", "", "Por cuyo excelente mérito, con frecuencia,", "los miembros enfermos que yacían por doquier,", "vencidas las fuerzas de la enfermedad, a la salud", "son restituidos.", "", "Por esto, nuestro coro le canta", "una alabanza obsequiosa y célebres palmas,", "para que por sus piadosos méritos seamos ayudados", "por toda la eternidad.", "", "Sea para él la salud, el honor y el poder,", "que, sentado sobre la cumbre del cielo,", "gobierna el curso de todo el mundo,", "trino y uno. Amén."]}}, {"id": "lucis_creator_optime", "title": "Lucis Creator Optime", "original_language": "la", "lines": {"la": ["Lucis Creator optime,", "lucem dierum proferens,", "primordiis lucis novae", "mundi parans originem;", "", "Qui mane iunctum vesperi", "diem vocari praecipis:", "taetrum chaos illabitur,", "audi preces cum fletibus.", "", "Ne mens gravata crimine", "vitae sit exsul munere,", "dum nil perenne cogitat", "seseque culpis illigat.", "", "Caeleste pulset ostium,", "vitale tollat praemium;", "vitemus omne noxium,", "purgemus omne pessimum.", "", "Praesta, Pater piissime,", "Patrique compar Unice,", "cum Spiritu Paraclito", "regnans per omne saeculum. Amen."], "es": ["Óptimo Creador de la luz,", "que produces la luz de los días,", "y en los primeros albores de la nueva luz", "preparaste el origen del mundo;", "", "Tú que mandas que se llame día", "a la mañana unida con la tarde:", "el horrible caos se desliza sobre nosotros,", "escucha nuestras preces con llanto.", "", "Que nuestra mente, cargada de pecado,", "no quede excluida del don de la vida,", "mientras no piensa en nada eterno", "y se enreda a sí misma en culpas.", "", "Que llame a la puerta celestial,", "que alcance el premio de la vida;", "evitemos todo lo dañino,", "purguemos todo lo pésimo.", "", "Concédelo, Padre piadosísimo,", "y también tú, Unigénito igual al Padre,", "que reinas con el Espíritu Paráclito", "por todos los siglos. Amén."]}}], "lauds": [{"id": "iste_confessor", "title": "Iste Confessor", "original_language": "la", "lines": {"la": ["Iste confessor Domini, colentes", "quem pie laudant populi per orbem,", "hac die laetus meruit supremos", "laudis honores.", "", "Qui pius, prudens, humilis, pudicus,", "sobriam duxit sine labe vitam,", "donec humanos animavit aurae", "spiritus artus.", "", "Cuius ob praestans meritum, frequenter,", "aegra quae passim iacuere membra,", "viribus morbi domitis, saluti", "restituuntur.", "", "Noster hinc illi chorus obsequentem", "concinit laudem celebresque palmas,", "ut piis eius meritis iuvemur", "omne per aevum.", "", "Sit salus illi, decus atque virtus,", "qui, supra caeli residens cacumen,", "totius mundi seriem gubernat,", "trinus et unus. Amen."], "es": ["Este confesor del Señor, a quien", "los pueblos veneran piadosamente por todo el orbe,", "mereció alegre en este día los sumos", "honores de alabanza.", "", "El cual, piadoso, prudente, humilde y casto,", "llevó una vida sobria sin mancha,", "mientras el aliento de vida animó", "sus miembros humanos.", "", "Por cuyo excelente mérito, con frecuencia,", "los miembros enfermos que yacían por doquier,", "vencidas las fuerzas de la enfermedad, a la salud", "son restituidos.", "", "Por esto, nuestro coro le canta", "una alabanza obsequiosa y célebres palmas,", "para que por sus piadosos méritos seamos ayudados", "por toda la eternidad.", "", "Sea para él la salud, el honor y el poder,", "que, sentado sobre la cumbre del cielo,", "gobierna el curso de todo el mundo,", "trino y uno. Amén."]}}, {"id": "ut_queant_laxis", "title": "Ut Queant Laxis", "original_language": "la", "lines": {"la": ["Ut queant laxis", "resonare fibris", "mira gestorum", "famuli tuorum,", "solve polluti", "labii reatum,", "Sancte Ioannes.", "", "Nuntius celso veniens Olympo,", "te patri magnum fore nasciturum,", "nomen, et vitae seriem gerendae", "ordine promit.", "", "Ille promissi dubius superni,", "perdidit promptae modulos loquelae:", "sed reformasti genitus peremptae", "organa vocis.", "", "Ventris obstruso positus cubili", "senseras Regem thalamo manentem:", "hinc parens nati meritis uterque", "abdita pandit.", "", "Sit decus Patri, genitaeque Proli,", "et tibi compar utriusque semper", "Spiritus alme, Deus unus, omni", "tempore saecli. Amen."], "es": ["Para que puedan", "resonar con voces desatadas", "las maravillas de las hazañas", "de tus siervos,", "libra de culpa", "nuestros labios manchados,", "san Juan.", "", "Un mensajero, viniendo del alto cielo,", "anuncia a tu padre que ibas a nacer grande,", "y revela en orden tu nombre", "y el curso de la vida que llevarías.", "", "Él, dudando de la promesa celestial,", "perdió el uso pronto de la palabra:", "pero tú, ya nacido, restauraste", "los órganos de su voz perdida.", "", "Colocado en el cerrado lecho del vientre,", "sentiste al Rey que permanecía en su tálamo:", "de ahí que ambos padres, por los méritos del hijo,", "revelan lo oculto.", "", "Sea la gloria al Padre, y al Hijo engendrado,", "y a ti, igual a ambos siempre,", "Espíritu bondadoso, Dios uno, por todo", "el tiempo del siglo. Amén."]}}, {"id": "veni_creator_spiritus", "title": "Veni Creator Spiritus", "original_language": "la", "lines": {"la": ["Veni, Creator Spiritus,", "mentes tuorum visita,", "imple superna gratia", "quae tu creasti pectora.", "", "Qui diceris Paraclitus,", "altissimi donum Dei,", "fons vivus, ignis, caritas,", "et spiritalis unctio.", "", "Tu septiformis munere,", "digitus paternae dexterae,", "tu rite promissum Patris,", "sermone ditans guttura.", "", "Accende lumen sensibus,", "infunde amorem cordibus,", "infirma nostri corporis", "virtute firmans perpeti.", "", "Hostem repellas longius,", "pacemque dones protinus;", "ductore sic te praevio", "vitemus omne noxium.", "", "Per te sciamus da Patrem,", "noscamus atque Filium;", "teque utriusque Spiritum", "credamus omni tempore.", "", "Deo Patri sit gloria,", "et Filio, qui a mortuis", "surrexit, ac Paraclito,", "in saeculorum saecula. Amen."], "es": ["Ven, Espíritu Creador,", "visita las mentes de los tuyos,", "llena de gracia celestial", "los pechos que Tú creaste.", "", "Tú, que eres llamado Paráclito,", "don del Dios altísimo,", "fuente viva, fuego, caridad,", "y unción espiritual.", "", "Tú, séptuple en tus dones,", "dedo de la diestra del Padre,", "tú, la promesa fielmente hecha por el Padre,", "que enriqueces las gargantas con la palabra.", "", "Enciende la luz en nuestros sentidos,", "infunde el amor en nuestros corazones,", "y las debilidades de nuestro cuerpo", "fortalécelas con virtud perpetua.", "", "Rechaza lejos al enemigo,", "y danos pronto la paz;", "así, contigo como guía,", "evitemos todo mal.", "", "Concédenos conocer por ti al Padre,", "y también conocer al Hijo;", "y a ti, Espíritu de ambos,", "creamos en todo tiempo.", "", "Gloria sea a Dios Padre,", "y al Hijo, que de entre los muertos", "resucitó, y al Paráclito,", "por los siglos de los siglos. Amén."]}}, {"id": "aeterne_rerum_conditor", "title": "Aeterne Rerum Conditor", "original_language": "la", "lines": {"la": ["Aeterne rerum Conditor,", "noctem diemque qui regis,", "et temporum das tempora,", "ut alleves fastidium;", "", "Praeco diei iam sonat,", "noctis profundae excubitor,", "nocturna lux viantibus", "a nocte noctem segregans.", "", "Hoc excitatus Lucifer", "solvit polum caligine;", "hoc omnis erronum cohors", "vias nocendi deserit.", "", "Iesu, labentes respice,", "et nos videndo corrige;", "si respicis, lapsus cadunt,", "fletuque culpa solvitur.", "", "Tu, lux, refulge sensibus,", "somnumque mentis discute;", "te nostra vox primum sonet,", "et vota solvamus tibi.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "nunc et per omne saeculum. Amen."], "es": ["Eterno Creador de todas las cosas,", "que riges la noche y el día,", "y das los tiempos a los tiempos,", "para aliviar nuestro hastío;", "", "Ya suena el heraldo del día,", "centinela de la profunda noche,", "luz nocturna para los caminantes,", "que separa la noche de la noche.", "", "Al oírlo, el Lucero", "libra al cielo de su oscuridad;", "al oírlo, toda hueste de malhechores", "abandona sus caminos de hacer daño.", "", "Jesús, mira a los que caen,", "y corrígenos mirándonos;", "si tú miras, las caídas cesan,", "y la culpa se disuelve con el llanto.", "", "Tú, luz, resplandece en nuestros sentidos,", "y disipa el sueño de la mente;", "que nuestra voz te cante primero a ti,", "y cumplamos para ti nuestros votos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por todos los siglos. Amén."]}}, {"id": "ecce_iam_noctis", "title": "Ecce Jam Noctis", "original_language": "la", "lines": {"la": ["Ecce iam noctis tenuatur umbra,", "lucis aurora rutilans coruscat;", "nisibus totis rogitemus omnes", "Cunctipotentem,", "", "Ut Deus, nostri miseratus, omnem", "pellat languorem, tribuat salutem,", "donet et nobis pietate patris", "regna polorum.", "", "Praestet hoc nobis Deitas beata", "Patris ac Nati, pariterque Sancti", "Spiritus, cuius resonat per omnem", "gloria mundum. Amen."], "es": ["He aquí que ya se adelgaza la sombra de la noche,", "y brilla resplandeciente la aurora de la luz;", "roguemos todos con todo empeño", "al Todopoderoso,", "", "Para que Dios, apiadado de nosotros,", "aleje toda enfermedad y conceda la salud,", "y nos dé, con piedad de padre,", "los reinos celestiales.", "", "Concédanos esto la bienaventurada Deidad", "del Padre y del Hijo, y también del Santo", "Espíritu, cuya gloria resuena", "por todo el mundo. Amén."]}}], "compline": [{"id": "te_lucis_ante_terminum", "title": "Te Lucis Ante Terminum", "original_language": "la", "lines": {"la": ["Te lucis ante terminum,", "rerum creator, poscimus,", "ut pro tua clementia", "sis praesul et custodia.", "", "Procul recedant somnia", "et noctium phantasmata;", "hostemque nostrum comprime,", "ne polluantur corpora.", "", "Praesta, Pater omnipotens,", "per Iesum Christum Dominum,", "qui tecum in perpetuum", "regnat cum Sancto Spiritu. Amen."], "es": ["Antes de que acabe la luz,", "te pedimos, Creador de todas las cosas,", "que por tu clemencia", "seas nuestro guardián y custodia.", "", "Aléjense lejos los sueños", "y los fantasmas de la noche;", "reprime a nuestro enemigo,", "para que nuestros cuerpos no se manchen.", "", "Concédenos esto, Padre omnipotente,", "por Jesucristo el Señor,", "que contigo por siempre", "reina con el Espíritu Santo. Amén."]}}, {"id": "christe_qui_lux_es_et_dies", "title": "Christe, Qui Lux Es Et Dies", "original_language": "la", "lines": {"la": ["Christe, qui lux es et dies,", "noctis tenebras detegis,", "lucisque lumen crederis,", "lumen beatum praedicans.", "", "Precamur, sancte Domine,", "defende nos in hac nocte,", "sit nobis in te requies,", "quietam noctem tribue.", "", "Ne gravis somnus irruat,", "nec hostis nos surripiat,", "nec caro illi consentiens,", "nos tibi reos statuat.", "", "Oculi somnum capiant,", "cor semper ad te vigilet,", "dextera tua protegat", "famulos qui te diligunt.", "", "Defensor noster, aspice,", "insidiantes reprime,", "guberna tuos famulos,", "quos sanguine mercatus es.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Cristo, que eres luz y día,", "que descubres las tinieblas de la noche,", "y eres proclamado la luz de la luz,", "anunciando la luz bienaventurada.", "", "Te suplicamos, santo Señor,", "defiéndenos en esta noche,", "sea en ti nuestro descanso,", "concédenos una noche tranquila.", "", "Que no nos asalte un sueño pesado,", "ni el enemigo nos sorprenda,", "ni la carne, consintiendo con él,", "nos declare culpables ante ti.", "", "Que los ojos tomen el sueño,", "pero el corazón vele siempre hacia ti,", "que tu diestra proteja", "a los siervos que te aman.", "", "Defensor nuestro, mira,", "reprime a los que nos acechan,", "gobierna a tus siervos,", "a quienes compraste con tu sangre.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por siempre. Amén."]}}, {"id": "o_lux_beata_trinitas", "title": "O Lux Beata Trinitas", "original_language": "la", "lines": {"la": ["O lux beata Trinitas,", "et principalis Unitas,", "iam sol recedit igneus:", "infunde lumen cordibus.", "", "Te mane laudum carmine,", "te deprecemur vespere:", "te nostra supplex gloria", "per cuncta laudet saecula.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Oh luz bienaventurada, Trinidad,", "y Unidad primera,", "ya el sol ígneo se retira:", "infunde tu luz en los corazones.", "", "A ti te alabemos por la mañana con cánticos,", "a ti te supliquemos al atardecer:", "que nuestra súplica te glorifique", "por todos los siglos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y para siempre. Amén."]}}]}, "dates": {"2026-12-24": {"date_human": {"en": "Thursday, December 24, 2026", "es": "Jueves, 24 de diciembre de 2026", "la": "Feria V, die 24 Decembris, anno 2026"}, "day_description": {"en": "December 24, Advent", "es": "24 de diciembre, Adviento", "la": "Feria propria diei 24 Decembris, Adventus"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Y tú, Belén, tierra de Judá, no eres ni mucho menos la última de las ciudades de Judá; pues de ti saldrá un jefe que será el pastor de mi pueblo Israel._", "la": "Tu, Béthlehem, terra Iuda, non eris mínima: ex te enim éxiet Dux qui regat pópulum meum Israel."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 100", "content": {"la": [["1", "Psalmus ipsi David. Misericordiam et judicium cantabo tibi, Domine; psallam,"], ["2", "et intelligam in via immaculata : quando venies ad me? Perambulabam in innocentia cordis mei, in medio domus meae."], ["3", "Non proponebam ante oculos meos rem injustam; facientes praevaricationes odivi, non adhaesit mihi"], ["4", "cor pravum; declinantem a me malignum non cognoscebam."], ["5", "Detrahentem secreto proximo suo, hunc persequebar, superbo oculo, et insatiabili corde, cum hoc non edebam."], ["6", "Oculi mei ad fideles terrae, ut sedeant mecum; ambulans in via immaculata, hic mihi ministrabat."], ["7", "Non habitabit in medio domus meae qui facit superbiam; qui loquitur iniqua non direxit in conspectu oculorum meorum."], ["8", "In matutino interficiebam omnes peccatores terrae, ut disperderem de civitate Domini omnes operantes iniquitatem."]], "es": [["1", "Cantaré, Señor, las alabanzas de tu misericordia y de tu justicia."], ["2", "Las cantaré al son de instrumentos músicos y estudiaré el camino de la perfección. ¿Y cuándo vendrás a mí para fortalecerme? He vivido con inocencia de corazón en medio de mi familia."], ["3", "Jamás he puesto la mira en cosa injusta; he aborrecido a los transgresores de la ley."], ["4", "Conmigo no han tenido cabida hombres de corazón depravado; ni he querido conocer al que con su proceder maligno se desviaba de mí."], ["5", "Al que calumniaba secretamente a su prójimo, a éste lo he perseguido. No admitía en mi mesa a hombres de ojos altaneros y de corazón insaciable."], ["6", "Dirigí mi vista en busca de los hombres fieles del país, para que habiten conmigo; los que procedían irreprensiblemente, ésos eran mis ministros."], ["7", "No morará en mi casa el que obra con soberbia o dolo; ni hallará gracia en mis ojos aquel que habla iniquidades."], ["8", "Al levantarme por la mañana mi primer cuidado era exterminar a todos los pecadores del país, para extirpar de la ciudad del Señor a todos los facinerosos."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Y tú, Belén, tierra de Judá, no eres ni mucho menos la última de las ciudades de Judá; pues de ti saldrá un jefe que será el pastor de mi pueblo Israel._", "la": "Tu, Béthlehem, terra Iuda, non eris mínima: ex te enim éxiet Dux qui regat pópulum meum Israel."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Levantaos, alzad la cabeza: se acerca vuestra liberación._", "la": "Leváte cápita vestra: ecce appropínquat redémptio vestra."}}, {"kind": "psalm", "label": "canticle", "ref": "dan 3:26-29,34-41", "content": {"la": [["26", "Benedictus es, Domine Deus patrum nostrorum, et laudabile, et gloriosum nomen tuum in saecula :"], ["27", "quia justus es in omnibus, quae fecisti nobis, et universa opera tua vera, et viae tuae rectae, et omnia judicia tua vera."], ["28", "Judicia enim vera fecisti juxta omnia, quae induxisti super nos, et super civitatem sanctam patrum nostrorum Jerusalem : quia in veritate et in judicio induxisti omnia haec propter peccata nostra."], ["29", "Peccavimus enim, et inique egimus recedentes a te, et deliquimus in omnibus :"], ["34", "Ne, quaesumus, tradas nos in perpetuum propter nomen tuum, et ne dissipes testamentum tuum :"], ["35", "neque auferas misericordiam tuam a nobis, propter Abraham, dilectum tuum, et Isaac, servum tuum, et Israel, sanctum tuum,"], ["36", "quibus locutus es pollicens quod multiplicares semen eorum sicut stellas caeli, et sicut arenam quae est in littore maris;"], ["37", "quia, Domine, imminuti sumus plus quam omnes gentes, sumusque humiles in universa terra hodie propter peccata nostra."], ["38", "Et non est in tempore hoc princeps, et dux, et propheta, neque holocaustum, neque sacrificium, neque oblatio, neque incensum, neque locus primitiarum coram te,"], ["39", "ut possimus invenire misericordiam tuam, sed in animo contrito, et spiritu humilitatis suscipiamur."], ["40", "Sicut in holocausto arietum, et taurorum, et sicut in millibus agnorum pinguium, sic fiat sacrificium nostrum in conspectu tuo hodie, ut placeat tibi, quoniam non est confusio confidentibus in te."], ["41", "Et nunc sequimur te in toto corde; et timemus te, et quaerimus faciem tuam."]], "es": [["26", "Bendito eres, oh Señor Dios de nuestros padres, y digno es de alabanza tu nombre, y glorioso por todos los siglos."], ["28", "Pues justos fueron los juicios tuyos, según los cuales hiciste recaer todas estas cosas sobre nosotros y sobre la santa ciudad de nuestros padres, Jerusalem; porque en verdad y en justicia enviaste todas estas cosas por causa de nuestros pecados,"], ["29", "Puesto que nosotros hemos pecado y obrado inicuamente, apostatando de tí, y en todo hemos faltado;"], ["34", "Rogámoste, Señor, que por amor de tu nombre, no nos abandones para siempre, ni destruyas tu alianza con Israel:"], ["35", "ni apartes de nosotros tu misericordia, por amor de Abraham tu amado, y de Isaac siervo tuyo, y de Israel tu santo:"], ["36", "á los cuales hablaste, prometiéndoles que niul- ToM. Xí. 21 â¢238 LA profecía de DANIEL. tiplicarias su linage como las estrellas del cielo, y como la arena que está en la playa del mar."], ["37", "Porque nosotros, oh Señor, hemos venido á ser la mas pequeña de todas las naciones, y estamos hoy dia abatidos en todo el mundo por causa de nuestros pecados."], ["38", "Y no tenemos en este tiempo ni príncipe, ni caudillo, ni profeta, ni holocausto, ni sacrificio, ni ofrenda, ni incienso, ni lugar donde presentártelas primicias,"], ["39", "á fin de poder alcanzar tu misericordia. Pero recíbenos tú, oh Señor, contritos de corazón, y con espíritu humillado."], ["40", "Como recibías el holocausto de los carneros y toros, y los sacrificios de millares de gordos corderos: así sea hoy agradable nuestro sacrificio en presencia tuya; puesto que jamás quedan confundidos aquelloíí que en tí confian."], ["41", "y ahora te seguimos con todo el corazón, y fe tememos ó respetamos, y buscamos tu rostro."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Levantaos, alzad la cabeza: se acerca vuestra liberación._", "la": "Leváte cápita vestra: ecce appropínquat redémptio vestra."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_«Mañana será el día de vuestra salvación», dice el Señor de los ejércitos._", "la": "Crástina erit vobis salus, dicit Dóminus Deus exercítuum."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 143:1-10", "content": {"la": [["1", "Psalmus David. Adversus Goliath. Benedictus Dominus Deus meus, qui docet manus meas ad praelium, et digitos meos ad bellum."], ["2", "Misericordia mea et refugium meum, susceptor meus et liberator meus; protector meus, et in ipso speravi; qui subdit populum meum sub me."], ["3", "Domine, quid est homo, quia innotuisti ei? aut filius hominis, quia reputas eum?"], ["4", "Homo vanitati similis factus est; dies ejus sicut umbra praetereunt."], ["5", "Domine, inclina caelos tuos, et descende; tange montes, et fumigabunt."], ["6", "Fulgura coruscationem, et dissipabis eos; emitte sagittas tuas, et conturbabis eos."], ["7", "Emitte manum tuam de alto : eripe me, et libera me de aquis multis, de manu filiorum alienorum :"], ["8", "quorum os locutum est vanitatem, et dextera eorum dextera iniquitatis."], ["9", "Deus, canticum novum cantabo tibi; in psalterio decachordo psallam tibi."], ["10", "Qui das salutem regibus, qui redemisti David servum tuum de gladio maligno,"]], "es": [["1", "Bendito sea el Señor Dios mío, que adiestra mis manos para la pelea y mis dedos para manejar las armas."], ["2", "El es para conmigo la misma misericordia y el asilo mío, mi amparo y mi libertador; el protector mío, en quien tengo mi esperanza; el que somete mi pueblo a la autoridad mía."], ["3", "¡Oh Señor! ¿Qué es el hombre para que te des a conocer a él?; ¿o el hijo del hombre, que así lo aprecias?"], ["4", "El hombre por el pecado ha venido a ser nada; sus días pasan como la sombra."], ["5", "Señor, inclina esos tus cielos, y desciende a socorrernos; toca los montes, y se desharán en humo."], ["6", "Vibra rayos, y disiparás mis enemigos; arroja tus saetas, y los llenarás de turbación."], ["7", "Alarga desde lo alto tu mano, y arrebátame del abismo de las aguas de la tribulación; líbrame de caer en poder de los extranjeros,"], ["8", "cuya boca no habla sino vanidad o mentira, y cuyas manos están llenas de iniquidad."], ["9", "¡Oh Dios mío!, yo te cantaré un cántico nuevo con un salterio; te cantaré himnos de alabanza."], ["10", "Señor, tú que das la salud o felicidad a los reyes, que libraste a David, siervo tuyo, de la espada sangrienta,"]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_«Mañana será el día de vuestra salvación», dice el Señor de los ejércitos._", "la": "Crástina erit vobis salus, dicit Dóminus Deus exercítuum."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "isa 11:1-3", "content": {"la": [["1", "Et egredietur virga de radice Jesse, et flos de radice ejus ascendet."], ["2", "Et requiescet super eum spiritus Domini : spiritus sapientiae et intellectus, spiritus consilii et fortitudinis, spiritus scientiae et pietatis;"], ["3", "et replebit eum spiritus timoris Domini. Non secundum visionem oculorum judicabit, neque secundum auditum aurium arguet;"]], "es": [["1", "y saldrá un renuevo del tronco de Jessé ', y de su raíz se elevará una flor."], ["2", "Y reposará sobre él el Espíritu del Señor, espíritu de sabiduría, y de entendimiento, espíritu de consejo y de fortaleza, espíritu de ciencia y de piedad;"], ["3", "y estará lleno del espíritu del temor del Señor. El no juzgará por lo que aparece exteriormente á la vista, ni condenará solo por lo que se oye decir;"]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Crástina die * Delébitur iníquitas terræ. Crástina.", "℟. Et regnábit super nos Salvátor mundi.* Delébitur iníquitas terræ. Glória Patri. Crástina."], "es": ["$℣. $Mañana quedará borrada la iniquidad de la tierra.", "$℟. $Mañana quedará borrada la iniquidad de la tierra.", "$℣. $Y sobre nosotros reinará el Salvador del mundo.", "$℟. $Quedará borrada la iniquidad de la tierra.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Mañana quedará borrada la iniquidad de la tierra."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_A María le llegó el tiempo de dar a luz a su Hijo primogénito._", "la": "Compléti sunt dies Maríæ ut páreret Fílium suum primogénitum."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_A María le llegó el tiempo de dar a luz a su Hijo primogénito._", "la": "Compléti sunt dies Maríæ ut páreret Fílium suum primogénitum."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christum redemptórem, fratres caríssimi, devotióne mentis orémus, qui véniet cum glória et potestáte magna, atque súpplices invocémus:", "– Veni, Dómine Iesu.", "Christe Dómine, qui excélsus in fortitúdine vénies, réspice humília nostra,", "ut dignos nos fácias munéribus tuis.", "– Veni, Dómine Iesu.", "Qui Evangélium homínibus manifestáre venísti,", "da tuam nos semper prædicáre salútem.", "– Veni, Dómine Iesu.", "Tu, qui es benedíctus et vivis et ómnia regis,", "da nos gaudéntes exspectáre beátam spem et advéntum magnificéntiæ tuæ.", "– Veni, Dómine Iesu.", "Et nos, qui advéntus tui grátiæ anhelámus,", "divinitátis tuæ múnere consoláre.", "– Veni, Dómine Iesu."], "es": ["Oremos, hermanos, con todo nuestro espíritu a Cristo redentor, que vendrá con gran poder y gloria, y digámosle:", "- Señor Jesucristo, que vendrás con poder desde el cielo, _mira nuestra pequeñez y haznos dignos de tus dones._ _Ven, Señor Jesús._", "- Tú, que viniste a anunciar la Buena Noticia a los hombres, _danos fuerza para que también nosotros anunciemos el Evangelio a nuestros hermanos._ _Ven, Señor Jesús._", "- Tú que desde el trono del Padre todo lo gobiernas, _haz que aguardemos con alegría la dicha que esperamos, tu aparición gloriosa._ _Ven, Señor Jesús._", "- Consuela, Señor, con los dones de tu divinidad, _a los que anhelamos la gracia de tu venida._ _Ven, Señor Jesús._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Festína, quǽsumus, ne tardáveris, Dómine Iesu, ut advéntus tui consolatiónibus sublevéntur, qui in tua pietáte confídunt. Qui vivis et regnas cum Deo Patre in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Apresúrate, Señor Jesús, y no tardes, para que tu venida consuele y fortalezca a los que esperan todo de tu amor. Tú que vives y reinas con el Padre en la unidad del Espíritu Santo y eres Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Rex pacíficus magnificátus est, cujus vultum desíderat univérsa terra.", "es": "El Rey pacífico ha sido engrandecido, cuyo rostro desea toda la tierra."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 112", "content": {"la": [["1", "Alleluja. Laudate, pueri, Dominum, laudate nomen Domini."], ["2", "Sit nomen Domini benedictum ex hoc nunc et usque in saeculum."], ["3", "A solis ortu usque ad occasum laudabile nomen Domini."], ["4", "Excelsus super omnes gentes Dominus, et super caelos gloria ejus."], ["5", "Quis sicut Dominus Deus noster, qui in altis habitat,"], ["6", "et humilia respicit in caelo et in terra?"], ["7", "Suscitans a terra inopem, et de stercore erigens pauperem :"], ["8", "ut collocet eum cum principibus, cum principibus populi sui."], ["9", "Qui habitare facit sterilem in domo, matrem filiorum laetantem."]], "es": [["1", "Alabad ¡oh jóvenes! al Señor, dad loores al Nombre del Señor."], ["2", "Sea bendito el Nombre del Señor desde ahora mismo hasta el fin de los siglos."], ["3", "Desde oriente hasta poniente es digno de ser bendecido el Nombre del Señor."], ["4", "Excelso es el Señor sobre todas las gentes, y su gloria sobrepuja los cielos."], ["5", "¿Quién como el Señor nuestro Dios? El tiene su morada en las alturas,"], ["6", "y está cuidando de las criaturas humanas en el cielo y en la tierra."], ["7", "Levanta del polvo de la tierra al desvalido, y alza del estercolero al pobre,"], ["8", "para colocarlo entre los príncipes, entre los príncipes de su pueblo."], ["9", "El a la mujer antes estéril, la hace vivir en su casa alegre de verse rodeada de sus hijos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Rex pacíficus magnificátus est, cujus vultum desíderat univérsa terra.", "es": "El Rey pacífico ha sido engrandecido, cuyo rostro desea toda la tierra."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Emíttit elóquium suum in terram, velóciter currit sermo ejus.", "es": "Envía su palabra a la tierra, y su mensaje corre veloz."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 147", "content": {"la": [["1", "Alleluja. Lauda, Jerusalem, Dominum; lauda Deum tuum, Sion."], ["2", "Quoniam confortavit seras portarum tuarum, benedixit filiis tuis in te."], ["3", "Qui posuit fines tuos pacem, et adipe frumenti satiat te."], ["4", "Qui emittit eloquium suum terrae, velociter currit sermo ejus."], ["5", "Qui dat nivem sicut lanam, nebulam sicut cinerem spargit."], ["6", "Mittit crystallum suum sicut buccellas : ante faciem frigoris ejus quis sustinebit?"], ["7", "Emittet verbum suum, et liquefaciet ea; flabit spiritus ejus, et fluent aquae."], ["8", "Qui annuntiat verbum suum Jacob, justitias et judicia sua Israel."], ["9", "Non fecit taliter omni nationi, et judicia sua non manifestavit eis. Alleluja."]], "es": [["1", "Alaba al Señor, ¡oh Jerusalén!; alaba, ¡oh Sión!, a tu Dios."], ["2", "Porque él ha asegurado con fuertes barras o cerrojos tus puertas; ha llenado de bendición a tus hijos, que moran dentro de ti."], ["3", "Ha establecido la paz en tu territorio, y te alimenta de la flor de harina."], ["4", "El despacha sus órdenes a la tierra; órdenes que se comunican velozmente."], ["5", "El nos da la nieve como copos de lana; esparce la escarcha como ceniza."], ["6", "El despide el granizo en menudos pedazos; al rigor de su frío, ¿quién resistirá?"], ["7", "Pero luego despacha sus órdenes, derrite estas cosas; hace soplar su viento, y fluyen las aguas."], ["8", "El anuncia su palabra a Jacob, sus preceptos y ocultos juicios a Israel."], ["9", "No ha hecho otro tanto con las demás naciones, ni les ha manifestado a todas ellas sus juicios o preceptos. ¡Aleluya!"]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Emíttit elóquium suum in terram, velóciter currit sermo ejus.", "es": "Envía su palabra a la tierra, y su mensaje corre veloz."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Verbum supérnum, a Patre ante témpora génitum, hódie pro nobis caro factum exinanívit semetípsum.", "es": "El Verbo celestial, engendrado del Padre antes de todos los tiempos, hoy se anonadó a sí mismo, hecho carne por nosotros."}}, {"kind": "psalm", "label": "canticle", "ref": "phil 2:6-11", "content": {"la": [["6", "qui cum in forma Dei esset, non rapinam arbitratus est esse se aequalem Deo :"], ["7", "sed semetipsum exinanivit, formam servi accipiens, in similitudinem hominum factus, et habitu inventus ut homo."], ["8", "Humiliavit semetipsum factus obediens usque ad mortem, mortem autem crucis."], ["9", "Propter quod et Deus exaltavit illum, et donavit illi nomen, quod est super omne nomen :"], ["10", "ut in nomine Jesu omne genu flectatur caelestium, terrestrium et infernorum,"], ["11", "et omnis lingua confiteatur, quia Dominus Jesus Christus in gloria est Dei Patris."]], "es": [["6", "el cual teniendo la naturaleza de Dios, no fue por usurpación sino por esencia el ser igual á Dios;"], ["7", "y no obstante ' se anonadó á sí mismo lomando la forma ó naturaleza de siervo, hecho semejante á los demás hombres, y reducido á la condición de hombre."], ["8", "Se humilló á si mismo haciéndose obediente hasta la muerte, y muerte dâ¬ cruz."], ["9", "Por lo cual también Dios le ensalzó sobre todas las cosas, y le dio nombre superior á todo nombre;"], ["10", "á fin de que al nombre de Jesús se doble toda rodilla en el cielo, en la tierra, y en el infierno;"], ["11", "y toda lengua confiese, que el Señor Jesu- Christo está en la gloria de Dios Padre."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Verbum supérnum, a Patre ante témpora génitum, hódie pro nobis caro factum exinanívit semetípsum.", "es": "El Verbo celestial, engendrado del Padre antes de todos los tiempos, hoy se anonadó a sí mismo, hecho carne por nosotros."}}, {"kind": "psalm", "label": "reading", "ref": "1john 1:1-3", "content": {"la": [["1", "Quod fuit ab initio, quod audivimus, quod vidimus oculis nostris, quod perspeximus, et manus nostrae contrectaverunt de verbo vitae :"], ["2", "et vita manifestata est, et vidimus, et testamur, et annuntiamus vobis vitam aeternam, quae erat apud Patrem, et apparuit nobis :"], ["3", "quod vidimus et audivimus, annuntiamus vobis, ut et vos societatem habeatis nobiscum, et societas nostra sit cum Patre, et cum Filio ejus Jesu Christo."]], "es": [["1", "Lo que fué desde el principio ó desde la eternidad, lo que oímos, lo que vimos con nuestros ojos, y contemplamos, y palparon nuestras manos, tocante al Verbo de la vida:"], ["2", "Vida que se hizo patente, y así la vimos, y damos de ella testimonio; y os evangelizamos esta vida eterna, la cual estaba en el Padre, y se dejó ver de nosotros:"], ["3", "Esto que vimos y oímos, es lo que os anunciamos, para que tengáis también vosotros unión con nosotros, y nuestra común unión sea con el Padre y con su Hijo Jesu-Cristo."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Verbum caro factum est, * Allelúia, allelúia. Verbum.", "℟. Et habitávit in nobis.* Allelúia, allelúia. Glória Patri. Verbum."], "es": ["$℣. $La Palabra se hizo carne. Aleluya, Aleluya.", "$℟. $La Palabra se hizo carne. Aleluya, Aleluya.", "$℣. $Y acampó entre nosotros.", "$℟. $Aleluya, Aleluya.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $La Palabra se hizo carne. Aleluya, Aleluya."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Cum ortus fúerit * sol de cælo, vidébitis Regem regum procedéntem a Patre, tamquam sponsum de thálamo suo.", "es": "Cuando salga el sol desde el cielo, veréis al Rey de los reyes que procede del Padre, como esposo que sale de su tálamo nupcial."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Cum ortus fúerit * sol de cælo, vidébitis Regem regum procedéntem a Patre, tamquam sponsum de thálamo suo.", "es": "Cuando salga el sol desde el cielo, veréis al Rey de los reyes que procede del Padre, como esposo que sale de su tálamo nupcial."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christum iubilántes celebrémus, in cuius nativitáte ángeli pacem mundo nuntiavérunt, et devótis ánimis exorémus:", "– Natívitas tua pacem cunctis áfferat.", "Reple, Dómine, ómnibus bonis Ecclésiam tuam,", "quam nativitátis tuæ mystério consoláris.", "– Natívitas tua pacem cunctis áfferat.", "Qui, princeps pastórum venísti, et nostrárum epíscopus animárum,", "papam et epíscopos nostros fidéles redde dispensatóres multifórmis grátiæ tuæ.", "– Natívitas tua pacem cunctis áfferat.", "Rex æternitátis, qui, nascens, brevi vitæ spátio circumscríbi et hóminum vicissitúdines experíri voluísti,", "nos cadúcos et mortáles æternitátis tuæ redde consórtes.", "– Natívitas tua pacem cunctis áfferat.", "Qui, a sǽculis exspectátus, in plenitúdine témporis venísti,", "manifésta præséntiam tuam iis, qui adhuc te exspéctant.", "– Natívitas tua pacem cunctis áfferat.", "Qui, caro factus, humánam substántiam morte corrúptam restaurásti,", "defúnctis tuam plenam restauratiónem concéde.", "– Natívitas tua pacem cunctis áfferat."], "es": ["Aclamemos alegres a Cristo, ante cuyo nacimiento los ángeles anunciaron la paz a la tierra, y supliquémosle, diciendo:", "- Tú que con el misterio de Navidad consuelas a la Iglesia, _cólmala también de todos tus bienes._ _Que tu nacimiento, Señor, traiga la paz a todos los hombres._", "- Tú que has venido como pastor supremo y guardián de nuestras vidas, _haz que el papa y todos los obispos sean buenos administradores de la múltiple gracia de Dios._ _Que tu nacimiento, Señor, traiga la paz a todos los hombres._", "- Rey de la eternidad, que al nacer quisiste experimentar las limitaciones humanas sometiéndote a la brevedad de una vida como la nuestra, _haz que nosotros, que somos caducos y mortales, participemos de tu vida eterna._ _Que tu nacimiento, Señor, traiga la paz a todos los hombres._", "- Tú que, esperado durante largos siglos, viniste en el momento culminante de la historia, _manifiesta tu presencia a los que aún te están esperando._ _Que tu nacimiento, Señor, traiga la paz a todos los hombres._", "- Tú que, hecho carne, restauraste la naturaleza humana corrompida por la muerte, _concede la plena salvación a los difuntos._ _Que tu nacimiento, Señor, traiga la paz a todos los hombres._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "ref": "In Nativitate Domini", "content": {"la": "Concede, quæsumus, omnipotens Deus: ut nos Unigeniti tui nova per carnem Nativitas liberet; quos sub peccati jugo vetusta servitus tenet.", "es": "Concede, Señor todopoderoso, a los que vivimos inmersos en la luz de tu Palabra hecha carne, que resplandezca en nuestras obras la fe que haces brillar en nuestro espíritu. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Caro mea requiescet in spe.", "es": "Mi carne descansará en la esperanza."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 15", "content": {"la": [["1", "Tituli inscriptio, ipsi David. Conserva me, Domine, quoniam speravi in te."], ["2", "Dixi Domino : Deus meus es tu, quoniam bonorum meorum non eges."], ["3", "Sanctis, qui sunt in terra ejus, mirificavit omnes voluntates meas in eis."], ["4", "Multiplicatae sunt infirmitates eorum, postea acceleraverunt. Non congregabo conventicula eorum de sanguinibus; nec memor ero nominum eorum per labia mea."], ["5", "Dominus pars haereditatis meae, et calicis mei : tu es qui restitues haereditatem meam mihi."], ["6", "Funes ceciderunt mihi in praeclaris; etenim haereditas mea praeclara est mihi."], ["7", "Benedicam Dominum qui tribuit mihi intellectum; insuper et usque ad noctem increpuerunt me renes mei."], ["8", "Providebam Dominum in conspectu meo semper, quoniam a dextris est mihi, ne commovear."], ["9", "Propter hoc laetatum est cor meum, et exsultavit lingua mea; insuper et caro mea requiescet in spe."], ["10", "Quoniam non derelinques animam meam in inferno, nec dabis sanctum tuum videre corruptionem."], ["11", "Notas mihi fecisti vias vitae; adimplebis me laetitia cum vultu tuo : delectationes in dextera tua usque in finem."]], "es": [["1", "Sálvame, oh Señor, pues tengo puesta en ti toda mi esperanza."], ["2", "Yo dije al Señor: Tú eres mi Dios, que no tienes necesidad de mis bienes."], ["3", "Cumplido ha maravillosamente todos mis deseos, en los santos que moran en su tierra."], ["4", "Multiplicaron los impíos sus miserias, o sus miserables deidades; en pos de las cuales corrían aceleradamente. No seré yo el que convoque sus sanguinarios sacrificios, ni siquiera tomaré en boca sus nombres."], ["5", "El Señor es la parte que me ha tocado en herencia, y la porción destinada para mí. Tú eres, oh Señor, el que me restituirá y conservará mi heredad."], ["6", "En delicioso sitio me cupo la suerte; hermosa es, a la verdad, la herencia que me ha tocado."], ["7", "Alabaré, pues, al Señor, que me ha dado este entendimiento; a lo cual, aun durante la noche, mi corazón me excitaba."], ["8", "Yo contemplaba siempre al Señor delante de mí, como quien está a mi diestra para sostenerme."], ["9", "Por eso se regocijó mi corazón, y prorrumpió en cánticos alegres mi lengua; y además también mi carne descansará con la esperanza."], ["10", "Porque yo sé que no has de abandonar tú, oh Señor, mi alma en el sepulcro; ni permitirás que tu Santo experimente la corrupción."], ["11", "Me hiciste conocer las sendas de la vida; me colmarás de gozo con la vista de tu divino rostro; en tu diestra se hallan delicias eternas."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Caro mea requiescet in spe.", "es": "Mi carne descansará en la esperanza."}}, {"kind": "psalm", "label": "reading", "ref": "1Thess 5:23", "content": {"la": [["23", "Ipse autem Deus pacis sanctificet vos per omnia : ut integer spiritus vester, et anima, et corpus sine querela in adventu Domini nostri Jesu Christi servetur."]], "es": [["23", "Y el Dios de la paz os haga santos en todo, á fin de que vuestro espíritu entero, con alma y cuerpo se conserven sin culpa para cuando venga nuestro Señor Jesu-Christo."]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Domine Deus noster, diurno labore fatigatos, quieto sopore nos refove, ut, tuo semper auxilio recreati, tibi corpore simus et mente devoti. Per Christum Dominum nostrum.", "es": "Señor, Dios nuestro, concédenos un descanso tranquilo que restaure nuestras fuerzas, desgastadas ahora por el trabajo del día; así, fortalecidos con tu ayuda, te serviremos siempre con todo nuestro cuerpo y nuestro espíritu. Por Jesucristo nuestro Señor."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-12-25": {"date_human": {"en": "Friday, December 25, 2026", "es": "Viernes, 25 de diciembre de 2026", "la": "Feria VI, die 25 Decembris, anno 2026"}, "day_description": {"en": "In Nativitate Domini", "es": "In Nativitate Domini", "la": "In Nativitate Domini"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Angelus ad pastóres ait: Annúntio vobis gáudium magnum, quia natus est vobis hódie Salvátor mundi, allelúia.", "es": "El ángel dijo a los pastores: Os anuncio una gran alegría, porque hoy os ha nacido el Salvador del mundo, aleluya."}}, {"kind": "psalm", "label": "canticle", "ref": "Dan 3:57-88,56", "content": {"la": [["57", "Benedicite, omnia opera Domini, Domino : laudate et superexaltate eum in saecula."], ["58", "Benedicite, angeli Domini, Domino : laudate et superexaltate eum in saecula."], ["59", "Benedicite, caeli, Domino : laudate et superexaltate eum in saecula."], ["60", "Benedicite, aquae omnes, quae super caelos sunt, Domino : laudate et superexaltate eum in saecula."], ["61", "Benedicite, omnes virtutes Domini, Domino : laudate et superexaltate eum in saecula."], ["62", "Benedicite, sol et luna, Domino : laudate et superexaltate eum in saecula."], ["63", "Benedicite, stellae caeli, Domino : laudate et superexaltate eum in saecula."], ["64", "Benedicite, omnis imber et ros, Domino : laudate et superexaltate eum in saecula."], ["65", "Benedicite, omnes spiritus Dei, Domino : laudate et superexaltate eum in saecula."], ["66", "Benedicite, ignis et aestus, Domino : laudate et superexaltate eum in saecula."], ["67", "Benedicite, frigus et aestus, Domino : laudate et superexaltate eum in saecula."], ["68", "Benedicite, rores et pruina, Domino : laudate et superexaltate eum in saecula."], ["69", "Benedicite, gelu et frigus, Domino : laudate et superexaltate eum in saecula."], ["70", "Benedicite, glacies et nives, Domino : laudate et superexaltate eum in saecula."], ["71", "Benedicite, noctes et dies, Domino laudate et superexaltate eum in saecula."], ["72", "Benedicite, lux et tenebrae, Domino : laudate et superexaltate eum in saecula."], ["73", "Benedicite, fulgura et nubes, Domino : laudate et superexaltate eum in saecula."], ["74", "Benedicat terra Dominum : laudet et superexaltet eum in saecula."], ["75", "Benedicite, montes et colles, Domino : laudate et superexaltate eum in saecula."], ["76", "Benedicite, universa germinantia in terra, Domino : laudate et superexaltate eum in saecula."], ["77", "Benedicite, fontes, Domino : laudate et superexaltate eum in saecula."], ["78", "Benedicite, maria et flumina, Domino : laudate et superexaltate eum in saecula."], ["79", "Benedicite, cete, et omnia quae moventur in aquis, Domino : laudate et superexaltate eum in saecula."], ["80", "Benedicite, omnes volucres caeli, Domino : laudate et superexaltate eum in saecula."], ["81", "Benedicite, omnes bestiae et pecora, Domino : laudate et superexaltate eum in saecula."], ["82", "Benedicite, filii hominum, Domino : laudate et superexaltate eum in saecula."], ["83", "Benedicat Israel Dominum : laudet et superexaltet eum in saecula."], ["84", "Benedicite, sacerdotes Domini, Domino : laudate et superexaltate eum in saecula."], ["85", "Benedicite, servi Domini, Domino : laudate et superexaltate eum in saecula."], ["86", "Benedicite, spiritus et animae justorum, Domino : laudate et superexaltate eum in saecula."], ["87", "Benedicite, sancti et humiles corde, Domino : laudate et superexaltate eum in saecula."], ["88", "Benedicite, Anania, Azaria, Misael, Domino : laudate et superexaltate eum in saecula : quia eruit nos de inferno, et salvos fecit de manu mortis : et liberavit nos de medio ardentis flammae, et de medio ignis eruit nos."], ["56", "Benedictus es in firmamento caeli : et laudabilis et gloriosus in saecula."]], "es": [["57", "Obras todas del Señor, bendecid al Señor, y loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["58", "Angeles del Señor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["59", "Cielos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["60", "Aguas todas que estáis sobre los cielos *, bendecid al Señor: alabadle, y ensalzadle sobre todas las cosas por todos los siglos."], ["61", "Virtudes todas ó milicias celestiales ', bendecid vosotras al Señor: loadle y ensalzadle sobre todas"], ["62", "Sol y luna, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["63", "Estrellas del cielo, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["64", "Lluvias todas y rocíos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["65", "Espíritus ó vientos de Dios, bendecid todos vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["66", "Fuego y calor, bendecid vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["67", "Frió y calor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["68", "Rocíos y escarchas, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["69", "Hielos y frios, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["70", "Heladas y nieves, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["71", "Noches y dias, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["72", "Luz y tinieblas, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["73", "Relámpagos y nubes, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["74", "Bendiga al Señor la tierra, alábele y ensálzele sobre todas las cosas por todos los siglos."], ["75", "Montes y collados, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["76", "Plantas todas que nacéis en la tierra, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["77", "Fuentes, bendecid al Señor: loadle y ensalzíidle sobre todas las cosas por todos los siglos."], ["78", "Mares y rios, bendecid al Señor: loadle y"], ["79", "Ballenas y peces todos, que giráis por las aguas, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["80", "Aves todas del cielo, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["81", "Bestias todas y ganados, bendecid al Señor: loadle y ensab:adle por todos los siglos sobre todas las cosas."], ["82", "Oh hijos de los hombres, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["83", "Bendiga Israel al Señor: alábele y ensálzele por todos los siglos sobre todas las cosas."], ["84", "Vosotros sacerdotes del Señor, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["85", "Siervos del Señor, bendecid vosotros al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["86", "Espíritus y almas de los justos, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["87", "Vosotros santos, y humildes de corazón, bendecid al Señor: alabadle y ensalzadle por todos los siglos sobre todas las cosas."], ["88", "Vosotros, Ananías, Azarías y Misael, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas. Porque él nos ha salvado del inlierno ó del sepulcro, y librado de las manos de la ( APÍfüLO III. '¿i'o muelle: y nos ha sacado de en medio de las ardientes llamas, y libertado del fuego del homo."], ["56", "Bendito eres tú en el firmamento del cielo, y digno de loor, y de gloria por todos los siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Angelus ad pastóres ait: Annúntio vobis gáudium magnum, quia natus est vobis hódie Salvátor mundi, allelúia.", "es": "El ángel dijo a los pastores: Os anuncio una gran alegría, porque hoy os ha nacido el Salvador del mundo, aleluya."}}, {"kind": "psalm", "label": "reading", "ref": "heb 1:1-2", "content": {"la": [["1", "Multifariam, multisque modis olim Deus loquens patribus in prophetis :"], ["2", "novissime, diebus istis locutus est nobis in Filio, quem constituit haeredem universorum, per quem fecit et saecula :"]], "es": [["1", "Dios, que en olro tiempo habló á nuestros padres en diferenlcs ocasiones, y de muchas maneras por los Profetas,"], ["2", "nos ha hablado úllimamente en esíos dias, por medio de su Hijo Jesu-Chris(o, á quien constituyo heredero universal de todas las cosas, por quien crió también los siglos y cuanto ha existido en ellos:"]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Notum fecit Dóminus,* Allelúia, allelúia. Notum.", "℟. Salutáre suum,* Allelúia, allelúia. Glória Patri. Notum."], "es": ["$℣. $El Señor ha revelado, Aleluya. Aleluya. ", "$℟. $El Señor ha revelado, Aleluya. Aleluya. ", "$℣. $Su salvación.", "$℟. $Aleluya. Aleluya. ", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $El Señor ha revelado, Aleluya. Aleluya. "]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Glória in excélsis Deo, * et in terra pax homínibus bonæ voluntátis, allelúja, allelúja.", "es": "Gloria a Dios en las alturas, y en la tierra paz a los hombres de buena voluntad, aleluya, aleluya."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Glória in excélsis Deo, * et in terra pax homínibus bonæ voluntátis, allelúja, allelúja.", "es": "Gloria a Dios en las alturas, y en la tierra paz a los hombres de buena voluntad, aleluya, aleluya."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Dignis láudibus Verbum Dei celebrémus, ante sǽcula exsístens et in témpore nobis natum. Iucúnde acclamémus, dicéntes:", "– Exsúltet terra, quia venísti.", "Christe, Verbum ætérnum, qui in terram descéndens, exsultatiónis rore eam perfudísti,", "lætífica cor nostrum grátiæ tuæ visitatióne contínua.", "– Exsúltet terra, quia venísti.", "Salvátor noster, qui in nativitáte tua, fidelitátem Dei nobis ostendísti,", "concéde nos plena fide promissiónes baptismáles serváre.", "– Exsúltet terra, quia venísti.", "Rex cæli et terræ, qui pacem homínibus ab ángelis nuntiári fecísti,", "vitam nostram in tua pace consérva.", "– Exsúltet terra, quia venísti.", "Dómine, qui venísti ut esses vitis vera, nobis fructum vitæ prodúcens,", "fac nos iúgiter pálmites in te manéntes, ne simus infructuósi.", "– Exsúltet terra, quia venísti."], "es": ["Glorifiquemos a Cristo, Palabra eterna del Padre, engendrado antes de los siglos y nacido por nosotros en el tiempo, y aclamémosle, diciendo:", "- Cristo, Palabra eterna, que al venir al mundo anunciaste la alegría a la tierra, _alegra nuestros corazones con la gracia de tu visita._ _Que se goce la tierra, Señor, con tu venida._", "- Salvador del mundo, que con tu nacimiento nos has revelado la fidelidad de Dios, _haz que nosotros seamos también fieles a las promesas de nuestro bautismo._ _Que se goce la tierra, Señor, con tu venida._", "- Rey del Cielo y de la tierra, que por tus ángeles anunciaste la paz a los hombres, _conserva nuestras vidas en tu paz._ _Que se goce la tierra, Señor, con tu venida._", "- Señor, tú que viniste para ser la vid verdadera que nos diera el fruto de vida, _haz que permanezcamos siempre en ti y demos fruto abundante._ _Que se goce la tierra, Señor, con tu venida._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "ref": "In Nativitate Domini", "content": {"la": "Concede, quæsumus, omnipotens Deus: ut nos Unigeniti tui nova per carnem Nativitas liberet; quos sub peccati jugo vetusta servitus tenet.", "es": "Concede, Señor todopoderoso, a los que vivimos inmersos en la luz de tu Palabra hecha carne, que resplandezca en nuestras obras la fe que haces brillar en nuestro espíritu. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Tecum princípium in die virtútis tuæ, in splendóribus sanctórum, ex útero ante lucíferum génui te.", "es": "Contigo está el principado el día de tu poder, entre los resplandores de los santos; desde el seno, antes del lucero, te engendré."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 109:1-5,7", "content": {"la": [["1", "Psalmus David. Dixit Dominus Domino meo : Sede a dextris meis, donec ponam inimicos tuos scabellum pedum tuorum."], ["2", "Virgam virtutis tuae emittet Dominus ex Sion : dominare in medio inimicorum tuorum."], ["3", "Tecum principium in die virtutis tuae in splendoribus sanctorum; ex utero, ante luciferum, genui te."], ["4", "Juravit Dominus, et non poenitebit eum : Tu es sacerdos in aeternum secundum ordinem Melchisedech."], ["5", "Dominus a dextris tuis; confregit in die irae suae reges."], ["7", "de torrente in via bibet; propterea exaltabit caput."]], "es": [["1", "El Señor dijo a mi Señor: Siéntate a mi diestra, mientras que yo pongo a tus enemigos por tarima de tus pies."], ["2", "De Sión hará salir el Señor el cetro de tu poder; domina tú en medio de tus enemigos."], ["3", "Contigo está el principado el día de tu poderío, en medio de los resplandores de la santidad; de mis entrañas te engendré, antes de existir el lucero de la mañana."], ["4", "Juró el Señor, y no se arrepentirá, y dijo: Tú eres sacerdote sempiterno, según el orden de Melquisedec."], ["5", "El Señor está a tu diestra; en el día de su ira destrozó a los reyes."], ["7", "Beberá del torrente durante el camino, por eso levantará su cabeza."]]}}, {"kind": "ant", "label": "antiphon", "repeated": tr
