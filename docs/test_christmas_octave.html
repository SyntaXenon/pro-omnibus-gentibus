r todos los siglos."], ["72", "Luz y tinieblas, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["73", "Relámpagos y nubes, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["74", "Bendiga al Señor la tierra, alábele y ensálzele sobre todas las cosas por todos los siglos."], ["75", "Montes y collados, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["76", "Plantas todas que nacéis en la tierra, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["77", "Fuentes, bendecid al Señor: loadle y ensalzíidle sobre todas las cosas por todos los siglos."], ["78", "Mares y rios, bendecid al Señor: loadle y"], ["79", "Ballenas y peces todos, que giráis por las aguas, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["80", "Aves todas del cielo, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["81", "Bestias todas y ganados, bendecid al Señor: loadle y ensab:adle por todos los siglos sobre todas las cosas."], ["82", "Oh hijos de los hombres, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["83", "Bendiga Israel al Señor: alábele y ensálzele por todos los siglos sobre todas las cosas."], ["84", "Vosotros sacerdotes del Señor, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["85", "Siervos del Señor, bendecid vosotros al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["86", "Espíritus y almas de los justos, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["87", "Vosotros santos, y humildes de corazón, bendecid al Señor: alabadle y ensalzadle por todos los siglos sobre todas las cosas."], ["88", "Vosotros, Ananías, Azarías y Misael, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas. Porque él nos ha salvado del inlierno ó del sepulcro, y librado de las manos de la ( APÍfüLO III. '¿i'o muelle: y nos ha sacado de en medio de las ardientes llamas, y libertado del fuego del homo."], ["56", "Bendito eres tú en el firmamento del cielo, y digno de loor, y de gloria por todos los siglos."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El ángel dijo a los pastores: «Os anuncio una gran alegría; hoy os ha nacido el Salvador del mundo.» Aleluya._", "la": "Angelus ad pastóres ait: Annúntio vobis gáudium magnum, quia natus est vobis hódie Salvátor mundi, allelúia."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Hoy nos ha nacido un niño que se llamará Dios fuerte. Aleluya._", "la": "Párvulus fílius hódie natus est nobis, et vocábitur Deus fortis, allelúia."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 149", "content": {"la": [["1", "Alleluja. Cantate Domino canticum novum; laus ejus in ecclesia sanctorum."], ["2", "Laetetur Israel in eo qui fecit eum, et filii Sion exsultent in rege suo."], ["3", "Laudent nomen ejus in choro, in tympano et psalterio psallant ei."], ["4", "Quia beneplacitum est Domino in populo suo, et exaltabit mansuetos in salutem."], ["5", "Exsultabunt sancti in gloria, laetabuntur in cubilibus suis."], ["6", "Exaltationes Dei in gutture eorum : et gladii ancipites in manibus eorum :"], ["7", "ad faciendam vindictam in nationibus, increpationes in populis;"], ["8", "ad alligandos reges eorum in compedibus, et nobiles eorum in manicis ferreis;"], ["9", "ut faciant in eis judicium conscriptum : gloria haec est omnibus sanctis ejus. Alleluja."]], "es": [["1", "Cantad al Señor un cántico nuevo, resuenen sus loores en la reunión de los santos."], ["2", "Que se alegre Israel en el Señor que le creó, y se regocijen en su rey los hijos de Sión."], ["3", "Celebren su excelso Nombre con armoniosos conciertos, y publiquen sus alabanzas al son del pandero y salterio."], ["4", "Porque el Señor ha mirado benignamente a su pueblo; y exaltará a los humildes y los salvará."], ["5", "Se gozarán los santos en la gloria, y se regocijarán en sus moradas."], ["6", "Resonarán en sus bocas los elogios sublimes de Dios; y vibrarán en sus manos espadas de dos filos,"], ["7", "para ejecutar la divina venganza en las naciones, y castigar a los pueblos impíos;"], ["8", "para aprisionar con grillos a sus reyes, y con esposas de hierro a sus magnates;"], ["9", "para ejecutar en ellos el juicio decretado: Gloria es ésta que está reservada para todos sus santos. ¡Aleluya!"]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Hoy nos ha nacido un niño que se llamará Dios fuerte. Aleluya._", "la": "Párvulus fílius hódie natus est nobis, et vocábitur Deus fortis, allelúia."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "heb 1:1-2", "content": {"la": [["1", "Multifariam, multisque modis olim Deus loquens patribus in prophetis :"], ["2", "novissime, diebus istis locutus est nobis in Filio, quem constituit haeredem universorum, per quem fecit et saecula :"]], "es": [["1", "Dios, que en olro tiempo habló á nuestros padres en diferenlcs ocasiones, y de muchas maneras por los Profetas,"], ["2", "nos ha hablado úllimamente en esíos dias, por medio de su Hijo Jesu-Chris(o, á quien constituyo heredero universal de todas las cosas, por quien crió también los siglos y cuanto ha existido en ellos:"]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Notum fecit Dóminus,* Allelúia, allelúia. Notum.", "℟. Salutáre suum,* Allelúia, allelúia. Glória Patri. Notum."], "es": ["$℣. $El Señor ha revelado, Aleluya. Aleluya. ", "$℟. $El Señor ha revelado, Aleluya. Aleluya. ", "$℣. $Su salvación.", "$℟. $Aleluya. Aleluya. ", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $El Señor ha revelado, Aleluya. Aleluya. "]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Vestri capilli capitis omnes numerati sunt: nolite timere: multis passeribus meliores estis vos.", "es": "Hasta los cabellos de vuestra cabeza están todos contados: no temáis, vosotros valéis más que muchos pajarillos."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Vestri capilli capitis omnes numerati sunt: nolite timere: multis passeribus meliores estis vos.", "es": "Hasta los cabellos de vuestra cabeza están todos contados: no temáis, vosotros valéis más que muchos pajarillos."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Quia Deus in sua misericórdia Christum, príncipem pacis, nobis misit, cum fidúcia clamémus:", "– Pax homínibus bonæ voluntátis.", "Deus omnípotens, Pater Dómini nostri Iesu Christi, quo témpore Ecclésia salvíficum tuum célebrat amórem,", "laudem nostram suscípere dignáre propítius.", "– Pax homínibus bonæ voluntátis.", "Qui ab inítio victóriam tuam per Christum salvatórem nostrum homínibus promisísti,", "Evangélii lúmine omnes hómines illustrári concéde.", "– Pax homínibus bonæ voluntátis.", "In laudem Fílii tui, cuius diem cum gáudio Abraham prævídit, patriárchæ speravérunt, prophétæ nuntiavérunt et gentes desideravérunt,", "fac ut omnis Israel salvus fiat.", "– Pax homínibus bonæ voluntátis.", "Qui voluísti nativitátem Fílii tui a cælórum spirítibus prædicári atque ab Apóstolis, martýribus et fidélibus sæculórum ómnium collaudári,", "pacem in terris largíre, quam nuntiavérunt ángeli.", "– Pax homínibus bonæ voluntátis."], "es": ["Ya que Dios en su misericordia nos ha enviado a Cristo, príncipe de la paz, digamos con toda confianza:", "- Dios todopoderoso, Padre de nuestro Señor Jesucristo, en estos días en que la Iglesia celebra tu amor salvífico, _dígnate acoger benigno nuestras alabanzas._ _Concede, Señor, la paz a todos los hombres._", "- Tú que desde el principio prometiste que, por Cristo, darías tu victoria a los hombres, _haz que todos los pueblos sean iluminados por la luz del Evangelio._ _Concede, Señor, la paz a todos los hombres._", "- Para gloria de tu Hijo, cuyo día Abraham contempló lleno de alegría, los patriarcas esperaron, los profetas anunciaron y todos los pueblos desearon, _haz que el pueblo de Israel alcance la salvación._ _Concede, Señor, la paz a todos los hombres._", "- Tú que quisiste que el nacimiento de tu Hijo fuera anunciado por los espíritus celestes y celebrado por los apóstoles, los mártires y los fieles de todos los siglos, _concede a la tierra aquella paz que anunciaron los ángeles._ _Concede, Señor, la paz a todos los hombres._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Deus, pro cujus Ecclésia gloriósus Póntifex Thomas gládiis impiórum occúbuit: præsta, quǽsumus; ut omnes, qui ejus implórant auxílium, petitiónis suæ salutárem consequántur efféctum.", "es": "Dios todopoderoso, a quien nadie ha visto nunca, tú que has disipado las tinieblas del mundo con la venida de Cristo, la luz verdadera, míranos complacido, para que podamos cantar dignamente la gloria del nacimiento de tu Hijo. Que vive y reina contigo."}, "ref": "Sancti Thomæ Becket, episcopi et martyris"}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Eres príncipe desde el día de tu nacimiento, entre esplendores sagrados; yo mismo te engendré, como rocío, antes de la aurora._", "la": "Tecum princípium in die virtútis tuæ, in splendóribus sanctórum, ex útero ante lucíferum génui te."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 109:1-5,7", "content": {"la": [["1", "Psalmus David. Dixit Dominus Domino meo : Sede a dextris meis, donec ponam inimicos tuos scabellum pedum tuorum."], ["2", "Virgam virtutis tuae emittet Dominus ex Sion : dominare in medio inimicorum tuorum."], ["3", "Tecum principium in die virtutis tuae in splendoribus sanctorum; ex utero, ante luciferum, genui te."], ["4", "Juravit Dominus, et non poenitebit eum : Tu es sacerdos in aeternum secundum ordinem Melchisedech."], ["5", "Dominus a dextris tuis; confregit in die irae suae reges."], ["7", "de torrente in via bibet; propterea exaltabit caput."]], "es": [["1", "El Señor dijo a mi Señor: Siéntate a mi diestra, mientras que yo pongo a tus enemigos por tarima de tus pies."], ["2", "De Sión hará salir el Señor el cetro de tu poder; domina tú en medio de tus enemigos."], ["3", "Contigo está el principado el día de tu poderío, en medio de los resplandores de la santidad; de mis entrañas te engendré, antes de existir el lucero de la mañana."], ["4", "Juró el Señor, y no se arrepentirá, y dijo: Tú eres sacerdote sempiterno, según el orden de Melquisedec."], ["5", "El Señor está a tu diestra; en el día de su ira destrozó a los reyes."], ["7", "Beberá del torrente durante el camino, por eso levantará su cabeza."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Eres príncipe desde el día de tu nacimiento, entre esplendores sagrados; yo mismo te engendré, como rocío, antes de la aurora._", "la": "Tecum princípium in die virtútis tuæ, in splendóribus sanctórum, ex útero ante lucíferum génui te."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Del Señor vienen la misericordia y la redención copiosa._", "la": "Apud Dóminum misericórdia, et copiósa apud eum redémptio."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 129", "content": {"la": [["1", "Canticum graduum. De profundis clamavi ad te, Domine;"], ["2", "Domine, exaudi vocem meam. Fiant aures tuae intendentes in vocem deprecationis meae."], ["3", "Si iniquitates observaveris, Domine, Domine, quis sustinebit?"], ["4", "Quia apud te propitiatio est; et propter legem tuam sustinui te, Domine. Sustinuit anima mea in verbo ejus;"], ["5", "speravit anima mea in Domino."], ["6", "A custodia matutina usque ad noctem, speret Israel in Domino;"], ["7", "quia apud Dominum misericordia, et copiosa apud eum redemptio."], ["8", "Et ipse redimet Israel ex omnibus iniquitatibus ejus."]], "es": [["1", "Desde lo más profundo clamé a ti, ¡oh Señor!"], ["2", "Oye, Señor, benignamente mi voz. Estén atentos tus oídos a la voz de mis plegarias."], ["3", "Si te pones a examinar, Señor, nuestras maldades, ¿quién podrá subsistir, ¡oh Señor!, en tu presencia?"], ["4", "Mas en ti se halla siempre la clemencia; y en vista de tu ley he confiado en ti, ¡oh Señor! en la promesa del Señor se ha apoyado mi alma."], ["5", "En el Señor ha puesto su esperanza."], ["6", "Desde el amanecer hasta la noche espere Israel en el Señor."], ["7", "Porque en el Señor está la misericordia, y en su mano tiene una redención abundantísima."], ["8", "Y es él el que redimirá a Israel de todas sus iniquidades."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Del Señor vienen la misericordia y la redención copiosa._", "la": "Apud Dóminum misericórdia, et copiósa apud eum redémptio."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_En el principio, antes de los siglos, la Palabra era Dios, y hoy esta Palabra ha nacido como Salvador del mundo._", "la": "In princípio et ante sǽcula Deus erat Verbum: ipse natus est hódie Salvátor mundi."}}, {"kind": "psalm", "label": "canticle", "ref": "col 1:12-20", "content": {"la": [["12", "gratias agentes Deo Patri, qui dignos nos fecit in partem sortis sanctorum in lumine :"], ["13", "qui eripuit nos de potestate tenebrarum, et transtulit in regnum filii dilectionis suae,"], ["14", "in quo habemus redemptionem per sanguinem ejus, remissionem peccatorum :"], ["15", "qui est imago Dei invisibilis, primogenitus omnis creaturae :"], ["16", "quoniam in ipso condita sunt universa in caelis, et in terra, visibilia, et invisibilia, sive throni, sive dominationes, sive principatus, sive potestates : omnia per ipsum et in ipso creata sunt :"], ["17", "et ipse est ante omnes, et omnia in ipso constant."], ["18", "Et ipse est caput corporis Ecclesiae, qui est principium, primogenitus ex mortuis : ut sit in omnibus ipse primatum tenens :"], ["19", "quia in ipso complacuit, omnem plenitudinem inhabitare :"], ["20", "et per eum reconciliare omnia in ipsum, pacificans per sanguinem crucis ejus, sive quae in terris, sive quae in caelis sunt."]], "es": [["12", "dando gracias á Dios Padre, que nos ha hecho dignos de participar de la suerte y herencia úc los santos, iluminándonos con la luz del Evanyelio;"], ["13", "que nos ha arrebatado del poder de las tinieblas, y trasladado al reino de su Hijo muy amado;"], ["14", "por cuya sangre hemos sido nosotros rescatados, y recibido la remisión de los pecados;"], ["15", "y el cual es imágen perfecta del Dios invisible, engendrado ab eterno ante toda criatura;"], ["16", "pues por él fueron criadas todas las cosas en los cielos y en la tierra, las visibles y las invisibles, ora sean tronos, ora dominaciones, ora principados, ora potestades; todas las cosas fueron criadas por él mismo, y en atención á él mismo:"], ["17", "y así él tiene ser ante todas las cosas, y todas subsisten por él, y por él son conservadas."], ["18", "Y él es la cabeza del cuerpo de la Iglesia, y el principio de la resurrección, el primero á renacer de entre los muertos, para que en todo tenga él la primacía;"], ["19", "pues plugo al Padre poner en él la plenitud de todo ser,"], ["20", "y reconciliar por él todas las cosas consigo, restableciendo la paz entre cielo y tierra, por medio de la sangre que derramó en la cruz."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_En el principio, antes de los siglos, la Palabra era Dios, y hoy esta Palabra ha nacido como Salvador del mundo._", "la": "In princípio et ante sǽcula Deus erat Verbum: ipse natus est hódie Salvátor mundi."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "1john 1:1-3", "content": {"la": [["1", "Quod fuit ab initio, quod audivimus, quod vidimus oculis nostris, quod perspeximus, et manus nostrae contrectaverunt de verbo vitae :"], ["2", "et vita manifestata est, et vidimus, et testamur, et annuntiamus vobis vitam aeternam, quae erat apud Patrem, et apparuit nobis :"], ["3", "quod vidimus et audivimus, annuntiamus vobis, ut et vos societatem habeatis nobiscum, et societas nostra sit cum Patre, et cum Filio ejus Jesu Christo."]], "es": [["1", "Lo que fué desde el principio ó desde la eternidad, lo que oímos, lo que vimos con nuestros ojos, y contemplamos, y palparon nuestras manos, tocante al Verbo de la vida:"], ["2", "Vida que se hizo patente, y así la vimos, y damos de ella testimonio; y os evangelizamos esta vida eterna, la cual estaba en el Padre, y se dejó ver de nosotros:"], ["3", "Esto que vimos y oímos, es lo que os anunciamos, para que tengáis también vosotros unión con nosotros, y nuestra común unión sea con el Padre y con su Hijo Jesu-Cristo."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Verbum caro factum est, * Allelúia, allelúia. Verbum.", "℟. Et habitávit in nobis.* Allelúia, allelúia. Glória Patri. Verbum."], "es": ["$℣. $La Palabra se hizo carne. Aleluya, Aleluya.", "$℟. $La Palabra se hizo carne. Aleluya, Aleluya.", "$℣. $Y acampó entre nosotros.", "$℟. $Aleluya, Aleluya.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $La Palabra se hizo carne. Aleluya, Aleluya."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Iste sanctus pro lege Dei sui certavit usque ad mortem, et a verbis impiorum non timuit: fundatus enim erat supra firmam petram.", "es": "Este santo luchó hasta la muerte por la ley de su Dios, y no temió las palabras de los impíos, porque estaba cimentado sobre roca firme."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Iste sanctus pro lege Dei sui certavit usque ad mortem, et a verbis impiorum non timuit: fundatus enim erat supra firmam petram.", "es": "Este santo luchó hasta la muerte por la ley de su Dios, y no temió las palabras de los impíos, porque estaba cimentado sobre roca firme."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Deum Patrem miserentíssimum, qui Fílium suum unxit Spíritu Sancto ad evangelizándos páuperes, rogémus:", "– Dómine miséricors, miserére nostri.", "Miséricors et sempitérne Deus, qui vis omnes hómines salvos fíeri et ad agnitiónem veritátis tuæ perveníre, tibi grátias ágimus, qui Unigénitum tuum mundo dedísti:", "omnem terram in eius nativitáte lætífica.", "– Dómine miséricors, miserére nostri.", "Misísti eum evangelizáre paupéribus, nuntiáre captívis remissiónem et prædicáre tempus grátiæ:", "libertátem homínibus et pacem largíre.", "– Dómine miséricors, miserére nostri.", "Ad eum direxísti géntium sapiéntes, ut adorárent eum:", "áccipe fídei nostræ et oratiónis obséquium.", "– Dómine miséricors, miserére nostri.", "Et, post illos, omnes hómines vocas de ténebris in admirábile lumen tuum, ut in nómine Iesu omne genu flectátur:", "fac ut testes huius Evangélii evadámus.", "– Dómine miséricors, miserére nostri.", "Christum, in Béthlehem natum, lumen fecísti ad revelatiónem géntium:", "glóriam vultus tui frátribus, qui obiérunt, revéla.", "– Dómine miséricors, miserére nostri."], "es": ["Acudamos a Dios Padre, que ungió a su Unigénito con el Espíritu Santo para que anunciara la salvación a los pobres, y digámosle:", "- Dios eterno y lleno de misericordia, que quieres que todos los hombres se salven y lleguen al conocimiento de la verdad, te damos gracias porque has enviado a tu Hijo al mundo; _y te pedimos que todos los hombres puedan alegrarse de su nacimiento._ _Dios de misericordia, ten piedad de nosotros._", "- Tú que has enviado a Cristo, para anunciar la salvación a los pobres, la liberación a los oprimidos y para proclamar un tiempo de gracia, _concede al mundo entero la libertad y la paz._ _Dios de misericordia, ten piedad de nosotros._", "- Tú que iluminaste a los sabios de Oriente y los encaminaste para que adoraran a tu Hijo, _ilumina nuestra fe y acepta la ofrenda de nuestra oración._ _Dios de misericordia, ten piedad de nosotros._", "- Tú que convocas a todos los hombres y, sacándolos de los dominios de las tinieblas, los trasladas al reino de tu Hijo querido, para que al nombre de Jesús toda rodilla se doble, _haz que demos siempre testimonio de tu Evangelio._ _Dios de misericordia, ten piedad de nosotros._", "- Tú que quisiste que Cristo, nacido en Belén, fuera luz para alumbrar a las naciones, _haz que la luz eterna brille sobre nuestros difuntos._ _Dios de misericordia, ten piedad de nosotros._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Deus, pro cujus Ecclésia gloriósus Póntifex Thomas gládiis impiórum occúbuit: præsta, quǽsumus; ut omnes, qui ejus implórant auxílium, petitiónis suæ salutárem consequántur efféctum.", "es": "Dios todopoderoso, a quien nadie ha visto nunca, tú que has disipado las tinieblas del mundo con la venida de Cristo, la luz verdadera, míranos complacido, para que podamos cantar dignamente la gloria del nacimiento de tu Hijo. Que vive y reina contigo."}, "ref": "Sancti Thomæ Becket, episcopi et martyris"}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Ne intres in iudicium cum servo tuo, Domine.", "es": "No entres en juicio con tu siervo, Señor."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 142:1-11", "content": {"la": [["1", "Psalmus David, quando persequebatur eum Absalom, filius ejus. Domine, exaudi orationem meam; auribus percipe obsecrationem meam in veritate tua; exaudi me in tua justitia."], ["2", "Et non intres in judicium cum servo tuo, quia non justificabitur in conspectu tuo omnis vivens."], ["3", "Quia persecutus est inimicus animam meam, humiliavit in terra vitam meam; collocavit me in obscuris, sicut mortuos saeculi."], ["4", "Et anxiatus est super me spiritus meus; in me turbatum est cor meum."], ["5", "Memor fui dierum antiquorum : meditatus sum in omnibus operibus tuis, in factis manuum tuarum meditabar."], ["6", "Expandi manus meas ad te; anima mea sicut terra sine aqua tibi."], ["7", "Velociter exaudi me, Domine; defecit spiritus meus. Non avertas faciem tuam a me, et similis ero descendentibus in lacum."], ["8", "Auditam fac mihi mane misericordiam tuam, quia in te speravi. Notam fac mihi viam in qua ambulem, quia ad te levavi animam meam."], ["9", "Eripe me de inimicis meis, Domine; ad te confugi."], ["10", "Doce me facere voluntatem tuam, quia Deus meus es tu. Spiritus tuus bonus deducet me in terram rectam."], ["11", "Propter nomen tuum, Domine, vivificabis me; in aequitate tua, educes de tribulatione animam meam;"]], "es": [["1", "¡Oh Señor!, escucha benigno mi oración; presta oídos a mi súplica, según la verdad de tus promesas; óyeme por tu misericordia."], ["2", "Mas no quieres entrar en juicio con tu siervo; porque ningún viviente puede aparecer justo en tu presencia."], ["3", "Ya ves cómo el enemigo ha perseguido mi alma; abatida tiene hasta el suelo la vida mía. Me ha confinado en lugares tenebrosos, como a los que murieron hace ya un siglo."], ["4", "Mi espíritu padece terribles angustias; está mi corazón en continua zozobra."], ["5", "Mas me acordé luego de los días antiguos; me puse a meditar todas tus obras; ponderaba los efectos maravillosos de tu poder."], ["6", "Levanté mis manos hacia ti como tierra falta de agua, así está por ti suspirando el alma mía."], ["7", "Oyeme luego, ¡oh Señor!, mi espíritu ha desfallecido. No retires de mí tu rostro; haz que no haya de contarme ya entre los muertos."], ["8", "Hazme sentir cuanto antes tu misericordia, pues en ti he puesto mi esperanza. Muéstrame el camino que debo seguir, ya que hacia ti he levantado mi corazón."], ["9", "Líbrame, ¡oh Señor!, de mis enemigos; a ti me acojo."], ["10", "Enséñame a cumplir tu voluntad, pues tú eres mi Dios. Entonces tu espíritu es infinitamente bueno, me conducirá a la tierra de la rectitud y santidad."], ["11", "Por amor de tu Nombre, ¡oh Señor!, me darás la vida, según la justicia de tus promesas. A mi alma la sacarás de la tribulación,"]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Ne intres in iudicium cum servo tuo, Domine.", "es": "No entres en juicio con tu siervo, Señor."}}, {"kind": "psalm", "label": "reading", "ref": "1Pet 5:8-9a", "content": {"la": [["8", "Sobrii estote, et vigilate : quia adversarius vester diabolus tamquam leo rugiens circuit, quaerens quem devoret :"], ["9", "cui resistite fortes in fide : scientes eamdem passionem ei quae in mundo est vestrae fraternitati fieri."]], "es": [["8", "Sed sobrios, y 'estad en continua vela, porque vuestro enemigo el diablo anda girando como león rugiente al rededor de vosotros, en busca de presa que devorar: ü resistidle firmes en la fé, sabiendo que la misma tribulación padecen vuestros hermanos, cuantos hay en el mundo."], ["9", "Resistidle firmes en la fe: sabiendo que la misma tribulacion padecen vuestros hermanos, cuantos hay en el mundo."]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Noctem istam, quæsumus, Domine, benignus illumina, et ita fac in pace nos tuos famulos obdormire, ut læti ad novi diei claritatem in tuo nomine suscitemur. Per Christum Dominum nostrum.", "es": "Ilumina, Señor, nuestra noche y concédenos un descanso tranquilo; que mañana nos levantemos en tu nombre y podamos contemplar, con salud y gozo, el clarear del nuevo día. Por Jesucristo nuestro Señor."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-12-30": {"date_human": {"en": "Wednesday, December 30, 2026", "es": "Miércoles, 30 de diciembre de 2026", "la": "Feria IV, die 30 Decembris, anno 2026"}, "day_description": {"en": "Wednesday within the Octave of Christmas (day 6)", "es": "Miércoles de la Octava de Navidad (día 6)", "la": "Feria IV infra Octavam Nativitatis (dies 6)"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_«¿A Quién habéis visto pastores? Hablad, contádnoslo. ¿Quién se ha aparecido en la tierra?» «Hemos visto al recién nacido y a los coros de  ángeles alabando al Señor.» Aleluya._", "la": "Quem vidístis, pastóres? dícite, annuntiáte nobis: in terris quis appáruit? Natum vídimus, et choros Angelórum collaudántes Dóminum, allelúia."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 62:2-9", "content": {"la": [["2", "Deus, Deus meus, ad te de luce vigilo. Sitivit in te anima mea; quam multipliciter tibi caro mea!"], ["3", "In terra deserta, et invia, et inaquosa, sic in sancto apparui tibi, ut viderem virtutem tuam et gloriam tuam."], ["4", "Quoniam melior est misericordia tua super vitas, labia mea laudabunt te."], ["5", "Sic benedicam te in vita mea; et in nomine tuo levabo manus meas."], ["6", "Sicut adipe et pinguedine repleatur anima mea, et labiis exsultationis laudabit os meum."], ["7", "Si memor fui tui super stratum meum, in matutinis meditabor in te."], ["8", "Quia fuisti adjutor meus, et in velamento alarum tuarum exsultabo."], ["9", "Adhaesit anima mea post te; me suscepit dextera tua."]], "es": [["2", "¡Dios mío, oh mi Dios!, a ti aspiro, y me dirijo desde que apunta la aurora. De ti está sedienta el alma mía. ¡Y de cuántas maneras lo está también este mi cuerpo!"], ["3", "En esta tierra desierta, intransitable y sin agua, me pongo en tu presencia, como si me hallara en el santuario, para contemplar tu poder y la gloria tuya."], ["4", "Más apreciable es que mil vidas tu misericordia; por tanto se ocuparán mis labios en tu alabanza."], ["5", "Por esto te bendeciré toda mi vida, y alzaré mis manos invocando tu Nombre."], ["6", "Quede mi alma bien llena de ti, como de un manjar jugoso; y entonces con labios que rebosen de júbilo, te cantará mi boca himnos de alabanza."], ["7", "Me acordaba de ti en mi lecho; en ti meditaba luego que amanecía;"], ["8", "pues tú eres mi amparo, y a la sombra de tus alas me regocijaré."], ["9", "En pos de ti va anhelando el alma mía; me ha protegido tu diestra."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_«¿A Quién habéis visto pastores? Hablad, contádnoslo. ¿Quién se ha aparecido en la tierra?» «Hemos visto al recién nacido y a los coros de  ángeles alabando al Señor.» Aleluya._", "la": "Quem vidístis, pastóres? dícite, annuntiáte nobis: in terris quis appáruit? Natum vídimus, et choros Angelórum collaudántes Dóminum, allelúia."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El ángel dijo a los pastores: «Os anuncio una gran alegría; hoy os ha nacido el Salvador del mundo.» Aleluya._", "la": "Angelus ad pastóres ait: Annúntio vobis gáudium magnum, quia natus est vobis hódie Salvátor mundi, allelúia."}}, {"kind": "psalm", "label": "canticle", "ref": "dan 3:57-88,56", "content": {"la": [["57", "Benedicite, omnia opera Domini, Domino : laudate et superexaltate eum in saecula."], ["58", "Benedicite, angeli Domini, Domino : laudate et superexaltate eum in saecula."], ["59", "Benedicite, caeli, Domino : laudate et superexaltate eum in saecula."], ["60", "Benedicite, aquae omnes, quae super caelos sunt, Domino : laudate et superexaltate eum in saecula."], ["61", "Benedicite, omnes virtutes Domini, Domino : laudate et superexaltate eum in saecula."], ["62", "Benedicite, sol et luna, Domino : laudate et superexaltate eum in saecula."], ["63", "Benedicite, stellae caeli, Domino : laudate et superexaltate eum in saecula."], ["64", "Benedicite, omnis imber et ros, Domino : laudate et superexaltate eum in saecula."], ["65", "Benedicite, omnes spiritus Dei, Domino : laudate et superexaltate eum in saecula."], ["66", "Benedicite, ignis et aestus, Domino : laudate et superexaltate eum in saecula."], ["67", "Benedicite, frigus et aestus, Domino : laudate et superexaltate eum in saecula."], ["68", "Benedicite, rores et pruina, Domino : laudate et superexaltate eum in saecula."], ["69", "Benedicite, gelu et frigus, Domino : laudate et superexaltate eum in saecula."], ["70", "Benedicite, glacies et nives, Domino : laudate et superexaltate eum in saecula."], ["71", "Benedicite, noctes et dies, Domino laudate et superexaltate eum in saecula."], ["72", "Benedicite, lux et tenebrae, Domino : laudate et superexaltate eum in saecula."], ["73", "Benedicite, fulgura et nubes, Domino : laudate et superexaltate eum in saecula."], ["74", "Benedicat terra Dominum : laudet et superexaltet eum in saecula."], ["75", "Benedicite, montes et colles, Domino : laudate et superexaltate eum in saecula."], ["76", "Benedicite, universa germinantia in terra, Domino : laudate et superexaltate eum in saecula."], ["77", "Benedicite, fontes, Domino : laudate et superexaltate eum in saecula."], ["78", "Benedicite, maria et flumina, Domino : laudate et superexaltate eum in saecula."], ["79", "Benedicite, cete, et omnia quae moventur in aquis, Domino : laudate et superexaltate eum in saecula."], ["80", "Benedicite, omnes volucres caeli, Domino : laudate et superexaltate eum in saecula."], ["81", "Benedicite, omnes bestiae et pecora, Domino : laudate et superexaltate eum in saecula."], ["82", "Benedicite, filii hominum, Domino : laudate et superexaltate eum in saecula."], ["83", "Benedicat Israel Dominum : laudet et superexaltet eum in saecula."], ["84", "Benedicite, sacerdotes Domini, Domino : laudate et superexaltate eum in saecula."], ["85", "Benedicite, servi Domini, Domino : laudate et superexaltate eum in saecula."], ["86", "Benedicite, spiritus et animae justorum, Domino : laudate et superexaltate eum in saecula."], ["87", "Benedicite, sancti et humiles corde, Domino : laudate et superexaltate eum in saecula."], ["88", "Benedicite, Anania, Azaria, Misael, Domino : laudate et superexaltate eum in saecula : quia eruit nos de inferno, et salvos fecit de manu mortis : et liberavit nos de medio ardentis flammae, et de medio ignis eruit nos."], ["56", "Benedictus es in firmamento caeli : et laudabilis et gloriosus in saecula."]], "es": [["57", "Obras todas del Señor, bendecid al Señor, y loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["58", "Angeles del Señor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["59", "Cielos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["60", "Aguas todas que estáis sobre los cielos *, bendecid al Señor: alabadle, y ensalzadle sobre todas las cosas por todos los siglos."], ["61", "Virtudes todas ó milicias celestiales ', bendecid vosotras al Señor: loadle y ensalzadle sobre todas"], ["62", "Sol y luna, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["63", "Estrellas del cielo, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["64", "Lluvias todas y rocíos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["65", "Espíritus ó vientos de Dios, bendecid todos vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["66", "Fuego y calor, bendecid vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["67", "Frió y calor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["68", "Rocíos y escarchas, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["69", "Hielos y frios, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["70", "Heladas y nieves, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["71", "Noches y dias, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["72", "Luz y tinieblas, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["73", "Relámpagos y nubes, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["74", "Bendiga al Señor la tierra, alábele y ensálzele sobre todas las cosas por todos los siglos."], ["75", "Montes y collados, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["76", "Plantas todas que nacéis en la tierra, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["77", "Fuentes, bendecid al Señor: loadle y ensalzíidle sobre todas las cosas por todos los siglos."], ["78", "Mares y rios, bendecid al Señor: loadle y"], ["79", "Ballenas y peces todos, que giráis por las aguas, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["80", "Aves todas del cielo, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["81", "Bestias todas y ganados, bendecid al Señor: loadle y ensab:adle por todos los siglos sobre todas las cosas."], ["82", "Oh hijos de los hombres, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["83", "Bendiga Israel al Señor: alábele y ensálzele por todos los siglos sobre todas las cosas."], ["84", "Vosotros sacerdotes del Señor, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["85", "Siervos del Señor, bendecid vosotros al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["86", "Espíritus y almas de los justos, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["87", "Vosotros santos, y humildes de corazón, bendecid al Señor: alabadle y ensalzadle por todos los siglos sobre todas las cosas."], ["88", "Vosotros, Ananías, Azarías y Misael, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas. Porque él nos ha salvado del inlierno ó del sepulcro, y librado de las manos de la ( APÍfüLO III. '¿i'o muelle: y nos ha sacado de en medio de las ardientes llamas, y libertado del fuego del homo."], ["56", "Bendito eres tú en el firmamento del cielo, y digno de loor, y de gloria por todos los siglos."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El ángel dijo a los pastores: «Os anuncio una gran alegría; hoy os ha nacido el Salvador del mundo.» Aleluya._", "la": "Angelus ad pastóres ait: Annúntio vobis gáudium magnum, quia natus est vobis hódie Salvátor mundi, allelúia."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Hoy nos ha nacido un niño que se llamará Dios fuerte. Aleluya._", "la": "Párvulus fílius hódie natus est nobis, et vocábitur Deus fortis, allelúia."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 149", "content": {"la": [["1", "Alleluja. Cantate Domino canticum novum; laus ejus in ecclesia sanctorum."], ["2", "Laetetur Israel in eo qui fecit eum, et filii Sion exsultent in rege suo."], ["3", "Laudent nomen ejus in choro, in tympano et psalterio psallant ei."], ["4", "Quia beneplacitum est Domino in populo suo, et exaltabit mansuetos in salutem."], ["5", "Exsultabunt sancti in gloria, laetabuntur in cubilibus suis."], ["6", "Exaltationes Dei in gutture eorum : et gladii ancipites in manibus eorum :"], ["7", "ad faciendam vindictam in nationibus, increpationes in populis;"], ["8", "ad alligandos reges eorum in compedibus, et nobiles eorum in manicis ferreis;"], ["9", "ut faciant in eis judicium conscriptum : gloria haec est omnibus sanctis ejus. Alleluja."]], "es": [["1", "Cantad al Señor un cántico nuevo, resuenen sus loores en la reunión de los santos."], ["2", "Que se alegre Israel en el Señor que le creó, y se regocijen en su rey los hijos de Sión."], ["3", "Celebren su excelso Nombre con armoniosos conciertos, y publiquen sus alabanzas al son del pandero y salterio."], ["4", "Porque el Señor ha mirado benignamente a su pueblo; y exaltará a los humildes y los salvará."], ["5", "Se gozarán los santos en la gloria, y se regocijarán en sus moradas."], ["6", "Resonarán en sus bocas los elogios sublimes de Dios; y vibrarán en sus manos espadas de dos filos,"], ["7", "para ejecutar la divina venganza en las naciones, y castigar a los pueblos impíos;"], ["8", "para aprisionar con grillos a sus reyes, y con esposas de hierro a sus magnates;"], ["9", "para ejecutar en ellos el juicio decretado: Gloria es ésta que está reservada para todos sus santos. ¡Aleluya!"]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Hoy nos ha nacido un niño que se llamará Dios fuerte. Aleluya._", "la": "Párvulus fílius hódie natus est nobis, et vocábitur Deus fortis, allelúia."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "isa 9:6", "content": {"la": [["6", "Parvulus enim natus est nobis, et filius datus est nobis, et factus est principatus super humerum ejus : et vocabitur nomen ejus, Admirabilis, Consiliarius, Deus, Fortis, Pater futuri saeculi, Princeps pacis."]], "es": [["6", "Ahora que ha nacido un párvulo para nosotros, y se nos ha dado un hijo, el cual lleva sobre sus hombros el principado, ó la divisa de Rey, y tendrá por nombre el Admirable, el Consejero, Dios, el Fuerte, el Padre del siglo venidero, el Príncipe de paz."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Notum fecit Dóminus,* Allelúia, allelúia. Notum.", "℟. Salutáre suum,* Allelúia, allelúia. Glória Patri. Notum."], "es": ["$℣. $El Señor ha revelado, Aleluya. Aleluya. ", "$℟. $El Señor ha revelado, Aleluya. Aleluya. ", "$℣. $Su salvación.", "$℟. $Aleluya. Aleluya. ", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $El Señor ha revelado, Aleluya. Aleluya. "]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Al nacer el Señor, los ángeles cantaban, diciendo «la salvación es de nuestro Dios, que está sentado en el trono, y del Cordero.»_", "la": "Nato Dómino, angelórum chorus canébat, dicéntes: Salus Deo nostro, sedénti super thronum, et Agno."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_Al nacer el Señor, los ángeles cantaban, diciendo «la salvación es de nuestro Dios, que está sentado en el trono, y del Cordero.»_", "la": "Nato Dómino, angelórum chorus canébat, dicéntes: Salus Deo nostro, sedénti super thronum, et Agno."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christum, in quo Pater ómnia instauránda decrévit, precémur:", "– Fili Dei amantíssime, audi nos.", "Fili Dei, qui eras in princípio apud Patrem et in plenitúdine témporum homo factus es,", "da nobis in omnes fratérnam caritátem.", "– Fili Dei amantíssime, audi nos.", "Pauper factus es, ut paupertáte tua ditarémur; temetípsum exinanísti, ut humilitáte tua resurgerémus, consórtes effécti glóriæ tuæ:", "Evangélii tui fidéles fac nos minístros.", "– Fili Dei amantíssime, audi nos.", "In ténebris et in umbra mortis nobis sedéntibus lumen dedísti:", "virtútem, iustítiam et pacem páriter præsta.", "– Fili Dei amantíssime, audi nos.", "Cor rectum et sincérum da nobis ad audiéndum verbum tuum,", "atque in nobis et in mundo abundántius pérfice fructus ad glóriam tuam.", "– Fili Dei amantíssime, audi nos."], "es": ["Oremos a Cristo, el Señor, en quien el Padre ha querido recapitular todas las cosas, y digámosle:", "- Hijo de Dios que en el principio estabas junto al Padre y, en el momento culminante de la historia, has querido nacer como hombre, _haz que todos nos amemos como hermanos._ _Hijo amado de Dios, escucha nuestra oración._", "- Tú que te has hecho pobre para que, con tu pobreza, nosotros nos hagamos ricos y te despojaste de tu rango para que, con tu humillación, nosotros  resucitáramos y llegáramos a participar de tu gloria, _haz que seamos anunciadores fieles de tu Evangelio._ _Hijo amado de Dios, escucha nuestra oración._", "- Tú que nos has iluminado cuando vivíamos aún en tinieblas y en sombra de muerte, _concédenos también la santidad, la justicia y la paz._ _Hijo amado de Dios, escucha nuestra oración._", "- Otórganos un corazón recto, y sincero que atienda siempre a tu palabra, _y lleva a plenitud en nosotros y en todos los hombres tu plan de salvación._ _Hijo amado de Dios, escucha nuestra oración._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Concéde, quǽsumus, omnípotens Deus, ut nos Unigéniti tui nova per carnem natívitas líberet, quos sub peccáti iugo vetústa sérvitus tenet. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Dios todopoderoso, por este nuevo nacimiento de tu Hijo en nuestra carne, líbranos del yugo con que nos domina la antigua servidumbre del pecado. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Eres príncipe desde el día de tu nacimiento, entre esplendores sagrados; yo mismo te engendré, como rocío, antes de la aurora._", "la": "Tecum princípium in die virtútis tuæ, in splendóribus sanctórum, ex útero ante lucíferum génui te."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 109:1-5,7", "content": {"la": [["1", "Psalmus David. Dixit Dominus Domino meo : Sede a dextris meis, donec ponam inimicos tuos scabellum pedum tuorum."], ["2", "Virgam virtutis tuae emittet Dominus ex Sion : dominare in medio inimicorum tuorum."], ["3", "Tecum principium in die virtutis tuae in splendoribus sanctorum; ex utero, ante luciferum, genui te."], ["4", "Juravit Dominus, et non poenitebit eum : Tu es sacerdos in aeternum secundum ordinem Melchisedech."], ["5", "Dominus a dextris tuis; confregit in die irae suae reges."], ["7", "de torrente in via bibet; propterea exaltabit caput."]], "es": [["1", "El Señor dijo a mi Señor: Siéntate a mi diestra, mientras que yo pongo a tus enemigos por tarima de tus pies."], ["2", "De Sión hará salir el Señor el cetro de tu poder; domina tú en medio de tus enemigos."], ["3", "Contigo está el principado el día de tu poderío, en medio de los resplandores de la santidad; de mis entrañas te engendré, antes de existir el lucero de la mañana."], ["4", "Juró el Señor, y no se arrepentirá, y dijo: Tú eres sacerdote sempiterno, según el orden de Melquisedec."], ["5", "El Señor está a tu diestra; en el día de su ira destrozó a los reyes."], ["7", "Beberá del torrente durante el camino, por eso levantará su cabeza."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Eres príncipe desde el día de tu nacimiento, entre esplendores sagrados; yo mismo te engendré, como rocío, antes de la aurora._", "la": "Tecum princípium in die virtútis tuæ, in splendóribus sanctórum, ex útero ante lucíferum génui te."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Del Señor vienen la misericordia y la redención copiosa._", "la": "Apud Dóminum misericórdia, et copiósa apud eum redémptio."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 129", "content": {"la": [["1", "Canticum graduum. De profundis clamavi ad te, Domine;"], ["2", "Domine, exaudi vocem meam. Fiant aures tuae intendentes in vocem deprecationis meae."], ["3", "Si iniquitates observaveris, Domine, Domine, quis sustinebit?"], ["4", "Quia apud te propitiatio est; et propter legem tuam sustinui te, Domine. Sustinuit anima mea in verbo ejus;"], ["5", "speravit anima mea in Domino."], ["6", "A custodia matutina usque ad noctem, speret Israel in Domino;"], ["7", "quia apud Dominum misericordia, et copiosa apud eum redemptio."], ["8", "Et ipse redimet Israel ex omnibus iniquitatibus ejus."]], "es": [["1", "Desde lo más profundo clamé a ti, ¡oh Señor!"], ["2", "Oye, Señor, benignamente mi voz. Estén atentos tus oídos a la voz de mis plegarias."], ["3", "Si te pones a examinar, Señor, nuestras maldades, ¿quién podrá subsistir, ¡oh Señor!, en tu presencia?"], ["4", "Mas en ti se halla siempre la clemencia; y en vista de tu ley he confiado en ti, ¡oh Señor! en la promesa del Señor se ha apoyado mi alma."], ["5", "En el Señor ha puesto su esperanza."], ["6", "Desde el amanecer hasta la noche espere Israel en el Señor."], ["7", "Porque en el Señor está la misericordia, y en su mano tiene una redención abundantísima."], ["8", "Y es él el que redimirá a Israel de todas sus iniquidades."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Del Señor vienen la misericordia y la redención copiosa._", "la": "Apud Dóminum misericórdia, et copiósa apud eum redémptio."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_En el principio, antes de los siglos, la Palabra era Dios, y hoy esta Palabra ha nacido como Salvador del mundo._", "la": "In princípio et ante sǽcula Deus erat Verbum: ipse natus est hódie Salvátor mundi."}}, {"kind": "psalm", "label": "canticle", "ref": "col 1:12-20", "content": {"la": [["12", "gratias agentes Deo Patri, qui dignos nos fecit in partem sortis sanctorum in lumine :"], ["13", "qui eripuit nos de potestate tenebrarum, et transtulit in regnum filii dilectionis suae,"], ["14", "in quo habemus redemptionem per sanguinem ejus, remissionem peccatorum :"], ["15", "qui est imago Dei invisibilis, primogenitus omnis creaturae :"], ["16", "quoniam in ipso condita sunt universa in caelis, et in terra, visibilia, et invisibilia, sive throni, sive dominationes, sive principatus, sive potestates : omnia per ipsum et in ipso creata sunt :"], ["17", "et ipse est ante omnes, et omnia in ipso constant."], ["18", "Et ipse est caput corporis Ecclesiae, qui est principium, primogenitus ex mortuis : ut sit in omnibus ipse primatum tenens :"], ["19", "quia in ipso complacuit, omnem plenitudinem inhabitare :"], ["20", "et per eum reconciliare omnia in ipsum, pacificans per sanguinem crucis ejus, sive quae in terris, sive quae in caelis sunt."]], "es": [["12", "dando gracias á Dios Padre, que nos ha hecho dignos de participar de la suerte y herencia úc los santos, iluminándonos con la luz del Evanyelio;"], ["13", "que nos ha arrebatado del poder de las tinieblas, y trasladado al reino de su Hijo muy amado;"], ["14", "por cuya sangre hemos sido nosotros rescatados, y recibido la remisión de los pecados;"], ["15", "y el cual es imágen perfecta del Dios invisible, engendrado ab eterno ante toda criatura;"], ["16", "pues por él fueron criadas todas las cosas en los cielos y en la tierra, las visibles y las invisibles, ora sean tronos, ora dominaciones, ora principados, ora potestades; todas las cosas fueron criadas por él mismo, y en atención á él mismo:"], ["17", "y así él tiene ser ante todas las cosas, y todas subsisten por él, y por él son conservadas."], ["18", "Y él es la cabeza del cuerpo de la Iglesia, y el principio de la resurrección, el primero á renacer de entre los muertos, para que en todo tenga él la primacía;"], ["19", "pues plugo al Padre poner en él la plenitud de todo ser,"], ["20", "y reconciliar por él todas las cosas consigo, restableciendo la paz entre cielo y tierra, por medio de la sangre que derramó en la cruz."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_En el principio, antes de los siglos, la Palabra era Dios, y hoy esta Palabra ha nacido como Salvador del mundo._", "la": "In princípio et ante sǽcula Deus erat Verbum: ipse natus est hódie Salvátor mundi."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "2pet 1:3-4", "content": {"la": [["3", "Quomodo omnia nobis divinae virtutis suae, quae ad vitam et pietatem donata sunt, per cognitionem ejus, qui vocavit nos propria gloria, et virtute,"], ["4", "per quem maxima, et pretiosa nobis promissa donavit : ut per haec efficiamini divinae consortes naturae : fugientes ejus, quae in mundo est, concupiscentiae corruptionem."]], "es": [["3", "así corao todos los dones que nos ha dado su po (Icr divino, correspondientes á la vida y á la piedad rist/ana, senos han comunicado por c! conocimien lo de aquel que nos llamó por su gloria y por su vir ( ud,"], ["4", "también por él mismo nos ha dado Dios las s'an-"]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Verbum caro factum est, * Allelúia, allelúia. Verbum.", "℟. Et habitávit in nobis.* Allelúia, allelúia. Glória Patri. Verbum."], "es": ["$℣. $La Palabra se hizo carne. Aleluya, Aleluya.", "$℟. $La Palabra se hizo carne. Aleluya, Aleluya.", "$℣. $Y acampó entre nosotros.", "$℟. $Aleluya, Aleluya.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $La Palabra se hizo carne. Aleluya, Aleluya."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Te glorificamos, santa Madre de Dios, porque de ti ha nacido Cristo; oh María, salva a todos los que te enaltecen._", "la": "Glorificámus te, Dei Génetrix, quia ex te natus est Christus; salva omnes qui te gloríficant."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_Te glorificamos, santa Madre de Dios, porque de ti ha nacido Cristo; oh María, salva a todos los que te enaltecen._", "la": "Glorificámus te, Dei Génetrix, quia ex te natus est Christus; salva omnes qui te gloríficant."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christo, qui est dux ortus ex Béthlehem Iudæ ad pascéndum pópulum sanctum suum, læti acclamémus:", "– Grátia tua, Dómine, nobíscum.", "Christe salvátor, desideráte géntium, diffúnde Evangélium tuum in regiónibus, quæ verbum vitæ nondum recepérunt;", "omnem hóminem ad teípsum áttrahe.", "– Grátia tua, Dómine, nobíscum.", "Christe Dómine, exténde Ecclésiam tuam et diláta locum tentórii eius,", "ut hómines ex omni lingua et natióne amplectátur.", "– Grátia tua, Dómine, nobíscum.", "Rex regum, corda et ánimas príncipum dírige,", "ut, iustítiam requiréntes, pacem ac libertátem populórum ómnium operéntur.", "– Grátia tua, Dómine, nobíscum.", "Omnípotens dominátor, fragílium fortitúdo, tentátos confírma, delápsos érige, in perículis degéntes prótege,", "decéptos et desperátos consoláre, vexatórum fidem róbora.", "– Grátia tua, Dómine, nobíscum.", "Mæstórum consolátor, agonizántes confórta,", "deduc eos ad fontes aquæ vivæ.", "– Grátia tua, Dómine, nobíscum."], "es": ["Aclamemos a Cristo, el jefe salido de Belén, tierra de Judá, para ser el pastor del pueblo de Israel, y digámosle:", "- Cristo salvador, deseado de todos los pueblos, haz que tu Evangelio llegue a aquéllos que aún no han oído la palabra de vida _y atrae a ti a todos los hombres._ _Que tu gracia, Señor, nos acompañe siempre._", "- Cristo Señor, haz que tu Iglesia se dilate por el mundo y arraigue en los pueblos, _para que en ella se congreguen los hombres de toda lengua y nación._ _Que tu gracia, Señor, nos acompañe siempre._", "- Rey de reyes, dirige la mente y la voluntad de los que gobiernan, _para que procuren la justicia y trabajen por la libertad y la paz de las naciones._ _Que tu gracia, Señor, nos acompañe siempre._", "- Señor todopoderoso, que eres la fortaleza de los frágiles, ayuda a los que están tentados, levanta a los decaídos, protege a los que están en peligro, _consuela a los que se sienten decepcionados o desesperados, robustece la confianza de los perseguidos._ _Que tu gracia, Señor, nos acompañe siempre._", "- Tú que eres el consuelo de los tristes, conforta a los agonizantes _y llévalos a los goces de tu paraíso._ _Que tu gracia, Señor, nos acompañe siempre._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Concéde, quǽsumus, omnípotens Deus, ut nos Unigéniti tui nova per carnem natívitas líberet, quos sub peccáti iugo vetústa sérvitus tenet. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Dios todopoderoso, por este nuevo nacimiento de tu Hijo en nuestra carne, líbranos del yugo con que nos domina la antigua servidumbre del pecado. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Esto mihi, Domine, in Deum protectorem.", "es": "Sé para mí, Señor, un Dios protector."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 30:2-6", "content": {"la": [["2", "In te, Domine, speravi; non confundar in aeternum; in justitia tua libera me."], ["3", "Inclina ad me aurem tuam; accelera ut eruas me. Esto mihi in Deum protectorem, et in domum refugii, ut salvum me facias :"], ["4", "quoniam fortitudo mea et refugium meum es tu; et propter nomen tuum deduces me et enutries me."], ["5", "Educes me de laqueo hoc quem absconderunt mihi, quoniam tu es protector meus."], ["6", "In manus tuas commendo spiritum meum; redemisti me, Domine Deus veritatis."]], "es": [["2", "Oh Señor, en ti tengo puesta mi esperanza; no quede yo para siempre confundido; sálvame, pues eres justo."], ["3", "Dígnate escucharme, acude prontamente a librarme. Sé para mí un Dios tutelar, y un alcázar de refugio para ponerme a salvo."], ["4", "Porque tú eres mi fortaleza y mi asilo; y por honra de tu Nombre me guiarás y sustentarás."], ["5", "Tú me sacarás del lazo que me tienen ocultamente armado, pues tú eres mi protector."], ["6", "En tus manos encomiendo mi espíritu; tú me has redimido, ¡oh Señor Dios de la verdad!"]]}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 129", "content": {"la": [["1", "Canticum graduum. De profundis clamavi ad te, Domine;"], ["2", "Domine, exaudi vocem meam. Fiant aures tuae intendentes in vocem deprecationis meae."], ["3", "Si iniquitates observaveris, Domine, Domine, quis sustinebit?"], ["4", "Quia apud te propitiat
