ue, "content": {"la": "Tecum princípium in die virtútis tuæ, in splendóribus sanctórum, ex útero ante lucíferum génui te.", "es": "Contigo está el principado el día de tu poder, entre los resplandores de los santos; desde el seno, antes del lucero, te engendré."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Apud Dóminum misericórdia, et copiósa apud eum redémptio.", "es": "En el Señor está la misericordia, y en él, abundante redención."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 129", "content": {"la": [["1", "Canticum graduum. De profundis clamavi ad te, Domine;"], ["2", "Domine, exaudi vocem meam. Fiant aures tuae intendentes in vocem deprecationis meae."], ["3", "Si iniquitates observaveris, Domine, Domine, quis sustinebit?"], ["4", "Quia apud te propitiatio est; et propter legem tuam sustinui te, Domine. Sustinuit anima mea in verbo ejus;"], ["5", "speravit anima mea in Domino."], ["6", "A custodia matutina usque ad noctem, speret Israel in Domino;"], ["7", "quia apud Dominum misericordia, et copiosa apud eum redemptio."], ["8", "Et ipse redimet Israel ex omnibus iniquitatibus ejus."]], "es": [["1", "Desde lo más profundo clamé a ti, ¡oh Señor!"], ["2", "Oye, Señor, benignamente mi voz. Estén atentos tus oídos a la voz de mis plegarias."], ["3", "Si te pones a examinar, Señor, nuestras maldades, ¿quién podrá subsistir, ¡oh Señor!, en tu presencia?"], ["4", "Mas en ti se halla siempre la clemencia; y en vista de tu ley he confiado en ti, ¡oh Señor! en la promesa del Señor se ha apoyado mi alma."], ["5", "En el Señor ha puesto su esperanza."], ["6", "Desde el amanecer hasta la noche espere Israel en el Señor."], ["7", "Porque en el Señor está la misericordia, y en su mano tiene una redención abundantísima."], ["8", "Y es él el que redimirá a Israel de todas sus iniquidades."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Apud Dóminum misericórdia, et copiósa apud eum redémptio.", "es": "En el Señor está la misericordia, y en él, abundante redención."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "In princípio et ante sǽcula Deus erat Verbum; ipse natus est nobis hódie Salvátor mundi.", "es": "En el principio y antes de los siglos era Dios el Verbo; él mismo ha nacido hoy para nosotros como Salvador del mundo."}}, {"kind": "psalm", "label": "canticle", "ref": "col 1:12-20", "content": {"la": [["12", "gratias agentes Deo Patri, qui dignos nos fecit in partem sortis sanctorum in lumine :"], ["13", "qui eripuit nos de potestate tenebrarum, et transtulit in regnum filii dilectionis suae,"], ["14", "in quo habemus redemptionem per sanguinem ejus, remissionem peccatorum :"], ["15", "qui est imago Dei invisibilis, primogenitus omnis creaturae :"], ["16", "quoniam in ipso condita sunt universa in caelis, et in terra, visibilia, et invisibilia, sive throni, sive dominationes, sive principatus, sive potestates : omnia per ipsum et in ipso creata sunt :"], ["17", "et ipse est ante omnes, et omnia in ipso constant."], ["18", "Et ipse est caput corporis Ecclesiae, qui est principium, primogenitus ex mortuis : ut sit in omnibus ipse primatum tenens :"], ["19", "quia in ipso complacuit, omnem plenitudinem inhabitare :"], ["20", "et per eum reconciliare omnia in ipsum, pacificans per sanguinem crucis ejus, sive quae in terris, sive quae in caelis sunt."]], "es": [["12", "dando gracias á Dios Padre, que nos ha hecho dignos de participar de la suerte y herencia úc los santos, iluminándonos con la luz del Evanyelio;"], ["13", "que nos ha arrebatado del poder de las tinieblas, y trasladado al reino de su Hijo muy amado;"], ["14", "por cuya sangre hemos sido nosotros rescatados, y recibido la remisión de los pecados;"], ["15", "y el cual es imágen perfecta del Dios invisible, engendrado ab eterno ante toda criatura;"], ["16", "pues por él fueron criadas todas las cosas en los cielos y en la tierra, las visibles y las invisibles, ora sean tronos, ora dominaciones, ora principados, ora potestades; todas las cosas fueron criadas por él mismo, y en atención á él mismo:"], ["17", "y así él tiene ser ante todas las cosas, y todas subsisten por él, y por él son conservadas."], ["18", "Y él es la cabeza del cuerpo de la Iglesia, y el principio de la resurrección, el primero á renacer de entre los muertos, para que en todo tenga él la primacía;"], ["19", "pues plugo al Padre poner en él la plenitud de todo ser,"], ["20", "y reconciliar por él todas las cosas consigo, restableciendo la paz entre cielo y tierra, por medio de la sangre que derramó en la cruz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "In princípio et ante sǽcula Deus erat Verbum; ipse natus est nobis hódie Salvátor mundi.", "es": "En el principio y antes de los siglos era Dios el Verbo; él mismo ha nacido hoy para nosotros como Salvador del mundo."}}, {"kind": "psalm", "label": "reading", "ref": "1john 1:1-3", "content": {"la": [["1", "Quod fuit ab initio, quod audivimus, quod vidimus oculis nostris, quod perspeximus, et manus nostrae contrectaverunt de verbo vitae :"], ["2", "et vita manifestata est, et vidimus, et testamur, et annuntiamus vobis vitam aeternam, quae erat apud Patrem, et apparuit nobis :"], ["3", "quod vidimus et audivimus, annuntiamus vobis, ut et vos societatem habeatis nobiscum, et societas nostra sit cum Patre, et cum Filio ejus Jesu Christo."]], "es": [["1", "Lo que fué desde el principio ó desde la eternidad, lo que oímos, lo que vimos con nuestros ojos, y contemplamos, y palparon nuestras manos, tocante al Verbo de la vida:"], ["2", "Vida que se hizo patente, y así la vimos, y damos de ella testimonio; y os evangelizamos esta vida eterna, la cual estaba en el Padre, y se dejó ver de nosotros:"], ["3", "Esto que vimos y oímos, es lo que os anunciamos, para que tengáis también vosotros unión con nosotros, y nuestra común unión sea con el Padre y con su Hijo Jesu-Cristo."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Verbum caro factum est, * Allelúia, allelúia. Verbum.", "℟. Et habitávit in nobis.* Allelúia, allelúia. Glória Patri. Verbum."], "es": ["$℣. $La Palabra se hizo carne. Aleluya, Aleluya.", "$℟. $La Palabra se hizo carne. Aleluya, Aleluya.", "$℣. $Y acampó entre nosotros.", "$℟. $Aleluya, Aleluya.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $La Palabra se hizo carne. Aleluya, Aleluya."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Hódie * Christus natus est: hódie Salvátor appáruit: hódie in terra canunt Angeli, lætántur Archángeli: hódie exsúltant justi, dicéntes: Glória in excélsis Deo, allelúja.", "es": "Hoy ha nacido Cristo; hoy ha aparecido el Salvador; hoy en la tierra cantan los ángeles, se alegran los arcángeles; hoy exultan los justos, diciendo: Gloria a Dios en las alturas, aleluya."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Hódie * Christus natus est: hódie Salvátor appáruit: hódie in terra canunt Angeli, lætántur Archángeli: hódie exsúltant justi, dicéntes: Glória in excélsis Deo, allelúja.", "es": "Hoy ha nacido Cristo; hoy ha aparecido el Salvador; hoy en la tierra cantan los ángeles, se alegran los arcángeles; hoy exultan los justos, diciendo: Gloria a Dios en las alturas, aleluya."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christum iubilántes celebrémus, in cuius nativitáte ángeli pacem mundo nuntiavérunt, et devótis ánimis exorémus:", "– Natívitas tua pacem cunctis áfferat.", "Reple, Dómine, ómnibus bonis Ecclésiam tuam,", "quam nativitátis tuæ mystério consoláris.", "– Natívitas tua pacem cunctis áfferat.", "Qui, princeps pastórum venísti, et nostrárum epíscopus animárum,", "papam et epíscopos nostros fidéles redde dispensatóres multifórmis grátiæ tuæ.", "– Natívitas tua pacem cunctis áfferat.", "Rex æternitátis, qui, nascens, brevi vitæ spátio circumscríbi et hóminum vicissitúdines experíri voluísti,", "nos cadúcos et mortáles æternitátis tuæ redde consórtes.", "– Natívitas tua pacem cunctis áfferat.", "Qui, a sǽculis exspectátus, in plenitúdine témporis venísti,", "manifésta præséntiam tuam iis, qui adhuc te exspéctant.", "– Natívitas tua pacem cunctis áfferat.", "Qui, caro factus, humánam substántiam morte corrúptam restaurásti,", "defúnctis tuam plenam restauratiónem concéde.", "– Natívitas tua pacem cunctis áfferat."], "es": ["Aclamemos alegres a Cristo, ante cuyo nacimiento los ángeles anunciaron la paz a la tierra, y supliquémosle, diciendo:", "- Tú que con el misterio de Navidad consuelas a la Iglesia, _cólmala también de todos tus bienes._ _Que tu nacimiento, Señor, traiga la paz a todos los hombres._", "- Tú que has venido como pastor supremo y guardián de nuestras vidas, _haz que el papa y todos los obispos sean buenos administradores de la múltiple gracia de Dios._ _Que tu nacimiento, Señor, traiga la paz a todos los hombres._", "- Rey de la eternidad, que al nacer quisiste experimentar las limitaciones humanas sometiéndote a la brevedad de una vida como la nuestra, _haz que nosotros, que somos caducos y mortales, participemos de tu vida eterna._ _Que tu nacimiento, Señor, traiga la paz a todos los hombres._", "- Tú que, esperado durante largos siglos, viniste en el momento culminante de la historia, _manifiesta tu presencia a los que aún te están esperando._ _Que tu nacimiento, Señor, traiga la paz a todos los hombres._", "- Tú que, hecho carne, restauraste la naturaleza humana corrompida por la muerte, _concede la plena salvación a los difuntos._ _Que tu nacimiento, Señor, traiga la paz a todos los hombres._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "ref": "In Nativitate Domini", "content": {"la": "Concede, quæsumus, omnipotens Deus: ut nos Unigeniti tui nova per carnem Nativitas liberet; quos sub peccati jugo vetusta servitus tenet.", "es": "Concede, Señor todopoderoso, a los que vivimos inmersos en la luz de tu Palabra hecha carne, que resplandezca en nuestras obras la fe que haces brillar en nuestro espíritu. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Alis suis obumbrabit tibi; non timebis a timore nocturno.", "es": "Con sus alas te cubrirá; no temerás el terror de la noche."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 90", "content": {"la": [["1", "Laus cantici David. Qui habitat in adjutorio Altissimi, in protectione Dei caeli commorabitur."], ["2", "Dicet Domino : Susceptor meus es tu et refugium meum; Deus meus, sperabo in eum."], ["3", "Quoniam ipse liberavit me de laqueo venantium, et a verbo aspero."], ["4", "Scapulis suis obumbrabit tibi, et sub pennis ejus sperabis."], ["5", "Scuto circumdabit te veritas ejus : non timebis a timore nocturno;"], ["6", "a sagitta volante in die, a negotio perambulante in tenebris, ab incursu, et daemonio meridiano."], ["7", "Cadent a latere tuo mille, et decem millia a dextris tuis; ad te autem non appropinquabit."], ["8", "Verumtamen oculis tuis considerabis et retributionem peccatorum videbis."], ["9", "Quoniam tu es, Domine, spes mea; Altissimum posuisti refugium tuum."], ["10", "Non accedet ad te malum, et flagellum non appropinquabit tabernaculo tuo."], ["11", "Quoniam angelis suis mandavit de te, ut custodiant te in omnibus viis tuis."], ["12", "In manibus portabunt te, ne forte offendas ad lapidem pedem tuum."], ["13", "Super aspidem et basiliscum ambulabis, et conculcabis leonem et draconem."], ["14", "Quoniam in me speravit, liberabo eum; protegam eum, quoniam cognovit nomen meum."], ["15", "Clamabit ad me, et ego exaudiam eum; cum ipso sum in tribulatione; eripiam eum, et glorificabo eum."], ["16", "Longitudine dierum replebo eum, et ostendam illi salutare meum."]], "es": [["1", "El que se acoge al asilo del Altísimo, descansará siempre bajo la protección del Dios del cielo."], ["2", "El dirá al Señor: Tú eres mi amparo y refugio; el Dios mío en quien esperaré."], ["3", "Porque él me ha librado del lazo de los cazadores y de terribles adversidades."], ["4", "Con sus alas te hará sombra, y debajo de sus plumas estarás confiado."], ["5", "Su verdad te cercará como escudo; no temerás terrores nocturnos,"], ["6", "ni la saeta disparada de día, ni al enemigo que anda en tinieblas, ni los asaltos del demonio en medio del día."], ["7", "Caerán muertos a tu siniestra mil y diez mil a tu diestra; mas nada te pasará a ti."], ["8", "Tú lo estarás contemplando con tus propios ojos, y verás el pago que se da a los pecadores, y exclamarás:"], ["9", "¡Oh! y cómo eres tú, ¡oh Señor, mi esperanza! Tú ¡oh justo! has escogido al Altísimo para asilo tuyo."], ["10", "No llegará a ti el mal, ni el azote se acercará a tu morada."], ["11", "Porque él mandó a sus ángeles que cuidasen de ti; los cuales te guardarán en cuantos pasos dieres."], ["12", "Te llevarán en las palmas de sus manos; no sea que tropiece tu pie en alguna piedra."], ["13", "Andarás sobre áspides y víboras, y hollarás los leones y dragones."], ["14", "Ya que ha esperado en mí, yo le libraré; yo lo protegeré, pues ha conocido o adorado mi Nombre."], ["15", "Clamará a mí, y lo oiré benigno. Con él estoy en la tribulación; lo pondré a salvo, y lo llenaré de gloria."], ["16", "Lo sacaré con una vida muy larga, y le haré ver el salvador que enviaré."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Alis suis obumbrabit tibi; non timebis a timore nocturno.", "es": "Con sus alas te cubrirá; no temerás el terror de la noche."}}, {"kind": "psalm", "label": "reading", "ref": "Rev 22:4-5", "content": {"la": [["4", "Et videbunt faciem ejus : et nomen ejus in frontibus eorum."], ["5", "Et nox ultra non erit : et non egebunt lumine lucernae, neque lumine solis, quoniam Dominus Deus illuminabit illos, et regnabunt in saecula saeculorum."]], "es": [["4", "Y verán su cara, y tendrán el nombre de él sobre sus frentes."], ["5", "Y allí no habrá jamás noche; ni necesitarán luz"]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Vox nostra te, Domine, humiliter deprecetur, ut, dominicæ resurrectionis hac die mysterio celebrato, in pace tua securi a malis omnibus quiescamus, et in tua resurgamus laude gaudentes. Per Christum Dominum nostrum.", "es": "Humildemente te pedimos, Señor, que después de haber celebrado en este día los misterios de la resurrección de tu Hijo, sin temor alguno, descansemos en tu paz y mañana nos levantemos alegres para cantar nuevamente tus alabanzas. Por Jesucristo nuestro Señor."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-12-26": {"date_human": {"en": "Saturday, December 26, 2026", "es": "Sábado, 26 de diciembre de 2026", "la": "Sabbato, die 26 Decembris, anno 2026"}, "day_description": {"en": "Saturday within the Octave of Christmas (day 2) &mdash; Sancti Stephani, protomartyris", "es": "Sábado de la Octava de Navidad (día 2) &mdash; Sancti Stephani, protomartyris", "la": "Sabbato infra Octavam Nativitatis (dies 2) &mdash; Sancti Stephani, protomartyris"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Stephanus vidit cælos apertos, vidit et introivit: beatus homo, cui cæli patebant.", "es": "Esteban vio los cielos abiertos, los vio y entró: dichoso el hombre a quien los cielos se abrieron."}}, {"kind": "psalm", "label": "canticle", "ref": "Dan 3:57-88,56", "content": {"la": [["57", "Benedicite, omnia opera Domini, Domino : laudate et superexaltate eum in saecula."], ["58", "Benedicite, angeli Domini, Domino : laudate et superexaltate eum in saecula."], ["59", "Benedicite, caeli, Domino : laudate et superexaltate eum in saecula."], ["60", "Benedicite, aquae omnes, quae super caelos sunt, Domino : laudate et superexaltate eum in saecula."], ["61", "Benedicite, omnes virtutes Domini, Domino : laudate et superexaltate eum in saecula."], ["62", "Benedicite, sol et luna, Domino : laudate et superexaltate eum in saecula."], ["63", "Benedicite, stellae caeli, Domino : laudate et superexaltate eum in saecula."], ["64", "Benedicite, omnis imber et ros, Domino : laudate et superexaltate eum in saecula."], ["65", "Benedicite, omnes spiritus Dei, Domino : laudate et superexaltate eum in saecula."], ["66", "Benedicite, ignis et aestus, Domino : laudate et superexaltate eum in saecula."], ["67", "Benedicite, frigus et aestus, Domino : laudate et superexaltate eum in saecula."], ["68", "Benedicite, rores et pruina, Domino : laudate et superexaltate eum in saecula."], ["69", "Benedicite, gelu et frigus, Domino : laudate et superexaltate eum in saecula."], ["70", "Benedicite, glacies et nives, Domino : laudate et superexaltate eum in saecula."], ["71", "Benedicite, noctes et dies, Domino laudate et superexaltate eum in saecula."], ["72", "Benedicite, lux et tenebrae, Domino : laudate et superexaltate eum in saecula."], ["73", "Benedicite, fulgura et nubes, Domino : laudate et superexaltate eum in saecula."], ["74", "Benedicat terra Dominum : laudet et superexaltet eum in saecula."], ["75", "Benedicite, montes et colles, Domino : laudate et superexaltate eum in saecula."], ["76", "Benedicite, universa germinantia in terra, Domino : laudate et superexaltate eum in saecula."], ["77", "Benedicite, fontes, Domino : laudate et superexaltate eum in saecula."], ["78", "Benedicite, maria et flumina, Domino : laudate et superexaltate eum in saecula."], ["79", "Benedicite, cete, et omnia quae moventur in aquis, Domino : laudate et superexaltate eum in saecula."], ["80", "Benedicite, omnes volucres caeli, Domino : laudate et superexaltate eum in saecula."], ["81", "Benedicite, omnes bestiae et pecora, Domino : laudate et superexaltate eum in saecula."], ["82", "Benedicite, filii hominum, Domino : laudate et superexaltate eum in saecula."], ["83", "Benedicat Israel Dominum : laudet et superexaltet eum in saecula."], ["84", "Benedicite, sacerdotes Domini, Domino : laudate et superexaltate eum in saecula."], ["85", "Benedicite, servi Domini, Domino : laudate et superexaltate eum in saecula."], ["86", "Benedicite, spiritus et animae justorum, Domino : laudate et superexaltate eum in saecula."], ["87", "Benedicite, sancti et humiles corde, Domino : laudate et superexaltate eum in saecula."], ["88", "Benedicite, Anania, Azaria, Misael, Domino : laudate et superexaltate eum in saecula : quia eruit nos de inferno, et salvos fecit de manu mortis : et liberavit nos de medio ardentis flammae, et de medio ignis eruit nos."], ["56", "Benedictus es in firmamento caeli : et laudabilis et gloriosus in saecula."]], "es": [["57", "Obras todas del Señor, bendecid al Señor, y loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["58", "Angeles del Señor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["59", "Cielos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["60", "Aguas todas que estáis sobre los cielos *, bendecid al Señor: alabadle, y ensalzadle sobre todas las cosas por todos los siglos."], ["61", "Virtudes todas ó milicias celestiales ', bendecid vosotras al Señor: loadle y ensalzadle sobre todas"], ["62", "Sol y luna, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["63", "Estrellas del cielo, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["64", "Lluvias todas y rocíos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["65", "Espíritus ó vientos de Dios, bendecid todos vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["66", "Fuego y calor, bendecid vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["67", "Frió y calor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["68", "Rocíos y escarchas, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["69", "Hielos y frios, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["70", "Heladas y niev  los siglos sobre todas las cosas."], ["88", "Vosotros, Ananías, Azarías y Misael, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas. Porque él nos ha salvado del inlierno ó del sepulcro, y librado de las manos de la ( APÍfüLO III. '¿i'o muelle: y nos ha sacado de en medio de las ardientes llamas, y libertado del fuego del homo."], ["56", "Bendito eres tú en el firmamento del cielo, y digno de loor, y de gloria por todos los siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Stephanus vidit cælos apertos, vidit et introivit: beatus homo, cui cæli patebant.", "es": "Esteban vio los cielos abiertos, los vio y entró: dichoso el hombre a quien los cielos se abrieron."}}, {"kind": "psalm", "label": "reading", "ref": "acts 6:2-5", "content": {"la": [["2", "Convocantes autem duodecim multitudinem discipulorum, dixerunt : Non est aequum nos derelinquere verbum Dei, et ministrare mensis."], ["3", "Considerate ergo fratres, viros ex vobis boni testimonii septem, plenos Spiritu Sancto, et sapientia, quos constituamus super hoc opus."], ["4", "Nos vero orationi, et ministerio verbi instantes erimus."], ["5", "Et placuit sermo coram omni multitudine. Et elegerunt Stephanum, virum plenum fide, et Spiritu Sancto, et Philippum, et Prochorum, et Nicanorem, et Timonem, et Parmenam, et Nicolaum advenam Antiochenum."]], "es": [["2", "En atención á esto, los doce apóstoles convocando á todos los discípulos, les dijeron: No es justo que nosotros descuidemos la predicación de la palabra de Dios, por tener cuidado de las mesas."], ["3", "Por tanto, hermanos, nombrad de entre vosotros siete sugetos de buena fama, llenos del Espíritu santo y de inteligencia, á los cuales encarguemos este ministerio."], ["4", "Y con esto podremos nosotros empltarnos enteramente en la oración, y en la predicación de la palabra divina."], ["5", "Pareció bien esta propuesta á toda la asamblea; y así nombraron á Esteban, varón lleno de fé y del Espíritu santo, y á Phelippe, y á Próchóro, á Nicanor y á Timón, á Pármenas y á Nicolás, prosélito anliochéno,"]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Fortitúdo mea* Et laus mea Dóminus. Fortitúdo.", "℟. Et factus est mihi in salútem.* Et laus mea Dóminus. Glória Patri. Fortitúdo."], "es": ["$℣. $El Señor es mi fuerza  y mi energía.", "$℟. $El Señor es mi fuerza  y mi energía.", "$℣. $Él es mi salvación.", "$℟. $Y mi energía.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $El Señor es mi fuerza  y mi energía."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Vestri capilli capitis omnes numerati sunt: nolite timere: multis passeribus meliores estis vos.", "es": "Todos los cabellos de vuestra cabeza están contados: no temáis; vosotros valéis más que muchos pajarillos."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Vestri capilli capitis omnes numerati sunt: nolite timere: multis passeribus meliores estis vos.", "es": "Todos los cabellos de vuestra cabeza están contados: no temáis; vosotros valéis más que muchos pajarillos."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Fratres, Salvatórem nostrum, testem fidélem, per mártyres interféctos propter verbum Dei celebrémus, clamántes:", "– Redemísti nos Deo in sánguine tuo.", "Per mártyres tuos, qui líbere mortem in testimónium fídei sunt ampléxi,", "da nobis, Dómine, veram spíritus libertátem.", "– Redemísti nos Deo in sánguine tuo.", "Per mártyres tuos, qui fidem usque ad sánguinem sunt conféssi,", "da nobis, Dómine, puritátem fideíque constántiam.", "– Redemísti nos Deo in sánguine tuo.", "Per mártyres tuos, qui, sustinéntes crucem, tua vestígia sunt secúti,", "da nobis, Dómine, ærúmnas vitæ fórtiter sustinére.", "– Redemísti nos Deo in sánguine tuo.", "Per mártyres tuos, qui stolas suas lavérunt in sánguine Agni,", "da nobis, Dómine, omnes insídias carnis mundíque devíncere.", "– Redemísti nos Deo in sánguine tuo."], "es": ["Celebremos, amados hermanos, a nuestro Salvador, el testigo fiel, y, al recordar hoy a los santos mártires que murieron a causa de la palabra de Dios, aclamémoslo, diciendo:", "- Por la intercesión de los santos mártires, que entregaron libremente su vida como testimonio de la fe, _concédenos, Señor, la verdadera libertad de espíritu._ _Nos has comprado, Señor, con tu sangre._", "- Por la intercesión de los santos mártires, que proclamaron la fe hasta derramar su sangre, _concédenos, Señor, la integridad y la constancia de la fe._ _Nos has comprado, Señor, con tu sangre._", "- Por la intercesión de los santos mártires, que, soportando la cruz, siguieron tus pasos, _concédenos, Señor, soportar con generosidad las contrariedades de la vida._ _Nos has comprado, Señor, con tu sangre._", "- Por la intercesión de los santos mártires, que lavaron su manto en la sangre del Cordero, _concédenos, Señor, vencer las obras del mundo y de la carne._ _Nos has comprado, Señor, con tu sangre._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "ref": "Sancti Stephani, protomartyris", "content": {"la": "Da nobis, quǽsumus, Dómine, imitári quod cólimus: ut discámus et inimícos dilígere; quia ejus natalícia celebrámus, qui novit étiam pro persecutóribus exoráre Dóminum nostrum Jesum Christum Fílium tuum:", "es": "Concédenos, Señor, la gracia de imitar a tu mártir san Esteban y de amar a nuestros enemigos, ya que celebramos la muerte de quien supo orar por sus perseguidores. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Eres príncipe desde el día de tu nacimiento, entre esplendores sagrados; yo mismo te engendré, como rocío, antes de la aurora._", "la": "Tecum principatus in die virtutis tuae, in splendoribus sanctis; ex utero, ante luciferum, genui te."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 109:1-5,7", "content": {"la": [["1", "Psalmus David. Dixit Dominus Domino meo : Sede a dextris meis, donec ponam inimicos tuos scabellum pedum tuorum."], ["2", "Virgam virtutis tuae emittet Dominus ex Sion : dominare in medio inimicorum tuorum."], ["3", "Tecum principium in die virtutis tuae in splendoribus sanctorum; ex utero, ante luciferum, genui te."], ["4", "Juravit Dominus, et non poenitebit eum : Tu es sacerdos in aeternum secundum ordinem Melchisedech."], ["5", "Dominus a dextris tuis; confregit in die irae suae reges."], ["7", "de torrente in via bibet; propterea exaltabit caput."]], "es": [["1", "El Señor dijo a mi Señor: Siéntate a mi diestra, mientras que yo pongo a tus enemigos por tarima de tus pies."], ["2", "De Sión hará salir el Señor el cetro de tu poder; domina tú en medio de tus enemigos."], ["3", "Contigo está el principado el día de tu poderío, en medio de los resplandores de la santidad; de mis entrañas te engendré, antes de existir el lucero de la mañana."], ["4", "Juró el Señor, y no se arrepentirá, y dijo: Tú eres sacerdote sempiterno, según el orden de Melquisedec."], ["5", "El Señor está a tu diestra; en el día de su ira destrozó a los reyes."], ["7", "Beberá del torrente durante el camino, por eso levantará su cabeza."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Eres príncipe desde el día de tu nacimiento, entre esplendores sagrados; yo mismo te engendré, como rocío, antes de la aurora._", "la": "Tecum principatus in die virtutis tuae, in splendoribus sanctis; ex utero, ante luciferum, genui te."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Del Señor vienen la misericordia y la redención copiosa._", "la": "Apud Dominum misericordia, et copiosa apud eum redemptio."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 129", "content": {"la": [["1", "Canticum graduum. De profundis clamavi ad te, Domine;"], ["2", "Domine, exaudi vocem meam. Fiant aures tuae intendentes in vocem deprecationis meae."], ["3", "Si iniquitates observaveris, Domine, Domine, quis sustinebit?"], ["4", "Quia apud te propitiatio est; et propter legem tuam sustinui te, Domine. Sustinuit anima mea in verbo ejus;"], ["5", "speravit anima mea in Domino."], ["6", "A custodia matutina usque ad noctem, speret Israel in Domino;"], ["7", "quia apud Dominum misericordia, et copiosa apud eum redemptio."], ["8", "Et ipse redimet Israel ex omnibus iniquitatibus ejus."]], "es": [["1", "Desde lo más profundo clamé a ti, ¡oh Señor!"], ["2", "Oye, Señor, benignamente mi voz. Estén atentos tus oídos a la voz de mis plegarias."], ["3", "Si te pones a examinar, Señor, nuestras maldades, ¿quién podrá subsistir, ¡oh Señor!, en tu presencia?"], ["4", "Mas en ti se halla siempre la clemencia; y en vista de tu ley he confiado en ti, ¡oh Señor! en la promesa del Señor se ha apoyado mi alma."], ["5", "En el Señor ha puesto su esperanza."], ["6", "Desde el amanecer hasta la noche espere Israel en el Señor."], ["7", "Porque en el Señor está la misericordia, y en su mano tiene una redención abundantísima."], ["8", "Y es él el que redimirá a Israel de todas sus iniquidades."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Del Señor vienen la misericordia y la redención copiosa._", "la": "Apud Dominum misericordia, et copiosa apud eum redemptio."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_En el principio, antes de los siglos, la Palabra era Dios, y hoy esta Palabra ha nacido como Salvador del mundo._", "la": "In principio et ante saecula Deus erat Verbum: ipse natus est hodie Salvator mundi."}}, {"kind": "psalm", "label": "canticle", "ref": "col 1:12-20", "content": {"la": [["12", "gratias agentes Deo Patri, qui dignos nos fecit in partem sortis sanctorum in lumine :"], ["13", "qui eripuit nos de potestate tenebrarum, et transtulit in regnum filii dilectionis suae,"], ["14", "in quo habemus redemptionem per sanguinem ejus, remissionem peccatorum :"], ["15", "qui est imago Dei invisibilis, primogenitus omnis creaturae :"], ["16", "quoniam in ipso condita sunt universa in caelis, et in terra, visibilia, et invisibilia, sive throni, sive dominationes, sive principatus, sive potestates : omnia per ipsum et in ipso creata sunt :"], ["17", "et ipse est ante omnes, et omnia in ipso constant."], ["18", "Et ipse est caput corporis Ecclesiae, qui est principium, primogenitus ex mortuis : ut sit in omnibus ipse primatum tenens :"], ["19", "quia in ipso complacuit, omnem plenitudinem inhabitare :"], ["20", "et per eum reconciliare omnia in ipsum, pacificans per sanguinem crucis ejus, sive quae in terris, sive quae in caelis sunt."]], "es": [["12", "dando gracias á Dios Padre, que nos ha hecho dignos de participar de la suerte y herencia úc los santos, iluminándonos con la luz del Evanyelio;"], ["13", "que nos ha arrebatado del poder de las tinieblas, y trasladado al reino de su Hijo muy amado;"], ["14", "por cuya sangre hemos sido nosotros rescatados, y recibido la remisión de los pecados;"], ["15", "y el cual es imágen perfecta del Dios invisible, engendrado ab eterno ante toda criatura;"], ["16", "pues por él fueron criadas todas las cosas en los cielos y en la tierra, las visibles y las invisibles, ora sean tronos, ora dominaciones, ora principados, ora potestades; todas las cosas fueron criadas por él mismo, y en atención á él mismo:"], ["17", "y así él tiene ser ante todas las cosas, y todas subsisten por él, y por él son conservadas."], ["18", "Y él es la cabeza del cuerpo de la Iglesia, y el principio de la resurrección, el primero á renacer de entre los muertos, para que en todo tenga él la primacía;"], ["19", "pues plugo al Padre poner en él la plenitud de todo ser,"], ["20", "y reconciliar por él todas las cosas consigo, restableciendo la paz entre cielo y tierra, por medio de la sangre que derramó en la cruz."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_En el principio, antes de los siglos, la Palabra era Dios, y hoy esta Palabra ha nacido como Salvador del mundo._", "la": "In principio et ante saecula Deus erat Verbum: ipse natus est hodie Salvator mundi."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "1john 1:5-7", "content": {"la": [["5", "Et haec est annuntiatio, quam audivimus ab eo, et annuntiamus vobis : quoniam Deus lux est, et tenebrae in eo non sunt ullae."], ["6", "Si dixerimus quoniam societatem habemus cum eo, et in tenebris ambulamus, mentimur, et veritatem non facimus."], ["7", "Si autem in luce ambulamus sicut et ipse est in luce, societatem habemus ad invicem, et sanguis Jesu Christi, Filii ejus, emundat nos ab omni peccato."]], "es": [["5", "Y la nueva que oímos del mismo Jesu-Cristo, y os anunciamos, es: Que Dios es luz, y en él no hay tinieblas ningunas."], ["6", "Si dijéremos que tenemos unión con él, y andamos entre las tinieblas del pecado, mentimos, y no tratamos verdad."], ["7", "Pero si caminamos á la luz de la fe y santidad, como él está asimismo en la luz, síguese de ahí que tenemos nosotros una común y mútua unión; y la sangre de Jesu-Cristo, su Hijo, nos purifica de todo pecado."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Verbum caro factum est, * Allelúia, allelúia. Verbum.", "℟. Et habitávit in nobis.* Allelúia, allelúia. Glória Patri. Verbum."], "es": ["$℣. $La Palabra se hizo carne. Aleluya, Aleluya.", "$℟. $La Palabra se hizo carne. Aleluya, Aleluya.", "$℣. $Y acampó entre nosotros.", "$℟. $Aleluya, Aleluya.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $La Palabra se hizo carne. Aleluya, Aleluya."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Un silencio sereno lo envolvía todo, y, al mediar la noche su carrera, tu Palabra todopoderosa, Señor, vino desde el trono real de los cielos._", "la": "Dum medium silentium tenerent omnia, et nox in suo cursu medium iter haberet, omnipotens sermo tuus, Domine, a regalibus sedibus venit."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_Un silencio sereno lo envolvía todo, y, al mediar la noche su carrera, tu Palabra todopoderosa, Señor, vino desde el trono real de los cielos._", "la": "Dum medium silentium tenerent omnia, et nox in suo cursu medium iter haberet, omnipotens sermo tuus, Domine, a regalibus sedibus venit."}}, {"kind": "lines", "label": "intercessions", "content": {"la": null, "es": ["Acudamos a Cristo, Palabra del Padre, que al acampar entre nosotros nos abrió el camino de la  salvación eterna, y digámosle confiadamente:", "- Por el misterio de tu encarnación, por tu nacimiento y tu infancia, _por toda tu vida consagrada al servicio del Padre:  Líbranos, Señor, de todo mal._ _Líbranos, Señor, de todo mal._", "- Por tu trabajo, por tu predicación y  tus largas horas de camino, _por tu trato con los pecadores:  Líbranos, Señor, de todo mal._ _Líbranos, Señor, de todo mal._", "- Por tu agonía y tu pasión, por tu cruz y tu desolación, _por tus angustias, por tu muerte y sepultura:  Líbranos, Señor, de todo mal._ _Líbranos, Señor, de todo mal._", "- Por tu resurrección y ascensión a los cielos, por la donación del Espíritu Santo, por tus gozos y tu gloria eterna, _libra, Señor, a nuestros hermanos difuntos: y a nosotros líbranos, Señor, de todo mal._ _Líbranos, Señor, de todo mal._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Da nobis, quaesumus, Domine, imitari quod colimus, ut discamus et inimicos diligere, quia eius natalicia celebramus, qui novit etiam pro persecutoribus exorare.", "es": "Concédenos, Señor, la gracia de imitar a tu mártir san Esteban y de amar a nuestros enemigos, ya que celebramos la muerte de quien supo orar por sus perseguidores. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Miserere mei, Domine, et exaudi orationem meam.", "es": "Ten piedad de mí, Señor, y escucha mi oración."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 4", "content": {"la": [["1", "In finem, in carminibus. Psalmus David."], ["2", "Cum invocarem exaudivit me Deus justitiae meae, in tribulatione dilatasti mihi. Miserere mei, et exaudi orationem meam."], ["3", "Filii hominum, usquequo gravi corde? Ut quid diligitis vanitatem, et quaeritis mendacium?"], ["4", "Et scitote quoniam mirificavit Dominus sanctum suum; Dominus exaudiet me cum clamavero ad eum."], ["5", "Irascimini, et nolite peccare; quae dicitis in cordibus vestris, in cubilibus vestris compungimini."], ["6", "Sacrificate sacrificium justitiae, et sperate in Domino. Multi dicunt : Quis ostendit nobis bona?"], ["7", "Signatum est super nos lumen vultus tui, Domine : dedisti laetitiam in corde meo."], ["8", "A fructu frumenti, vini, et olei sui, multiplicati sunt."], ["9", "In pace in idipsum dormiam, et requiescam;"], ["10", "quoniam tu, Domine, singulariter in spe constituisti me."]], "es": [["2", "Así que lo invoqué, me oyó Dios, que es mi justicia; tú, ¡oh Dios mío!, en mi angustia me ensanchaste el corazón. Apiádate aún de mí, y presta oídos a mi oración."], ["3", "¡Oh, hijos de los hombres!, ¿hasta cuándo seréis de estúpido corazón?; ¿por qué amáis la vanidad y vais en pos de la mentira?"], ["4", "Sabed, pues, que es el Señor quien ha hecho admirable su Santo: el Señor me oirá siempre que clamare a él."], ["5", "Enojaos, y no queráis pecar más; compungíos en el retiro de vuestros lechos de las cosas que andáis meditando en vuestros corazones."], ["6", "Ofreced sacrificios de justicia, y confiad en el Señor. Dicen muchos: ¿Quién nos hará ver los bienes que se nos prometen?"], ["7", "Impresa está, Señor, sobre nosotros la luz de tu rostro: tú has infundido la alegría en mi corazón."], ["8", "Ellos están bien abastecidos y alegres con la abundancia de su trigo, vino y aceite."], ["9", "Mas yo, Dios mío, dormiré en paz, y descansaré en tus promesas:"], ["10", "Porque tú, ¡Oh Señor!, sólo tú has asegurado mi esperanza."]]}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 133", "content": {"la": [["1", "Canticum graduum. Ecce nunc benedicite Dominum, omnes servi Domini : qui statis in domo Domini, in atriis domus Dei nostri."], ["2", "In noctibus extollite manus vestras in sancta, et benedicite Dominum."], ["3", "Benedicat te Dominus ex Sion, qui fecit caelum et terram."]], "es": [["1", "Ea, pues, bendecid al Señor ahora mismo, vosotros todos, ¡oh siervos del Señor! Vosotros los que asistís en la casa del Señor, en los atrios del templo de nuestro Dios,"], ["2", "levantad por las noches vuestras manos hacia el santuario, y alabad al Señor."], ["3", "Te bendiga desde Sión el Señor que creó el cielo y la tierra."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Miserere mei, Domine, et exaudi orationem meam.", "es": "Ten piedad de mí, Señor, y escucha mi oración."}}, {"kind": "psalm", "label": "reading", "ref": "Deut 6:4-7", "content": {"la": [["4", "Audi, Israel : Dominus Deus noster, Dominus unus est."], ["5", "Diliges Dominum Deum tuum ex toto corde tuo, et ex tota anima tua, et ex tota fortitudine tua."], ["6", "Eruntque verba haec, quae ego praecipio tibi hodie, in corde tuo :"], ["7", "et narrabis ea filiis tuis, et meditaberis in eis sedens in domo tua, et ambulans in itinere, dormiens atque consurgens."]], "es": [["4", "Escucha, oh Israel: El Señor Dios nuestro es el solo ' y único Dios y Señor."], ["5", "Amarás pues al Señor Dios tuvo con todo tu corazón, y con toda tu alma, y con todas tus fuerzas '."], ["6", "Y estos mandamientos, que yo te doy en este dia, estarán estampados en tu corazón,"], ["7", "y los enseñarás á tus hijos, y en ellos meditarás sentado en tu casa, y andando de viage, y al acostarte, y al levantarte;"]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Visita nos, quæsumus, Domine, hac nocte præsenti, ut, diluculo tua virtute surgentes, de resurrectione Christi tui gaudere valeamus. Qui vivit et regnat in sæcula sæculorum.", "es": "Guárdanos, Señor, durante esta noche y haz que mañana, ya al clarear el nuevo día, la celebración del domingo nos llene con la alegría de la resurrección de tu Hijo. Que vive y reina por los siglos de los siglos. Amén."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-12-27": {"date_human": {"en": "Sunday, December 27, 2026", "es": "Domingo, 27 de diciembre de 2026", "la": "Dominica, die 27 Decembris, anno 2026"}, "day_description": {"en": "The Holy Family of Jesus, Mary and Joseph", "es": "La Sagrada Familia de Jesús, María y José", "la": "Sanctae Familiae Iesu, Mariae et Ioseph"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Los padres de Jesús solían ir cada año a Jerusalén por las fiestas de Pascua._", "la": "Ibant parentes Iesu per omnes annos in Ierusalem, in die sollemni Paschae."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 62:2-9", "content": {"la": [["2", "Deus, Deus meus, ad te de luce vigilo. Sitivit in te anima mea; quam multipliciter tibi caro mea!"], ["3", "In terra deserta, et invia, et inaquosa, sic in sancto apparui tibi, ut viderem virtutem tuam et gloriam tuam."], ["4", "Quoniam melior est misericordia tua super vitas, labia mea laudabunt te."], ["5", "Sic benedicam te in vita mea; et in nomine tuo levabo manus meas."], ["6", "Sicut adipe et pinguedine repleatur anima mea, et labiis exsultationis laudabit os meum."], ["7", "Si memor fui tui super stratum meum, in matutinis meditabor in te."], ["8", "Quia fuisti adjutor meus, et in velamento alarum tuarum exsultabo."], ["9", "Adhaesit anima mea post te; me suscepit dextera tua."]], "es": [["2", "¡Dios mío, oh mi Dios!, a ti aspiro, y me dirijo desde que apunta la aurora. De ti está sedienta el alma mía. ¡Y de cuántas maneras lo está también este mi cuerpo!"], ["3", "En esta tierra desierta, intransitable y sin agua, me pongo en tu presencia, como si me hallara en el santuario, para contemplar tu poder y la gloria tuya."], ["4", "Más apreciable es que mil vidas tu misericordia; por tanto se ocuparán mis labios en tu alabanza."], ["5", "Por esto te bendeciré toda mi vida, y alzaré mis manos invocando tu Nombre."], ["6", "Quede
