o : laudate et superexaltate eum in saecula."], ["69", "Benedicite, gelu et frigus, Domino : laudate et superexaltate eum in saecula."], ["70", "Benedicite, glacies et nives, Domino : laudate et superexaltate eum in saecula."], ["71", "Benedicite, noctes et dies, Domino laudate et superexaltate eum in saecula."], ["72", "Benedicite, lux et tenebrae, Domino : laudate et superexaltate eum in saecula."], ["73", "Benedicite, fulgura et nubes, Domino : laudate et superexaltate eum in saecula."], ["74", "Benedicat terra Dominum : laudet et superexaltet eum in saecula."], ["75", "Benedicite, montes et colles, Domino : laudate et superexaltate eum in saecula."], ["76", "Benedicite, universa germinantia in terra, Domino : laudate et superexaltate eum in saecula."], ["77", "Benedicite, fontes, Domino : laudate et superexaltate eum in saecula."], ["78", "Benedicite, maria et flumina, Domino : laudate et superexaltate eum in saecula."], ["79", "Benedicite, cete, et omnia quae moventur in aquis, Domino : laudate et superexaltate eum in saecula."], ["80", "Benedicite, omnes volucres caeli, Domino : laudate et superexaltate eum in saecula."], ["81", "Benedicite, omnes bestiae et pecora, Domino : laudate et superexaltate eum in saecula."], ["82", "Benedicite, filii hominum, Domino : laudate et superexaltate eum in saecula."], ["83", "Benedicat Israel Dominum : laudet et superexaltet eum in saecula."], ["84", "Benedicite, sacerdotes Domini, Domino : laudate et superexaltate eum in saecula."], ["85", "Benedicite, servi Domini, Domino : laudate et superexaltate eum in saecula."], ["86", "Benedicite, spiritus et animae justorum, Domino : laudate et superexaltate eum in saecula."], ["87", "Benedicite, sancti et humiles corde, Domino : laudate et superexaltate eum in saecula."], ["88", "Benedicite, Anania, Azaria, Misael, Domino : laudate et superexaltate eum in saecula : quia eruit nos de inferno, et salvos fecit de manu mortis : et liberavit nos de medio ardentis flammae, et de medio ignis eruit nos."], ["56", "Benedictus es in firmamento caeli : et laudabilis et gloriosus in saecula."]], "es": [["57", "Obras todas del Señor, bendecid al Señor, y loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["58", "Angeles del Señor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["59", "Cielos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["60", "Aguas todas que estáis sobre los cielos *, bendecid al Señor: alabadle, y ensalzadle sobre todas las cosas por todos los siglos."], ["61", "Virtudes todas ó milicias celestiales ', bendecid vosotras al Señor: loadle y ensalzadle sobre todas"], ["62", "Sol y luna, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["63", "Estrellas del cielo, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["64", "Lluvias todas y rocíos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["65", "Espíritus ó vientos de Dios, bendecid todos vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["66", "Fuego y calor, bendecid vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["67", "Frió y calor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["68", "Rocíos y escarchas, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["69", "Hielos y frios, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["70", "Heladas y nieves, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["71", "Noches y dias, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["72", "Luz y tinieblas, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["73", "Relámpagos y nubes, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["74", "Bendiga al Señor la tierra, alábele y ensálzele sobre todas las cosas por todos los siglos."], ["75", "Montes y collados, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["76", "Plantas todas que nacéis en la tierra, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["77", "Fuentes, bendecid al Señor: loadle y ensalzíidle sobre todas las cosas por todos los siglos."], ["78", "Mares y rios, bendecid al Señor: loadle y"], ["79", "Ballenas y peces todos, que giráis por las aguas, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["80", "Aves todas del cielo, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["81", "Bestias todas y ganados, bendecid al Señor: loadle y ensab:adle por todos los siglos sobre todas las cosas."], ["82", "Oh hijos de los hombres, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["83", "Bendiga Israel al Señor: alábele y ensálzele por todos los siglos sobre todas las cosas."], ["84", "Vosotros sacerdotes del Señor, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["85", "Siervos del Señor, bendecid vosotros al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["86", "Espíritus y almas de los justos, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["87", "Vosotros santos, y humildes de corazón, bendecid al Señor: alabadle y ensalzadle por todos los siglos sobre todas las cosas."], ["88", "Vosotros, Ananías, Azarías y Misael, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas. Porque él nos ha salvado del inlierno ó del sepulcro, y librado de las manos de la ( APÍfüLO III. '¿i'o muelle: y nos ha sacado de en medio de las ardientes llamas, y libertado del fuego del homo."], ["56", "Bendito eres tú en el firmamento del cielo, y digno de loor, y de gloria por todos los siglos."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El niño iba creciendo y robusteciéndose, y se llenaba de sabiduría; y la gracia de Dios lo acompañaba._", "la": "Puer crescebat, et confortabatur, plenus sapientia; et gratia Dei erat in illo."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Su padre y su madre estaban admirados por lo que se decía de él._", "la": "Erant pater eius et mater mirantes super his quae dicebantur de illo."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 149", "content": {"la": [["1", "Alleluja. Cantate Domino canticum novum; laus ejus in ecclesia sanctorum."], ["2", "Laetetur Israel in eo qui fecit eum, et filii Sion exsultent in rege suo."], ["3", "Laudent nomen ejus in choro, in tympano et psalterio psallant ei."], ["4", "Quia beneplacitum est Domino in populo suo, et exaltabit mansuetos in salutem."], ["5", "Exsultabunt sancti in gloria, laetabuntur in cubilibus suis."], ["6", "Exaltationes Dei in gutture eorum : et gladii ancipites in manibus eorum :"], ["7", "ad faciendam vindictam in nationibus, increpationes in populis;"], ["8", "ad alligandos reges eorum in compedibus, et nobiles eorum in manicis ferreis;"], ["9", "ut faciant in eis judicium conscriptum : gloria haec est omnibus sanctis ejus. Alleluja."]], "es": [["1", "Cantad al Señor un cántico nuevo, resuenen sus loores en la reunión de los santos."], ["2", "Que se alegre Israel en el Señor que le creó, y se regocijen en su rey los hijos de Sión."], ["3", "Celebren su excelso Nombre con armoniosos conciertos, y publiquen sus alabanzas al son del pandero y salterio."], ["4", "Porque el Señor ha mirado benignamente a su pueblo; y exaltará a los humildes y los salvará."], ["5", "Se gozarán los santos en la gloria, y se regocijarán en sus moradas."], ["6", "Resonarán en sus bocas los elogios sublimes de Dios; y vibrarán en sus manos espadas de dos filos,"], ["7", "para ejecutar la divina venganza en las naciones, y castigar a los pueblos impíos;"], ["8", "para aprisionar con grillos a sus reyes, y con esposas de hierro a sus magnates;"], ["9", "para ejecutar en ellos el juicio decretado: Gloria es ésta que está reservada para todos sus santos. ¡Aleluya!"]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Su padre y su madre estaban admirados por lo que se decía de él._", "la": "Erant pater eius et mater mirantes super his quae dicebantur de illo."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "deut 4:16", "content": {"la": [["16", "ne forte decepti faciatis vobis sculptam similitudinem, aut imaginem masculi vel feminae :"]], "es": [["16", "para que no fuera que engañados os formaseis alguna estatua esculpida, ó imagen de hombre ó de muger,"]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Christe, Fili Dei vivi,* Miserére nobis. Christe.", "℟. Qui Maríæ et Ioseph súbditus fuísti.* Miserére nobis. Glória Patri. Christe."], "es": ["$℣. $Cristo, Hijo de Dios vivo, ten piedad de nosotros.", "$℟. $Cristo, Hijo de Dios vivo, ten piedad de nosotros.", "$℣. $Tú que fuiste obediente a María y a José.", "$℟. $Ten piedad de nosotros.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Cristo, Hijo de Dios vivo, ten piedad de nosotros."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Ilumínanos, Señor, con los ejemplos de tu Familia, y dirige nuestros pasos por el camino de la paz._", "la": null}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_Ilumínanos, Señor, con los ejemplos de tu Familia, y dirige nuestros pasos por el camino de la paz._", "la": null}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Fílium Dei vivi, qui fílius humánæ famíliæ fíeri dignátus est, adorémus, ipsum exorántes:", "– Iesu, factus obœ́diens, sanctífica nos.", "Iesu, Verbum ætérnum Patris, qui súbditum Maríæ et Ioseph te fecísti,", "doce nos humilitátem.", "– Iesu, factus obœ́diens, sanctífica nos.", "Magíster noster, cuius facta et verba mater tua in corde suo servábat,", "præsta, ut audiámus verbum tuum et custodiámus illud in corde puro et bono.", "– Iesu, factus obœ́diens, sanctífica nos.", "Christe, faber mundi, qui fílium fabri te vocári voluísti,", "doce nos sedulitátem in ópere.", "– Iesu, factus obœ́diens, sanctífica nos.", "Iesu, qui in família Názareth sapiéntia, ætáte et grátia apud Deum et hómines proficiébas,", "fac, ut crescámus per ómnia in te, qui es Caput nostrum.", "– Iesu, factus obœ́diens, sanctífica nos."], "es": ["Adoremos a Cristo, Hijo del Dios vivo, que quiso ser también hijo de una familia humana, y supliquémosle, diciendo:", "- Oh Jesús, Palabra eterna del Padre, que quisiste vivir bajo la autoridad de María y de José, _enséñanos a vivir en la humildad y en la obediencia._ _Señor Jesús, tú que quisiste ser obediente, santifícanos._", "- Maestro de los hombres, que quisiste que María, tu madre, conservará en su corazón tus palabras y tus acciones, _enséñanos a  escuchar con corazón puro y bueno las palabras de tu boca._ _Señor Jesús, tú que quisiste ser obediente, santifícanos._", "- Oh Cristo, tú que creaste el universo y quisiste ser llamado hijo del carpintero, enséñanos a trabajar con empeño y a conciencia en nuestras propias tareas. _Señor Jesús, tú que quisiste ser obediente, santifícanos._", "- Oh Jesús, que en el seno de tu familia de Nazaret creciste en sabiduría, en estatura y en gracia ante Dios y los hombres, _concédenos crecer siempre en ti, que eres nuestra cabeza._ _Señor Jesús, tú que quisiste ser obediente, santifícanos._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Deus, qui præclára nobis Sanctæ Famíliæ dignátus es exémpla præbére, concéde propítius, ut, domésticis virtútibus caritatísque vínculis illam sectántes, in lætítia domus tuæ prǽmiis fruámur ætérnis. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Dios, Padre nuestro, que has propuesto a la Sagrada Familia como maravilloso ejemplo a los ojos de tu pueblo, concédenos, te rogamos, que, imitando sus virtudes domésticas y su unión en el amor, lleguemos a gozar de los premios eternos en el hogar del cielo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_A los tres días, encontraron a Jesús en el templo, sentado en medio de los maestros, escuchándolos y haciéndoles preguntas._", "la": "Post triduum invenerunt Iesum in templo, sedentem in medio doctorum, audientem illos, et interrogantem eos."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 121", "content": {"la": [["1", "Canticum graduum. Laetatus sum in his quae dicta sunt mihi : In domum Domini ibimus."], ["2", "Stantes erant pedes nostri in atriis tuis, Jerusalem."], ["3", "Jerusalem, quae aedificatur ut civitas, cujus participatio ejus in idipsum."], ["4", "Illuc enim ascenderunt tribus, tribus Domini, testimonium Israel, ad confitendum nomini Domini."], ["5", "Quia illic sederunt sedes in judicio, sedes super domum David."], ["6", "Rogate quae ad pacem sunt Jerusalem, et abundantia diligentibus te."], ["7", "Fiat pax in virtute tua, et abundantia in turribus tuis."], ["8", "Propter fratres meos et proximos meos, loquebar pacem de te."], ["9", "Propter domum Domini Dei nostri, quaesivi bona tibi."]], "es": [["1", "Gran contento tuve cuando se me dijo: Iremos a la casa del Señor."], ["2", "En tus atrios descansarán nuestros pies, ¡oh Jerusalén!"], ["3", "Jerusalén, la cual se va edificando como una ciudad, cuyas partes o habitantes están en perfecta y mutua unión."], ["4", "Allá subirán las tribus, todas las tribus del Señor, según la ordenanza dada a Israel, para tributar alabanzas al Nombre del Señor."], ["5", "Allí se establecerán los tribunales para ejercer la justicia, el trono para la casa de David."], ["6", "Pedid a Dios los bienes de la paz para Jerusalén, y decid: Vivan en la abundancia los que te aman, ¡oh ciudad santa!"], ["7", "Reine la paz dentro de tus muros, y la abundancia en tus torres o palacios."], ["8", "Por amor de mis hermanos y de mis prójimos, he pedido yo la paz y prosperidad para ti."], ["9", "Por respeto a la casa del Señor Dios nuestro te procuraré tantos bienes."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_A los tres días, encontraron a Jesús en el templo, sentado en medio de los maestros, escuchándolos y haciéndoles preguntas._", "la": "Post triduum invenerunt Iesum in templo, sedentem in medio doctorum, audientem illos, et interrogantem eos."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Jesús bajó con ellos a Nazaret y siguió bajo su autoridad._", "la": "Descendit Iesus cum eis, et venit Nazareth, et erat subditus illis."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 126", "content": {"la": [["1", "Canticum graduum Salomonis. Nisi Dominus aedificaverit domum, in vanum laboraverunt qui aedificant eam. Nisi Dominus custodierit civitatem, frustra vigilat qui custodit eam."], ["2", "Vanum est vobis ante lucem surgere : surgite postquam sederitis, qui manducatis panem doloris. Cum dederit dilectis suis somnum,"], ["3", "ecce haereditas Domini, filii; merces, fructus ventris."], ["4", "Sicut sagittae in manu potentis, ita filii excussorum."], ["5", "Beatus vir qui implevit desiderium suum ex ipsis : non confundetur cum loquetur inimicis suis in porta."]], "es": [["1", "Si el Señor no es el que edifica la casa, en vano se fatigan los que la fabrican. Si el Señor no guarda la ciudad, inútilmente se desvela el que la guarda."], ["2", "En vano será levantaros antes de amanecer; levantaos después de haber descansado, y acudid al Señor los que coméis pan de lágrimas. Mientras concede Dios el sueño y el reposo a sus amados,"], ["3", "he aquí que les viene del Señor la herencia, los hijos, las ganancias y las crías de los ganados."], ["4", "Como las flechas en mano de un hombre robusto, así los hijos de los justos atribulados."], ["5", "Dichoso aquel varón que ve cumplidos sus deseos con respecto a sus hijos; no quedará confundido cuando hubiera de tratar con sus enemigos en las puertas o tribunales."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Jesús bajó con ellos a Nazaret y siguió bajo su autoridad._", "la": "Descendit Iesus cum eis, et venit Nazareth, et erat subditus illis."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Jesús iba creciendo en sabiduría, en estatura y en gracia ante Dios y los hombres._", "la": "Iesus proficiebat sapientia, et aetate, et gratia, apud Deum et homines."}}, {"kind": "psalm", "label": "canticle", "ref": "eph 1:3-10", "content": {"la": [["3", "Benedictus Deus et Pater Domini nostri Jesu Christi, qui benedixit nos in omni benedictione spirituali in caelestibus in Christo,"], ["4", "sicut elegit nos in ipso ante mundi constitutionem, ut essemus sancti et immaculati in conspectu ejus in caritate."], ["5", "Qui praedestinavit nos in adoptionem filiorum per Jesum Christum in ipsum : secundum propositum voluntatis suae,"], ["6", "in laudem gloriae gratiae suae, in qua gratificavit nos in dilecto Filio suo."], ["7", "In quo habemus redemptionem per sanguinem ejus, remissionem peccatorum secundum divitias gratiae ejus,"], ["8", "quae superabundavit in nobis in omni sapientia et prudentia :"], ["9", "ut notum faceret nobis sacramentum voluntatis suae, secundum beneplacitum ejus, quod proposuit in eo,"], ["10", "in dispensatione plenitudinis temporum, instaurare omnia in Christo, quae in caelis et quae in terra sunt, in ipso;"]], "es": [["3", "Bendito el Dios y Padre de nuestro Señor Jesu- Christo, que nos ha colmado en Christo de toda suerte de bendiciones espirituales del cielo,"], ["4", "así como por él mismo nos escogió antes de la creación del mundo, para ser sanios y sin mácula en su presencia, por la caridad;"], ["5", "habiéndonos predestinado ' al ser de hijos suyos adoptivos por Jesii-Christo á gloria suya, por un puro efecto de su buena voluntad,"], ["6", "á fin de que se celebre la gloria de su gracia, mediante la cual nos hizo gratos á sus ojos en su querido Hijo."], ["7", "En quien por su sangre logramos la' redención, y el perdón de los pecados, por las riquezas de su gracia,"], ["8", "que con abundancia ha derramado sobre nosotros, colmándonos de toda sabiduría y prudencia:"], ["9", "para hacernos conocer el misterio ó arcano de su voluntad, fundada en su mero beneplácito, por el cual se propuso"], ["10", "el restaurar en Christo, cumplidos los tiempos prescritos, todas las cosas de los cielos, y las de la tierra, reimiéndolas todas por él mismo en un cuer' po ó Iglesia."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_Jesús iba creciendo en sabiduría, en estatura y en gracia ante Dios y los hombres._", "la": "Iesus proficiebat sapientia, et aetate, et gratia, apud Deum et homines."}, "repeated": true}, {"kind": "psalm", "label": "reading", "ref": "phil 2:6-7", "content": {"la": [["6", "qui cum in forma Dei esset, non rapinam arbitratus est esse se aequalem Deo :"], ["7", "sed semetipsum exinanivit, formam servi accipiens, in similitudinem hominum factus, et habitu inventus ut homo."]], "es": [["6", "el cual teniendo la naturaleza de Dios, no fue por usurpación sino por esencia el ser igual á Dios;"], ["7", "y no obstante ' se anonadó á sí mismo lomando la forma ó naturaleza de siervo, hecho semejante á los demás hombres, y reducido á la condición de hombre."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Verbum caro factum est, * Allelúia, allelúia. Verbum.", "℟. Et habitávit in nobis.* Allelúia, allelúia. Glória Patri. Verbum."], "es": ["$℣. $Tenía que parecerse en todo a sus hermanos, para ser compasivo.", "$℟. $Tenía que parecerse en todo a sus hermanos, para ser compasivo.", "$℣. $Apareció en el  mundo y vivió entre los hombres.", "$℟. $Para ser compasivo.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Tenía que parecerse en todo a sus hermanos, para ser compasivo."]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_«Hijo, ¿por qué nos has tratado así? Mira que tu padre y yo te buscábamos angustiados.» «¿Por qué me buscabais? ¿No sabíais que yo debía estar en la casa de mi Padre?»_", "la": "Fili, quid fecisti nobis sic? Ecce pater tuus et ego dolentes quaerebamus te. Quid est quod me quaerebatis? Nesciebatis quia in his quae Patris mei sunt, oportet me esse?"}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"es": "_«Hijo, ¿por qué nos has tratado así? Mira que tu padre y yo te buscábamos angustiados.» «¿Por qué me buscabais? ¿No sabíais que yo debía estar en la casa de mi Padre?»_", "la": "Fili, quid fecisti nobis sic? Ecce pater tuus et ego dolentes quaerebamus te. Quid est quod me quaerebatis? Nesciebatis quia in his quae Patris mei sunt, oportet me esse?"}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Benedíctus Dóminus Iesus, pax nostra, qui venit fácere útraque unum. Súpplices quærámus:", "– Pacem tuam ómnibus præsta, Dómine.", "Qui, nascens, benignitátem et humanitátem tuam homínibus manifestásti,", "da nobis in gratiárum actióne semper manére pro univérsis benefíciis tuis.", "– Pacem tuam ómnibus præsta, Dómine.", "Qui Maríam, Matrem tuam, grátia plenam effecísti,", "cópiam gratiárum ómnibus concéde.", "– Pacem tuam ómnibus præsta, Dómine.", "Qui Evangélium Dei venísti mundo nuntiáre,", "multíplica præcónes et auditóres verbi tui.", "– Pacem tuam ómnibus præsta, Dómine.", "Qui frater noster de María Vírgine nasci dignátus es,", "hómines doce mútua fraternitáte sese dilígere.", "– Pacem tuam ómnibus præsta, Dómine.", "Qui ut sol óriens mundo apparuísti,", "lumen vultus tui defúnctis fácie ad fáciem osténde vidéndum.", "– Pacem tuam ómnibus præsta, Dómine."], "es": ["Adoremos a Cristo, Hijo del Dios vivo, que quiso ser también hijo de una familia humana, y aclamémosle, diciendo:", "- Oh Cristo, por el misterio de tu sumisión a María y a José, _enséñanos el respeto y la obediencia a los que nos gobiernan legítimamente._ _Tú eres, Señor, el modelo y el salvador de los hombres._", "- Tú que amaste a tus padres y fuiste amado por ellos, _afianza a todas las familias en el amor y la concordia._ _Tú eres, Señor, el modelo y el salvador de los hombres._", "- Tú que estuviste siempre atento a las cosas de tu Padre, _haz que Dios sea honrado en todas las familias._ _Tú eres, Señor, el modelo y el salvador de los hombres._", "- Tú que quisiste que tus padres te buscaran durante tres días, _enséñanos a buscar siempre primero el reino de Dios y su justicia._ _Tú eres, Señor, el modelo y el salvador de los hombres._", "- Tú que has dado parte en tu gloria a María y a José, _admite también a nuestros difuntos en la familia de los santos._ _Tú eres, Señor, el modelo y el salvador de los hombres._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Deus, qui salútis ætérnæ, Beátæ Maríæ virginitáte fecúnda, humáno géneri prǽmia præstitísti, tríbue, quǽsumus, ut ipsam pro nobis intercédere sentiámus, per quam merúimus Fílium tuum, auctórem vitæ, suscípere. Qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. Amen.", "es": "Dios, Padre nuestro, que has propuesto a la Sagrada Familia como maravilloso ejemplo a los ojos de tu pueblo, concédenos, te rogamos, que, imitando sus virtudes domésticas y su unión en el amor, lleguemos a gozar de los premios eternos en el hogar del cielo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Alis suis obumbrabit tibi; non timebis a timore nocturno.", "es": "Con sus alas te cubrirá; no temerás el terror de la noche."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 90", "content": {"la": [["1", "Laus cantici David. Qui habitat in adjutorio Altissimi, in protectione Dei caeli commorabitur."], ["2", "Dicet Domino : Susceptor meus es tu et refugium meum; Deus meus, sperabo in eum."], ["3", "Quoniam ipse liberavit me de laqueo venantium, et a verbo aspero."], ["4", "Scapulis suis obumbrabit tibi, et sub pennis ejus sperabis."], ["5", "Scuto circumdabit te veritas ejus : non timebis a timore nocturno;"], ["6", "a sagitta volante in die, a negotio perambulante in tenebris, ab incursu, et daemonio meridiano."], ["7", "Cadent a latere tuo mille, et decem millia a dextris tuis; ad te autem non appropinquabit."], ["8", "Verumtamen oculis tuis considerabis et retributionem peccatorum videbis."], ["9", "Quoniam tu es, Domine, spes mea; Altissimum posuisti refugium tuum."], ["10", "Non accedet ad te malum, et flagellum non appropinquabit tabernaculo tuo."], ["11", "Quoniam angelis suis mandavit de te, ut custodiant te in omnibus viis tuis."], ["12", "In manibus portabunt te, ne forte offendas ad lapidem pedem tuum."], ["13", "Super aspidem et basiliscum ambulabis, et conculcabis leonem et draconem."], ["14", "Quoniam in me speravit, liberabo eum; protegam eum, quoniam cognovit nomen meum."], ["15", "Clamabit ad me, et ego exaudiam eum; cum ipso sum in tribulatione; eripiam eum, et glorificabo eum."], ["16", "Longitudine dierum replebo eum, et ostendam illi salutare meum."]], "es": [["1", "El que se acoge al asilo del Altísimo, descansará siempre bajo la protección del Dios del cielo."], ["2", "El dirá al Señor: Tú eres mi amparo y refugio; el Dios mío en quien esperaré."], ["3", "Porque él me ha librado del lazo de los cazadores y de terribles adversidades."], ["4", "Con sus alas te hará sombra, y debajo de sus plumas estarás confiado."], ["5", "Su verdad te cercará como escudo; no temerás terrores nocturnos,"], ["6", "ni la saeta disparada de día, ni al enemigo que anda en tinieblas, ni los asaltos del demonio en medio del día."], ["7", "Caerán muertos a tu siniestra mil y diez mil a tu diestra; mas nada te pasará a ti."], ["8", "Tú lo estarás contemplando con tus propios ojos, y verás el pago que se da a los pecadores, y exclamarás:"], ["9", "¡Oh! y cómo eres tú, ¡oh Señor, mi esperanza! Tú ¡oh justo! has escogido al Altísimo para asilo tuyo."], ["10", "No llegará a ti el mal, ni el azote se acercará a tu morada."], ["11", "Porque él mandó a sus ángeles que cuidasen de ti; los cuales te guardarán en cuantos pasos dieres."], ["12", "Te llevarán en las palmas de sus manos; no sea que tropiece tu pie en alguna piedra."], ["13", "Andarás sobre áspides y víboras, y hollarás los leones y dragones."], ["14", "Ya que ha esperado en mí, yo le libraré; yo lo protegeré, pues ha conocido o adorado mi Nombre."], ["15", "Clamará a mí, y lo oiré benigno. Con él estoy en la tribulación; lo pondré a salvo, y lo llenaré de gloria."], ["16", "Lo sacaré con una vida muy larga, y le haré ver el salvador que enviaré."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Alis suis obumbrabit tibi; non timebis a timore nocturno.", "es": "Con sus alas te cubrirá; no temerás el terror de la noche."}}, {"kind": "psalm", "label": "reading", "ref": "Rev 22:4-5", "content": {"la": [["4", "Et videbunt faciem ejus : et nomen ejus in frontibus eorum."], ["5", "Et nox ultra non erit : et non egebunt lumine lucernae, neque lumine solis, quoniam Dominus Deus illuminabit illos, et regnabunt in saecula saeculorum."]], "es": [["4", "Y verán su cara, y tendrán el nombre de él sobre sus frentes."], ["5", "Y allí no habrá jamás noche; ni necesitarán luz"]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Vox nostra te, Domine, humiliter deprecetur, ut, dominicæ resurrectionis hac die mysterio celebrato, in pace tua securi a malis omnibus quiescamus, et in tua resurgamus laude gaudentes. Per Christum Dominum nostrum.", "es": "Humildemente te pedimos, Señor, que después de haber celebrado en este día los misterios de la resurrección de tu Hijo, sin temor alguno, descansemos en tu paz y mañana nos levantemos alegres para cantar nuevamente tus alabanzas. Por Jesucristo nuestro Señor."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-12-28": {"date_human": {"en": "Monday, December 28, 2026", "es": "Lunes, 28 de diciembre de 2026", "la": "Feria II, die 28 Decembris, anno 2026"}, "day_description": {"en": "Sanctorum Innocentium, martyrum", "es": "Sanctorum Innocentium, martyrum", "la": "Sanctorum Innocentium, martyrum"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"l  al Señor, y loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["58", "Angeles del Señor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["59", "Cielos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["60", "Aguas todas que estáis sobre los cielos *, bendecid al Señor: alabadle, y ensalzadle sobre todas las cosas por todos los siglos."], ["61", "Virtudes todas ó milicias celestiales ', bendecid vosotras al Señor: loadle y ensalzadle sobre todas"], ["62", "Sol y luna, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["63", "Estrellas del cielo, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["64", "Lluvias todas y rocíos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["65", "Espíritus ó vientos de Dios, bendecid todos vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["66", "Fuego y calor, bendecid vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["67", "Frió y calor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["68", "Rocíos y escarchas, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["69", "Hielos y frios, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["70", "Heladas y nieves, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["71", "Noches y dias, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["72", "Luz y tinieblas, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["73", "Relámpagos y nubes, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["74", "Bendiga al Señor la tierra, alábele y ensálzele sobre todas las cosas por todos los siglos."], ["75", "Montes y collados, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["76", "Plantas todas que nacéis en la tierra, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["77", "Fuentes, bendecid al Señor: loadle y ensalzíidle sobre todas las cosas por todos los siglos."], ["78", "Mares y rios, bendecid al Señor: loadle y"], ["79", "Ballenas y peces todos, que giráis por las aguas, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["80", "Aves todas del cielo, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["81", "Bestias todas y ganados, bendecid al Señor: loadle y ensab:adle por todos los siglos sobre todas las cosas."], ["82", "Oh hijos de los hombres, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["83", "Bendiga Israel al Señor: alábele y ensálzele por todos los siglos sobre todas las cosas."], ["84", "Vosotros sacerdotes del Señor, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["85", "Siervos del Señor, bendecid vosotros al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["86", "Espíritus y almas de los justos, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas."], ["87", "Vosotros santos, y humildes de corazón, bendecid al Señor: alabadle y ensalzadle por todos los siglos sobre todas las cosas."], ["88", "Vosotros, Ananías, Azarías y Misael, bendecid al Señor: loadle y ensalzadle por todos los siglos sobre todas las cosas. Porque él nos ha salvado del inlierno ó del sepulcro, y librado de las manos de la ( APÍfüLO III. '¿i'o muelle: y nos ha sacado de en medio de las ardientes llamas, y libertado del fuego del homo."], ["56", "Bendito eres tú en el firmamento del cielo, y digno de loor, y de gloria por todos los siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Dicunt infantes Domino laudem; occisi prædicant quod vivi non poterant.", "es": "Los niños cantan alabanza al Señor; ya degollados, proclaman lo que vivos no podían."}}, {"kind": "psalm", "label": "reading", "ref": "jer 31:15", "content": {"la": [["15", "Haec dicit Dominus : Vox in excelso audita est lamentationis, luctus, et fletus Rachel plorantis filios suos, et nolentis consolari super eis, quia non sunt."]], "es": [["15", "Porque esto dice el Señor: Se han oido allá en lo alto voces de lamentos, de luto y de gemidos, y son de Rachél, que llora sus Lijos, ni quiere admitir consuelo en orden á la muerte de ellos, visto que ya no existen *."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Christe, Fili Dei vivi,* Miserére nobis. Christe.", "℟. Qui Maríæ et Ioseph súbditus fuísti.* Miserére nobis. Glória Patri. Christe."], "es": ["$℣. $Los santos y los justos viven eternamente.", "$℟. $Los santos y los justos viven eternamente.", "$℣. $Reciben de Dios su recompensa.", "$℟. $Viven eternamente.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Los santos y los justos viven eternamente."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Innocéntes pro Christo infántes occísi sunt, ab iníquo rege lacténtes interfécti sunt: ipsum sequúntur Agnum sine mácula, et dicunt semper: Glória tibi, Dómine.", "es": "Los inocentes fueron degollados por Cristo; siendo aún de pecho, fueron muertos por un rey inicuo: siguen al Cordero sin mancha, y dicen siempre: Gloria a ti, Señor."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Innocéntes pro Christo infántes occísi sunt, ab iníquo rege lacténtes interfécti sunt: ipsum sequúntur Agnum sine mácula, et dicunt semper: Glória tibi, Dómine.", "es": "Los inocentes fueron degollados por Cristo; siendo aún de pecho, fueron muertos por un rey inicuo: siguen al Cordero sin mancha, y dicen siempre: Gloria a ti, Señor."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Fílium Dei vivi, qui fílius humánæ famíliæ fíeri dignátus est, adorémus, ipsum exorántes:", "– Iesu, factus obœ́diens, sanctífica nos.", "Iesu, Verbum ætérnum Patris, qui súbditum Maríæ et Ioseph te fecísti,", "doce nos humilitátem.", "– Iesu, factus obœ́diens, sanctífica nos.", "Magíster noster, cuius facta et verba mater tua in corde suo servábat,", "præsta, ut audiámus verbum tuum et custodiámus illud in corde puro et bono.", "– Iesu, factus obœ́diens, sanctífica nos.", "Christe, faber mundi, qui fílium fabri te vocári voluísti,", "doce nos sedulitátem in ópere.", "– Iesu, factus obœ́diens, sanctífica nos.", "Iesu, qui in família Názareth sapiéntia, ætáte et grátia apud Deum et hómines proficiébas,", "fac, ut crescámus per ómnia in te, qui es Caput nostrum.", "– Iesu, factus obœ́diens, sanctífica nos."], "es": ["Celebremos la gloria de Cristo, que, sin escuadrones de hombres armados, sino sólo con una blanca milicia de niños, venció al tirano, y aclamémosle:", "- Cristo, de quien los Inocentes, no de palabra, sino con su sangre, dieron testimonio, _concédenos confesarte, de palabra y de obra, ante los hombres._ _Te ensalza, Señor, el blanco ejército de los mártires._", "- Tú que hiciste dignos del laurel de la victoria a los que aún no estaban preparados para la lucha, _no nos dejes caer a los que hemos recibido tanta ayuda para vencer._ _Te ensalza, Señor, el blanco ejército de los mártires._", "- Tú que lavaste con tu sangre los vestidos de los Inocentes, _líbranos de todo pecado._ _Te ensalza, Señor, el blanco ejército de los mártires._", "- Tú que has colocado a los niños los primeros en el reino de los cielos, _no nos excluyas del banquete eterno._ _Te ensalza, Señor, el blanco ejército de los mártires._", "- Tú que en la infancia sufriste persecución y destierro, _guarda a los niños que hoy sufren por el hambre, la guerra o la injusticia de los mayores._ _Te ensalza, Señor, el blanco ejército de los mártires._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "ref": "Sanctorum Innocentium, martyrum", "content": {"la": "Deus, cujus hodierna die præcónium Innocéntes Mártyres non loquéndo, sed moriéndo conféssi sunt: ómnia in nobis vitiórum mala mortífica; ut fidem tuam, quam lingua nostra lóquitur, étiam móribus vita fateátur.", "es": "Los mártires Inocentes proclaman tu gloria en este día, Señor, no de palabra, sino con su muerte; concédenos, por su intercesión, testimoniar con nuestra vida la fe que confesamos de palabra. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Tecum principium in die virtutis tuæ, in splendoribus sanctorum, ex utero ante luciferum genui te.", "es": "Contigo está el principado el día de tu poder, entre los esplendores de los santos; desde el seno, antes del lucero, te engendré."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 109:1-5,7", "content": {"la": [["1", "Psalmus David. Dixit Dominus Domino meo : Sede a dextris meis, donec ponam inimicos tuos scabellum pedum tuorum."], ["2", "Virgam virtutis tuae emittet Dominus ex Sion : dominare in medio inimicorum tuorum."], ["3", "Tecum principium in die virtutis tuae in splendoribus sanctorum; ex utero, ante luciferum, genui te."], ["4", "Juravit Dominus, et non poenitebit eum : Tu es sacerdos in aeternum secundum ordinem Melchisedech."], ["5", "Dominus a dextris tuis; confregit in die irae suae reges."], ["7", "de torrente in via bibet; propterea exaltabit caput."]], "es": [["1", "El Señor dijo a mi Señor: Siéntate a mi diestra, mientras que yo pongo a tus enemigos por tarima de tus pies."], ["2", "De Sión hará salir el Señor el cetro de tu poder; domina tú en medio de tus enemigos."], ["3", "Contigo está el principado el día de tu poderío, en medio de los resplandores de la santidad; de mis entrañas te engendré, antes de existir el lucero de la mañana."], ["4", "Juró el Señor, y no se arrepentirá, y dijo: Tú eres sacerdote sempiterno, según el orden de Melquisedec."], ["5", "El Señor está a tu diestra; en el día de su ira destrozó a los reyes."], ["7", "Beberá del torrente durante el camino, por eso levantará su cabeza."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Tecum principium in die virtutis tuæ, in splendoribus sanctorum, ex utero ante luciferum genui te.", "es": "Contigo está el principado el día de tu poder, entre los esplendores de los santos; desde el seno, antes del lucero, te engendré."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Apud Dominum misericordia, et copiosa apud eum redemptio.", "es": "En el Señor está la misericordia, y abundante redención en él."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 129", "content": {"la": [["1", "Canticum graduum. De profundis clamavi ad te, Domine;"], ["2", "Domine, exaudi vocem meam. Fiant aures tuae intendentes in vocem deprecationis meae."], ["3", "Si iniquitates observaveris, Domine, Domine, quis sustinebit?"], ["4", "Quia apud te propitiatio est; et propter legem tuam sustinui te, Domine. Sustinuit anima mea in verbo ejus;"], ["5", "speravit anima mea in Domino."], ["6", "A custodia matutina usque ad noctem, speret Israel in Domino;"], ["7", "quia apud Dominum misericordia, et copiosa apud eum redemptio."], ["8", "Et ipse redimet Israel ex omnibus iniquitatibus ejus."]], "es": [["1", "Desde lo más profundo clamé a ti, ¡oh Señor!"], ["2", "Oye, Señor, benignamente mi voz. Estén atentos tus oídos a la voz de mis plegarias."], ["3", "Si te pones a examinar, Señor, nuestras maldades, ¿quién podrá subsistir, ¡oh Señor!, en tu presencia?"], ["4", "Mas en ti se halla siempre la clemencia; y en vista de tu ley he confiado en ti, ¡oh Señor! en la promesa del Señor se ha apoyado mi alma."], ["5", "En el Señor ha puesto su esperanza."], ["6", "Desde el amanecer hasta la noche espere Israel en el Señor."], ["7", "Porque en el Señor está la misericordia, y en su mano tiene una redención abundantísima."], ["8", "Y es él el que redimirá a Israel de todas sus iniquidades."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Apud Dominum misericordia, et copiosa apud eum redemptio.", "es": "En el Señor está la misericordia, y abundante redención en él."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "In principio et ante sæcula Deus erat Verbum: ipse natus est hodie Salvator mundi.", "es": "En el principio y antes de los siglos era Dios el Verbo: él ha nacido hoy como Salvador del mundo."}}, {"kind": "psalm", "label": "canticle", "ref": "col 1:12-20", "content": {"la": [["12", "gratias agentes Deo Patri, qui dignos nos fecit in partem sortis sanctorum in lumine :"], ["13", "qui eripuit nos de potestate tenebrarum, et transtulit in regnum filii dilectionis suae,"], ["14", "in quo habemus redemptionem per sanguinem ejus, remissionem peccatorum :"], ["15", "qui est imago Dei invisibilis, primogenitus omnis creaturae :"], ["16", "quoniam in ipso condita sunt universa in caelis, et in terra, visibilia, et invisibilia, sive throni, sive dominationes, sive principatus, sive potestates : omnia per ipsum et in ipso creata sunt :"], ["17", "et ipse est ante omnes, et omnia in ipso constant."], ["18", "Et ipse est caput corporis Ecclesiae, qui est principium, primogenitus ex mortuis : ut sit in omnibus ipse primatum tenens :"], ["19", "quia in ipso complacuit, omnem plenitudinem inhabitare :"], ["20", "et per eum reconciliare omnia in ipsum, pacificans per sanguinem crucis ejus, sive quae in terris, sive quae in caelis sunt."]], "es": [["12", "dando gracias á Dios Padre, que nos ha hecho dignos de participar de la suerte y herencia úc los santos, iluminándonos con la luz del Evanyelio;"], ["13", "que nos ha arrebatado del poder de las tinieblas, y trasladado al reino de su Hijo muy amado;"], ["14", "por cuya sangre hemos sido nosotros rescatados, y recibido la remisión de los pecados;"], ["15", "y el cual es imágen perfecta del Dios invisible, engendrado ab eterno ante toda criatura;"], ["16", "pues por él fueron criadas todas las cosas en los cielos y en la tierra, las visibles y las invisibles, ora sean tronos, ora dominaciones, ora principados, ora potestades; todas las cosas fueron criadas por él mismo, y en atención á él mismo:"], ["17", "y así él tiene ser ante todas las cosas, y todas subsisten por él, y por él son conservadas."], ["18", "Y él es la cabeza del cuerpo de la Iglesia, y el principio de la resurrección, el primero á renacer de entre los muertos, para que en todo tenga él la primacía;"], ["19", "pues plugo al Padre poner en él la plenitud de todo ser,"], ["20", "y reconciliar por él todas las cosas consigo, restableciendo la paz entre cielo y tierra, por medio de la sangre que derramó en la cruz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "In principio et ante sæcula Deus erat Verbum: ipse natus est hodie Salvator mundi.", "es": "En el principio y antes de los siglos era Dios el Verbo: él ha nacido hoy como Salvador del mundo."}}, {"kind": "psalm", "label": "reading", "ref": "2cor 8:9", "content": {"la": [["9", "Scitis enim gratiam Domini nostri Jesu Christi, quoniam propter vos egenus factus est, cum esset dives, ut illius inopia vos divites essetis."]], "es": [["9", "Porque bien sabéis cuál haja sido la liberalidad de nuestro Señor Jesu-Christo, el cual siendo rico, 280 se hizo pobre por vosotros, ú fin de que vosotros fueseis ricos por medio de su pobreza."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Débuit per ómnia frátribus similári,* Ut miséricors fíeret. Débuit.", "℟. In terris visus est et cum homínibus conversátus est.* Ut miséricors fíeret. Glória Patri. Débuit."], "es": ["$℣. $La Palabra se hizo carne y acampó entre nosotros.", "$℟. $La Palabra se hizo carne y acampó entre nosotros.", "$℣. $De su plenitud todos hemos recibido.", "$℟. $Y acampó entre nosotros.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $La Palabra se hizo carne y acampó entre nosotros."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Hi sunt, * qui cum muliéribus non sunt coinquináti: vírgines enim sunt, et sequúntur Agnum quocúmque íerit.", "es": "Estos son los que no se contaminaron con mujeres, pues son vírgenes, y siguen al Cordero adondequiera que va."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Hi sunt, * qui cum muliéribus non sunt coinquináti: vírgines enim sunt, et sequúntur Agnum quocúmque íerit.", "es": "Estos son los que no se contaminaron con mujeres, pues son vírgenes, y siguen al Cordero adondequiera que va."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Fílium Dei vivi, qui fílius humánæ famíliæ fíeri dignátus est, adorémus, ipsi confiténtes:", "– Tu es, Dómine, exémplar et salvátor ómnium.", "Christe, per mystérium subiectiónis tuæ erga Maríam et Ioseph,", "doce omnes reveréntiam et obœdiéntiam erga eos qui legítime præsunt.", "– Tu es, Dómine, exémplar et salvátor ómnium.", "Qui paréntes amásti et ab ipsis amátus es,", "omnes famílias in pace et mútua caritáte constítue.", "– Tu es, Dómine, exémplar et salvátor ómnium.", "Tu, qui studiósus fuísti eórum, quæ tui sunt Patris,", "præsta, ut in omni domo Deus honorétur.", "– Tu es, Dómine, exémplar et salvátor ómnium.", "Christe, qui ab ánxiis paréntibus tértia die in domo Patris invéntus es,", "doce omnes quǽrere primum regnum Dei.", "– Tu es, Dómine, exémplar et salvátor ómnium.", "Christe, qui Maríam et Ioseph tecum in cælésti glória consociásti,", "admítte defúnctos in famíliam beatórum.", "– Tu es, Dómine, exémplar et salvátor ómnium."], "es": ["Adoremos a Cristo, Hijo del Dios vivo, que quiso ser también hijo de una familia humana, y aclamémosle, diciendo:", "- Oh Cristo, por el misterio de tu sumisión a María y a José, _enséñanos el respeto y la obediencia a los que nos gobiernan legítimamente._ _Tú eres, Señor, el modelo y el salvador de los hombres._", "- Tú que amaste a tus padres y fuiste amado por ellos, _afianza a todas las familias en el amor y la concordia._ _Tú eres, Señor, el modelo y el salvador de los hombres._", "- Tú que estuviste siempre atento a las cosas de tu Padre, _haz que Dios sea honrado en todas las familias._ _Tú eres, Señor, el modelo y el salvador de los hombres._", "- Tú que quisiste que tus padres te buscaran durante tres días, _enséñanos a buscar siempre primero el reino de Dios y su justicia._ _Tú eres, Señor, el modelo y el salvador de los hombres._", "- Tú que has dado parte en tu gloria a María y a José, _admite también a nuestros difuntos en la familia de los santos._ _Tú eres, Señor, el modelo y el salvador de los hombres._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "ref": "Sanctorum Innocentium, martyrum", "content": {"la": "Deus, cujus hodierna die præcónium Innocéntes Mártyres non loquéndo, sed moriéndo conféssi sunt: ómnia in nobis vitiórum mala mortífica; ut fidem tuam, quam lingua nostra lóquitur, étiam móribus vita fateátur.", "es": "Los mártires Inocentes proclaman tu gloria en este día, Señor, no de palabra, sino con su muerte; concédenos, por su intercesión, testimoniar con nuestra vida la fe que confesamos de palabra. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Alis suis obumbrabit tibi; non timebis a timore nocturno.", "es": "Con sus alas te cubrirá; no temerás el terror de la noche."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 90", "content": {"la": [["1", "Laus cantici David. Qui habitat in adjutorio Altissimi, in protectione Dei caeli commorabitur."], ["2", "Dicet Domino : Susceptor meus es tu et refugium meum; Deus meus, sperabo in eum."], ["3", "Quoniam ipse liberavit me de laqueo venantium, et a verbo aspero."], ["4", "Scapulis suis obumbrabit tibi, et sub pennis ejus sperabis."], ["5", "Scuto circumdabit te veritas ejus : non timebis a timore nocturno;"], ["6", "a sagitta volante in die, a negotio perambulante in tenebris, ab incursu, et daemonio meridiano."], ["7", "Cadent a latere tuo mille, et decem millia a dextris tuis; ad te autem non appropinquabit."], ["8", "Verumtamen oculis tuis considerabis et retributionem peccatorum videbis."], ["9", "Quoniam tu es, Domine, spes mea; Altissimum posuisti refugium tuum."], ["10", "Non accedet ad te malum, et flagellum non appropinquabit tabernaculo tuo."], ["11", "Quoniam angelis suis mandavit de te, ut custodiant te in omnibus viis tuis."], ["12", "In manibus portabunt te, ne forte offendas ad lapidem pedem tuum."], ["13", "Super aspidem et basiliscum ambulabis, et conculcabis leonem et draconem."], ["14", "Quoniam in me speravit, liberabo eum; protegam eum, quoniam cognovit nomen meum."], ["15", "Clamabit ad me, et ego exaudiam eum; cum ipso sum in tribulatione; eripiam eum, et glorificabo eum."], ["16", "Longitudine dierum replebo eum, et ostendam illi salutare meum."]], "es": [["1", "El que se acoge al asilo del Altísimo, descansará siempre bajo la protección del Dios del cielo."], ["2", "El dirá al Señor: Tú eres mi amparo y refugio; el Dios mío en quien esperaré."], ["3", "Porque él me ha librado del lazo de los cazadores y de terribles adversidades."], ["4", "Con sus alas te hará sombra, y debajo de sus plumas estarás confiado."], ["5", "Su verdad te cercará como escudo; no temerás terrores nocturnos,"], ["6", "ni la saeta disparada de día, ni al enemigo que anda en tinieblas, ni los asaltos del demonio en medio del día."], ["7", "Caerán muertos a tu siniestra mil y diez mil a tu diestra; mas nada te pasará a ti."], ["8", "Tú lo estarás contemplando con tus propios ojos, y verás el pago que se da a los pecadores, y exclamarás:"], ["9", "¡Oh! y cómo eres tú, ¡oh Señor, mi esperanza! Tú ¡oh justo! has escogido al Altísimo para asilo tuyo."], ["10", "No llegará a ti el mal, ni el azote se acercará a tu morada."], ["11", "Porque él mandó a sus ángeles que cuidasen de ti; los cuales te guardarán en cuantos pasos dieres."], ["12", "Te llevarán en las palmas de sus manos; no sea que tropiece tu pie en alguna piedra."], ["13", "Andarás sobre áspides y víboras, y hollarás los leones y dragones."], ["14", "Ya que ha esperado en mí, yo le libraré; yo lo protegeré, pues ha conocido o adorado mi Nombre."], ["15", "Clamará a mí, y lo oiré benigno. Con él estoy en la tribulación; lo pondré a salvo, y lo llenaré de gloria."], ["16", "Lo sacaré con una vida muy larga, y le haré ver el salvador que enviaré."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Alis suis obumbrabit tibi; non timebis a timore nocturno.", "es": "Con sus alas te cubrirá; no temerás el terror de la noche."}}, {"kind": "psalm", "label": "reading", "ref": "Rev 22:4-5", "content": {"la": [["4", "Et videbunt faciem ejus : et nomen ejus in frontibus eorum."], ["5", "Et nox ultra non erit : et non egebunt lumine lucernae, neque lumine solis, quoniam Dominus Deus illuminabit illos, et regnabunt in saecula saeculorum."]], "es": [["4", "Y verán su cara, y tendrán el nombre de él sobre sus frentes."], ["5", "Y allí no habrá jamás noche; ni necesitarán luz"]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora, Señor, ahora sí que sacas en paz de este mundo á tu siervo, según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "static", "label": "concluding_prayer", "content": {"la": "Vox nostra te, Domine, humiliter deprecetur, ut, dominicæ resurrectionis hac die mysterio celebrato, in pace tua securi a malis omnibus quiescamus, et in tua resurgamus laude gaudentes. Per Christum Dominum nostrum.", "es": "Humildemente te pedimos, Señor, que después de haber celebrado en este día los misterios de la resurrección de tu Hijo, sin temor alguno, descansemos en tu paz y mañana nos levantemos alegres para cantar nuevamente tus alabanzas. Por Jesucristo nuestro Señor."}}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Noctem quietam et finem perfectum concedat nobis Dominus omnipotens.\n℟. Amen.", "es": "℣. El Señor todopoderoso nos conceda una noche tranquila y una santa muerte.\n℟. Amén."}}]}}, "2026-12-29": {"date_human": {"en": "Tuesday, December 29, 2026", "es": "Martes, 29 de diciembre de 2026", "la": "Feria III, die 29 Decembris, anno 2026"}, "day_description": {"en": "Tuesday within the Octave of Christmas (day 5) &mdash; Sancti Thomæ Becket, episcopi et martyris", "es": "Martes de la Octava de Navidad (día 5) &mdash; Sancti Thomæ Becket, episcopi et martyris", "la": "Feria III infra Octavam Nativitatis (dies 5) &mdash; Sancti Thomæ Becket, episcopi et martyris"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum. Amen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"es": "_«¿A Quién habéis visto pastores? Hablad, contádnoslo. ¿Quién se ha aparecido en la tierra?» «Hemos visto al recién nacido y a los coros de  ángeles alabando al Señor.» Aleluya._", "la": "Quem vidístis, pastóres? dícite, annuntiáte nobis: in terris quis appáruit? Natum vídimus, et choros Angelórum collaudántes Dóminum, allelúia."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 62:2-9", "content": {"la": [["2", "Deus, Deus meus, ad te de luce vigilo. Sitivit in te anima mea; quam multipliciter tibi caro mea!"], ["3", "In terra deserta, et invia, et inaquosa, sic in sancto apparui tibi, ut viderem virtutem tuam et gloriam tuam."], ["4", "Quoniam melior est misericordia tua super vitas, labia mea laudabunt te."], ["5", "Sic benedicam te in vita mea; et in nomine tuo levabo manus meas."], ["6", "Sicut adipe et pinguedine repleatur anima mea, et labiis exsultationis laudabit os meum."], ["7", "Si memor fui tui super stratum meum, in matutinis meditabor in te."], ["8", "Quia fuisti adjutor meus, et in velamento alarum tuarum exsultabo."], ["9", "Adhaesit anima mea post te; me suscepit dextera tua."]], "es": [["2", "¡Dios mío, oh mi Dios!, a ti aspiro, y me dirijo desde que apunta la aurora. De ti está sedienta el alma mía. ¡Y de cuántas maneras lo está también este mi cuerpo!"], ["3", "En esta tierra desierta, intransitable y sin agua, me pongo en tu presencia, como si me hallara en el santuario, para contemplar tu poder y la gloria tuya."], ["4", "Más apreciable es que mil vidas tu misericordia; por tanto se ocuparán mis labios en tu alabanza."], ["5", "Por esto te bendeciré toda mi vida, y alzaré mis manos invocando tu Nombre."], ["6", "Quede mi alma bien llena de ti, como de un manjar jugoso; y entonces con labios que rebosen de júbilo, te cantará mi boca himnos de alabanza."], ["7", "Me acordaba de ti en mi lecho; en ti meditaba luego que amanecía;"], ["8", "pues tú eres mi amparo, y a la sombra de tus alas me regocijaré."], ["9", "En pos de ti va anhelando el alma mía; me ha protegido tu diestra."]]}}, {"kind": "ant", "label": "antiphon", "content": {"es": "_«¿A Quién habéis visto pastores? Hablad, contádnoslo. ¿Quién se ha aparecido en la tierra?» «Hemos visto al recién nacido y a los coros de  ángeles alabando al Señor.» Aleluya._", "la": "Quem vidístis, pastóres? dícite, annuntiáte nobis: in terris quis appáruit? Natum vídimus, et choros Angelórum collaudántes Dóminum, allelúia."}, "repeated": true}, {"kind": "ant", "label": "antiphon", "content": {"es": "_El ángel dijo a los pastores: «Os anuncio una gran alegría; hoy os ha nacido el Salvador del mundo.» Aleluya._", "la": "Angelus ad pastóres ait: Annúntio vobis gáudium magnum, quia natus est vobis hódie Salvátor mundi, allelúia."}}, {"kind": "psalm", "label": "canticle", "ref": "dan 3:57-88,56", "content": {"la": [["57", "Benedicite, omnia opera Domini, Domino : laudate et superexaltate eum in saecula."], ["58", "Benedicite, angeli Domini, Domino : laudate et superexaltate eum in saecula."], ["59", "Benedicite, caeli, Domino : laudate et superexaltate eum in saecula."], ["60", "Benedicite, aquae omnes, quae super caelos sunt, Domino : laudate et superexaltate eum in saecula."], ["61", "Benedicite, omnes virtutes Domini, Domino : laudate et superexaltate eum in saecula."], ["62", "Benedicite, sol et luna, Domino : laudate et superexaltate eum in saecula."], ["63", "Benedicite, stellae caeli, Domino : laudate et superexaltate eum in saecula."], ["64", "Benedicite, omnis imber et ros, Domino : laudate et superexaltate eum in saecula."], ["65", "Benedicite, omnes spiritus Dei, Domino : laudate et superexaltate eum in saecula."], ["66", "Benedicite, ignis et aestus, Domino : laudate et superexaltate eum in saecula."], ["67", "Benedicite, frigus et aestus, Domino : laudate et superexaltate eum in saecula."], ["68", "Benedicite, rores et pruina, Domino : laudate et superexaltate eum in saecula."], ["69", "Benedicite, gelu et frigus, Domino : laudate et superexaltate eum in saecula."], ["70", "Benedicite, glacies et nives, Domino : laudate et superexaltate eum in saecula."], ["71", "Benedicite, noctes et dies, Domino laudate et superexaltate eum in saecula."], ["72", "Benedicite, lux et tenebrae, Domino : laudate et superexaltate eum in saecula."], ["73", "Benedicite, fulgura et nubes, Domino : laudate et superexaltate eum in saecula."], ["74", "Benedicat terra Dominum : laudet et superexaltet eum in saecula."], ["75", "Benedicite, montes et colles, Domino : laudate et superexaltate eum in saecula."], ["76", "Benedicite, universa germinantia in terra, Domino : laudate et superexaltate eum in saecula."], ["77", "Benedicite, fontes, Domino : laudate et superexaltate eum in saecula."], ["78", "Benedicite, maria et flumina, Domino : laudate et superexaltate eum in saecula."], ["79", "Benedicite, cete, et omnia quae moventur in aquis, Domino : laudate et superexaltate eum in saecula."], ["80", "Benedicite, omnes volucres caeli, Domino : laudate et superexaltate eum in saecula."], ["81", "Benedicite, omnes bestiae et pecora, Domino : laudate et superexaltate eum in saecula."], ["82", "Benedicite, filii hominum, Domino : laudate et superexaltate eum in saecula."], ["83", "Benedicat Israel Dominum : laudet et superexaltet eum in saecula."], ["84", "Benedicite, sacerdotes Domini, Domino : laudate et superexaltate eum in saecula."], ["85", "Benedicite, servi Domini, Domino : laudate et superexaltate eum in saecula."], ["86", "Benedicite, spiritus et animae justorum, Domino : laudate et superexaltate eum in saecula."], ["87", "Benedicite, sancti et humiles corde, Domino : laudate et superexaltate eum in saecula."], ["88", "Benedicite, Anania, Azaria, Misael, Domino : laudate et superexaltate eum in saecula : quia eruit nos de inferno, et salvos fecit de manu mortis : et liberavit nos de medio ardentis flammae, et de medio ignis eruit nos."], ["56", "Benedictus es in firmamento caeli : et laudabilis et gloriosus in saecula."]], "es": [["57", "Obras todas del Señor, bendecid al Señor, y loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["58", "Angeles del Señor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["59", "Cielos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["60", "Aguas todas que estáis sobre los cielos *, bendecid al Señor: alabadle, y ensalzadle sobre todas las cosas por todos los siglos."], ["61", "Virtudes todas ó milicias celestiales ', bendecid vosotras al Señor: loadle y ensalzadle sobre todas"], ["62", "Sol y luna, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["63", "Estrellas del cielo, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["64", "Lluvias todas y rocíos, bendecid al Señor: alabadle y ensalzadle sobre todas las cosas por todos los siglos."], ["65", "Espíritus ó vientos de Dios, bendecid todos vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["66", "Fuego y calor, bendecid vosotros al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["67", "Frió y calor, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["68", "Rocíos y escarchas, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["69", "Hielos y frios, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["70", "Heladas y nieves, bendecid al Señor: loadle y ensalzadle sobre todas las cosas por todos los siglos."], ["71", "Noches y dias, bendecid al Señor: loadle y ensalzadle sobre todas las cosas po
