t serviant per ordinem", "subdens dedisti homini:", "", "Repelle a servis tuis", "quicquid per immunditiam", "aut moribus se suggerit,", "aut actibus se interserit.", "", "Da gaudiorum praemia,", "da gratiarum munera;", "dissolve litis vincula,", "astringe pacis foedera.", "", "Praesta, Pater piissime,", "Patrique compar Unice,", "cum Spiritu Paraclito", "regnans per omne saeculum. Amen."], "es": ["Dios, formador del hombre,", "que, ordenando tú solo todas las cosas,", "mandas a la tierra producir", "el linaje de lo que repta y de las fieras;", "", "Tú que a los grandes cuerpos de los seres,", "vivificados con solo tu palabra que manda,", "para que sirvieran según su orden,", "sometiéndolos, diste al hombre:", "", "Aparta de tus siervos", "todo lo que por la inmundicia", "se insinúa en las costumbres,", "o se entremete en los actos.", "", "Danos los premios de los gozos,", "danos los dones de las gracias;", "disuelve las cadenas de la discordia,", "estrecha los lazos de la paz.", "", "Concédelo, Padre piadosísimo,", "y también tú, Unigénito igual al Padre,", "que reinas con el Espíritu Paráclito", "por todos los siglos. Amén."]}}, {"id": "rerum_deus_fons_omnium", "title": "Rerum, Deus, Fons Omnium", "original_language": "la", "also_sung_in": [], "lines": {"la": ["Rerum, Deus, fons omnium,", "qui, rebus actis omnibus,", "totius orbis ambitum", "censu replesti munerum,", "", "Ac, mole tanta condita,", "tandem quietem diceris", "sumpsisse, dans laboribus", "ut nos levemur gratius:", "", "Concede nunc mortalibus", "deflere vitae crimina,", "instare iam virtutibus", "et munerari prosperis,", "", "Ut cum tremendi iudicis", "horror supremus coeperit,", "laetemur omnes invicem", "pacis repleti munere.", "", "Praesta, Pater piissime,", "Patrique compar Unice,", "cum Spiritu Paraclito", "regnans per omne saeculum. Amen."], "es": ["Oh Dios, fuente de todas las cosas,", "que, hechas todas las cosas,", "llenaste el ámbito de todo el orbe", "con la riqueza de tus dones,", "", "y, fundada tan gran mole,", "se dice que al fin tomaste", "descanso, para que a nosotros", "nos aliviemos con más gusto de los trabajos:", "", "Concede ahora a los mortales", "llorar los pecados de la vida,", "insistir ya en las virtudes", "y ser recompensados con bienes,", "", "para que, cuando comience", "el terror supremo del juez tremendo,", "todos nos alegremos juntos,", "llenos del don de la paz.", "", "Concédelo, Padre piadosísimo,", "y también tú, Unigénito igual al Padre,", "que reinas con el Espíritu Paráclito", "por todos los siglos. Amén."]}}, {"id": "sanctorum_meritis_inclita_gaudia", "title": "Sanctorum Meritis Inclita Gaudia", "original_language": "la", "also_sung_in": [], "lines": {"la": ["Sanctorum meritis inclita gaudia", "pangamus, socii, gestaque fortia;", "nam gliscit animus promere cantibus", "victorum genus optimum.", "", "Hi sunt quos retinens mundus inhorruit,", "ipsum nam sterili flore peraridum", "sprevere penitus teque secuti sunt,", "rex, Christe, bone caelitum.", "", "Hi pro te furias saevaque sustinent;", "non murmur resonat, non querimonia,", "sed corde tacito mens bene conscia", "conservat patientiam.", "", "Quae vox, quae poterit lingua retexere", "quae tu martyribus munera praeparas?", "Rubri nam fluido sanguine laureis", "ditantur bene fulgidis.", "", "Te, trina Deitas unaque, poscimus,", "ut culpas abluas, noxia subtrahas,", "des pacem famulis, nos quoque gloriam", "per cuncta tibi saecula. Amen."], "es": ["Cantemos, compañeros, los ínclitos gozos", "que ganaron los santos, y sus hazañas fuertes;", "pues el ánimo se anima a proclamar en cánticos", "el linaje óptimo de los vencedores.", "", "Estos son a quienes el mundo, reteniéndolos, aborreció,", "porque, despreciando del todo su flor estéril y árida,", "te siguieron a ti por entero,", "oh Cristo, rey bueno de los que habitan el cielo.", "", "Estos por ti soportan furores y crueldades;", "no resuena en ellos murmullo, ni queja,", "sino que, con el corazón callado, su mente bien consciente", "conserva la paciencia.", "", "¿Qué voz, qué lengua podrá desplegar", "los dones que tú preparas para los mártires?", "Pues con su sangre roja, de fúlgidos", "y hermosos laureles son enriquecidos.", "", "A ti, Deidad trina y una, te pedimos", "que laves nuestras culpas, apartes lo dañino,", "des paz a tus siervos, y a nosotros también gloria", "por todos los siglos. Amén."]}}, {"id": "martyris_christi_colimus_triumphum", "title": "Martyris Christi Colimus Triumphum", "original_language": "la", "also_sung_in": [], "lines": {"la": ["Martyris Christi colimus triumphum,", "dona qui mundi peritura spernit,", "fert opem nudis, alimenta, nummos", "tradit egenis.", "", "Igne torquetur, stabili tenore", "cordis accensus superat minaces", "ignium flammas in amore vitae", "semper opimae.", "", "Spiritum sumpsit chorus angelorum,", "intulit caelo bene laureandum,", "ut scelus laxet hominum, precando", "omnipotentem.", "", "Supplici voto rogitamus ergo", "omnibus, martyr, veniam preceris,", "cordis ardores, fidei tenacem", "usque vigorem.", "", "Gloriam Patri resonemus omnes,", "eius et Nato modulemur apte,", "cum quibus regnat simul et creator", "Spiritus almus. Amen."], "es": ["Celebramos el triunfo del mártir de Cristo,", "que desprecia los dones perecederos del mundo,", "socorre a los desnudos, y a los pobres", "reparte alimento y dinero.", "", "Es atormentado por el fuego, mas con firme constancia,", "inflamado el corazón, vence las amenazantes", "llamas del incendio, por el amor de una vida", "siempre opulenta.", "", "El coro de los ángeles recibió su espíritu,", "lo llevó al cielo digno de ser coronado de laurel,", "para que, orando, alcance del Omnipotente", "el perdón de las culpas de los hombres.", "", "Con voto suplicante te rogamos, pues,", "que para todos, oh mártir, implores el perdón,", "y los ardores del corazón, y de la fe", "un vigor siempre constante.", "", "Resonemos todos la gloria al Padre,", "y cantemos como conviene la de su Hijo,", "con quienes reina igualmente el creador", "Espíritu bondadoso. Amén."]}}, {"id": "agnes_beatae_virginis", "title": "Agnes Beatae Virginis", "original_language": "la", "also_sung_in": [], "lines": {"la": ["Agnes beatae virginis", "natalis est, quo spiritum", "caelo refudit debitum,", "pio sacrata sanguine.", "", "Matura martyrio fuit", "matura nondum nuptiis;", "prodire quis nuptum putet,", "sic laeta vultu ducitur.", "", "Aras nefandi numinis", "adolere taedis cogitur;", "respondet: «Haud tales faces", "sumpsere Christi virgines.", "", "Hic ignis exstinguit fidem,", "haec flamma lumen eripit;", "hic, hic ferite, ut profluo", "cruore restinguam focos».", "", "Percussa quam pompam tulit!", "Nam veste se totam tegens,", "terram genu flexo petit", "lapsu verecundo cadens.", "", "Iesu, tibi sit gloria,", "qui natus es de Virgine,", "cum Patre et almo Spiritu,", "in sempiterna saecula. Amen."], "es": ["Es el natalicio de Agnes,", "la bienaventurada virgen, en que devolvió", "al cielo el espíritu que le era debido,", "consagrada con sangre piadosa.", "", "Estaba madura para el martirio,", "mas no todavía para las nupcias;", "¿quién pensaría que sale a desposarse?,", "así, alegre el rostro, es conducida.", "", "Es obligada a quemar incienso", "en los altares de un dios nefando;", "responde: «No tales antorchas", "tomaron las vírgenes de Cristo.", "", "Este fuego extingue la fe,", "esta llama arrebata la luz;", "aquí, aquí herid, para que con sangre", "que fluya yo apague esos fuegos».", "", "¡Qué gala mostró al ser herida!", "Pues, cubriéndose toda con su manto,", "busca la tierra con la rodilla doblada,", "cayendo con pudoroso desplome.", "", "Jesús, sea para ti la gloria,", "que naciste de la Virgen,", "con el Padre y el Espíritu bondadoso,", "por los siglos eternos. Amén."]}}, {"id": "iesu_corona_virginum", "title": "Iesu, Corona Virginum", "original_language": "la", "also_sung_in": [], "lines": {"la": ["Iesu, corona virginum,", "quem Mater illa concipit", "quae sola virgo parturit,", "haec vota clemens accipe,", "", "Qui pascis inter lilia", "saeptus choreis virginum,", "sponsus decorus gloria", "sponsisque reddens praemia.", "", "Quocumque pergis, virgines", "sequuntur, atque laudibus", "post te canentes cursitant", "hymnosque dulces personant.", "", "Te deprecamur, largius", "nostris adauge mentibus", "nescire prorsus omnia", "corruptionis vulnera.", "", "Iesu, tibi sit gloria,", "qui natus es de Virgine,", "cum Patre et almo Spiritu,", "in sempiterna saecula. Amen."], "es": ["Jesús, corona de las vírgenes,", "a quien concibió aquella Madre", "que sola, siendo virgen, dio a luz,", "recibe clemente estos votos,", "", "Tú que te apacientas entre lirios", "rodeado de coros de vírgenes,", "esposo hermoso en gloria,", "que a tus esposas das su recompensa.", "", "Adondequiera que vas, las vírgenes", "te siguen, y con alabanzas", "corren detrás de ti cantando", "y hacen resonar dulces himnos.", "", "Te suplicamos que, más generoso,", "acrecientes en nuestras mentes", "no conocer en absoluto", "ninguna herida de corrupción.", "", "Jesús, sea para ti la gloria,", "que naciste de la Virgen,", "con el Padre y el Espíritu bondadoso,", "por los siglos eternos. Amén."]}}]}, "our_father_bread_variants": {"cotidianum": {"la": "Panem nostrum cotidianum da nobis hodie;", "es": "Danos hoy nuestro pan de cada día;", "en": "Give us this day our daily bread;"}, "supersubstantialem": {"la": "Panem nostrum supersubstantialem da nobis hodie;", "es": "Danos hoy nuestro pan supersustancial;", "en": "Give us this day our supersubstantial bread;"}}, "dates": {"2026-07-30": {"date_human": {"en": "Thursday, July 30, 2026", "es": "Jueves, 30 de julio de 2026", "la": "Feria V, die 30 Iulii, anno Domini 2026"}, "day_description": {"en": "Thursday in the 17<sup>th</sup> Week in Ordinary Time (Psalter week 1) &mdash; Sancti Petri Chrysologui, episcopi et Ecclesiæ doctoris", "es": "Jueves de la 17.<sup>a</sup> semana del Tiempo Ordinario (semana 1 del salterio) &mdash; Sancti Petri Chrysologui, episcopi et Ecclesiæ doctoris", "la": "Feria V infra hebdomadam XVII per annum (hebdomada psalterii I) &mdash; Sancti Petri Chrysologui, episcopi et Ecclesiæ doctoris"}, "liturgical_meta": {"color": "white", "rank": {"en": "Optional Memorial", "es": "Memoria libre", "la": "Memoria ad libitum"}, "title": {"en": "Sancti Petri Chrysologui, episcopi et Ecclesiæ doctoris", "es": "Sancti Petri Chrysologui, episcopi et Ecclesiæ doctoris", "la": "Sancti Petri Chrysologui, episcopi et Ecclesiæ doctoris"}}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum.\nAmen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. Como era en el principio, ahora y siempre, por los siglos de los siglos.\nAmén. Aleluya.", "en": "℣. O God, come to my assistance.\n℟. O Lord, make haste to help me.\n℣. Glory to the Father, and to the Son, and to the Holy Spirit.\n℟. As it was in the beginning, is now, and ever shall be, unto the ages of ages.\nAmen. Alleluia."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds", "recommended": "iste_confessor"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Exsurge, psalterium et cithara: excitabo auroram.", "es": "Despierta, arpa y cítara: yo despertaré al alba."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 56", "content": {"la": [["2", "Miserere mei, Deus, miserere mei, quoniam in te confidit anima mea. Et in umbra alarum tuarum sperabo, donec transeat iniquitas."], ["3", "Clamabo ad Deum altissimum, Deum qui benefecit mihi."], ["4", "Misit de caelo, et liberavit me; dedit in opprobrium conculcantes me. Misit Deus misericordiam suam et veritatem suam,"], ["5", "et eripuit animam meam de medio catulorum leonum; dormivi conturbatus. Filii hominum dentes eorum arma et sagittae, et lingua eorum gladius acutus."], ["6", "Exaltare super caelos, Deus, et in omnem terram gloria tua."], ["7", "Laqueum paraverunt pedibus meis, et incurvaverunt animam meam. Foderunt ante faciem meam foveam, et inciderunt in eam."], ["8", "Paratum cor meum, Deus, paratum cor meum; cantabo, et psalmum dicam."], ["9", "Exsurge, gloria mea; exsurge, psalterium et cithara; exsurgam diluculo."], ["10", "Confitebor tibi in populis, Domine, et psalmum dicam tibi in gentibus;"], ["11", "quoniam magnificata est usque ad caelos misericordia tua, et usque ad nubes veritas tua."], ["12", "Exaltare super caelos, Deus, et super omnem terram gloria tua."]], "es": [["2", "No destruyas a tu siervo. Ten piedad de mí. ¡Dios mío!, apiádate de mí; ya que mi alma tiene puesta en ti su confianza. A la sombra de tus alas esperaré, hasta que pase la iniquidad."], ["3", "Clamaré a Dios altísimo, a Dios que tanto bien me ha hecho."], ["4", "Envió desde el cielo a librarme; cubrió de oprobio a los que me traían entre pies. Envió Dios su misericordia y su verdad,"], ["5", "y sacó mi alma de entre fuertes leones; lleno de turbación me quedé como adormecido. Porque rejones y flechas son los dientes de los hijos de los hombres, y su lengua tajante espada."], ["6", "¡Oh Dios mío!, ensálzate tú mismo sobre los cielos, y haz brillar tu gloria por toda la tierra."], ["7", "Armado habían ellos un lazo a mis pies, y tenían acobardado mi espíritu. Abrieron delante de mí un hoyo; mas ellos cayeron en él."], ["8", "Mi corazón, ¡oh Dios!, está pronto; dispuesto está mi corazón; yo cantaré y entonaré salmos."], ["9", "Ea, levántate, gloria mía, apresúrate, ¡oh salterio y cítara! Yo me levantaré al rayar el alba."], ["10", "Te alabaré, oh Señor, en medio de los pueblos, y te cantaré himnos entre las naciones;"], ["11", "porque hasta los cielos ha sido ensalzada tu misericordia, y hasta las nubes tu verdad."], ["12", "¡Oh Dios mío!, ensálzate tú mismo sobre los cielos, y tu gloria por toda la tierra."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Exsurge, psalterium et cithara: excitabo auroram.", "es": "Despierta, arpa y cítara: yo despertaré al alba."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Populus meus, ait Dominus, bonis meis adimplebitur.", "es": "Mi pueblo, dice el Señor, se saciará de mis bienes."}}, {"kind": "psalm", "label": "canticle", "ref": "Jer 31:10-14", "content": {"la": [["10", "Audite verbum Domini, gentes, et annuntiate in insulis quae procul sunt, et dicite : Qui dispersit Israel congregabit eum, et custodiet eum sicut pastor gregem suum."], ["11", "Redemit enim Dominus Jacob, et liberavit eum de manu potentioris."], ["12", "Et venient, et laudabunt in monte Sion : et confluent ad bona Domini, super frumento, et vino, et oleo, et foetu pecorum et armentorum : eritque anima eorum quasi hortus irriguus, et ultra non esurient."], ["13", "Tunc laetabitur virgo in choro, juvenes et senes simul : et convertam luctum eorum in gaudium, et consolabor eos, et laetificabo a dolore suo."], ["14", "Et inebriabo animam sacerdotum pinguedine, et populus meus bonis meis adimplebitur, ait Dominus."]], "es": [["10", "Escuchad, oh naciones, la palabra del Señor, y anunciadla á las islas mas remotas, y decid: Aquel mismo que dispersó á Israel, le reunirá, y le guardará como guarda el pastor á su rebaño."], ["11", "Pues el Señor ha redimido á Jacob, y le ha librado de las manos del prepotente."], ["12", "Y así vendrán, y cantarán himnos á Dios en el monte Sion, y correrán en tropa á gozar de los bienes del Señor, del trigo, del vino, del aceite, y de las crías de ovejas y de vacas; y estará su alma cual hermoso jardín abundante de aguas, y no padecerán ya más necesidades."], ["13", "Entonces se regocijarán las vírgenes ' al sonido de músicos instrumentos, y iambien los jóvenes á una con los ancianos. Yo cambiaré su llanto en gozo, y los consolaré, y los llenaré de alegría en cambio de su pasado dolor."], ["14", "Y saciaré el alma de los sacerdotes con otras pingüísimas carnes y el pueblo mió será colmado de mis bienes, dice el Señor '."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Populus meus, ait Dominus, bonis meis adimplebitur.", "es": "Mi pueblo, dice el Señor, se saciará de mis bienes."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Iubilate Deo, omnis terra.", "es": "Aclamad a Dios, toda la tierra."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 47", "content": {"la": [["2", "Magnus Dominus et laudabilis nimis, in civitate Dei nostri, in monte sancto ejus."], ["3", "Fundatur exsultatione universae terrae mons Sion; latera aquilonis, civitas regis magni."], ["4", "Deus in domibus ejus cognoscetur cum suscipiet eam."], ["5", "Quoniam ecce reges terrae congregati sunt, convenerunt in unum."], ["6", "Ipsi videntes, sic admirati sunt, conturbati sunt, commoti sunt."], ["7", "Tremor apprehendit eos; ibi dolores ut parturientis :"], ["8", "in spiritu vehementi conteres naves Tharsis."], ["9", "Sicut audivimus, sic vidimus, in civitate Domini virtutum, in civitate Dei nostri : Deus fundavit eam in aeternum."], ["10", "Suscepimus, Deus, misericordiam tuam in medio templi tui."], ["11", "Secundum nomen tuum, Deus, sic et laus tua in fines terrae; justitia plena est dextera tua."], ["12", "Laetetur mons Sion, et exsultent filiae Judae, propter judicia tua, Domine."], ["13", "Circumdate Sion, et complectimini eam; narrate in turribus ejus."], ["14", "Ponite corda vestra in virtute ejus, et distribuite domos ejus, ut enarretis in progenie altera."], ["15", "Quoniam hic est Deus, Deus noster in aeternum, et in saeculum saeculi; ipse reget nos in saecula."]], "es": [["2", "Grande es el Señor, y dignísimo de alabanza en la ciudad de nuestro Dios, en su monte santo."], ["3", "Con júbilo de toda la tierra se ha edificado el santuario en el monte de Sión, la ciudad del gran rey, al lado del septentrión."], ["4", "Será Dios conocido en sus casas, cuando haya de defenderla."], ["5", "Porque he aquí que los reyes de la tierra se han coligado y conjurado unánimemente."], ["6", "Ellos mismos, cuando la vieron así, quedaron asombrados, llenos de turbación, conmovidos,"], ["7", "y poseídos de terror. Se apoderaron de ellos dolores como de parto."], ["8", "Tú con un viento impetuoso harás pedazos las naves de Tarsis."], ["9", "Como lo oímos, así lo hemos visto en la ciudad del Señor de los ejércitos, en la ciudad de nuestro Dios; la cual ha fundado Dios para siempre."], ["10", "Hemos experimentado, ¡oh Dios!, tu misericordia en medio de tu templo."], ["11", "Al modo que tu Nombre, ¡oh Dios!, así tu gloria se extiende hasta los últimos términos de la tierra; tu diestra está llena de justicia."], ["12", "Alégrese el monte de Sión, y salten de placer las hijas de Judá, ¡oh Señor!, por razón de tus juicios."], ["13", "Dad vueltas alrededor de Sión, examinadla por todos lados, y contad sus torres."], ["14", "Considerad atentamente su fortaleza, y notad bien sus casas o edificios, para poder contarlo a la generación venidera."], ["15", "Porque aquí está Dios, el Dios nuestro, para siempre y por los siglos de los siglos. El nos gobernará eternamente."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Iubilate Deo, omnis terra.", "es": "Aclamad a Dios, toda la tierra."}}, {"kind": "plain", "label": "reading", "ref": "Heb 13:7-9a", "content": {"la": "Mementóte præpositórum vestrórum, qui vobis locúti sunt verbum Dei, quorum intuéntes éxitum conversatiónis imitámini fidem. Iesus Christus heri et hódie idem, et in sǽcula! Doctrínis váriis et peregrínis nolíte abdúci.", "es": "Acordaos de vuestros dirigentes, que os anunciaron la palabra de Dios; fijaos en el desenlace de su vida e imitad su fe. Jesucristo es el mismo ayer y hoy y siempre. No os dejéis arrastrar por doctrinas complicadas y extrañas."}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Super te, Ierúsalem, Constítui custódes.", "℟. Super te, Ierúsalem, Constítui custódes.", "℣. Die ac nocte non tacébunt prædicáre nomen Dómini.", "℟. Constítui custódes.", "℣. Glória Patri, et Fílio, et Spirítui Sancto.", "℟. Super te, Ierúsalem, Constítui custódes."], "es": ["$℣. $Sobre tus murallas, Jerusalén, he colocado centinelas.", "$℟. $Sobre tus murallas, Jerusalén, he colocado centinelas.", "$℣. $Ni de día ni de noche dejarán de anunciar el nombre del Señor.", "$℟. $He colocado centinelas.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Sobre tus murallas, Jerusalén, he colocado centinelas."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Euge serve bone et fidelis, quia in pauca fuisti fidelis, supra multa te constituam, dicit Dominus.", "es": "Bien, siervo bueno y fiel; ya que has sido fiel en lo poco, te pondré al frente de lo mucho, dice el Señor."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel, porque ha visitado, y redimido á su pueblo;"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo:"], ["70", "según lo tenia anunciado por boca de sus santos Profetas, que han florecido en todos los siglos pasados;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen:"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ',"], ["73", "conforme al juramento con que juró á nuestro padre Abraham, que nos otorgaría la gracia."], ["74", "de que, libertados de las manos de nuestros enemigos, le sirvamos sin temor,"], ["75", "con verdadera santidad y justicia, ante su acatamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño! tú serás llamado el Profeta del Altísimo; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados,"], ["78", "por las entrañas misericordiosas de nuestro Dios, que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ',"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte; para enderezar nuestros pasos por el camino de la paz."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Euge serve bone et fidelis, quia in pauca fuisti fidelis, supra multa te constituam, dicit Dominus.", "es": "Bien, siervo bueno y fiel; ya que has sido fiel en lo poco, te pondré al frente de lo mucho, dice el Señor."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christo, bono pastóri, qui pro suis óvibus ánimam pósuit, laudes grati exsolvámus et supplicémus, dicéntes:", "Christe, qui in sanctis pastóribus misericórdiam et dilectiónem tuam dignátus es osténdere, numquam désinas per eos nobíscum misericórditer ágere. Pasce pópulum tuum, Dómine.", "Qui múnere pastóris animárum fungi per tuos vicários pergis, ne destíteris nos ipse per rectóres nostros dirígere. Pasce pópulum tuum, Dómine.", "Qui in sanctis tuis, populórum dúcibus, córporum animarúmque médicus exstitísti, numquam cesses ministérium in nos vitæ et sanctitátis perágere. Pasce pópulum tuum, Dómine.", "Qui, prudéntia et caritáte sanctórum, tuum gregem erudísti, nos in sanctitáte iúgiter per pastóres nostros ædífica. Pasce pópulum tuum, Dómine."], "es": ["Demos gracias a Cristo, el buen Pastor que entregó la vida por sus ovejas, y supliquémosle, diciendo: Apacienta a tu pueblo, Señor.", "Señor Jesucristo, que en los santos pastores nos has revelado tu misericordia y tu amor, haz que por ellos continúe llegando a nosotros tu acción misericordiosa. Apacienta a tu pueblo, Señor.", "Señor Jesucristo, que a través de los santos pastores sigues siendo el único pastor de tu pueblo, no dejes de guiarnos siempre por medio de ellos. Apacienta a tu pueblo, Señor.", "Señor Jesucristo, que por medio de los santos pastores eres el médico de los cuerpos y de las almas, haz que nunca falten a tu Iglesia los ministros que nos guíen por las sendas de una vida santa. Apacienta a tu pueblo, Señor.", "Señor Jesucristo que has adoctrinado a la Iglesia con la prudencia y el amor de los santos, haz que, guiados por nuestros pastores, progresemos en la santidad. Apacienta a tu pueblo, Señor."]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."], "en": ["Our Father, who art in heaven,", "hallowed be thy name;", "thy kingdom come;", "thy will be done on earth as it is in heaven.", "Give us this day our daily bread;", "and forgive us our trespasses,", "as we forgive those who trespass against us;", "and lead us not into temptation,", "but deliver us from evil.", "Amen."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Deus, qui sanctis tuis Abdon et Sennen ad hanc glóriam veniéndi copiósum munus grátiæ contulísti: da fámulis tuis suorum véniam peccatórum; ut, Sanctórum tuórum intercedéntibus méritis, ab ómnibus mereántur adversitátibus liberáti. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.", "es": "Oh Dios, que diste a tu pueblo a tu bienaventurado Petri Chrysologui como ministro de la salvación eterna: concédenos que, a quien tuvimos como maestro de vida en la tierra, merezcamos tenerlo como intercesor en el cielo."}, "ref": "Sancti Petri Chrysologui, episcopi et Ecclesiæ doctoris"}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios.", "en": "℣. Let us bless the Lord.\n℟. Thanks be to God."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum.\nAmen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. Como era en el principio, ahora y siempre, por los siglos de los siglos.\nAmén. Aleluya.", "en": "℣. O God, come to my assistance.\n℟. O Lord, make haste to help me.\n℣. Glory to the Father, and to the Son, and to the Holy Spirit.\n℟. As it was in the beginning, is now, and ever shall be, unto the ages of ages.\nAmen. Alleluia."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers", "recommended": "iste_confessor"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Sana, Domine, animam meam, quia peccavi tibi.", "es": "Sana, Señor, mi alma, porque he pecado contra ti."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 29", "content": {"la": [["2", "Exaltabo te, Domine, quoniam suscepisti me, nec delectasti inimicos meos super me."], ["3", "Domine Deus meus, clamavi ad te, et sanasti me."], ["4", "Domine, eduxisti ab inferno animam meam; salvasti me a descendentibus in lacum."], ["5", "Psallite Domino, sancti ejus; et confitemini memoriae sanctitatis ejus."], ["6", "Quoniam ira in indignatione ejus, et vita in voluntate ejus ad vesperum demorabitur fletus, et ad matutinum laetitia."], ["7", "Ego autem dixi in abundantia mea : Non movebor in aeternum."], ["8", "Domine, in voluntate tua praestitisti decori meo virtutem; avertisti faciem tuam a me, et factus sum conturbatus."], ["9", "Ad te, Domine, clamabo, et ad Deum meum deprecabor."], ["10", "Quae utilitas in sanguine meo, dum descendo in corruptionem? Numquid confitebitur tibi pulvis, aut annuntiabit veritatem tuam?"], ["11", "Audivit Dominus, et misertus est mei; Dominus factus est adjutor meus."], ["12", "Convertisti planctum meum in gaudium mihi; conscidisti saccum meum, et circumdedisti me laetitia;"], ["13", "ut cantet tibi gloria mea, et non compungar. Domine Deus meus, in aeternum confitebor tibi."]], "es": [["2", "Te glorificaré, ¡oh Señor!, por haberte declarado protector mío, no dejando que mis enemigos se gozaran a costa de mí."], ["3", "¡Oh Señor Dios mío!, yo clamé a ti, y me diste la salud."], ["4", "Tú sacaste, Señor, mi alma del infierno o sepulcro. Tú me salvaste, para que no cayera con los que descienden al profundo."], ["5", "¡Oh vosotros santos del Señor!, cantadle himnos, y celebrad su memoria sacrosanta."], ["6", "Porque de su indignación procede el castigo; y de su buena voluntad pende la vida. Hasta la tarde durará el llanto, y al salir la aurora será la alegría."], ["7", "En medio de mi prosperidad había yo dicho. No experimentaré nunca jamás mudanza alguna."], ["8", "¡Oh Señor!, tu buena voluntad es la que ha dado consistencia a mi floreciente estado. Apartaste de mí tu rostro, y al instante fui trastornado."], ["9", "A ti, ¡oh Señor!, clamaré, y a ti, Dios mío, dirigiré mis plegarias."], ["10", "¿Qué utilidad te acarreará mi muerte, y al descender yo a la corrupción del sepulcro? ¿Acaso el polvo cantará tus alabanzas, o anunciará tus verdades?"], ["11", "Me oyó el Señor, y se apiadó de mí. Se declaró el Señor protector mío."], ["12", "Trocaste, ¡oh Dios!, mi llanto en regocijo, rasgaste mi cilicio, y me revestiste de gozo,"], ["13", "a fin de que sea mi gloria el cantar tus alabanzas, y nunca tenga yo penas. ¡Oh Señor Dios mío!, yo te alabaré eternamente."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Sana, Domine, animam meam, quia peccavi tibi.", "es": "Sana, Señor, mi alma, porque he pecado contra ti."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Adiutor in tribulationibus.", "es": "Ayuda en las tribulaciones."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 31", "content": {"la": [["1", "Ipsi David intellectus. Beati quorum remissae sunt iniquitates, et quorum tecta sunt peccata."], ["2", "Beatus vir cui non imputavit Dominus peccatum, nec est in spiritu ejus dolus."], ["3", "Quoniam tacui, inveteraverunt ossa mea, dum clamarem tota die."], ["4", "Quoniam die ac nocte gravata est super me manus tua; conversus sum in aerumna mea, dum configitur spina."], ["5", "Delictum meum cognitum tibi feci, et injustitiam meam non abscondi. Dixi : Confitebor adversum me injustitiam meam Domino; et tu remisisti impietatem peccati mei."], ["6", "Pro hac orabit ad te omnis sanctus in tempore opportuno. Verumtamen in diluvio aquarum multarum, ad eum non approximabunt."], ["7", "Tu es refugium meum a tribulatione quae circumdedit me; exsultatio mea, erue me a circumdantibus me."], ["8", "Intellectum tibi dabo, et instruam te in via hac qua gradieris; firmabo super te oculos meos."], ["9", "Nolite fieri sicut equus et mulus, quibus non est intellectus. In camo et freno maxillas eorum constringe, qui non approximant ad te."], ["10", "Multa flagella peccatoris; sperantem autem in Domino misericordia circumdabit."], ["11", "Laetamini in Domino, et exsultate, justi; et gloriamini, omnes recti corde."]], "es": [["1", "Felices aquellos a quienes se han perdonado sus iniquidades, y se han borrado sus pecados."], ["2", "Dichoso el hombre a quien el Señor no arguye de pecado; y cuya alma se halla exenta de dolo."], ["3", "Por haber yo callado, se consumieron mis huesos, dando alaridos todo el día."], ["4", "Porque de día y de noche me hiciste sentir tu pesada mano. Revolcábame en mi miseria, mientras tenía clavada la espina."], ["5", "Te manifesté mi delito, y dejé de ocultar mi injusticia. Confesaré, dije yo, contra mí mismo al Señor la injusticia mía, y tú perdonaste la malicia de mi pecado."], ["6", "En vista de esto, orará a ti todo hombre santo en el tiempo oportuno. Y ciertamente que en la inundación de copiosas aguas no llegarán éstas a él."], ["7", "Tú eres mi asilo en la tribulación que me tiene cercado: Tú, oh alegría mía, líbrame de los que me tienen rodeado."], ["8", "Yo te daré, dijiste, inteligencia, y te enseñaré el camino que debes seguir; tendré fijos sobre ti mis ojos."], ["9", "Guardaos de ser semejantes al caballo y al mulo, los cuales no tienen entendimiento. Sujeta, ¡oh Señor!, con cabestro y freno las quijadas de los que se retiran de ti."], ["10", "Muchos dolores le esperan al pecador; mas al que tiene puesta en el Señor su esperanza, la misericordia le servirá de muralla."], ["11", "Alegraos, ¡oh justos!, y regocijaos en el Señor, y gloriaos en él vosotros todos los de recto corazón."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Adiutor in tribulationibus.", "es": "Ayuda en las tribulaciones."}}, {"kind": "psalm", "label": "canticle", "ref": "Rev 11:17-18;12:10b-12a", "content": {"la": [["11:17", "Gratias agimus tibi, Domine Deus omnipotens, qui es, et qui eras, et qui venturus es : quia accepisti virtutem tuam magnam, et regnasti."], ["11:18", "Et iratae sunt gentes, et advenit ira tua et tempus mortuorum judicari, et reddere mercedem servis tuis prophetis, et sanctis, et timentibus nomen tuum pusillis et magnis, et exterminandi eos qui corruperunt terram."], ["12:10", "Et audivi vocem magnam in caelo dicentem : Nunc facta est salus, et virtus, et regnum Dei nostri, et potestas Christi ejus : quia projectus est accusator fratrum nostrorum, qui accusabat illos ante conspectum Dei nostri die ac nocte."], ["12:11", "Et ipsi vicerunt eum propter sanguinem Agni, et propter verbum testimonii sui, et non dilexerunt animas suas usque ad mortem."], ["12:12", "Propterea laetamini caeli, et qui habitatis in eis. Vae terrae, et mari, quia descendit diabolus ad vos habens iram magnam, sciens quod modicum tempus habet."]], "es": [["11:17", "Gracias te tributamos, á Señor Dios Todo-poderoso, á tí que eres, que eras ya antes, y que has de venir; porque hiciste alarde de tu gran poderío, y has entrado en posesion de tu reino."], ["11:18", "Las naciones montaron en cólera '; mas sobrevino tu ira, y el tiempo de ser juzgados los muertos, y de dar el galardón á tus siervos los Profetas, y á los santos, y á los que temen tu nombre, chicos y grandes, y de acabar con los que han corrompido la tierra."], ["12:10", "Entonces oí una voz sonora en el cielo que decía: Hé aquí el tiempo de salvación, de la potencia, y del reino de nuestro Dios, y del poder de su Christo: porque ha sido ya precipitado del cielo el acusador de nuestros hermanos, que los acusaba dia y noche ante la presencia de nuestro Dios."], ["12:11", "Y ellos le vencieron por los méritos de la sangre del Cordero, y en virtud de la palabra de la fe que han confesado, y por la cual desamaron sus vidas, hasta perderlas por obedecer á Dios."], ["12:12", "Por tanto regocijaos ¡oh cielos, y los que en ellos moráis! ¡Ay de la tierra, y del mar! porque el diablo bajó á vosotros arrojado del cielo, y está lleno de furor, sabiendo que le queda poco tiempo."]]}}, {"kind": "plain", "label": "reading", "ref": "Heb 13:7-9a", "content": {"la": "Mementóte præpositórum vestrórum, qui vobis locúti sunt verbum Dei, quorum intuéntes éxitum conversatiónis imitámini fidem. Iesus Christus heri et hódie idem, et in sǽcula! Doctrínis váriis et peregrínis nolíte abdúci.", "es": "Acordaos de vuestros dirigentes, que os anunciaron la palabra de Dios; fijaos en el desenlace de su vida e imitad su fe. Jesucristo es el mismo ayer y hoy y siempre. No os dejéis arrastrar por doctrinas complicadas y extrañas."}}, {"kind": "lines", "label": "responsory", "content": {"la": ["℣. Hic est fratrum amátor, et pópuli Israël.", "℟. Hic est fratrum amátor, et pópuli Israël.", "℣. Hic est qui multum orat pro pópulo.", "℟. Hic est fratrum amátor, et pópuli Israël.", "℣. Glória Patri, et Fílio, et Spirítui Sancto.", "℟. Hic est fratrum amátor, et pópuli Israël."], "es": ["$℣. $Éste es el que ama a sus hermanos, el que ora mucho por su pueblo.", "$℟. $Éste es el que ama a sus hermanos, el que ora mucho por su pueblo.", "$℣. $El que entregó su vida por sus hermanos.", "$℟. $El que ora mucho por su pueblo.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Éste es el que ama a sus hermanos, el que ora mucho por su pueblo."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Sacerdos et Pontifex, et virtutum opifex, pastor bone in populo, ora pro nobis Dominum.", "es": "Sacerdote y Pontífice, y artífice de virtudes, buen pastor en medio del pueblo, ruega por nosotros al Señor."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo: Mi alma glorifica al Señor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su esclava: por tanto ya desde ahora me llamarán bienaventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es todopoderoso, cuyo nombre es santo;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos, y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos, y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Sacerdos et Pontifex, et virtutum opifex, pastor bone in populo, ora pro nobis Dominum.", "es": "Sacerdote y Pontífice, y artífice de virtudes, buen pastor en medio del pueblo, ruega por nosotros al Señor."}}, {"kind": "lines", "label": "intercessions", "content": {"la": ["Christum, pro homínibus pontíficem constitútum in iis quæ sunt ad Deum, dignis láudibus celebrémus, humíliter deprecántes: Salvum fac pópulum tuum, Dómine.", "Qui Ecclésiam tuam per sanctos et exímios rectóres mirabíliter illustrásti, fac ut christiáni eódem semper lætificéntur splendóre. Salvum fac pópulum tuum, Dómine.", "Qui, cum sancti te pastóres sicut Móyses orárent pópuli peccáta dimisísti, per intercessiónem eórum Ecclésiam tuam contínua purificatióne sanctífica. Salvum fac pópulum tuum, Dómine.", "Qui sanctos tuos unxísti in médio fratrum et Spíritum tuum in illos direxísti, reple Spíritu Sancto omnes pópuli tui rectóres. Salvum fac pópulum tuum, Dómine.", "Qui pastórum sanctórum ipse posséssio exstitísti, tríbue nullum ex iis, quos sánguine acquisísti, sine te manére. Salvum fac pópulum tuum, Dómine.", "Qui, per Ecclésiæ pastóres, vitam ætérnam óvibus tuis præstas, ne rápiat eas quisquam de manu tua, salva defúnctos, pro quibus ánimam tuam posuísti. Salvum fac pópulum tuum, Dómine."], "es": ["Glorifiquemos a Cristo, constituido pontífice en favor de los hombres en lo que se refiere a Dios, y supliquémosle humildemente diciendo: Salva a tu pueblo, Señor.", "Tú que por medio de pastores santos y eximios has glorificado a tu Iglesia, haz que todos los cristianos resplandezcan por su virtud. Salva a tu pueblo, Señor.", "Tú que por la oración de los santos pastores, que a semejanza de Moisés oraban por el pueblo, perdonaste los pecados de tus fieles, purifica y santifica también ahora a la santa Iglesia por la intercesión de los santos. Salva a tu pueblo, Señor.", "Tú que de entre los fieles elegiste a los santos pastores y, por tu Espíritu, los consagraste como ministros en bien de sus hermanos, llena también de tu Espíritu a todos los pastores del pueblo de Dios. Salva a tu pueblo, Señor.", "Tú que fuiste la heredad de los santos pastores, no permitas que ninguno de los que fueron adquiridos por tu sangre viva alejado de ti. Salva a tu pueblo, Señor.", "Tú que por medio de los pastores de la Iglesia das la vida eterna a tus ovejas para que nadie las arrebate de tu mano, salva a los difuntos, por quienes entregaste tu vida. Salva a tu pueblo, Señor."]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in cælis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in cælo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."], "en": ["Our Father, who art in heaven,", "hallowed be thy name;", "thy kingdom come;", "thy will be done on earth as it is in heaven.", "Give us this day our daily bread;", "and forgive us our trespasses,", "as we forgive those who trespass against us;", "and lead us not into temptation,", "but deliver us from evil.", "Amen."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Deus, qui sanctis tuis Abdon et Sennen ad hanc glóriam veniéndi copiósum munus grátiæ contulísti: da fámulis tuis suorum véniam peccatórum; ut, Sanctórum tuórum intercedéntibus méritis, ab ómnibus mereántur adversitátibus liberáti. Per Dóminum nostrum Iesum Christum, Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.", "es": "Oh Dios, que diste a tu pueblo a tu bienaventurado Petri Chrysologui como ministro de la salvación eterna: concédenos que, a quien tuvimos como maestro de vida en la tierra, merezcamos tenerlo como intercesor en el cielo."}, "ref": "Sancti Petri Chrysologui, episcopi et Ecclesiæ doctoris"}, {"kind": "static", "label": "dismissal", "content": {"la": "℣. Benedicamus Domino.\n℟. Deo gratias.", "es": "℣. Bendigamos al Señor.\n℟. Demos gracias a Dios.", "en": "℣. Let us bless the Lord.\n℟. Thanks be to God."}}], "compline": [{"kind": "static", "label": "deus", "content": {"la": "℣. Deus, in adiutorium meum intende.\n℟. Domine, ad adiuvandum me festina.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. Sicut erat in principio, et nunc, et semper, et in sæcula sæculorum.\nAmen. Alleluia.", "es": "℣. Dios mío, ven en mi auxilio.\n℟. Señor, date prisa en socorrerme.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. Como era en el principio, ahora y siempre, por los siglos de los siglos.\nAmén. Aleluya.", "en": "℣. O God, come to my assistance.\n℟. O Lord, make haste to help me.\n℣. Glory to the Father, and to the Son, and to the Holy Spirit.\n℟. As it was in the beginning, is now, and ever shall be, unto the ages of ages.\nAmen. Alleluia."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "compline"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Caro mea requiescet in spe.", "es": "Mi carne descansará en la esperanza."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 15", "content": {"la": [["1", "Tituli inscriptio, ipsi David. Conserva me, Domine, quoniam speravi in te."], ["2", "Dixi Domino : Deus meus es tu, quoniam bonorum meorum non eges."], ["3", "Sanctis, qui sunt in terra ejus, mirificavit omnes voluntates meas in eis."], ["4", "Multiplicatae sunt infirmitates eorum, postea acceleraverunt. Non congregabo conventicula eorum de sanguinibus; nec memor ero nominum eorum per labia mea."], ["5", "Dominus pars haereditatis meae, et calicis mei : tu es qui restitues haereditatem meam mihi."], ["6", "Funes ceciderunt mihi in praeclaris; etenim haereditas mea praeclara est mihi."], ["7", "Benedicam Dominum qui tribuit mihi intellectum; insuper et usque ad noctem increpuerunt me renes mei."], ["8", "Providebam Dominum in conspectu meo semper, quoniam a dextris est mihi, ne commovear."], ["9", "Propter hoc laetatum est cor meum, et exsultavit lingua mea; insuper et caro mea requiescet in spe."], ["10", "Quoniam non derelinques animam meam in inferno, nec dabis sanctum tuum videre corruptionem."], ["11", "Notas mihi fecisti vias vitae; adimplebis me laetitia cum vultu tuo : delectationes in dextera tua usque in finem."]], "es": [["1", "Sálvame, oh Señor, pues tengo puesta en ti toda mi esperanza."], ["2", "Yo dije al Señor: Tú eres mi Dios, que no tienes necesidad de mis bienes."], ["3", "Cumplido ha maravillosamente todos mis deseos, en los santos que moran en su tierra."], ["4", "Multiplicaron los impíos sus miserias, o sus miserables deidades; en pos de las cuales corrían aceleradamente. No seré yo el que convoque sus sanguinarios sacrificios, ni siquiera tomaré en boca sus nombres."], ["5", "El Señor es la parte que me ha tocado en herencia, y la porción destinada para mí. Tú eres, oh Señor, el que me restituirá y conservará mi heredad."], ["6", "En delicioso sitio me cupo la suerte; hermosa es, a la verdad, la herencia que me ha tocado."], ["7", "Alabaré, pues, al Señor, que me ha dado este entendimiento; a lo cual, aun durante la noche, mi corazón me excitaba."], ["8", "Yo contemplaba siempre al Señor delante de mí, como quien está a mi diestra para sostenerme."], ["9", "Por eso se regocijó mi corazón, y prorrumpió en cánticos alegres mi lengua; y además también mi carne descansará con la esperanza."], ["10", "Porque yo sé que no has de abandonar tú, oh Señor, mi alma en el sepulcro; ni permitirás que tu Santo experimente la corrupción."], ["11", "Me hiciste conocer las sendas de la vida; me colmarás de gozo con la vista de tu divino rostro; en tu diestra se hallan delicias eternas."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Caro mea requiescet in spe.", "es": "Mi carne descansará en la esperanza."}}, {"kind": "psalm", "label": "reading", "ref": "1Thess 5:23", "content": {"la": [["23", "Ipse autem Deus pacis sanctificet vos per omnia : ut integer spiritus vester, et anima, et corpus sine querela in adventu Domini nostri Jesu Christi servetur."]], "es": [["23", "Y el Dios de la paz os haga santos en todo, á fin de que vuestro espíritu entero, con alma y cuerpo se conserven sin culpa para cuando venga nuestro Señor Jesu-Christo."]]}}, {"kind": "static", "label": "responsory", "content": {"la": "℣. In manus tuas, Domine, commendo spiritum meum.\n℟. In manus tuas, Domine, commendo spiritum meum.\n℣. Redemisti nos, Domine Deus veritatis.\n℟. Commendo spiritum meum.\n℣. Gloria Patri, et Filio, et Spiritui Sancto.\n℟. In manus tuas, Domine, commendo spiritum meum.", "es": "℣. A tus manos, Señor, encomiendo mi espíritu.\n℟. A tus manos, Señor, encomiendo mi espíritu.\n℣. Tú, el Dios leal, nos librarás.\n℟. Encomiendo mi espíritu.\n℣. Gloria al Padre, y al Hijo, y al Espíritu Santo.\n℟. A tus manos, Señor, encomiendo mi espíritu.", "en": "℣. Into your hands, Lord, I commend my spirit.\n℟. Into your hands, Lord, I commend my spirit.\n℣. You have redeemed us, Lord God of truth.\n℟. I commend my spirit.\n℣. Glory to the Father, and to the Son, and to the Holy Spirit.\n℟. Into your hands, Lord, I commend my spirit."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "psalm", "label": "nunc_dimittis", "ref": "Luke 2:29-32", "content": {"la": [["29", "Nunc dimittis servum tuum Domine, secundum verbum tuum in pace :"], ["30", "quia viderunt oculi mei salutare tuum,"], ["31", "quod parasti ante faciem omnium populorum :"], // borders tint to today's actual liturgical color regardless of the chosen
// preset's own accent - this only touches --accent/--accent-soft, never
// --bg/--fg, so legibility (a preset's own careful contrast choice) is never
// put at risk by whatever color the calendar happens to be.
const LITURGICAL_COLOR_ACCENTS = {
  white:  { accent: '#8a7638', accentSoft: '#f3ecc9' },
  green:  { accent: '#2f6b3a', accentSoft: '#cfe8d2' },
  violet: { accent: '#5a3c8a', accentSoft: '#e0d3f2' },
  red:    { accent: '#a3272c', accentSoft: '#f3cfd0' },
  rose:   { accent: '#b9587f', accentSoft: '#f6d9e4' },
};

function applySettingsToDOM() {
  const root = document.documentElement;
  const dayData = currentDayData();
  let accent = settings.accent, accentSoft = settings.accentSoft;
  if (settings.liturgicalColorSync && dayData && dayData.liturgical_meta) {
    const lc = LITURGICAL_COLOR_ACCENTS[dayData.liturgical_meta.color];
    if (lc) { accent = lc.accent; accentSoft = lc.accentSoft; }
  }
  root.style.setProperty('--bg', settings.bg);
  root.style.setProperty('--fg', settings.fg);
  root.style.setProperty('--accent', accent);
  root.style.setProperty('--accent-soft', accentSoft);
  root.style.setProperty('--panel-bg', settings.panelBg);
  root.style.setProperty('--panel-border', settings.panelBorder);
  root.style.setProperty('--link', accent);
  root.style.setProperty('--font-main', fontCss(settings.fontMain));
  root.style.setProperty('--font-rubric', fontCss(settings.fontRubric));
  // "Secondary language font" only actually differs from Main when the
  // toggle is on - off means one font for the whole page, matching what a
  // reader who's never touched Settings would expect by default.
  root.style.setProperty('--font-latin', settings.useSecondaryFont ? fontCss(settings.fontLatin) : fontCss(settings.fontMain));
  root.style.setProperty('--font-size-main', settings.fontSizeMain + 'px');
  root.style.setProperty('--font-size-rubric', settings.fontSizeRubric + 'px');
  root.style.setProperty('--font-size-latin', settings.useSecondaryFont ? (settings.fontSizeLatin + 'px') : (settings.fontSizeMain + 'px'));
  root.style.setProperty('--line-height', settings.lineHeight);
  root.style.setProperty('--para-spacing', settings.paraSpacing + 'em');

  const bgImg = settings.bgImage ? `url("${settings.bgImage}")` : 'none';
  const texImg = textureBackgroundImage(settings.texture);
  const combined = settings.bgImage
    ? bgImg

  root.style.setProperty('--bg-blur', settings.bgImage ? settings.bgBlur + 'px' : '0px');

  document.body.classList.add('dropcap-' + settings.dropCapStyle);

const COMMON_TIMEZONES = [
  'UTC', 'Europe/Rome', 'Europe/Madrid', 'Europe/London', 'Europe/Paris',
  'America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles',
  'America/Mexico_City', 'America/Bogota', 'America/Sao_Paulo', 'America/Argentina/Buenos_Aires',
  'Asia/Manila', 'Asia/Tokyo', 'Asia/Kolkata', 'Australia/Sydney', 'Pacific/Auckland',
];
let tzList = COMMON_TIMEZONES;
try {
  if (typeof Intl.supportedValuesOf === 'function') tzList = Intl.supportedValuesOf('timeZone');
} catch (e) { /* fall back to curated list */ }
const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
if (!tzList.includes(browserTz)) tzList = [browserTz, ...tzList];

function isoDateInTimeZone(tz) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
function closestAvailableDate(isoTarget) {
  if (DATA.dates[isoTarget]) return isoTarget;
  const targetMs = new Date(isoTarget).getTime();
  let best = DATA.date_order[0], bestDiff = Infinity;
  for (const iso of DATA.date_order) {
    const diff = Math.abs(new Date(iso).getTime() - targetMs);
    if (diff < bestDiff) { bestDiff = diff; best = iso; }
  }
  return best;
}
function currentDayData() {
  if (!dateSel || !dateSel.value) {
    const todayIso = closestAvailableDate(isoDateInTimeZone(browserTz));
    return DATA.dates[todayIso];
  }
  return DATA.dates[dateSel.value];
}

/* ============================================================
   HOUR SELECTION SCREEN
   ============================================================ */
// Fixed-clock windows (local time) used unless sunset-aware Vespers is on
// and a real sunset could be computed for the viewer's location.
function recommendedHourByClock(hour24) {
  if (hour24 >= 5 && hour24 < 12) return 'lauds';
  if (hour24 >= 21 || hour24 < 5) return 'compline';
  return 'vespers'; // 12:00-20:59 - the long afternoon/evening stretch
}

// Simple NOAA-style approximate sunset calculation (good to a few minutes,
// which is plenty for "should the Vespers halo be lit"). Returns a Date for
// today's sunset at the given lat/lon, or null if the sun doesn't set today
// (polar regions) - callers already have a clock-time fallback for that.
function approximateSunset(lat, lon, date) {
  const rad = Math.PI / 180;
  const start = new Date(Date.UTC(date.getFullYear(), 0, 1));
  const dayOfYear = Math.floor((date - start) / 86400000) + 1;
  const decl = 23.44 * rad * Math.sin(rad * (360 / 365) * (dayOfYear - 81));
  const latRad = lat * rad;
  const cosH = -Math.tan(latRad) * Math.tan(decl);
  if (cosH < -1 || cosH > 1) return null; // sun never sets / never rises today at this latitude
  const hourAngle = Math.acos(cosH) / rad; // degrees
  const solarNoonUtcHours = 12 - lon / 15; // rough, ignores equation of time (fine for this purpose)
  const sunsetUtcHours = solarNoonUtcHours + hourAngle / 15;
  const sunset = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  sunset.setUTCHours(0, 0, 0, 0);
  sunset.setUTCMilliseconds(sunsetUtcHours * 3600000);
  return sunset;
}

let cachedGeo = null;
function recommendedHourNow(callback) {
  const now = new Date();
  const clockHour = now.getHours();
  const clockPick = recommendedHourByClock(clockHour);
  if (!settings.sunsetAwareVespers || !navigator.geolocation) {
    callback(clockPick);
    return;
  }
  const useGeo = (pos) => {
    cachedGeo = pos;
    const sunset = approximateSunset(pos.coords.latitude, pos.coords.longitude, now);
    if (!sunset) { callback(clockPick); return; }
    const diffMin = (now - sunset) / 60000;
    if (diffMin >= -90 && diffMin <= 210) { callback('vespers'); return; } // 1.5h before to 3.5h after sunset
    // Outside the sunset-driven Vespers window: still use fixed windows for Lauds/Compline.
    callback(clockPick === 'vespers' ? (diffMin < 0 ? 'lauds' : 'compline') : clockPick);
  };
  if (cachedGeo) { useGeo(cachedGeo); return; }

function poolsFromRawHymns(raw) {
  // Build a pool for every hour tag actually present in the data, not a
  // fixed 3-item list - see build_hymn_pools()'s docstring (render_day.py)
  // for why. Matters here in particular because user-added hymns (Hymnal
  // screen) can be tagged with any hour.
  const contexts = new Set();
  for (const [hid, h] of Object.entries(raw)) {
    if (hid === '_note') continue;
    for (const ctx of (h.applicability || [])) contexts.add(ctx);
  }
  const pools = {};
  for (const ctx of contexts) {
    pools[ctx] = [];
    for (const [hid, h] of Object.entries(raw)) {
      if (hid === '_note') continue;
      if ((h.applicability || []).includes(ctx)) {
        const lines = {};
        for (const lang of DATA.languages) lines[lang] = (h.lines && h.lines[lang]) || [];
        pools[ctx].push({ id: hid, title: h.title, original_language: h.original_language,
          also_sung_in: h.also_sung_in || [], lines });
      }
    }
  }
  return pools;
}
// Personal hymns a user has added themselves (Hymnal screen) - saved only
// on this device (localStorage), same as Intentions/Diary. Kept as their
// own list, not written into content/proper_texts/hymns.json (there's no
// backend for that to reach), and folded into DATA.hymn_pools at render
// time instead so they show up both in the Hymnal browsing screen AND the
// existing per-hour hymn-choice dropdown.
function loadUserHymns() {

}
function saveUserHymns(list) {

function mergeUserHymnsIntoPools() {
  if (!DATA.hymn_pools) DATA.hymn_pools = {};
  // Idempotent: strip any previously-merged user hymns first, so calling
  // this again after a fresh fetch (which overwrites DATA.hymn_pools
  // wholesale) or after an add/delete never double-adds or leaves stale
  // copies behind.
  for (const ctx of Object.keys(DATA.hymn_pools)) {
    DATA.hymn_pools[ctx] = DATA.hymn_pools[ctx].filter(h => !h.user_added);
  }
  for (const h of loadUserHymns()) {
    const lines = {};
    for (const lang of DATA.languages) lines[lang] = (h.lines && h.lines[lang]) || [];
    const entry = { id: h.id, title: h.title, original_language: h.original_language,
      also_sung_in: h.also_sung_in || [], lines, user_added: true };
    for (const ctx of (h.applicability || [])) {
      if (!DATA.hymn_pools[ctx]) DATA.hymn_pools[ctx] = [];
      DATA.hymn_pools[ctx].push(entry);
    }
  }
}

function mdLite(escaped) {

function renderAlignedRows(unit, left, right, single) {
  const isPsalm = (unit.kind === 'psalm');
  const missingLabel = isPsalm ? '[missing]' : '[not yet sourced]';
  const leftRaw = unit.content ? unit.content[left] : null;
  const rightRaw = single ? leftRaw : (unit.content ? unit.content[right] : null);
  const leftEmpty = !leftRaw || leftRaw.length === 0;
  const rightEmpty = !rightRaw || rightRaw.length === 0;

  if (leftEmpty && rightEmpty) {
    return single
      ? `<tr><td class="single"><em>${missingLabel}</em></td></tr>`
      : `<tr><td class="col-left"><em>${missingLabel}</em></td><td class="col-right"><em>${missingLabel}</em></td></tr>`;
  }

  if (!single) {
    var rows = `<tr><td class="col-left"><div class="unit-label">${left.toUpperCase()}</div></td>` +
                `<td class="col-right"><div class="unit-label">${right.toUpperCase()}</div></td></tr>`;
  } else {
    var rows = '';
  }

  if (isPsalm) {
    const leftMap = new Map((leftRaw || []).map(([n, t]) => [String(n), t]));
    const rightMap = new Map((rightRaw || []).map(([n, t]) => [String(n), t]));
    const nums = Array.from(new Set([...leftMap.keys(), ...rightMap.keys()]))
      .sort((a, b) => parseInt(a, 10) - parseInt(b, 10));
    let first = true;
    for (const n of nums) {
      const dc = first ? ' dropcap' : ''; first = false;
      const lt = leftMap.has(n) ? `<span class="vn">${esc(n)}</span> ${esc(leftMap.get(n))}` : '<em>&mdash;</em>';
      if (single) {
        rows += `<tr><td class="single${dc}">${lt}</td></tr>`;
      } else {
        const rt = rightMap.has(n) ? `<span class="vn">${esc(n)}</span> ${esc(rightMap.get(n))}` : '<em>&mdash;</em>';
        rows += `<tr><td class="col-left${dc}">${lt}</td><td class="col-right">${rt}</td></tr>`;
      }
    }
    return rows;
  }

  const maxLen = Math.max(leftRaw ? leftRaw.length : 0, rightRaw ? rightRaw.length : 0);
  for (let i = 0; i < maxLen; i++) {
    const lt = (leftRaw && leftRaw[i] !== undefined) ? mdLite(esc(leftRaw[i])) : '<em>&mdash;</em>';
    if (single) {
      rows += `<tr><td class="single hymn-line">${lt}</td></tr>`;
    } else {
      const rt = (rightRaw && rightRaw[i] !== undefined) ? mdLite(esc(rightRaw[i])) : '<em>&mdash;</em>';
      rows += `<tr><td class="col-left hymn-line">${lt}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    }
  }
  return rows;
}

function renderHymnChoiceRows(unit, left, right) {
  const ctx = unit.hour;
  const pool = (DATA.hymn_pools && DATA.hymn_pools[ctx]) || [];
  const opts = pool
    .filter(h => h.lines[h.original_language] && h.lines[h.original_language].length)
    .map(h => ({ id: h.id, lang: h.original_language, title: h.title }));
  if (opts.length === 0) {
    return `<tr><td colspan="2"><em>[not yet sourced]</em></td></tr>`;
  }
  opts.sort((a, b) => (a.lang === left ? 0 : 1) - (b.lang === left ? 0 : 1));

  // The server picks a recommended hymn per hour based on what kind of day
  // it is (a martyr's, a virgin's, Marian, the Ordinary Time weekday cycle,
  // etc. - see recommend_hymn_id() in render_day.py) - used as the default
  // selection only the first time this hour is shown; once the person picks
  // something themselves (or on any later render), their choice sticks.
  let choiceId = hymnChoiceByHour[ctx];
  if (!choiceId || !opts.some(o => o.id === choiceId)) {
    choiceId = (unit.recommended && opts.some(o => o.id === unit.recommended)) ? unit.recommended : opts[0].id;
    hymnChoiceByHour[ctx] = choiceId;
  }

  let selectHtml = `<select class="hymn-select" data-hour="${esc(ctx)}">`;
  for (const o of opts) {
    const picked = (o.id === choiceId) ? ' selected' : '';
    const recTag = (o.id === unit.recommended) ? ` — ${esc(ui().hymnRecommendedTag)}` : '';
    selectHtml += `<option value="${esc(o.id)}"${picked}>` +
      `${esc(o.title)} (${esc(LANG_NAMES[o.lang] || o.lang)})${recTag}</option>`;
  }
  selectHtml += `</select>`;
  let rows = `<tr><td colspan="2" class="hymn-picker">${selectHtml}</td></tr>`;

  const hymn = pool.find(h => h.id === choiceId);
  const sungLines = hymn.lines[hymn.original_language] || [];
  const translatedLines = hymn.lines[right] || [];
  const single = (hymn.original_language === right);

  if (single) {
    for (const line of sungLines) {
      rows += `<tr><td class="single hymn-line">${esc(line)}</td></tr>`;
    }
  } else if (translatedLines.length === 0) {
    sungLines.forEach((line, i) => {
      const rt = (i === 0) ? '<em>[not yet sourced]</em>' : '';
      rows += `<tr><td class="col-left hymn-line">${esc(line)}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    });
  } else {
    const maxLen = Math.max(sungLines.length, translatedLines.length);
    for (let i = 0; i < maxLen; i++) {
      const lt = sungLines[i] !== undefined ? esc(sungLines[i]) : '';
      const rt = translatedLines[i] !== undefined ? esc(translatedLines[i]) : '';
      rows += `<tr><td class="col-left hymn-line">${lt}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    }
  }
  return rows;
}

function intentionExtraLines(unit) {

  const checked = loadIntentions().filter(i => i.checked);

// Swaps the Our Father's "daily bread" line (index 4 of static.json's
// our_father arrays) for whichever of the two traditional Latin renderings
// (cotidianum/supersubstantialem - Luke's vs. Matthew's Vulgate translation
// of epiousios) the Settings tab has picked, in every language at once.
// Returns a shallow clone so the original DATA object is never mutated.
function applyPaterNosterBread(unit) {
  if (unit.label !== 'our_father' || !DATA.our_father_bread_variants) return unit;
  const variant = DATA.our_father_bread_variants[settings.paterNosterBread];
  if (!variant) return unit;
  const clone = Object.assign({}, unit, { content: {} });
  for (const lang of Object.keys(unit.content)) {
    const lines = unit.content[lang];
    if (!Array.isArray(lines)) { clone.content[lang] = lines; continue; }
    const newLines = lines.slice();
    if (newLines.length > 4 && variant[lang]) newLines[4] = variant[lang];
    clone.content[lang] = newLines;
  }
  return clone;
}

function renderFixedBilingualRow(textObj, uLeft, uRight, single, rowClass) {
  const left = textObj[uLeft] || textObj.en || '';
  const right = single ? left : (textObj[uRight] || textObj.en || '');
  if (single) {
    return `<tr class="${rowClass}"><td class="single">${esc(left)}</td></tr>`;
  }
  return `<tr class="${rowClass}"><td class="col-left">${esc(left)}</td><td class="col-right">${esc(right)}</td></tr>`;
}

function render() {
  const dayData = currentDayData();
  if (!dayData) return;
  let intentionCellCounter = 0;
  const pendingIntentionCells = []; // {id, lang, text} - translated in place once the table is in the DOM
  let left = leftSel.value, right = rightSel.value;
  const hour = hourSel.value;

  if (settings.bilingualMode === 'latinOnly') { left = 'la'; right = 'la'; }
  else if (settings.bilingualMode === 'vernacularOnly') {
    const vern = DATA.languages.find(l => l !== 'la') || DATA.languages[0];
    left = vern; right = vern;
  }
  const single = (left === right);

  document.getElementById('dateHeading').innerHTML = dayData.day_description[left] || dayData.day_description.en;
  document.getElementById('metaLine').textContent = (dayData.date_human[left] || dayData.date_human.en);

  const units = dayData.hours[hour] || [];
  const labels = DATA.unit_labels[left] || DATA.unit_labels.en;
  let html = '';
  let firstUnit = true;
  for (const unit of units) {
    let labelText = labels[unit.label] || unit.label;
    if (unit.repeated) labelText += ' ' + (labels.repeated || '');
    if (unit.ref) labelText += ` (${esc(unit.ref)})`;
    const symbol = SYMBOL_BY_LABEL[unit.label] ? `<span class="section-symbol">${SYMBOL_BY_LABEL[unit.label]}</span>` : '';
    const dividerClass = (!firstUnit) ? ' unit-divider' : '';
    firstUnit = false;

    // Beta English isn't real stored content for most units (DATA.languages
    // stays ['la','es']) - it's a live translation of the Spanish text laid
    // over the same structure. A handful of universal, invariant texts
    // (static.json's Deus in Adiutorium, Our Father, Compline's fixed
    // formulas) DO carry genuine sourced English though - unit.content.en
    // is only ever present for those, so its mere presence is what decides
    // whether this unit needs live translation at all. left/right (kept as
    // 'en' throughout) still drive the visible "EN" label and the
    // single/two-column layout decision above.
    const unitHasRealEnglish = !!(unit.content && unit.content.en !== undefined && unit.content.en !== null);
    const uLeft = (left === 'en') ? (unitHasRealEnglish ? 'en' : 'es') : left;
    const uRight = (right === 'en') ? (unitHasRealEnglish ? 'en' : 'es') : right;
    const mtSkip = (left === 'en' || right === 'en') ? (unitHasRealEnglish ? '1' : '0') : '1';

    html += `<tr class="unit-header${dividerClass}" data-mt-skip="${mtSkip}"><th colspan="2">${symbol}${esc(labelText)}${symbol}</th></tr>`;
    if (unit.label === 'psalmody_gap') {
      html += `<tr><td colspan="2"><em>${esc(labels.psalmody_gap_note || labels.missing)}</em></td></tr>`;
    } else if (unit.label === 'vespers_omitted_holy_saturday') {
      html += `<tr><td colspan="2"><em>${esc(labels.vespers_omitted_holy_saturday_note || labels.missing)}</em></td></tr>`;
    } else if (unit.kind === 'psalm' || unit.kind === 'lines') {
      html += renderAlignedRows(applyPaterNosterBread(unit), uLeft, uRight, single);
      const extra = intentionExtraLines(unit);
      if (extra) {
        for (const line of extra) {
          const idL = 'intent-cell-' + (intentionCellCounter++);
          if (single) {
            html += `<tr><td class="single hymn-line" id="${idL}">${esc(line)}</td></tr>`;
            pendingIntentionCells.push({ id: idL, lang: uLeft, text: line });
          } else {
            const idR = 'intent-cell-' + (intentionCellCounter++);
            html += `<tr><td class="col-left hymn-line" id="${idL}">${esc(line)}</td>` +
                    `<td class="col-right hymn-line" id="${idR}"></td></tr>`;
            pendingIntentionCells.push({ id: idL, lang: uLeft, text: line });
            pendingIntentionCells.push({ id: idR, lang: uRight, text: line });
          }
        }
      }
      // A real psalm or canticle (not the verse-numbered short reading,
      // which also happens to use kind:"psalm" for its line formatting)
      // traditionally closes with the Gloria Patri, before its antiphon
      // is repeated - settings.showGloriaPatri makes that optional.
      if (unit.kind === 'psalm' && unit.label !== 'reading' && settings.showGloriaPatri) {
        html += renderFixedBilingualRow(GLORIA_PATRI_TEXT, uLeft, uRight, single, 'gloria-patri-row');
      }
      if (unit.label === 'reading' && settings.sacredSilence) {
        html += renderFixedBilingualRow(SACRED_SILENCE_LABEL, uLeft, uRight, single, 'sacred-silence-row');
      }
    } else if (unit.kind === 'hymn_choice') {
      html += renderHymnChoiceRows(unit, uLeft, uRight);
    } else if (single) {
      html += `<tr><td class="single dropcap">${renderUnitContent(unit, uLeft)}</td></tr>`;
      if (unit.label === 'reading' && settings.sacredSilence) {
        html += renderFixedBilingualRow(SACRED_SILENCE_LABEL, uLeft, uRight, single, 'sacred-silence-row');
      }
    } else {
      html += `<tr><td class="col-left dropcap"><div class="unit-label">${left.toUpperCase()}</div>${renderUnitContent(unit, uLeft)}</td>` +
              `<td class="col-right"><div class="unit-label">${right.toUpperCase()}</div>${renderUnitContent(unit, uRight)}</td></tr>`;
      if (unit.label === 'reading' && settings.sacredSilence) {
        html += renderFixedBilingualRow(SACRED_SILENCE_LABEL, uLeft, uRight, single, 'sacred-silence-row');
      }
    }
  }

  // Marian antiphon (Salve Regina and its seasonal siblings) is a fixed
  // closing devotion, traditionally added after Night Prayer's own
  // dismissal - not part of any day's sourced content, so it's appended
  // here client-side rather than flowing through render_day.py.
  if (hour === 'compline' && settings.marianAntiphonEnabled && settings.marianAntiphonChoice !== 'none') {
    const ant = MARIAN_ANTIPHONS[settings.marianAntiphonChoice];
    if (ant && ant.text) {
      const uLeft = (left === 'en') ? 'es' : left;
      const uRight = (right === 'en') ? 'es' : right;
      const titleText = ant.title[uLeft] || ant.title.en;
      html += `<tr class="unit-header unit-divider"><th colspan="2">${esc(titleText)}</th></tr>`;
      html += renderFixedBilingualRow(ant.text, uLeft, uRight, single, 'marian-antiphon-row');
    }
  }

  const table = document.getElementById('mainTable');
  table.innerHTML = html;
  table.querySelectorAll('.hymn-select').forEach(sel => sel.addEventListener('change', onHymnSelectChange));
  // Only the very first content cell of the hour gets a drop cap (a whole
  // hour's worth of drop caps would be visual noise, not an ornament).
  const dcs = table.querySelectorAll('.dropcap');
  dcs.forEach((el, i) => { if (i > 0) el.classList.remove('dropcap'); });

  if (left === 'en' || right === 'en') {
    applyBetaEnglishTranslation(table, left === 'en', right === 'en');
  }
  applyIntentionTranslations(pendingIntentionCells);

  setupPaging(table);
}

// Each Personal Intention line is entered once by the person praying, then
// shown translated into whichever language(s) the Preces column(s) are
// actually displaying (see translateIntentionFor) - a cell is patched in
// place once its translation resolves, exactly like the beta-English pass.
function applyIntentionTranslations(pending) {
  pending.forEach(({ id, lang, text }) => {
    const cell = document.getElementById(id);
    if (!cell) return;
    if (lang === 'en') { cell.textContent = text; return; } // assumed-source language, nothing to translate
    cell.classList.add('mt-pending');
    translateIntentionFor(text, lang).then(translated => {
      cell.classList.remove('mt-pending');
      cell.innerHTML = mdLite(esc(translated));
    });
  });
}

// "Paged" reading mode chunks the already-rendered table rows into pages by
// unit-header boundary (never splitting a unit's own rows across pages) and
// shows one page at a time with Prev/Next controls + the ribbon bookmark.
function setupPaging(table) {
  const allRows = Array.from(table.querySelectorAll('tr'));
  const pages = [];
  let current = [];
  for (const row of allRows) {
    if (row.classList.contains('unit-header') && current.length > 0 && current.length >= 6) {
      pages.push(current);
      current = [];
    }
    current.push(row);
  }
  if (current.length) pages.push(current);
  currentPages = pages.length ? pages : [allRows];
  currentPageIndex = 0;
  applyPaging();
}
function applyPaging() {
  const table = document.getElementById('mainTable');
  const allRows = Array.from(table.querySelectorAll('tr'));
  allRows.forEach(r => r.style.display = '');
  if (settings.readingMode !== 'paged') {
    updatePagerIndicator();
    return;
  }
  const activeRows = new Set(currentPages[currentPageIndex] || []);
  allRows.forEach(r => { r.style.display = activeRows.has(r) ? '' : 'none'; });
  updatePagerIndicator();
}
function updatePagerIndicator() {
  const total = currentPages.length;
  const text = `Page ${currentPageIndex + 1} of ${total}`;
  ['pagerIndicator', 'pagerIndicatorBottom'].forEach(id => {
    const el = document.getElementById(id); if (el) el.textContent = text;
  });
  ['pagerPrev', 'pagerPrevBottom'].forEach(id => {
    const el = document.getElementById(id); if (el) el.disabled = (currentPageIndex === 0);
  });
  ['pagerNext', 'pagerNextBottom'].forEach(id => {
    const el = document.getElementById(id); if (el) el.disabled = (currentPageIndex >= currentPages.length - 1);
  });
}
function pagerGo(delta) {
  currentPageIndex = Math.max(0, Math.min(currentPages.length - 1, currentPageIndex + delta));
  applyPaging();
  document.querySelector('.content-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
['pagerPrev', 'pagerPrevBottom'].forEach(id => document.getElementById(id).addEventListener('click', () => pagerGo(-1)));
['pagerNext', 'pagerNextBottom'].forEach(id => document.getElementById(id).addEventListener('click', () => pagerGo(1)));

function saveIntentions(list) {

}
