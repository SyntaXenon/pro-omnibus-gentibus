"Etc": "Etc"}, "la": {"Africa": "Africa", "America": "America", "Antarctica": "Antarctica", "Arctic": "Arcticus", "Asia": "Asia", "Atlantic": "Atlanticus", "Australia": "Australia", "Europe": "Europa", "Indian": "Indicus", "Pacific": "Pacificus", "Etc": "Etc"}}, "hymn_pools": {"vespers": [{"id": "ave_maris_stella", "title": "Ave Maris Stella", "original_language": "la", "lines": {"la": ["Ave, maris stella,", "Dei Mater alma,", "atque semper Virgo,", "felix caeli porta.", "", "Sumens illud Ave", "Gabrielis ore,", "funda nos in pace,", "mutans Evae nomen.", "", "Solve vincla reis,", "profer lumen caecis,", "mala nostra pelle,", "bona cuncta posce.", "", "Monstra te esse matrem,", "sumat per te preces", "qui pro nobis natus", "tulit esse tuus.", "", "Virgo singularis,", "inter omnes mitis,", "nos culpis solutos", "mites fac et castos.", "", "Vitam praesta puram,", "iter para tutum,", "ut videntes Iesum", "semper collaetemur.", "", "Sit laus Deo Patri,", "summo Christo decus,", "Spiritui Sancto,", "tribus honor unus. Amen."], "es": ["Salve, estrella del mar,", "Madre nutricia de Dios,", "y siempre Virgen,", "dichosa puerta del cielo.", "", "Tomando aquel Ave", "de labios de Gabriel,", "afiánzanos en paz,", "cambiando el nombre de Eva.", "", "Suelta las cadenas de los culpables,", "trae la luz a los ciegos,", "aleja nuestros males,", "pide para nosotros todos los bienes.", "", "Muéstrate ser madre,", "reciba por ti nuestras súplicas", "quien, nacido por nosotros,", "quiso ser hijo tuyo.", "", "Virgen sin igual,", "mansa entre todas,", "líbranos de nuestras culpas", "y haznos mansos y castos.", "", "Danos una vida pura,", "prepáranos un camino seguro,", "para que, viendo a Jesús,", "nos gocemos siempre juntos.", "", "Sea la alabanza a Dios Padre,", "la gloria al altísimo Cristo,", "al Espíritu Santo,", "un mismo honor a los tres. Amén."]}}, {"id": "vexilla_regis_prodeunt", "title": "Vexilla Regis Prodeunt", "original_language": "la", "lines": {"la": ["Vexilla Regis prodeunt:", "fulget Crucis mysterium,", "qua vita mortem pertulit,", "et morte vitam protulit.", "", "Quae vulnerata lanceae", "mucrone diro, criminum", "ut nos lavaret sordibus,", "manavit unda et sanguine.", "", "Impleta sunt quae concinit", "David fideli carmine,", "dicendo nationibus:", "regnavit a ligno Deus.", "", "O Crux ave, spes unica,", "hoc Passionis tempore", "piis adauge gratiam,", "reisque dele crimina.", "", "Te, fons salutis Trinitas,", "collaudet omnis spiritus:", "quibus Crucis victoriam", "largiris, adde praemium. Amen."], "es": ["Los estandartes del Rey avanzan:", "resplandece el misterio de la Cruz,", "por la cual la Vida sufrió la muerte,", "y con la muerte produjo la vida.", "", "La cual, herida por la punta", "cruel de la lanza, para lavarnos", "de la mancha de nuestros pecados,", "manó agua y sangre.", "", "Se cumplió lo que cantó", "David en su fiel poema,", "diciendo a las naciones:", "Dios reinó desde el madero.", "", "Salve, oh Cruz, única esperanza,", "en este tiempo de la Pasión", "aumenta la gracia a los piadosos,", "y borra los pecados de los culpables.", "", "A ti, Trinidad, fuente de salvación,", "te alabe todo espíritu:", "a quienes la victoria de la Cruz", "concedes, añade la recompensa. Amén."]}}, {"id": "conditor_alme_siderum", "title": "Conditor Alme Siderum", "original_language": "la", "lines": {"la": ["Conditor alme siderum,", "aeterna lux credentium,", "Christe, redemptor omnium,", "exaudi preces supplicum.", "", "Qui condolens interitu", "mortis perire saeculum,", "salvasti mundum languidum,", "donans reis remedium.", "", "Vergente mundi vespere,", "uti sponsus de thalamo,", "egressus honestissima", "Virginis matris clausula.", "", "Cuius forti potentiae", "genu curvantur omnia;", "caelestia, terrestria", "nutu fatentur subdita.", "", "Te, Sancte, fide quaesumus,", "venture iudex saeculi,", "conserva nos in tempore", "hostis a telo perfidi.", "", "Sit, Christe, rex piissime,", "tibi Patrique gloria", "cum Spiritu Paraclito,", "in sempiterna saecula. Amen."], "es": ["Creador bondadoso de los astros,", "luz eterna de los creyentes,", "Cristo, redentor de todos,", "escucha las súplicas de los que te imploran.", "", "Tú que, apiadado de que el mundo", "pereciera en la ruina de la muerte,", "salvaste al mundo enfermo,", "dando remedio a los culpables.", "", "Cuando declinaba la tarde del mundo,", "como esposo que sale del tálamo,", "saliste del honestísimo", "seno de tu Madre Virgen.", "", "Ante cuyo fuerte poder", "se doblan todas las rodillas;", "los seres celestes y terrestres", "confiesan someterse a tu mandato.", "", "A ti, Santo, con fe te suplicamos,", "que has de venir como juez del mundo,", "consérvanos a tiempo", "libres del dardo del enemigo pérfido.", "", "Sea, oh Cristo, rey piadosísimo,", "gloria a ti y al Padre", "con el Espíritu Paráclito,", "por los siglos sempiternos. Amén."]}}, {"id": "pange_lingua_gloriosi", "title": "Pange Lingua Gloriosi Corporis Mysterium", "original_language": "la", "lines": {"la": ["Pange, lingua, gloriosi", "Corporis mysterium,", "Sanguinisque pretiosi,", "quem in mundi pretium", "fructus ventris generosi", "Rex effudit gentium.", "", "Nobis datus, nobis natus", "ex intacta Virgine,", "et in mundo conversatus,", "sparso verbi semine,", "sui moras incolatus", "miro clausit ordine.", "", "In supremae nocte cenae", "recumbens cum fratribus,", "observata lege plene", "cibis in legalibus,", "cibum turbae duodenae", "se dat suis manibus.", "", "Verbum caro, panem verum", "verbo carnem efficit:", "fitque sanguis Christi merum,", "et si sensus deficit,", "ad firmandum cor sincerum", "sola fides sufficit.", "", "Tantum ergo Sacramentum", "veneremur cernui:", "et antiquum documentum", "novo cedat ritui:", "praestet fides supplementum", "sensuum defectui.", "", "Genitori, Genitoque", "laus et iubilatio,", "salus, honor, virtus quoque", "sit et benedictio:", "procedenti ab utroque", "compar sit laudatio. Amen."], "es": ["Canta, lengua, el misterio", "del glorioso Cuerpo,", "y de la preciosa Sangre,", "que como precio del mundo,", "fruto de un vientre generoso,", "derramó el Rey de las naciones.", "", "Dado a nosotros, nacido para nosotros", "de una Virgen intacta,", "y habiendo vivido en el mundo", "sembrando la semilla de la Palabra,", "concluyó el tiempo de su estancia", "con un orden admirable.", "", "En la noche de la última cena,", "reclinado con sus hermanos,", "habiendo cumplido plenamente la ley", "en cuanto a los alimentos rituales,", "se da como alimento a los doce", "con sus propias manos.", "", "El Verbo hecho carne, con su palabra", "convierte en carne el pan verdadero:", "y el vino se hace sangre de Cristo,", "y si los sentidos no alcanzan,", "para afirmar el corazón sincero", "basta sólo la fe.", "", "Un Sacramento tan grande", "veneremos, pues, inclinados:", "y ceda el antiguo precepto", "al nuevo rito:", "que la fe supla", "lo que falta a los sentidos.", "", "Al Engendrador y al Engendrado", "sea la alabanza y el júbilo,", "la salud, el honor y también el poder", "y la bendición:", "y al que procede de ambos", "sea dada igual alabanza. Amén."]}}, {"id": "deus_tuorum_militum", "title": "Deus Tuorum Militum", "original_language": "la", "lines": {"la": ["Deus tuorum militum", "sors, et corona, praemium,", "laudes canentes Martyris", "absolve nexu criminis.", "", "Hic nempe mundi gaudia", "et blandimenta noxia", "caduca rite deputans,", "pervenit ad caelestia.", "", "Poenas cucurrit fortiter", "et sustulit viriliter,", "fundensque pro te sanguinem,", "aeterna dona possidet.", "", "Ob hoc precatu supplici", "te poscimus, piissime;", "in hoc triumpho Martyris", "dimitte noxam servulis.", "", "Laus et perennis gloria", "Deo Patri et Filio,", "Sancto simul Paraclito,", "in sempiterna saecula. Amen."], "es": ["Dios, suerte, corona y premio", "de tus soldados,", "a nosotros, que cantamos las alabanzas del Mártir,", "líbranos del lazo del pecado.", "", "Éste, en verdad, teniendo por caducos", "los gozos del mundo", "y sus dañinas seducciones,", "llegó a los bienes celestiales.", "", "Corrió fuertemente hacia las penas", "y las soportó con valentía,", "y derramando su sangre por ti,", "posee ahora los dones eternos.", "", "Por esto, con súplica humilde", "te lo pedimos, piadosísimo;", "en este triunfo del Mártir,", "perdona la culpa a tus siervos.", "", "Alabanza y gloria perpetua", "a Dios Padre y al Hijo,", "juntamente al Espíritu Santo Paráclito,", "por los siglos sempiternos. Amén."]}}, {"id": "o_lux_beata_trinitas", "title": "O Lux Beata Trinitas", "original_language": "la", "lines": {"la": ["O lux beata Trinitas,", "et principalis Unitas,", "iam sol recedit igneus:", "infunde lumen cordibus.", "", "Te mane laudum carmine,", "te deprecemur vespere:", "te nostra supplex gloria", "per cuncta laudet saecula.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Oh luz bienaventurada, Trinidad,", "y Unidad primera,", "ya el sol ígneo se retira:", "infunde tu luz en los corazones.", "", "A ti te alabemos por la mañana con cánticos,", "a ti te supliquemos al atardecer:", "que nuestra súplica te glorifique", "por todos los siglos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y para siempre. Amén."]}}, {"id": "exsultet_caelum_laudibus", "title": "Exsultet Caelum Laudibus", "original_language": "la", "lines": {"la": ["Exsultet caelum laudibus,", "resultet terra gaudiis,", "Apostolorum gloriam", "sacra canunt sollemnia.", "", "Vos, saecli iusti iudices", "et vera mundi lumina,", "votis precamur cordium:", "audite preces supplicum.", "", "Qui caelum verbo clauditis", "serasque eius solvitis,", "nos a peccatis omnibus", "solvite iussu, quaesumus.", "", "Quorum praecepto subditur", "salus et languor omnium,", "sanate mentes languidas,", "augete nos virtutibus.", "", "Ut, cum iudex advenerit", "Christus in fine saeculi,", "nos sempiterni gaudii", "faciat esse compotes.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "nunc et per omne saeculum. Amen."], "es": ["Exulte el cielo con alabanzas,", "resuene la tierra con gozos,", "la sagrada solemnidad canta", "la gloria de los Apóstoles.", "", "A vosotros, justos jueces del mundo", "y verdaderas luces del orbe,", "os rogamos con los votos de nuestros corazones:", "escuchad las preces de los suplicantes.", "", "Vosotros que con la palabra cerráis el cielo", "y desatáis sus cerrojos,", "libradnos de todos los pecados,", "os lo rogamos, por vuestro mandato.", "", "A cuyo mandato está sometida", "la salud y la enfermedad de todos,", "sanad nuestras mentes enfermas,", "aumentadnos en virtudes.", "", "Para que, cuando venga como juez", "Cristo al final de los siglos,", "nos haga partícipes", "del gozo sempiterno.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por todos los siglos. Amén."]}}, {"id": "iste_confessor", "title": "Iste Confessor", "original_language": "la", "lines": {"la": ["Iste confessor Domini, colentes", "quem pie laudant populi per orbem,", "hac die laetus meruit supremos", "laudis honores.", "", "Qui pius, prudens, humilis, pudicus,", "sobriam duxit sine labe vitam,", "donec humanos animavit aurae", "spiritus artus.", "", "Cuius ob praestans meritum, frequenter,", "aegra quae passim iacuere membra,", "viribus morbi domitis, saluti", "restituuntur.", "", "Noster hinc illi chorus obsequentem", "concinit laudem celebresque palmas,", "ut piis eius meritis iuvemur", "omne per aevum.", "", "Sit salus illi, decus atque virtus,", "qui, supra caeli residens cacumen,", "totius mundi seriem gubernat,", "trinus et unus. Amen."], "es": ["Este confesor del Señor, a quien", "los pueblos veneran piadosamente por todo el orbe,", "mereció alegre en este día los sumos", "honores de alabanza.", "", "El cual, piadoso, prudente, humilde y casto,", "llevó una vida sobria sin mancha,", "mientras el aliento de vida animó", "sus miembros humanos.", "", "Por cuyo excelente mérito, con frecuencia,", "los miembros enfermos que yacían por doquier,", "vencidas las fuerzas de la enfermedad, a la salud", "son restituidos.", "", "Por esto, nuestro coro le canta", "una alabanza obsequiosa y célebres palmas,", "para que por sus piadosos méritos seamos ayudados", "por toda la eternidad.", "", "Sea para él la salud, el honor y el poder,", "que, sentado sobre la cumbre del cielo,", "gobierna el curso de todo el mundo,", "trino y uno. Amén."]}}, {"id": "lucis_creator_optime", "title": "Lucis Creator Optime", "original_language": "la", "lines": {"la": ["Lucis Creator optime,", "lucem dierum proferens,", "primordiis lucis novae", "mundi parans originem;", "", "Qui mane iunctum vesperi", "diem vocari praecipis:", "taetrum chaos illabitur,", "audi preces cum fletibus.", "", "Ne mens gravata crimine", "vitae sit exsul munere,", "dum nil perenne cogitat", "seseque culpis illigat.", "", "Caeleste pulset ostium,", "vitale tollat praemium;", "vitemus omne noxium,", "purgemus omne pessimum.", "", "Praesta, Pater piissime,", "Patrique compar Unice,", "cum Spiritu Paraclito", "regnans per omne saeculum. Amen."], "es": ["Óptimo Creador de la luz,", "que produces la luz de los días,", "y en los primeros albores de la nueva luz", "preparaste el origen del mundo;", "", "Tú que mandas que se llame día", "a la mañana unida con la tarde:", "el horrible caos se desliza sobre nosotros,", "escucha nuestras preces con llanto.", "", "Que nuestra mente, cargada de pecado,", "no quede excluida del don de la vida,", "mientras no piensa en nada eterno", "y se enreda a sí misma en culpas.", "", "Que llame a la puerta celestial,", "que alcance el premio de la vida;", "evitemos todo lo dañino,", "purguemos todo lo pésimo.", "", "Concédelo, Padre piadosísimo,", "y también tú, Unigénito igual al Padre,", "que reinas con el Espíritu Paráclito", "por todos los siglos. Amén."]}}], "lauds": [{"id": "iste_confessor", "title": "Iste Confessor", "original_language": "la", "lines": {"la": ["Iste confessor Domini, colentes", "quem pie laudant populi per orbem,", "hac die laetus meruit supremos", "laudis honores.", "", "Qui pius, prudens, humilis, pudicus,", "sobriam duxit sine labe vitam,", "donec humanos animavit aurae", "spiritus artus.", "", "Cuius ob praestans meritum, frequenter,", "aegra quae passim iacuere membra,", "viribus morbi domitis, saluti", "restituuntur.", "", "Noster hinc illi chorus obsequentem", "concinit laudem celebresque palmas,", "ut piis eius meritis iuvemur", "omne per aevum.", "", "Sit salus illi, decus atque virtus,", "qui, supra caeli residens cacumen,", "totius mundi seriem gubernat,", "trinus et unus. Amen."], "es": ["Este confesor del Señor, a quien", "los pueblos veneran piadosamente por todo el orbe,", "mereció alegre en este día los sumos", "honores de alabanza.", "", "El cual, piadoso, prudente, humilde y casto,", "llevó una vida sobria sin mancha,", "mientras el aliento de vida animó", "sus miembros humanos.", "", "Por cuyo excelente mérito, con frecuencia,", "los miembros enfermos que yacían por doquier,", "vencidas las fuerzas de la enfermedad, a la salud", "son restituidos.", "", "Por esto, nuestro coro le canta", "una alabanza obsequiosa y célebres palmas,", "para que por sus piadosos méritos seamos ayudados", "por toda la eternidad.", "", "Sea para él la salud, el honor y el poder,", "que, sentado sobre la cumbre del cielo,", "gobierna el curso de todo el mundo,", "trino y uno. Amén."]}}, {"id": "ut_queant_laxis", "title": "Ut Queant Laxis", "original_language": "la", "lines": {"la": ["Ut queant laxis", "resonare fibris", "mira gestorum", "famuli tuorum,", "solve polluti", "labii reatum,", "Sancte Ioannes.", "", "Nuntius celso veniens Olympo,", "te patri magnum fore nasciturum,", "nomen, et vitae seriem gerendae", "ordine promit.", "", "Ille promissi dubius superni,", "perdidit promptae modulos loquelae:", "sed reformasti genitus peremptae", "organa vocis.", "", "Ventris obstruso positus cubili", "senseras Regem thalamo manentem:", "hinc parens nati meritis uterque", "abdita pandit.", "", "Sit decus Patri, genitaeque Proli,", "et tibi compar utriusque semper", "Spiritus alme, Deus unus, omni", "tempore saecli. Amen."], "es": ["Para que puedan", "resonar con voces desatadas", "las maravillas de las hazañas", "de tus siervos,", "libra de culpa", "nuestros labios manchados,", "san Juan.", "", "Un mensajero, viniendo del alto cielo,", "anuncia a tu padre que ibas a nacer grande,", "y revela en orden tu nombre", "y el curso de la vida que llevarías.", "", "Él, dudando de la promesa celestial,", "perdió el uso pronto de la palabra:", "pero tú, ya nacido, restauraste", "los órganos de su voz perdida.", "", "Colocado en el cerrado lecho del vientre,", "sentiste al Rey que permanecía en su tálamo:", "de ahí que ambos padres, por los méritos del hijo,", "revelan lo oculto.", "", "Sea la gloria al Padre, y al Hijo engendrado,", "y a ti, igual a ambos siempre,", "Espíritu bondadoso, Dios uno, por todo", "el tiempo del siglo. Amén."]}}, {"id": "veni_creator_spiritus", "title": "Veni Creator Spiritus", "original_language": "la", "lines": {"la": ["Veni, Creator Spiritus,", "mentes tuorum visita,", "imple superna gratia", "quae tu creasti pectora.", "", "Qui diceris Paraclitus,", "altissimi donum Dei,", "fons vivus, ignis, caritas,", "et spiritalis unctio.", "", "Tu septiformis munere,", "digitus paternae dexterae,", "tu rite promissum Patris,", "sermone ditans guttura.", "", "Accende lumen sensibus,", "infunde amorem cordibus,", "infirma nostri corporis", "virtute firmans perpeti.", "", "Hostem repellas longius,", "pacemque dones protinus;", "ductore sic te praevio", "vitemus omne noxium.", "", "Per te sciamus da Patrem,", "noscamus atque Filium;", "teque utriusque Spiritum", "credamus omni tempore.", "", "Deo Patri sit gloria,", "et Filio, qui a mortuis", "surrexit, ac Paraclito,", "in saeculorum saecula. Amen."], "es": ["Ven, Espíritu Creador,", "visita las mentes de los tuyos,", "llena de gracia celestial", "los pechos que Tú creaste.", "", "Tú, que eres llamado Paráclito,", "don del Dios altísimo,", "fuente viva, fuego, caridad,", "y unción espiritual.", "", "Tú, séptuple en tus dones,", "dedo de la diestra del Padre,", "tú, la promesa fielmente hecha por el Padre,", "que enriqueces las gargantas con la palabra.", "", "Enciende la luz en nuestros sentidos,", "infunde el amor en nuestros corazones,", "y las debilidades de nuestro cuerpo", "fortalécelas con virtud perpetua.", "", "Rechaza lejos al enemigo,", "y danos pronto la paz;", "así, contigo como guía,", "evitemos todo mal.", "", "Concédenos conocer por ti al Padre,", "y también conocer al Hijo;", "y a ti, Espíritu de ambos,", "creamos en todo tiempo.", "", "Gloria sea a Dios Padre,", "y al Hijo, que de entre los muertos", "resucitó, y al Paráclito,", "por los siglos de los siglos. Amén."]}}, {"id": "aeterne_rerum_conditor", "title": "Aeterne Rerum Conditor", "original_language": "la", "lines": {"la": ["Aeterne rerum Conditor,", "noctem diemque qui regis,", "et temporum das tempora,", "ut alleves fastidium;", "", "Praeco diei iam sonat,", "noctis profundae excubitor,", "nocturna lux viantibus", "a nocte noctem segregans.", "", "Hoc excitatus Lucifer", "solvit polum caligine;", "hoc omnis erronum cohors", "vias nocendi deserit.", "", "Iesu, labentes respice,", "et nos videndo corrige;", "si respicis, lapsus cadunt,", "fletuque culpa solvitur.", "", "Tu, lux, refulge sensibus,", "somnumque mentis discute;", "te nostra vox primum sonet,", "et vota solvamus tibi.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "nunc et per omne saeculum. Amen."], "es": ["Eterno Creador de todas las cosas,", "que riges la noche y el día,", "y das los tiempos a los tiempos,", "para aliviar nuestro hastío;", "", "Ya suena el heraldo del día,", "centinela de la profunda noche,", "luz nocturna para los caminantes,", "que separa la noche de la noche.", "", "Al oírlo, el Lucero", "libra al cielo de su oscuridad;", "al oírlo, toda hueste de malhechores", "abandona sus caminos de hacer daño.", "", "Jesús, mira a los que caen,", "y corrígenos mirándonos;", "si tú miras, las caídas cesan,", "y la culpa se disuelve con el llanto.", "", "Tú, luz, resplandece en nuestros sentidos,", "y disipa el sueño de la mente;", "que nuestra voz te cante primero a ti,", "y cumplamos para ti nuestros votos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por todos los siglos. Amén."]}}, {"id": "ecce_iam_noctis", "title": "Ecce Jam Noctis", "original_language": "la", "lines": {"la": ["Ecce iam noctis tenuatur umbra,", "lucis aurora rutilans coruscat;", "nisibus totis rogitemus omnes", "Cunctipotentem,", "", "Ut Deus, nostri miseratus, omnem", "pellat languorem, tribuat salutem,", "donet et nobis pietate patris", "regna polorum.", "", "Praestet hoc nobis Deitas beata", "Patris ac Nati, pariterque Sancti", "Spiritus, cuius resonat per omnem", "gloria mundum. Amen."], "es": ["He aquí que ya se adelgaza la sombra de la noche,", "y brilla resplandeciente la aurora de la luz;", "roguemos todos con todo empeño", "al Todopoderoso,", "", "Para que Dios, apiadado de nosotros,", "aleje toda enfermedad y conceda la salud,", "y nos dé, con piedad de padre,", "los reinos celestiales.", "", "Concédanos esto la bienaventurada Deidad", "del Padre y del Hijo, y también del Santo", "Espíritu, cuya gloria resuena", "por todo el mundo. Amén."]}}], "compline": [{"id": "te_lucis_ante_terminum", "title": "Te Lucis Ante Terminum", "original_language": "la", "lines": {"la": ["Te lucis ante terminum,", "rerum creator, poscimus,", "ut pro tua clementia", "sis praesul et custodia.", "", "Procul recedant somnia", "et noctium phantasmata;", "hostemque nostrum comprime,", "ne polluantur corpora.", "", "Praesta, Pater omnipotens,", "per Iesum Christum Dominum,", "qui tecum in perpetuum", "regnat cum Sancto Spiritu. Amen."], "es": ["Antes de que acabe la luz,", "te pedimos, Creador de todas las cosas,", "que por tu clemencia", "seas nuestro guardián y custodia.", "", "Aléjense lejos los sueños", "y los fantasmas de la noche;", "reprime a nuestro enemigo,", "para que nuestros cuerpos no se manchen.", "", "Concédenos esto, Padre omnipotente,", "por Jesucristo el Señor,", "que contigo por siempre", "reina con el Espíritu Santo. Amén."]}}, {"id": "christe_qui_lux_es_et_dies", "title": "Christe, Qui Lux Es Et Dies", "original_language": "la", "lines": {"la": ["Christe, qui lux es et dies,", "noctis tenebras detegis,", "lucisque lumen crederis,", "lumen beatum praedicans.", "", "Precamur, sancte Domine,", "defende nos in hac nocte,", "sit nobis in te requies,", "quietam noctem tribue.", "", "Ne gravis somnus irruat,", "nec hostis nos surripiat,", "nec caro illi consentiens,", "nos tibi reos statuat.", "", "Oculi somnum capiant,", "cor semper ad te vigilet,", "dextera tua protegat", "famulos qui te diligunt.", "", "Defensor noster, aspice,", "insidiantes reprime,", "guberna tuos famulos,", "quos sanguine mercatus es.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Cristo, que eres luz y día,", "que descubres las tinieblas de la noche,", "y eres proclamado la luz de la luz,", "anunciando la luz bienaventurada.", "", "Te suplicamos, santo Señor,", "defiéndenos en esta noche,", "sea en ti nuestro descanso,", "concédenos una noche tranquila.", "", "Que no nos asalte un sueño pesado,", "ni el enemigo nos sorprenda,", "ni la carne, consintiendo con él,", "nos declare culpables ante ti.", "", "Que los ojos tomen el sueño,", "pero el corazón vele siempre hacia ti,", "que tu diestra proteja", "a los siervos que te aman.", "", "Defensor nuestro, mira,", "reprime a los que nos acechan,", "gobierna a tus siervos,", "a quienes compraste con tu sangre.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y por siempre. Amén."]}}, {"id": "o_lux_beata_trinitas", "title": "O Lux Beata Trinitas", "original_language": "la", "lines": {"la": ["O lux beata Trinitas,", "et principalis Unitas,", "iam sol recedit igneus:", "infunde lumen cordibus.", "", "Te mane laudum carmine,", "te deprecemur vespere:", "te nostra supplex gloria", "per cuncta laudet saecula.", "", "Deo Patri sit gloria,", "eiusque soli Filio,", "cum Spiritu Paraclito,", "et nunc et in perpetuum. Amen."], "es": ["Oh luz bienaventurada, Trinidad,", "y Unidad primera,", "ya el sol ígneo se retira:", "infunde tu luz en los corazones.", "", "A ti te alabemos por la mañana con cánticos,", "a ti te supliquemos al atardecer:", "que nuestra súplica te glorifique", "por todos los siglos.", "", "Gloria sea a Dios Padre,", "y a su único Hijo,", "con el Espíritu Paráclito,", "ahora y para siempre. Amén."]}}]}, "dates": {"2026-08-17": {"date_human": {"en": "Monday, August 17, 2026", "es": "Lunes, 17 de agosto de 2026", "la": "Feria II, die 17 Augusti, anno 2026"}, "day_description": {"en": "Monday in the 20<sup>th</sup> Week in Ordinary Time (Psalter week 4)", "es": "Lunes de la 20.<sup>a</sup> semana del Tiempo Ordinario (semana 4 del salterio)", "la": "Feria II infra hebdomadam XX per annum (hebdomada psalterii IV)"}, "hours": {"lauds": [{"kind": "static", "label": "deus", "content": {"la": "V. Deus, in adiutorium meum intende.\nR. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in saecula saeculorum. Amen. Alleluia.", "es": "V. Dios mío, ven en mi auxilio.\nR. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "lauds"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Cantabo et psalmum dicam Domino.", "es": "Cantaré y entonaré un salmo al Señor."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 89", "content": {"la": [["1", "Oratio Moysi, hominis Dei. Domine, refugium factus es nobis a generatione in generationem."], ["2", "Priusquam montes fierent, aut formaretur terra et orbis, a saeculo et usque in saeculum tu es Deus."], ["3", "Ne avertas hominem in humilitatem; et dixisti : Convertimini, filii hominum."], ["4", "Quoniam mille anni ante oculos tuos tamquam dies hesterna quae praeteriit, et custodia in nocte;"], ["5", "quae pro nihilo habentur eorum anni erunt."], ["6", "Mane sicut herba transeat; mane floreat, et transeat; vespere decidat, induret, et arescat."], ["7", "Quia defecimus in ira tua, et in furore tuo turbati sumus."], ["8", "Posuisti iniquitates nostras in conspectu tuo, saeculum nostrum in illuminatione vultus tui."], ["9", "Quoniam omnes dies nostri defecerunt; et in ira tua defecimus. Anni nostri sicut aranea meditabuntur;"], ["10", "dies annorum nostrorum in ipsis septuaginta anni. Si autem in potentatibus octoginta anni, et amplius eorum labor et dolor; quoniam supervenit mansuetudo, et corripiemur."], ["11", "Quis novit potestatem irae tuae,"], ["12", "et prae timore tuo iram tuam dinumerare? Dexteram tuam sic notam fac, et eruditos corde in sapientia."], ["13", "Convertere, Domine; usquequo? et deprecabilis esto super servos tuos."], ["14", "Repleti sumus mane misericordia tua; et exsultavimus, et delectati sumus omnibus diebus nostris."], ["15", "Laetati sumus pro diebus quibus nos humiliasti, annis quibus vidimus mala."], ["16", "Respice in servos tuos et in opera tua, et dirige filios eorum."], ["17", "Et sit splendor Domini Dei nostri super nos; et opera manuum nostrarum dirige super nos, et opus manuum nostrarum dirige."]], "es": [["1", "Señor, en todas épocas has sido tú nuestro amparo."], ["2", "Tú, ¡oh Dios!, eres antes que fuesen hechos los montes, o se formara la tierra y el mundo universo; eres desde siempre y por toda la eternidad."], ["3", "No reduzcas el hombre al abatimiento, pues dijiste: Convertíos, ¡oh hijos de los hombres!"], ["4", "Porque mil años son ante tus ojos como el día de ayer que ya pasó, y como una de las vigilias de la noche."], ["5", "Una nada son todos los años que vive."], ["6", "Dura un día como el heno; florece por la mañana, y se pasa; por la tarde inclina la cabeza, se deshoja, y se seca."], ["7", "Al ardor de tu ira hemos desfallecido, y a la fuerza de tu furor quedamos consumidos."], ["8", "Has colocado nuestras maldades delante de tus ojos, y nuestra conducta al resplandor de tu semblante."], ["9", "Por eso todos nuestros días se han desvanecido, y nosotros venimos a fallecer por tu enojo. Como una tela de araña serán considerados nuestros años."], ["10", "Setenta años son los días de nuestra vida; cuando más, ochenta años en los muy robustos; lo que pasa de aquí, achaques y dolencias. Según esto, presto seremos arrebatados, pues va llegando ya la debilidad de la vejez."], ["11", "Mas ¿quién podrá conocer la grandeza de tu ira, y comprender cuán terrible es tu indignación?"], ["12", "Danos, pues, a conocer el poder de tu diestra, y concédenos un corazón instruido en la sabiduría."], ["13", "Vuélvete hacia nosotros, Señor. ¿Hasta cuándo te mostrarás airado? Sé tú compasivo para con tus siervos."], ["14", "Bien presto seremos colmados de tu misericordia; y nos regocijaremos y recrearemos todos los días de nuestra vida."], ["15", "Nos alegraremos por los días que tú nos humillaste, por los años que sufrimos miserias."], ["16", "Vuelve los ojos hacia tus siervos, a estas obras tuyas, y dirige tú a sus hijos."], ["17", "Y resplandezca sobre nosotros la luz del Señor Dios nuestro, y endereza en nosotros las obras de nuestras manos, y da éxito a nuestras empresas."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Cantabo et psalmum dicam Domino.", "es": "Cantaré y entonaré un salmo al Señor."}}, {"kind": "ant", "label": "antiphon", "content": {"la": null, "es": null}}, {"kind": "psalm", "label": "canticle", "ref": "Isa 42:10-16", "content": {"la": [["10", "Cantate Domino canticum novum, laus ejus ab extremis terrae, qui descenditis in mare, et plenitudo ejus; insulae, et habitatores earum."], ["11", "Sublevetur desertum et civitates ejus. In domibus habitabit Cedar : laudate, habitatores petrae, de vertice montium clamabunt."], ["12", "Ponent Domino gloriam, et laudem ejus in insulis nuntiabunt."], ["13", "Dominus sicut fortis egredietur, sicut vir praeliator suscitabit zelum; vociferabitur, et clamabit : super inimicos suos confortabitur."], ["14", "Tacui semper, silui, patiens fui; sicut parturiens loquar; dissipabo, et absorbebo simul."], ["15", "Desertos faciam montes et colles, et omne gramen eorum exsiccabo; et ponam flumina in insulas, et stagna arefaciam."], ["16", "Et ducam caecos in viam quam nesciunt, et in semitis quas ignoraverunt ambulare eos faciam; ponam tenebras coram eis in lucem, et prava in recta; haec verba feci eis, et non dereliqui eos."]], "es": [["10", "Cantad al Señor un nuevo cántico , publicad"], ["12", "Ellos darán gloria al Señor; y publicarán en las islas , ó naciones remotas , sus alabanzas."], ["13", "Porque el Señor saldrá fuera como un invenci- ble campeón ; como un fuerte guerrero excitará su zelo : dará voces y clamará : prevalecerá contra sus enemigos."], ["14", "Hasta ahora , dirá él , estuve siempre callado, guardé silencio , fui sufrido : mas ya como voces de muger que está de parto ^, así serán las mías : deso- laré y devoraré de un golpe á todos mis enemigos."], ["15", "Yo arrasaré los montes y collados frondosos ^, y agostaré todas sus yerbas , y convertiré en islas los rios , y secaré los estanques."], ["16", "Y guiaré á los ciegos por un camino que no saben , y los haré andar por sendas que no conocen :"]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": null, "es": null}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Te decet hymnus, Deus, in Sion.", "es": "A ti conviene el himno, oh Dios, en Sion."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 134:1-12", "content": {"la": [["1", "Alleluja. Laudate nomen Dominum; laudate, servi, Dominum :"], ["2", "qui statis in domo Domini, in atriis domus Dei nostri."], ["3", "Laudate Dominum, quia bonus Dominus; psallite nomini ejus, quoniam suave."], ["4", "Quoniam Jacob elegit sibi Dominus, Israel in possessionem sibi."], ["5", "Quia ego cognovi quod magnus est Dominus, et Deus noster prae omnibus diis."], ["6", "Omnia quaecumque voluit Dominus fecit, in caelo, in terra, in mari et in omnibus abyssis."], ["7", "Educens nubes ab extremo terrae, fulgura in pluviam fecit; qui producit ventos de thesauris suis."], ["8", "Qui percussit primogenita Aegypti, ab homine usque ad pecus."], ["9", "Et misit signa et prodigia in medio tui, Aegypte, in Pharaonem, et in omnes servos ejus."], ["10", "Qui percussit gentes multas, et occidit reges fortes :"], ["11", "Sehon, regem Amorrhaeorum, et Og, regem Basan, et omnia regna Chanaan;"], ["12", "et dedit terram eorum haereditatem, haereditatem Israel populo suo."]], "es": [["1", "Alabad el nombre del Señor; tributadle alabanzas vosotros, siervos suyos"], ["2", "que asistís en la casa del Señor, en los atrios del templo de nuestro Dios."], ["3", "Alabad al Señor, porque el Señor es infinitamente bueno; canta himnos a su excelso Nombre, que es amable."], ["4", "Por cuanto el Señor ha escogido para sí a Jacob ; a Israel, para propiedad suya."], ["5", "Porque tengo bien conocido que el Señor es grande, y que nuestro Dios es sobre todos los dioses."], ["6", "Todas cuantas cosas quiso, ha hecho el Señor; así en el cielo como en la tierra, en el mar y en todos los abismos."], ["7", "El hace venir las nubes de la extremidad de la tierra, y se convierte en lluvias los relámpagos. El es el que hace salir los vientos de sus depósitos;"], ["8", "el que hirió de muerte a los primogénitos de Egipto, sin perdonar a hombre ni bestia,"], ["9", "e hizo señales y prodigios en medio de ti, oh Egipto, contra el faraón y todos sus vasallos."], ["10", "El que destrozó a muchas naciones, y quitó la vida a reyes poderosos,"], ["11", "a Sehón, rey de los amorreos, y a Og, rey de Basán; y destruyó a todos los reinos de los cananeos."], ["12", "Y dio la tierra de éstos en herencia, en herencia a Israel pueblo suyo."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Te decet hymnus, Deus, in Sion.", "es": "A ti conviene el himno, oh Dios, en Sion."}}, {"kind": "psalm", "label": "reading", "ref": "jdt 8:21-23", "content": {"la": [["21", "Et nunc fratres, quoniam vos estis presbyteri in populo Dei, et ex vobis pendet anima illorum, ad eloquium vestrum corda eorum erigite, ut memores sint, quia tentati sunt patres nostri ut probarentur, si vere colerent Deum suum."], ["22", "Memores esse debent, quomodo pater noster Abraham tentatus est, et per multas tribulationes probatus, Dei amicus effectus est."], ["23", "Sic Isaac, sic Jacob, sic Moyses, et omnes qui placuerunt Deo, per multas tribulationes transierunt fideles."]], "es": [["21", "Ahora pues, hermanos jnios^ ya que voso- tros sois los Ancianos ó mayores en el pueblo de"], ["22", "Deben acordarse cómo fue tentado nuestro padre Abraham, y cómo después de probado con muchas tribulaciones , llegó á ser el amigo de Dios."], ["23", "Así Isaac, asi Jacob, así Moysés y todos los que agradaron á Dios, pasaron por muchas tribu- laciones, manteniéndose siempre fieles."]]}}, {"kind": "lines", "label": "responsory", "content": {"la": null, "es": ["$℣. $Aclamad, justos, al Señor, que merece la alabanza de los buenos.", "$℟. $Aclamad, justos, al Señor, que merece la alabanza de los buenos.", "$℣. $Cantadle un cántico nuevo.", "$℟. $Que merece la alabanza de los buenos.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Aclamad, justos, al Señor, que merece la alabanza de los buenos."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "De manu omnium qui oderunt nos, libera nos, Domine.", "es": "De la mano de todos los que nos odian, líbranos, Señor."}}, {"kind": "psalm", "label": "gospel_canticle_benedictus", "ref": "Luke 1:68-79", "content": {"la": [["68", "Benedictus Dominus Deus Israel, quia visitavit, et fecit redemptionem plebis suae :"], ["69", "et erexit cornu salutis nobis in domo David pueri sui,"], ["70", "sicut locutum est per os sanctorum, qui a saeculo sunt, prophetarum ejus :"], ["71", "salutem ex inimicis nostris, et de manu omnium qui oderunt nos :"], ["72", "ad faciendam misericordiam cum patribus nostris : et memorari testamenti sui sancti :"], ["73", "jusjurandum, quod juravit ad Abraham patrem nostrum, daturum se nobis"], ["74", "ut sine timore, de manu inimicorum nostrorum liberati, serviamus illi"], ["75", "in sanctitate et justitia coram ipso, omnibus diebus nostris."], ["76", "Et tu puer, propheta Altissimi vocaberis : praeibis enim ante faciem Domini parare vias ejus,"], ["77", "ad dandam scientiam salutis plebi ejus in remissionem peccatorum eorum"], ["78", "per viscera misericordiae Dei nostri, in quibus visitavit nos, oriens ex alto :"], ["79", "illuminare his qui in tenebris et in umbra mortis sedent : ad dirigendos pedes nostros in viam pacis."]], "es": [["68", "Bendito sea el Señor Dios de Israel , porque ha \\isitado, y redimid® á su pueblo ; ^"], ["69", "y nos ha suscitado un poderoso Salvador en la casa de David su siervo :"], ["70", "según lo tenia anunciado por boca de sus santos Profetas , que han florecido en todos los siglos pa- sados ;"], ["71", "para librarnos de nuestros enemigos, y de las manos de todos aquellos que nos aborrecen :"], ["72", "ejerciendo su misericordia con nuestros padres, y teniendo presente su alianza santa ' ,"], ["74", "de que, libertados de las manos de nuestros ene- migos , le sirvamos sin temor ,"], ["75", "con verdadera santidad y justicia , ante su aca- tamiento, todos los dias de nuestra vida."], ["76", "Y tú ¡oh niño ! tú serás llamado el Profeta del Altísimo ; porque irás delante del Señor á preparar sus caminos,"], ["77", "enseñando la ciencia de la salvación á su pueblo, para que obtenga el perdón de sus pecados ,"], ["78", "por las entrañas misericordiosas de nuestro Dios , que ha hecho que ese Sol naciente ha venido á visitarnos de lo alto del cielo ' ,"], ["79", "para alumbrar á los que yacen en las tinieblas y en la sombra de la muerte ; para enderezar nuestros pasos por el camino de la paz ^."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "De manu omnium qui oderunt nos, libera nos, Domine.", "es": "De la mano de todos los que nos odian, líbranos, Señor."}}, {"kind": "lines", "label": "intercessions", "content": {"la": null, "es": ["Ya que Cristo escucha y salva a cuantos en él se refugian, acudamos a él, diciendo:", "- Te damos gracias, Señor, por el gran amor con que nos amaste; _continúa mostrándote con nosotros rico en misericordia._ _Te alabamos, Señor, esperamos en ti._", "- Tú que, con el Padre, sigues actuando siempre en el mundo, _renueva todas las cosas con la fuerza de tu Espíritu._ _Te alabamos, Señor, esperamos en ti._", "- Abre nuestros ojos y los de nuestros hermanos, _para que podamos contemplar hoy tus maravillas._ _Te alabamos, Señor, esperamos en ti._", "- Ya que nos llamas hoy a tu servicio, _haz que seamos buenos administradores de tu múltiple gracia en favor de nuestros hermanos._ _Te alabamos, Señor, esperamos en ti._"]}}, {"kind": "lines", "label": "our_father", "content": {"la": ["Pater noster, qui es in caelis:", "sanctificetur nomen tuum;", "adveniat regnum tuum;", "fiat voluntas tua, sicut in caelo, et in terra.", "Panem nostrum cotidianum da nobis hodie;", "et dimitte nobis debita nostra,", "sicut et nos dimittimus debitoribus nostris;", "et ne nos inducas in tentationem;", "sed libera nos a malo.", "Amen."], "es": ["Padre nuestro, que estás en el cielo,", "santificado sea tu Nombre;", "venga a nosotros tu reino;", "hágase tu voluntad en la tierra como en el cielo.", "Danos hoy nuestro pan de cada día;", "perdona nuestras ofensas,", "como también nosotros perdonamos a los que nos ofenden;", "no nos dejes caer en la tentación,", "y líbranos del mal.", "Amén."]}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": "Deus, qui diligentibus te bona invisibilia praeparasti, infunde cordibus nostris tui amoris affectum, ut, te in omnibus et super omnia diligentes, promissiones tuas, quae omne desiderium superant, consequamur.", "es": "Señor Dios, que encomendaste al hombre la guarda y el cultivo de la tierra, y creaste la luz del sol en su servicio, concédenos hoy que, con tu luz, trabajemos sin desfallecer para tu gloria y para el bien de nuestro prójimo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos."}}, {"kind": "static", "label": "dismissal", "content": {"la": "V. Benedicamus Domino.\nR. Deo gratias.", "es": "V. Bendigamos al Señor.\nR. Demos gracias a Dios."}}], "vespers": [{"kind": "static", "label": "deus", "content": {"la": "V. Deus, in adiutorium meum intende.\nR. Domine, ad adiuvandum me festina.\nGloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in saecula saeculorum. Amen. Alleluia.", "es": "V. Dios mío, ven en mi auxilio.\nR. Señor, date prisa en socorrerme.\nGloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén. Aleluya."}}, {"kind": "hymn_choice", "label": "hymn", "hour": "vespers"}, {"kind": "ant", "label": "antiphon", "content": {"la": "Hymnum cantate nobis de canticis Sion.", "es": "Cantadnos un himno de los cánticos de Sion."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 135:1-9", "content": {"la": [["1", "Alleluja. Confitemini Domino, quoniam bonus, quoniam in aeternum misericordia ejus."], ["2", "Confitemini Deo deorum, quoniam in aeternum misericordia ejus."], ["3", "Confitemini Domino dominorum, quoniam in aeternum misericordia ejus."], ["4", "Qui facit mirabilia magna solus, quoniam in aeternum misericordia ejus."], ["5", "Qui fecit caelos in intellectu, quoniam in aeternum misericordia ejus."], ["6", "Qui firmavit terram super aquas, quoniam in aeternum misericordia ejus."], ["7", "Qui fecit luminaria magna, quoniam in aeternum misericordia ejus :"], ["8", "solem in potestatem diei, quoniam in aeternum misericordia ejus;"], ["9", "lunam et stellas in potestatem noctis, quoniam in aeternum misericordia ejus."]], "es": [["2", "Alabad al Señor, porque es infinitamente bueno, porque es eterna su misericordia."], ["3", "Alabad al Dios de los dioses, porque es eterna su misericordia."], ["4", "Alabad al Señor de los señores, porque es eterna su misericordia."], ["5", "Al único que obra grandes maravillas, porque es eterna su misericordia."], ["6", "Al que con su sabiduría creó los cielos, porque es eterna su misericordia."], ["7", "Al que afianzó la tierra sobre las aguas, porque es eterna su misericordia."], ["8", "Al que hizo los grandes luminares, porque es eterna su misericordia."], ["9", "El sol para presidir el día, porque es eterna su misericordia."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Hymnum cantate nobis de canticis Sion.", "es": "Cantadnos un himno de los cánticos de Sion."}}, {"kind": "ant", "label": "antiphon", "content": {"la": "In conspectu angelorum psallam tibi, Deus meus.", "es": "En presencia de los ángeles te cantaré salmos, Dios mío."}}, {"kind": "psalm", "label": "psalm", "ref": "Ps 135:10-26", "content": {"la": [["10", "Qui percussit Aegyptum cum primogenitis eorum, quoniam in aeternum misericordia ejus."], ["11", "Qui eduxit Israel de medio eorum, quoniam in aeternum misericordia ejus,"], ["12", "in manu potenti et brachio excelso, quoniam in aeternum misericordia ejus."], ["13", "Qui divisit mare Rubrum in divisiones, quoniam in aeternum misericordia ejus;"], ["14", "et eduxit Israel per medium ejus, quoniam in aeternum misericordia ejus;"], ["15", "et excussit Pharaonem et virtutem ejus in mari Rubro, quoniam in aeternum misericordia ejus."], ["16", "Qui traduxit populum suum per desertum, quoniam in aeternum misericordia ejus."], ["17", "Qui percussit reges magnos, quoniam in aeternum misericordia ejus;"], ["18", "et occidit reges fortes, quoniam in aeternum misericordia ejus :"], ["19", "Sehon, regem Amorrhaeorum, quoniam in aeternum misericordia ejus;"], ["20", "et Og, regem Basan, quoniam in aeternum misericordia ejus;"], ["21", "et dedit terram eorum haereditatem, quoniam in aeternum misericordia ejus;"], ["22", "haereditatem Israel, servo suo, quoniam in aeternum misericordia ejus."], ["23", "Quia in humilitate nostra memor fuit nostri, quoniam in aeternum misericordia ejus;"], ["24", "et redimit nos ab inimicis nostris, quoniam in aeternum misericordia ejus."], ["25", "Qui dat escam omni carni, quoniam in aeternum misericordia ejus."], ["26", "Confitemini Deo caeli, quoniam in aeternum misericordia ejus."]], "es": [["10", "La luna y las estrellas para presidir la noche, porque es eterna su misericordia."], ["11", "Al que hirió de muerte a Egipto en sus primogénitos, porque es eterna su misericordia."], ["12", "Al que sacó a Israel de Egipto, porque es eterna su misericordia."], ["13", "Ejecutándolo con mano poderosa y brazo levantado, porque es eterna su misericordia."], ["14", "Al que dividió en dos partes el mar Rojo, porque es eterna su misericordia."], ["15", "y condujo a Israel por en medio de sus aguas, porque es eterna su misericordia,"], ["16", "y sumergió al faraón y su ejército en el mar Rojo, porque es eterna su misericordia."], ["17", "Al que guió a su pueblo por el desierto, porque es eterna su misericordia."], ["18", "Al que hirió o derribó a los grandes reyes valerosos, porque es eterna su misericordia."], ["19", "Al que mató a reyes valerosos, porque es eterna su misericordia;"], ["20", "a Sehón, rey de los amorreos, porque es eterna su misericordia;"], ["21", "y a Og, rey de Basán, porque es eterna su misericordia."], ["22", "Y dio la tierra de ellos en herencia, porque es eterna su misericordia;"], ["23", "en herencia a Israel siervo suyo, porque es eterna su misericordia."], ["24", "Al que se acordó de nosotros en nuestro abatimiento, porque es eterna su misericordia;"], ["25", "y nos rescató del poder de nuestros enemigos, porque es eterna su misericordia."], ["26", "Al que da alimento a todos los vivientes, porque es eterna su misericordia."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "In conspectu angelorum psallam tibi, Deus meus.", "es": "En presencia de los ángeles te cantaré salmos, Dios mío."}}, {"kind": "psalm", "label": "canticle", "ref": "Eph 1:3-10", "content": {"la": [["3", "Benedictus Deus et Pater Domini nostri Jesu Christi, qui benedixit nos in omni benedictione spirituali in caelestibus in Christo,"], ["4", "sicut elegit nos in ipso ante mundi constitutionem, ut essemus sancti et immaculati in conspectu ejus in caritate."], ["5", "Qui praedestinavit nos in adoptionem filiorum per Jesum Christum in ipsum : secundum propositum voluntatis suae,"], ["6", "in laudem gloriae gratiae suae, in qua gratificavit nos in dilecto Filio suo."], ["7", "In quo habemus redemptionem per sanguinem ejus, remissionem peccatorum secundum divitias gratiae ejus,"], ["8", "quae superabundavit in nobis in omni sapientia et prudentia :"], ["9", "ut notum faceret nobis sacramentum voluntatis suae, secundum beneplacitum ejus, quod proposuit in eo,"], ["10", "in dispensatione plenitudinis temporum, instaurare omnia in Christo, quae in caelis et quae in terra sunt, in ipso;"]], "es": [["3", "Bendito el Dios y Padre de nuestro Señor Jesu- Christo , que nos ha colmado en Christo de toda suerte de bendiciones espirituales del cielo ,"], ["4", "así como por él mismo nos escogió antes de la creación del mundo , para ser sanios y sin mácula en su presencia , por la caridad ;"], ["5", "habiéndonos predestinado ' al ser de hijos suyos adoptivos por Jesii-Christo á gloria suya, por un puro efecto de su buena voluntad ,"], ["6", "á fin de que se celebre la gloria de su gracia , me- diante la cual nos hizo gratos á sus ojos en su querido Hijo."], ["7", "En quien por su sangre logramos la' redención , y el perdón de los pecados , por las riquezas de su gracia ,"], ["8", "que con abundancia ha derramado sobre noso- tros , colmándonos de toda sabiduría y prudencia :"], ["9", "para hacernos conocer el misterio ó arcano de su voluntad, fundada en su mero beneplácito, por el cual se propuso"], ["10", "el restaurar en Christo, cumplidos los tiempos prescritos , todas las cosas de los cielos , y las de la tierra , reimiéndolas todas por él mismo en un cuer' po ó Iglesia. 1"]]}}, {"kind": "psalm", "label": "reading", "ref": "1thess 3:12-13", "content": {"la": [["12", "Vos autem Dominus multiplicet, et abundare faciat caritatem vestram in invicem, et in omnes, quemadmodum et nos in vobis :"], ["13", "ad confirmanda corda vestra sine querela in sanctitate, ante Deum et Patrem nostrum, in adventu Domini nostri Jesu Christi cum omnibus sanctis ejus. Amen."]], "es": [["12", "Entre tanto el Señor os multiplique , y aumente vuestra caridad recíprocamente , y para con todos , tal cual es la nuestra para con vosotros ;"], ["13", "á fin de fortalecer vuestros corazones en santi- dad y ser irreprensibles delante de Dios y Padre nues- tro , para cuando venga nuestro Señor Jesu-Christo con todos sus santos. Amen,"]]}}, {"kind": "lines", "label": "responsory", "content": {"la": null, "es": ["$℣. $Suba mi oración  hasta ti, Señor.", "$℟. $Suba mi oración  hasta ti, Señor.", "$℣. $Como incienso en tu presencia.", "$℟. $Hasta ti, Señor.", "$℣. $Gloria al Padre, y al Hijo, y al Espíritu Santo.", "$℟. $Suba mi oración  hasta ti, Señor."]}}, {"kind": "ant", "label": "antiphon", "content": {"la": "Adimplebis me laetitia cum vultu tuo, Domine. Respexit Dominus humilitatem meam, et fecit in me magna, qui potens est.", "es": "Me llenarás de gozo con tu rostro, Señor. El Señor miró mi humildad, y el Poderoso hizo en mí grandes cosas."}}, {"kind": "psalm", "label": "gospel_canticle_magnificat", "ref": "Luke 1:46-55", "content": {"la": [["46", "Et ait Maria : Magnificat anima mea Dominum :"], ["47", "et exsultavit spiritus meus in Deo salutari meo."], ["48", "Quia respexit humilitatem ancillae suae : ecce enim ex hoc beatam me dicent omnes generationes,"], ["49", "quia fecit mihi magna qui potens est : et sanctum nomen ejus,"], ["50", "et misericordia ejus a progenie in progenies timentibus eum."], ["51", "Fecit potentiam in brachio suo : dispersit superbos mente cordis sui."], ["52", "Deposuit potentes de sede, et exaltavit humiles."], ["53", "Esurientes implevit bonis : et divites dimisit inanes."], ["54", "Suscepit Israel puerum suum, recordatus misericordiae suae :"], ["55", "sicut locutus est ad patres nostros, Abraham et semini ejus in saecula."]], "es": [["46", "Entonces María dijo : Mi alma glorifica al Se- ñor;"], ["47", "y mi espíritu está trasportado de gozo en el Dios salvador mió."], ["48", "Porque ha puesto los ojos en la bajeza de su es- clava ^ : por tanto ya desde ahora me llamarán bien- aventurada todas las generaciones."], ["49", "Porque ha hecho en mí cosas grandes aquel que es fofZopoderoso , cuyo nombre es santo ;"], ["50", "y cuya misericordia se derrama de generación en generación sobre los que le temen."], ["51", "Hizo alarde del poder de su brazo: deshizo las miras del corazón de los soberbios."], ["52", "Derribó del solio á los poderosos , y ensalzó á los humildes."], ["53", "Colmó de bienes álos hambrientos , y á los ricos los despidió sin nada."], ["54", "Acordándose de su misericordia, acogió á Israel su siervo ;"], ["55", "según la promesa que hizo á nuestros padres, á Abraham y á su descendencia por los siglos délos siglos."]]}}, {"kind": "ant", "label": "31", "quod parasti ante faciem omnium populorum :"], ["32", "lumen ad revelationem gentium, et gloriam plebis tuae Israel."]], "es": [["29", "Ahora , Señor , ahora sí que sacas en paz de este mundo á tu siervo , según tu promesa."], ["30", "Porque ya mis ojos han visto al Salvador que nosbas dado;"], ["31", "al cual tienes destinado para que, expuesto á la vista de todos los pueblos ,"], ["32", "sea luz brillante que ilumine á los gentiles, y la gloria de tu pueblo de Israel."]]}}, {"kind": "ant", "label": "antiphon", "repeated": true, "content": {"la": "Salva nos, Domine, vigilantes, custodi nos dormientes, ut vigilemus cum Christo et requiescamus in pace.", "es": "Sálvanos, Señor, mientras velamos; guárdanos mientras dormimos, para que velemos con Cristo y descansemos en paz."}}, {"kind": "plain", "label": "concluding_prayer", "content": {"la": null, "es": null}}, {"kind": "plain", "label": "dismissal", "content": {"la": null, "es": null}}]}}}, "date_order": ["2026-08-17"], "generated_date": "2026-08-17"}</script>
<script>
const DATA = JSON.parse(document.getElementById('dayData').textContent);
const LANG_NAMES = { la: "Latin / Latina", es: "Español" };
const leftSel = document.getElementById('leftLang');
const rightSel = document.getElementById('rightLang');
const hourSel = document.getElementById('hourSelect');
const tzSel = document.getElementById('tzSelect');
const dateSel = document.getElementById('dateSelect');
const tzNote = document.getElementById('tzNote');

// Which hymn id is currently picked per Hour context. Its language is always
// that hymn's own original_language (see renderHymnChoiceRows) - the dropdown
// only ever chooses WHICH hymn, never a language for it to be sung in.
let hymnChoiceByHour = {};

// DATA.hymn_pools starts as whatever was baked in when this page was
// generated (so double-clicking the file still works with no server). If
// this page is being served over HTTP (see .claude/launch.json's
// "docs-server" config), it re-fetches content/proper_texts/hymns.json live
// on every load - so editing that file and refreshing the browser picks up
// the change with no need to re-run render_day.py. Under file:// this fetch
// is normally blocked by the browser and silently falls back to the baked-in
// copy, which is fine.
function poolsFromRawHymns(raw) {
  const pools = {};
  for (const ctx of ['vespers', 'lauds', 'compline']) {
    pools[ctx] = [];
    for (const [hid, h] of Object.entries(raw)) {
      if (hid === '_note') continue;
      if ((h.applicability || []).includes(ctx)) {
        const lines = {};
        for (const lang of DATA.languages) lines[lang] = (h.lines && h.lines[lang]) || [];
        pools[ctx].push({ id: hid, title: h.title, original_language: h.original_language, lines });
      }
    }
  }
  return pools;
}
fetch('../content/proper_texts/hymns.json')
  .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(raw => { DATA.hymn_pools = poolsFromRawHymns(raw); render(); })
  .catch(() => { /* no server, or fetch blocked under file:// - keep the baked-in pool */ });

// Same idea, but for a whole day's Hours: if dev_server.py is running (see
// .claude/launch.json), /api/day?date=... reruns the actual Python
// construction logic fresh from disk - covering edits to the psalter tables,
// calendar cache, proper_texts, and content/sanctorale/, not just hymns.json.
// Plain `python -m http.server` (or file://) doesn't have that route, so this
// 404s harmlessly and the baked-in snapshot for that date stays in use.
for (const iso of DATA.date_order) {
  fetch('/api/day?date=' + encodeURIComponent(iso))
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(fresh => { DATA.dates[iso] = fresh; render(); })
    .catch(() => { /* dev_server.py not running - keep the baked-in day */ });
}

// This page is a static snapshot: DATA.dates holds a pre-built window of days
// (generated around DATA.generated_date) rather than just one. There's still
// no live backend to build a day outside that window, but picking a timezone
// now actually jumps to the right day within it instead of just warning.
function populateDateOptions() {
  const left = leftSel.value;
  const prev = dateSel.value;
  dateSel.innerHTML = '';
  for (const iso of DATA.date_order) {
    const o = document.createElement('option');
    o.value = iso;
    const dh = DATA.dates[iso].date_human;
    o.textContent = (dh && (dh[left] || dh.en)) || iso;
    dateSel.appendChild(o);
  }
  if (prev && DATA.dates[prev]) dateSel.value = prev;
}

const COMMON_TIMEZONES = [
  'UTC', 'Europe/Rome', 'Europe/Madrid', 'Europe/London', 'Europe/Paris',
  'America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles',
  'America/Mexico_City', 'America/Bogota', 'America/Sao_Paulo', 'America/Argentina/Buenos_Aires',
  'Asia/Manila', 'Asia/Tokyo', 'Asia/Kolkata', 'Australia/Sydney', 'Pacific/Auckland',
];
let tzList = COMMON_TIMEZONES;
try {
  if (typeof Intl.supportedValuesOf === 'function') {
    tzList = Intl.supportedValuesOf('timeZone');
  }
} catch (e) { /* fall back to the curated list above */ }

const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
if (!tzList.includes(browserTz)) tzList = [browserTz, ...tzList];

// Only the region prefix (e.g. "America", "Europe") has an established Latin/
// Spanish name across the whole IANA list - the city/location part after the
// slash is left as-is (see TZ_REGION_NAMES in i18n.py for why).
function populateTimezoneOptions() {
  const left = leftSel.value;
  const regionNames = (DATA.tz_region_names && DATA.tz_region_names[left]) || {};
  const prev = tzSel.value;
  tzSel.innerHTML = '';
  for (const tz of tzList) {
    const o = document.createElement('option');
    o.value = tz;
    const slash = tz.indexOf('/');
    if (slash === -1) {
      o.textContent = tz.replace(/_/g, ' ');
    } else {
      const region = tz.slice(0, slash);
      const rest = tz.slice(slash + 1).replace(/_/g, ' ');
      o.textContent = (regionNames[region] || region) + ' / ' + rest;
    }
    tzSel.appendChild(o);
  }
  tzSel.value = prev && tzList.includes(prev) ? prev : browserTz;
}

function isoDateInTimeZone(tz) {
  // en-CA locale formats as YYYY-MM-DD, convenient for direct comparison with DATA.dates keys
  return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' })
    .format(new Date());
}

// Picks "today" in the given timezone if that date was actually pre-built;
// otherwise falls back to whichever generated date is closest to it, since
// this is still a static page with a fixed, finite window of days baked in.
function closestAvailableDate(isoTarget) {
  if (DATA.dates[isoTarget]) return isoTarget;
  const targetMs = new Date(isoTarget).getTime();
  let best = DATA.date_order[0];
  let bestDiff = Infinity;
  for (const iso of DATA.date_order) {
    const diff = Math.abs(new Date(iso).getTime() - targetMs);
    if (diff < bestDiff) { bestDiff = diff; best = iso; }
  }
  return best;
}

const TZNOTE_TEXT = {
  en: (today, tz, first, last) => `&#9888; Today is <strong>${today}</strong> in ${tz}, which is outside the ` +
    `range of dates generated for this demo (<strong>${first}</strong> to <strong>${last}</strong>). ` +
    `Showing the closest available date instead.`,
  es: (today, tz, first, last) => `&#9888; Hoy es <strong>${today}</strong> en ${tz}, fecha fuera del ` +
    `intervalo generado para esta demo (<strong>${first}</strong> a <strong>${last}</strong>). ` +
    `Se muestra la fecha disponible más cercana.`,
  la: (today, tz, first, last) => `&#9888; Hodie est <strong>${today}</strong> in ${tz}, dies extra ` +
    `intervallum ad hanc demonstrationem generatum (<strong>${first}</strong> usque ad <strong>${last}</strong>). ` +
    `Dies proxima disponibilis ostenditur.`,
};

function updateTzNote() {
  const left = leftSel.value;
  const tz = tzSel.value;
  const todayInTz = isoDateInTimeZone(tz);
  if (DATA.dates[todayInTz]) {
    tzNote.style.display = 'none';
  } else {
    tzNote.style.display = '';
    const first = DATA.date_order[0], last = DATA.date_order[DATA.date_order.length - 1];
    const build = TZNOTE_TEXT[left] || TZNOTE_TEXT.en;
    tzNote.innerHTML = build(todayInTz, tz.replace(/_/g, ' '), first, last);
  }
}

function onTzChange() {
  updateTzNote();
  dateSel.value = closestAvailableDate(isoDateInTimeZone(tzSel.value));
  render();
}
tzSel.addEventListener('change', onTzChange);

for (const code of DATA.languages) {
  for (const sel of [leftSel, rightSel]) {
    const o = document.createElement('option');
    o.value = code; o.textContent = LANG_NAMES[code] || code;
    sel.appendChild(o);
  }
}
leftSel.value = DATA.languages[0];
rightSel.value = DATA.languages[1] || DATA.languages[0];

function populateHourOptions() {
  const left = leftSel.value;
  const prev = hourSel.value;
  const labels = (DATA.hour_labels && DATA.hour_labels[left]) || {};
  const comingSoon = (DATA.chrome_labels[left] || DATA.chrome_labels.en).coming_soon;
  hourSel.innerHTML = '';
  for (const h of DATA.hour_order) {
    const o = document.createElement('option');
    o.value = h;
    o.textContent = labels[h] || h;
    if (!DATA.implemented_hours.includes(h)) {
      o.disabled = true;
      o.textContent += ' ' + comingSoon;
    }
    hourSel.appendChild(o);
  }
  hourSel.value = DATA.hour_order.includes(prev) ? prev : DATA.default_hour;
}

// Everything on the page - not just liturgical content - follows whichever
// language is on the left ("main"): control labels, the Hour names, the Date
// picker, the date heading. The right side is either "the vernacular" (when
// the main language is Latin) or just "a translation" (when it's already a
// vernacular language) - never a second thing to pick a hymn to sing in.
function updateChromeLabels() {
  const left = leftSel.value;
  const cl = DATA.chrome_labels[left] || DATA.chrome_labels.en;
  document.getElementById('tzLabel').textContent = cl.timezone;
  document.getElementById('dateLabel').textContent = cl.date;
  document.getElementById('hourLabel').textContent = cl.hour;
  document.getElementById('leftLabel').textContent = cl.main;
  document.getElementById('rightLabel').textContent = (left === 'la') ? cl.vernacular : cl.translation;
}

function applyChrome() {
  updateChromeLabels();
  populateHourOptions();
  populateDateOptions();
  populateTimezoneOptions();
  updateTzNote();
  render();
}
leftSel.addEventListener('change', applyChrome);

// First run: builds every dropdown (so dateSel actually has options), then
// picks "today" in the browser's own timezone now that there's something to
// select - applyChrome() alone would leave dateSel on its first option.
applyChrome();
dateSel.value = closestAvailableDate(isoDateInTimeZone(browserTz));
render();

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderUnitContent(unit, lang) {
  const val = unit.content ? unit.content[lang] : null;
  if (val === null || val === undefined) return '<em>[not yet sourced]</em>';
  return esc(val).replace(/\n/g, '<br>');
}

// Psalms and canticles are stored as [verseNumber, text] pairs; hymns and the
// Our Father are stored as plain ordered line arrays. Both get aligned row by
// row (verse-by-verse / line-by-line) rather than as two whole stacked blocks,
// since the source data already keys them that way - a block-level pairing
// was only ever an approximation of that finer alignment.
function renderAlignedRows(unit, left, right, single) {
  const isPsalm = (unit.kind === 'psalm');
  const missingLabel = isPsalm ? '[missing]' : '[not yet sourced]';
  const leftRaw = unit.content ? unit.content[left] : null;
  const rightRaw = single ? leftRaw : (unit.content ? unit.content[right] : null);
  const leftEmpty = !leftRaw || leftRaw.length === 0;
  const rightEmpty = !rightRaw || rightRaw.length === 0;

  if (leftEmpty && rightEmpty) {
    return single
      ? `<tr><td class="single"><em>${missingLabel}</em></td></tr>`
      : `<tr><td class="col-left"><em>${missingLabel}</em></td><td class="col-right"><em>${missingLabel}</em></td></tr>`;
  }

  if (!single) {
    var rows = `<tr><td class="col-left"><div class="unit-label">${left.toUpperCase()}</div></td>` +
                `<td class="col-right"><div class="unit-label">${right.toUpperCase()}</div></td></tr>`;
  } else {
    var rows = '';
  }

  if (isPsalm) {
    const leftMap = new Map((leftRaw || []).map(([n, t]) => [String(n), t]));
    const rightMap = new Map((rightRaw || []).map(([n, t]) => [String(n), t]));
    const nums = Array.from(new Set([...leftMap.keys(), ...rightMap.keys()]))
      .sort((a, b) => parseInt(a, 10) - parseInt(b, 10));
    for (const n of nums) {
      const lt = leftMap.has(n) ? `<span class="vn">${esc(n)}</span> ${esc(leftMap.get(n))}` : '<em>&mdash;</em>';
      if (single) {
        rows += `<tr><td class="single">${lt}</td></tr>`;
      } else {
        const rt = rightMap.has(n) ? `<span class="vn">${esc(n)}</span> ${esc(rightMap.get(n))}` : '<em>&mdash;</em>';
        rows += `<tr><td class="col-left">${lt}</td><td class="col-right">${rt}</td></tr>`;
      }
    }
    return rows;
  }

  // 'lines' kind: aligned by position, not by any shared numbering.
  const maxLen = Math.max(leftRaw ? leftRaw.length : 0, rightRaw ? rightRaw.length : 0);
  for (let i = 0; i < maxLen; i++) {
    const lt = (leftRaw && leftRaw[i] !== undefined) ? esc(leftRaw[i]) : '<em>&mdash;</em>';
    if (single) {
      rows += `<tr><td class="single hymn-line">${lt}</td></tr>`;
    } else {
      const rt = (rightRaw && rightRaw[i] !== undefined) ? esc(rightRaw[i]) : '<em>&mdash;</em>';
      rows += `<tr><td class="col-left hymn-line">${lt}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    }
  }
  return rows;
}

// The hymn block picks WHICH HYMN to sing from that Hour's pool via its own
// dropdown, independent of leftLang/rightLang - these are Latin compositions,
// so the dropdown only ever offers a hymn's own original_language (there's no
// such thing as "this Latin hymn, but sung in Spanish"; a translation is for
// following along, not a second thing to pick). Its DEFAULT ordering favors
// hymns whose original language matches leftLang. rightLang always drives a
// translation of that same hymn, same as everywhere else on the page.
function renderHymnChoiceRows(unit, left, right) {
  const ctx = unit.hour;
  const pool = (DATA.hymn_pools && DATA.hymn_pools[ctx]) || [];
  const opts = pool
    .filter(h => h.lines[h.original_language] && h.lines[h.original_language].length)
    .map(h => ({ id: h.id, lang: h.original_language, title: h.title }));
  if (opts.length === 0) {
    return `<tr><td colspan="2"><em>[not yet sourced]</em></td></tr>`;
  }
  opts.sort((a, b) => (a.lang === left ? 0 : 1) - (b.lang === left ? 0 : 1));

  let choiceId = hymnChoiceByHour[ctx];
  if (!choiceId || !opts.some(o => o.id === choiceId)) {
    choiceId = opts[0].id;
    hymnChoiceByHour[ctx] = choiceId;
  }

  let selectHtml = `<select class="hymn-select" data-hour="${esc(ctx)}">`;
  for (const o of opts) {
    const picked = (o.id === choiceId) ? ' selected' : '';
    selectHtml += `<option value="${esc(o.id)}"${picked}>` +
      `${esc(o.title)} (${esc(LANG_NAMES[o.lang] || o.lang)})</option>`;
  }
  selectHtml += `</select>`;
  let rows = `<tr><td colspan="2" class="hymn-picker">${selectHtml}</td></tr>`;

  const hymn = pool.find(h => h.id === choiceId);
  const sungLines = hymn.lines[hymn.original_language] || [];
  const translatedLines = hymn.lines[right] || [];
  const single = (hymn.original_language === right);

  if (single) {
    for (const line of sungLines) {
      rows += `<tr><td class="single hymn-line">${esc(line)}</td></tr>`;
    }
  } else if (translatedLines.length === 0) {
    sungLines.forEach((line, i) => {
      const rt = (i === 0) ? '<em>[not yet sourced]</em>' : '';
      rows += `<tr><td class="col-left hymn-line">${esc(line)}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    });
  } else {
    const maxLen = Math.max(sungLines.length, translatedLines.length);
    for (let i = 0; i < maxLen; i++) {
      const lt = sungLines[i] !== undefined ? esc(sungLines[i]) : '';
      const rt = translatedLines[i] !== undefined ? esc(translatedLines[i]) : '';
      rows += `<tr><td class="col-left hymn-line">${lt}</td><td class="col-right hymn-line">${rt}</td></tr>`;
    }
  }
  return rows;
}

function onHymnSelectChange(e) {
  const sel = e.target;
  hymnChoiceByHour[sel.dataset.hour] = sel.value;
  render();
}

function render() {
  const dayData = DATA.dates[dateSel.value];
  const left = leftSel.value, right = rightSel.value;
  const hour = hourSel.value;
  const single = (left === right);

  // The heading leads with what's actually being celebrated (a feast/solemnity
  // name, or the full ferial description) - never the bare weekday label alone,
  // since "Feria V" on a major feast day would misleadingly read as "just an
  // ordinary Thursday." The raw calendar date is secondary, shown underneath.
  document.getElementById('dateHeading').innerHTML = dayData.day_description[left] || dayData.day_description.en;
  document.getElementById('metaLine').textContent = (dayData.date_human[left] || dayData.date_human.en);

  const units = dayData.hours[hour] || [];
  const labels = DATA.unit_labels[left] || DATA.unit_labels.en;
  const table = document.getElementById('mainTable');
  let html = '';
  for (const unit of units) {
    let labelText = labels[unit.label] || unit.label;
    if (unit.repeated) labelText += ' ' + (labels.repeated || '');
    if (unit.ref) labelText += ` (${esc(unit.ref)})`;
    html += `<tr><th colspan="2">${esc(labelText)}</th></tr>`;
    if (unit.label === 'psalmody_gap') {
      html += `<tr><td colspan="2"><em>${esc(labels.psalmody_gap_note || labels.missing)}</em></td></tr>`;
    } else if (unit.kind === 'psalm' || unit.kind === 'lines') {
      html += renderAlignedRows(unit, left, right, single);
    } else if (unit.kind === 'hymn_choice') {
      html += renderHymnChoiceRows(unit, left, right);
    } else if (single) {
      html += `<tr><td class="single">${renderUnitContent(unit, left)}</td></tr>`;
    } else {
      html += `<tr><td class="col-left"><div class="unit-label">${left.toUpperCase()}</div>${renderUnitContent(unit, left)}</td>` +
              `<td class="col-right"><div class="unit-label">${right.toUpperCase()}</div>${renderUnitContent(unit, right)}</td></tr>`;
    }
  }
  table.innerHTML = html;
  table.querySelectorAll('.hymn-select').forEach(sel => sel.addEventListener('change', onHymnSelectChange));
}

leftSel.addEventListener('change', render);
rightSel.addEventListener('change', render);
hourSel.addEventListener('change', render);
dateSel.addEventListener('change', render);
render();
</script>
</body></html>
